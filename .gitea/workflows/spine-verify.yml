name: spine-verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  spine-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: verify.engine.run
        run: ./bin/ops cap run verify.engine.run

      - name: spine.verify
        run: ./bin/ops cap run spine.verify
