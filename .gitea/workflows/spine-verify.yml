name: spine-verify

# CI gate referenced by branch_protection.status_check_contexts on main.
# PACKET-1135 landed the workflow on origin/main. PACKET-1145 (this
# commit) fixes the actions/checkout failure by switching to a manual
# clone over the public Tailscale-routable URL (https://git.ronny.works)
# since act_runner spawns job containers on isolated networks where the
# internal `gitea` hostname does not resolve.
#
# Bootstrap discipline: each step explicitly installs only what the
# vanilla ubuntu-latest container lacks. SPINE_ROOT is set to the
# checked-out workspace; SPINE_STATE is set to a workspace-local dir
# so caps that need it have a writable target without relying on
# external NFS / dev-tools-host substrate.
#
# Scope: verify.engine.run only. spine.verify is intentionally NOT
# invoked here because it probes the live estate (SSH to nodes,
# external receipts under /md1400) and cannot run honestly from
# inside an isolated job container — that would require a
# substrate-aware runner image which is a separate slice.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  spine-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap (install python3 + PyYAML + git)
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            python3 python3-yaml git curl ca-certificates >/dev/null
          python3 -V
          git --version

      - name: Checkout (public URL via workflow token)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          rm -rf "${GITHUB_WORKSPACE}"
          mkdir -p "${GITHUB_WORKSPACE}"
          git clone --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@git.ronny.works/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          if [ -n "${GITHUB_SHA:-}" ]; then
            git fetch --depth=1 origin "${GITHUB_SHA}" || true
            git checkout "${GITHUB_SHA}" || true
          fi
          git rev-parse HEAD
          git status --short

      - name: Set up workspace-local SPINE state
        run: |
          set -euo pipefail
          export SPINE_ROOT="${GITHUB_WORKSPACE}"
          export SPINE_STATE="${GITHUB_WORKSPACE}/.spine-state-ci"
          mkdir -p "${SPINE_STATE}/domain-state" \
            "${SPINE_STATE}/controller-prompts" \
            "${SPINE_STATE}/loop-scopes"
          echo "SPINE_ROOT=${SPINE_ROOT}" >> "${GITHUB_ENV}"
          echo "SPINE_STATE=${SPINE_STATE}" >> "${GITHUB_ENV}"
          echo "SPINE_CI=1" >> "${GITHUB_ENV}"
          ls -la "${SPINE_STATE}"

      - name: verify.engine.run
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          ./bin/ops cap run verify.engine.run
