# SERVICE_REGISTRY.yaml - Machine-readable infrastructure truth
# Status: authoritative
# authority_state: authoritative
# authority_concern: service_registry_surfaces
# Last verified: 2026-03-18
# Updated: 2026-03-18
#
# This registry defines WHAT services exist, WHERE they run, and the canonical
# stack/health inputs that generate:
#   - ops/bindings/services.health.yaml
#   - ops/bindings/docker.compose.targets.yaml
# Host identity remains cross-checked against DEVICE_IDENTITY_SSOT.md and
# ssh.targets.yaml, but projection-driving service/host/stack truth lives here.
# Legacy service inventories under $LEGACY_ROOT are historical
# reference only and are non-authoritative for runtime operations.
#
# Scope policy:
#   IN SCOPE:  Shop-hosted services on active authority hosts (purpose-built VMs).
#              Legacy docker-host entries are preserved only as deprecated hold
#              surfaces and are not authoritative for fresh-slate Mint runtime,
#              retained docs, or active operator routing.
#   OUT OF SCOPE: Most home-site services (proxmox-home, download-home, etc.).
#   EXCEPTIONS: A small set of monitoring/decommission compatibility surfaces
#              (home-assistant, pihole-home, vaultwarden-home) plus the canonical
#              media-home active plane are declared here because
#              services.health/docker.compose.targets are generated from this
#              file and drift must fail.
#   Decision: LOOP-HOME-SERVICE-REGISTRY-SCOPE-DECISION-20260210 (2026-02-10).
#
# External ownership:
#   Canonical registry lives in spine; config files live in workbench.
#   This registry defines WHAT services exist and WHERE they run.
#   Compose files and deployment configs are workbench-owned.
#
# Internal dependency policy:
#   Internal-only containers (no published ports, no user traffic) are implicitly
#   covered by their parent stack entry. Examples: authentik-worker, authentik-postgres,
#   authentik-redis (part of caddy-auth stack), infisical-db, infisical-redis (part of
#   secrets stack). These do NOT need individual SERVICE_REGISTRY entries.
#
# Status values:
#   active      — running, serving traffic
#   deprecated  — marked for decommission, may still be running with dependents
#   retired     — tombstoned or historical-only; not expected to run
#   parked      — intentionally stopped (operator decision, not a failure)
#   stopped     — crashed or exited unexpectedly, no health monitoring

