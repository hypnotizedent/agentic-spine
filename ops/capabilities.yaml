  commit.narrator.status:
    description: |
      Read-only commit-class estate narrative witness. Reads recent git commit
      metadata, changed paths, and shortstat; emits direction signals,
      confidence, operator-eye flags, and explicit unread boundaries. Replaces
      manual after-the-fact conversational commit narration as the only
      aggregate signal and demotes raw git spelunking to expert drilldown for
      ordinary narrator status. It may consume node.admission.status and
      site.presence.status as input readbacks, but does not own Site
      Intelligence, decide node admission, gate, close, mutate, or replace
      verify. Use --since <duration> for a time window (compact forms like
      14.days, 7d, 2w, ISO dates, or git-readable strings) and --format
      line|markdown|json (default line; --json is a compat alias for
      --format json) for the agent-facing rollup shape. Use --include-diff
      to add a bounded full-diff body per commit with explicit per-file
      and per-commit size caps and honest skipped-diff disclosure
      (default off; preserves slice-A payload shape when absent). Use
      --evaluate-rules to run the deterministic rule engine over each
      commit (reads committed governance only), populating rule_layer
      with verdict (good_direction | regression_risk | unknown_*),
      citations (source + anchor), and honest unknown when no rule
      applies. Use --write-artifacts to persist each commit row to
      canonical state via commit.narrator.artifact.write. Use
      --from-artifacts to replay rollups from per-commit artifact yamls
      under $SPINE_STATE/domain-state/narrator/per-commit/ instead of
      recomputing classify+rules; missing artifacts produce explicit
      disclosure rows (no silent recompute fallback).
    tags:
      - lifecycle
      - commit
      - narrator
      - witness
      - readback
      - governance
    command: python3 ./ops/plugins/core/lifecycle/bin/commit-narrator-status
    script_path: ./ops/plugins/core/lifecycle/bin/commit-narrator-status
    cwd: $SPINE_CODE
    safety: read-only
    state_authority: read_only_local
    approval: auto
    arg_protocol: argparse
    lifecycle: ready
    outputs:
