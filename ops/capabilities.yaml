    description: |
      Idempotent governed admission of a distinct Gitea agent identity
      (user with prohibit_login=true) for forge_node Stage 2.1
      prerequisite. Smallest canonical primitive: a distinct user object
      whose existence breaks the forge.agent_boundary.status
      "weak_by_access_scarcity" classification (user_count >= 2). Default
      behavior is dry-run; --apply --reason required for mutation.
      Hardcodes prohibit_login=true after creation. Never creates SSH
      keys, never creates access tokens, never deletes, never emits any
      secret value (no password, no token, no key) in stdout or receipt.
      Token / SSH-key admission for this identity are FUTURE slices.
      One of the narrow governed Gitea API mutation caps admitted by
      platform.control.surfaces.yaml gitea.control.governed_api_caps.
      Receipt at $SPINE_STATE/domain-state/forge-node/agent-identity-proof-latest.yaml.
