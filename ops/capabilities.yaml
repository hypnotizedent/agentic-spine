    layer: L1_engine
  verify.engine.smoke.local:
    description: |
      thin_vanilla profile sibling of verify.engine.run (PACKET-1165).
      Runs the local-only subset of engine smoke checks against a
      checked-out spine workspace WITHOUT routing to db_authority and
      WITHOUT touching shared_authority_db, /md1400 NFS, Tailscale, or
      Infisical. Designed to run unmodified on a vanilla Gitea Actions
      runner (ubuntu-latest), enabling product-class CI gates that
      consume thin_vanilla per ops/bindings/cross-repo.authority.yaml
      ci_gate_substrate_profiles.thin_vanilla. Checks (subset of
      verify.engine.run): E1 (bin/ops smoke), E4 (capabilities
      registry parseable), E5 (no dead hot-path entry refs), E6 (no
      dead file refs in governed scripts), E7 (no dead canonical path
      refs in hot contracts), E8 (MANIFEST parity), E13 (cap.sh no
      silent widen-by-fallback). Explicitly OMITS E2, E3, E12, E14,
      E15, E16 — those need shared_authority_db or estate substrate
      and stay on verify.engine.run (heavy_estate). routing.db_authority:
      skip is the load-bearing flag — without it cap.sh would route this
      cap to pve and a vanilla runner would brick the same way
      verify.engine.run does (see PACKET-1145 #1765).
    tags:
      - verify
      - engine
      - thin_vanilla
      - session-start
    command: ./ops/plugins/core/verify/bin/verify-engine-smoke-local
    script_path: ./ops/plugins/core/verify/bin/verify-engine-smoke-local
    cwd: $SPINE_CODE
    safety: read-only
    approval: auto
    arg_protocol: passthrough
    lifecycle: ready
    routing:
      db_authority: skip
    outputs:
      - stdout
    domain: core
    plane: fabric
    layer: L1_engine
  verify.engine.honesty:
    description: End-to-end spine engine orchestration proof using synthetic runtime state — validates capability resolution, dispatch round-trip, wave lifecycle, telemetry chain, continuity invariants, surface coherence, and honest close semantics. Proves the engine OPERATES, not just that its plumbing exists.
    tags:
      - verify
      - engine
      - honesty
    command: ./ops/plugins/core/verify/bin/verify-engine-honesty
