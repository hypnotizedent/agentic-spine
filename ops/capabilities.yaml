    description: |
      Governed per-commit narrator artifact writer (Slice C of v1.5). Writes a
      structured yaml under $SPINE_STATE/domain-state/narrator/per-commit/<sha>.yaml
      with schema_version=1: fact_layer (commit metadata + paths + shortstat +
      optional bounded diff), direction_signal/verdict/confidence/reason/
      operator_eye, touched_surfaces, rule_layer slot (filled by Slice D),
      narrative_layer slot (deferred to v2). Witness-bound: mutation_access is
      scoped to the artifact path it owns; no decision authority over node
      admission, runtime placement, closure, gate authority, or any other
