---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-22
scope: spine-v3-entry-deprecations
version: 1

rules:
  - id: DEP-V3-001
    title: chat-as-workspace rebuild
    severity: high
    action: block
    replacement: "Sanitize the imported text, compile an entry packet, and route through broker/read surfaces instead of rebuilding state in chat."
    match:
      any_substrings:
        - "explain system"
        - "rebuild the system"
        - "start work in chat"
        - "chat-as-workspace"

  - id: DEP-V3-002
    title: prompt-memory-chat regression
    severity: high
    action: block
    replacement: "Do not solve V3 with prompting, memory, or chat workflow upgrades. Move responsibility into node roles, broker access, translator isolation, and attestation."
    match:
      any_substrings:
        - "better prompting"
        - "improve the prompt"
        - "memory"
        - "chat workflow"

  - id: DEP-V3-003
    title: translator authority collapse
    severity: critical
    action: block
    replacement: "Translator owns interpretation only. Execution, verification, git authority, and verdict stay downstream in governed spine roles."
    match:
      any_substrings:
        - "translator decides success"
        - "translator verifies"
        - "translator pushes git"
        - "translator executes"
        - "translator merges"

  - id: DEP-V3-004
    title: direct execution from imported artifacts
    severity: critical
    action: block
    replacement: "Imported chats, notes, and archives are untrusted until sanitized and compiled into an entry packet."
    match:
      any_substrings:
        - "execute this directly"
        - "run this immediately"
        - "just scaffold it"
        - "go ahead and build from these notes"

  - id: DEP-V3-005
    title: split-brain terminal entry ritual
    severity: high
    action: block
    replacement: "One entry surface: ops cap run session.v3.attach. Terminal launch calls it internally. Do not compose session.start + attach manually."
    match:
      any_substrings:
        - "run session.start then session.v3.attach"
        - "start with session.start and then attach"
        - "session.start + session.v3.attach"
        - "manual bootstrap then attach"
        - "run attach first"
        - "run context then status then verify"

  - id: DEP-V3-006
    title: ready-as-entry
    severity: high
    action: block
    replacement: "Entry is session.v3.attach. Health is ops verify (--full for readiness, --preflight for governance). ops ready is a deprecated shim."
    match:
      any_substrings:
        - "start with ops ready"
        - "run ready first"
        - "ops ready as entry"
        - "preflight before anything"
        - "ready then verify then status"
