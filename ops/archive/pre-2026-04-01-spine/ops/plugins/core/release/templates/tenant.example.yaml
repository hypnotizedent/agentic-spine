# Example tenant profile for Agentic Spine
# Copy to fixtures/tenant.sample.yaml and fill in your values.
# Usage: ./bin/ops cap run tenant.profile.validate -- --profile fixtures/tenant.sample.yaml

identity:
  tenant_id: "my-spine"
  owner: "@your-username"
  display_name: "My Agentic Spine"
  created_at: "2026-01-01"

secrets:
  provider: infisical          # or: vault, env
  api_url: "https://your-secrets-provider.example.com"
  project_id: "<YOUR_PROJECT_ID>"
  environment: prod

policy:
  preset: balanced             # options: balanced, strict, permissive

runtime:
  spine_root: "$SPINE_ROOT"
  workbench_root: "$WORKBENCH_ROOT"
  git_remote_primary: origin
  git_remote_mirror: github    # optional: public mirror remote

surfaces:
  agents:
    - claude-code
  slash_commands: true
  mcp_servers:
    - name: spine-rag
      endpoint: "http://localhost:3456"

evidence:
  receipts_enabled: true
  ledger_path: "mailroom/state/ledger.csv"
  session_closeout_sla_hours: 48
