---
schema_version: "1.0"
status: authoritative
owner: "@ronny"
updated_at: "2026-03-24"
scope: operator-boundary
decision_loop_id: LOOP-SPINE-PRODUCTIZATION-20260324

description: >
  Machine-evaluable boundary for the Operator role.
  The Operator is the strategic authority — the human who sets direction,
  defines acceptance criteria, and makes priority decisions. The Operator
  communicates intent; the Translator interprets it; the Controller executes it.

contract: operator.boundary
version: "1.0"

# ── Role Definition ─────────────────────────────────────────────────
role: operator
identity: human
position_in_pathway: origin

allowed_actions:
  - id: direction_setting
    description: "Define objectives, priorities, and strategic intent."
  - id: acceptance_criteria
    description: "Declare what 'done' means for a given scope."
  - id: loop_lifecycle_decisions
    description: "Create, defer, close, or supersede loops."
  - id: priority_arbitration
    description: "Break ties, escalate, or deprioritize work."
  - id: brain_dumps
    description: "Provide unstructured context, domain knowledge, constraints."
  - id: scope_boundaries
    description: "Declare what is in/out of scope for a given effort."
  - id: approval_grants
    description: "Approve manual-approval capabilities, destructive operations."
  - id: feedback_corrections
    description: "Correct Translator misinterpretations or Controller drift."

forbidden_actions:
  - id: direct_execution
    description: >
      Must not bypass the Translator to directly instruct Controller terminals.
      All execution intent flows through the Translator for classification,
      normalization, and context preservation.
    exception: "Emergency hotfix with explicit spine ceremony bypass."
  - id: direct_hotspot_mutation
    description: >
      Must not directly edit shared authority surfaces (operational.gaps.yaml,
      loop scope files, friction queue). Use governed capabilities.
    exception: "None — hotspot mutations always go through Controller."
  - id: success_claims
    description: >
      Must not declare work complete. Closure is a spine-verified state,
      not an operator assertion. The Controller runs verification; the
      Translator renders the result.

# ── Communication Contract ──────────────────────────────────────────
communication:
  emits:
    - type: directive
      format: natural_language
      destination: translator
      description: "Unstructured intent, objectives, constraints."
    - type: feedback
      format: natural_language
      destination: translator
      description: "Corrections, refinements, priority changes."
    - type: approval
      format: explicit_grant
      destination: translator
      description: "Manual approval for gated operations."

  receives:
    - type: status_translation
      format: human_readable
      source: translator
      description: "Rendered results from Controller execution."
    - type: proposal
      format: structured_summary
      source: translator
      description: "Pre-classified options requiring Operator decision."
    - type: friction_alert
      format: structured_summary
      source: translator
      description: "Governance friction requiring Operator attention."

# ── Boundary with Translator ───────────────────────────────────────
translator_interface:
  operator_provides:
    - intent             # what the Operator wants to accomplish
    - constraints        # what must not happen, scope limits
    - priority           # urgency and relative importance
    - domain_context     # knowledge that cannot be derived from code
    - acceptance_criteria # what defines success
  translator_returns:
    - classified_request  # normalized, routed intent
    - status_rendering    # human-readable execution results
    - proposals           # structured options for decision
    - friction_summary    # governance issues needing attention
