status: authoritative
owner: "@ronny"
last_verified: 2026-03-18
scope: workbench-deploy-method-surface-governance
workbench_root: /Users/ronnyworks/code/workbench
deploy_method_contract: ops/bindings/deploy.method.contract.yaml
checks:
  - id: docker_host_not_deployable
    description: deploy.method contract must not declare docker-host as an active deploy surface.
    target: docker-host
    required_absent: true
    enforce: true
  - id: no_direct_docker_lifecycle_for_docker_host
    description: Governed docker-host scripts must not use direct docker start/stop/run lifecycle commands; restore work must stay isolated and ad hoc.
    include_paths:
      - scripts/root/server-startup.sh
      - scripts/root/server-shutdown.sh
    forbidden_patterns:
      - docker start
      - docker stop
      - docker run
    enforce: true
exceptions: []
