# Status: authoritative
# Last verified: 2026-03-08

version: 1
updated_at: "2026-03-08"
owner: "@ronny"
scope: backup-schedule-v1
timezone: "America/New_York"

jobs:
  - id: vm-214-vzdump-daily
    enabled: true
    kind: vm-vzdump
    stack: communications-stack
    host: pve
    schedule_cron: "0 2 * * *"
    schedule_class: daily-primary-est
    inventory_target: vm-214-communications-stack-primary
    vm_lifecycle_backup_target: vm-214-communications-stack-primary
    retention: keep-last=2
    evidence_ref: ops/bindings/backup.inventory.yaml

  - id: mail-archiver-db-pgdump-daily
    enabled: true
    kind: pg-dump
    stack: communications-stack
    host: communications-stack
    schedule_cron: "0 3 * * *"
    schedule_class: daily-primary-est
    container: mail-archiver-db
    database: MailArchiver
    output_dir: /srv/mail-archiver/backups
    file_pattern: mail-archiver-db-<YYYYMMDDTHHMMSSZ>.sql.gz
    retention_days: 7
    note: "Executed by /etc/cron.d/communications-backups calling /usr/local/bin/mail-archiver-backup.sh as root (single script handles pg_dump + uploads + offsite verification)."

  - id: mail-archiver-uploads-snapshot-daily
    enabled: true
    kind: filesystem-tar
    stack: communications-stack
    host: communications-stack
    schedule_cron: "0 3 * * *"
    schedule_class: daily-primary-est
    source_dir: /srv/mail-archiver/uploads
    output_dir: /srv/mail-archiver/backups
    file_pattern: mail-archiver-uploads-<YYYYMMDDTHHMMSSZ>.tar.gz
    retention_days: 7
    note: "Executed by the same /etc/cron.d/communications-backups root job via /usr/local/bin/mail-archiver-backup.sh."

  - id: mail-archiver-restore-drill-monthly
    enabled: true
    kind: restore-drill
    stack: communications-stack
    host: communications-stack
    schedule_cron: "0 4 1 * *"
    schedule_class: monthly-drill-est
    procedure_ref: ops/bindings/mail.archiver.backup.contract.yaml
    dry_run: true

  - id: archive-smb-zfs-snapshot-daily
    enabled: true
    kind: zfs-snapshot
    stack: backup
    host: pve
    schedule_cron: "5 1 * * *"
    schedule_class: daily-primary-est
    script_ref: /usr/local/bin/archive-smb-snapshot
    retention_days: 14
    note: "Cron-managed on pve via /etc/cron.d/archive-smb-snapshot; protects md1400/ronny-projects and md1400/mint-legacy."

  - id: n8n-workflows-cold-sync-daily
    enabled: true
    kind: filesystem-tar
    stack: automation-stack
    host: automation-stack
    schedule_cron: "15 3 * * *"
    schedule_class: daily-config-est
    script_ref: /usr/local/bin/n8n-workflows-backup.sh
    retention_days: 14
    inventory_targets:
      - app-n8n-workflows
    note: "Runs after the local n8n snapshot export and syncs the latest workflow archive to md1400."

  - id: media-config-download-stack-cold-sync-daily
    enabled: true
    kind: filesystem-tar
    stack: download-stack
    host: download-stack
    schedule_cron: "10 4 * * *"
    schedule_class: daily-config-est
    script_ref: /usr/local/bin/media-config-backup.sh
    retention_days: 14
    inventory_targets:
      - app-media-config-download-stack
    note: "Root-owned host job. Archives config-state only and syncs the latest download-stack artifact to md1400."

  - id: media-config-streaming-stack-cold-sync-daily
    enabled: true
    kind: filesystem-tar
    stack: streaming-stack
    host: streaming-stack
    schedule_cron: "20 4 * * *"
    schedule_class: daily-config-est
    script_ref: /usr/local/bin/media-config-backup.sh
    retention_days: 14
    inventory_targets:
      - app-media-config-streaming-stack
    note: "Root-owned host job. Archives config-state only and syncs the latest streaming-stack artifact to md1400."

  - id: pve-vzdump-md1400-cold-sync-daily
    enabled: true
    kind: artifact-sync
    stack: backup
    host: pve
    schedule_cron: "30 8 * * *"
    schedule_class: daily-primary-est
    script_ref: /usr/local/bin/vzdump-md1400-cold-sync.sh
    retention_days: 2
    note: "Promotes latest successful pve vzdump artifacts from tank-backups into the md1400 canonical cold plane. Runtime should execute at low IO priority (ionice/nice)."

  - id: home-vzdump-md1400-cold-sync-daily
    enabled: true
    kind: artifact-sync
    stack: backup
    host: pve
    schedule_cron: "30 5 * * *"
    schedule_class: daily-primary-est
    script_ref: /usr/local/bin/home-vzdump-md1400-pull.sh
    retention_days: 3
    inventory_targets:
      - home-vm-100-ha-primary
      - home-lxc-105-pihole-primary
    note: "Runs on pve and pulls the latest proxmox-home HA and Pi-hole vzdump artifacts into the md1400 canonical cold plane."

  - id: backup-monitor-hourly
    enabled: true
    kind: health-monitor
    stack: backup
    host: spine-control
    schedule_cron: "15 * * * *"
    schedule_class: hourly-monitor-est
    capability_ref: backup.monitor
    alert_on_degraded: true

  - id: media-config-restore-drill-monthly
    enabled: true
    kind: restore-drill
    stack: media-stack
    host: download-stack
    schedule_cron: "30 4 1 * *"
    schedule_class: monthly-drill-est
    procedure_ref: ops/plugins/media/bin/media-backup-restore
    dry_run: true
    restore_class: media-config-dry-run-monthly

  - id: infisical-restore-drill-quarterly
    enabled: true
    kind: restore-drill
    stack: infra-core
    host: infra-core
    schedule_cron: "0 5 1 */3 *"
    schedule_class: quarterly-drill-est
    procedure_ref: docs/governance/INFISICAL_RESTORE_DRILL.md
    dry_run: true
    restore_class: tier1-small-state-dry-run-quarterly

references:
  contracts:
    - ops/bindings/backup.inventory.yaml
    - ops/bindings/vm.lifecycle.yaml
    - ops/bindings/mail.archiver.backup.contract.yaml
  closes_gaps:
    - GAP-OP-924
