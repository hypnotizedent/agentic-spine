  discovered_by: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  discovered_at: '2026-03-23'
  type: missing-entry
  classification: missing-entry
  doc: ops/plugins/infra/mcp-gateway/bin/spine-mcp-serve
  description: 'Thin-client parity is incomplete across remote chat surfaces.


    Broker read endpoints and attestation now exist, but not every remote surface
    consumes them through one canonical thin-client bridge. Some sessions still depend
    on remembered context, old launcher state, or repointing/restart steps rather
    than a single boring broker-backed truth path.


    The MCP or bridge runtime needs to be fully aligned so new remote chats resolve
    loop state, progress, and attestation from the same broker truth as desktop.

    '
