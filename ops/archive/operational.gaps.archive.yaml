- id: GAP-OP-1591
  title: Translator authority is documented but not enforced as a governed control-plane
    contract.
  discovered_by: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  discovered_at: '2026-03-23'
  type: missing-entry
  classification: missing-entry
  doc: docs/governance/SPINE_V3_BOOTSTRAP.md
  description: 'Translator authority is documented but not enforced as a governed
    control-plane contract.


    The bootstrap now says the translator should own interpretation but never final
    truth, execution, verification, or git authority. That role boundary is conceptually
    clear, yet there is not a first-class contract or gate that enforces translator
    isolation the way closeout and wave paths now enforce their rules.


    V3 still needs a concrete translator authority contract and runtime enforcement
    point so membrane behavior cannot silently reacquire downstream powers.

    '
  severity: medium
  status: fixed
  notes: Filed via gaps.file at 2026-03-23T03:18:19Z
  parent_loop: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
