  doc: ops/bindings/operator.storage.surface.contract.yaml
  description: 'Operator-visible storage surfaces are now normalized under one contract,
    and both Mint operator-drop and archive family intake have governed mountless
    assisted-move surfaces.

    Those per-surface assists are business-safe because their write paths are mountless,
