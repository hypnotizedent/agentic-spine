- id: GAP-OP-1586
  title: Forge lifecycle is not canonical in Spine V3.
  discovered_by: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  discovered_at: '2026-03-23'
  type: missing-entry
  classification: missing-entry
  doc: ops/capabilities.yaml
  description: 'Forge lifecycle is not canonical in Spine V3.


    Shared truth exposes repo and broker state, but there is still no governed forge
    lifecycle surface for pull request visibility and disposition. Agents can query
    git remotes and local branches, yet cannot ask the system for the live PR list,
    PR status, or close/supersede a Gitea PR through a broker-visible capability path.


    This leaves PR objects outside the V3 control plane and forces terminals back
    to manual forge/UI/API handling. The missing canonical surfaces are the Gitea
    broker/read and lifecycle capabilities needed to query and disposition PR state
    as system truth.

    '
  severity: high
  status: fixed
  notes: Governed Gitea PR list/status/close capability surfaces landed; platform
    control surface now advertises capability-backed PR lifecycle and live list/status
    plus governed close dry-run proof passed.
  parent_loop: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  fixed_in: 5cedf09b
  closed_at: '2026-03-23T21:43:04Z'
  regression_lock_id: ops/plugins/providers/tests/test-gitea-pr-lifecycle.sh
