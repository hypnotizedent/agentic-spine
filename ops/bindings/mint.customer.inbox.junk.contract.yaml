---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mint-customer-inbox-junk
version: 1

surface:
  capability: mint.customer.inbox.junk
  operator_terminal: MINT-MORPHEUS-01
  description: Move a supplier-marketing or risky message out of the Mint customer lane into the governed recoverable mailbox folder.

storage:
  records_root: "$SPINE_STATE/mint/customer-junk-actions/records"
  index_file: "$SPINE_STATE/mint/customer-junk-actions/index.ndjson"
  lock_file: "$SPINE_STATE/locks/mint-customer-junk-actions.lock"

workflow:
  source_get_capability: microsoft.mail.get
  move_capability: microsoft.mail.move
  default_destination_folder: Junk Email
  allowed_default_classes:
    - supplier_marketing
    - risky_junk
  recoverable_folders:
    supplier_marketing: Supplier Marketing
    risky_junk: Junk Email

notes:
  - Default behavior refuses to junk messages that do not classify as promotional/risky unless the operator passes an explicit force override.
  - Keep the operator-safe no-link-opening path by classifying from sender, subject, and governed message text only.
