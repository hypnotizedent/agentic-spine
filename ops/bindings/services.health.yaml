lifecycle_bindings:
- host: immich
  source_registry: ops/bindings/service.data.lifecycle.registry.yaml
  services:
  - service_id: immich
    display_name: Immich
    criticality: tier1
    canonical_live_roots:
    - immich:/mnt/pve-immich-upload (Canonical active imported-asset surface from
      UPLOAD_LOCATION on VM 203.)
    - immich:/tank/immich/db (Canonical guest-local PostgreSQL data root on VM 203.)
    staging_roots: []
    quarantine_roots:
    - pve:/tank/immich/photos (Legacy external-library residue proven not imported
      into the active Immich database.)
    - nas:/volume1/im2ch (Derivative-only legacy Immich residue pending verification
      then tombstone; not canonical home personal data.)
    export_archive_lanes:
    - immich:/home/ronny/backups (Daily pg_dump export lane.)
    retention_policy:
      policy_type: mixed_state
      claim_days: null
      db_dump_days: 7
      description: The active imported asset lane is /mnt/pve-immich-upload backed
        by pve:/tank/immich/uploads-vm203. /tank/immich/photos remains orphaned residue,
        not canonical imported state.
    capacity_model:
      mode: advisory
      type: split_root_watch
      source_ref: ops/bindings/infra.storage.placement.policy.yaml
      description: Immich now has a known active imported asset lane plus explicit
        residue roots. The goal is to prevent future silent root sprawl.
- host: media-home
  source_registry: ops/bindings/service.data.lifecycle.registry.yaml
  services:
  - service_id: media
    display_name: Media
    criticality: tier1
    canonical_live_roots:
    - nas:/volume1/media-staging (Canonical active media library and intake share
      for the home plane.)
    staging_roots:
    - nas:/volume1/media-staging/downloads (Active home intake/download lane. Must
      drain after import and must never become a permanent residence.)
    - media-home:/srv/media/downloads (Compatibility alias for the active home intake/download
      lane. Must drain after import and must never become a permanent residence.)
    quarantine_roots:
    - pve:/md1400/archive/media-quarantine/pending (Operator review queue for unresolved
      media.)
    - pve:/md1400/archive/media-quarantine/reviewed (Reviewed hold lane awaiting archive
      or delete.)
    export_archive_lanes:
    - pve:/md1400/archive/media (Canonical cold archive root for media family payloads;
      per-family placement remains /movies, /tv, /music under this root.)
    - nas:/volume1/backups/apps/media-config (Canonical primary config backup archive
      for the combined media-home plane.)
    - pve:/md1400/backups/configs/media-config (Secondary/offsite cold copy lane for
      the combined media-home config archive on the restore-intent configs plane.)
    retention_policy:
      policy_type: bounded_stage_windows
      claim_days: null
      downloads_max_age_days: 7
      quarantine_pending_max_age_days: 30
      quarantine_reviewed_max_age_days: 90
      description: Payload libraries are canonical live state, not a rolling retention
        bucket. Downloads and quarantine are explicitly time-boxed.
    capacity_model:
      mode: advisory
      type: dataset_pressure_watch
      source_ref: /Users/ronnyworks/code/projects/media/bindings/home.media.pressure.authority.yaml
      description: The canonical media capacity watch is now home-first. This registry
        captures honest drain/expiry intent against the active Synology-backed home
        plane.
- host: surveillance-stack
  source_registry: ops/bindings/service.data.lifecycle.registry.yaml
  services:
  - service_id: surveillance
    display_name: Surveillance
    criticality: tier3
    canonical_live_roots:
    - surveillance-stack:/srv/config/surveillance (Canonical live compose/config authority.
      Config-only backup lands under pve:/md1400/backups/configs/surveillance.)
    - surveillance-stack:/srv/data/surveillance (Empty VM media/cache skeleton in
      the NVR-first posture; not business-record backup authority.)
    - surveillance-stack:/srv/runtime/surveillance (Canonical runtime cache surface
      for tmpfs-backed transient state.)
    staging_roots: []
    quarantine_roots: []
    export_archive_lanes:
    - surveillance-stack:/srv/data/surveillance/clips/export (Hot manual incident-evidence
      export lane pending operator archive move.)
    - pve:/md1400/archive/surveillance-exports (Cold archive lane for exported surveillance
      evidence; offsite coverage comes from the existing md1400 backup program.)
    retention_policy:
      policy_type: nvr_cyclic_external
      claim_days: null
      clips_days: null
      snapshots_days: null
      description: 'NVR-first low-compute posture (2026-05-05): VM retention claims
        are zero because the VM does not record. Hikvision NVR owns footage retention;
        VM config recovery is handled by app-surveillance-config.'
    capacity_model:
      mode: not_applicable
      type: nvr_owned_footage_config_only
      source_ref: project:surveillance/contracts/surveillance.contract.yaml
      description: Capacity honesty for VM rolling footage is not applicable in the
        current posture. Hikvision NVR owns footage retention; VM 215 keeps only config,
        runtime cache, and manual export staging.
