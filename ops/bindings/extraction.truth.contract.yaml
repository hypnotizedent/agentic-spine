---
status: authoritative
owner: "@ronny"
last_verified: 2026-04-05
scope: extraction-truth-classification
version: 1.0

# Extraction Truth Contract
# Governs the machine-enforced classification of shared infrastructure vs product runtime.
# This contract answers: "is this shared platform infrastructure or product runtime?"

taxonomy:
  L1_engine:
    description: "Governed execution framework (execute, verify, govern, route, receipt, attestation, loop control)"
    extraction_class: platform_engine
    multi_tenant_reuse: required
    examples:
      - spine execution primitives
      - verify surfaces
      - loop/gap orchestration
      - aof governance

  L2_shared_infrastructure:
    description: "Normalized shared substrate inherited by all products (identity, reachability, secrets, backup, communications)"
    extraction_class: shared_infrastructure
    multi_tenant_reuse: required
    examples:
      - secrets management
      - network/ingress policy
      - backup substrate
      - shared communications rails
      - observability stack

  L3_product_runtime:
    description: "Product-specific business logic and automation unique to one governed runtime"
    extraction_class: product_runtime
    multi_tenant_reuse: optional
    examples:
      - Mint business flows
      - Home Assistant runtime
      - media workflows
      - finance workflows
      - tax-legal workflows

classification_rules:
  - rule_id: R1
    name: "domain_layer_parity"
    description: "Domain classification in gate.execution.topology.yaml is authoritative for all capabilities in that domain"
    enforcement: D426

  - rule_id: R2
    name: "service_follows_domain"
    description: "Services inherit extraction layer from their owning domain unless explicitly overridden"
    enforcement: future
    status: deferred
    note: "Deferred until node-placement program requires it. Advisory heuristic mapping sufficient for current single-operator use."

  - rule_id: R3
    name: "vm_hosts_declared_layer"
    description: "VMs declare their hosting layer based on the services they run"
    enforcement: future
    status: deferred
    note: "Deferred until multi-node workload placement program requires it."

  - rule_id: R4
    name: "no_mixed_hosting_without_governance"
    description: "VMs cannot host both L2 and L3 services without explicit multi-layer hosting approval"
    enforcement: future
    status: deferred
    note: "Deferred with R3. Mixed hosting observation is useful for planning but not enforced."

  - rule_id: R5
    name: "domain_none_explicit_layer"
    description: "All domain=none capabilities must explicitly declare layer"
    enforcement: D426

surfaces_in_scope:
  capabilities:
    authority_file: ops/capabilities.yaml
    projection_file: ops/bindings/capability_map.yaml
    classification_field: layer
    classification_scope: domain=none only
    current_state: implemented
    enforcement: D426, D428

  domains:
    authority_file: ops/bindings/gate.execution.topology.yaml
    classification_field: domain_metadata[].layer
    classification_scope: all domains
    current_state: implemented
    enforcement: D428

surfaces_out_of_scope:
  services:
    rationale: "Service extraction truth is deferred until there is a real node-placement program that requires it. Current advisory heuristic mapping is sufficient for observation."
    future_authority_file: docs/governance/SERVICE_REGISTRY.yaml
    future_classification_field: domain
    future_classification_method: explicit_domain_field_with_inherited_layer

  vms:
    rationale: "VM hosting layer is deferred until there is a real multi-node workload placement program. Current single-operator infrastructure does not require machine-enforced VM layer classification."
    future_authority_file: ops/bindings/vm.lifecycle.yaml
    future_classification_field: hosting_layer
    future_classification_method: explicit_field_or_derive_from_services

extraction_truth_query:
  capability_layer:
    method: "ops/plugins/core/verify/bin/extraction-layer-query --capability CAPABILITY_ID"
    direct_query: "yq '.capabilities[CAPABILITY_ID].layer' ops/capabilities.yaml"
    fallback: "yq '.domain_metadata[] | select(.domain_id == DOMAIN) | .layer' ops/bindings/gate.execution.topology.yaml"

  domain_layer:
    method: "ops/plugins/core/verify/bin/extraction-layer-query --domain DOMAIN_ID"
    direct_query: "yq '.domain_metadata[] | select(.domain_id == DOMAIN_ID) | .layer' ops/bindings/gate.execution.topology.yaml"

  service_layer:
    status: not_implemented
    note: "Service extraction deferred until node-placement program requires it"

  vm_layer:
    status: not_implemented
    note: "VM hosting layer deferred until multi-node workload placement program requires it"

implementation_status:
  phase_1_complete:
    - domain-level layer classification in gate.execution.topology.yaml
    - capability-level layer classification for domain=none
    - D426 gate validation

  current_scope_implemented:
    - domain-level layer classification in gate.execution.topology.yaml (20 domains)
    - capability-level layer classification for domain=none (62 capabilities)
    - D426 capability layer lock
    - D428 domain + capability extraction parity
    - extraction.truth.contract.yaml (this file, narrow scope)
    - extraction-layer-query tool (domains and capabilities only)

  explicitly_deferred:
    - service-level extraction enforcement (no real node-placement program yet)
    - vm-level hosting layer enforcement (no multi-node workload placement yet)
    - service/VM schema expansion in SERVICE_REGISTRY.yaml and vm.lifecycle.yaml

  future_if_needed:
    - multi-node extraction-aware dispatch
    - tenant-portable extraction boundaries
    - workload placement policy enforcement
    - service and VM extraction truth (only if node-placement program emerges)

verification_surfaces:
  - gate_id: D426
    scope: "capability layer classification lock"
    status: active
    path: surfaces/verify/d426-capability-layer-classification-lock.sh

  - gate_id: D428
    scope: "extraction truth parity (domain + capability layers only)"
    status: active
    path: surfaces/verify/d428-extraction-truth-parity.sh
    note: "Service and VM extraction explicitly deferred until node-placement program requires it"

decision_framework:
  shared_infrastructure_test:
    question: "Would multiple product runtimes have to reinvent this primitive if it didn't exist as shared infrastructure?"
    yes_classification: L2_shared_infrastructure
    no_classification: L3_product_runtime

  engine_test:
    question: "Would removing this capability break governed execute, verify, receipt, routing, or control-plane self-observation even if no product runtimes were active?"
    yes_classification: L1_engine
    no_classification: check_shared_infrastructure_test

  product_runtime_test:
    question: "Would removing this capability affect only one product or workload family?"
    yes_classification: L3_product_runtime
    no_classification: L2_shared_infrastructure

known_edge_cases:
  communications:
    layer_hint: L3_product_runtime
    rationale: "Communications domain straddles L2/L3. Shared alerts/delivery rails lean L2, but product-specific mail/archive behavior is L3. Current classification: L3 with understanding that extraction may occur."

  microsoft:
    layer_hint: L2_shared_infrastructure
    rationale: "Provider surface for shared calendar/mail primitives consumed by multiple products"

  n8n:
    layer_hint: L3_product_runtime
    rationale: "Automation runtime that orchestrates multi-domain workflows. May be L2 in future if it becomes shared automation substrate."

related_contracts:
  - contract: docs/governance/PLATFORM_LAYER_MODEL.md
    relationship: "Narrative authority for layer philosophy and decision tests"
  - contract: ops/bindings/gate.execution.topology.yaml
    relationship: "Domain-level layer classification authority"
  - contract: ops/capabilities.yaml
    relationship: "Capability-level layer classification for domain=none"
  - contract: ops/bindings/node.role.contract.yaml
    relationship: "Physical node roles (orthogonal to extraction classification)"
