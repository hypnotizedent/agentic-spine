---
status: authoritative
owner: "@ronny"
last_verified: 2026-02-28
scope: mailroom-bridge-endpoints
version: 1
updated_at: "2026-02-15"
authority_scope:
  owns:
    - bridge_endpoint_urls
    - endpoint_exposure_policy
    - public_https_retirement_state
  does_not_decide:
    - autonomous_worker_runtime_semantics
    - route_target_taxonomy
    - public_operator_language
  canonical_worker_contract: ops/bindings/mailroom.task.worker.contract.yaml
  note: >
    Endpoint reachability is bridge exposure truth only. It does not make the
    mailroom bridge public operator grammar and does not decide execution pickup
    behavior.
endpoints:
  localhost:
    url: "http://127.0.0.1:8799"
    health_path: "/health"
    mode: local
  tailnet_http:
    url: "http://macbook.taile9480.ts.net"
    health_path: "/health"
    mode: tailnet
  public_https:
    lifecycle_state: retired
    url: null
    former_url: "https://spine.ronny.works"
    health_path: "/health"
    mode: public
    retired_at: "2026-04-28"
    retired_reason: >
      spine.ronny.works is now the human operator cockpit URL. The mailroom
      bridge no longer owns that public hostname. If public machine/RPC access
      is needed again, assign a distinct bridge hostname and route.
policy:
  remote_preference:
    - tailnet_http
  public_https_required_for_hosted_runtime: false
  require_https_for_public: true
security:
  auth_required_non_health: true
  supported_headers:
    - "Authorization: Bearer <token>"
    - "X-Spine-Token: <token>"
    - "CF-Access-Client-Id: <service-token-id>"
    - "CF-Access-Client-Secret: <service-token-secret>"
    - "Cf-Access-Jwt-Assertion: <jwt> (injected by Cloudflare)"
  description:
    - "Bridge server remains localhost-bound; exposure is via proxy/tunnel only."
    - "Public endpoint must preserve token auth and not bypass bridge allowlists."
