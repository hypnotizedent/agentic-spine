---
status: authoritative
owner: "@ronny"
updated_at: "2026-03-25"
scope: entry-gate-bypass
authority: ops/bindings/entry.surface.contract.yaml

description: >
  Capabilities that may execute without a prior session.v3.attach.
  This is the minimal set of pre-session diagnostic and bootstrap
  capabilities. All other capabilities require an active entry packet.
  Defend every addition — the bypass list must stay small.

entry_gate_bypass:
  version: 1
  capabilities:
    # Bootstrap — must work to establish a session
    - session.v3.attach
    - session.start
    - session.role.override
    - aof.contract.acknowledge
    # Diagnostics — needed to debug before attach works
    - spine.status
    - spine.doctor
    # Verification — gates must run independently of session state
    - spine.verify
    - verify.fast
    - verify.core.run
    - verify.run
    - verify.pack.run
    - verify.pack.list
    - verify.drift_gates.certify
