status: authoritative
owner: "@ronny"
last_verified: 2026-03-28
scope: root-authority-taxonomy
version: 1
updated_at: "2026-03-28"

related_contracts:
  - contract: ops/bindings/node.role.contract.yaml
    relationship: "Physical-node authority is subordinate to this path taxonomy for state, evidence, and mailroom locality."

# Root Authority Contract
# Establishes the canonical root taxonomy for the spine platform.
# Defines the authoritative path hierarchy, tool-adapter policy,
# and residue classification for competing roots.

taxonomy:
  host_path_resolution:
    rule: >
      Path taxonomy precedence — primary canonical first, host installation
      defaults second. Post-D.3b v4 cutover (commit ec1a88a2 + 1a183696),
      pve as delivered storage_evidence_node holds primary canonical for
      state/evidence/mailroom/receipts/archive roots. Darwin paths under
      /Users/ronnyworks are operator-workstation install defaults — never
      canonical write target for spine state. Linux execution hosts other
      than the storage_evidence_node resolve runtime paths from their
      host-local /etc/spine/execution-host.env (e.g., ai-cons), which itself
      points back at the canonical storage_evidence_node where appropriate.
    primary_canonical_source: ops/bindings/node.role.contract.yaml#storage_evidence_node.promotion_standard.current_delivered_host
    linux_execution_host_env_file: /etc/spine/execution-host.env
    linux_policy: "host-local env file wins over darwin defaults; storage_evidence_node canonical wins over both"

  storage_evidence_node_canonical:
    delivered_host: pve
    delivered_proof_refs:
      dataset_substrate_proof: $SPINE_STATE/domain-state/storage-evidence-node/pve-dataset-substrate-proof-20260502.yaml
      canonical_root_export_proof: $SPINE_STATE/domain-state/storage-evidence-node/pve-canonical-root-export-proof-20260502.yaml
      authority_transfer_proof: $SPINE_STATE/domain-state/storage-evidence-node/pve-authority-transfer-proof-20260502.yaml
      recovery_drill_proof: $SPINE_STATE/domain-state/storage-evidence-node/pve-recovery-drill-proof-20260502.yaml
    primary_canonical_root: /md1400/spine
    primary_canonical_subpaths:
      state: /md1400/spine/state
      shared_authority_db: /md1400/spine/state/shared_authority.db
      evidence: /md1400/spine/evidence
      receipts: /md1400/spine/receipts
      mailroom: /md1400/spine/mailroom
      runtime: /md1400/spine/runtime
      archive: /md1400/spine/archive
    reach_mechanism: |
      Consumers reach this canonical root via two patterns:
      1. cap.sh routing for DB-backed and mutating caps (D.3a + D.3c + PACKET-582)
      2. NFS exports for cold artifact reads (Phase D.2; verified PACKET-584)
      MacBook reaches via cap-routing primarily (no NFS mount today, by choice).
      ai-cons reaches via NFS mount + cap-routing.
      pve-r620 reaches via NFS read-only mount (watcher posture).
    role: canonical_state_evidence_authority
    policy: writes_for_state_evidence_mailroom_receipts_archive_land_here_via_routing_or_nfs
    darwin_paths_relationship: |
      Pre-D.3b v4, paths under /Users/ronnyworks/code/.runtime/spine and
      /Users/ronnyworks/code/.evidence/spine were canonical authority for the
      operator console. Post-cutover, those paths are operator-workstation
      install defaults only — never canonical write target for spine state.
      MacBook local DB at the canonical path was renamed to
      shared_authority.divergent-pre-d3b-v4-* during cutover (ZFS snapshot
      preserves pre-cutover state on pve as canonical reversibility).
    file_plane_policy:
      rule: >
        State files under $SPINE_STATE/domain-state/ on consumer hosts
        (MacBook, ai-cons, pve-r620) are projection/cache only. Canonical
        state files live at /md1400/spine/state/domain-state/ on pve.
        Caps that emit state files — recovery drill receipts, OI realization
        receipts, watcher cycle receipts, storage-evidence proof receipts,
        and similar YAML/Markdown artifacts written under domain-state/ —
        must execute on the storage_evidence_node so the artifact lands at
        the canonical path. cap.sh routing already carries mutating caps and
        DB-backed read-only caps annotated with state_authority. Caps that
        write to domain-state/ from a consumer host produce projection/cache
        artifacts only; those artifacts must not be relied on as authority
        by readbacks or verify gates.
      reach_mechanism:
        - cap.sh routes mutating caps to pve (since D.3b v4 cutover 2026-05-02T21:43Z)
        - cap.sh routes DB-backed read-only caps annotated with state_authority: shared_authority_db
        - non-DB state-file-emitting caps reach the canonical path either by
          running on pve via the mutating routing path, or (when NFS mounted)
          writing through the canonical mount; running locally on a consumer
          and emitting under $SPINE_STATE/domain-state/ produces a non-authority
          projection only
      consumer_local_disposition: |
        Files at $SPINE_STATE/domain-state/* on consumer hosts are not
        authority. Readbacks (e.g., node.admission.status) that consume a
        receipt path must read from the canonical pve location to be honest.
        A consumer host holding a stale or pre-cutover local copy of a
        receipt class does not establish authority truth.
      pre_cutover_residue: |
        Before D.3b v4 cutover (2026-05-02T21:43:00Z), consumer-local writes
        to $SPINE_STATE/domain-state/ were canonical. Receipts from before
        that timestamp may exist locally without a canonical pve copy.
        Migration of those receipts is opportunistic — the next governed
        re-run of the same cap via cap.sh routing writes the canonical
        version on pve and supersedes the local copy. The specimen
        disaster.drill.execution_pickup latest.yaml is regenerated on pve
        canonical at PACKET-590 closeout via routed cap re-run.
      enforcement: |
        Readbacks that consume $SPINE_STATE/domain-state/* paths must
        resolve those paths from the canonical pve location when running on
        pve (via cap.sh routing or local execution on the authority host).
        When a consumer-local copy and the canonical pve copy disagree, the
        canonical pve copy wins. node.admission.status running on pve
        correctly reports recovery_drill_proof as missing if the receipt is
        not yet present at /md1400/spine/state/domain-state/recovery-drills/
        execution-pickup/latest.yaml; the cure is to re-run the drill via
        cap.sh routing, not to copy the consumer-local file.
      state_home_approval:
        rule: >
          Governed terminals and mutating/destructive capabilities may not
          create new top-level $SPINE_STATE homes or new
          $SPINE_STATE/domain-state/<home> roots unless the human steward has
          approved the home by adding it to this contract in the same slice.
          A directory created outside the approved set is drift, not a new
          canonical surface.
        approval_authority: human_steward
        approval_mechanism: "add the home to approved_top_level_homes or approved_domain_state_homes in this contract with the slice that needs it"
        enforced_by:
          governed_cap_path: ops/commands/cap.sh#state_home_approval_guard
          verify_gate: surfaces/verify/d423-runtime-path-pollution-lock.sh
        approved_top_level_homes:
          - agent-artifacts
          - agent-tasks
          - archive
          - controller-prompts
          - delegations
          - domain-state
          - handoffs
          - loop-scopes
          - operator-surface
          - orchestration
          - plans
          - projections
          - quarantine
          - rag-direct
          - telemetry
          - terminal-heartbeats
          - terminals
        approved_domain_state_homes:
          - ai-patch-reviews
          - engine-loop-lifecycle
          - forge-node
          - host-code-deploy
          - mint
          - narrator
          - recovery-drills
          - site-intelligence
          - storage-evidence-node
        retired_domain_state_homes:
          - spine

  home:
    path: /Users/ronnyworks
    default_scope: darwin_only_default
    role: adapter_and_install_target_only
    policy: never_canonical_machine_truth
    note: >
      Home directory is the install target for tool adapters (Claude config,
      Codex skills, Hammerspoon, brew, etc). It is never the source of truth
      for spine state, evidence, or runtime.

  platform:
    path: /Users/ronnyworks/code
    default_scope: darwin_only_default
    role: single_platform_root
    policy: only_versioned_repos_and_governed_runtime
    note: >
      Versioned repos and MacBook-local install defaults for runtime,
      worktrees, and evidence projection/cache live under this root. Canonical
      state/evidence/mailroom/receipts/archive authority lives on the delivered
      storage_evidence_node at /md1400/spine. No repo, install-default, or
      projection surface may be rooted outside this path without an explicit
      contract.

  runtime:
    path: /Users/ronnyworks/code/.runtime/spine
    default_scope: darwin_install_default
    role: operator_workstation_install_default
    primary_canonical_authority: storage_evidence_node_canonical.primary_canonical_subpaths.runtime
    subpaths:
      state: /Users/ronnyworks/code/.runtime/spine/state
      mailroom: /Users/ronnyworks/code/.runtime/spine/mailroom
      locks: /Users/ronnyworks/code/.runtime/spine/locks
      logs: /Users/ronnyworks/code/.runtime/spine/logs
      tmp: /Users/ronnyworks/code/.runtime/spine/tmp
    note: >
      Pre-D.3b v4, this was canonical_runtime_state. Post-cutover, this is the
      operator-workstation install default — local cache for cap output paths,
      worktree provisioning, etc. The canonical runtime state root for the
      spine lane is now /md1400/spine/state on pve (the delivered
      storage_evidence_node). Mutating writes route via cap.sh; reads of
      DB-backed authority route too. This subpath block defines where
      MacBook-local install artifacts live; it is no longer canonical for
      governed state.

  evidence:
    path: /Users/ronnyworks/code/.evidence/spine
    default_scope: darwin_install_default
    role: operator_workstation_install_default
    primary_canonical_authority: storage_evidence_node_canonical.primary_canonical_subpaths.evidence
    subpaths:
      sessions: /Users/ronnyworks/code/.evidence/spine/sessions
      verify: /Users/ronnyworks/code/.evidence/spine/verify
      reports: /Users/ronnyworks/code/.evidence/spine/reports
      cap_runs: /Users/ronnyworks/code/.evidence/spine/cap-runs
    note: >
      Pre-D.3b v4, this was canonical_evidence_trail. Post-cutover, the
      canonical evidence trail is at /md1400/spine/evidence on pve. Caps
      routed via cap.sh write receipts directly to /md1400/spine/evidence/sessions/.
      Receipts written by non-routed local tooling on MacBook still land here
      as operator-workstation install default.

  worktrees:
    path: /Users/ronnyworks/code/.runtime/spine/tmp/worktrees
    default_scope: darwin_only_default
    role: canonical_worktree_root
    layout: "<root>/agentic-spine/<WAVE_ID>"
    note: >
      All managed worktrees are provisioned under this root.
      Source contract: ops/bindings/worktree.lifecycle.contract.yaml.

  repos:
    path: /Users/ronnyworks/code/*
    default_scope: darwin_only_default
    role: versioned_repos_only
    note: >
      Only versioned git repos live directly under the platform root.
      Runtime state, evidence, and worktrees use governed dotfile roots.

tool_adapter_policy:
  principle: >
    Home-level tool paths are adapter or deploy targets only.
    Authoritative tool behavior must resolve through repo-owned
    wrappers, contracts, and capabilities.
  examples:
    - path: ~/.claude/
      role: Claude Code adapter config (install target)
    - path: ~/.codex/skills/
      role: Codex skill install target (thin adapter)
    - path: ~/.config/opencode/
      role: OpenCode config (install target)
    - path: ~/.local/bin/
      role: pipx/brew deploy target for CLI tools
  enforcement: >
    No spine contract may declare a home-level path as authoritative truth.
    Repo-owned wrappers (ops/commands/cap.sh, ops/plugins/*/bin/*)
    are the authority layer. Home-level tool configs are consumers.

residue:
  - path: /Users/ronnyworks/.runtime
    status: archived
    disposition: migrated_to_canonical_runtime_archive
    note: >
      Legacy home-level runtime root. Superseded by
      /Users/ronnyworks/code/.runtime. Must not be used by any live surface.
      Archived on 2026-04-27 under
      /Users/ronnyworks/code/.runtime/spine/state/archive/runtime-root-splitbrain-residue-20260427T1100Z/home.runtime.

  - path: /Users/ronnyworks/code/agentic-spine/.runtime
    status: archived
    disposition: migrated_to_canonical_runtime_archive
    note: >
      Repo-local runtime root created by split-brain path inference. Runtime
      state must never live inside the versioned control-plane repo. Archived
      on 2026-04-27 under
      /Users/ronnyworks/code/.runtime/spine/state/archive/runtime-root-splitbrain-residue-20260427T1100Z/repo-local-agentic-spine.runtime.

  - path: /Users/ronnyworks/code/agentic-spine/.claude/worktrees/.runtime
    status: archived
    disposition: migrated_to_canonical_runtime_archive
    note: >
      Claude worktree-adjacent runtime root created by the same split-brain
      path inference family. Archived on 2026-04-27 under
      /Users/ronnyworks/code/.runtime/spine/state/archive/runtime-root-splitbrain-residue-20260427T1100Z/claude-worktrees/runtime.

  - path: /Users/ronnyworks/.wt
    status: orphan
    disposition: historical_residue_only
    note: >
      Legacy home-level worktree root. Superseded by
      /Users/ronnyworks/code/.runtime/spine/tmp/worktrees.
      Operator-storage and launchd plist references migrated to
      canonical /Users/ronnyworks/code/workbench in Step 7
      (SPINE-CLEAN-ARCHITECTURE-20260409, f021f2d2). No live
      callers remain. Directory itself may still exist on disk
      as inert residue.

  - path: /Users/ronnyworks/.worktrees
    status: orphan
    disposition: requires_removal
    note: >
      Deprecated worktree root predating both ~/.wt and the canonical root.

  - path: /Users/ronnyworks/code/.wt
    status: orphan
    disposition: historical_residue_only
    note: >
      Intermediate worktree root used between ~/.wt and the canonical root.
      Live spine-core scripts patched in H2-A to use canonical root.
      Operator-storage and launchd plist references migrated to
      canonical /Users/ronnyworks/code/workbench in Step 7
      (SPINE-CLEAN-ARCHITECTURE-20260409, f021f2d2). No live
      callers remain.

exception_policy:
  allowed_scope: /Users/ronnyworks/code
  home_root_exceptions: forbidden
  note: >
    Any legitimate operational exception must remain under ~/code.
    Home-root exceptions are never allowed. If a path cannot be resolved
    under ~/code in this pass, it must be classified explicitly and
    scheduled for a migration pass.

damage_model:
  wrong_root_write:
    description: >
      Terminal resolves the wrong root and writes state into a non-canonical
      location. Result: state is invisible to governed surfaces, causing
      continuity breaks.
    examples:
      - writing to ~/.runtime instead of ~/code/.runtime
      - creating worktrees under ~/.wt instead of canonical root
    mitigation: root.authority.contract.yaml + binding calibration

  dirty_governed_path:
    description: >
      A governed repo path accumulates runtime state that should be
      externalized. Result: git status noise, accidental commits of
      ephemeral state, verify failures.
    mitigation: mailroom.runtime.contract.yaml externalization

  split_brain_state:
    description: >
      Two roots exist for the same purpose (e.g. ~/.runtime and
      ~/code/.runtime both active). Result: different terminals see
      different state, causing conflicting decisions.
    mitigation: single canonical root per concern, residue retirement

  remote_clone_drift:
    description: >
      A repo clone on a remote execution host accumulates ad hoc edits,
      becoming a hidden second development surface. Result: code truth
      diverges from operator_console, deploy path becomes ungoverned,
      and restarts serve untested code.
    mitigation: >
      Code reaches execution_host only via governed promotion from
      operator_console (reviewed commit, explicit push, controlled
      restart). The remote repo clone is a deploy target, not a
      working checkout.

  broken_continuity:
    description: >
      Session A writes to root X, session B reads from root Y.
      State from session A is invisible to session B.
    mitigation: all sessions resolve paths through the same contract chain
