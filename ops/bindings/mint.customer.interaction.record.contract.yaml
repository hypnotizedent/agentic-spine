---
status: authoritative
owner: "@ronny"
last_verified: "2026-03-18"
scope: mint-customer-interaction-record
version: "1.0"
updated_at: "2026-03-18"

surface:
  description: Cross-channel interaction record authority for Morpheus voice intake and callback queueing.
  channels:
    - phone
  providers:
    - vapi
    - twilio

storage:
  records_root: "$SPINE_STATE/mint/customer-interactions/records"
  index_file: "$SPINE_STATE/mint/customer-interactions/index.ndjson"
  lock_file: "$SPINE_STATE/locks/mint-customer-interactions.lock"
  callback_records_root: "$SPINE_STATE/mint/customer-voice-callbacks/records"
  callback_index_file: "$SPINE_STATE/mint/customer-voice-callbacks/index.ndjson"
  callback_lock_file: "$SPINE_STATE/locks/mint-customer-voice-callbacks.lock"

schema:
  required_fields:
    - interaction_id
    - channel
    - provider
    - provider_call_id
    - started_at_utc
    - ended_at_utc
    - caller_number
    - caller_name
    - company
    - reason
    - urgency
    - callback_requested
    - preferred_followup_channel
    - order_or_quote_ref
    - disposition
    - summary
    - transcript_ref
    - linked_callback_item_id
    - live_transfer_attempted
    - live_transfer_result
    - operator_followup_required
    - evidence_refs
