# Mint Customer Interaction Record Authority
# Status: authoritative
# Last verified: 2026-03-17
# Scope: customer-voice-interaction-records

version: "1.0"
updated_at: "2026-03-17"
owner: "@ronny"
status: authoritative
scope: customer-voice-interaction-records

purpose: >
  Authority for normalized phone interaction records and callback queue.
  Captures structured intake from Vapi calls, callback requests, and
  operator follow-up coordination.

storage:
  records_root: "$SPINE_STATE/mint/customer-interactions/records"
  index_file: "$SPINE_STATE/mint/customer-interactions/index.ndjson"
  lock_file: "$SPINE_STATE/locks/mint-customer-interactions.lock"
  callback_records_root: "$SPINE_STATE/mint/customer-voice-callbacks/records"
  callback_index_file: "$SPINE_STATE/mint/customer-voice-callbacks/index.ndjson"
  callback_lock_file: "$SPINE_STATE/locks/mint-customer-voice-callbacks.lock"

required_normalized_fields:
  interaction_record:
    - interaction_id
    - channel
    - provider
    - provider_call_id
    - started_at_utc
    - ended_at_utc
    - caller_number
    - caller_name
    - company
    - reason
    - urgency
    - callback_requested
    - preferred_followup_channel
    - order_or_quote_ref
    - disposition
    - summary
    - transcript_ref
    - linked_callback_item_id
    - live_transfer_attempted
    - live_transfer_result
    - operator_followup_required
    - evidence_refs

  callback_queue_item:
    - callback_item_id
    - interaction_id
    - caller_number
    - caller_name
    - company
    - email
    - reason
    - urgency
    - preferred_followup_channel
    - order_or_quote_ref
    - summary
    - created_at_utc
    - status
    - assigned_to
    - completed_at_utc
    - completion_notes

enums:
  channel:
    - phone
    - sms
    - email
  provider:
    - vapi
    - twilio
    - microsoft
  urgency:
    - low
    - medium
    - high
    - critical
  preferred_followup_channel:
    - sms
    - email
    - phone
  disposition:
    - question_answered
    - callback_created
    - live_transfer_completed
    - live_transfer_failed
    - abandoned
  callback_status:
    - pending
    - assigned
    - in_progress
    - completed
    - cancelled

capabilities:
  - mint.customer.voice.intake.capture
  - mint.customer.voice.callback.enqueue
  - mint.customer.interaction.record.snapshot

evidence_policy:
  raw_provider_payloads: true
  transcript_retention: true
  recording_retention: false
  callback_ack_receipts: true
