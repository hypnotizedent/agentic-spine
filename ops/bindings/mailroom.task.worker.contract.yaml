---
status: authoritative
owner: "@ronny"
last_verified: 2026-02-21
scope: mailroom-task-worker
parser_safe_single_doc: true

# Governed autonomous worker lane for control-cycle cadence + task lifecycle.
# Current active task execution is capability-backed. The worker does not spawn
# Claude Code sessions, OpenAI calls, or generic AI agents.
authority_boundary:
  public_operator_language: execution.pickup.status
  operator_grammar_status: expert_internal
  not_authority_for:
    - node_admission
    - role_runtime_promotion
    - runtime_placement
    - backup_authority
    - watcher_or_observability_authority
    - vm_service_retirement
  note: >
    Mailroom task state is an execution-request realization of the kernel
    request/claim/heartbeat/result/receipt protocol. It must not be used as a
    role-runtime promotion surface or as proof that a node, appliance, VM, or
    service has been promoted.
lane_identity:
  lane_id: "operational_mailroom_task"
  realization_mode: operational
  queue_state_root: "$SPINE_STATE/agent-tasks"

runtime:
  poll_seconds: 90
  error_backoff_seconds: 20
  pid_file: "mailroom-task-worker.pid"
  log_file: "mailroom-task-worker.log"
  status_file: "mailroom-task-worker.status.json"

control_cycle:
  enabled: true
  timeout_seconds: 240
  window_hours: 24
  max_actions: 2
  max_priority: P1
  confirm_manual: false
  allow_agent_tools: false
  allow_unhealthy_agents: false

task_execution:
  enabled: true
  max_claims_per_tick: 3
  claim_policy:
    worker_id: "SPINE-EXECUTION-01"
    claim_all: true
    claim_unassigned: true
    allow_unhealthy_claims: false
  execute_route_targets:
    - capability
  planned_route_targets:
    - agent_tool
  planned_route_target_note: >
    agent_tool is vocabulary for a future bridge only. It is not accepted by
    the active worker until a governed spawn/prompt-injection/heartbeat/result
    and receipt-collection implementation exists.
  packet_closeout:
    linked_controller_prompt_packets: true
    close_surface: controller_prompt.close
    disposition_by_task_state:
      done: delivered
      failed: abandoned
      cancelled: deferred
    evidence_refs:
      - linked task envelope
  # NOTE: This allowlist is intentionally narrower than the bridge RPC allowlist
  # (mailroom.bridge.consumers.yaml). The worker runs autonomously on a timer
  # and should only execute governance/lifecycle caps. Read-only surface caps
  # (loops.list, gaps.aging, receipts.*, etc.) are bridge-only — they serve
  # mobile/operator queries but have no place in autonomous control cycles.
  capability_allowlist:
    - verify.pack.run
    - verify.infra.run
    - proposals.status
    - stability.control.snapshot
  manual_caps_require_confirm: true
