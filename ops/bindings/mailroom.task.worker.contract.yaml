---
status: authoritative
owner: "@ronny"
last_verified: 2026-02-21
scope: mailroom-task-worker
parser_safe_single_doc: true

# Governed autonomous worker lane for control-cycle cadence + task lifecycle.
# Current active task execution is capability-backed plus one bounded
# provider-backed agent bridge proof class. The worker does not spawn generic
# tool-using AI agents or open-ended coding sessions.
authority:
  owns:
    - claim_semantics
    - heartbeat_semantics
    - result_failure_semantics
    - receipt_linkage
    - route_target_taxonomy
    - autonomous_worker_capability_allowlist
    - bounded_agent_tool_bridge_scope
  does_not_decide:
    - node_admission
    - runtime_placement
    - role_runtime_promotion
    - backup_authority
    - watcher_or_observability_authority
    - vm_service_retirement
    - domain_truth
    - loop_wave_packet_gap_meaning_or_closeout_authority
  bounded_by:
    - contract: ops/bindings/node.role.contract.yaml
      relationship: execution_host role authority decides which physical nodes may carry the standing worker.
    - contract: ops/bindings/launchd.scheduler.registry.yaml
      relationship: standing runtime placement and proof channel are registered there.
    - contract: ops/bindings/dispatch.envelope.contract.yaml
      relationship: execution-request admission and lane vocabulary are defined there.
  peer_contracts:
    - contract: ops/bindings/mailroom.bridge.yaml
      relationship: HTTP Cap-RPC compatibility bridge; does not define worker execution semantics.
    - contract: ops/bindings/mailroom.bridge.consumers.yaml
      relationship: Cap-RPC consumer allowlist/RBAC; broader than autonomous worker allowlist.
    - contract: ops/bindings/mailroom.bridge.endpoints.yaml
      relationship: Bridge endpoint exposure/readback; not worker runtime authority.
    - contract: ops/bindings/mailroom.inventory.contract.yaml
      relationship: Logical mailroom namespace inventory; not route execution policy.
authority_boundary:
  public_operator_language: execution.pickup.status
  operator_grammar_status: expert_internal
  not_authority_for:
    - node_admission
    - role_runtime_promotion
    - runtime_placement
    - backup_authority
    - watcher_or_observability_authority
    - vm_service_retirement
  note: >
    Execution pickup task state is an execution-request realization of the kernel
    request/claim/heartbeat/result/receipt protocol. It must not be used as a
    role-runtime promotion surface or as proof that a node, appliance, VM, or
    service has been promoted.
kernel_realization:
  description: >
    First-class runtime realization of the spine kernel protocol for bounded
    unattended capability execution. This map makes the mailroom/runtime lane
    explicit without making it the authority for loops, waves, packets, gaps,
    friction, node roles, placement, backups, watcher truth, or domain truth.
  public_readback: execution.pickup.status
  primitives:
    request:
      engine_authority: ops/bindings/dispatch.envelope.contract.yaml
      runtime_realization: "$SPINE_STATE/agent-tasks/queued/TASK-*.yaml"
      admission_surface: mailroom.task.enqueue
      boundary: "A queued task is an execution request only; it is not claimed or executing."
    claim:
      engine_authority: "kernel custody requirement"
      runtime_realization: "$SPINE_STATE/agent-tasks/running/TASK-*.yaml with claimed_by"
      claim_surface: mailroom.task.claim
      boundary: "Claim proves worker custody only; it is not node admission, placement, role promotion, backup truth, watcher truth, or domain truth."
    heartbeat:
      engine_authority: "kernel liveness requirement"
      runtime_realization: "running task heartbeat_at plus mailroom-task-worker.status.json"
      heartbeat_surface: mailroom.task.heartbeat
      boundary: "Heartbeat proves task/worker liveness only; it is not service health or watcher authority."
    result_failure:
      engine_authority: ops/bindings/closeout.disposition.contract.yaml
      runtime_realization: "$SPINE_STATE/agent-tasks/done|failed/TASK-*.yaml"
      completion_surface: "mailroom.task.complete|mailroom.task.fail"
      boundary: "Task terminal state does not close a loop, retire a service, or mutate placement by itself."
    receipt:
      engine_authority: docs/governance/SESSION_PROTOCOL.md#receipt-classes
      runtime_realization: "task result references capability run keys and governed close receipts when linked"
      receipt_surfaces:
        - ".evidence/spine/sessions/RCAP-*/receipt.md"
        - "$SPINE_STATE/domain-state/EXEC_RECEIPT-CONTROLLER-PROMPT-*.yaml"
      boundary: "Task logs and narrative summaries are supporting evidence unless a governed writer produced the receipt."

first_class_runtime_decision:
  path_boundary:
    decision: "Do not create /code/mailroom as a live runtime or evidence home."
    reason: >
      /code is source/project checkout space. Mailroom task queues, worker
      status, runtime evidence, and execution receipts are governed state, not
      source. Moving live queue/evidence state under /code would recreate
      repo-local runtime ambiguity. The canonical runtime root remains
      $SPINE_STATE/agent-tasks, with evidence under the governed evidence root.
    allowed_future_shape: >
      A /code/mailroom project is legal only if it becomes a source/package
      home for reusable worker code and subtracts the in-spine implementation.
      It must not hold live queues, receipts, worker status, or canonical
      runtime state.
  placement_boundary:
    desired_direction: "Run the standing worker on an admitted always-on execution surface, not the operator laptop."
    canonical_authority_homes:
      - ops/bindings/node.role.contract.yaml
      - ops/bindings/launchd.scheduler.registry.yaml
      - ops/bindings/dispatch.envelope.contract.yaml
    current_truth: >
      Fresh lifecycle proof exists for the worker protocol, and the standing
      mailroom-task-worker runtime is promoted in launchd.scheduler.registry.yaml
      as an active execution_host systemd service on ai-consolidation. The active
      runtime is capability-backed and has one bounded provider-backed
      agent_tool proof class; generic tool-using AI-agent autonomy remains out
      of scope.
    candidate_read:
      ai_consolidation: "Best current fit by repo truth: admitted execution_host already running 24/7 systemd workloads."
      pve_r620: "Current role is watcher_node and Proxmox host; do not add direct execution duties without explicit role/placement promotion."
      pve_730xd_or_storage_host: "Likely storage_evidence_node direction; use only after node admission/placement truth says it owns runtime/evidence state."
  acceptance_proof_20260502:
    loop_id: LOOP-MAILROOM-RUNTIME-KERNEL-FIRST-CLASS-PROOF-20260502
    packet_id: PACKET-01-FRESH-RUNTIME-PROOF-AND-PLACEMENT-DECISION
    task_id: TASK-20260502T003100Z-mailroom-kernel-proof
    lifecycle:
      request: "mailroom.task.enqueue queued the task under $SPINE_STATE/agent-tasks/queued"
      pre_claim_readback: "execution.pickup.status showed pickup_state=not_claimed and claim_needed"
      claim: "mailroom.task.worker.once claimed the task as SPINE-MAILROOM-KERNEL-PROOF"
      heartbeat: "worker heartbeat/status was fresh during execution"
      result: "task completed successfully through capability route proposals.status"
      receipt: "execution.pickup.status exposed receipt_refs with the proposals.status run key"
    run_keys:
      enqueue: CAP-20260501-203059__mailroom.task.enqueue__R28w572176
      execution_pickup_before: CAP-20260501-203103__execution.pickup.status__Rrh4c73493
      worker_once: CAP-20260501-203108__mailroom.task.worker.once__R2uba74674
      capability_result: CAP-20260501-203109__proposals.status__Rq5u875337
      execution_pickup_after: CAP-20260501-203116__execution.pickup.status__Rw7yu76321
    limitation: >
      This proves the kernel lifecycle and readback. It was followed by a
      standing 24/7 worker promotion on ai-consolidation; it does not promote
      pve-r620, pve-730xd, or any other host for mailroom execution.
  standing_runtime_proof_20260502:
    host: ai-consolidation
    unit: spine-mailroom-task-worker.service
    worker_id: SPINE-MAILROOM-EXECUTION-HOST
    task_id: TASK-20260502T004500Z-mailroom-24x7-proof
    run_keys:
      enqueue: CAP-20260501-204501__mailroom.task.enqueue__R0o19109309
      capability_result: CAP-20260501-204504__proposals.status__R5ly0110582
      execution_pickup_after: CAP-20260501-204507__execution.pickup.status__R047l109308
    readback:
      status_surface: execution.pickup.status
      standing_program_surface: ops status
      proof_channel: /home/ubuntu/code/.runtime/spine/state/agent-tasks/mailroom-task-worker.status.json
    limitation: "This is autonomous capability execution, not generic AI-agent autonomy."
  ai_agent_bridge_v1:
    scope: bounded_readonly_provider_agent
    status: active_after_proof
    provider_surface: spine_engine
    default_provider: zai
    admission_requirements:
      route_target: agent_tool
      bridge_allowed: true
      route_prompt_ref: "existing readable packet/prompt file"
    kernel_proof_required:
      - request
      - claim
      - heartbeat
      - spawn
      - prompt_injection
      - result_or_failure
      - receipt
    limits:
      max_runtime_seconds: 300
      max_prompt_bytes: 12000
      route_tools: []
    boundary: >
      This bridge proves a spawned provider-backed agent can receive a bounded
      prompt and return a result under mailroom custody. It does not grant the
      spawned agent shell, filesystem, git, network, ops capability, or
      autonomous mutation authority.
lane_identity:
  lane_id: "operational_mailroom_task"
  realization_mode: operational
  queue_state_root: "$SPINE_STATE/agent-tasks"

runtime:
  poll_seconds: 90
  error_backoff_seconds: 20
  pid_file: "mailroom-task-worker.pid"
  log_file: "mailroom-task-worker.log"
  status_file: "mailroom-task-worker.status.json"

control_cycle:
  enabled: true
  timeout_seconds: 240
  window_hours: 24
  max_actions: 2
  max_priority: P1
  confirm_manual: false
  allow_agent_tools: true
  allow_unhealthy_agents: false

task_execution:
  enabled: true
  max_claims_per_tick: 3
  claim_policy:
    worker_id: "SPINE-EXECUTION-01"
    claim_all: true
    claim_unassigned: true
    allow_unhealthy_claims: false
  execute_route_targets:
    - capability
    - agent_tool
  route_target_taxonomy:
    safety_tiers:
      capability:
        status: realized
        route_targets:
          - capability
        meaning: "Existing bounded capability execution through the autonomous worker allowlist."
        proof_boundary: "Worker may run only task_execution.capability_allowlist entries."
      bounded_readonly_provider_agent:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V1 provider-backed agent subprocess with prompt-only input and no shell, filesystem, git, ops capability, or mutation access."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, bridge_proof scope bounded_readonly_provider_agent, and terminal task receipt."
      tool_using_agent_v2_1_readonly_repo:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V2.1 provider-backed agent subprocess with worker-prepared read-only repo context from explicitly admitted file paths."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, payload.tool_set=read_only_repo, repo_read_paths inside the repo fence, bridge_proof scope tool_using_agent_v2_1_readonly_repo, files_read, and terminal task receipt."
      tool_using_agent_reserved:
        status: reserved_empty
        route_targets: []
        meaning: "Future tool-using agent bridge slots beyond V2.1. Must remain empty until a separately proven bridge tier lands."
        proof_boundary: "execution.pickup.status summary count must remain zero for this reserved slot until another implementation lands."
      destructive_manual:
        status: reserved_manual
        route_targets: []
        meaning: "Operator-confirmed destructive/manual execution. Not available to unattended worker claims."
        proof_boundary: "manual_caps_require_confirm remains true."
  agent_tool_bridge:
    enabled: true
    scope: bounded_readonly_provider_agent
    provider: zai
    timeout_seconds: 300
    max_prompt_bytes: 12000
    require_bridge_allowed: true
    require_route_prompt_ref: true
    tool_access: none
    mutation_access: none
    supported_tool_sets:
      - prompt_only
      - read_only_repo
    v2_1_read_only_repo_inspection:
      scope: tool_using_agent_v2_1_readonly_repo
      tool_set: read_only_repo
      tool_boundary: "worker-prepared read-only context only; provider receives file excerpts in prompt and receives no filesystem, shell, git, network, or ops capability tool."
      repo_fence: "$SPINE_ROOT"
      excluded_roots:
        - .git
        - .runtime
      max_files: 6
      max_bytes_per_file: 6000
      max_total_bytes: 18000
      mutation_access: none
      receipt_fields:
        - scope
        - tool_set
        - files_read
        - tool_call_count
        - repo_fence
    receipt: "terminal task envelope with bridge_proof plus provider run artifacts under ops/plugins/providers/runs"
  packet_closeout:
    linked_controller_prompt_packets: true
    close_surface: controller_prompt.close
    disposition_by_task_state:
      done: delivered
      failed: abandoned
      cancelled: deferred
    evidence_refs:
      - linked task envelope
  # NOTE: This allowlist is intentionally narrower than the bridge RPC allowlist
  # (mailroom.bridge.consumers.yaml). The worker runs autonomously on a timer
  # and should only execute governance/lifecycle caps. Read-only surface caps
  # (loops.list, gaps.aging, receipts.*, etc.) are bridge-only — they serve
  # mobile/operator queries but have no place in autonomous control cycles.
  capability_allowlist:
    - verify.pack.run
    - verify.infra.run
    - proposals.status
    - stability.control.snapshot
  manual_caps_require_confirm: true
