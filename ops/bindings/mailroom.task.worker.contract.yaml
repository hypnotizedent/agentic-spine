---
status: authoritative
owner: "@ronny"
last_verified: 2026-02-21
scope: mailroom-task-worker
parser_safe_single_doc: true

# Governed autonomous worker lane for control-cycle cadence + task lifecycle.
# Current active task execution is capability-backed plus one bounded
# provider-backed agent bridge proof class. The worker does not spawn generic
# tool-using AI agents or open-ended coding sessions.
authority:
  owns:
    - claim_semantics
    - heartbeat_semantics
    - result_failure_semantics
    - receipt_linkage
    - route_target_taxonomy
    - autonomous_worker_capability_allowlist
    - bounded_agent_tool_bridge_scope
  does_not_decide:
    - node_admission
    - runtime_placement
    - role_runtime_promotion
    - backup_authority
    - watcher_or_observability_authority
    - vm_service_retirement
    - domain_truth
    - loop_wave_packet_gap_meaning_or_closeout_authority
  bounded_by:
    - contract: ops/bindings/node.role.contract.yaml
      relationship: execution_host role authority decides which physical nodes may carry the standing worker.
    - contract: ops/bindings/launchd.scheduler.registry.yaml
      relationship: standing runtime placement and proof channel are registered there.
    - contract: ops/bindings/dispatch.envelope.contract.yaml
      relationship: execution-request admission and lane vocabulary are defined there.
  peer_contracts:
    - contract: ops/bindings/mailroom.bridge.yaml
      relationship: HTTP Cap-RPC compatibility bridge; does not define worker execution semantics.
    - contract: ops/bindings/mailroom.bridge.consumers.yaml
      relationship: Cap-RPC consumer allowlist/RBAC; broader than autonomous worker allowlist.
    - contract: ops/bindings/mailroom.bridge.endpoints.yaml
      relationship: Bridge endpoint exposure/readback; not worker runtime authority.
    - contract: ops/bindings/mailroom.inventory.contract.yaml
      relationship: Logical mailroom namespace inventory; not route execution policy.
authority_boundary:
  public_operator_language: execution.pickup.status
  operator_grammar_status: expert_internal
  not_authority_for:
    - node_admission
    - role_runtime_promotion
    - runtime_placement
    - backup_authority
    - watcher_or_observability_authority
    - vm_service_retirement
  note: >
    Execution pickup task state is an execution-request realization of the kernel
    request/claim/heartbeat/result/receipt protocol. It must not be used as a
    role-runtime promotion surface or as proof that a node, appliance, VM, or
    service has been promoted.
kernel_realization:
  description: >
    First-class runtime realization of the spine kernel protocol for bounded
    unattended capability execution. This map makes the mailroom/runtime lane
    explicit without making it the authority for loops, waves, packets, gaps,
    friction, node roles, placement, backups, watcher truth, or domain truth.
  public_readback: execution.pickup.status
  primitives:
    request:
      engine_authority: ops/bindings/dispatch.envelope.contract.yaml
      runtime_realization: "$SPINE_STATE/agent-tasks/queued/TASK-*.yaml"
      admission_surface: mailroom.task.enqueue
      boundary: "A queued task is an execution request only; it is not claimed or executing."
    claim:
      engine_authority: "kernel custody requirement"
      runtime_realization: "$SPINE_STATE/agent-tasks/running/TASK-*.yaml with claimed_by"
      claim_surface: mailroom.task.claim
      boundary: "Claim proves worker custody only; it is not node admission, placement, role promotion, backup truth, watcher truth, or domain truth."
    heartbeat:
      engine_authority: "kernel liveness requirement"
      runtime_realization: "running task heartbeat_at plus mailroom-task-worker.status.json"
      heartbeat_surface: mailroom.task.heartbeat
      boundary: "Heartbeat proves task/worker liveness only; it is not service health or watcher authority."
    result_failure:
      engine_authority: ops/bindings/closeout.disposition.contract.yaml
      runtime_realization: "$SPINE_STATE/agent-tasks/done|failed/TASK-*.yaml"
      completion_surface: "mailroom.task.complete|mailroom.task.fail"
      boundary: "Task terminal state does not close a loop, retire a service, or mutate placement by itself."
    receipt:
      engine_authority: docs/governance/SESSION_PROTOCOL.md#receipt-classes
      runtime_realization: "task result references capability run keys and governed close receipts when linked"
      receipt_surfaces:
        - ".evidence/spine/sessions/RCAP-*/receipt.md"
        - "$SPINE_STATE/domain-state/EXEC_RECEIPT-CONTROLLER-PROMPT-*.yaml"
      boundary: "Task logs and narrative summaries are supporting evidence unless a governed writer produced the receipt."

first_class_runtime_decision:
  canonical_queue_truth:
    rule: >
      Single canonical agent-tasks queue. mailroom.task.enqueue routes via
      cap.sh db_authority routing and lands queued task envelopes at
      /md1400/spine/state/agent-tasks/queued/ on storage_evidence_node (pve).
      Worker pickup runs against the same canonical queue via routed
      mailroom.task.worker.once (which lands on pve as a mutating cap), so
      the request/claim/heartbeat/result/receipt protocol fires against the
      same task envelopes that mailroom.task.enqueue created. Operator-side
      readback via execution.pickup.status SSH-fetches canonical agent-tasks
      using the existing ssh-resolve helper pattern (load_remote_yaml_dir),
      so the operator-console readback shows the same task lifecycle the
      worker is operating on. No projection sync, no new mailroom queue, no
      ad-hoc replication.
    standing_worker_responsibility: >
      The launchd-registered standing worker on ai-consolidation
      (com.ronny.mailroom-task-worker / spine-mailroom-task-worker.service)
      now reads the canonical agent-tasks queue via SSH-merge in
      mailroom-task-worker._load_canonical_queued_docs (same ssh-resolve
      pattern as execution-pickup-status). Combined with the pre-claim
      provider-placement check below, the standing worker is the canonical
      queue picker for tasks whose requested provider is ready on
      ai-consolidation. Worker contract authority.does_not_decide list is
      unchanged — this is operational placement hygiene, not new authority.
      A pve worker.once invocation continues to read canonical directly
      (it lives on the authority host) and will claim provider-backed work
      only when the same pre-claim provider check passes there; otherwise
      it leaves the task queued for an upstream host that can run it.
    provider_placement_check:
      rule: >
        Provider-backed tasks (route_target=agent_tool) are pre-claim
        gated by mailroom-task-worker._provider_ready_locally, which
        invokes ops/plugins/providers/bin/providers-status with
        --surface=spine_engine --provider=<requested>. If the requested
        provider is not ready on this host (missing credentials, missing
        endpoint, or provider declared unsupported), the worker emits a
        soft skip with reason 'placement_unsuitable: provider=<id> not
        ready on <host> (<reason>); leaving queued for provider-ready
        host'. The task stays queued — no claim, no mutation, no fail
        receipt. Another worker pass on a host where the provider IS ready
        can claim and execute. Pre-claim probe results are cached per
        worker pass to avoid re-spawning the readiness probe per task.
      failure_mode_complement: >
        If a provider-backed task IS claimed (provider readiness probe
        passed at claim time) but the bridge subprocess fails for any
        runtime reason, the existing _execute_agent_tool failure path
        still applies: bridge_proof.status=failed, failure_reason naming
        the runtime cause, mutation_access=none, worktree_mutation absent,
        push_performed/merge_performed absent. The task moves to failed
        state with a structured terminal receipt. The pre-claim
        placement check addresses the placement honesty question (is this
        host even capable of running this work?); the post-claim failure
        path addresses runtime honesty (did the bounded execution
        actually succeed?). Both must hold. Neither is a substitute for
        the other.
      env_overrides:
        MAILROOM_WORKER_DISABLE_CANONICAL_QUEUE: "1 disables canonical SSH-fetch (worker reads only local queue; legacy/test mode)"
        MAILROOM_WORKER_DISABLE_PROVIDER_PLACEMENT: "1 disables pre-claim provider readiness check (worker claims agent_tool tasks regardless of provider readiness; legacy/test mode)"
        MAILROOM_WORKER_DISABLE_CANONICAL_PROMPT_FETCH: "1 disables canonical-prompt SSH-fetch into the local prompt cache fence (worker rejects canonical-absolute route_prompt_ref instead of fetching it; legacy/test mode)"
    canonical_prompt_resolution:
      rule: >
        agent_tool route_prompt_ref values that are absolute paths under the
        storage_evidence_node canonical state root
        (root.authority.contract.yaml#storage_evidence_node_canonical.primary_canonical_root,
        currently /md1400/spine/state) and outside the executing host's
        admitted local roots are SSH-fetched into a fenced local runtime
        artifact at $SPINE_STATE/agent-bridge-prompt-cache/<task_id>/<basename>
        before the provider subprocess spawns. The fenced local copy is
        runtime-artifact only — pve remains the controller-prompt authority.
        Refs that point outside both the admitted local roots AND the canonical
        state root continue to fail with the same 'route_prompt_ref outside
        admitted roots' refusal so unsafe paths are still rejected.
      bridge_proof_fields:
        canonical_prompt_ref: "the original route_prompt_ref value (canonical absolute path)"
        local_prompt_copy: "the fenced local cache file actually read by the bridge"
        prompt_copy_fence: "$SPINE_STATE/agent-bridge-prompt-cache (fence root)"
        prompt_fetch_via: "ssh_canonical_state_root"
        prompt_authority_host: "the storage_evidence_node host_ref the SSH read targeted"
      authority_invariants:
        - "controller-prompt authority remains on storage_evidence_node (pve)"
        - "ai-cons does not become the home for controller prompts"
        - "no ad-hoc prompt copy outside the named fence"
        - "fenced cache is runtime-artifact, not authority"
  path_boundary:
    decision: "Do not create /code/mailroom as a live runtime or evidence home."
    reason: >
      /code is source/project checkout space. Mailroom task queues, worker
      status, runtime evidence, and execution receipts are governed state, not
      source. Moving live queue/evidence state under /code would recreate
      repo-local runtime ambiguity. The canonical runtime root remains
      $SPINE_STATE/agent-tasks, with evidence under the governed evidence root.
    allowed_future_shape: >
      A /code/mailroom project is legal only if it becomes a source/package
      home for reusable worker code and subtracts the in-spine implementation.
      It must not hold live queues, receipts, worker status, or canonical
      runtime state.
  placement_boundary:
    desired_direction: "Run the standing worker on an admitted always-on execution surface, not the operator laptop."
    canonical_authority_homes:
      - ops/bindings/node.role.contract.yaml
      - ops/bindings/launchd.scheduler.registry.yaml
      - ops/bindings/dispatch.envelope.contract.yaml
    current_truth: >
      Fresh lifecycle proof exists for the worker protocol, and the standing
      mailroom-task-worker runtime is promoted in launchd.scheduler.registry.yaml
      as an active execution_host systemd service on ai-consolidation. The active
      runtime is capability-backed and has one bounded provider-backed
      agent_tool proof class; generic tool-using AI-agent autonomy remains out
      of scope.
    candidate_read:
      ai_consolidation: "Best current fit by repo truth: admitted execution_host already running 24/7 systemd workloads."
      pve_r620: "Current role is watcher_node and Proxmox host; do not add direct execution duties without explicit role/placement promotion."
      pve: "Active candidate for storage_evidence_node per node.role.contract.yaml. Storage and execution are different jobs; execution_host candidacy on pve is deferred until storage_evidence_node delivery is complete and a separate explicit promotion sequence runs."
  acceptance_proof_20260502:
    loop_id: LOOP-MAILROOM-RUNTIME-KERNEL-FIRST-CLASS-PROOF-20260502
    packet_id: PACKET-01-FRESH-RUNTIME-PROOF-AND-PLACEMENT-DECISION
    task_id: TASK-20260502T003100Z-mailroom-kernel-proof
    lifecycle:
      request: "mailroom.task.enqueue queued the task under $SPINE_STATE/agent-tasks/queued"
      pre_claim_readback: "execution.pickup.status showed pickup_state=not_claimed and claim_needed"
      claim: "mailroom.task.worker.once claimed the task as SPINE-MAILROOM-KERNEL-PROOF"
      heartbeat: "worker heartbeat/status was fresh during execution"
      result: "task completed successfully through capability route proposals.status"
      receipt: "execution.pickup.status exposed receipt_refs with the proposals.status run key"
    run_keys:
      enqueue: CAP-20260501-203059__mailroom.task.enqueue__R28w572176
      execution_pickup_before: CAP-20260501-203103__execution.pickup.status__Rrh4c73493
      worker_once: CAP-20260501-203108__mailroom.task.worker.once__R2uba74674
      capability_result: CAP-20260501-203109__proposals.status__Rq5u875337
      execution_pickup_after: CAP-20260501-203116__execution.pickup.status__Rw7yu76321
    limitation: >
      This proves the kernel lifecycle and readback. It was followed by a
      standing 24/7 worker promotion on ai-consolidation; it does not promote
      pve-r620, pve, or any other host for mailroom execution.
  standing_runtime_proof_20260502:
    host: ai-consolidation
    unit: spine-mailroom-task-worker.service
    worker_id: SPINE-MAILROOM-EXECUTION-HOST
    task_id: TASK-20260502T004500Z-mailroom-24x7-proof
    run_keys:
      enqueue: CAP-20260501-204501__mailroom.task.enqueue__R0o19109309
      capability_result: CAP-20260501-204504__proposals.status__R5ly0110582
      execution_pickup_after: CAP-20260501-204507__execution.pickup.status__R047l109308
    readback:
      status_surface: execution.pickup.status
      standing_program_surface: ops status
      proof_channel: /home/ubuntu/code/.runtime/spine/state/agent-tasks/mailroom-task-worker.status.json
    limitation: "This is autonomous capability execution, not generic AI-agent autonomy."
  ai_agent_bridge_v1:
    scope: bounded_readonly_provider_agent
    status: active_after_proof
    provider_surface: spine_engine
    default_provider: zai
    admission_requirements:
      route_target: agent_tool
      bridge_allowed: true
      route_prompt_ref: "existing readable packet/prompt file"
    kernel_proof_required:
      - request
      - claim
      - heartbeat
      - spawn
      - prompt_injection
      - result_or_failure
      - receipt
    limits:
      max_runtime_seconds: 300
      max_prompt_bytes: 12000
      route_tools: []
    boundary: >
      This bridge proves a spawned provider-backed agent can receive a bounded
      prompt and return a result under mailroom custody. It does not grant the
      spawned agent shell, filesystem, git, network, ops capability, or
      autonomous mutation authority.
lane_identity:
  lane_id: "operational_mailroom_task"
  realization_mode: operational
  queue_state_root: "$SPINE_STATE/agent-tasks"

runtime:
  poll_seconds: 90
  error_backoff_seconds: 20
  pid_file: "mailroom-task-worker.pid"
  log_file: "mailroom-task-worker.log"
  status_file: "mailroom-task-worker.status.json"

control_cycle:
  enabled: true
  timeout_seconds: 240
  window_hours: 24
  max_actions: 2
  max_priority: P1
  confirm_manual: false
  allow_agent_tools: true
  allow_unhealthy_agents: false

task_execution:
  enabled: true
  max_claims_per_tick: 3
  claim_policy:
    worker_id: "SPINE-EXECUTION-01"
    claim_all: true
    claim_unassigned: true
    allow_unhealthy_claims: false
  execute_route_targets:
    - capability
    - agent_tool
  route_target_taxonomy:
    safety_tiers:
      capability:
        status: realized
        route_targets:
          - capability
        meaning: "Existing bounded capability execution through the autonomous worker allowlist."
        proof_boundary: "Worker may run only task_execution.capability_allowlist entries."
      bounded_readonly_provider_agent:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V1 provider-backed agent subprocess with prompt-only input and no shell, filesystem, git, ops capability, or mutation access."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, bridge_proof scope bounded_readonly_provider_agent, and terminal task receipt."
      tool_using_agent_v2_1_readonly_repo:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V2.1 provider-backed agent subprocess with worker-prepared read-only repo context from explicitly admitted file paths."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, payload.tool_set=read_only_repo, repo_read_paths inside the repo fence, bridge_proof scope tool_using_agent_v2_1_readonly_repo, files_read, and terminal task receipt."
      tool_using_agent_v2_2_readonly_capability_calls:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V2.2 provider-backed agent subprocess with worker-mediated calls to a tiny read-only capability allowlist."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, payload.tool_set=read_only_capability_calls, requested capabilities inside v2_2_read_only_capability_calls.capability_allowlist, bridge_proof scope tool_using_agent_v2_2_readonly_capability_calls, capabilities_called, run_keys, mutation_access none, and terminal task receipt."
      tool_using_agent_v2_3_fenced_artifact_write:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V2.3 provider-backed agent subprocess whose result is written by the worker to a governed runtime artifact fence."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, payload.tool_set=fenced_artifact_write, artifact path under v2_3_fenced_artifact_write.artifact_root, bridge_proof scope tool_using_agent_v2_3_fenced_artifact_write, artifact_path, artifact_fence, artifact_bytes, and no provider filesystem access."
      tool_using_agent_v2_4_patch_artifact:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V2.4 provider-backed agent subprocess whose result is saved by the worker as a patch artifact only; no worktree mutation, push, or merge."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, payload.tool_set=patch_artifact, patch artifact path under v2_4_patch_artifact.patch_artifact_root, bridge_proof scope tool_using_agent_v2_4_patch_artifact, patch_artifact_path, patch_bytes, worktree_mutation false, and terminal task receipt."
      tool_using_agent_v2_5_patch_apply_sandbox:
        status: realized
        route_targets:
          - agent_tool
        meaning: "V2.5 provider-backed agent subprocess whose patch result is applied only by the worker inside a leased sandbox worktree under governed runtime state; no push or merge."
        proof_boundary: "Requires bridge_allowed=true, route_prompt_ref, payload.tool_set=patch_apply_sandbox, bridge_proof scope tool_using_agent_v2_5_patch_apply_sandbox, patch_apply_status applied, worktree_mutation_scope leased_sandbox_only, sandbox_cleanup removed, push_performed false, merge_performed false, and terminal task receipt."
      tool_using_agent_reserved:
        status: reserved_empty
        route_targets: []
        meaning: "Future tool-using agent bridge slots beyond V2.5. Must remain empty until a separately proven bridge tier lands."
        proof_boundary: "execution.pickup.status summary count must remain zero for this reserved slot until another implementation lands."
      destructive_manual:
        status: reserved_manual
        route_targets: []
        meaning: "Operator-confirmed destructive/manual execution. Not available to unattended worker claims."
        proof_boundary: "manual_caps_require_confirm remains true."
  agent_tool_bridge:
    enabled: true
    scope: bounded_readonly_provider_agent
    provider: zai
    timeout_seconds: 300
    max_prompt_bytes: 12000
    require_bridge_allowed: true
    require_route_prompt_ref: true
    tool_access: none
    mutation_access: none
    supported_tool_sets:
      - prompt_only
      - read_only_repo
      - read_only_capability_calls
      - fenced_artifact_write
      - patch_artifact
      - patch_apply_sandbox
    v2_1_read_only_repo_inspection:
      scope: tool_using_agent_v2_1_readonly_repo
      tool_set: read_only_repo
      tool_boundary: "worker-prepared read-only context only; provider receives file excerpts in prompt and receives no filesystem, shell, git, network, or ops capability tool."
      repo_fence: "$SPINE_ROOT"
      excluded_roots:
        - .git
        - .runtime
      max_files: 6
      max_bytes_per_file: 6000
      max_total_bytes: 18000
      mutation_access: none
      receipt_fields:
        - scope
        - tool_set
        - files_read
        - tool_call_count
        - repo_fence
    v2_2_read_only_capability_calls:
      scope: tool_using_agent_v2_2_readonly_capability_calls
      tool_set: read_only_capability_calls
      tool_boundary: "worker-mediated read-only capability calls only; provider receives capability output in prompt and receives no shell, filesystem, git, network, ops credential, or mutation-capable tool."
      capability_allowlist:
        - execution.pickup.status
        - proposals.status
      deny_unallowlisted: true
      max_calls: 1
      mutation_access: none
      receipt_fields:
        - scope
        - tool_set
        - capabilities_called
        - run_keys
        - tool_call_count
        - mutation_access
    v2_3_fenced_artifact_write:
      scope: tool_using_agent_v2_3_fenced_artifact_write
      tool_set: fenced_artifact_write
      tool_boundary: "worker-owned artifact write only; provider returns text, and the worker writes that result under the governed artifact fence."
      artifact_root: "$SPINE_STATE/agent-artifacts/ai-bridge"
      allowed_extensions:
        - .md
        - .txt
        - .json
      max_artifact_bytes: 24000
      mutation_access: fenced_runtime_artifact_only
      receipt_fields:
        - scope
        - tool_set
        - artifact_path
        - artifact_fence
        - artifact_bytes
        - mutation_access
    v2_4_patch_artifact:
      scope: tool_using_agent_v2_4_patch_artifact
      tool_set: patch_artifact
      tool_boundary: "worker-owned patch artifact write only; provider returns patch text, and the worker writes a .patch artifact under the governed artifact fence without applying it."
      patch_artifact_root: "$SPINE_STATE/agent-artifacts/ai-bridge-patches"
      allowed_extensions:
        - .patch
        - .diff
      max_patch_bytes: 48000
      worktree_mutation: false
      mutation_access: patch_artifact_only
      receipt_fields:
        - scope
        - tool_set
        - patch_artifact_path
        - patch_artifact_fence
        - patch_bytes
        - worktree_mutation
        - mutation_access
    v2_5_patch_apply_sandbox:
      scope: tool_using_agent_v2_5_patch_apply_sandbox
      tool_set: patch_apply_sandbox
      tool_boundary: "worker-owned patch apply only; provider returns patch text, and the worker applies it inside a temporary leased worktree under governed runtime state."
      worktree_lifecycle_contract: ops/bindings/worktree.lifecycle.contract.yaml
      sandbox_root: "$SPINE_STATE/agent-worktrees/ai-bridge"
      patch_artifact_root: "$SPINE_STATE/agent-artifacts/ai-bridge-patches"
      patch_format: unified_diff
      parser_validator: git_apply_check
      max_patch_bytes: 48000
      apply_timeout_seconds: 60
      lease_filename: ".spine-lane-lease.yaml"
      lease_ttl_hours: 24
      verify_command:
        - git
        - diff
        - --check
      allowed_verify_commands:
        - "git diff --check"
      worktree_mutation: true
      worktree_mutation_scope: leased_sandbox_only
      sandbox_cleanup: removed
      side_effect_policy: "expected_patch_files must equal actual changed files, excluding the lease file; mismatch fails the task with receipt."
      review_surface: execution.pickup.status
      review_state: needs_controller_review_before_merge
      commit_identity_policy: "If a later controller lane promotes the patch, the commit author is the worker/controller identity with provider/model/bridge-tier trailers; V2.5 itself never commits."
      recovery_policy: "If the worker dies mid-apply, the lease TTL and worktree lifecycle hygiene own cleanup; the task remains non-terminal/stale until failed or reconciled by governed recovery."
      push_performed: false
      merge_performed: false
      mutation_access: leased_sandbox_worktree_only
      receipt_fields:
        - scope
        - tool_set
        - patch_artifact_path
        - patch_bytes
        - sandbox_root
        - worktree_lifecycle_contract
        - lease_filename
        - lease_ttl_hours
        - sandbox_worktree_retained
        - sandbox_cleanup
        - patch_apply_status
        - worktree_mutation_scope
        - expected_patch_files
        - actual_patch_files
        - side_effect_files
        - push_performed
        - merge_performed
        - mutation_access
    receipt: "terminal task envelope with bridge_proof; provider run artifacts are cleaned by default and retained only when SPINE_AGENT_BRIDGE_KEEP_RUNS=1"
  packet_closeout:
    linked_controller_prompt_packets: true
    close_surface: controller_prompt.close
    disposition_by_task_state:
      done: delivered
      failed: abandoned
      cancelled: deferred
    evidence_refs:
      - linked task envelope
  # NOTE: This allowlist is intentionally narrower than the bridge RPC allowlist
  # (mailroom.bridge.consumers.yaml). The worker runs autonomously on a timer
  # and should only execute governance/lifecycle caps. Read-only surface caps
  # (loops.list, gaps.aging, receipts.*, etc.) are bridge-only — they serve
  # mobile/operator queries but have no place in autonomous control cycles.
  capability_allowlist:
    - verify.pack.run
    - verify.infra.run
    - proposals.status
    - stability.control.snapshot
    - propose.change.artery.validate
  manual_caps_require_confirm: true
