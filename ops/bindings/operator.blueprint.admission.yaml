---
# operator.blueprint.admission.yaml
# Authority surface for operator blueprint intake classification.
#
# This file answers: "What happened to the human steward's blueprint files?"
# Each entry classifies an ingested operator architecture file and tracks
# its disposition through the spine admission path.
#
# Source material: operator-vision batches 2026-04-13 and 2026-04-16
# Located at: $SPINE_STATE/inputs/operator-vision-20260413/
#             $SPINE_STATE/inputs/operator-vision-20260416/

status: authoritative
owner: "@human-steward"
scope: operator-blueprint-admission
created: "2026-04-27"

# Vocabulary

operator_intent_classes:
  - blueprint          # L1/L2 platform architecture
  - domain_vision      # L3 product surface design
  - reference_only     # Intellectual framework, not directly materializable

admission_decisions:
  - materialize        # Accepted; becomes live authority/capability/readback
  - shelf              # Valuable; deferred until trigger
  - tombstone          # Superseded or rejected
  - reference_only     # Preserved as context; no materialization path

admission_statuses:
  - captured           # File exists in inputs/
  - classified         # Intent class and layer assigned
  - accepted           # Decision made, canonical home identified
  - materializing      # Active work converting to spine truth
  - proved             # Live authority/capability/readback exists
  - shelved            # Parked with trigger conditions
  - tombstoned         # Explicitly closed

# Epistemic fields (borrowed from posture contract draft, not standalone)
claim_types:
  - observed           # Direct evidence exists in spine
  - inferred           # Pattern match or indirect evidence
  - proposed           # Operator intent, not yet proved
  - accepted           # Operator-approved, spine-adopted

# --- Classification Matrix ---

entries:

