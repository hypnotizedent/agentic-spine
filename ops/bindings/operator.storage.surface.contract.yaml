---
status: authoritative
owner: "@ronny"
last_verified: 2026-04-09
scope: operator-storage-surface
version: 1
updated_at: "2026-04-28"

# Operator Storage Surface Contract
# Shared authority for workstation client-storage surfaces.
# Browse mounts and watched-outbox sync are convenience-only.
# Assisted-move and direct-remote surfaces are the critical write path.

runtime_workbench_root: /Users/ronnyworks/code/workbench

operator_storage_decision_surface:
  status: authoritative
  scope: bounded-human-decisions-that-change-storage-placement-copy-or-protection
  anti_scope:
    - broad_storage_ontology
    - physical_migration_plan
    - backup_runtime_policy
  axis_separation:
    where_stored:
      authority_ref: ops/bindings/storage.scaffold.authority.yaml
      fields:
        - device
        - path
        - scaffold_class
        - canonicality
      meaning: Declares the storage surface and whether it is canonical, secondary, staging, retained, or noncanonical.
    how_stored:
      authority_ref: ops/bindings/state.storage.policy.yaml
      fields:
        - yaml_storage.allowed_data_classes
        - sqlite_storage.allowed_data_classes
        - decision_matrix.data_class
      meaning: Declares whether the state/control artifact belongs in human-reviewable YAML or runtime SQLite.
    operator_decision:
      authority_ref: ops/bindings/operator.storage.surface.contract.yaml
      fields:
        - operator_storage_decision_surface.supported_decision_axes
        - operator_storage_decision_surface.decision_record_shape
      meaning: Declares the small set of human choices that may change copy, placement, or protection intent.
  supported_decision_axes:
    - axis: extra_copy
      meaning: Human decision to add or retain an additional copy without changing the canonical primary.
      storage_effect_fields:
        - requested_copy_delta
        - target_copy_surface_class
        - target_canonicality
    - axis: placement_override
      meaning: Human decision to place data on a non-default surface or keep accepted risk in place.
      storage_effect_fields:
        - requested_surface_ref
        - override_reason
        - review_by
    - axis: protection_override
      meaning: Human decision to change protection expectations such as review hold, quarantine, or deletion block.
      storage_effect_fields:
        - protection_effect
        - retention_effect
        - evidence_ref
    - axis: shared_storage_escalation
      meaning: Human decision that a workload actually requires cross-node state continuity instead of autonomous local storage.
      storage_effect_fields:
        - cross_node_state_continuity_required
        - same_dataset_multi_writer_required
        - hypervisor_live_migration_required
        - shared_storage_candidate
        - rejection_reason
  decision_record_shape:
    required_fields:
      - decision_id
      - axis
      - sensitivity
      - subject_ref
      - current_canonical_surface_ref
      - storage_effect
      - operator_decision_required
      - evidence_ref
    notes: Decision records describe intent and authority changes only; they do not perform moves, copies, or backup runtime changes.
  operator_blueprint_drains:
    - drain_id: OBD-STORAGE-SHARED-STORAGE-20260428
      source_ref: /Users/ronnyworks/Desktop/Archive/Shared storage.md
      status: drained_to_contract
      summary: Autonomous nodes are local-storage-first; shared storage is not default infrastructure.
      canonical_rules:
        - rule_id: autonomous-local-first
          if: "node can be rebuilt from bootstrap, identity, role, and declared data restore"
          then: "do not require shared storage; use local storage plus explicit backup/recovery promises"
        - rule_id: shared-storage-only-with-state-continuity
          if: "same workload must restart elsewhere with the same live filesystem or data"
          then: "file a shared_storage_escalation decision before introducing shared storage"
        - rule_id: multi-writer-requires-explicit-decision
          if: "multiple nodes must read/write the same dataset"
          then: "operator decision must declare the dataset, writers, protection model, and recovery proof"
        - rule_id: hypervisor-cluster-is-a-phase-change
          if: "VM live migration or clustered failover is required"
          then: "treat shared storage as a deliberate architecture phase, not a default node property"
      anti_drift:
        - Do not recommend Ceph/shared storage merely because multiple nodes exist.
        - Do not turn autonomous node rebuildability into hidden shared-storage dependency.
        - Do not store runtime mount/probe facts in this contract.
  sensitive_data_extra_copy_example:
    decision_id: example-sensitive-data-extra-copy
    axis: extra_copy
    sensitivity: sensitive
    subject_ref: service.data.lifecycle.registry.yaml#paperless_documents
    current_canonical_surface_ref: storage.scaffold.authority.yaml#pve:/md1400/archive
    storage_effect:
      requested_copy_delta: 1
      target_copy_surface_class: backup_secondary
      target_canonicality: secondary
      protection_effect: Add a declared secondary copy while preserving the canonical primary and storage format.
    operator_decision_required: true
    evidence_ref: operator-decision-record-required-before-implementation

bootstrap:
  installer_script_path: /Users/ronnyworks/code/workbench/scripts/root/operator/install-client-storage-surfaces.sh
  sync_root: ~/Operator Sync
  conflicts_root: ~/Operator Sync/.conflicts
  sync_launch_agent_label: com.ronny.operator-storage-surface-sync
  sync_launchd_template: ops/plugins/infra/host/launchd/com.ronny.operator-storage-surface-sync.plist

surfaces:
  mintfiles:
    launch_agent_label: com.ronnyworks.mintfiles.mount
    launchd_template: ops/plugins/infra/host/launchd/com.ronnyworks.mintfiles.mount.plist
    mount_script_path: /Users/ronnyworks/code/workbench/scripts/root/mounts/mintfiles-mount.sh
    mount_root: ~/MinIO
    surface_class: convenience_only
    mount_health_policy:
      inactive: warn
      stale: warn
      local_fallback_entries: fail
    allowed_local_entries_when_unmounted:
      - .DS_Store
      - .localized
    watched_outbox_surface:
      mode: watched_outbox_sync
      enabled: true
      local_root: ~/Operator Sync/Mint/operator-drop
      conflicts_root: ~/Operator Sync/.conflicts/Mint
      journal_root: $SPINE_EVIDENCE_ROOT/operator-storage/mint/operator-drop-sync
      remote_root: "mintfiles:artwork-intake/operator-drop"
      sync_command_path: ""
    assisted_move_surface:
      mode: governed_mountless_remote_move
      surface_class: critical_path
      helper_bin_path: ~/.local/bin/mint-operator-drop-assist
      finder_app_path: ~/Applications/Mint Operator Drop.app
      installer_script_path: /Users/ronnyworks/code/workbench/scripts/root/operator/install-mint-operator-drop-surface.sh

  archives:
    # RETIRED 2026-04-14: archive-smb Samba export surface decommissioned.
    # No live consumers since 2026-03-22. Launchd job unloaded, credentials invalid.
    # md1400/archive remains canonical archive storage via direct pve access.
    # Operator data access is now direct md1400 path, not SMB export.
    status: retired
    retired_at: "2026-04-14"
    retirement_reason: "archive-smb LXC Samba export had no live consumers since 2026-03-22; operator cut over to direct md1400 access"
    launch_agent_label: com.ronnyworks.archives.mount
    launchd_template: ops/plugins/infra/host/launchd/com.ronnyworks.archives.mount.plist
    mount_script_path: /Users/ronnyworks/code/workbench/scripts/root/mounts/archives-mount.sh
    mount_root: ~/Archives
    surface_class: retired
    mount_health_policy:
      inactive: warn
      stale: warn
      local_fallback_entries: fail
    allowed_local_entries_when_unmounted:
      - .DS_Store
      - .localized
    assisted_move_surface:
      mode: governed_mountless_remote_move
      surface_class: critical_path
      helper_bin_path: ~/.local/bin/archive-operator-drop-assist
      finder_app_path: ~/Applications/Archive Operator Drop.app
      installer_script_path: /Users/ronnyworks/code/workbench/scripts/root/operator/install-archive-operator-drop-surface.sh
      receipts_root: $SPINE_EVIDENCE_ROOT/operator-storage/archive/operator-drop-assist
      default_route: Legacy
      route_selector_required: true
      selector_label: family
      verification_method: rclone_check_size_one_way
      cleanup_policy: trash_after_verified_arrival
      allowed_source_roots:
        - ~/Desktop
        - ~/Downloads
        - ~/Documents
        - /tmp
        - ~/Operator Sync/Archives
      routes:
        - id: mint-legacy
          remote_name: archives-mint-legacy
          remote_root: "archives-mint-legacy:mint-legacy"
          browse_root: ~/Archives/mint-legacy
          local_root: ~/Operator Sync/Archives/mint-legacy
        - id: Hypnotized
          remote_name: archives-ronny-projects
          remote_root: "archives-ronny-projects:ronny-projects/Hypnotized"
          browse_root: ~/Archives/Hypnotized
          local_root: ~/Operator Sync/Archives/Hypnotized
        - id: Legacy
          remote_name: archives-ronny-projects
          remote_root: "archives-ronny-projects:ronny-projects/Legacy"
          browse_root: ~/Archives/Legacy
          local_root: ~/Operator Sync/Archives/Legacy
    watched_outbox_surface:
      mode: watched_outbox_sync
      enabled: true
      local_root: ~/Operator Sync/Archives
      conflicts_root: ~/Operator Sync/.conflicts/Archives
      journal_root: $SPINE_EVIDENCE_ROOT/operator-storage/archive/operator-drop-sync
      routes:
        - id: mint-legacy
          remote_root: "archives-mint-legacy:mint-legacy"
          local_root: ~/Operator Sync/Archives/mint-legacy
        - id: Hypnotized
          remote_root: "archives-ronny-projects:ronny-projects/Hypnotized"
          local_root: ~/Operator Sync/Archives/Hypnotized
        - id: Legacy
          remote_root: "archives-ronny-projects:ronny-projects/Legacy"
          local_root: ~/Operator Sync/Archives/Legacy
    remote_setup:
      smb_host: "100.96.211.33"
      smb_user: archive
      shares:
        - remote_name: archives-mint-legacy
          share: mint-legacy
        - remote_name: archives-ronny-projects
          share: ronny-projects
    rehome_surface:
      mode: governed_remote_source_rehome
      receipts_root: $SPINE_EVIDENCE_ROOT/operator-storage/archive/operator-drop-assist/rehome
      relay_stage_root: $SPINE_STATE/operator-storage/archive/rehome/staging
      default_verify_mode: quick
      verify_modes:
        quick:
          manifest_basis: size_count
          delete_allowed: false
        strict:
          manifest_basis: sha256
          delete_allowed: true
      host_bindings: []
