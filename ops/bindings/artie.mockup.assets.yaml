fallback_policy:
  description: |
    Fallback selection order when exact curated asset not found:
    1. Curated style+color+view exact match (preferred)
    2. Curated style+view with generic/matched color (if exists)
    3. Family-level fallback only if explicitly allowed by policy
    4. Supplier primary_image_url only if explicitly allowed by policy
    5. Fail honestly with mockup_asset_insufficient

  # V1: Allow supplier fallback while curated assets are being collected
  # TODO: Set to false once curated assets are uploaded
  allowed_fallback_to_supplier: true
  allowed_fallback_to_family: true
  require_curated_for_client_ready: true

