---
# Artie Mockup Asset Registry
# Canonical authority for approved mockup base images
# Authority: agentic-spine
# Owner: @ronny
# Last verified: 2026-03-10

version: 2
description: |
  Registry of curated mockup assets for Artie proof generation.
  Each entry defines an approved base image for a specific style/color/view combination.

  V2: Added supplier provenance tracking to support supplier-backed promotion workflows.
  Registry is DOWNSTREAM of suppliers module — assets are promoted from suppliers OR manually curated.

  V1 seed set: CC1717, PC54, PC78 (hoodie), PC90 (longsleeve)
  Views: front (all), back (where curated exists)

schema:
  required_fields:
    - mockup_asset_id
    - supplier
    - style_code
    - color_name
    - product_family
    - view
    - asset_ref
    - source_type
    - approval_state          # V2: renamed from quality_state
    - placement_profile_id
    - approved_at
    - promoted_from_supplier  # V2: provenance tracking

  optional_fields:
    - color_hex
    - source_url              # V2: original supplier image URL
    - supplier_product_id     # V2: supplier's product ID if promoted
    - promoted_at             # V2: when promotion occurred (if promoted_from_supplier=true)
    - approved_by             # V2: who approved it for client use
    - override_reason         # V2: why manual override/curation was needed

  field_definitions:
    mockup_asset_id: Unique identifier for this mockup asset (style-color-view-version)
    supplier: Supplier name (sanmar, ssactivewear, generic, etc.)
    style_code: Supplier style code (or __family__ for family fallbacks)
    color_name: Human-readable color name
    color_hex: Hex color code for UI display (optional)
    product_family: Product category (tee, hoodie, sweatshirt, longsleeve, etc.)
    view: Mockup view angle (front, back, left, right, etc.)
    asset_ref: Path to asset file in artwork-registry repo
    source_type: How this asset was sourced (curated, supplier_approved, family_fallback)
    approval_state: Current approval status (approved, review, deprecated)
    placement_profile_id: Reference to placement profile in artie.mockup.placement.profiles.yaml
    approved_at: ISO date when asset was approved
    promoted_from_supplier: Boolean - true if auto-promoted from supplier API, false if manually curated
    source_url: Original supplier image URL (for traceability, especially if promoted)
    supplier_product_id: Supplier's product ID (e.g., SanMar product ID) if promoted from supplier
    promoted_at: ISO timestamp when asset was promoted from supplier (if applicable)
    approved_by: Username/agent who approved this asset for client use
    override_reason: Explanation if manual curation/override was needed (e.g., "supplier image low quality")

  source_type_values:
    - curated              # Hand-selected professional mockup (manually curated, NOT from supplier API)
    - supplier_approved    # Supplier image explicitly approved for client use (promoted from supplier)
    - family_fallback      # Generic family-level fallback (use sparingly, manual curation)

  approval_state_values:  # V2: renamed from quality_state_values
    - approved      # Ready for client-facing proofs
    - review        # Under review, not yet approved
    - deprecated    # Replaced by newer asset

  view_values:
    - front
    - back

provenance_workflow:
  description: |
    V2: Mockup registry is DOWNSTREAM of suppliers module, not a parallel product catalog.
    Assets enter the registry via two paths:

    1. SUPPLIER-PROMOTED (promoted_from_supplier: true):
       - Supplier API provides product image (primary_image_url)
       - Promotion capability evaluates image for proof-suitability
       - If approved, asset is promoted to registry with full provenance tracking
       - source_url, supplier_product_id, promoted_at are populated
       - approval_state starts as 'review', operator can upgrade to 'approved'

    2. MANUAL CURATION (promoted_from_supplier: false):
       - Operator manually sources professional mockup (e.g., from supplier website, stock photo, commissioned)
       - Asset is curated, uploaded to artwork-registry, and added to this registry
       - source_url MAY be populated if URL is known (for traceability)
       - supplier_product_id is typically null (unless explicitly linking to supplier product)
       - override_reason MAY explain why manual curation was needed
       - approval_state is set by operator (typically 'approved' for curated assets)

  backward_compatibility: |
    V1 assets (without provenance fields) are treated as manually curated:
    - promoted_from_supplier defaults to false
    - All V1 seed assets were manually curated, not auto-promoted

