fallback_policy:
  description: |
    V2: Fallback behavior depends on proof readiness level (draft vs client-ready).

    Fallback selection order when exact approved asset not found:
    1. Registry asset with approval_state=approved for exact style+color+view (PREFERRED)
    2. Registry asset with approval_state=approved for style+view with color match (if exists)
    3. Family-level fallback (if allowed by policy and proof_readiness permits)
    4. Supplier primary_image_url (if allowed by policy and proof_readiness permits)
    5. Fail honestly with mockup_asset_insufficient

    CLIENT-READY PROOF POLICY:
    - Client-facing proofs (for quote approval, final delivery) MUST use registry assets with approval_state=approved
    - Supplier primary_image_url fallback is NEVER allowed for client-ready proofs
    - Family fallback is NEVER allowed for client-ready proofs
    - If no approved registry asset exists, proof generation should fail with mockup_asset_insufficient

    DRAFT/INTERNAL PROOF POLICY:
    - Draft proofs (operator review, internal testing) MAY fall back to supplier primary_image_url
    - Draft proofs MAY fall back to family-level fallback
    - Fallback is allowed ONLY if explicitly enabled below

  # V2: Strict separation between draft and client-ready proof requirements
  require_exact_match_for_client_proofs: true  # V2: client-ready proofs MUST use registry assets (no fallback)
  allowed_fallback_to_supplier_for_drafts: true  # V2: drafts can use supplier primary_image_url as fallback
  allowed_fallback_to_family_for_drafts: true    # V2: drafts can use family fallback

  # V1 DEPRECATED FLAGS (kept for backward compatibility, ignored in V2 logic)
  # Use require_exact_match_for_client_proofs and allowed_fallback_*_for_drafts instead
  allowed_fallback_to_supplier: true  # DEPRECATED: use allowed_fallback_to_supplier_for_drafts
  allowed_fallback_to_family: true    # DEPRECATED: use allowed_fallback_to_family_for_drafts
  require_curated_for_client_ready: true  # DEPRECATED: use require_exact_match_for_client_proofs

