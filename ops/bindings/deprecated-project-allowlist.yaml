# Deprecated Project Reference Allowlist
# Status: authoritative
# Last verified: 2026-02-13
# Purpose: Explicit list of active files permitted to reference deprecated Infisical
#          secret-authority project names for legacy-readonly or audit reasons.
# Consumed by: D71 gate (surfaces/verify/d71-deprecated-ref-allowlist-lock.sh)
# Policy: Only operator-only scripts that need full project inventory for
#         backup, bootstrap, or testing are allowed. Agent-facing scripts
#         must target active projects only.
#
# To add: append entry with justification. D71 gate enforces this list.

version: 1
updated_at: "2026-02-21"

# Deprecated project names (from secrets.inventory.yaml lifecycle field)
deprecated_projects:
  - mint-os-api
  - finance-stack
  - mint-os-vault
  # mint-os-portal deleted 2026-02-12

# Allowlisted scripts: operator-only tools that legitimately reference
# all project names (including deprecated) for backup/bootstrap/test.
# These scripts have NO agent access path.
allowlist:
  - path: agentic-spine/ops/plugins/providers/bin/infisical-agent.sh
    reason: "Contains deprecated detection/guard system (is_deprecated_project, guard_deprecated_write)"
  - path: workbench/scripts/root/bootstrap-secrets.sh
    reason: "Operator bootstrap: maps all project names to UUIDs for initial provisioning"
  - path: workbench/scripts/root/backup/backup-infisical-secrets.sh
    reason: "Operator backup: exports all projects for disaster recovery"
  - path: workbench/scripts/root/test-infisical.sh
    reason: "Operator test: validates connectivity to all projects"
  - path: workbench/scripts/root/docker-safe.sh
    reason: "Operator utility: references finance-stack as directory/service name (not API call)"
  - path: workbench/scripts/finance/deploy-finance-stack.sh
    reason: "Operator deployment: deploys finance stack to VM 211 (service name reference)"
  - path: workbench/scripts/finance/backup-finance-stack.sh
    reason: "Operator backup: backs up finance stack data (service name reference)"
  - path: workbench/scripts/finance/backup-firefly.sh
    reason: "Operator migration note references legacy finance-stack naming while stack moves to VM 211"
  - path: workbench/scripts/finance/paperless-sync.sh
    reason: "Operator migration note references legacy finance-stack naming while stack moves to VM 211"
  - path: workbench/scripts/finance/scan-to-paperless.sh
    reason: "Operator migration note references legacy finance-stack naming while stack moves to VM 211"
  - path: workbench/scripts/finance/simplefin-daily-sync.sh
    reason: "Operator migration note references legacy finance-stack naming while stack moves to VM 211"
  - path: workbench/scripts/root/aof/workbench-aof-check.sh
    reason: "AOF checker declares deprecated project names as scanner input; declaration path is allowlisted to prevent self-match false positives."
  - path: mint-modules/docs/CANONICAL/NO_LEGACY_COUPLING.md
    reason: "Canonical legacy-boundary doc explicitly names deprecated project paths as forbidden/non-authoritative."
  - path: mint-modules/docs/CANONICAL/ACTIVE_AUTHORITY.md
    reason: "Canonical authority doc explicitly marks legacy mint-os-api authority as non-coupled and non-canonical."
