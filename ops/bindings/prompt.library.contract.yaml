---
schema_version: "1.0"
status: authoritative
owner: "@ronny"
updated_at: "2026-03-29"
scope: prompt-library-governance
decision_loop_id: LOOP-SPINE-PRODUCTIZATION-20260324

description: >
  Governs the Prompt Library — a structured set of immutable execution context
  templates that standardise terminal behaviour across research, review,
  verification, and execution tasks. Templates live in the repo as canonical
  sources and are seeded to .runtime/spine/state/prompts/ at bootstrap, but
  seeded copies are not a live terminal consumption surface today.

contract: prompt.library
version: "1.2"

# ── Architecture ────────────────────────────────────────────────────
architecture:
  canonical_source: ops/plugins/core/session/templates/
  runtime_target: $SPINE_STATE/prompts/
  seeding_capability: prompt.library.bootstrap
  listing_capability: prompt.library.list

  rules:
    - id: immutability
      description: >
        Templates in ops/plugins/core/session/templates/ are the single source
        of truth. Runtime copies in .runtime/ are ephemeral projections seeded
        by the bootstrap capability. Terminals must never edit runtime copies.
    - id: no_doc_sprawl
      description: >
        Templates are formal plugin artifacts, not loose docs. Each template
        is a structured YAML file with machine-evaluable fields, not prose.
    - id: runtime_bound
      description: >
        .runtime/spine/state/prompts/ contains seeded runtime projections from
        the canonical repo templates. Those copies are currently decorative:
        terminals do not read prompt templates from .runtime or directly from
        the repo during execution today.
    - id: schema_enforced
      description: >
        Every template must conform to the template_schema defined below.
        The bootstrap capability validates schema before seeding.
    - id: controller_dual_output
      description: >
        Controller-affinity templates (execution, verification) must require
        dual-output: a human_summary (4-field operator-readable completion)
        and an attestation_envelope (machine-readable proof aligned with the
        broker/request-attestation model). This restores the controller
        boundary contract requirement that the controller emits both
        execution_receipt/response_envelope and attestation.

# ── Template Schema ─────────────────────────────────────────────────
template_schema:
  required_fields:
    - template_id        # unique identifier (e.g., research.context)
    - version            # semver-compatible version string
    - type               # research | review | verification | execution
    - description        # one-line purpose
    - role_affinity       # which role(s) this template is designed for
    - context_dimensions  # structured checklist dimensions
    - output_contract     # what the terminal must produce
  optional_fields:
    - gate_requirements   # gates that must pass when using this template
    - capability_binding  # capabilities this template is designed around
    - authority_refs      # contracts/docs the template draws from

  types:
    research:
      description: >
        Pre-populates investigation dimensions so terminals systematically
        cover topology, retention, auth, backup, dependencies, and contracts
        without manual prompting.
      role_affinity: [controller, translator]
    review:
      description: >
        Structures code/proposal review around scope validation, gate
        compliance, contract compliance, side effects, and rollback.
      role_affinity: [controller]
    verification:
      description: >
        Structures verification runs around gate execution, evidence
        collection, regression checks, and attestation requirements.
      role_affinity: [controller]
    execution:
      description: >
        Structures governed task execution around loop context, authority,
        scope boundaries, verification, and closure criteria.
      role_affinity: [controller]

# ── Lifecycle ───────────────────────────────────────────────────────
lifecycle:
  creation: >
    New templates are added to ops/plugins/core/session/templates/ via
    governed commit. The prompt.registry.yaml is updated to reference
    the new template's prompt_set_id.
  versioning: >
    Template version is bumped on every content change. Old versions
    are not preserved — the canonical source is always current.
  deprecation: >
    Deprecated templates are removed from canonical source and the
    bootstrap capability stops seeding them. Runtime copies are
    cleaned up on next bootstrap.
  validation: >
    The bootstrap capability validates each template against the
    template_schema before writing to .runtime/. Invalid templates
    are rejected with a diagnostic.
