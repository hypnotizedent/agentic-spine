  mode: scheduled
  template_source: spine
  template_path: ops/plugins/infra/host/launchd/com.ronny.alerting-probe-cycle.plist
  contract_required: true
  monitor: true
  intended_node_role: watcher_node
  active_runtime_host: pve-r620
  active_runtime_unit: spine-watcher-alerting-probe-cycle.timer
  runtime_transferred_at: "2026-04-29"
  runtime_transfer_proof: "systemd journal on pve-r620, service exit=0, heartbeat healthy, dispatch_errors=0"
  purpose: "Infra health monitoring and incident dispatch (15m cycle)"
