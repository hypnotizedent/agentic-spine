  classified_beyond_audit_scope: true
  classified_beyond_audit_justification: Recurring headless storage-surface sync is an L1 execution_host maintenance job.
  cross_repo_dependency:
    repo: workbench
    resolver: SPINE_FOUNDATION_ROOT
    invoked_path: scripts/root/operator/install-client-storage-surfaces.sh
    note: Mount scripts and installer live in workbench repo. Requires workbench checkout for initial setup; runtime sync uses rclone remotes.
  operator_console_dependency:
    watched_paths:
      - "~/Operator Sync/Mint/operator-drop/"
      - "~/Operator Sync/Archives/"
    note: Watches operator-console drop-folder paths. On execution_host, these paths must exist and be writable. Workload is honest as execution_host only when drop-folders are accessible from the execution surface.
  runtime_dependencies:
    - rclone
    - jq
