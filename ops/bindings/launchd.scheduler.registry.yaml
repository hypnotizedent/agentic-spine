scope: launchd-scheduler-registry
updated_at: 2026-04-26
schedule_timezone: America/New_York
subordinate_to: ops/bindings/launchd.runtime.contract.yaml

# Kernel primitive role: The proof_channel fields on each label are the
# canonical realization of the HEARTBEAT primitive for standing programs.
# Heartbeat = liveness timestamp + proof channel + staleness threshold.
# See docs/governance/KERNEL_PRIMITIVE_CANON.md §3 for protocol semantics.
paths:
  spine_templates: $SPINE_REPO/ops/plugins/infra/host/launchd
  live_launchagents: $HOME/Library/LaunchAgents
  canonical_log_root: $SPINE_LOGS
  note: Paths use resolver variables. On macOS, resolve via runtime-paths.sh. On Linux, via /etc/spine/execution-host.env.
labels:
