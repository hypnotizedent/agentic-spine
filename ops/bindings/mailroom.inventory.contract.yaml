# Mailroom Inventory Contract
#
# Classifies mailroom surfaces into authority/projection/runtime/ephemeral tiers.
# Decision: LOOP-MAILROOM-2-0-PLANS-LIFECYCLE-CANONICAL-FIX-20260303
#
# Namespace semantics:
#   All `mailroom/state/*` paths below are LOGICAL resolver-facing paths.
#   They are NOT repo-local physical paths.
#   At runtime, `spine_resolve_mailroom_path()` in ops/lib/runtime-paths.sh
#   externalizes them to `$SPINE_STATE/*` (canonical: ~/code/.runtime/spine/state/*).
#
# Convergence note (2026-03-28):
#   Legacy physical residue under `.runtime/spine/mailroom/state/` was converged
#   into the canonical `$SPINE_STATE/` root. The physical `mailroom/state/` directory
#   has been removed. The logical namespace below is preserved unchanged because
#   it describes resolver-facing semantics, not physical layout.
#
# Runtime/evidence boundary:
#   Mailroom paths are runtime and evidence carriers for execution pickup. They
#   do not define workflow authority. Loops, waves, packets, gaps, friction, and
#   receipt classes keep their existing canonical homes; mailroom/runtime may
#   carry custody and liveness for execution, but it does not own those objects'
#   meaning or closeout authority.
#
# Authority boundary:
#   This file owns logical namespace classification only. The autonomous worker
#   route policy, claim/heartbeat/result/failure semantics, and bounded
#   agent_tool bridge scope live in ops/bindings/mailroom.task.worker.contract.yaml.

status: authoritative
version: "1.1"
updated_at: "2026-03-28"
owner: "@ronny"
scope: mailroom-inventory-classification

authority_scope:
  owns:
    - logical_mailroom_namespace_classification
    - resolver_facing_path_categories
    - repo_local_runtime_pollution_boundary
  does_not_decide:
    - autonomous_worker_capability_allowlist
    - route_target_taxonomy
    - node_admission
    - runtime_placement
    - loop_wave_packet_gap_meaning_or_closeout_authority
  canonical_worker_contract: ops/bindings/mailroom.task.worker.contract.yaml

categories:
  authority:
    description: Canonical runtime authority sources.
    paths:
      - mailroom/state/shared_authority.db

  projection:
    description: Generated/read-optimized projections from authority state.
    paths:
      - mailroom/state/plans/index.yaml
      - mailroom/state/plans/PLAN-*.md
      - mailroom/state/plans/_orphans/*.md

  runtime:
    description: Runtime/evidence carriers consumed by orchestrators and workers; not workflow authority.
    paths:
      - mailroom/state/path.claims.yaml
      - mailroom/state/traffic.index.yaml
      - mailroom/state/friction-queue.ndjson
      - mailroom/state/loop-scopes/*.scope.md
      - mailroom/outbox/proposals/**

  ephemeral:
    description: Session/temporary lifecycle artifacts.
    paths:
      - mailroom/state/sessions/**
      - mailroom/logs/**
      - mailroom/state/locks/**

policy:
  write_path_lock:
    enforce: true
    governed_projection_surfaces:
      - mailroom/state/plans/index.yaml
      - mailroom/state/plans/PLAN-*.md
    mutation_entrypoints:
      - planning.plans.create
      - planning.plans.promote
      - planning.plans.retire
      - planning.plans.reconcile
      - planning.plans.archive
      - state.shared.reconcile
