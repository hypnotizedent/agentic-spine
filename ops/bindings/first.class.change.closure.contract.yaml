status: authoritative
owner: "@human-steward"
created: "2026-04-29"
scope: first-class-change-closure

contract_id: FIRST_CLASS_CHANGE_CLOSURE_V1

purpose: >
  Prevent first-class improvements from increasing spine bloat by requiring
  every promoted L1/L2 surface, adapter, binding, readback, or governance rule
  to name what it replaces, what remains compatibility-only, and what must be
  retired or hidden before the work may be called done.

applies_when:
  - adding_or_promoting_L1_kernel_surface
  - adding_or_promoting_L1_engine_surface
  - adding_or_promoting_L2_shared_adapter_or_readback
  - changing_operator_entry_or_human_intent_flow
  - promoting_node_appliance_service_or_vm_runtime_truth
  - replacing_a_legacy_mailroom_operator_ingress_or_runtime_surface
  - creating_a_new_canonical_status_or_truth_readback

does_not_apply_when:
  - narrow_bug_fix_without_new_surface_or_authority_claim
  - pure_generated_projection_refresh
  - documentation_copyedit_that_does_not_change_contract_truth

closure_required_fields:
  authority_research_trace:
    question: "Which existing authoritative surfaces, gates, capabilities, and recent commits were read before proposing or implementing this repo change?"
    required: true
  existing_home_precheck:
    question: "Which existing L1/L2 home owns this concern, and why is this not a new subsystem?"
    required: true
  cross_plane_pre_mutation_check:
    question: "Which identity, runtime, storage, backup, watcher/observability, projection, and retirement readbacks were checked before mutation?"
    required: true
  canonical_authority:
    question: "What is the one authority after this change?"
    required: true
  replaced_surfaces:
    question: "What old surfaces, fields, wrappers, vocabulary, or readbacks does this supersede?"
    required: true
    empty_allowed_only_with_reason: true
  compatibility_surfaces:
    question: "What remains alive only for compatibility or drilldown, and who is allowed to use it?"
    required: true
  subtraction_actions:
    question: "What was deleted, retired, hidden from operator grammar, or demoted to projection?"
    required: true
    empty_allowed_only_with_reason: true
  operator_readback_effect:
    question: "How does the normal operator/status readback change so the old model stops being taught?"
    required: true
  agent_entry_effect:
    question: "What should a fresh agent read or run to discover the new canonical path?"
    required: true
  legacy_backfill_disposition:
    question: "How are old items reconciled without creating a second system?"
    required: true
  verification_lock:
    question: "Which verify gate or capability self-check prevents regression?"
    required: true

rules:
  - id: research_existing_authority_before_change
    statement: >
      Agents must research and cite existing authoritative homes before
      proposing or implementing a repo change. If an existing canonical surface
      can absorb the work, the change must extend that surface instead of
      creating a peer subsystem.
  - id: human_intent_is_input_not_authority
    statement: >
      Human intent, examples, and packet prose are provenance, acceptance input,
      and scope evidence. They become actionable only through the existing
      governed home that owns the concern; they do not override contracts,
      capability readbacks, or authority bindings by themselves.
  - id: examples_do_not_define_scope
    statement: >
      Example nouns such as a Pi, Frigate, Dell, VM, or appliance illustrate a
      class of work. If the surrounding request asks for a systemic pattern,
      agents must identify the L1/L2 family first and must not narrow the work
      to the example-specific surface.
  - id: cross_plane_readback_before_mutation
    statement: >
      Promotion of node, appliance, service, or VM runtime truth must begin with
      the existing identity, runtime, storage, backup, watcher/observability,
      projection, and retirement surfaces. If those planes disagree, the work is
      a promotion closure problem, not permission to build an adapter.
  - id: canonical_replacement_must_subtract
    statement: >
      A first-class replacement is not done when the new path works. It is done
      when the old path is deleted, retired, hidden, or explicitly demoted to
      compatibility/projection.
  - id: compatibility_is_not_peer_truth
    statement: >
      Compatibility surfaces may remain only when named as compatibility and
      excluded from normal operator grammar. They must not read back as peers of
      the canonical surface.
  - id: backfill_must_use_new_authority
    statement: >
      Historical reconciliation must use the new canonical authority. Do not
      create a parallel catchup/backfill system unless the human steward
      explicitly promotes that system and names what it retires.
  - id: status_must_stop_teaching_old_model
    statement: >
      If an old readback keeps presenting legacy terms as current truth after a
      canonical replacement lands, the change is incomplete.
  - id: verify_must_guard_subtraction
    statement: >
      Any new first-class authority must have a small regression guard that
      proves both the new path and the retirement/demotion boundary remain
      discoverable.

adoption_record_policy:
  status: active
  purpose: >
    First-class L1/L2 surface promotions and forward corrections must leave a
    durable closure-adoption record in the existing owning binding or capability
    metadata when packet prose or closeout did not already answer the closure
    fields. The record cites the original packet and records the correction
    forward; it does not rewrite historical packets, receipts, or commits.
  required_record_fields:
    - packet_id
    - recorded_by_packet
    - adoption_status
    - owning_binding
    - first_class_surface_family
    - canonical_surface
    - authority_research_trace
    - existing_home_precheck
    - cross_plane_pre_mutation_check
    - canonical_authority
    - replaced_surfaces
    - compatibility_surfaces
    - subtraction_actions
    - operator_readback_effect
    - agent_entry_effect
    - legacy_backfill_disposition
    - verification_lock
  allowed_record_homes:
    - existing_owning_binding
    - existing_capability_metadata
  rules:
    - id: record_forward_do_not_rewrite_history
      statement: >
        A missed adoption is repaired by a forward record in the owning home,
        not by editing closed packet bodies, loop closeouts, receipts, or commit
        history to simulate original compliance.
    - id: record_rows_are_verified
      statement: >
        Existing owning verifiers, especially D445 for first-class closure,
        must validate adoption records and fail when required fields, named
        replacement surfaces, or verification locks disappear.

operator_language:
  construction_done: "the new path exists and passes tests"
  real_done: "the new path is canonical, old truth is retired or demoted, normal readback teaches only the canonical model, and verify guards the boundary"
