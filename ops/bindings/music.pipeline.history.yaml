    service_topology:
      download-stack: [lidarr, slskd, soularr, sabnzbd, qbittorrent, swaparr-lidarr]
      streaming-stack: [navidrome, spotisub, jellyfin]
    issues:
      - "slskd + soularr on download-stack, Navidrome on streaming-stack — split architecture"
      - "VPN provider churn: ProtonVPN → Privado within same session"
