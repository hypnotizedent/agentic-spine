# Music Pipeline Archaeology — Full History
# Status: reference
# Owner: "@ronny"
# Scope: Complete history of the music pipeline across all eras
# Generated: 2026-03-24 from forensic trace of ronny-ops, git history, and live runtime

version: 1
owner: "@ronny"
created: "2026-03-24"

eras:
  - id: legacy-ronny-ops
    period: "pre-2026-02-08"
    source: "/Users/ronnyworks/ronny-ops/ (READ-ONLY legacy)"
    compose_file: "ronny-ops/media-stack/docker-compose.yml"
    services:
      lidarr:
        image: "lscr.io/linuxserver/lidarr:latest"
        port: 8686
        paths:
          config: "${DOCKER_VOLUMES}/lidarr/config"
          music: "${MEDIA_PATH}/music"
          downloads: "${DOWNLOADS_PATH}"
        quality_profiles: [Standard, Lossless, Any]
        dependencies: [prowlarr]
      navidrome:
        image: "deluan/navidrome:latest"
        port: 4533
        public_url: "https://music.ronny.works"
        paths:
          data: "${DOCKER_VOLUMES}/navidrome"
          music: "${MEDIA_PATH}/music (read-only)"
        scan_schedule: 15m
        transcoding: {format: opus, bitrate: 192kbps, cache: 150MB}
        integrations:
          spotify: {env_keys: [ND_SPOTIFY_ID, ND_SPOTIFY_SECRET]}
          lastfm: {env_keys: [ND_LASTFM_APIKEY, ND_LASTFM_SECRET]}
          lrclib: {env_keys: [ND_LRCLIB_URL], url: "https://lrclib.net"}
      slskd:
        image: "slskd/slskd:latest"
        ports: [5030, 50300]
        paths:
          app_data: "${DOCKER_VOLUMES}/slskd"
          music: "${MEDIA_PATH}/music"
          downloads: "${DOWNLOADS_PATH}/slskd"
        env_keys: [SLSKD_REMOTE_CONFIGURATION]
      soularr:
        image: "mrusse08/soularr:latest"
        paths:
          config: "${DOCKER_VOLUMES}/soularr"
          downloads: "${DOWNLOADS_PATH}/slskd"
          music: "${MEDIA_PATH}/music"
        env_keys: [SCRIPT_INTERVAL]
        polling: 300s
        dependencies: [slskd, lidarr]
      spotisub:
        image: "blastbeng/spotisub:latest"
        port: 5183
        paths:
          cache: "${DOCKER_VOLUMES}/spotisub/cache"
        env_keys: [SPOTIFY_ID, SPOTIFY_SECRET, SUBSONIC_API_HOST, SUBSONIC_API_PORT, SUBSONIC_API_USER, SUBSONIC_API_PASS]
        connection: "http://navidrome:4533"
    integrations_configured:
      - "Lidarr → Prowlarr (indexer management)"
      - "Lidarr → SABnzbd (usenet downloads)"
      - "Soularr → Lidarr (wanted list) + slskd (soulseek grabs)"
      - "Spotisub → Spotify (playlists) + Navidrome (subsonic API)"
      - "Navidrome → Spotify (artist metadata) + Last.fm (scrobbling) + LRClib (lyrics)"
    issues:
      - "All services on single media-stack VM — no separation of concerns"
      - "Infisical secrets management for API keys"

