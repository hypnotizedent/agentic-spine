---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mailroom-runtime-ensure
version: 1
updated_at: 2026-03-12

mounts:
  - id: mintfiles
    label: com.ronnyworks.mintfiles.mount
    mountpoint: /Users/ronnyworks/MinIO
    expected_entries:
      - artwork-intake
      - artwork-output
      - artwork-registry
      - client-assets
  - id: archives
    label: com.ronnyworks.archives.mount
    mountpoint: /Users/ronnyworks/Archives
    expected_entries:
      - Hypnotized
      - Legacy
      - mint-legacy

watcher:
  label: com.ronny.agent-inbox
  restart_bin: ops/plugins/core/agent/bin/agent-restart.sh

worker:
  bin: ops/plugins/infra/mailroom-bridge/bin/mailroom-task-worker
  fresh_tick_timeout_seconds: 20
  stale_status_seconds: 900
  status_file: ${SPINE_STATE}/mailroom-task-worker.status.json
  pid_file: ${SPINE_STATE}/mailroom-task-worker.pid

tasks:
  reconcile_bin: ops/plugins/core/handoff/bin/session-handoff-task-reconcile
  running_stale_seconds: 300

recovery:
  launchd_restart_bin: ops/plugins/core/recovery/bin/recovery-launchd-restart
  launchctl_bin: launchctl
