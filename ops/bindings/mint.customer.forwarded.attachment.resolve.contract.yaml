---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mint-customer-forwarded-attachment-resolve
version: 1

surface:
  capability: mint.customer.forwarded.attachment.resolve
  operator_terminal: MINT-MORPHEUS-01
  description: Resolve a forwarded customer/vendor attachment through the governed Microsoft path, pick the likely current intended version, and place it canonically.

storage:
  downloads_root: "$SPINE_STATE/mint/forwarded-attachments/downloads"
  records_root: "$SPINE_STATE/mint/forwarded-attachments/records"
  index_file: "$SPINE_STATE/mint/forwarded-attachments/index.ndjson"
  lock_file: "$SPINE_STATE/locks/mint-forwarded-attachments.lock"

selection_policy:
  source_message_preference: true
  microsoft_attachment_list_capability: microsoft.mail.attachments.list
  microsoft_attachment_download_capability: microsoft.mail.attachment.download
  canonical_place_capability: mint.artwork.place
  ambiguity_margin_score: 4
  minimum_confident_score: 14
  preferred_extensions:
    - pdf
    - ai
    - eps
    - svg
    - cdr
  positive_version_tokens:
    - final
    - latest
    - current
    - approved
    - revision
    - corrected
    - updated
  negative_version_tokens:
    - bad
    - wrong
    - old
    - previous
    - superseded
    - draft

notes:
  - Prefer the attachment visible on the forwarded source message before thread archaeology.
  - If multiple plausible versions remain, ask one concise version-selection question instead of guessing.
