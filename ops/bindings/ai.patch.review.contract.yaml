status: authoritative
owner: "@human-steward"
scope: ai-patch-review-promotion
updated: "2026-05-02"

purpose: >
  Controller-owned review lane for AI bridge V2.5 patch-apply sandbox receipts.
  The AI/provider remains text-only. Patch promotion starts from an existing
  V2.5 task envelope and moves the proven patch into a governed review
  worktree for controller/human review. This contract does not authorize
  automatic merge, push, or provider tools.

authority:
  owns:
    - v2_5_patch_review_lifecycle
    - patch_receipt_validation
    - review_worktree_materialization
    - review_final_state_truth
    - review_rejection_receipts
    - controller_confirmed_merge_receipts
  does_not_decide:
    - provider_tool_access
    - automatic_merge
    - production_mutation
    - node_or_runtime_placement

lifecycle:
  states:
    proposed:
      source: "V2.5 task envelope with bridge_proof.scope=tool_using_agent_v2_5_patch_apply_sandbox"
    sandbox_verified:
      required_proof:
        - patch_apply_status: applied
        - sandbox_cleanup: removed
        - sandbox_worktree_retained: false
        - expected_patch_files_equals_actual_patch_files: true
        - side_effect_files_empty: true
        - push_performed: false
        - merge_performed: false
    needs_controller_review:
      public_readback: execution.pickup.status
      review_state: needs_controller_review
      substrate_truth: "No review receipt exists yet; patch artifact from the V2.5 task is durable."
    review_worktree_active:
      capability: ai.patch.review.promote
      review_state: review_worktree_active
      mutation_scope: controller_review_worktree_only
      substrate_truth: "review_worktree directory exists; review_commit is reachable; no push or merge."
    review_artifact_retained:
      review_state: review_artifact_retained
      mutation_scope: none
      substrate_truth: "review worktree/branch are absent or historical; patch_artifact_path exists and is the durable review substrate."
    rejected_by_controller:
      capability: ai.patch.review.reject
      review_state: rejected_by_controller
      mutation_scope: none
      substrate_truth: "terminal rejection receipt exists; no review worktree required."
    merged_by_controller:
      capability: ai.patch.review.merge
      review_state: merged_by_controller
      mutation_scope: controller_confirmed_merge_only
      substrate_truth: "push_sha is recorded and reachable from origin/main; confirmation is explicit; AI authority remains none."
    superseded:
      status: reserved
      review_state: superseded
      note: "Terminal state for a patch replaced by a later patch."
    stale:
      status: reserved
      review_state: stale
      note: "Terminal state for an aged-out review with no controller decision."

review_worktree:
  root: "$SPINE_RUNTIME_ROOT/tmp/worktrees/agentic-spine"
  source_ref: origin/main
  wave_prefix: WAVE-AI-PATCH-REVIEW-
  branch_prefix: codex/WAVE-AI-PATCH-REVIEW-
  lease_filename: ".spine-lane-lease.yaml"
  lease_ttl_hours: 24
  lifecycle_contract: ops/bindings/worktree.lifecycle.contract.yaml
  creation_surface: "ops wave start"
  cleanup: "when a review worktree is pruned, readback must transition to review_artifact_retained if the patch artifact still exists"

receipts:
  root: "$SPINE_STATE/domain-state/ai-patch-reviews"
  active_status: review_worktree_active
  retained_status: review_artifact_retained
  rejected_status: rejected_by_controller
  merged_status: merged_by_controller
  required_common_fields:
    - review_id
    - task_id
    - source_task_file
    - patch_artifact_path
    - expected_patch_files
    - actual_patch_files
    - side_effect_files
    - push_performed
    - merge_performed
  active_required_fields:
    - review_worktree
    - review_branch
    - review_commit
    - verify_command
    - verify_rc
    - worktree_status
  retained_required_fields:
    - patch_artifact_path
  rejected_required_fields:
    - rejection_reason
  merged_required_fields:
    - confirmed_by
    - confirmation
    - base_sha
    - merge_commit
    - push_sha
    - pushed_ref
    - verify_results

merge_approval:
  capability: ai.patch.review.merge
  required_confirmation: MERGE
  allowed_source_states:
    - review_artifact_retained
  default_verify_capabilities:
    - verify.engine.run
    - spine.verify
  author_name: SPINE-CONTROLLER
  author_email: spine-controller@localhost
  push_ref: origin/main
  ai_authority: none
  public_readback: execution.pickup.status

stop_lines:
  - "No provider shell/filesystem/git/ops-cap authority."
  - "No AI/provider push."
  - "No AI/provider merge."
  - "No merge or push without explicit controller confirmation."
  - "No commit outside the local controller review branch."
  - "No mutation outside the controller review worktree."
  - "Rejected patches write receipts only."
