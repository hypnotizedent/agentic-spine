# VM Lifecycle Binding (SSOT)
# Non-secret. Spine-native. Tracks every Proxmox VM through its lifecycle.
# Status: authoritative
# Last verified: 2026-03-22
#
# Contract: docs/core/VM_CREATION_CONTRACT.md
# Authority: This binding is the per-VM state tracker. Site hardware specs
#            live in ops/bindings/hardware.inventory.yaml. Service mappings live in
#            probe.registry.yaml. Current site / placement truth lives in
#            ops/bindings/infra.placement.policy.yaml. This binding answers:
#            "what VMs exist, what phase are they in, and what do they host?"
#
# Read path:
#   - VM existence, lifecycle, workload, and backup binding: this file
#   - VM site / placement truth: ops/bindings/infra.placement.policy.yaml
#
# Status values: planning | provisioned | registered | active | residual | decommissioned | abandoned
# Closure classes: optional per-row refinement for decommissioned guests when the
# status enum must stay stable for existing consumers.
# Decommission policies: requires_migration_first | requires_final_backup | allow_immediate_destroy
#
# Residual: VM is running but its canonical role has migrated elsewhere.
#   Services may still be active for fallback or reference but are no longer
#   the authoritative instance. Residual VMs are candidates for decommission
#   once the replacement has proven stable.

