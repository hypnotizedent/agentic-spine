# Status: authoritative
# Last verified: 2026-02-13

version: 1
updated_at: "2026-02-07"
owner: "@operator"

host_root: "$HOME"
code_root: "$HOME/code"
spine_root: "$SPINE_ROOT"
workbench_root: "$WORKBENCH_ROOT"
legacy_root: "$HOME/ronny-ops"

active_config_files:
  - "$HOME/.zshrc"
  - "$HOME/.codex/AGENTS.md"
  - "$HOME/.config/opencode/OPENCODE.md"
  - "$HOME/.config/opencode/commands/ctx.md"
  - "$HOME/.claude/commands/ctx.md"
  - "$HOME/.claude/commands/gaps.md"
  - "$HOME/.claude/commands/verify.md"
  - "$HOME/.claude/settings.local.json"
  - "$HOME/.claude/settings.json"
  - "$HOME/.claude/CLAUDE.md"

forbidden_config_files:
  - "$HOME/.claude.md"
  - "$HOME/.claude/settings.json.backup"
  - "$HOME/.config/ronny-ops/env.sh"
  - "$HOME/mint-Modules-WORKSPACE-PLAN.md"

allowed_hidden_tool_roots:
  - "$HOME/.codex"
  - "$HOME/.claude"
  - "$HOME/.config/opencode"
  - "$HOME/.config/infisical"
  - "$HOME/.cache"
  - "$HOME/.archive"

scan_exclusions:
  - "$HOME/.Trash"
  - "$HOME/Library"

# ─────────────────────────────────────────────────────────────
# D41: Hidden-root governance (added LOOP-HOST-CANONICALIZATION-20260207)
# ─────────────────────────────────────────────────────────────

# Allowed-if-present (NOT must-exist). Absent entries are OK.
# Items on disk NOT in any list (managed/volatile/excluded) → unmanaged → fail.
managed_hidden_roots:
  - "$HOME/.codex"
  - "$HOME/.claude"
  - "$HOME/.config/opencode"
  - "$HOME/.config/infisical"
  - "$HOME/.config/agentic-spine"
  - "$HOME/.config"
  - "$HOME/.config/espanso"
  - "$HOME/.archive"
  - "$HOME/.cache"
  - "$HOME/.docker"
  - "$HOME/.ssh"
  - "$HOME/.pyenv"
  - "$HOME/.npm"
  - "$HOME/.npm-global"
  - "$HOME/.bun"
  - "$HOME/.vscode"
  - "$HOME/.ollama"
  - "$HOME/.cursor"
  - "$HOME/.copilot"
  - "$HOME/.skills"
  - "$HOME/.claude-worktrees"
  - "$HOME/.claude-server-commander"
  - "$HOME/.wakatime"
  - "$HOME/.local"
  - "$HOME/.gitconfig"
  - "$HOME/.zshrc"
  - "$HOME/.zprofile"
  - "$HOME/.zsh_sessions"
  - "$HOME/.hammerspoon"
  - "$HOME/.raycast-scripts"
  - "$HOME/.antigravity"
  - "$HOME/.infisical"
  - "$HOME/.zsh_history"

# Forbidden hidden patterns (Tier 2 recursive scan under $HOME)
# Matched relative to host_root. Catches nested artifacts like env.sh.
forbidden_hidden_patterns:
  - ".config/ronny-ops/*"
  - ".claude/projects/*ronny-ops*"
  - ".claude-worktrees/ronny-ops*"
  - ".hammerspoon.backup-*"
  - ".hammerspoon.moved-*"
  - ".raycast-scripts.backup-*"
  - ".config/espanso.backup-*"
  - ".config/espanso.moved-*"

# Volatile: tolerated transients that do NOT fail the gate
volatile_hidden_patterns:
  - ".wt"
  - ".claude.json.backup*"
  - ".claude.json.tmp.*"
  - ".DS_Store"
  - ".bashrc"
  - ".bash_history"
  - ".lesshst"
  - ".psql_history"
  - ".viminfo"
  - ".python-version"
  - ".claude.json"
  - ".CFUserTextEncoding"
  - ".claude-server-commander-logs"
  - ".android"
  - ".anydesk"
  - ".DDLocalBackups"
  - ".DDPreview"
  - ".gem"
  - ".gemini"
  - ".hyper_plugins"
  - ".hyper.js"
  - ".idlerc"
  - ".mc"
  - ".minirc.dfl"
  - ".npmrc"
  - ".oracle_jre_usage"
  - ".profile"
  - ".putty"
  - ".redhat"
  - ".SoulseekQt"
  - ".zshrc.backup-*"
