# Topology Closure Graph — Canonical cross-surface topology authority
# Status: authoritative
# authority_state: authoritative
# authority_concern: topology_closure_surfaces
# Last verified: 2026-03-21
#
# Purpose: Unified site→VM→service→endpoint graph that enables compound
# closure operations (relocation, backup locality, lifecycle transitions).
# All other surfaces (services.health, agents.registry, secrets.bundle,
# domain.routing) should DERIVE endpoint addresses from this graph via
# endpoint-resolve.sh instead of hardcoding IPs.
#
# Authority chain:
#   topology.sites.yaml   → site definitions (LAN CIDR, vmid_range)
#   vm.lifecycle.yaml      → VM identity, status, IP assignments
#   ssh.targets.yaml       → SSH resolution + access_policy
#   SERVICE_REGISTRY.yaml  → service→host→port→health mappings
#   This file              → closure graph edges + resolution contract
#
# This file does NOT duplicate data from its sources. It defines:
#   1. The graph model (node types, edge types, invariants)
#   2. Service endpoint descriptors (port, path, protocol) for resolution
#   3. Dependency edges between services
#   4. Closure surface bindings (what must change together)
#
# Consumer: ops/lib/endpoint-resolve.sh

version: 1
updated_at: "2026-03-21"
owner: "@ronny"
status: authoritative
authority_state: authoritative
scope: topology-closure-graph

# ═══════════════════════════════════════════════════════════════
# Graph Model
# ═══════════════════════════════════════════════════════════════

graph_model:
  node_types:
    site:
      authority: ops/bindings/topology.sites.yaml
      key_field: id
      description: "Physical location with LAN CIDR and Proxmox host"
    vm:
      authority: ops/bindings/vm.lifecycle.yaml
      key_field: hostname
      description: "Proxmox VM or LXC with lifecycle status"
    service:
      authority: docs/governance/SERVICE_REGISTRY.yaml
      key_field: service_id
      description: "Docker container or native service with port/health"
    ssh_target:
      authority: ops/bindings/ssh.targets.yaml
      key_field: id
      description: "SSH resolution target with access_policy"

  edge_types:
    site_hosts_vm:
      from: site
      to: vm
      resolved_by: "vm.proxmox_host maps to site.proxmox_alias"
    vm_runs_service:
      from: vm
      to: service
      resolved_by: "SERVICE_REGISTRY.yaml host field matches vm.hostname"
    vm_has_ssh_target:
      from: vm
      to: ssh_target
      resolved_by: "vm.ssh_target matches ssh_target.id"
    service_depends_on:
      from: service
      to: service
      resolved_by: "dependency_edges below"
    service_backed_by:
      from: service
      to: vm
      resolved_by: "cross-VM data dependencies (e.g. mint-apps → mint-data)"

  invariants:
    - "Every active service has exactly one hosting VM"
    - "Every VM has exactly one site"
    - "Every VM with health_probe_policy != none has an ssh_target"
    - "Endpoint resolution uses ssh_target access_policy, never hardcoded IPs"
    - "Service moves require closure across all bound surfaces"

