# ═══════════════════════════════════════════════════════════════
# Dependency Edges
# ═══════════════════════════════════════════════════════════════
#
# Cross-VM data dependencies. When the upstream moves, the downstream
# must update its connection endpoint.

dependency_edges:
  # Mint apps → Mint data plane
  - from: files-api
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: files-api
    to: mint-modules-minio
    type: object_store
    cross_vm: true
  - from: quote-page
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: order-intake
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: finance-adapter
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: finance-adapter
    to: firefly-iii
    type: api
    cross_vm: true
  - from: auth
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: auth
    to: mint-modules-redis
    type: cache
    cross_vm: true
  - from: pricing
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: suppliers
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: shipping
    to: mint-modules-postgres
    type: database
    cross_vm: true
  - from: payment
    to: mint-modules-postgres
    type: database
    cross_vm: true

  # Media arr stack → media library (NFS from pve)
  - from: radarr
    to: sonarr
    type: coordination
    cross_vm: false
  - from: prowlarr
    to: radarr
    type: indexer
    cross_vm: false
  - from: prowlarr
    to: sonarr
    type: indexer
    cross_vm: false
  - from: prowlarr
    to: lidarr
    type: indexer
    cross_vm: false

  # Streaming → download (cross-VM media requests)
  - from: jellyseerr
    to: radarr
    type: request_fulfillment
    cross_vm: true
  - from: jellyseerr
    to: sonarr
    type: request_fulfillment
    cross_vm: true
  - from: bazarr
    to: radarr
    type: subtitle_sync
    cross_vm: true
  - from: bazarr
    to: sonarr
    type: subtitle_sync
    cross_vm: true

  # Surveillance → HA integration
  - from: frigate
    to: home-assistant
    type: mqtt_integration
    cross_vm: true

  # Observability → all (scrape targets)
  - from: prometheus
    to: grafana
    type: datasource
    cross_vm: false

  # Mail archiver → stalwart
  - from: mail-archiver
    to: stalwart-mail
    type: imap_fetch
    cross_vm: false

# ═══════════════════════════════════════════════════════════════
# Closure Surface Bindings
# ═══════════════════════════════════════════════════════════════
#
# When a service moves, these are the surfaces that must be updated.
# Each surface references the file that contains the hardcoded truth
# that the closure compiler must patch.

closure_surfaces:
  ingress:
    description: "CF tunnel routes, public DNS, domain routing"
    authority: ops/bindings/domain.routing.registry.yaml
    contains_hardcoded_ips: true
    resolution_contract: "target_hint must resolve via endpoint-resolve.sh"

  transport:
    description: "SSH targets and access policies"
    authority: ops/bindings/ssh.targets.yaml
    contains_hardcoded_ips: true
    resolution_contract: "host and tailscale_ip fields are source of truth for IP resolution"

  health:
    description: "Service health probes"
    authority: ops/bindings/services.health.yaml
    contains_hardcoded_ips: true
    resolution_contract: "PROJECTION — must be regenerated from SERVICE_REGISTRY.yaml"
    generator: service.registry.projection.build

  agents:
    description: "Agent endpoint bindings"
    authority: ops/bindings/agents.registry.yaml
    contains_hardcoded_ips: true
    resolution_contract: "endpoint URLs must resolve via endpoint-resolve.sh"

  secrets:
    description: "Secret bundle verification endpoints"
    authority: ops/bindings/secrets.bundle.contract.yaml
    contains_hardcoded_ips: true
    resolution_contract: "verify URLs must resolve via endpoint-resolve.sh"

  backup_locality:
    description: "Backup target assignments and locality"
    authority: ops/bindings/backup.inventory.yaml
    contains_hardcoded_ips: false
    resolution_contract: "backup_target field on vm.lifecycle.yaml; locality from backup.locality.contract.yaml"

  vm_lifecycle:
    description: "VM and service lifecycle state"
    authority: ops/bindings/vm.lifecycle.yaml
    contains_hardcoded_ips: true
    resolution_contract: "lan_ip and tailscale_ip are source IPs; service list tracks what runs where"

  data_roots:
    description: "Service data lifecycle roots"
    authority: ops/bindings/service.data.lifecycle.registry.yaml
    contains_hardcoded_ips: false
    resolution_contract: "host fields reference ssh_target IDs, not raw IPs"

# ═══════════════════════════════════════════════════════════════
# Resolution Contract
# ═══════════════════════════════════════════════════════════════

resolution_contract:
  resolver_library: ops/lib/endpoint-resolve.sh
  ssh_resolver_library: ops/lib/ssh-resolve.sh
  resolution_chain:
    - step: 1
      action: "Look up service_id in service_endpoints above"
      yields: "host_ref, port, health_path, protocol"
    - step: 2
      action: "Resolve host_ref through ssh.targets.yaml via ssh-resolve.sh"
      yields: "resolved_ip, path_used (lan|tailscale|direct|unreachable)"
    - step: 3
      action: "Construct URL: {protocol}://{resolved_ip}:{port}{health_path}"
      yields: "fully resolved endpoint URL"
  anti_patterns:
    - "Hardcoding LAN IPs (192.168.x.x) in binding files"
    - "Hardcoding Tailscale IPs (100.x.x.x) in binding files"
    - "Resolving endpoints without consulting access_policy"
    - "Duplicating port/path info outside SERVICE_REGISTRY.yaml"
