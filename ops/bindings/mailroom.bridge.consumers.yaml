---
status: authoritative
owner: "@ronny"
last_verified: 2026-02-28
scope: mailroom-bridge-consumers
version: 1
updated_at: "2026-02-18"

# SSOT for Cap-RPC consumer access:
# - cap_rpc.allowlist: capabilities permitted for HTTP /cap/run
# - cap_rpc.roles: token-scoped RBAC subsets of the allowlist
#
# Canonical sync path:
#   bash ops/plugins/infra/mailroom-bridge/bin/mailroom-bridge-consumers-sync
#
# Canonical verification path (drift gate):
#   D116 mailroom-bridge-consumers-registry-lock

cap_rpc:
  allowlist:
    - spine.verify
    - surface.mobile.dashboard.status
    - gaps.status
    - loops.status
    - proposals.status
    - policy.runtime.audit
    - tenant.storage.audit
    - version.compat.verify
    - evidence.export.plan
    - surface.readonly.audit
    - mailroom.bridge.status
    - mailroom.task.enqueue
    - mailroom.task.claim
    - mailroom.task.heartbeat
    - mailroom.task.complete
    - mailroom.task.fail
    - aof.status
    - aof.version
    - aof.policy.show
    - aof.tenant.show
    - aof.verify
    - loops.list
    - loops.progress
    - gaps.aging
    - receipts.summary
    - receipts.search
    - receipts.trends
    - proposals.list
    - media.health.check
    - media.service.status
    - media.nfs.verify
    - cloudflare.status
    - cloudflare.zone.list
    - cloudflare.token.health
    - mint.customer.voice.intake.capture
    - mint.customer.voice.callback.enqueue
    - mint.customer.frontdesk.facts.get
    - mint.customer.order.status.lookup
    - communications.send.preview
    - communications.send.execute

  roles:
    operator:
      token_env: "MAILROOM_BRIDGE_TOKEN"
      allow: "*"
      description: "Full access for spine operators (all allowlisted Cap-RPC capabilities)."

    monitor:
      token_env: "MAILROOM_BRIDGE_MONITOR_TOKEN"
      allow:
        - spine.verify
        - surface.mobile.dashboard.status
        - gaps.status
        - loops.status
        - proposals.status
        - mailroom.bridge.status
        - aof.status
        - aof.version
        - loops.list
        - loops.progress
        - gaps.aging
        - receipts.summary
        - receipts.search
        - receipts.trends
        - proposals.list
        - cloudflare.status
        - cloudflare.zone.list
        - cloudflare.token.health
      description: "Read-only monitoring (AOF status/version + core summaries + mobile read surfaces + cloudflare read)."

    media-consumer:
      token_env: "MAILROOM_BRIDGE_MEDIA_TOKEN"
      allow:
        - media.health.check
        - media.service.status
        - media.nfs.verify
      description: "Read-only media stack health consumers."

    task-automation:
      token_env: "MAILROOM_BRIDGE_TASK_TOKEN"
      allow:
        - mailroom.task.enqueue
        - mailroom.task.claim
        - mailroom.task.heartbeat
        - mailroom.task.complete
        - mailroom.task.fail
      description: "Task lifecycle automation over governed Cap-RPC task capabilities."

    n8n-morpheus-voice:
      token_env: "MAILROOM_BRIDGE_N8N_MORPHEUS_VOICE_TOKEN"
      allow:
        - mint.customer.voice.intake.capture
        - mint.customer.voice.callback.enqueue
        - mint.customer.frontdesk.facts.get
        - mint.customer.order.status.lookup
        - communications.send.preview
        - communications.send.execute
      description: "Scoped Cap-RPC access for Morpheus Voice n8n workflows."

json_contract:
  # Capabilities that MUST support a stable --json envelope when consumed over Cap-RPC.
  #
  # Contract keys (required):
  #   capability, schema_version, status, generated_at, data
  envelope_keys:
    - capability
    - schema_version
    - status
    - generated_at
    - data

  # Test harness: each entry is executed as:
  #   <capability_command> --json <args...>
  #
  # NOTE: Some caps support offline filters so tests don't hit live infra.
  caps:
    - capability: aof.status
      args: []
    - capability: aof.version
      args: []
    - capability: aof.policy.show
      args: []
    - capability: aof.tenant.show
      args: []
    - capability: aof.verify
      args: []

    - capability: media.health.check
      args: ["--vm", "__none__"]
    - capability: media.service.status
      args: ["--vm", "__none__", "--service", "__none__"]
    - capability: media.nfs.verify
      args: ["--vm", "__none__"]

    - capability: mailroom.task.enqueue
      args: ["--summary", "D116 envelope contract", "--task-id", "TASK-D116-ENQUEUE", "--dry-run"]
    - capability: mailroom.task.claim
      args: ["--task-id", "TASK-D116-CLAIM", "--dry-run"]
    - capability: mailroom.task.heartbeat
      args: ["--task-id", "TASK-D116-HEARTBEAT", "--dry-run"]
    - capability: mailroom.task.complete
      args: ["--task-id", "TASK-D116-COMPLETE", "--dry-run"]
    - capability: mailroom.task.fail
      args: ["--task-id", "TASK-D116-FAIL", "--dry-run"]

    - capability: mint.customer.voice.intake.capture
      args: ["--payload-base64", "eyJjYWxsIjp7ImlkIjoiY2FsbC10ZXN0IiwiY3VzdG9tZXIiOnsibnVtYmVyIjoiKzE1NTUxMjM0NTY3In0sInN0YXJ0ZWRBdCI6IjIwMjYtMDMtMThUMDE6MDA6MDBaIiwiZW5kZWRBdCI6IjIwMjYtMDMtMThUMDE6MDI6MDBaIn0sImFuYWx5c2lzIjp7InN1bW1hcnkiOiJUZXN0IGNhbGwifSwibWVzc2FnZXMiOltdfQ==", "--dry-run", "--json"]
    - capability: mint.customer.voice.callback.enqueue
      args: ["--interaction-id", "VOICE-D116", "--caller-number", "+15551234567", "--reason", "registry_test", "--urgency", "medium", "--preferred-followup-channel", "email", "--summary", "Registry contract dry run", "--dry-run", "--json"]
    - capability: mint.customer.frontdesk.facts.get
      args: ["--topic", "all", "--json"]
    - capability: mint.customer.order.status.lookup
      args: ["--email", "registry@example.com", "--json"]
