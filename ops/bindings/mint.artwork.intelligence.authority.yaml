---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-13
scope: mint-artwork-intelligence-truth
---

version: "1.0"
updated_at: "2026-03-13"

purpose: >
  Canonical governed artwork-family, imprint-history, and color-continuity truth
  for Mint customer artwork reuse decisions. This is the boring middle layer
  between artifact records and downstream proof/production handoffs.

runtime_storage:
  root: runtime/domain-state/mint
  family_records_dir: runtime/domain-state/mint/artwork-families
  family_index_file: runtime/domain-state/mint/artwork-families-index.yaml
  analysis_records_dir: runtime/domain-state/mint/artwork-intelligence
  analysis_index_file: runtime/domain-state/mint/artwork-intelligence-index.yaml

record_model:
  artwork_family:
    description: >
      First-class customer-scoped logo/design family truth. Variants and prior
      imprint/color history attach here so later agents stop re-inferring from
      loose files or filenames.
    required_fields:
      - family_id
      - customer_binding
      - family_key
      - variants
      - historical_imprint_truth
      - created_at
      - updated_at
  artwork_intelligence_analysis:
    description: >
      Immutable analysis record for one current request against governed artwork
      families, artifacts, and historical imprint truth.
    required_fields:
      - analysis_id
      - customer_binding
      - line_items
      - summary
      - receipts
      - created_at

relationship_classes:
  - exact_reuse
  - prior_art_reuse_with_blank_change
  - prior_art_reuse_with_size_change
  - prior_art_variant_existing_asset
  - new_graphic
  - ambiguous_needs_operator_review

color_continuity_states:
  - exact_match
  - likely_match_needs_confirmation
  - changed_from_prior
  - ambiguous_mockup_only
  - unknown

agent_usage:
  morpheus:
    read_surface: mint.artwork.intelligence.snapshot
    rule: >
      Ask what governed artwork intelligence already exists for the seed/job/
      customer before guessing from the raw email thread.
  artie:
    read_surface: mint.artwork.intelligence.snapshot
    rule: >
      Treat reuse, sizing-review, and confirmation-required outputs as the
      intake truth for proof/artwork work.
  production:
    read_surface: mint.artwork.intelligence.snapshot
    rule: >
      Reuse prior production truth only when the analysis says reuse is safe and
      no sizing/color confirmation is still required.
