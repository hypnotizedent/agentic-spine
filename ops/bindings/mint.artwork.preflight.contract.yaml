---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-17
scope: mint-artwork-preflight
version: 1

surface:
  capability: mint.artwork.preflight
  artie_terminal: MINT-ARTIE-01
  morpheus_terminal: MINT-MORPHEUS-01
  description: >
    Run Artie-owned artwork preflight on a local or canonical artwork file,
    persist governed prepress truth, and expose a boring print-method
    recommendation for Morpheus and operators.

storage:
  records_root: "$MINT_DATA_ROOT/artwork-preflights"
  index_file: "$MINT_DATA_ROOT/artwork-preflights-index.yaml"

analysis_model:
  supported_extensions:
    - png
    - jpg
    - jpeg
    - webp
    - pdf
    - svg
    - ai
    - eps
  raster_analysis:
    max_sample_side: 160
    gradient_detection:
      min_exact_unique_colors: 96
      continuous_tone_ratio: 4.0
    dpi:
      minimum_print_dpi: 300
  print_method_recommendation:
    enabled: true
    dtg_threshold:
      min_colors: 5
      or_has_gradients: true
      piece_range: [50, 1000]
    screen_print_threshold:
      max_colors: 4
      min_pieces: 24
    vector_screen_print_bias:
      max_spot_colors: 6

notes:
  - Artie owns file truth, prepress interpretation, and revision/proof correctness.
  - Morpheus may read Artie preflight truth, but should not improvise deep artwork reasoning once it exists.
  - Vector/PDF preflight stays fail-closed on font, raster-embed, and transparency cues by surfacing review_required rather than pretending certainty.
