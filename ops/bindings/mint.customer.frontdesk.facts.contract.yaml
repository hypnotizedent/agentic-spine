# Mint Customer Frontdesk Facts Authority
# Status: authoritative
# Last verified: 2026-03-17
# Scope: voice-frontdesk-approved-facts

version: "1.0"
updated_at: "2026-03-17"
owner: "@ronny"
status: authoritative
scope: voice-frontdesk-approved-facts

purpose: >
  Canonical approved facts for the Morpheus voice front desk.
  Read-only factual information that the voice agent is allowed to share.

approved_facts:
  business_name: "Mint Prints"

  hours:
    published: false
    policy: "No published walk-in hours are stored in spine authority for the voice lane."
    note: "Use team@mintprints.com for coordination and the team will confirm the next step."

  contact:
    email: "team@mintprints.com"
    website: "https://mintprints.com"
    street_address: ""
    street_address_known: false
    note: "A customer-facing street address is not published in current spine authority for phone disclosure."

  pickup_policy:
    requirement: "Keep pickup coordination in the documented email lane."
    coordination: "Email team@mintprints.com so the team can confirm readiness and pickup details."
    note: "Do not promise walk-in pickup timing from the voice lane."

  dropoff_policy:
    requirement: "Keep drop-off and artwork intake coordination in the documented email lane until the team confirms next steps."
    coordination: "Email team@mintprints.com with the order or artwork context."
    note: "Do not approve a drop-off address or timing from the voice lane."

  quote_intake:
    primary_channel: "https://mintprints.com or email team@mintprints.com"
    required_details:
      - garment_type
      - quantity
      - print_locations
      - due_date
      - artwork_status
    response_time: "Follow-up timing is confirmed by the team over email."

approved_responses:
  hours_question: "I don't have published walk-in hours in this channel. The best path is team@mintprints.com and the team will confirm the next step."
  address_question: "I don't have a published street address for phone disclosure in this channel. Email team@mintprints.com and the team will share the right next step if needed."
  pricing_question: "Custom pricing depends on your specific needs. I can collect details and the team will send a quote, or you can submit directly at mintprints.com."
  turnaround_question: "Turnaround depends on the project specifics and current workload. The team will confirm timing when they send your quote."
  dropoff_question: "Please send the job details through email at team@mintprints.com so the team can confirm the correct next step."
  pickup_question: "Please use team@mintprints.com so the team can confirm readiness and pickup details."

disallowed_statements:
  - "Inventing custom pricing"
  - "Promising specific turnaround times"
  - "Approving rush requests"
  - "Approving drop-off or pickup without payment"
  - "Giving exact address before approval"
  - "Offering phone/text as normal coordination lane"
  - "Implying immediate human availability unless transfer succeeds"

capabilities:
  - mint.customer.frontdesk.facts.get
