---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-21
scope: mint-operator-storage
---

contract_id: MINT_OPERATOR_STORAGE_CONTRACT_V2

critical_path:
  mode: mounted_operator_drop
  rationale: >-
    Business-critical Mint intake lands directly in the canonical mounted MinIO
    operator-drop path. Desktop staging is forbidden because it creates local
    drift and leaves duplicate source folders on the Mac.

canonical_operator_drop:
  path: ~/MinIO/artwork-intake/operator-drop
  bucket: artwork-intake
  prefix: operator-drop
  accepted_entries: directories_only
  ingest_command: ./bin/mintctl morpheus intake --source ~/MinIO/artwork-intake/operator-drop

legacy_desktop_inbox:
  path: ~/Desktop/Operator Drop
  policy: forbidden
  failure_mode: local_drift
  ignore_names:
    - .DS_Store
    - .localized

remote_target:
  rclone_remote: mintfiles
  bucket: artwork-intake
  prefix: operator-drop
  health_probe_path: artwork-intake
  contimeout: 2s
  timeout: 10s
  retries: 1
  low_level_retries: 1

mount_surface:
  role: critical_operator_surface
  launch_agent_label: com.ronnyworks.mintfiles.mount
  launchd_template: ops/plugins/infra/host/launchd/com.ronnyworks.mintfiles.mount.plist
  mount_script_path: ~/code/workbench/scripts/root/mounts/mintfiles-mount.sh
  mountpoint: ~/MinIO
  operator_drop_path: ~/MinIO/artwork-intake/operator-drop
  required_visible_paths:
    - ~/MinIO/artwork-intake
    - ~/MinIO/artwork-registry
    - ~/MinIO/artwork-output
    - ~/MinIO/client-assets
  launchd_health_interval_seconds: 15
  fallback_local_entries_policy: fail

automation:
  session_preflight: advisory
