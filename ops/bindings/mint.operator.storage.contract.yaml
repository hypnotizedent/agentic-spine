---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-21
scope: mint-operator-storage
---

contract_id: MINT_OPERATOR_STORAGE_CONTRACT_V4

critical_path:
  mode: direct_remote_operator_drop
  rationale: >-
    Business-critical Mint intake lands through a governed direct-to-MinIO
    operator-drop upload surface. The Finder mount remains useful for browsing,
    but writes and source cleanup must not depend on a live FUSE mount.

canonical_operator_drop:
  path: ~/MinIO/artwork-intake/operator-drop
  browse_mount_path: ~/MinIO/artwork-intake/operator-drop
  remote: mintfiles:artwork-intake/operator-drop
  bucket: artwork-intake
  prefix: operator-drop
  accepted_entries: directories_only
  ingest_command: ./bin/mintctl morpheus intake

legacy_desktop_inbox:
  path: ~/Desktop/Operator Drop
  policy: forbidden
  failure_mode: local_drift
  ignore_names:
    - .DS_Store
    - .localized

remote_target:
  rclone_remote: mintfiles
  bucket: artwork-intake
  prefix: operator-drop
  health_probe_path: artwork-intake
  contimeout: 2s
  timeout: 10s
  retries: 1
  low_level_retries: 1

mount_surface:
  role: optional_browse_surface
  rationale: >-
    The MinIO mount is a Finder/operator browse surface only. It may be used to
    inspect the canonical operator-drop after upload, but the critical write
    path must remain mountless.
  launch_agent_label: com.ronnyworks.mintfiles.mount
  launchd_template: ops/plugins/infra/host/launchd/com.ronnyworks.mintfiles.mount.plist
  mount_script_path: /Users/ronnyworks/.wt/workbench/operator-storage-runtime/scripts/root/mounts/mintfiles-mount.sh
  mountpoint: ~/MinIO
  operator_drop_path: ~/MinIO/artwork-intake/operator-drop
  required_visible_paths:
    - ~/MinIO/artwork-intake
    - ~/MinIO/artwork-registry
    - ~/MinIO/artwork-output
    - ~/MinIO/client-assets
  launchd_health_interval_seconds: 15
  fallback_local_entries_policy: fail
  browse_only: true

assisted_move_surface:
  mode: governed_mountless_remote_move
  rationale: >-
    Finder drag into the MinIO mount is a cross-volume copy, so the canonical
    operator flow needs an explicit assisted move surface that uploads directly
    to MinIO, verifies arrival, and only then cleans up the local source.
  allowed_source_roots:
    - ~/Desktop
    - ~/Downloads
    - ~/Documents
    - /tmp
  accepted_entries: directories_only
  remote_destination: mintfiles:artwork-intake/operator-drop
  staging_prefix: artwork-intake/operator-drop/.incoming
  conflict_policy: fail_if_destination_exists
  verification_method: rclone_check_size_one_way
  cleanup_policy: trash_after_verified_arrival
  receipts_root: .evidence/spine/mint/operator-drop-assist
  helper_bin_path: ~/.local/bin/mint-operator-drop-assist
  finder_app_path: ~/Applications/Mint Operator Drop.app
  control_plane_root: ~/.wt/agentic-spine/control-plane
  installer_script_path: /Users/ronnyworks/.wt/workbench/operator-storage-runtime/scripts/root/operator/install-mint-operator-drop-surface.sh
  boring_state_requires_entry_surface: true

automation:
  session_preflight: advisory
