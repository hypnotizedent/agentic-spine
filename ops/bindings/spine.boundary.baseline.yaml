---
status: authoritative
owner: "@operator"
last_verified: 2026-02-28
scope: spine-boundary-baseline

version: 1
updated: 2026-02-28
spine_root: "$SPINE_ROOT"
workbench_root: "$WORKBENCH_ROOT"
runtime_root: "$SPINE_RUNTIME"

authoritative_surfaces:
  - bin/**
  - ops/**
  - surfaces/**
  - docs/core/**
  - docs/governance/**
  - docs/product/**
  - docs/reference/generated/**

restricted_docs_surfaces:
  - docs/reference/legacy/**
  - docs/reference/pillars/**
  - docs/reference/audits/**

runtime_only_patterns:
  - "**/.DS_Store"
  - "mailroom/inbox/**/test-*.md"
  - "mailroom/inbox/**/TEST_*.md"
  - "mailroom/inbox/**/smoke-*.md"
  - "mailroom/logs/**"
  - "evidence/sessions/**"
  - "evidence/verify/**"

rules:
  move_workbench:
    - id: ha_dashboard_assets
      globs:
        - infra/ha-dashboards/**/*.yaml
      destination: $WORKBENCH_ROOT/infra/ha-dashboards/
    - id: legacy_brain_lessons
      globs:
        - docs/reference/legacy/brain-lessons/*LESSONS*.md
      destination: $WORKBENCH_ROOT/docs/brain-lessons/
    - id: domain_product_specs
      globs:
        - mailroom/inbox/done/ORDER_INTAKE_CONTRACT_SPEC.md
      destination: $WORKBENCH_ROOT/docs/product/
    - id: quarantined_workbench_payloads
      globs:
        - mailroom/outbox/quarantine/WORKBENCH_UNTRACKED_*/**
      destination: $WORKBENCH_ROOT/quarantine/

  runtime_only:
    - id: mailroom_test_artifacts
      globs:
        - mailroom/inbox/**/test-*.md
        - mailroom/inbox/**/TEST_*.md
        - mailroom/inbox/**/smoke-*.md
      destination: $SPINE_RUNTIME/spine/mailroom/inbox/

  archive_then_delete:
    - id: legacy_imports
      globs:
        - docs/reference/legacy/_imports/ronny-ops_*/**
      archive_root: $HOME/code/.backups/workbench/archive/ronny-ops-imports/
    - id: host_backup_artifacts
      globs:
        - evidence/verify/launchagent_backups_*/**
        - evidence/verify/_archived_logs_*/**
        - evidence/verify/_archived_agent_*/**
      archive_root: $HOME/code/.backups/workbench/archive/spine-runtime/

reporting:
  default_report_dir: evidence/verify/governance
  boundary_report_prefix: SURFACE_BOUNDARY_AUDIT
  reconcile_plan_prefix: SURFACE_BOUNDARY_RECONCILE
