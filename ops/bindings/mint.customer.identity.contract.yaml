status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mint-customer-identity

version: "1.0"
updated_at: "2026-03-12"

storage:
  authority_table: mint_modules.public.customers
  authority_json_path: metadata.customer_identity
  mutable_surface: mint.customer.identity.set
  read_surface: mint.customer.record.snapshot
  mail_identity_contract: ops/bindings/mint.customer.mail.identity.contract.yaml

fields:
  legal_name:
    required: true
    description: Preserved formal/legal customer name for exact lookup and formal records.
  preferred_name:
    required: false
    description: Customer-facing preferred name when the legal name is not how they should be addressed.
  greeting_name:
    required: false
    description: Name Morpheus should use in salutation/greeting by default.
  display_name:
    required: false
    description: Customer-facing display label when preferred_name alone is not enough.
  aliases:
    required: false
    type: list
    description: Additional governed nicknames or alternate human-facing labels.
  provenance:
    required: true
    fields:
      - source
      - set_by
      - confidence
      - updated_at_utc

allowed_confidence:
  - low
  - medium
  - high

default_policy:
  reply_greeting_priority:
    - greeting_name
    - preferred_name
    - display_name_if_not_legal_name
  legal_name_fallback_allowed: true
  nickname_guessing_allowed: false
  resolved_name_as_salutation_allowed: false
