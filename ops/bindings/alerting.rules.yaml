# Alerting Rules Contract
# Status: authoritative
# Last verified: 2026-04-13
# Scope: alerting dispatch thresholds and channels

version: "1.3"
updated_at: "2026-04-13"
owner: "@ronny"
scope: alerting-rules

defaults:
  snapshot_path: /tmp/spine-alerting-probe-latest.json
  alert_outbox_dir: $SPINE_OUTBOX/alerts
  cooldown_seconds: 1800
  trigger_statuses:
    - warn
    - incident
  channels:
    - ha
    - bridge-push

channels:
  ha:
    enabled: true
    endpoint_env: ALERTING_HA_URL
    token_env: ALERTING_HA_TOKEN
    service_path: /api/services/persistent_notification/create
  bridge-push:
    enabled: true
    outbox_file: $SPINE_OUTBOX/alerts/bridge-push.log
  email:
    enabled: true
    mode: intent-flush
    # Auto dispatch writes structured intent artifacts to
    # $SPINE_OUTBOX/alerts/email-intents/*.yaml (no direct provider call).
    # Flush via manual capability: communications.alerts.flush
    # which runs communications.send.preview + communications.send.execute
    # per intent, preserving the manual approval boundary for real sends.
    intent_dir: $SPINE_OUTBOX/alerts/email-intents
    flush_capability: communications.alerts.flush

rules:
  - domain_id: automation-stack
    trigger_statuses: [warn, incident]
    cooldown_seconds: 900
    channels: [ha, bridge-push, email]

  - domain_id: finance-stack
    trigger_statuses: [warn, incident]
    cooldown_seconds: 900
    channels: [ha, bridge-push, email]

  - domain_id: z2m-bridge
    trigger_statuses: [warn, incident]
    cooldown_seconds: 1800
    channels: [ha, bridge-push, email]

  - domain_id: immich-stack
    trigger_statuses: [incident]
    cooldown_seconds: 1800
    channels: [ha, bridge-push, email]

  - domain_id: infra-core-stack
    trigger_statuses: [warn, incident]
    cooldown_seconds: 900
    channels: [ha, bridge-push, email]

  - domain_id: observability-stack
    trigger_statuses: [warn, incident]
    cooldown_seconds: 1800
    channels: [ha, bridge-push, email]

  - domain_id: dev-tools-stack
    trigger_statuses: [warn, incident]
    cooldown_seconds: 900
    channels: [ha, bridge-push, email]

  - domain_id: mint-stack
    trigger_statuses: [warn, incident]
    cooldown_seconds: 1800
    channels: [ha, bridge-push, email]

  - domain_id: mcp-runtime-anti-drift
    trigger_statuses: [warn, incident]
    cooldown_seconds: 900
    channels: [ha, bridge-push, email]

# ----------------------------------------------------------------------
# Autonomous Operator Interrupt Contract (v1)
# Formalized: 2026-04-13
# Amended: 2026-04-13 (authority reconciliation)
# Loops:
#   - LOOP-SPINE-AUTONOMOUS-OPERATOR-COMMS-V1-CONTRACT-20260413
#   - LOOP-SPINE-OPERATOR-INTERRUPT-AUTHORITY-RECONCILE-20260413
#
# This section governs autonomous outbound communication to the operator.
# It is a governed actuator class -- not general alerting, not reporting.
#
# Doctrine:
#   - Autonomous operator communication is authorized as a governed actuator
#   - Audience: Ronny (operator/steward)
#   - Purpose: critical operator interruption only
#   - Silence is better than noise
#
# Non-goals (v1):
#   - warnings
#   - summaries
#   - chatter
#   - proposal traffic
#   - general workflow notifications
# ----------------------------------------------------------------------

operator_interrupt:
  version: 2
  formalized_at: "2026-04-13"
  amended_at: "2026-04-13"
  audience: operator
  operator_identity: "@ronny"
  purpose: critical-operator-interruption
  actuator_class: governed
  actuator_subclass: operator-critical-interrupt

  # -- Channel hierarchy and validation ------------------------------------
  #
  # ha channel as currently wired uses /api/services/persistent_notification/create.
  # This is a Home Assistant dashboard inbox notification, NOT a mobile push surface.
  #
  # A proven mobile push path EXISTS in the estate:
  #   service: notify.mobile_app_ronnys_iphone (HA Companion, Apple APNS)
  #   evidence: 5 active automations in workbench/infra/homeassistant/config/automations.yaml
  #   integration: entry_id 01JVG2HT0ZZ6W6ER3SBN65NTJ9 in ha.integrations.yaml
  #
  # But it is NOT wired into spine alerting. The gap is the service_path, not the provider.
  channels:
    best_available: ha
    best_available_validation_status: inbox-surface-only
    best_available_service_path: /api/services/persistent_notification/create
    best_available_honest_characterization: >
      Dashboard persistent notification. Visible in HA web UI.
      Not delivered to phone unless HA Companion app is open.
      Not a proven wake-the-operator interrupt.
    supporting_artifact: bridge-push
    email_disposition: manual-fallback-only

  mobile_interrupt_gap:
    status: open
    finding: >
      notify.mobile_app_ronnys_iphone is live and proven for HA automations
      but not wired into spine alerting. Wiring it requires changing
      service_path in the ha channel definition or adding a new channel.
      This packet does not activate that change.
    proven_mobile_path: notify.mobile_app_ronnys_iphone
    proven_mobile_provider: ha_companion_apns
    activation_status: not-activated-in-this-packet

  # -- Authority -----------------------------------------------------------
  #
  # execution_host.external_escalation is forbidden in base authority.
  # Escalation authority derives from a scoped exception in node.role.contract.yaml.
  escalation_authority:
    base_role: execution_host
    base_external_escalation: forbidden
    exception_source: node.role.contract.yaml#authority_exceptions.execution_host_operator_critical_interrupt
    exception_scope: operator-critical-interrupt-only
    sunset_condition: "Expires when watcher_node is realized."

  # Operator response surface (not a delivery channel)
  response_surface: termux_ssh

  # Calm read surface (not an interrupt channel)
  read_surface: cockpit

  # Only incident-class events may fire the operator interrupt
  trigger_threshold: incident

  # Domains authorized for operator interrupt in v1
  # These are engine-critical domains matching "engine combustion" class truth
  allowed_domain_ids:
    - infra-core-stack
    - mcp-runtime-anti-drift

  # Pacing: reuse existing cooldown mechanics with severe posture
  cooldown_seconds: 1800
  dedupe_by: domain_fingerprint

  # Dispatch is formalized but not resumed in this contract
  dispatch_state: formalized-not-resumed
