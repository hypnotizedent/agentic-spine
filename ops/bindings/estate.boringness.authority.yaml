    boring_enough_now: false
    summary: Shop rack is structurally legible and inventory-backed; VM200 hot footprint is gone and the remaining blocker is warm-lane pressure on media plus a retained forensic snapshot hold.
    storage_tiers:
      hot: tank
      warm: media
      cold: md1400
    blockers:
      - media is at 99% usage and only has about 189G free.
      - Client-visible /media payload already accounts for about 15.9TiB of canonical movie/TV/music/archive content, so the remaining easy reclaim is mostly downloads.
      - media@forensic-20260226-2325 is still retained as a forensic hold and has grown to 278G, so the completed backup drain still does not immediately reclaim matching space.
  home:
    boring_enough_now: false
    summary: Home infra now has authoritative inventory and backup truth, but one-box durability assumptions are still too informal for drive-change confidence.
    storage_tiers:
      hot: proxmox-home local-lvm
      warm_backup: synology /volume1/backups/proxmox_backups/dump
