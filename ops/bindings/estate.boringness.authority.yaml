    - id: media-export-overlay-drift
      environment: shop
      kind: storage_mount_overlay
      note: Client-visible /media payload truth comes from the NFS export, not the host-local child dataset mount view at /media/movies, /media/tv, /media/music, and /media/movies-archive.
    - id: media-forensic-20260226-2325
      environment: shop
      kind: storage_snapshot_hold
      note: Retained forensic snapshot on media preserves deleted blocks and blocks immediate reclaim during the copy-first normalization wave.
    - id: mint-modules-deploy-wrapper
      environment: code
      kind: repo_support_surface
      note: mint-modules/deploy remains an operator wrapper and compatibility surface, not the canonical runtime definition lane.
  ghosts: []
  unknowns:
