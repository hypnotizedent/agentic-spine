sites:
  shop:
    boring_enough_now: false
    summary: Shop rack is structurally legible, inventory-backed, and storage-normalized at the namespace layer; the remaining blockers are warm-lane pressure on media and app-level import backlog behavior on download-stack.
    storage_tiers:
      hot: tank
      warm: media
      cold: md1400
    blockers:
      - media is at 95% usage. The pool has about 1.37T free, but clients only see about 798G available over NFS.
      - Client-visible /media payload already accounts for about 15.9TiB of canonical movie/TV/music/archive content, so the remaining easy reclaim is mostly downloads.
      - Downloads still contribute about 2.25TiB of regenerable pressure even after the duplicate-drain and snapshot cleanup wave.
      - download-stack automation still logs FreeSpaceSpecification zero-free-space failures and SQLite lock churn, so import backlog behavior is not yet boring.
  home:
    boring_enough_now: false
    summary: Home infra now has authoritative inventory and backup truth, but one-box durability assumptions are still too informal for drive-change confidence.
    storage_tiers:
      hot: proxmox-home local-lvm
      warm_backup: synology /volume1/backups/proxmox_backups/dump
      warm_data: synology /volume1
      cold_offsite: none_declared
    blockers:
      - No declared second-environment cold/offsite restore plane exists for home personal data on Synology.
      - Home switch ports 3/4/6 still rely on inferred endpoint identity instead of traced physical truth.
      - Synology mint-os residue remains as non-canonical historical hold.

