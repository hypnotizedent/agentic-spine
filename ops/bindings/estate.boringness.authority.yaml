decisions:
  - decision_type: safe_to_delete
    subject: vm-200-disk-0 on pve local-lvm
    environment: shop
    status: done
    rationale: Cold capsule path/size/SHA-256 and qemu config were captured before delete, then qm disk unlink removed scsi0 and the backing LV on 2026-03-12T04:30:02Z.
  - decision_type: safe_to_migrate
    subject: legacy media-stack tarballs from /media/backups to /md1400/media-cold/legacy-media-stack-backups
    environment: shop
    status: done
    rationale: Canonical media config backups already live under /md1400/backups/configs/media-config. The historical warm-lane tarballs are now fully parked on md1400 and no longer live on media.
  - decision_type: safe_to_delete
    subject: media@forensic-20260226-2325
    environment: shop
    status: blocked
    rationale: Snapshot still acts as a forensic restore hold for the copy-first utilization wave. Deleting it would change the restore story, not just free space.
  - decision_type: safe_to_delete
    subject: Synology mint-os legacy residue
    environment: home
    status: candidate
    rationale: Residue is reviewed, non-canonical, and now tombstoned under /volume1/backups/_legacy_tombstones/retired-20260319-mint-os-home-residue. Delete only in a deliberate cleanup wave.
  - decision_type: safe_to_migrate
    subject: Synology stale backup lanes into /volume1/backups/_legacy_tombstones
    environment: home
    status: done
    rationale: Historical shop exact-offsite residue plus stale mint-os, home-assistant, finance, and media backup lanes were renamed into one explicit tombstone subtree on 2026-03-19 so they no longer look canonical.
  - decision_type: safe_to_migrate
    subject: mint-modules future, blocked, and deferred roots
    environment: code
    status: ready
    rationale: Spine lifecycle authority already declares these roots non-runtime; moving them behind explicit lifecycle boundaries will not change live runtime behavior.
  - decision_type: safe_to_migrate
    subject: decomposed ronny-products app contracts and v1 bases
    environment: code
    status: done
    rationale: "ronny-products was decomposed into /Users/ronnyworks/code/projects/<id>. The project homes are canonical for health, travel, investment, cc-benefits-tracker, vouchervault, and inbox-shield until deliberate promotion to products/<id>."
  - decision_type: safe_to_change_drives
    subject: shop rack hot/warm/cold storage
    environment: shop
    status: blocked
    rationale: VM200 hot LV is gone, but media remains at 99% usage, downloads still contribute about 2.61TiB of regenerable pressure, and the retained forensic snapshot prevents warm-lane deletions from reclaiming space immediately.
  - decision_type: safe_to_change_drives
    subject: proxmox-home and Synology drives
    environment: home
    status: blocked
    rationale: Runtime backups exist on Synology, but the same enclosure remains canonical for home personal data and there is no declared second cold plane.
