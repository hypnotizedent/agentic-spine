# Status: authoritative
# Last verified: 2026-04-07

status: authoritative
version: 1
updated_at: "2026-05-05"
owner: "@ronny"

# Calendar timezone for scheduled tasks. Must be an IANA TZ (for iPhone).
timezone: "America/New_York"

# Stable anchor date for DTSTART on recurring events (keeps ICS deterministic).
dtstart_date: "2026-02-10"

# Human label for calendar clients.
calendar_name: "Spine Backups"

events:
  - id: "pve-vzdump-tier1-daily"
    summary: "Proxmox vzdump (pve) tier1 daily"
    freq: "DAILY"
    byhour: 1
    byminute: 0
    duration_minutes: 150
    description: "Tier1 pve VM backup window covers infra-core, finance-stack, and mint-data. Shop-files business data is a separate MD1400 file-archive job."
    source: "ops/bindings/domains/backup/backup.schedule.yaml"

  - id: "shop-files-md1400-archive-daily"
    summary: "Shop-files MD1400 archive"
    freq: "DAILY"
    byhour: 1
    byminute: 10
    duration_minutes: 10
    description: "MintPrints shop-files business data tar archive lands on /md1400/backups/business/shop-files."
    source: "ops/bindings/domains/backup/backup.schedule.yaml"

  - id: "pve-vzdump-daily"
    summary: "Proxmox vzdump (pve) standard daily"
    freq: "DAILY"
    byhour: 3
    byminute: 0
    duration_minutes: 240
    description: "Standard pve vzdump job keeps one copy for automation-stack, immich, mint-apps, and communications-stack. Archive-smb was retired by Packet 105."
