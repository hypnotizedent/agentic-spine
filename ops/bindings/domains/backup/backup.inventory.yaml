# Canonical backup authority inventory.
# Legacy workbench reference: ~/code/workbench/infra/data/backup_inventory.json (reference only, not canonical).
# NOTE: enabled=false by default; flip true intentionally per target.
# Classifications: critical (26h), important (48h), rebuildable (168h)
# Status: authoritative
# Last verified: 2026-04-07
# yq selectors for gate authoring:
#   .targets[]              → array of target objects (NOT map-keyed)
#   .targets[].name         → target identifier (.name NOT .id)
#   .targets[].enabled      → bool
#   .model.data_classes      → classification definitions
#   .defaults               → global defaults (timezone, ssh_timeout_sec, stale_after_hours)
status: authoritative
version: 1
# Canonical timezone source: ops/bindings/tenant.profile.yaml (runtime.timezone)
defaults:
  timezone: "America/New_York"
  ssh_timeout_sec: 6
  stale_after_hours: 26
model:
  authority_state: authoritative
  profile_version: "systemic-v3"
  authority_policy:
    app_local_backup_subtraction:
      status: active
      approved_at: "2026-04-29"
      approved_by: "@human-steward"
      rule: "If the backup plane covers the workload, old app-local backups are debt unless they protect unique data not captured by the backup plane."
      implications:
        - "backup.status readiness is based on admitted backup-plane targets, not every historical app-local script."
        - "App-local backup targets must identify unique data not captured by VM/LXC or domain backup-plane coverage."
        - "Stale app-local targets may be retired from active readiness without deleting retained artifacts."
        - "Remote crons/systemd timers are operational residue until separately remediated; they are not backup authority."
  data_classes:
    small_state:
      description: "Config, lightweight databases, and critical metadata."
    large_state:
      description: "State with material size/cost where VM-level snapshots are primary."
    payload_regenerable:
      description: "Regenerable payload/cache that is excluded by default."
    tier1_critical:
      description: "Highest criticality state requiring explicit drill coverage."
  schedule_classes:
    hourly-monitor-est:
      cron: "15 * * * *"
      timezone: "America/New_York"
    daily-primary-est:
      cron: "0 1 * * *"
      timezone: "America/New_York"
      note: "Shop daily-primary backups run in staged windows. Exact job times are authoritative in ops/bindings/domains/backup/backup.calendar.yaml."
    daily-home-primary-est:
      cron: "0 3 * * *"
      timezone: "America/New_York"
      note: "Home daily-primary cadence for proxmox-home source backups; canonical recovery remains on Synology."
    daily-config-est:
      cron: "45 3 * * *"
      timezone: "America/New_York"
      note: "Media/config cadence bucket. Exact windows live in ops/bindings/domains/backup/backup.calendar.yaml."
    weekly-est:
      cron: "0 4 * * 0"
      timezone: "America/New_York"
    monthly-drill-est:
      cron: "0 4 1 * *"
      timezone: "America/New_York"
    quarterly-drill-est:
      cron: "0 5 1 */3 *"
      timezone: "America/New_York"
  restore_classes:
    vm-dry-run-quarterly:
      mode: dry_run
      cadence: quarterly
    app-dry-run-monthly:
      mode: dry_run
      cadence: monthly
    media-config-dry-run-monthly:
      mode: dry_run
      cadence: monthly
    tier1-small-state-dry-run-quarterly:
      mode: dry_run
      cadence: quarterly
  vzdump_schedule_policy:
    version: 4
    updated_at: "2026-04-30"
    canonical_cold_plane: "/md1400/backups/vm-images/pve"
    generator_surface: "/data/backups/vzdump/dump"
    cold_copy_mode: "Allowlist promotion from generator surface to canonical MD1400 VM-image plane. Generator freshness alone is not backup authority for shop VM/LXC targets."
    retention_buckets:
      daily_keep_two:
        retention: keep-last=2
        description: "Daily vzdump with two retained copies."
      daily_keep_one:
        retention: keep-last=1
        description: "Daily vzdump with one retained copy."
      no_recurring_vzdump:
        retention: none
        description: "No recurring vzdump retention; VM is treated as rebuildable."
      decommission_capsule:
        retention: retained_capsule
        description: "No recurring backup. Last-known-good cold artifact retained for hold/review."
    derived_assignments:
      daily_keep_two:
        - vm_id: 204
          hostname: infra-core
          rationale: "Small footprint, high-value secrets and auth state."
        - vm_id: 211
          hostname: finance-stack
          rationale: "Financial records justify two retained copies."
        - vm_id: 212
          hostname: mint-data
          rationale: "Primary Mint data plane. Data loss is unacceptable."
      daily_keep_one:
        - vm_id: 202
          hostname: automation-stack
          rationale: "State matters, but one retained copy is sufficient."
        - vm_id: 203
          hostname: immich
          rationale: "Immich metadata matters, but originals live elsewhere."
        - vm_id: 213
          hostname: mint-apps
          rationale: "App plane only. Primary state lives on mint-data."
        - vm_id: 214
          hostname: communications-stack
          rationale: "Huge artifact; one retained VM copy plus app-level backups is the chosen tradeoff."
        # vm_id 220 (archive-smb) removed from recurring retention 2026-04-14 — LXC retired, no live consumers.
        # md1400 dataset snapshot protection remains active (parked, separate from LXC retirement).
      no_recurring_vzdump:
        - vm_id: 205
          hostname: observability
          rationale: "Legacy rebuildable monitoring stack on retirement hold after VM 216 promotion."
        - vm_id: 216
          hostname: observability-r620
          rationale: "Canonical rebuildable observability witness stack on pve-r620."
        - vm_id: 206
          hostname: dev-tools
          rationale: "Rebuildable dev environment with separate app-level Gitea backup."
        - vm_id: 207
          hostname: ai-consolidation
          rationale: "Rebuildable AI tooling and vector workloads."
        - vm_id: 215
          hostname: surveillance-stack
          rationale: "Bulky footage workload with acceptable loss profile."
      decommission_capsule:
        - vm_id: 200
          hostname: docker-host
          rationale: "Tombstoned 2026-03-06. Single cold capsule retained on md1400."
        - vm_id: 209
          hostname: download-stack
          rationale: "Decommissioned 2026-03-23. Cold residue retained for 30-day hold."
        - vm_id: 210
          hostname: streaming-stack
          rationale: "Decommissioned 2026-03-23. Cold residue retained for 30-day hold."
  destination_lanes:
    pve-vzdump-primary:
      host: pve
      base_path: /data/backups/vzdump/dump
      max_total_gb: 4000
      max_file_count: 120
      authority_state: generator_only
      telemetry_class: generator_staging
      description: "Local pve vzdump generation lane only. This is not backup readiness authority for shop VM/LXC targets; canonical cold copies are promoted from here into /md1400/backups/vm-images/pve."
    pve-vzdump-cold-canonical:
      host: pve
      base_path: /md1400/backups/vm-images/pve
      max_total_gb: 6000
      max_file_count: 200
      description: "Canonical cold recovery lane for shop VM/LXC artifacts on md1400. This is the authoritative vm-images restore surface for shop hypervisor backups."
    pve-vzdump-legacy-retained:
      host: pve
      base_path: /md1400/backup-cold/vzdump/pve
      max_total_gb: 6000
      max_file_count: 200
      telemetry_class: non_canonical_quarantine_residue
      description: "Legacy retained VM-image residue lane for decommissioned capsules. This is not active VM-image authority and must not receive active allowlist sync."
    r730xd-finance-backups:
      host: pve
      base_path: /md1400/backups
      base_paths:
        - /md1400/backups/db-dumps/finance
        - /md1400/backups/exports/finance
        - /md1400/backups/configs/finance
      max_total_gb: 5000
      max_file_count: 10000
      description: "Canonical 730XD backup plane for Finance domain. Only restore-intent class paths under /md1400/backups are measured as active backup authority."
    r730xd-mint-backups:
      host: pve
      base_path: /md1400/backups
      base_paths:
        - /md1400/backups/db-dumps/mint-data
        - /md1400/backups/configs/mint-data
      max_total_gb: 1000
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Mint data domain. Only restore-intent class paths under /md1400/backups are measured as active backup authority."
    r730xd-communications-backups:
      host: pve
      base_path: /md1400/backups
      base_paths:
        - /md1400/backups/app-data/communications
        - /md1400/backups/configs/communications
      max_total_gb: 10000
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Communications domain. Only restore-intent class paths under /md1400/backups are measured as active backup authority."
    r730xd-infra-core-backups:
      host: pve
      base_path: /md1400/backups
      base_paths:
        - /md1400/backups/db-dumps/infra-core
        - /md1400/backups/app-data/infra-core
        - /md1400/backups/configs/infra-core
      max_total_gb: 500
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Infra-core domain. Only restore-intent class paths under /md1400/backups are measured as active backup authority."
    r730xd-dev-tools-backups:
      host: pve
      base_path: /md1400/backups
      base_paths:
        - /md1400/backups/db-dumps/dev-tools
        - /md1400/backups/exports/dev-tools
      max_total_gb: 1000
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Dev-tools domain. Only restore-intent class paths under /md1400/backups are measured as active backup authority."
    r730xd-shop-files-backups:
      host: pve
      base_path: /md1400/backups/business/shop-files
      max_total_gb: 500
      max_file_count: 1000
      description: "Canonical MD1400 backup plane for MintPrints shop-files business file data."
    r730xd-surveillance-config-backups:
      host: pve
      base_path: /md1400/backups/configs/surveillance
      max_total_gb: 10
      max_file_count: 256
      description: "Canonical MD1400 config-only backup plane for the surveillance viewer. Excludes VM media/cache, NVR footage, .env, and RTSP/NVR secrets."
    r730xd-media-config-backups:
      host: pve
      base_path: /md1400/backups/configs/media-config
      telemetry_class: non_canonical_quarantine_residue
      max_total_gb: 500
      max_file_count: 1000
      description: "Retired MD1400 media-config lane. Media-home is a home-plane exception covered by NAS/home backup authority; this path must not be treated as active backup authority unless re-admitted."
    media-config-backups:
      host: nas
      base_path: /volume1/backups/apps/media-config
      exclusion_policy:
        - /srv/media
        - "*/cache"
        - "*/tmp"
      max_total_gb: 500
      max_file_count: 800
      description: "Canonical primary app/config backup plane for media-home combined config-state archives. Payload remains on Synology and is excluded from config archives."
    nas-home-local-exception:
      host: nas
      base_path: /volume1/backups/proxmox_backups/dump
      max_total_gb: 1600
      max_file_count: 400
      description: "Canonical home-local backup lane on Synology for active proxmox-home artifacts (Home Assistant VM 100 and media-home VM 106). Retired Pi-hole LXC 105 artifacts are rollback residue only."
    nas-legacy-tombstones:
      host: nas
      base_path: /volume1/backups/_legacy_tombstones
      max_total_gb: 2000
      max_file_count: 20000
      telemetry_class: non_canonical_quarantine_residue
      description: "Explicit tombstone subtree for retired Synology backup lanes. This is not a canonical backup authority and exists only to quarantine legacy backup forests until a later delete/review wave."
    # nas-app-backups REMOVED 2026-03-08: Fully deprecated, migration complete to 730XD canonical plane.
    r730xd-archive-smb-snapshots:
      host: pve
      base_path: /md1400/backups/configs/archive-smb-snapshots
      max_total_gb: 2
      max_file_count: 256
      snapshot_retention_days: 14
      description: "ZFS snapshot protection manifests for archive-SMB datasets. Config-manifest class path under /md1400/backups/configs is authoritative."
    nas-device-backups:
      host: nas
      base_path: /volume1/backups/devices
      max_total_gb: 100
      max_file_count: 20
      description: "Workbench-managed device backup root on Synology for operator endpoint recovery lanes. Child paths under this root are runtime/readback facts, not canonical lane definition."
  backup_admission_states:
    - planned
    - production_ready
    - retired
runtime_units:
  - unit_id: machine-pve
    kind: machine
    hostname: pve
    backup_profile: host-control-plane
    data_class: tier1_critical
    include_paths:
      - /etc/pve/jobs.cfg
      - /data/backups/vzdump/dump
    exclude_paths: []
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - vm-202-primary
      - vm-203-primary
      - vm-204-infra-core-primary
      # vm-209-download-stack-primary — REMOVED 2026-03-23 (decommissioned)
      # vm-210-streaming-stack-primary — REMOVED 2026-03-23 (decommissioned)
      - vm-211-finance-stack-primary
      - vm-212-mint-data-primary
      - vm-213-mint-apps-primary
      - vm-214-communications-stack-primary
      - app-shop-files-md1400
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
  - unit_id: machine-proxmox-home
    kind: machine
    hostname: proxmox-home
    backup_profile: home-hypervisor
    data_class: tier1_critical
    include_paths:
      - /etc/pve/jobs.cfg
      - /mnt/pve/synology-backups/dump
    exclude_paths: []
    destination_lane: nas-home-local-exception
    schedule_class: daily-home-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - home-vm-100-ha-primary
      - home-vm-106-media-home-primary
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
    description: "Home hypervisor guest backup plane. Proxmox-home generates and stages the canonical Synology-backed artifacts for VM 100 and VM 106. LXC 105 Pi-hole is rollback-only after Raspberry Pi DNS appliance cutover."
  # machine-nas REMOVED 2026-03-08: All business backup authority migrated to 730XD canonical plane.
  # Home systems remain canonical on Synology-backed storage; md1400 is reserved for the 730XD/shop environment.
  # Former targets migrated to r730xd-*-backups lanes (finance, infra-core, dev-tools, communications).
  - unit_id: vm-200-docker-host
    kind: vm
    hostname: docker-host
    backup_profile: vm-primary
    data_class: large_state
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - vm-200-docker-host-primary
    backup_admission_state: planned
    unit_runtime_mode: historical
    description: "Legacy docker-host VM 200. Tombstoned 2026-03-06; historical inventory only. Live disk must leave hot storage while one md1400 cold restore capsule is retained until 2026-09-06 review."
  - unit_id: vm-202-automation-stack
    kind: vm
    hostname: automation-stack
    backup_profile: vm-primary
    data_class: small_state
    include_paths:
      - vm-disk
      - /home/automation/backups/n8n-workflows
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: app-dry-run-monthly
    inventory_targets:
      - vm-202-primary
      - app-n8n-workflows
      - app-n8n-workflows-manifest
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
  - unit_id: vm-203-immich
    kind: vm
    hostname: immich
    backup_profile: vm-primary
    data_class: large_state
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - vm-203-primary
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
  - unit_id: vm-204-infra-core
    kind: vm
    hostname: infra-core
    backup_profile: vm-tier1
    data_class: tier1_critical
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: tier1-small-state-dry-run-quarterly
    inventory_targets:
      - vm-204-infra-core-primary
      - app-infisical
      - app-vaultwarden
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
  - unit_id: vm-205-observability
    kind: vm
    hostname: observability
    backup_profile: vm-rebuildable
    data_class: small_state
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets: []
    backup_admission_state: production_ready
    unit_runtime_mode: manual_exception
    description: "Rebuildable monitoring stack. No recurring VM-level vzdump retention."
  - unit_id: vm-206-dev-tools
    kind: vm
    hostname: dev-tools
    backup_profile: vm-rebuildable
    data_class: small_state
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: app-dry-run-monthly
    inventory_targets:
      - app-gitea
      - app-gitea-export
    backup_admission_state: production_ready
    unit_runtime_mode: host_governed_script
    description: "Rebuildable dev environment. VM-level vzdump retired; app-level Gitea backup remains."
  - unit_id: vm-207-ai-consolidation
    kind: vm
    hostname: ai-consolidation
    backup_profile: vm-rebuildable
    data_class: large_state
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets: []
    backup_admission_state: production_ready
    unit_runtime_mode: manual_exception
    description: "Rebuildable AI tooling VM. No recurring VM-level vzdump retention."
  - unit_id: vm-211-finance-stack
    kind: vm
    hostname: finance-stack
    backup_profile: vm-tier1
    data_class: tier1_critical
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: tier1-small-state-dry-run-quarterly
    inventory_targets:
      - vm-211-finance-stack-primary
      - app-firefly
      - app-finance-sanity-manifest
      - app-ghostfolio
      - app-paperless-db
      - app-paperless-export
    backup_admission_state: planned
    unit_runtime_mode: proxmox_native
    description: "Finance VM 211 remains active, but the required app-level lanes (Firefly, finance manifest, Ghostfolio, Paperless) were stale in the 2026-03-18 census, so backup admission is planned until freshness is repaired."
  - unit_id: vm-212-mint-data
    kind: vm
    hostname: mint-data
    backup_profile: vm-tier1
    data_class: tier1_critical
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - vm-212-mint-data-primary
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
  - unit_id: vm-213-mint-apps
    kind: vm
    hostname: mint-apps
    backup_profile: vm-primary
    data_class: small_state
    include_paths:
      - vm-disk
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - vm-213-mint-apps-primary
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
  - unit_id: vm-214-communications-stack
    kind: vm
    hostname: communications-stack
    backup_profile: vm-tier1
    data_class: tier1_critical
    include_paths:
      - vm-disk
      - /srv/mail-archiver/backups
    exclude_paths:
      - payload_regenerable
    destination_lane: pve-vzdump-cold-canonical
    schedule_class: daily-primary-est
    restore_class: tier1-small-state-dry-run-quarterly
    inventory_targets:
      - vm-214-communications-stack-primary
      - app-stalwart-offsite
      - app-stalwart-config-offsite
      - app-stalwart-manifest-offsite
    backup_admission_state: production_ready
    unit_runtime_mode: proxmox_native
    description: "Communications VM 214 is covered by the backup plane. Mail-archiver app-local full-dump targets were retired 2026-04-29 under app-local backup subtraction policy; retained Apr 15 artifacts are historical evidence, not active readiness authority."
  - unit_id: vm-215-surveillance-stack
    kind: vm
    hostname: surveillance-stack
    backup_profile: app-small-state
    data_class: small_state
    include_paths:
      - /srv/config/surveillance
