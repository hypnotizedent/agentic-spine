    schedule_class: weekly-est
    restore_class: app-dry-run-monthly
    inventory_targets:
      - home-lxc-105-pihole-primary
    backup_admission_state: retired
    unit_runtime_mode: proxmox_native
    description: "Legacy home Pi-hole LXC 105 rollback backup on Synology via proxmox-home. Not canonical after Raspberry Pi pihole-home cutover; active artifacts removed from the live dump lane after app-pihole-home-config proved replacement coverage."
  - unit_id: appliance-pihole-home
    kind: appliance
    hostname: pihole-home
    backup_profile: app-small-state
    data_class: small_state
    include_paths:
      - /etc/pihole
      - /etc/dnsmasq.d
      - /etc/unbound/unbound.conf.d
    exclude_paths:
      - query_logs
      - payload_regenerable
    destination_lane: nas-home-local-exception
    schedule_class: manual-governed
    restore_class: app-dry-run-monthly
    inventory_targets:
      - app-pihole-home-config
    backup_admission_state: production_ready
    unit_runtime_mode: governed_capability
    description: "Canonical Raspberry Pi pihole-home appliance small-state backup. This replaces VM/LXC image backup authority for Pi-hole after the 2026-04-30 cutover."
  - unit_id: vm-106-media-home
    kind: vm
    hostname: media-home
    backup_profile: vm-primary
    data_class: large_state
    include_paths:
      - vm-disk
