# Mint Orders Module API Contract
# Status: approved
# Created: 2026-04-08
# Scope: orders-module-api-surface
#
# This contract defines the executable API surface for the orders module.
# It derives from and must conform to the approved order-truth authority:
#   ops/bindings/domains/mint/mint.order.truth.authority.yaml (v2, approved)
#
# Design principle: the canonical surface implements the authority's entity
# model directly. The legacy /v2/jobs/* facade remains for backward
# compatibility but does NOT define business truth.

version: 1
updated_at: "2026-04-08"
owner: "@ronny"
status: approved
scope: orders-module-api-surface

authority:
  order_truth: ops/bindings/domains/mint/mint.order.truth.authority.yaml
  module_lifecycle: ops/bindings/domains/mint/mint.module.lifecycle.authority.yaml
  schema_truth_supersession: >
    SCHEMA_TRUTH.md and DATABASE_OWNERSHIP.md are aligned with the approved
    order-truth authority (v2). Quotes are documented as their own immutable
    entity with separate tables. No outstanding doc supersession remains.

deployment:
  vm: 213
  port: 4500
  database: mint_modules (PostgreSQL 16 on VM 212)
  persistence: >
    Current store.ts uses in-memory Maps with seed data. The reconciliation
    replaces this with PostgreSQL-backed persistence using the canonical schema.
    No production data migration is required.

# ─── CANONICAL ENDPOINTS ────────────────────────────────────────────────
#
# These five endpoints implement the order-truth authority's entity model.
# They are the production truth surface. New consumers use these.

endpoints:

  promote_intake:
    method: POST
    path: /api/v3/orders/promote-intake
    purpose: >
      Promote one or more normalized intake seeds into a canonical order with
      its first order_revision. This is the only path from intake to order
      truth. Seed creation, artwork job creation, and alerting do not create
      orders by themselves.
    auth: requireStaff or governed capability
    request:
      required:
        seed_ids:
          type: uuid[]
          min_length: 1
          rule: at least one intake seed must be referenced
        customer:
          type: object
          fields:
            customer_id:
              type: uuid
              nullable: true
              rule: >
                if null, a provisional_customer_ref must be provided.
                quote send, payment, and customer-facing history require
                resolved customer_id.
            provisional_customer_ref:
              type: object
              nullable: true
              fields: { name: string, email: string, phone: string? }
        line_items:
          type: array
          min_length: 1
          item:
            order_line_id:
              type: uuid
              rule: >
                may reuse quote_packet.line_item_id from intake so the system
                does not invent a second line UUID before revisions exist.
                if omitted, server generates.
            product: { type: string, required: true }
            quantity: { type: integer, min: 1, required: true }
            decoration_type: { type: decoration_enum, required: true }
            garment: { type: garment_spec, nullable: true }
            size_breakdown: { type: object, nullable: true }
            placement: { type: string, nullable: true }
            colors: { type: string[], nullable: true }
        delivery_commitment:
          type: object
          nullable: true
          fields:
            method: { type: enum, values: [pickup, ship, deliver] }
            address: { type: string, nullable: true }
            critical_date: { type: date, nullable: true }
      optional:
        notes: { type: string }
        assignment: { type: string }
    response:
      status: 201
      body:
        order_id: uuid
        order_number: string
        current_revision_id: uuid
        revision_index: 1
        lifecycle_state: draft
        payment_state: unpaid
        customer_identity_state: provisional | resolved
        line_items: array
        created_at: timestamp
    errors:
      400: missing required fields or invalid seed_ids
      404: seed_id not found in artwork module
      409: seed already promoted to an existing order
    rules:
      - every seed_id must resolve to an existing intake seed in artwork module
      - creates exactly one order and one order_revision atomically
      - order_revision is immutable from the moment of creation
      - order.current_revision_id points to this first revision
      - intake_seed_refs are stored as immutable evidence on the revision

  get_order:
    method: GET
    path: /api/v3/orders/:order_id
    purpose: >
      Return the canonical order with its current revision, line items,
      and state. Staff-only. This is the full read surface for order truth
      including operator-owned mutable fields.
    auth: requireStaff
    response:
      body:
        order_id: uuid
        order_number: string
        current_revision_id: uuid
        active_quote_id: uuid?
        lifecycle_state: string
        payment_state: string
        customer_identity_state: string
        customer_id: uuid?
        provisional_customer_ref: object?
        assignment: string?
        operator_working_notes: string?
        current_revision:
          order_revision_id: uuid
          revision_index: integer
          parent_revision_id: uuid?
          change_reason: string?
          line_items: array
          delivery_commitment: object?
          artwork_binding_refs: uuid[]
          intake_evidence_refs: uuid[]
          created_at: timestamp
        created_at: timestamp
        updated_at: timestamp
    errors:
      404: order not found

  get_order_customer:
    method: GET
    path: /api/v3/orders/:order_id/customer-view
    purpose: >
      Customer-scoped read. Returns only customer-visible fields. Operator-
      owned mutable fields (assignment, operator_working_notes, provisional
      customer resolution) are redacted. Scoped to orders belonging to the
      authenticated customer.
    auth: requireCustomer (scoped to own orders via customer_id)
    response:
      body:
        order_id: uuid
        order_number: string
        lifecycle_state: string
        payment_state: string
        current_revision:
          line_items: array
          delivery_commitment: object?
          created_at: timestamp
        created_at: timestamp
    errors:
      404: order not found or not owned by customer

  create_revision:
    method: POST
    path: /api/v3/orders/:order_id/revisions
    purpose: >
      Create a new immutable order_revision when a material business change
      occurs. The order's current_revision_id pointer updates atomically.
    auth: requireStaff or governed capability
    request:
      required:
        change_reason:
          type: string
          rule: must describe the material change that requires a new revision
        line_items:
          type: array
          min_length: 1
          item:
            order_line_id:
              type: uuid
              rule: >
                reuse existing order_line_id for the same business line.
                removing a line tombstones it; it does not erase history.
            product: { type: string, required: true }
            quantity: { type: integer, min: 1, required: true }
            decoration_type: { type: decoration_enum, required: true }
            garment: { type: garment_spec, nullable: true }
            size_breakdown: { type: object, nullable: true }
            placement: { type: string, nullable: true }
            colors: { type: string[], nullable: true }
      optional:
        delivery_commitment: { type: object }
        artwork_binding_refs: { type: uuid[] }
    response:
      status: 201
      body:
        order_revision_id: uuid
        order_id: uuid
        revision_index: integer
        parent_revision_id: uuid
        change_reason: string
        line_items: array
        created_at: timestamp
    errors:
      400: missing change_reason or line_items
      404: order not found
      409: order in terminal state (fulfilled or cancelled)
    rules:
      - revision is immutable from the moment of creation
      - parent_revision_id must equal the order's current_revision_id at call time
      - revision_index increments by 1
      - order.current_revision_id atomically updates to the new revision
      - order_line_id persists across revisions for the same business line
      - a new revision is NOT required for pricing-only, notes-only, or
        assignment-only changes (per revision_rules in authority)

  transition:
    method: POST
    path: /api/v3/orders/:order_id/transitions
    purpose: >
      Advance the order lifecycle state. Lifecycle and payment are orthogonal
      axes — this endpoint governs lifecycle_state only.
    auth: requireStaff or governed capability
    request:
      required:
        to_state:
          type: enum
          values: [draft, quoted, approved, production, fulfilled, cancelled]
          rule: must be a valid transition from current lifecycle_state
      optional:
        reason: { type: string }
        payment_state_update:
          type: enum
          values: [unpaid, partially_paid, paid, refunded]
          rule: >
            optional orthogonal update. payment_state is projected from
            payment/finance evidence, but may be set explicitly when
            evidence arrives out of band.
    response:
      body:
        order_id: uuid
        previous_state: string
        current_state: string
        payment_state: string
        transitioned_at: timestamp
        actor: string
        reason: string?
    errors:
      400: invalid transition (e.g., draft → production)
      404: order not found
      409: order already in terminal state
    rules:
      - allowed transitions per authority state_models.order_lifecycle_state
      - fulfilled and cancelled are terminal (no further transitions)
      - every transition creates an immutable audit event
      - transition to production requires lifecycle_state=approved AND
        payment_state=paid (enforced at API layer, not just database)

  history:
    method: GET
    path: /api/v3/orders/:order_id/history
    purpose: >
      Return the complete audit trail: all revisions, all state transitions,
      and all mutable-field changes in chronological order.
    auth: requireStaff
    response:
      body:
        order_id: uuid
        revisions:
          type: array
          item:
            order_revision_id: uuid
            revision_index: integer
            parent_revision_id: uuid?
            change_reason: string?
            line_items: array
            created_at: timestamp
        transitions:
          type: array
          item:
            from_state: string?
            to_state: string
            actor: string
            reason: string?
            created_at: timestamp
        field_changes:
          type: array
          item:
            field_name: string
            old_value: string?
            new_value: string
            actor: string
            changed_at: timestamp
          rule: >
            sourced from order_field_changes table. every PATCH to mutable
            fields produces one row per changed field.
        timeline:
          type: array
          rule: >
            merged chronological view of revisions, transitions, and
            field_changes, sorted by created_at/changed_at ascending
    errors:
      404: order not found

# ─── MUTABLE FIELD UPDATES ──────────────────────────────────────────────
#
# These operations update the order's mutable pointer and working fields
# without creating a new revision. Per the authority, mutable fields are:
# current_revision_id (managed by create_revision), active_quote_id
# (managed by quotes module), assignment, customer resolution pointer,
# and operator_working_notes.

  update_order:
    method: PATCH
    path: /api/v3/orders/:order_id
    purpose: >
      Update mutable working fields on the order. Does NOT create a new
      revision. Does NOT change lifecycle or payment state. Every changed
      field produces an append-only row in order_field_changes for the
      history endpoint to consume.
    auth: requireStaff
    request:
      optional:
        assignment: { type: string }
        operator_working_notes: { type: string }
        active_quote_id:
          type: uuid
          nullable: true
          rule: >
            managed by the quotes module. set when a quote becomes the
            active quote for the order, or cleared when superseded or
            withdrawn after payment reconciliation.
        customer_id:
          type: uuid
          rule: >
            resolves a provisional customer to a canonical customer_id.
            once resolved, cannot revert to provisional.
    response:
      body:
        order_id: uuid
        updated_fields: string[]
        updated_at: timestamp
    errors:
      404: order not found
      409: attempting to revert resolved customer to provisional
    rules:
      - for each changed field, insert one row into order_field_changes
        with field_name, old_value, new_value, actor, changed_at
      - customer_id resolution also updates customer_identity_state
        from provisional to resolved
      - active_quote_id may be set or cleared by the quotes module via this
        PATCH surface when a quote becomes active, superseded, or cleared
        after payment reconciliation

# ─── COMPATIBILITY FACADE ───────────────────────────────────────────────
#
# The existing /api/v2/jobs/* endpoints remain as a read-and-update facade.
# They map onto the canonical order model underneath but do NOT create
# order truth. Order creation requires real intake evidence through the
# canonical promote-intake endpoint or the intake/seed surface.
#
# Decision: POST /api/v2/jobs is NOT a compatibility write. The v2 facade
# is read-only for listing/getting and update-only for mutable fields and
# transitions. This avoids violating the promotion boundary (order-truth
# authority lines 50, 236, 243) which requires real normalized intake
# evidence — not synthetic seeds invented by a facade.

compatibility:
  facade_base: /api
  backing_model: canonical order + order_revision
  scope: reads, mutable-field updates, transitions, and expense writes only

  # ── CORE JOBS (12 endpoints in API.md) ──

  core_jobs:
    - path: GET /api/v2/jobs
      action: PRESERVED (read)
      mapping: list orders flattened to job shape from canonical model

    - path: GET /api/v2/jobs/{id}
      action: PRESERVED (read)
      mapping: get order flattened to job shape, staff-only fields included

    - path: POST /api/v2/jobs
      action: REMOVED
      reason: >
        order creation requires real intake evidence. callers must use
        POST /api/v3/orders/promote-intake or submit through intake first.

    - path: PATCH /api/v2/jobs/{id}
      action: PRESERVED (update)
      mapping: delegates to PATCH /api/v3/orders/:order_id (mutable fields,
        including active_quote_id)

    - path: DELETE /api/v2/jobs/{id}
      action: REMOVED
      reason: >
        orders are not soft-deletable in the canonical model. cancelled is a
        terminal lifecycle state reached via transition, not a delete.

    - path: POST /api/v2/jobs/{id}/status
      action: PRESERVED (update)
      mapping: delegates to POST /api/v3/orders/:order_id/transitions

    - path: POST /api/v2/jobs/{id}/duplicate
      action: REMOVED
      reason: >
        duplication must go through promote-intake with the original order's
        seed refs as evidence.

    - path: POST /api/v2/jobs/{id}/assign
      action: PRESERVED (update)
      mapping: delegates to PATCH /api/v3/orders/:order_id with assignment field

    - path: PUT /api/v2/jobs/{id}/customer
      action: PRESERVED (update)
      mapping: delegates to PATCH /api/v3/orders/:order_id with customer_id field

    - path: GET /api/customer/orders
      action: PRESERVED (read)
      mapping: list orders scoped to authenticated customer, redacted shape

    - path: GET /api/orders/public/{orderNumber}
      action: PRESERVED (read)
      mapping: public order lookup by order_number, minimal fields only

    - path: GET /api/employee/jobs
      action: PRESERVED (read)
      mapping: list orders scoped to employee, staff-visible shape

  # ── NESTED RESOURCES (13 endpoints in API.md) ──

  nested_resources:
    - path: GET /api/v2/jobs/{id}/line-items
      action: PRESERVED (read)
      mapping: current_revision.line_items

    - path: POST /api/v2/jobs/{id}/line-items
      action: REMOVED
      reason: >
        adding a line item is a material business change per revision_rules.
        use POST /api/v3/orders/:order_id/revisions with the updated line set.

    - path: PUT /api/v2/jobs/{id}/line-items/{lineItemId}
      action: REMOVED
      reason: >
        modifying a line item is a material business change per revision_rules.
        use POST /api/v3/orders/:order_id/revisions with the updated line set.

    - path: DELETE /api/v2/jobs/{id}/line-items/{lineItemId}
      action: REMOVED
      reason: >
        removing a line item creates a new revision that tombstones the line.
        use POST /api/v3/orders/:order_id/revisions with the line omitted or
        marked is_tombstoned.

    - path: POST /api/v2/jobs/{id}/line-items/{lineItemId}/mockups
      action: REMOVED
      reason: >
        mockups are not part of order truth. they belong to artwork_binding
        and digital-proofs. de-scoped from orders module.

    - path: POST /api/v2/jobs/{id}/imprints
      action: REMOVED
      reason: >
        imprints are absorbed into line_item decoration fields. adding or
        changing decoration is a material change requiring a new revision.

    - path: PUT /api/v2/jobs/{id}/imprints/{imprintId}
      action: REMOVED
      reason: same as POST imprints — decoration changes require new revision.

    - path: DELETE /api/v2/jobs/{id}/imprints/{imprintId}
      action: REMOVED
      reason: same as POST imprints — decoration changes require new revision.

    - path: POST /api/v2/jobs/{id}/imprints/{imprintId}/mockups
      action: REMOVED
      reason: mockups de-scoped to digital-proofs module.

    - path: GET /api/v2/jobs/{id}/expenses
      action: PRESERVED (read)
      mapping: order_expenses for this order

    - path: POST /api/v2/jobs/{id}/expenses
      action: PRESERVED (write)
      mapping: >
        expenses are operational cost tracking, not business truth requiring
        revision immutability. direct expense creation is allowed.

    - path: DELETE /api/v2/jobs/{id}/expenses/{expenseId}
      action: PRESERVED (write)
      mapping: expense deletion is allowed for the same reason.

    - path: GET /api/v2/jobs/{id}/profit
      action: PRESERVED (read)
      mapping: computed from current_revision.line_items and order_expenses

  # ── FACADE SUMMARY ──

  summary:
    total_v2_endpoints: 25
    preserved_read: 8
    preserved_update: 4
    preserved_write: 2 (expense create and delete only)
    removed: 11
    rule: >
      no v2 endpoint may create order truth, create or mutate line items,
      create or mutate imprints, or manage mockups. order truth writes flow
      exclusively through the v3 canonical surface.

  retirement_condition: >
    facade may be retired when no active consumer depends on /api/v2/jobs/*
    endpoints. track via access logs on the facade router.

# ─── IMPRINT REPRESENTATION ────────────────────────────────────────────
#
# The old module had explicit imprint CRUD (orders_imprints table with
# location, method, color_count, mockups). The canonical model does not
# carry a separate imprint entity because decoration metadata is part of
# the line item in the order-truth authority.
#
# Mapping decision: imprints are absorbed into line_item decoration fields.

imprint_mapping:
  old_model:
    table: orders_imprints
    fields: [location, method, color_count, mockup_count, metadata]
    crud: full CRUD via /api/v2/jobs/:id/imprints
  new_model:
    location: order_line_items.placement
    method: order_line_items.decoration_type
    color_count: order_line_items.colors (array length)
    mockups: >
      mockups are not part of order truth. They belong to the artwork_binding
      and digital-proofs domain. The old imprint.mockups field is de-scoped
      from the orders module; mockup management moves to digital-proofs.
    metadata: order_line_items.metadata (JSONB, carries decoration extras)
  facade_read: >
    There is no standalone v2 imprint read endpoint (the old module only
    had POST, PUT, DELETE, and mockup write routes for imprints — no GET).
    Imprint-shaped data is not exposed as a separate compatibility route.
    Decoration truth is read through the canonical current_revision.line_items
    on GET /api/v3/orders/:order_id or through the v2 facade's
    GET /api/v2/jobs/{id} response which includes line_item decoration fields.
  write_path: >
    No direct imprint CRUD. Decoration changes flow through create_revision.
    This is correct per the authority: changing decoration method, placement,
    or color count is a material change that requires a new revision.

# ─── DATABASE SCHEMA ────────────────────────────────────────────────────
#
# Replaces the flat orders_jobs model with canonical entities.
# The existing 0001_init.sql migration is superseded.

schema:
  supersedes: orders/migrations/0001_init.sql
  tables:
    orders:
      columns:
        order_id: { type: uuid, primary_key: true, default: gen_random_uuid() }
        order_number: { type: text, unique: true, not_null: true }
        customer_id: { type: uuid, nullable: true }
        provisional_customer_ref: { type: jsonb, nullable: true }
        customer_identity_state: { type: text, not_null: true, check: "provisional|resolved" }
        lifecycle_state: { type: text, not_null: true, default: draft, check: "draft|quoted|approved|production|fulfilled|cancelled" }
        payment_state: { type: text, not_null: true, default: unpaid, check: "unpaid|partially_paid|paid|refunded" }
        current_revision_id: { type: uuid, not_null: true, references: order_revisions(order_revision_id) }
        active_quote_id: { type: uuid, nullable: true }
        assignment: { type: text, nullable: true }
        operator_working_notes: { type: text, nullable: true }
        intake_seed_refs: { type: uuid[], not_null: true }
        created_at: { type: timestamptz, default: now() }
        updated_at: { type: timestamptz, default: now() }
      indexes:
        - [lifecycle_state]
        - [customer_id]
        - [payment_state]

    order_revisions:
      columns:
        order_revision_id: { type: uuid, primary_key: true, default: gen_random_uuid() }
        order_id: { type: uuid, not_null: true, references: orders(order_id) }
        revision_index: { type: integer, not_null: true }
        parent_revision_id: { type: uuid, nullable: true, references: order_revisions(order_revision_id) }
        change_reason: { type: text, nullable: true }
        delivery_commitment: { type: jsonb, nullable: true }
        artwork_binding_refs: { type: uuid[], default: "{}" }
        intake_evidence_refs: { type: uuid[], default: "{}" }
        created_at: { type: timestamptz, default: now() }
      constraints:
        - unique(order_id, revision_index)
      indexes:
        - [order_id]
      immutability: >
        rows in this table are append-only. UPDATE and DELETE are prohibited
        at the application layer. Consider a database trigger or policy to
        enforce this if the team grows.

    order_line_items:
      columns:
        id: { type: uuid, primary_key: true, default: gen_random_uuid() }
        order_revision_id: { type: uuid, not_null: true, references: order_revisions(order_revision_id) }
        order_line_id: { type: uuid, not_null: true }
        product: { type: text, not_null: true }
        quantity: { type: integer, not_null: true, check: "> 0" }
        decoration_type: { type: text, not_null: true }
        garment: { type: jsonb, nullable: true }
        size_breakdown: { type: jsonb, nullable: true }
        placement: { type: text, nullable: true }
        colors: { type: text[], nullable: true }
        is_tombstoned: { type: boolean, default: false }
        metadata: { type: jsonb, default: "{}" }
      indexes:
        - [order_revision_id]
        - [order_line_id]
      note: >
        order_line_id is stable across revisions for the same business line.
        Tombstoned lines appear in revision history but are excluded from
        active line item counts.

    order_transitions:
      columns:
        id: { type: bigserial, primary_key: true }
        order_id: { type: uuid, not_null: true, references: orders(order_id) }
        from_state: { type: text, nullable: true }
        to_state: { type: text, not_null: true }
        from_payment_state: { type: text, nullable: true }
        to_payment_state: { type: text, nullable: true }
        actor: { type: text, not_null: true }
        reason: { type: text, nullable: true }
        created_at: { type: timestamptz, default: now() }
      indexes:
        - [order_id]
      immutability: append-only audit trail

    order_field_changes:
      columns:
        id: { type: bigserial, primary_key: true }
        order_id: { type: uuid, not_null: true, references: orders(order_id) }
        field_name: { type: text, not_null: true }
        old_value: { type: text, nullable: true }
        new_value: { type: text, not_null: true }
        actor: { type: text, not_null: true }
        changed_at: { type: timestamptz, default: now() }
      indexes:
        - [order_id]
      immutability: >
        append-only audit trail for mutable field changes. One row per
        changed field per PATCH call. Consumed by GET /history endpoint.

    order_expenses:
      columns:
        id: { type: uuid, primary_key: true, default: gen_random_uuid() }
        order_id: { type: uuid, not_null: true, references: orders(order_id) }
        category: { type: text, not_null: true }
        description: { type: text, nullable: true }
        amount_cents: { type: integer, not_null: true, check: ">= 0" }
        incurred_at: { type: timestamptz, default: now() }
        created_at: { type: timestamptz, default: now() }
      note: >
        Expenses attach to the order, not to a specific revision.
        They are operational cost tracking, not business truth that
        requires revision immutability.

# ─── SCHEMA TRUTH SUPERSESSION ──────────────────────────────────────────

schema_truth_updates:
  - file: docs/ARCHITECTURE/SCHEMA_TRUTH.md
    line: 92
    old: "NO SEPARATE QUOTES TABLE"
    new: >
      Quotes are their own immutable entity per the approved order-truth
      authority (v2). The orders module stores orders and order_revisions.
      The quotes module (separate service) stores quotes referencing
      order_revision_id + pricing_snapshot_id.
  - file: docs/ARCHITECTURE/DATABASE_OWNERSHIP.md
    rule: R7
    old: "NO QUOTES TABLE"
    new: >
      The quotes module owns its own table(s). Quotes reference orders
      via order_revision_id. This supersedes the pre-authority R7 lock.
  - file: orders/migrations/0001_init.sql
    action: >
      Superseded by 0002_canonical_entities.sql which implements the
      canonical order + order_revision + order_line_items schema.
      0001 remains as historical reference.

# ─── DOWNSTREAM CONTRACTS ───────────────────────────────────────────────

downstream:
  quotes_module:
    consumes: order_id, order_revision_id (via API, not direct DB)
    provides: active_quote_id updates back to order via
      PATCH /api/v3/orders/:order_id
    contract: quotes/SPEC.md already conforms
  production_module:
    consumes: order_id, current_revision_id, lifecycle_state, payment_state
    gate: production readiness check requires approved + paid
    contract: ops/bindings/domains/mint/mint.production.readiness.authority.yaml
  digital_proofs:
    consumes: order_line_id, artwork_binding_refs from order_revision
    contract: digital-proofs/module.contract.yaml already conforms
  pricing_module:
    consumes: order_revision line_items for pricing_snapshot calculation
    provides: pricing_snapshot_id (consumed by quotes)
  payment_module:
    provides: payment_state updates (via transition endpoint or webhook)
