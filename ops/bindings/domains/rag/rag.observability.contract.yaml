# RAG Reindex Observability Contract
# Governs which metrics are exported, where, and what alert thresholds apply.
#
# Authority: docs/governance/RAG_REINDEX_RUNBOOK.md
# Consumers:
# - ops/plugins/infra/rag/bin/rag-reindex-metrics-export
# - Prometheus textfile collector or pull integration
#
# Status: authoritative
# Owner: "@ronny"

schema_version: "1.0"
updated_at: "2026-04-25"
owner: "@ronny"
status: authoritative

# Exporter details
exporter:
  script: ops/plugins/infra/rag/bin/rag-reindex-metrics-export
  capability: rag.reindex.metrics.export
  output_format: prometheus_text_exposition
  # Intended collection method: Prometheus node-exporter textfile collector
  # Script stdout piped to .prom file in the textfile collector directory.
  # Example cron: */5 * * * * /path/to/rag-reindex-metrics-export > /var/lib/node_exporter/textfile/rag_reindex.prom 2>/dev/null
  collection_method: textfile_collector
  textfile_path_hint: "/var/lib/node_exporter/textfile/rag_reindex.prom"
  recommended_interval_sec: 300
  local_flag: "--local"
  local_flag_description: "Skip SSH, read state from local filesystem (for cron execution on ai-consolidation)"

# Metrics catalogue
metrics:
  - name: rag_reindex_exporter_up
    type: gauge
    description: "Whether the metrics exporter can reach the remote reindex host. 0=unreachable, 1=reachable."

  - name: rag_reindex_docs_uploaded_total
    type: gauge
    description: "Total documents uploaded in the current reindex run, scoped to the latest START marker in the log."

  - name: rag_reindex_docs_failed_total
    type: gauge
    description: "Total documents that failed upload in the current reindex run, scoped to the latest START marker."

  - name: rag_reindex_session_running
    type: gauge
    description: "Whether the reindex tmux session is active (1) or stopped (0)."

  - name: rag_reindex_stall_minutes
    type: gauge
    description: "Minutes since the reindex log file was last modified. 0 if no log exists."

  - name: rag_reindex_last_embedding_latency_ms
    type: gauge
    description: "Latency of a single embedding probe against the active Ollama model, in milliseconds. -1 if probe failed or was skipped."

# Alert thresholds
# These are documented thresholds for alerting rules. No Prometheus/Alertmanager
# config is created by this contract — thresholds are reference for future wiring.
alert_thresholds:
  stall:
    metric: rag_reindex_stall_minutes
    condition: "> 30"
    description: "Reindex has not produced log output for 30+ minutes while session is running."
    severity: warning
    reference: ops/bindings/domains/rag/rag.reindex.quality.yaml#stall_detection.max_stall_minutes

  failure_rate:
    metric: "rag_reindex_docs_failed_total / (rag_reindex_docs_uploaded_total + rag_reindex_docs_failed_total)"
    condition: "> 0.05"
    description: "More than 5% of documents failed upload during the current reindex run."
    severity: warning

  session_expected:
    metric: rag_reindex_session_running
    condition: "== 0 during active reindex window"
    description: "Tmux session is not running when a reindex is expected to be in progress."
    severity: info

  embedding_latency:
    metric: rag_reindex_last_embedding_latency_ms
    condition: "> 5000"
    description: "Embedding probe latency exceeds the SLO defined in the embedding backend contract."
    severity: warning
    reference: ops/bindings/domains/rag/rag.embedding.backend.yaml#probe.max_latency_ms

  exporter_down:
    metric: rag_reindex_exporter_up
    condition: "== 0"
    description: "Cannot reach the remote reindex host from the exporter."
    severity: critical

# Data sources — bindings consumed by the exporter
data_sources:
  - binding: ops/bindings/domains/rag/rag.remote.runner.yaml
    fields_used:
      - ".remote.host"
      - ".remote.user"
      - ".remote.port"
      - ".remote.repo_path"
      - ".remote.tmux_session"
      - ".remote.log_path"

  - binding: ops/bindings/domains/rag/rag.embedding.backend.yaml
    fields_used:
      - ".active.model"
      - ".probe.test_prompt"

# Activation
# The activation script wires the exporter into cron on ai-consolidation.
# Run with --dry-run (default) to preview, --status to check, --install to wire.
activation:
  script: ops/plugins/infra/rag/bin/rag-observability-activate
  capability: rag.observability.activate
  collection_status: activatable
  install_command: "cap run rag.observability.activate -- --install"
  status_command: "cap run rag.observability.activate -- --status"
  notes: >
    Status is 'activatable' until --install is run against ai-consolidation.
    After successful install, operator should update collection_status to 'active'.

# Quality contract cross-references
quality_contract_refs:
  stall_detection: ops/bindings/domains/rag/rag.reindex.quality.yaml#stall_detection
  index_health: ops/bindings/domains/rag/rag.reindex.quality.yaml#index_health
  dependency_slos: ops/bindings/domains/rag/rag.reindex.quality.yaml#dependency_slos
