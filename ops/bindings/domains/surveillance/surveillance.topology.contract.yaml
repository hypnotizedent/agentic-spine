# Surveillance Topology Contract v1.0
# Authority: LOOP-SURVEILLANCE-PLATFORM-LAUNCH-20260302
# Scope: Runtime topology, storage/retention, HA integration authority

contract_id: SURVEILLANCE_TOPOLOGY_CONTRACT_V1
version: "1.0"
status: active
owner: "@ronny"
created: "2026-03-04"
last_verified: "2026-04-14"
parent_loop: LOOP-SURVEILLANCE-PLATFORM-LAUNCH-20260302

# ─── Canonical Decisions ─────────────────────────────────────────────
canonical_decisions:
  ha_instance_policy: single
  ha_instance_target: home
  ha_instance_note: "Existing home HA instance (VM 100, proxmox-home) is the sole automation authority. No separate shop-ha VM."
  deployment_baseline: cpu_first
  gpu_policy: optional_future
  gpu_note: "GPU acceleration (Tesla P40, Intel QSV, etc.) is documented as optional future optimization. Never a deployment blocker."
  vmid_policy: governed_intake
  vmid_note: "VM IDs allocated exclusively through infra.vm.intake.scaffold + vm.lifecycle.yaml. No hardcoded IDs in planning."

# ─── Runtime Topology ────────────────────────────────────────────────
runtime:
  surveillance_stack:
    hostname: surveillance-stack
    vm_id: 215
    lan_ip: "192.168.1.215"
    tailscale_ip: "100.89.1.111"
    proxmox_host: pve
    access_policy: lan_first
    os: ubuntu-24.04
    profile: spine-ready-v1
    services:
      - name: frigate
        image: ghcr.io/blakeblackshear/frigate:stable
        purpose: "NVR replacement + object detection (CPU baseline)"
        ports:
          web_ui: 5000
          rtsp: 8554
          webrtc: 8555
        detector: cpu
        detector_note: "OpenCV CPU detector. GPU passthrough optional future enhancement."
      - name: go2rtc
        image: alexxit/go2rtc:latest
        purpose: "WebRTC/RTSP proxy for low-latency camera viewing"
        ports:
          api: 1984
          rtsp: 8554
          webrtc: 8555
        live_note: "Standalone go2rtc container is STILL RUNNING on surveillance-stack (as of 2026-04-14). Frigate 0.17+ also bundles go2rtc internally. Both coexist."
        target_note: "Target is bundled-only inside Frigate (standalone container to be removed in workbench normalization wave)."

  home_assistant:
    hostname: homeassistant
    vm_id: 100
    proxmox_host: proxmox-home
    lan_ip: "10.0.0.100"
    tailscale_ip: "100.67.120.1"
    integration_type: frigate_mqtt
    integration_live_state: INACTIVE  # mqtt.enabled=false on Frigate as of 2026-04-14
    integration_note: "Target integration is Frigate MQTT over Tailscale. Currently inactive because mqtt.enabled=false on surveillance-stack. HA can reach Frigate URL but MQTT event pipeline is not running."
    mqtt_broker_host: "100.67.120.1"
    mqtt_broker_port: 1883
    frigate_integration_url: "http://100.89.1.111:5000"
    tailscale_addon:
      networking_mode: kernel
      userspace_networking: false
      accept_routes: true
      accept_dns: true
    relay_proxy_status: removed
    relay_proxy_note: "No proxmox-home socat relay is part of the canonical runtime."

# ─── Camera Source ───────────────────────────────────────────────────
camera_source:
  nvr_model: "Hikvision ERI-K216-P16"
  nvr_ip: "192.168.1.216"
  nvr_ssh_target: nvr-shop
  channels_configured: 12
  channels_online: 10
  channels_offline: 2
  channels_offline_ids: [2, 5]  # ALLY WAY, alleyway exit — awaiting physical cable install
  channels_online_note: "Truth-converged 2026-04-14: 10 cameras confirmed live via Frigate API"
  rtsp_port: 554
  credential_path: "infrastructure/prod:/spine/shop/nvr/*"

# ─── Storage & Retention ────────────────────────────────────────────
storage:
  tier: tank-vms
  tier_note: "ZFS zvol attached as virtio disk. Recordings and Frigate DB on dedicated non-boot storage."
  boot_disk_gb: 50
  data_disk_gb: 100
  data_disk_target_gb: 2000  # pending 2TB remediation wave
  config_root: /srv/config/surveillance
  data_root: /srv/data/surveillance
  runtime_root: /srv/runtime/surveillance
  frigate_db_path: /srv/data/surveillance/frigate.db
  recordings_path: /srv/data/surveillance/recordings
  clips_path: /srv/data/surveillance/clips
  snapshots_path: /srv/data/surveillance/snapshots
  export_path: /srv/data/surveillance/clips/export
  normalization_note: "Paths normalized from /mnt/data/frigate/* to /srv/* in 2026-03-19 normalization wave."

retention:
  # Current honest live state: watch-only minimal (2026-04-14)
  live:
    recordings_days: 0  # record.enabled: false, recordings dir empty
    clips_days: 0  # detect.enabled: false, no clips generated
    snapshots_days: 0  # snapshots disabled
    continuous_recording: false
    record_enabled: false
    detect_enabled: false
    mqtt_enabled: false
    honest_capacity_note: "Watch-only minimal posture. No active writer. Retention claims are zero."
  # Target after recording enabled on current 100GB disk
  target_recording_enabled:
    recordings_days: 1  # 100GB disk at 198GB/day = ~1 day honest capacity
    clips_days: 14
    snapshots_days: 0
    precondition: "operator_enables_record_enabled_true"
  # Target after 2TB remediation wave
  target_2tb:
    recordings_days: 7
    clips_days: 14
    snapshots_days: 0
    precondition: "disk_expansion_100gb_to_2tb"
  cleanup_policy: automatic
  cleanup_note: "Frigate built-in retention management. Oldest recordings auto-deleted when storage threshold reached. Currently inactive (no recordings)."
  storage_warning_threshold_pct: 85

# ─── Capabilities ───────────────────────────────────────────────────
capabilities:
  - id: surveillance.stack.status
    safety: read-only
    purpose: "Frigate health, camera online/offline counts, detector pipeline (CPU), disk pressure"
  - id: surveillance.event.query
    safety: read-only
    purpose: "Query Frigate events by camera/label/time range; return counts + latest matches"

# ─── Drift Rules ────────────────────────────────────────────────────
drift_rules:
  forbidden_required_references:
    - "shop-ha"
    - "VM 211"
    - "VM 212"
    - "Tesla P40 required"
  allowed_historical_only:
    - pattern: "shop-ha"
      context: "May appear in historical notes if explicitly marked deprecated/non-authoritative"
    - pattern: "GPU"
      context: "May appear as optional future enhancement, never as required dependency"

