# Media Services Binding (SSOT)
# Status: projection
# Owner: "@ronny"
# Last verified: 2026-03-21
# Scope: media-stack-services
#
# Consolidated service inventory for media-stack tenant.
# Derived from SERVICE_REGISTRY.yaml with media-stack specific metadata.
# Used by: media.health.check, media.service.status capabilities
#          D106-D110 drift gates

version: 7
updated_at: "2026-03-24"
owner: "@ronny"

defaults:
  health_timeout_sec: 10
  compose_command: "docker compose"

naming_aliases:
  media-stack:
    status: deprecated
    replaced_by:
      - download-stack
      - streaming-stack
    note: "Legacy media-stack host alias retired after VM split."
  arr-stack:
    status: active
    canonical_vm: media-home
    target_vm: media-home
    note: "Canonical ARR writer control plane is now active on media-home. Residual shop copies remain parked rollback residue."
  media-home-stack:
    status: active
    canonical_vm: media-home
    note: "Canonical active watch plane on media-home VM 106 backed by Synology /volume1/media-staging."

operating_model:
  active_plane:
    vm: media-home
    note: "Canonical live read/watch plane. Streaming services plus ARR management services are operational on media-home. Dual-ingest model active: SABnzbd primary (usenet), qBittorrent secondary (torrent)."
  writer_plane:
    target_vm: media-home
    current_vm: media-home
    transition_state: dual_ingest_active
    note: "ARR management services (Radarr/Sonarr/Lidarr/Prowlarr) are active on media-home. Dual-ingest model: SABnzbd primary (usenet, priority 1), qBittorrent secondary (torrent, priority 2, VPN-tunneled via gluetun). Sonarr and Radarr use both clients. Lidarr uses SABnzbd only (conservative). See media.download.canary.guardrails.yaml for anti-bloat constraints."
  archive_plane:
    vm: pve
    note: "Canonical passive archive plane on md1400."
  transitional_shop_residue:
    - download-stack
    - streaming-stack

services:
  # ════════════════════════════════════════════════════════════════════════
  # VM 209 — download-stack (192.168.1.209)
  # ════════════════════════════════════════════════════════════════════════

  # Indexing
  prowlarr:
    vm: media-home
    target_vm: media-home
    port: 9696
    health: /ping
    status: active
    target_status: active
    category: indexing
    description: "Indexer manager for *arr services on the active home writer-management plane"

  # Management (*arr stack)
  radarr:
    vm: media-home
    target_vm: media-home
    port: 7878
    health: /ping
    status: active
    target_status: active
    category: management
    description: "Movie management active on media-home. Dual-ingest: SABnzbd primary (usenet), qBittorrent secondary (torrent, VPN-tunneled)."
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  sonarr:
    vm: media-home
    target_vm: media-home
    port: 8989
    health: /ping
    status: active
    target_status: active
    category: management
    description: "TV management active on media-home. Dual-ingest: SABnzbd primary (usenet), qBittorrent secondary (torrent, VPN-tunneled). 12 monitored series with files; 60 unmonitored wishlist. Manual-catalog posture: series added unmonitored, promoted deliberately."
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  lidarr:
    vm: media-home
    target_vm: media-home
    port: 8686
    health: /ping
    status: active
    target_status: active
    category: management
    description: "Music management active on media-home. Dual-ingest: SABnzbd primary (usenet), qBittorrent secondary (torrent via gluetun). Queue cleared 2026-03-24."
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  # Download clients
  sabnzbd:
    vm: media-home
    target_vm: media-home
    port: 8080
    health: /api?mode=version&output=json
    status: active
    target_status: active
    category: download
    ingest_role: primary
    ingest_protocol: usenet
    ingest_priority: 1
    canary_scope: true
    guardrails_contract: media.download.canary.guardrails.yaml
    categories:
      tv: /downloads/complete/tv
      movies: /downloads/complete/movies
      audio: /downloads/complete/audio
    enabled_in:
      - sonarr
      - radarr
      - lidarr
    description: "Usenet downloader on media-home — primary ingest path with anti-bloat guardrails. See media.download.canary.guardrails.yaml."

  qbittorrent:
    vm: media-home
    target_vm: media-home
    port: 8081
    health: /
    status: active
    target_status: active
    category: download
    ingest_role: secondary
    ingest_protocol: torrent
    ingest_priority: 2
    network_mode: via_tunnel
    vpn_routed: true
    tunnel_service: gluetun
    arr_host: gluetun
    categories:
      sonarr: /downloads/complete/sonarr
      radarr: /downloads/complete/radarr
    enabled_in:
      - sonarr
      - radarr
    disabled_in:
      - lidarr
    description: "BitTorrent client on media-home — secondary ingest path. VPN-tunneled via gluetun (Privado, Netherlands). QB-VPN-ROUTE-001 superseded. SABnzbd remains primary. Activated 2026-03-22, VPN cutover 2026-03-22."

  # Enhancement services
  bazarr-dl:
    vm: download-stack
    port: 6767
    health: /ping
    status: parked
    category: enhancement
    description: "Subtitle management (download instance, currently inactive)"

  trailarr:
    vm: media-home
    port: 7667
    health: null
    health_reason: auth_gated
    status: active
    category: enhancement
    description: "Trailer management — running on media-home. Migrated from download-stack. Reconciled 2026-04-25."

  posterizarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: enhancement
    description: "Poster art management — running on media-home. Migrated from download-stack. Reconciled 2026-04-25."

  unpackerr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "Archive extraction for downloads — active on media-home. Monitors Radarr/Sonarr/Lidarr queues."

  recyclarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "TRaSH guide sync — running on media-home. Migrated from download-stack. Reconciled 2026-04-25."

  flaresolverr:
    vm: media-home
    port: 8191
    health: /health
    status: active
    category: utility
    description: "Cloudflare challenge solver — running on media-home. Migrated from download-stack. Reconciled 2026-04-25."

  # Experimental services
  autopulse:
    vm: media-home
    port: 2875
    health: null
    health_reason: localhost_bound
    status: active
    category: utility
    description: "Library refresh trigger — active on media-home. Receives ARR webhooks, triggers Jellyfin/Navidrome scan. Path rewrite bug fixed 2026-03-24 (identity rewrites)."

  crosswatch:
    vm: media-home
    port: 8787
    health: null
    health_reason: localhost_bound
    status: active
    category: experimental
    description: "Cross-service watch sync — running on media-home. Migrated from download-stack. Reconciled 2026-04-25."

  decypharr:
    vm: media-home
    port: null
    health: null
    health_reason: no_host_port
    status: active
    category: experimental
    description: "Real-Debrid integration — running on media-home. Container port 8282 not host-mapped. Migrated from download-stack. Reconciled 2026-04-25."

  # Swaparr instances (stalled download swappers)
  swaparr-radarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: retired
    category: utility
    retired_at: "2026-04-25"
    description: "RETIRED 2026-04-25. Deprecated 2026-03-01, host VM decommissioned 2026-03-23. Queue rotation tool — no longer applicable after media-home consolidation."

  swaparr-sonarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: retired
    category: utility
    retired_at: "2026-04-25"
    description: "RETIRED 2026-04-25. Deprecated 2026-03-01, host VM decommissioned 2026-03-23. Queue rotation tool — no longer applicable after media-home consolidation."

  swaparr-lidarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: retired
    category: utility
    retired_at: "2026-04-25"
    description: "RETIRED 2026-04-25. Deprecated 2026-03-01, host VM decommissioned 2026-03-23. Queue rotation tool — no longer applicable after media-home consolidation."

  arr-native-search:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Native ARR missing-search scheduler (defined on residual writer plane, intentionally parked)"

  # VPN infrastructure
  gluetun:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: infrastructure
    description: "Privado VPN tunnel container active on media-home. Canonical tunnel for qBittorrent secondary ingest."

  # Parked services (intentionally stopped)
  tdarr:
    vm: download-stack
    port: 8265
    health: /
    status: parked
    category: parked
    description: "Transcode automation (soak period)"

  slskd:
    vm: media-home
    port: 5030
    health: null
    health_reason: vpn_network_mode
    status: active
    category: download
    description: "Soulseek client — active on media-home via gluetun VPN tunnel. Music grab pipeline restored 2026-03-24."
    dependencies: [gluetun]

  soularr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "Soulseek-Lidarr bridge — active on media-home. Searches Lidarr wanted list, triggers slskd grabs. 5-min cycle."
    dependencies: [lidarr, slskd]

  # Infrastructure
  crowdsec:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: infrastructure
    description: "Security monitoring active on media-home."

  watchtower-download:
    vm: download-stack
    container: watchtower
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: infrastructure
    description: "Residual on decommissioned download-stack (VM 209, decommissioned 2026-03-23). Not running."

  download-node-exporter:
    vm: download-stack
    container: node-exporter
    port: 9100
    health: /
    status: parked
    category: infrastructure
    description: "Residual on decommissioned download-stack (VM 209, decommissioned 2026-03-23). Not running."

  # ════════════════════════════════════════════════════════════════════════
  # Canonical active read-side plane: media-home VM 106
  # Residual streaming-stack checks remain elsewhere until split retirement closes.
  # ════════════════════════════════════════════════════════════════════════

  # Video streaming
  jellyfin:
    vm: media-home
    port: 8096
    health: /health
    status: active
    category: streaming
    description: "Canonical home video streaming server"
    critical: true

  # Music streaming
  navidrome:
    vm: media-home
    port: 4533
    health: /ping
    status: active
    category: streaming
    description: "Canonical home music streaming server. Integrations restored 2026-03-24: Spotify metadata, Last.fm scrobbling, LRClib lyrics. Scan schedule 15m."

  # Request management
  jellyseerr:
    vm: media-home
    port: 5055
    health: /api/v1/status
    status: active
    category: requests
    description: "Canonical home request management surface"

  # Subtitles
  bazarr:
    vm: media-home
    port: 6767
    health: /ping
    status: active
    category: enhancement
    description: "Subtitle management — running on media-home. Reconciled 2026-04-25."

  # Dashboard
  homarr:
    vm: media-home
    port: 7575
    health: /
    status: active
    category: dashboard
    role: operator-dashboard
    description: "Canonical home media dashboard"

  # User management
  wizarr:
    vm: media-home
    port: 5690
    health: /
    status: active
    category: user-mgmt
