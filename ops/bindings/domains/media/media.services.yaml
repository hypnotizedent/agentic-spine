  # Music sync
  spotisub:
    vm: media-home
    port: 8766
    health: /api/v1/utils/healthcheck
    status: active
    category: discovery
    description: "Spotify-to-Navidrome sync — promoted from parked 2026-03-24. Spotify OAuth + Last.fm keys configured."
    dependencies: [navidrome]

  feishin:
    type: client_app
    server: navidrome
    protocol: subsonic
    platforms: [desktop, mobile]
    status: active
    category: playback
    description: "Operator Navidrome client for music playback. Not a container — desktop/mobile app."

  subgen:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: enhancement
    description: "AI subtitle generation for Jellyfin — running on media-home. Reconciled 2026-04-25."

  # Infrastructure
  watchtower-streaming:
    vm: media-home
    container: watchtower
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: infrastructure
    description: "Auto-update utility — running on media-home. Reconciled 2026-04-25."

  streaming-node-exporter:
    vm: media-home
    container: node-exporter
    port: 9100
    health: /
    status: active
    category: infrastructure
    description: "Host metrics exporter — running on media-home. Reconciled 2026-04-25."

# Jellyfin plugins (active home media plane; inventory key retained under streaming-stack compatibility)
jellyfin_plugins:
  repositories:
    - name: "IAmParadox"
      url: "https://www.iamparadox.dev/jellyfin/plugins/manifest.json"
    - name: "Auto Collections (KeksBombe)"
      url: "https://raw.githubusercontent.com/KeksBombe/jellyfin-plugin-auto-collections/refs/heads/main/manifest.json"
    - name: "LizardByte"
      url: "https://app.lizardbyte.dev/jellyfin-plugin-repo/manifest.json"
  installed:
    - name: "Home Screen Sections"
      version: "2.5.2.0"
      status: active
      purpose: "Netflix-style home screen rows"
    - name: "Collection Sections"
      version: "2.3.5.0"
      status: active
      purpose: "Collection-driven library browsing"
    - name: "Auto Collections"
      version: "0.0.4.1"
      status: active
      purpose: "Automatic genre/decade/studio collections"

# Canonical VPN routing policy (see ops/bindings/vpn.provider.yaml)
vpn_policy:
  provider_binding: ops/bindings/vpn.provider.yaml
  tunnel_service: gluetun
  services:
    slskd:
      route_mode: via_tunnel
      tunnel_service: gluetun
    qbittorrent:
      route_mode: via_tunnel
      tunnel_service: gluetun
    sabnzbd:
      route_mode: direct

