# Post-download automation path topology
# Added 2026-03-24 as part of media E2E canonicalization
post_download_automation:
  unpackerr:
    vm: media-home
    status: active
    container_path: /downloads
    host_path: /srv/media/downloads
    watch_interval: 1m
    connected_services: [radarr, sonarr, lidarr]
    note: "Monitors ARR queues for completed downloads, extracts archives if needed"
  autopulse:
    vm: media-home
    status: active
    listen_port: 2875
    trigger: webhook
    target: jellyfin
    mount: "/srv/appdata/compose/media-write/volumes/autopulse -> /data"
    path_rewrites:
      radarr:
        from: /media/movies
        to: /media/movies
        status: identity
      sonarr:
        from: /media/tv
        to: /media/tv
        status: identity
      lidarr:
        from: /media/music
        to: /media/music
        status: identity
    fixed_at: "2026-03-24"
    fix_note: |
      Path rewrites updated from stale narrow-mount era to identity mappings.
      Container recreated via media-stack compose on media-home.
      Prior bug: old FROM values (/tv, /movies, /music) caused substring replacement
      inside broad-mount paths (/media/tv → /media/media/tv). Fixed by setting
      FROM to match current ARR paths.

