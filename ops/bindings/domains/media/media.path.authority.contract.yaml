    host_path: "/srv/media"
    nfs_source: "10.0.x.x:/volume1/media-staging"
    mode: rw
    nfs_version: "4.1"
    verified_at: "2026-03-24"
    verification_method: "mount | grep nfs via SSH -J root@100.x.x.x ubuntu@10.0.x.x"
    description: "Canonical NFS mount on VM 106 — NAS direct. All ARR containers read/write media through this mount."
    classification: "canonical_active"
  download-stack:
    host_path: "/mnt/media"
    nfs_source: "192.168.x.x:/media"
    mode: rw
    nfs_version: "4.2"
    verified_at: "2026-03-04"
    verification_method: "mount | grep nfs via SSH ubuntu@100.x.x.x"
    description: "NFS mount on VM 209 for ARR import/download — read-write for import operations"
    classification: "legacy_residue"
    residue_note: "Readable only as residual compatibility. NOT active truth. Canonical active plane is media-home VM 106. Shop-side retirement is tracked separately from the completed cutover."
  streaming-stack:
    host_path: "/mnt/media"
    nfs_source: "192.168.x.x:/media"
    mode: ro
    nfs_version: "4.2"
    verified_at: "2026-03-04"
    verification_method: "mount | grep nfs via SSH ubuntu@100.x.x.x"
    description: "NFS mount on VM 210 for Jellyfin/Navidrome playback — read-only for streaming"
    classification: "legacy_residue"
    residue_note: "Readable only as residual compatibility. NOT active truth. Canonical active plane is media-home VM 106. Shop-side retirement is tracked separately from the completed cutover."
  docker_volumes:
    download-stack:
      host_path: "/mnt/docker"
      nfs_source: "192.168.x.x:/tank/docker/download-stack"
      mode: rw
    streaming-stack:
      host_path: "/mnt/docker"
      nfs_source: "192.168.x.x:/tank/docker/streaming-stack"
      mode: rw

