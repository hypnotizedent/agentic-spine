description: |
  Canonical path authority matrix for the media pipeline.
  Every service that touches media files must have an explicit 4-way parity
  tuple: compose_mount, app_root, downloader_path, library_path.
  Drift between any two members of a tuple is a contract violation.

  Populated from Feb 25 container path trace audit (docker inspect + write tests)
  and gap trace evidence. TBD fields resolved on 2026-03-04 via SSH runtime API
  queries to download-stack (VM 209) and streaming-stack (VM 210) over Tailscale.

current_operating_model:
  canonical_active_plane:
    host: media-home
    vm_id: 106
    library_root: "/srv/media"
    backing_store: "10.0.x.x:/volume1/media-staging"
    note: "This is the live watch/download plane. The active library path is the Synology staging tree."
  canonical_writer_plane:
    host: media-home
    vm_id: 106
    status: active
    activated_at: "2026-03-21"
    note: "ARR management services (Radarr/Sonarr/Lidarr/Prowlarr) are active on media-home. Dual-ingest model: SABnzbd primary (usenet), qBittorrent secondary (torrent, VPN-tunneled via gluetun)."
  canonical_archive_plane:
    host: pve
    archive_root: "/nas-primary/archive/media*"
    note: "Archive remains shop-owned and is not the default playback surface."
  transitional_shop_residue:
    - download-stack
    - streaming-stack
  interpretation_rule: |
    Treat the shop-hosted tuples below as legacy rollback residue where noted.
    The canonical writer plane is now media-home for ARR management services.
    Download clients remain intentionally parked and are not active truth.

