known_issues:
  - id: autopulse-path-double-prefix
    severity: high
    status: fixed
    fixed_at: "2026-03-24"
    detail: "Autopulse rewrites updated to identity (FROM=/media/tv TO=/media/tv) in media-stack compose. Container recreated."
  - id: sonarr-queue-401-stuck
    severity: high
    status: fixed
    fixed_at: "2026-03-24"
    detail: "Queue cleaned from 315→0. 117 failed (manual qBit), 170 stale completed, 28 unavailable — all removed."
  - id: music-pipeline-restored
    severity: medium
    status: fixed
    fixed_at: "2026-03-24"
    detail: "slskd + soularr activated on media-home. Music grab pipeline restored."
  - id: lidarr-missing-remote-path-mappings
    severity: critical
    status: fixed
    fixed_at: "2026-03-24"
    detail: |
      ROOT CAUSE: Lidarr had ZERO remote path mappings. SABnzbd reported /downloads/complete/music/
      but Lidarr couldn't resolve to /media/downloads/complete/music/. All 280 completed downloads
      (171G) were stuck with "Permissions error" (actually path-not-found).
      FIX: Added RPMs for sabnzbd (/downloads/ → /media/downloads/) and gluetun (same).
      RESULT: 247+ tracks imported, 78 dirs cleared from complete/music.
  - id: qbittorrent-temp-password
    severity: high
    status: fixed
    fixed_at: "2026-03-24"
    detail: |
      qBit v5.1.4 was generating temp passwords on each restart — PBKDF2 hash was stale from upgrade.
      All 3 ARR apps had wrong credentials. Radarr IP was also banned by qBit (too many failed attempts).
      FIX: Set permanent password via qBit API, restarted qBit to clear IP bans, updated all ARR download clients.
  - id: music-library-permissions
    severity: high
    status: fixed
    fixed_at: "2026-03-24"
    detail: |
      /volume1/media-staging/music/ was 755 (ronadmin:users). Lidarr runs as root in container,
      NFS root_squash maps root→nobody, nobody can't write to 755 dirs.
      Movies dir was already 777 and worked fine.
      FIX: chmod 777 all music dirs, chmod 666 all music files (matching movies pattern).
  - id: jellyfin-music-library-missing
    severity: high
    status: fixed
    fixed_at: "2026-03-24"
    detail: |
      Jellyfin had NO music library configured. 21K+ tracks on disk invisible to streaming.
      Fixed: Added /media/music as music library via Jellyfin API.
      Result: 23,738 songs, 192 artists, 632 albums now indexed and streamable.
  - id: radarr-empty-library
    severity: info
    status: fixed
    fixed_at: "2026-03-24"
    detail: "239 movies added via TMDB bulk lookup. 28 have files on disk. 6 lookup failures (obscure/German titles)."
  - id: movies-import-staging-undeletable
    severity: low
    status: fixed
    fixed_at: "2026-03-24"
    detail: "movies-import-20260323/ deleted during stabilization wave via NAS SSH (ronadmin had sufficient perms after all)."
  - id: complete-music-corrupted-downloads
    severity: low
    status: fixed
    fixed_at: "2026-03-24"
    detail: "All complete/music dirs deleted during deferred cleanup. MusicBrainz failures + corrupted grabs purged. Lidarr will re-search monitored albums."

