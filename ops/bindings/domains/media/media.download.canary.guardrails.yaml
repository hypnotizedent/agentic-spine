# Media Download Canary Guardrails Contract
# Status: authoritative
# Owner: @ronny
# Created: 2026-03-21
# Scope: media-download-canary-anti-bloat
#
# This contract governs the canary download activation on media-home.
# It defines hard limits that prevent the canary from escalating into
# uncontrolled bulk acquisition or storage bloat.

contract: MEDIA_DOWNLOAD_CANARY_GUARDRAILS_V1
version: "1.2"
status: active
created: "2026-03-21"
updated_at: "2026-03-22"
owner: "@ronny"

description: |
  Anti-bloat guardrails for governed download client activation on the
  media-home plane. Dual-ingest model: SABnzbd primary (usenet),
  qBittorrent secondary (torrent, VPN-tunneled via gluetun). This contract
  is required reading before any download client broadening.

  Operating posture: MANUAL CATALOG ONLY. Ronny manually curates what enters
  the catalog. No bulk acquisition. No automatic backfill of missing content.
  Single-item or small-batch testing only.

# ─────────────────────────────────────────────────────────────────────────
# Client Activation Scope
# ─────────────────────────────────────────────────────────────────────────

client_scope:
  ingest_model: dual
  primary_client: sabnzbd
  primary_protocol: usenet
  primary_priority: 1
  secondary_client: qbittorrent
  secondary_protocol: torrent
  secondary_priority: 2
  secondary_network: via_tunnel
  secondary_vpn: true
  secondary_tunnel_service: gluetun
  active_clients:
    - sabnzbd
    - qbittorrent
  parked_clients:
    - slskd
  active_client_vm: media-home
  dual_ingest_activated: "2026-03-22"
  activation_reason: |
    SABnzbd remains primary (usenet, priority 1). qBittorrent activated as
    secondary (torrent, priority 2, VPN-tunneled via gluetun) to enable
    torrent-only content acquisition when usenet sources are unavailable.
    Conservative model: Sonarr and Radarr use both clients, Lidarr stays
    SABnzbd-only. qBittorrent max_active_downloads=3, max_active_torrents=5.
    QB-VPN-ROUTE-001 superseded: all BitTorrent traffic now VPN-backed.

# ─────────────────────────────────────────────────────────────────────────
# Staging Path Authority
# ─────────────────────────────────────────────────────────────────────────

staging_path:
  host_path: /srv/media/downloads
  container_path: /media/downloads
  nfs_backing: "10.0.0.150:/volume1/media-staging/downloads"
  lifecycle_class: regenerable
  expiry_policy: drain_after_import
  max_age_days: 7
  distinct_from_library_roots: true
  library_roots:
    - /srv/media/movies
    - /srv/media/tv
    - /srv/media/music
  separation_proof: |
    /srv/media/downloads is a sibling directory to /srv/media/movies,
    /srv/media/tv, and /srv/media/music under the same NFS mount.
    Downloads are NOT nested inside any library root. ARR import moves
    or hardlinks files FROM staging TO library roots, never the reverse.

# ─────────────────────────────────────────────────────────────────────────
# Anti-Bloat Hard Limits
# ─────────────────────────────────────────────────────────────────────────

anti_bloat:
  max_concurrent_downloads: 3
  max_staging_size_gib: 50
  free_space_gate:
    min_free_pct: 15
    current_free_pct: 65
    current_condition: within_budget
    action_when_breached: "Pause all downloads. Do not resume until free_pct > min_free_pct."
    note: "Canary operates on Synology home pool (20 TB, 35% used, 13 TB free). The 86% critical is the PVE shop pool — a separate storage plane that canary does not write to."
    storage_pools:
      synology_home:
        total_tb: 20
        used_tb: 6.6
        free_tb: 13
        usage_pct: 35
        condition: healthy
      pve_shop:
        usage_pct: 86
        condition: critical_separate_pool
        note: "Separate pool. Canary does not write here."

  rss_feeds:
    enabled: false
    reason: "RSS disabled to prevent automatic bulk acquisition."

  automatic_search:
    enabled: false
    reason: "No background search. All downloads must be operator-initiated or via explicit Jellyseerr request approval."

  backlog_search:
    enabled: false
    reason: "No missing-media backlog search. Would trigger hundreds of simultaneous grabs."

  upgrade_search:
    enabled: false
    reason: "No automatic quality upgrade search. Canary scope only."

  import_list_monitoring:
    must_have_tier: true
    nice_to_have_tier: true
    fill_later_tier: false
    note: "fill-later tier stays unmonitored (media.import.policy). Only must-have and nice-to-have items eligible for canary downloads."

  search_on_add:
    enabled: false
    reason: |
      When series/movies are added to ARR apps as "monitored" with no files,
      ARR apps trigger automatic searches for ALL missing content regardless
      of RSS/backlog settings. This bypasses the manual-catalog posture.
      Series/movies MUST be added as UNMONITORED by default. Operator manually
      sets monitored=true only when ready to acquire that specific content.

# ─────────────────────────────────────────────────────────────────────────
# Manual Catalog Operating Model
# ─────────────────────────────────────────────────────────────────────────

manual_catalog_model:
  posture: manual_operator_curated
  description: |
    Ronny manually builds the media catalog. No bulk acquisition waves.
    No automatic list-fed expansion. Pipeline remains end-to-end testable
    but operates in single-item or small-batch mode only.

  series_hygiene:
    rule: add_unmonitored_by_default
    detail: |
      When adding series to Sonarr:
      - Add as UNMONITORED
      - Review series details, quality profile, root folder
      - Manually set monitored=true ONLY when ready to acquire
      - Do NOT bulk-add dozens of series and set them all to monitored

  movie_hygiene:
    rule: add_unmonitored_by_default
    detail: |
      When adding movies to Radarr:
      - Add as UNMONITORED via import lists (per media.import.policy.yaml tiers)
      - Manually promote from unmonitored to monitored when ready to acquire
      - Do NOT enable automatic monitoring on import list sync

  jellyseerr_workflow:
    rule: preferred_acquisition_path
    detail: |
      Jellyseerr requests are the PREFERRED path for new acquisitions.
      Requests flow: Jellyseerr -> Radarr/Sonarr (auto-monitored for that item)
      -> search -> download -> import. This is operator-approved, single-item,
      and does not trigger bulk backfill.

  monitoring_audit:
    frequency: monthly
    method: manual_api_query
    action: |
      Manually query Radarr/Sonarr APIs to review monitored items with zero files:
      - Radarr: curl -H 'X-Api-Key: $KEY' http://localhost:7878/api/v3/movie | jq '[.[] | select(.monitored == true and .hasFile == false)]'
      - Sonarr: curl -H 'X-Api-Key: $KEY' http://localhost:8989/api/v3/series | jq '[.[] | select(.monitored == true and .statistics.episodeFileCount == 0)]'

      Review results:
      - Stuck searches: unmonitor or delete
      - Wishlist items: unmonitor until ready to acquire

      Prevents queue bloat from monitored-with-no-files drift.

# ─────────────────────────────────────────────────────────────────────────
# Incident History (Learning Archive)
# ─────────────────────────────────────────────────────────────────────────

incidents:
  - id: MEDIA-BLOAT-001
    date: "2026-02-14"
    discovered: "2026-03-22"
    summary: "Bulk series add triggered 3.5TB queue flood (867 items)"
    root_cause: |
      On 2026-02-14 between 04:02-04:26 UTC, 31 TV series (Smallville, Big Bang
      Theory, Seinfeld, Friends, House, etc.) were bulk-added to Sonarr as
      "monitored" with zero files. This represents ~4,500 missing episodes.
      Even with RSS disabled, Sonarr triggered automatic "search on add" for
      all missing content, flooding SABnzbd queue with 867 items (3.5TB).
      All items were paused but queue remained armed for 37 days unnoticed.
    impact: |
      - Storage risk: 3.5TB would have consumed 27% of available Synology space
      - Manual-catalog posture violated: bulk acquisition contradicts operator intent
      - Pipeline confidence eroded: unclear what would trigger if items unpaused
    resolution: |
      2026-03-22: Queue purged (867 items), 31 series unmonitored, guardrails
      updated to prohibit monitored-with-no-files, manual-catalog model made
      canonical. Lane: codex/media-manual-catalog-canary-brake-v1-20260322
    lessons: |
      - "Monitored" is an acquisition trigger, not a wishlist marker
      - Series hygiene: add as unmonitored, promote deliberately
      - Monthly monitoring audit needed to catch drift
      - RSS disabled ≠ no automatic search (search-on-add is separate)

# ─────────────────────────────────────────────────────────────────────────
# Post-Import Cleanup Rules
# ─────────────────────────────────────────────────────────────────────────

cleanup:
  mode: hardlink_auto_drain
  description: |
    After SABnzbd completes a download and the ARR app successfully imports
    (hardlink via broad /media mount) the file to its library root, the
    staging copy is automatically cleaned by Completed Download Handling.
    Hardlinks enabled 2026-03-21 via root folder promotion and RPM.

  sabnzbd_settings:
    completed_download_handling: true
    remove_from_history_after_days: 7
    category_cleanup: true
    note: "SABnzbd should be configured to auto-remove completed downloads from history after 7 days."

  arr_settings:
    remove_completed_downloads: true
    remove_failed_downloads: false
    note: "Radarr/Sonarr 'Completed Download Handling > Remove' should be enabled. Failed downloads require operator review."

  manual_verification:
    command: "./bin/ops cap run media.downloads.bloat.status"
    frequency: "Run after each canary download cycle to verify staging is draining."

  hardlink_issue:
    discovered: "2026-03-21"
    fixed: "2026-03-21"
    description: |
      Docker bind mount topology broke hardlinks. Sonarr/Radarr had
      copyUsingHardlinks=true but it silently failed (EXDEV) because /tv
      and /downloads were separate bind mounts (mount IDs 847 and 848).
      Fix applied: ARR root folders changed from /tv → /media/tv and
      /movies → /media/movies. RPM added to route /downloads/ → /media/downloads/.
      Both source and destination now on mount 846 (/media broad mount).
    impact: "Previously doubled disk usage on every import. Now hardlinks work and staging auto-drains."
    fix_status: applied
    fix_lane: codex/media-home-hardlink-and-auto-drain-fix-v1
    fix_details:
      sonarr_root: "/tv → /media/tv (id=1 → id=2)"
      radarr_root: "/movies → /media/movies (id=1 → id=3)"
      sonarr_rpm: "host=sabnzbd, /downloads/ → /media/downloads/ (id=2)"
      radarr_rpm: "host=sabnzbd, /downloads/ → /media/downloads/ (id=3)"
      hardlink_proof: "inode=212350, nlink=2 via broad mount; EXDEV via narrow mount"
      staging_drain_observed: "215G → 189G in 10 minutes after fix"

  staging_debt_drain_history:
    - date: "2026-03-21"
      pre_drain_gib: 1126
      post_drain_active_gib: 334
      post_drain_quarantine_gib: 253
      items_removed: 284
      items_quarantined: 477
      disk_freed_gib: 457
      lane: codex/media-downloads-staging-debt-drain-v1
      operator: "@ronny"

# ─────────────────────────────────────────────────────────────────────────
# Canary Proof Requirements
# ─────────────────────────────────────────────────────────────────────────

canary_proof:
  scope: single_item_operator_initiated
  description: |
    The canary proof is a single operator-initiated download through the
    full pipeline: Jellyseerr request -> ARR search -> SABnzbd download ->
    ARR import -> library verification -> staging cleanup.

  proof_checklist:
    - "SABnzbd health endpoint responds (/api?mode=version&output=json)"
    - "Download lands in /srv/media/downloads (staging), NOT in library root"
    - "ARR import moves/hardlinks file to correct library root"
    - "Staging copy cleaned after successful import"
    - "No duplicate file in both staging and library"
    - "media.downloads.bloat.status shows no new bloat"

  activation_command: |
    SSH to media-home and start the SABnzbd container:
      ssh ubuntu@10.0.0.106 'cd /srv/appdata/compose/media-stack && docker compose up -d sabnzbd'
    Then verify health:
      ssh ubuntu@10.0.0.106 'curl -s http://localhost:8080/api?mode=version\&output=json'
    Canary executed 2026-03-21: SVU S27E15 downloaded 3.1 GB in 43s to staging. SABnzbd then paused.

# ─────────────────────────────────────────────────────────────────────────
# Prohibited Actions (Hard No)
# ─────────────────────────────────────────────────────────────────────────

prohibited:
  - "Activate additional download clients beyond SABnzbd and qBittorrent"
  - "Enable RSS feeds or automatic search"
  - "Run backlog search or missing-media scan"
  - "Enable automatic quality upgrade search"
  - "Start broad movie/TV reacquisition"
  - "Let download directories point at library roots"
  - "Delete shop-era copies on download-stack or md1400"
  - "Delete backups on md1400 or 730XD"
  - "Promote fill-later import list tier to monitored"
  - "Enable Reference-4K tier (hardware-gated)"
  - "Bulk queue or mass search"

# ─────────────────────────────────────────────────────────────────────────
# Escalation Path
# ─────────────────────────────────────────────────────────────────────────

escalation:
  next_wave:
    name: "5-title authorized canary replacement wave"
    prerequisites:
      - "SABnzbd canary proves stable 72+ hours"
      - "At least 1 successful download/import/cleanup cycle completed"
      - "media.downloads.bloat.status shows ACCEPTABLE"
      - "Pool usage does not worsen beyond 87%"
      - "Operator explicit approval"
    blocked_by:
      - "Pool at 86% (critical per capacity guard — shop pool, NOT home) — canary must prove home pool does not worsen"
      - "Compose narrow mounts not yet removed (dead weight, not blocking hardlinks)"

  broader_shop_drain:
    ready: false
    blockers:
      - "media-shop-residue-retirement-proof-set incomplete"
      - "media-home active < 14 days (started 2026-03-17, need ~2026-03-31)"
      - "forensic snapshot hold (278 GiB) not yet archived"
      - "download-stack / streaming-stack VM decommission gates not met"

