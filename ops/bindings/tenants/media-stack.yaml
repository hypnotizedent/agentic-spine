# Tenant Profile: media-stack
# Status: authoritative
# Owner: "@ronny"
# Last verified: 2026-03-21
# Scope: media-stack-tenant
#
# Defines the media-stack tenant for AOF governance.
# Canonical active plane: media-home (VM 106).
# Residual shop planes: download-stack (VM 209), streaming-stack (VM 210).
# Follows schema defined in ops/bindings/tenant.profile.schema.yaml.

version: 2
updated: "2026-03-21"
owner: "@ronny"

identity:
  tenant_id: media-stack
  owner: "@ronny"
  display_name: "Media Stack"
  created_at: "2026-02-15"

secrets:
  provider: infisical
  project_id: infrastructure
  environment: prod
  namespace: /spine/services/media

policy:
  preset: balanced
  overrides: {}

runtime:
  spine_root: "$HOME/code/agentic-spine"
  git_remote_primary: origin
  git_remote_mirror: github

surfaces:
  agents:
    - claude-code
    - opencode
  slash_commands: true
  mcp_servers: []

evidence:
  receipts_enabled: true
  ledger_path: evidence/sessions
  session_closeout_sla_hours: 48

# Media-stack specific configuration
media:
  vms:
    # Canonical active plane
    media-home:
      id: 106
      hostname: media-home
      lan_ip: 10.0.0.106
      tailscale_ip: 100.113.72.41
      role: active
      compose_path: /srv/appdata/compose/media-stack
      media_mount: /srv/media
      backing_store: "10.0.0.150:/volume1/media-staging"
      note: "Canonical active watch/download plane. All core ARR + streaming services operational."
    # Residual shop planes (transitional)
    download:
      id: 209
      hostname: download-stack
      lan_ip: 192.168.1.209
      tailscale_ip: 100.107.36.76
      role: download
      status: residual
      compose_path: /opt/stacks/download-stack
      nfs_mount: /mnt/media
      nfs_mode: rw
      note: "Shop residue. Services parked. Retained for rollback."
    streaming:
      id: 210
      hostname: streaming-stack
      lan_ip: 192.168.1.210
      tailscale_ip: 100.123.207.64
      role: streaming
      status: residual
      compose_path: /opt/stacks/streaming-stack
      nfs_mount: /mnt/media
      nfs_mode: ro
      note: "Shop residue. Services parked. Retained for rollback."

  nfs:
    source: pve:/media
    pool: tank/media
    size_tb: 29

  parked_services:
    - tdarr

  # Home Assistant add-ons that duplicate shop services (investigate for decommission)
  ha_overlaps:
    - overseerr      # duplicates jellyseerr (media-home)
    - lidarr         # duplicates lidarr (media-home)
    - sonarr         # duplicates sonarr (media-home)
    - sabnzbd        # duplicates sabnzbd (media-home)

  dependency_chain:
    # Prowlarr provides indexers to the *arr stack
    prowlarr:
      - radarr
      - sonarr
      - lidarr
    # *arr services send downloads to download clients
    radarr:
      - sabnzbd
      - qbittorrent
    sonarr:
      - sabnzbd
      - qbittorrent
    lidarr:
      - sabnzbd
      - slskd
      - soularr
    slskd:
      - gluetun
    # Streaming services consume media from the active plane
    jellyfin:
      depends_on_media_from: media-home
