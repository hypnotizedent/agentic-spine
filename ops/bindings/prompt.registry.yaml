# ── Role-Specific Prompt Sets ─────────────────────────────────────
# These prompt sets define the context loading rules per actor boundary
# pathway role (Human steward -> Membrane -> Controller). Referenced by the
# actor.boundary.contract.yaml.
role_prompt_sets:
  # NOTE: "operator" here is a compatibility key for the human_operator
  # role in the actor boundary pathway.  No AI session loads this prompt
  # set as its own identity.  Agent sessions load membrane/translator
  # compatibility context, controller, or execution context.  See actor.boundary.contract.yaml for
  # the actor vocabulary (human_operator / agent_actor / operator_console).
  operator:
    prompt_set_id: spine-operator-context
    actor_class: human_operator  # This context serves the human steward, not an agent
    version: "2026-03-24.1"
    description: >
      Context set for the human operator role. Loads strategic direction,
      acceptance criteria templates, and loop lifecycle surfaces.
    source_refs:
      - ops/archive/pre-2026-04-01-spine/ops/bindings/operator.boundary.contract.yaml
      - ops/bindings/actor.boundary.contract.yaml
      - docs/governance/SPINE.md
  translator:
    prompt_set_id: spine-translator-context
    version: "2026-03-24.1"
    description: >
      Compatibility context set for the membrane function. Loads classification
      rules, routing decision table, and rendering templates.
    source_refs:
      - ops/bindings/membrane.authority.contract.yaml
      - ops/bindings/actor.boundary.contract.yaml
      - docs/governance/SPINE.md
  controller:
    prompt_set_id: spine-controller-context
    version: "2026-03-24.1"
    description: >
      Context set for the Controller role. Loads execution authority,
      gate registry, capability map, and verification templates.
    source_refs:
      - ops/bindings/controller.boundary.contract.yaml
      - ops/bindings/actor.boundary.contract.yaml
      - ops/plugins/core/session/templates/execution.context.yaml
      - ops/plugins/core/session/templates/verification.context.yaml
      - docs/governance/SPINE.md
