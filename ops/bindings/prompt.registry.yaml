# ── Role-Specific Prompt Sets ─────────────────────────────────────
# These prompt sets define the context loading rules per communication
# pathway role (Operator → Translator → Controller). Referenced by the
# communication.protocol.contract.yaml.
role_prompt_sets:
  operator:
    prompt_set_id: spine-operator-context
    version: "2026-03-24.1"
    description: >
      Context set for the Operator role. Loads strategic direction,
      acceptance criteria templates, and loop lifecycle surfaces.
    source_refs:
      - ops/archive/pre-2026-04-01-spine/ops/bindings/operator.boundary.contract.yaml
      - ops/bindings/communication.protocol.contract.yaml
      - docs/governance/SPINE.md
  translator:
    prompt_set_id: spine-translator-context
    version: "2026-03-24.1"
    description: >
      Context set for the Translator role. Loads classification rules,
      routing decision table, and rendering templates.
    source_refs:
      - ops/bindings/translator.authority.contract.yaml
      - ops/bindings/communication.protocol.contract.yaml
      - docs/governance/SPINE.md
  controller:
    prompt_set_id: spine-controller-context
    version: "2026-03-24.1"
    description: >
      Context set for the Controller role. Loads execution authority,
      gate registry, capability map, and verification templates.
    source_refs:
      - ops/bindings/controller.boundary.contract.yaml
      - ops/bindings/communication.protocol.contract.yaml
      - ops/plugins/core/session/templates/execution.context.yaml
      - ops/plugins/core/session/templates/verification.context.yaml
