# Site Profile Contract (PACKET-1115)
#
# First-class Hardware Intelligence family primitive: per-site HI profile
# (role, network class, power class, operational priority, physical
# constraints). Read by site.presence.status and proven by D448.
#
# Boundary discipline:
#   - This contract owns HI PROFILE truth only.
#   - It does NOT own topology truth (lan_cidr, tailscale_anchor,
#     proxmox_alias, host_refs, vmid_range, compose_targets).
#     Topology truth lives in ops/bindings/topology.sites.yaml.
#   - site_id is a foreign key into topology.sites[].id, OR into the
#     extension_set declared below for non-topology contexts.
#
# Anti-fragmentation rules:
#   - The unverified value is allowed ONLY where intentionally declared
#     via the row's unverified_fields list. D448 enforces this two-direction
#     (fields in unverified_fields must equal "unverified"; fields not in
#     unverified_fields must NOT equal "unverified").
#   - extension_set below is machine-readable and authoritative for which
#     non-topology site IDs may appear in sites:. D448 reads this list
#     directly from this contract; the gate carries no hardcoded list.
#
# Consumer contract: site.presence.status emits top-level site_profiles
# block (mapping site_id -> profile), per-row profile_ref foreign-key, and
# the first-class Site Intelligence lifecycle. The lifecycle names the join to
# node.admission.status plus bootstrap/provisioning transition boundaries.
# Profiles are NOT embedded per-row. Legacy registries/snapshots are folded
# source inputs, not operator-facing evidence-only subsystems.

references:
  topology_authority: ops/bindings/topology.sites.yaml
  site_intelligence_lineage:
