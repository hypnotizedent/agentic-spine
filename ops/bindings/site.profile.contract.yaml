  # PACKET-1371: home.unifi.network.inventory.yaml deleted; the operator-asserted
  # ISP modem label that was the sole consumed field is now inlined into the
  # per-site notes below. UniFi observation lives under network.presence.status
  # (Network branch); profile classifications stay human-steward-asserted.

# Machine-readable extension set: site IDs allowed in sites: that are NOT
# in topology.sites[].id. Each entry must declare topology_origin and
# topology_origin_reason. D448 reads this list from the contract.
extension_set:
  - site_id: mobile
    topology_origin: not_topology
    topology_origin_reason: operator_console_roaming_context
  - site_id: portable
    topology_origin: not_topology
    topology_origin_reason: portable_media_context
  - site_id: unknown
    topology_origin: sentinel
    topology_origin_reason: unresolved_site_fallback

# Per-site HI profile rows. Required fields:
#   site_id, site_role, network_profile, power_profile,
#   operational_priority, topology_origin, unverified_fields.
# topology_origin_reason is required when topology_origin != "topology.sites".
sites:
  - site_id: home
    site_role: residential_home
    network_profile: fast_home_lan_plus_tailscale
    power_profile: small_quiet_residential_compute
    operational_priority: standard_remote_tolerant
    topology_origin: topology.sites
    topology_origin_reason: ""
    physical_constraints: [quiet_residential, smaller_compute, operator_not_always_present]
    unverified_fields: []
    notes: |
      Home site. Topology in topology.sites.yaml#home. Human steward assertion
      captured under PACKET-1304: home is the residential site, smaller than
      shop, runs a mini PC and Synology, has the faster network, and the
      operator is not always physically present. Operator-asserted upstream
      uplink: ISP modem (Xfinity CGM4981COM) — context only, does not own
      the profile classification. UDR-observable network state lives under
      network.presence.status (Network branch).

  - site_id: shop
    site_role: business_production
    network_profile: shop_lan_plus_tailscale
    power_profile: high_compute_loud_server_site
    operational_priority: production_high
    topology_origin: topology.sites
    topology_origin_reason: ""
    physical_constraints: [business_location, loud_compute_allowed, high_compute_density]
    unverified_fields: []
    notes: |
      Shop site. Topology in topology.sites.yaml#shop. Human steward assertion
      captured under PACKET-1304: shop is the Mint Prints business location,
      has bigger servers, louder compute, and more compute density than home.
      This site carries production/business priority. Shop UniFi observed input
      is read directly by site.presence.status; no per-site inventory authority
      is needed beyond the folded observation feed.

  - site_id: mobile
    site_role: mobile
    network_profile: tailscale_only
    power_profile: light
    operational_priority: standard
    topology_origin: not_topology
    topology_origin_reason: operator_console_roaming_context
    physical_constraints: [silent_only, small_form_factor_preferred]
    unverified_fields: []
    notes: |
      Operator-console roaming context. Values from operator-authored
      OI-20260429-023756-2fe8 / HI-20260429-023756-2fe8 grammar
      (Site Hardware Intelligence v1 spec), bound into PACKET-1304.

  - site_id: portable
    site_role: portable_media
    network_profile: none
    power_profile: none
    operational_priority: low_touch
    topology_origin: not_topology
    topology_origin_reason: portable_media_context
    physical_constraints: [physical_attachment_required]
    unverified_fields: []
    notes: |
      Portable storage / bootstrap media context. site_role=portable_media
      is canonical from BPA-016 / PACKET-985 subject_class enum and remains
      subordinate to the first-class Site Intelligence readback rather than a
      separate hardware-intelligence subsystem.

  - site_id: unknown
    site_role: sentinel
    network_profile: none
    power_profile: none
    operational_priority: low_touch
    topology_origin: sentinel
    topology_origin_reason: unresolved_site_fallback
    physical_constraints: []
    unverified_fields: []
    notes: |
      Sentinel row. ONLY valid for row.site == unknown in consumers.
      D448 fails any non-unknown row falling back to profile_ref: unknown.
