    operator_ingress: /Users/ronnyworks/code/.runtime/spine/state/inputs/operator-ingress/OI-20260429-023756-2fe8.yaml
    human_intent_id: HI-20260429-023756-2fe8
    current_owning_packet: PACKET-1304-SITE-INTELLIGENCE-GOLDEN-RAIL-PLAN
    current_owning_loop: LOOP-SITE-INTELLIGENCE-GOLDEN-RAIL-20260505
    current_public_readback: site.presence.status
    admission_boundary_readback: node.admission.status
    supporting_ladder_inputs:
      - /Users/ronnyworks/code/.runtime/spine/state/inputs/operator-ingress/OI-20260429-023702-96fe.yaml
      - /Users/ronnyworks/code/.runtime/spine/state/inputs/operator-ingress/OI-20260429-023757-3a59.yaml
