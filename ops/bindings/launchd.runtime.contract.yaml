version: "1.4"
updated_at: "2026-03-28"
owner: "@ronny"
scope: launchd-runtime-contract
schedule_timezone: "America/New_York"

paths:
  source_dir: "/Users/ronnyworks/code/agentic-spine/ops/plugins/infra/host/launchd"
  user_launchagents_dir: "/Users/ronnyworks/Library/LaunchAgents"
  scheduler_registry: "/Users/ronnyworks/code/agentic-spine/ops/bindings/launchd.scheduler.registry.yaml"
  canonical_log_root: "/Users/ronnyworks/code/.runtime/spine/logs"

required_env:
  - SPINE_ROOT
  - SPINE_OPERATOR_TZ
  - TZ

scheduler_execution:
  control_root: "/Users/ronnyworks/code/agentic-spine"
  runtime_only: true
  tracked_promotion_policy: "forbidden"
  tracked_promotion_note: >
    Recurring launchd jobs MUST execute against control-root code plus
    externalized runtime/data/evidence roots. Tracked promotion belongs in
    explicit review lanes, not unattended scheduler automation.
  labels:
    - com.ronny.backup-monitor-hourly
    - com.ronny.friction-reconcile
    - com.ronny.mcp-runtime-anti-drift-cycle
    - com.ronny.projection-reconcile
    - com.ronny.state-shared-reconcile
    - com.ronny.domain-inventory-refresh-daily
    - com.ronny.extension-index-refresh-daily
    - com.ronny.freshness-critical-daily
    - com.ronny.operator-hygiene-daily
    - com.ronny.receipts-archive-reconcile-daily
    - com.ronny.spine-daily-briefing
    - com.ronny.cc-benefits-refresh-daily
    - com.ronny.cc-benefits-reminder-dispatch-daily
    - com.ronny.ha-baseline-refresh
  forbidden_env_vars:
    - SPINE_RUNTIME_WORKTREE
    - SPINE_RUNTIME_WORKTREE_BRANCH
    - OPS_WORKTREE_IDENTITY
  retired_runtime_worktree: "/Users/ronnyworks/.wt/agentic-spine/runtime-scheduler"

autonomous_admission:
  enabled: true
  description: >
    LaunchAgent-owned autonomous capability execution may satisfy cap attach
    admission without an interactive entry packet only when the runtime marker
    is derived from a governed job wrapper, the current process ancestry still
    resolves to launchd, and the scheduler label validates against the active
    scheduler registry plus this contract's scheduler_execution label set.
  marker_source: job_wrapper_derived
  marker_env:
    context: SPINE_AUTONOMOUS_EXECUTION_CONTEXT
    source: SPINE_AUTONOMOUS_SOURCE
    label: SPINE_SCHEDULER_LABEL
    parent_process: SPINE_AUTONOMOUS_PARENT_PROCESS
    ancestry_confirmed: SPINE_AUTONOMOUS_ANCESTRY_CONFIRMED
    source_script: SPINE_AUTONOMOUS_SOURCE_SCRIPT
  required_context: launchd_scheduler
  required_source: governed_job_wrapper
  required_parent_process: launchd
  validation:
    require_launchd_ancestry: true
    launchd_ancestry_depth: 3
    required_registry_state: active
    required_registry_mode: scheduled
    required_template_source: spine
    require_scheduler_execution_membership: true
  non_goals:
    - fake_attach_packets
    - interactive_terminal_attach_bypass
    - approval_or_main_guard_bypass
    - runtime_role_policy_bypass

recency:
  exempt_labels:
    - com.ronny.ha-baseline-refresh
  allow_nonzero_exit_labels:
    - com.ronny.alerting-probe-cycle
    - com.ronny.media-capacity-snapshot-daily
  note: "Home-site scheduled jobs are exempt from recency fail checks while operating away from home station. Media backup/capacity agents depend on SSH to shop VMs and are expected to fail off-LAN."

required_labels:
  - com.ronny.alerting-probe-cycle
  - com.ronny.ha-baseline-refresh
  - com.ronny.domain-inventory-refresh-daily
  - com.ronny.extension-index-refresh-daily
  - com.ronny.mcp-runtime-anti-drift-cycle
  - com.ronny.spine-daily-briefing
  - com.ronny.spine-briefing-email-daily
  - com.ronny.slo-evidence-daily
  - com.ronny.receipts-archive-reconcile-daily
  - com.ronny.n8n-snapshot-daily
  - com.ronny.immich-reconcile-weekly
  - com.ronny.finance-action-queue-monthly
  - com.ronny.freshness-critical-daily
  - com.ronny.friction-reconcile
  - com.ronny.media-arr-key-roll-drill-weekly
  - com.ronny.nightly-closeout-daily
  - com.ronny.verify-run-daily
  - com.ronny.verify-gate-review-consumer-daily
  - com.ronny.proposals-retention-daily
  - com.ronny.operator-hygiene-daily
  - com.ronny.simplefin-daily-sync
  - com.ronny.finance-backup-weekly
  - com.ronny.backup-monitor-hourly
  - com.ronny.launchd-health-check
  - com.ronny.media-capacity-snapshot-daily
  - com.ronny.policy-autotune-weekly
  - com.ronny.projection-reconcile
  - com.ronny.infra-core-smoke

canonical_path_policy:
  canonical_path: "/Users/ronnyworks/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  rationale: >
    All launchd templates MUST use the canonical PATH. ~/.local/bin is required
    for pipx-installed tools (e.g. yq, ntfy). /opt/homebrew/bin is required for
    Homebrew on Apple Silicon. All templates were normalized to this PATH on
    2026-03-21.
  enforcement: "host.launchagents.sync and launchd-health-check should flag PATH drift"

governed_main_override_policy:
  description: >
    LaunchAgents that invoke cap.sh on the main branch require
    OPS_GOVERNED_MAIN_OVERRIDE=1 in EnvironmentVariables. Without it,
    cap.sh's main-branch mutation guard blocks mutating caps (exit 6).
  applied_to:
    - com.ronny.friction-reconcile

orphaned_live_labels:
  description: >
    These labels exist as live plists in ~/Library/LaunchAgents/ but have
    NO template in the spine. They point to missing binaries and should be
    unloaded and removed at next host.launchagents.sync.
  labels:
    - com.ronny.mailroom-runtime-ensure
    - com.ronny.media-config-backup-daily

scheduler_expectations:
  com.ronny.launchd-health-check:
    start_interval_seconds: 300
    required_args:
      - --auto-restart
