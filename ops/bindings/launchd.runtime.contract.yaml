version: '1.5'
updated_at: '2026-03-28'
owner: '@ronny'
scope: launchd-runtime-contract
schedule_timezone: America/New_York
paths:
  source_dir: /Users/ronnyworks/code/agentic-spine/ops/plugins/infra/host/launchd
  user_launchagents_dir: /Users/ronnyworks/Library/LaunchAgents
  scheduler_registry: /Users/ronnyworks/code/agentic-spine/ops/bindings/launchd.scheduler.registry.yaml
  canonical_log_root: /Users/ronnyworks/code/.runtime/spine/logs
required_env:
- SPINE_ROOT
- SPINE_OPERATOR_TZ
- TZ
scheduler_execution:
  control_root: /Users/ronnyworks/code/agentic-spine
  runtime_only: true
  authority_note: >
    Compatibility/check input while D430/D431/D435 still consume
    launchd.scheduler.registry.yaml. Cross-plane scheduled-task authority is
    being promoted in ops/bindings/scheduled.task.registry.yaml; this list must
    not be used as node placement authority.
  tracked_promotion_policy: forbidden
  tracked_promotion_note: 'Recurring launchd jobs MUST execute against control-root code plus externalized runtime/data/evidence roots. Tracked promotion belongs in explicit review lanes, not unattended scheduler automation.

    '
  labels:
  - com.ronny.domain-inventory-refresh-daily
  forbidden_env_vars:
  - SPINE_RUNTIME_WORKTREE
  - SPINE_RUNTIME_WORKTREE_BRANCH
  - OPS_WORKTREE_IDENTITY
  retired_runtime_worktree: /Users/ronnyworks/.wt/agentic-spine/runtime-scheduler
autonomous_admission:
  enabled: true
  description: 'LaunchAgent-owned autonomous capability execution may satisfy cap attach admission without an interactive entry packet only when the runtime marker is derived from a governed job wrapper, the current process ancestry still resolves to launchd, and the scheduler label validates against the active scheduler registry plus this contract''s scheduler_execution label set.

    '
  marker_source: job_wrapper_derived
  marker_env:
    context: SPINE_AUTONOMOUS_EXECUTION_CONTEXT
    source: SPINE_AUTONOMOUS_SOURCE
    label: SPINE_SCHEDULER_LABEL
    parent_process: SPINE_AUTONOMOUS_PARENT_PROCESS
    ancestry_confirmed: SPINE_AUTONOMOUS_ANCESTRY_CONFIRMED
    source_script: SPINE_AUTONOMOUS_SOURCE_SCRIPT
  required_context: launchd_scheduler
  required_source: governed_job_wrapper
  required_parent_process: launchd
  validation:
    require_launchd_ancestry: true
    launchd_ancestry_depth: 3
    required_registry_state: active
    required_registry_mode: scheduled
    required_template_source: spine
    require_scheduler_execution_membership: true
  non_goals:
  - fake_attach_packets
  - interactive_terminal_attach_bypass
  - approval_or_main_guard_bypass
  - runtime_role_policy_bypass
recency:
  exempt_labels: []
  allow_nonzero_exit_labels:
  - com.ronny.alerting-probe-cycle
  - com.ronny.media-capacity-snapshot-daily
  note: Home-site scheduled jobs are exempt from recency fail checks while operating away from home station. Media backup/capacity agents depend on SSH to shop VMs and are expected to fail off-LAN.
required_labels:
  description: >
    Compatibility/check input for estate-wide labels that MUST be scheduled
    somewhere while D430/D431/D435 still consume launchd.scheduler.registry.yaml.
    The cross-plane parent authority is ops/bindings/scheduled.task.registry.yaml.
    This is NOT a node placement surface and not a local-host obligation. Each
    label's actual host is determined by intended_node_role in
    launchd.scheduler.registry.yaml until generated projection parity is landed.
    On any given host, ops status filters this list by local role and reports
    non-local labels as non_local_deferred, not missing.
  demotion_status: compatibility_check_input_pending_projection
  parent_authority: ops/bindings/scheduled.task.registry.yaml
  labels:
  - com.ronny.alerting-probe-cycle
  - com.ronny.communications-alerts-dispatcher
  - com.ronny.domain-inventory-refresh-daily
  - com.ronny.simplefin-daily-sync
  - com.ronny.finance-backup-weekly
  - com.ronny.media-capacity-snapshot-daily
canonical_path_policy:
  canonical_path: /Users/ronnyworks/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  rationale: 'All launchd templates MUST use the canonical PATH. ~/.local/bin is required for pipx-installed tools (e.g. yq, ntfy). /opt/homebrew/bin is required for Homebrew on Apple Silicon. All templates were normalized to this PATH on 2026-03-21.

    '
  enforcement: host.launchagents.sync should flag PATH drift
governed_main_override_policy:
  description: 'LaunchAgents that invoke cap.sh on the main branch require OPS_GOVERNED_MAIN_OVERRIDE=1 in EnvironmentVariables. Without it, cap.sh''s main-branch mutation guard blocks mutating caps (exit 6).

    '
  applied_to: []
operator_console_locality:
  posture: zero_local_launchagents
  effective_date: "2026-04-16"
  description: >
    The operator console (MacBook) runs zero local LaunchAgents.
    All 38 com.ronny*/com.ronnyworks.* plists were unloaded and archived
    to .runtime/spine/state/archive/launchd-locality-residue-20260416/.
    Workloads that need scheduling belong on execution_host or watcher_node,
    not the operator console. required_labels remains canonical scheduler
    truth and is not affected by this local posture.
  archived_plist_count: 38
  archive_path: .runtime/spine/state/archive/launchd-locality-residue-20260416
birth_mode_vocabulary:
  description: >
    Every recurring workload in the scheduler registry MUST declare exactly one
    birth_mode. Birth mode governs how and when work may start and what the
    system expects from its lifecycle.
  effective_date: "2026-04-25"
  modes:
    standing_program:
      description: >
        Autonomous headless work that runs on a schedule or as a daemon without
        human initiation. The system expects it to be scheduled and running.
        If a human must manually birth it, something is broken.
      permitted_host_roles:
        - execution_host
        - watcher_node
        - storage_evidence_node
      enforcement:
        must_have_scheduler: true
        human_birth_warning: true
        state_must_be: active
    exception_only:
      description: >
        Work that should not run on a schedule. It is birthed automatically by
        a threshold breach, stale detection, or intervention scaffold. Humans
        enter at review/repair, not at normal breathing.
      permitted_host_roles:
        - execution_host
        - watcher_node
      enforcement:
        must_have_scheduler: false
        human_birth_warning: false
        state_must_be: null
    migration_project:
      description: >
        Temporary work with a defined end state. Runs on a schedule only while
        the migration is active. Must have an expiry or sunset condition.
      permitted_host_roles:
        - execution_host
      enforcement:
        must_have_scheduler: true
        requires_sunset_condition: true
        state_must_be: active
    human_session_only:
      description: >
        Work that exists to support interactive operator sessions. Not scheduled.
        The operator starts it manually or it starts as part of session attach.
        If it appears in a scheduler, the classification is wrong.
      permitted_host_roles:
        - operator_console
      enforcement:
        must_have_scheduler: false
        scheduler_presence_is_error: true
        state_must_be: suspended
  validation_rules:
    - every active label MUST have a birth_mode field
    - birth_mode value MUST be one of the defined modes
    - state active + birth_mode human_session_only is illegal (use suspended)
    - birth_mode standing_program + no active scheduler is a verify failure
    - birth_mode human_session_only + intended_node_role != operator_console is illegal
    - parked labels MUST use birth_mode classify_on_promotion
orphaned_live_labels:
  description: >
    Resolved 2026-04-16. All orphaned plists removed from ~/Library/LaunchAgents/
