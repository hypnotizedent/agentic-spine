---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-17
scope: health-all
version: 1
updated_at: "2026-03-17"

components:
  - id: verify_core
    capability: verify.core.run
    args:
      - --json
    timeout_sec: 20
    impact: blocker

  - id: lifecycle
    capability: lifecycle.health
    args:
      - --json
    timeout_sec: 20
    impact: advisory

  - id: agent_health
    capability: agent.health.check-all
    args:
      - --json
    timeout_sec: 60
    impact: advisory

  - id: stability
    capability: stability.control.snapshot
    args:
      - --json
    timeout_sec: 240
    impact: blocker

execution:
  max_parallel_components: 4

reporting:
  max_blockers: 8
  stack_order:
    - infra-core
    - observability
    - mint
    - communications
    - media
    - finance
    - automation
    - immich
    - dev-tools
    - z2m
    - home-assistant
    - microsoft

agent_stack_aliases:
  media-agent: media
  n8n-agent: automation
  home-assistant-agent: home-assistant
  mint-os-agent: mint
  mint-agent: mint
  flying-dutchman: mint
  fin-agent: finance
  finance-agent: finance
  firefly-agent: finance
  paperless-agent: finance-docs
  immich-agent: immich
  communications-agent: communications
  microsoft-agent: microsoft
  ms-graph-agent: microsoft
