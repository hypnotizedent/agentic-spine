# ── Kernel Coordination Primitives ──────────────────────────────────────────
# These are the six machine coordination primitives declared in NORTH_STAR.md.
# They are not workflow patterns — they are the protocol layer beneath workflows.
# Authority matrix: docs/governance/KERNEL_PRIMITIVE_CANON.md

kernel_primitives:
  authority: docs/governance/KERNEL_PRIMITIVE_CANON.md
  declared_in: NORTH_STAR.md
  kernel_lifecycle_protocol:
    evidence_precondition:
      canonical_statement: >
        Evidence enters before request/claim execution machinery. Evidence may
        be human words, file paths, status readbacks, traces, run keys,
        receipts, or explicit operator approval. The spine preserves and
        classifies that evidence, then attaches it to an existing seam/loop,
        creates bounded work only when needed, or records no-op/deferred
        disposition.
      anti_pattern: >
        Do not start public operator flow by asking for a loop claim. Loops are
        bounded work containers; custody is derived from carried evidence plus
        governed execution claims, not from ambient loop selection.
    ordered_primitives:
      - request
      - claim
      - heartbeat
      - result
      - failure
      - receipt
    lifecycle_invariant: >
      A governed work item is born as a request, acquires custody through a
      claim, proves continued liveness through a heartbeat when active, and
      closes through governed outcome/receipt truth. Result and failure are
      outcome branches on governed receipts, not independent objects.
    request:
      realization: first_class_protocol
      protocol_note: >
        Request is first-class as a protocol with two canonical classes.
        Work-request says the bounded work should exist. Execution-request says
        the bounded work should be executed by worker custody.
      classes:
        work_request:
          canonical_authority: loop scope + SQLite loop row
          birth_capability: loops.create
          read_capabilities:
            - loops.status
          residue:
            - session.interactive.dispatch
        execution_request:
          canonical_authority: ops/bindings/dispatch.envelope.contract.yaml
          birth_capability: delegate.to.execution
          additional_birth_capabilities:
            - mailroom.task.enqueue
            - durable.transfer.adopt
            - durable.transfer.start (contracted)
          read_capabilities:
            - delegation.status
            - durable.transfer.status
          residue:
            - wave.start without delegation
          realization_note: >
            Execution-request is governed above transport by the execution lane
            contract in dispatch.envelope.contract.yaml. Current active
            realizations are explicit interactive handoff
            (`delegate.to.execution` -> `delegation.pickup`) and operational
            mailroom task admission (`mailroom.task.enqueue` ->
            `mailroom.task.claim`). Long-running payload movement is a
            host-durable execution realization via `durable.transfer.adopt` and
            `durable.transfer.status`; terminals may monitor it, but terminal
            liveness is not custody truth.
      invariants:
        - execution_request must bind loop_id and packet_id
        - execution_request cannot honestly bypass governed delegation birth
        - execution_request via delegate.to.execution is explicit interactive handoff, not autonomous lane admission
        - operational execution-request realization may use mailroom.task.enqueue when autonomy is the truthful mode
        - manual custody start without delegation is compatibility residue
    claim:
      realization: first_class_protocol
      canonical_capabilities:
        - delegation.pickup
        - mailroom.task.claim
        - durable.transfer.adopt
    heartbeat:
      realization: first_class_protocol
      canonical_capabilities:
        - worktree.lease.heartbeat
        - mailroom.task.heartbeat
        - durable.transfer.status
      protocol_requirements:
        - liveness timestamp
        - proof channel
        - staleness threshold
    outcome_receipt:
      canonical_authority: ops/bindings/closeout.disposition.contract.yaml
      outcome_values:
        - success
        - failure
        - blocked
  primitives:
    request:
      realization: first_class_protocol
      canonical_home: ops/bindings/workflow.vocabulary.contract.yaml
      note: Two canonical classes — work-request (loop birth) and execution-request (delegation, mailroom, or durable transfer birth)
    claim:
      realization: first_class_protocol
      canonical_home: ops/plugins/core/lifecycle/lib/delegation_broker.py
      note: Delegation pickup + mailroom task claim express the canonical claim protocol
    heartbeat:
      realization: first_class_protocol
      canonical_home: ops/bindings/launchd.scheduler.registry.yaml
      note: Heartbeat protocol = liveness timestamp + proof channel + staleness threshold; durable transfer status realizes this for long payload movement
    result:
      realization: collapsed
      canonical_home: ops/bindings/closeout.disposition.contract.yaml
      note: "Expressed as outcome: success on governed receipts"
    failure:
      realization: collapsed
      canonical_home: ops/bindings/closeout.disposition.contract.yaml
      note: "Expressed as outcome: failure|blocked on governed receipts"
    receipt:
      realization: collapsed
      canonical_home: docs/governance/SESSION_PROTOCOL.md
      note: Four governed classes with shared canonical outcome vocabulary; narrative is residue
