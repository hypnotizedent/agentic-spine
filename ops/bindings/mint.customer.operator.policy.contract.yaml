status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mint-customer-operator-policy

version: "1.0"
updated_at: "2026-03-12"

channel_policy:
  default_customer_channel: email_async
  preserve_documented_thread: true
  phone_coordination_default: disallow
  protect_operator_energy: true
  avoid_operational_sprawl: true
  live_coordination_requires_real_blocker: true
  governed_phone_intake_enabled: true
  phone_callback_default: true
  live_transfer_allowed_only_when_real_blocker: true
  voice_frontdesk_scope: intake_and_bounded_read_only_answers
  voice_disallowed_actions:
    - pricing
    - eta_promises
    - rush_approvals
    - payment_exceptions
    - dropoff_approvals
  live_transfer_policy:
    allowed_cases:
      - active_same_day_or_paid_job_blocker
      - repeated_failed_async_resolution_on_live_order
      - strong_emotional_escalation
    default: create_callback_request_instead

rules:
  - "Keep customer coordination in governed email by default."
  - "Do not offer or recommend a phone number unless live coordination is the only real blocker-clearing path."
  - "Restate approval and payment requirements before accepting drop-off or courier coordination."
  - "Prefer documented async follow-up over ad hoc phone or live handoff coordination."

dropoff_policy:
  approval_payment_gate: "Orders must be approved and paid before anything is brought by."
  availability_note: "We do not have anyone available to coordinate by phone at the moment."
  email_lane_request: "Please send what you need through email and we can keep it moving here."
  concise_next_step: "keep this in email, restate approval-and-payment-before-dropoff policy, and ask the customer to send details through email"

phone_only_policy:
  concise_next_step: "keep this in email and handle status updates there instead of moving to phone/text coordination"

detection:
  dropoff_coordination_markers:
    - bring by
    - bring it by
    - drop off
    - dropoff
    - deliver
    - uber
  phone_request_markers:
    - phone number
    - who can i call
    - can i call
    - give me a call
    - call you
    - call me
    - text me
    - reach you by phone
  blocked_positive_phone_phrases:
    - phone number
    - give me a call
    - call me
    - text me
    - reach me at
    - cell number

response_templates:
  async_intro: "Just so we keep everything moving cleanly,"
  policy_restatement: "Orders must be approved and paid before anything is brought by."
  no_phone_note: "We do not have anyone available to coordinate by phone at the moment."
  email_request: "If you send over what you need through email, I can help you here and keep it documented."
