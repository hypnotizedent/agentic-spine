# Session Admission Contract
#
# Canonical cross-tool session admission model.
# Defines what each lane receives at session start and its parity status.
#
# Profile semantics are defined in governance.profile.contract.yaml.
# This contract does not duplicate profile definitions — it describes
# admission delivery and parity truth per lane.

version: 1.1
updated_at: "2026-04-07"
owner: "@ronny"
scope: session-admission-and-parity
subordinate_to: governance.profile.contract.yaml
related_contracts:
  - contract: ops/bindings/dispatch.envelope.contract.yaml
    relationship: "Dispatch envelope contract uses work_admission_rules for routing and rejection"

lanes:
  claude_code:
    governance_profile: full_governance
    surface_class: desktop_cli
    attach_required: true
    admission_delivery: live_hook
    runtime_context_delivery: dynamic
    mutation_posture: governed_mutation_within_scope
    receipt_requirement: required_for_mutation
    terminal_identity_delivery: live_hook_injection
    parity_status: delivered

  codex:
    governance_profile: minimal_governance
    surface_class: desktop_cli
    attach_required: true
    admission_delivery: thin_adapter_plus_governed_attach
    runtime_context_delivery: on_demand_bounded
    mutation_posture: governed_mutation_within_elected_scope_after_attach
    receipt_requirement: required_for_mutation
    terminal_identity_delivery: adapter_mediated_scoped_authority
    parity_status: partial

  opencode:
    governance_profile: lightweight_degraded
    surface_class: desktop_cli
    attach_required: false
    admission_delivery: adapter_only
    runtime_context_delivery: limited_degraded
    mutation_posture: no_governed_mutation
    receipt_requirement: handoff_only
    terminal_identity_delivery: none
    parity_status: degraded

  bridge_capable:
    governance_profile: lightweight_degraded
    surface_class: remote_bridge
    attach_required: false
    admission_delivery: bridge_mediated
    runtime_context_delivery: limited_degraded
    mutation_posture: no_governed_mutation
    receipt_requirement: handoff_only
    terminal_identity_delivery: none
    parity_status: degraded

  offline:
    governance_profile: lightweight_degraded
    surface_class: offline_mobile
    attach_required: false
    admission_delivery: none
    runtime_context_delivery: none
    mutation_posture: no_governed_mutation
    receipt_requirement: handoff_only
    terminal_identity_delivery: none
    parity_status: degraded

external_postures:
  cowork:
    posture: out_of_scope_until_governed_adapter_exists
    governed_repo_mutation: false
    governed_state_mutation: false
    parity_claims: false

resolution:
  default_lane: claude_code
  fallback_parity_status: degraded
  note: "When lane resolution fails, assume degraded posture. Do not claim parity."

# ── Toolchain Front-Door Enforcement ──────────────────────────────────────────
# Added 2026-04-05: Makes governed mutation through the Claude Code toolchain
# require session admission. Enforced via PreToolUse hook on Edit/Write tools.

toolchain_enforcement:
  status: active
  activated_at: "2026-04-05"
  enforcement_point: ".claude/hooks/frontdoor-enforcement-hook.sh"
  hook_type: PreToolUse
  intercepted_tools: [Edit, Write]
  governed_paths: ["ops/", "bin/", "surfaces/"]
  admission_check:
    - source: env
      var: SPINE_ENTRY_PACKET_PATH
      condition: "set and file exists"
    - source: filesystem
      path: "$SPINE_STATE/entry-packets/*.entry.packet.yaml"
      condition: "any file modified within 240 minutes (4h session TTL)"
  remediation: "./bin/ops cap run session.v3.attach -- --allow-no-loop"
  what_is_enforced: >
    Edit/Write on governed spine paths (ops/, bin/, surfaces/) through the
    Claude Code toolchain requires session admission. Without a valid entry
    packet, mutations are blocked with clear remediation.
  what_is_not_enforced: >
    Bash tool (arbitrary shell commands), external editors, git operations
    (handled by pre-commit hooks), and files outside governed paths. This
    enforcement covers the toolchain, not the shell.
  relationship_to_cap_sh: >
    cap.sh Layer 1 (attach admission guard) enforces the same rule for
    governed capability execution. This hook extends the same admission
    model to direct file mutations through the Claude Code toolchain.

interactive_workflow_adoption:
  status: active
  activated_at: "2026-04-06"
  rule_id: interactive_governed_repo_mutation_default
  task_class: "controller-issued secondary-terminal governed spine repo mutations"
  scope: >
    Repo-local adoption only. Applies when a controller issues work to a
    secondary terminal to mutate governed spine repo paths under ops/, bin/,
    or surfaces/.
  entry_surface: >
    ./bin/ops cap run session.interactive.dispatch -- --governed-repo-mutation
  completion_surface: "./bin/ops cap run session.interactive.complete -- --run-key <RUN_KEY>"
  detection_surface: >
    ./bin/ops cap run session.interactive.status -- --list-pending --governed-repo-mutations-only
  what_is_eliminated:
    - operator memory for loop_id in the secondary terminal attach step
    - operator memory for target role/target lane in the secondary terminal attach step
    - operator memory for dispatch-id during target-terminal completion
  next_eligible_requirement:
    status: active
    requirement: >
      The next eligible controller-issued secondary-terminal governed repo
      mutation in this repo must start with
      session.interactive.dispatch --governed-repo-mutation and end with
      session.interactive.complete.
    satisfied_when: >
      The first in-scope ENV-* dispatch created after the rollout anchor is
      present in runtime state.
  remeasure_trigger:
    measurement_window_start_utc: "2026-04-06T16:43:53Z"
    anchor_commit: de857c59c971603a725215e880e9f08696919cfd
    task_threshold: 3
    timebox_days: 7
    deadline_utc: "2026-04-13T16:43:53Z"
    condition: whichever_first
    status_surface: >
      ./bin/ops cap run session.interactive.status -- --governed-repo-mutation-summary
  what_is_not_enforced: >
    Single-terminal admitted work, external editors/tools, arbitrary Bash,
    machine-wide terminal behavior, domain files outside governed paths, and
    autonomous transport remain outside this adopted workflow.

# ── Work Admission Rules ─────────────────────────────────────────────────────
# Added 2026-04-05: Defines what delegated work each lane accepts or rejects.
# Used by dispatch.envelope.contract.yaml for routing and admission validation.

work_admission_rules:
  description: >
    Defines what work each lane/terminal accepts when receiving a dispatch envelope.
    Lanes may reject work that is out-of-scope, wrong safety level, or incompatible
    with governance profile.

  by_lane:
    claude_code:
      accepts_work_types: [capability_execution, verification, loop_management]
      accepts_domains: [core, loop_gap, spine, media, mint, finance, ha, taxlegal, aof]
      accepts_safety: [read-only, mutating, destructive]
      accepts_execution_modes: [single_worker, operational]
      rejects_work_types: []
      rejection_reasons:
        - out_of_domain_scope
        - blocked_by_policy
        - insufficient_governance_profile

    codex:
      accepts_work_types: [capability_execution, verification]
      accepts_domains: [core, loop_gap, spine]
      accepts_safety: [read-only, mutating]
      accepts_execution_modes: [single_worker]
      rejects_work_types: [loop_management]
      rejection_reasons:
        - degraded_governance_posture
        - destructive_work_not_permitted
        - operational_mode_not_supported
        - domain_not_in_scope

    opencode:
      accepts_work_types: []
      accepts_domains: []
      accepts_safety: []
      accepts_execution_modes: []
      rejects_work_types: [capability_execution, verification, loop_management]
      rejection_reasons:
        - no_governed_mutation
        - handoff_only_posture
        - degraded_governance

    bridge_capable:
      accepts_work_types: []
      accepts_domains: []
      accepts_safety: []
      accepts_execution_modes: []
      rejects_work_types: [capability_execution, verification, loop_management]
      rejection_reasons:
        - no_governed_mutation
        - handoff_only_posture
        - remote_bridge_limitation

    offline:
      accepts_work_types: []
      accepts_domains: []
      accepts_safety: []
      accepts_execution_modes: []
      rejects_work_types: [capability_execution, verification, loop_management]
      rejection_reasons:
        - no_governed_mutation
        - offline_posture
        - handoff_only

  by_logical_lane_note: >
    Logical lanes (control, execution, audit, watcher) from
    role.runtime.control.contract.yaml have distinct admission rules beyond
    physical lane assignment.

  by_logical_lane:
    control:
      accepts_work_types: [loop_management, wave_orchestration, authority_resolution]
      rejects_work_types: [capability_execution, verification]
      accepts_domains: [core, loop_gap, spine]
      accepts_safety: [read-only, mutating]
      rejection_reasons:
        - execution_belongs_in_execution_lane
        - verification_belongs_in_audit_lane

    execution:
      accepts_work_types: [capability_execution]
      rejects_work_types: [loop_management, wave_orchestration, verification]
      accepts_domains: [core, loop_gap, spine, media, mint, finance, ha, taxlegal, aof]
      accepts_safety: [read-only, mutating, destructive]
      rejection_reasons:
        - orchestration_belongs_in_control_lane
        - verification_belongs_in_audit_lane

    audit:
      accepts_work_types: [verification]
      rejects_work_types: [capability_execution, loop_management]
      accepts_domains: [core, spine]
      accepts_safety: [read-only]
      rejection_reasons:
        - execution_not_permitted_in_audit
        - mutation_not_permitted_in_audit
        - orchestration_belongs_in_control_lane

    watcher:
      accepts_work_types: [observation]
      rejects_work_types: [capability_execution, verification, loop_management]
      accepts_domains: [core, spine]
      accepts_safety: [read-only]
      rejection_reasons:
        - execution_not_permitted_in_watcher
        - mutation_not_permitted_in_watcher
        - watcher_observes_only

# ── Rejection Semantics ──────────────────────────────────────────────────────

rejection_semantics:
  description: >
    When a lane/terminal receives a dispatch envelope but cannot accept the work,
    it must reject with a structured rejection_reason. This prevents silent
    work loss and enables operator or control-lane triage.

  rejection_types:
    out_of_domain_scope:
      description: "Work domain is not in lane's accepts_domains list"
      example: "claude_code lane receives work for domain=infra (not in accepted list)"
      handling: return_to_sender

    wrong_lane:
      description: "Work type belongs to different logical lane"
      example: "execution lane receives loop_management work (belongs in control)"
      handling: escalate_to_control

    blocked_by_policy:
      description: "Lane policy forbids this work type or safety level"
      example: "audit lane receives destructive work (only read-only permitted)"
      handling: return_to_sender

    insufficient_authority:
      description: "Lane lacks necessary permissions for work"
      example: "codex lane receives destructive work (only mutating permitted)"
      handling: return_to_sender

    governance_profile_mismatch:
      description: "Work requires higher governance profile than lane provides"
      example: "opencode lane receives governed mutation work (degraded profile, handoff only)"
      handling: return_to_sender

    execution_mode_mismatch:
      description: "Work execution_mode not supported by lane"
      example: "codex lane receives operational mode work (only single_worker supported)"
      handling: return_to_sender

    no_governed_mutation:
      description: "Lane has no_governed_mutation posture, cannot accept mutating work"
      example: "opencode/bridge_capable/offline lanes receive capability_execution"
      handling: return_to_sender

  rejection_handling_modes:
    return_to_sender:
      description: "Envelope returned to sender with rejection_reason and rejection_details"
      transport: "Same transport_mode in reverse, or escalate via operator_relay if unavailable"
      sender_action: "Sender determines alternate routing or abandons work"

    escalate_to_control:
      description: "Control lane determines alternate routing or disposition"
      when: "Wrong lane assignment (work sent to audit instead of execution)"
      control_action: "Control re-routes to correct lane or rejects as invalid dispatch"

  rejection_artifact:
    description: "When rejecting, lane must produce rejection artifact with structured fields"
    required_fields:
      - envelope_id
      - rejected_by_lane
      - rejected_at_utc
      - rejection_reason
      - rejection_details
      - suggested_alternate_lane  # optional, if known
    storage: "$SPINE_STATE/dispatch/rejections/<envelope_id>.rejection.yaml"
