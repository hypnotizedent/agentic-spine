synology_share_layout:
  runtime_share:
    share_name: media-staging
    synology_path: /volume1/media-staging
    semantic_role: home_live_media
    export_protocol: nfs
    exported_to:
      - proxmox-home:/mnt/media
      - media-home:/srv/media
    required_tree:
      - /downloads/incomplete
      - /downloads/complete/movies
      - /downloads/complete/tv
      - /downloads/complete/music
      - /movies
      - /tv
      - /music
    rules:
      - live media payload only
      - hot-home library only
      - no app state
      - no sqlite databases
      - no generic archive residue
      - cold retained keepers belong on shop, not as a second live home library
  hold_share:
    share_name: media-holds
    synology_path: /volume1/media-holds
    export_protocol: nfs
    exported_to: []
    required_tree:
      - /manual-import-review
      - /duplicate-review
      - /forensic-holds
    rules:
      - non-runtime only
      - mount on-demand, not by default
      - retained cleanup residue belongs here, not in /volume1/media
  transitional_paths:
    - path: /volume1/media
      status: aspirational_label_only
      note: Preferred future Synology share label. Live runtime is currently backed by /volume1/media-staging.

proxmox_home_mount_contract:
  path: /mnt/media
  source: 10.0.0.150:/volume1/media-staging
  source_host: synology918
  protocol: nfs
  mode: rw
  required: true
  purpose:
    - readiness probe anchor
    - operator-visible verification surface
    - migration staging surface
  not_for:
    - media app sqlite/config state
    - direct container runtime bind mounts
    - backup truth
  parity_requirement:
    host_mount_path: /mnt/media
    guest_mount_path: /srv/media
    container_payload_path_arr: /data
    container_payload_path_jellyfin: /media

