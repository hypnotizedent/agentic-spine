    incomplete_path: /data/downloads/incomplete
    complete_paths:
      movies: /data/downloads/complete/movies
      tv: /data/downloads/complete/tv
      music: /data/downloads/complete/music
  radarr:
    root_folder: /data/movies
    download_import_source: /data/downloads/complete/movies
  sonarr:
    root_folder: /data/tv
    download_import_source: /data/downloads/complete/tv
  lidarr:
    root_folder: /data/music
    download_import_source: /data/downloads/complete/music
  jellyfin:
    libraries:
      movies: /media/movies
      tv: /media/tv
      music: /media/music

backup_contract:
  vm_backup_destination_lane: nas-home-local-exception
  vm_backup_path: /mnt/pve/synology-backups/dump
  vm_restore_glob: vzdump-qemu-106-*.vma.zst
  activation_state: restorable
  first_artifact:
    file: vzdump-qemu-106-2026_03_17-15_09_24.vma.zst
    observed_at: "2026-03-17T15:12:28-04:00"
    size_bytes: 12972696440
  payload_note: /volume1/media-staging is current primary storage, not backup.
  app_state_export_policy: optional_only
  app_state_export_note: >
    App-state exports may be kept as convenience evidence, but canonical
    restore truth for the VM is the Proxmox artifact on the home backup lane.

migration_rules:
  keep_shop_units_until_verified:
    - vm-209-download-stack
    - vm-210-streaming-stack
  cutover_success_requires:
    - every current service instance is classified as must-carry, kept, or parked
    - all must-carry services exist on media-home with path parity satisfied
    - all explicitly kept user-surface and helper services exist on media-home
    - path parity contract satisfied end-to-end
    - media.status healthy
    - media.e2e.verify passes
    - media-agent and mcpjungle endpoints rewired to media-home
    - inventory, health, and secret bindings reflect the unified home runtime
    - queue reconciliation complete
