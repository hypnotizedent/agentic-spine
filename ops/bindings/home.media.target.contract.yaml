control_plane_dependencies:
  media_agent:
    required_for_agent_friendly_operations: true
    agent_id: media-agent
    terminal_id: DOMAIN-MEDIA-01
    registry_binding: ops/bindings/agents.registry.yaml
    generated_followons:
      - ops/bindings/terminal.worker.catalog.yaml
      - ops/bindings/routing.dispatch.yaml
    cutover_rule: >
      No cutover is complete until media-agent and DOMAIN-MEDIA-01 resolve only
      the unified media-home endpoint set and the split shop endpoints are no
      longer presented as active runtime truth.
  mcpjungle:
    required: true
    mirror_path: ~/code/workbench/infra/compose/mcpjungle/servers/media-stack/
    current_shape: split-download-plus-streaming-endpoints
    required_updates:
      - replace download-stack URLs with media-home URLs
      - replace streaming-stack URLs with media-home URLs
      - retain SABnzbd, Jellyfin, Jellyseerr, Bazarr, Navidrome, Prowlarr, Radarr, Sonarr, and Lidarr tools if those services remain in scope
  secrets:
    current_split_namespaces:
      - /spine/vm-infra/media-stack/download
      - /spine/vm-infra/media-stack/streaming
    preferred_target_namespace: /spine/vm-infra/media-stack/home
    migration_rule: >
      Split namespaces may stay readable during staged cutover, but the final
      boring home runtime must not require both split namespaces for active
      day-to-day operation.
  inventory_and_health_bindings:
    must_update:
      - ops/bindings/agents.registry.yaml
      - ops/bindings/media.services.yaml
      - ops/bindings/services.health.yaml
      - ops/bindings/media.path.authority.contract.yaml
      - ops/bindings/media.e2e.verification.spec.yaml
      - ops/bindings/docker.compose.targets.yaml
      - ops/bindings/backup.inventory.yaml
      - ops/bindings/secrets.namespace.policy.yaml
      - docs/governance/SERVICE_REGISTRY.yaml
      - docs/governance/STACK_REGISTRY.yaml
      - docs/governance/DEVICE_IDENTITY_SSOT.md

path_contract:
