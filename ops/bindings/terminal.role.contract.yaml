# Terminal role contract for the Hammerspoon picker (Ctrl+Shift+P) and
# terminal birth model. The picker selects a terminal character + tool,
# then ops terminal launch opens an iTerm window with runtime identity set.
#
# runtime_role_defaults: compatibility-named execution-class resolver.
# Consumed by terminal.sh at birth to populate SPINE_EXECUTION_CLASS and mirror
# the same value to legacy SPINE_RUNTIME_ROLE until compatibility aliases can
# retire. The execution class controls mutation policy enforcement in wave.sh,
# job-wrapper.sh, and MCP gateway.

runtime_role_defaults:
  policy_contract: ops/bindings/role.runtime.control.contract.yaml
  by_terminal_type:
    control-plane: researcher
    domain-runtime: worker
    observation: researcher
  by_terminal_id:
    SPINE-CONTROL-01: worker
    SPINE-EXECUTION-01: worker
    SPINE-AUDIT-01: qc
    SPINE-WATCHER-01: researcher

liveness:
  terminal_telemetry_staleness_threshold_minutes: 45
  note: >
    Canonical TTL for terminal heartbeat liveness. Consumed by
    ops/commands/status.sh (telemetry classification: liveness_fresh +
    custody_fresh) and ops/plugins/core/lifecycle/bin/terminal-loop-claim
    (terminal.loop.claim freshness gate). PACKET-1255 closes the
    KERNEL_PRIMITIVE_CANON.md line 200 implicit-threshold gap.
    SPINE_TERMINAL_LIVENESS_TTL_MINUTES env remains as escape hatch;
    contract is the default source. Mailroom task heartbeat staleness
    is separately declared in mailroom.task.worker.contract.yaml#kernel_realization.primitives.heartbeat
    (PACKET-1225, canon line 199).

roles:
  - id: SPINE-CONTROL-01
    type: control-plane
    description: "Operator console entry terminal. Execution class: worker (per runtime_role_defaults.by_terminal_id below; mutating role per role.runtime.control.contract.yaml). Requests governed writes via capabilities and managed worktrees; not storage authority and must not direct-write canonical state files (see root.authority.contract.yaml file_plane_policy)."
    status: active
    default_tool: claude
    allowed_tools: [claude, codex, opencode]
    picker_group: core
    sort_order: 100

  - id: SPINE-EXECUTION-01
    type: control-plane
    description: "Execution-plane terminal."
