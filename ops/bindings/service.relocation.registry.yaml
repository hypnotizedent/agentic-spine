version: 1
updated_at: "2026-03-21"
owner: "@ronny"
status: authoritative
authority_state: authoritative
scope: relocatable-service-topology

defaults:
  route_registry: ops/bindings/domain.routing.registry.yaml
  services_health: ops/bindings/services.health.yaml
  backup_schedule: ops/bindings/backup.schedule.yaml
  backup_inventory: ops/bindings/backup.inventory.yaml
  service_data_lifecycle: ops/bindings/service.data.lifecycle.registry.yaml
  ssh_targets: ops/bindings/ssh.targets.yaml
  agents_registry: ops/bindings/agents.registry.yaml
  worker_catalog: ops/bindings/terminal.worker.catalog.yaml
  secrets_bundle_contract: ops/bindings/secrets.bundle.contract.yaml
  cloudflare_tunnel_name: homelab-tunnel

relocations:
  - id: media-home-plane
    closure_id: media-home-public-closure
    domain: media
    status: active
    description: "Media-home is the canonical home-site read plane and ARR writer-management plane. Public ingress, agent endpoints, and backup locality must converge on media-home while shop stacks remain residual or retired."
    refs:
      ingress_projection: ops/bindings/home.ingress.map.yaml
      runtime_services: ops/bindings/media.services.yaml
    active_plane:
      site: home
      host: media-home
      current_vm: media-home
      target_vm: media-home
      lan_ip: 10.0.0.106
      tailscale_ip: 100.113.72.41
      stack_aliases:
        - media-home
        - media-home-stack
    public_routes:
      live:
        - hostname: jellyfin.ronny.works
          service: jellyfin
        - hostname: music.ronny.works
          service: navidrome
        - hostname: requests.ronny.works
          service: jellyseerr
        - hostname: homarr.ronny.works
          service: homarr
      parked:
        - hostname: spotisub.ronny.works
          service: spotisub
    runtime_services:
      - service_id: prowlarr
        port: 9696
        health_path: /ping
        expected_status: active
      - service_id: radarr
        port: 7878
        health_path: /ping
        expected_status: active
      - service_id: sonarr
        port: 8989
        health_path: /ping
        expected_status: active
      - service_id: lidarr
        port: 8686
        health_path: /ping
        expected_status: active
      - service_id: jellyfin
        port: 8096
        health_path: /health
        expected_status: active
      - service_id: navidrome
        port: 4533
        health_path: /ping
        expected_status: active
      - service_id: jellyseerr
        port: 5055
        health_path: /
        expected_status: active
      - service_id: homarr
        port: 7575
        health_path: /
        expected_status: active
      - service_id: wizarr
        port: 5690
        health_path: /
        expected_status: active
      - service_id: spotisub
        port: 8766
        health_path: /
        expected_status: parked
    monitoring_services:
      - jellyfin
      - navidrome
      - jellyseerr
      - homarr
      - wizarr
    dependents:
      agent_endpoints:
        - agent_id: media-agent
          services:
            - radarr
            - sonarr
            - lidarr
            - prowlarr
            - jellyfin
            - navidrome
            - jellyseerr
      worker_endpoints:
        - terminal_id: DOMAIN-MEDIA-01
          services:
            - radarr
            - sonarr
            - lidarr
            - prowlarr
            - jellyfin
            - navidrome
            - jellyseerr
      secret_bundles:
        - bundle_id: media-arr
          verify:
            radarr: radarr_status
            sonarr: sonarr_status
            lidarr: lidarr_status
            prowlarr: prowlarr_auth
            jellyseerr: jellyseerr_auth
          local_env_static:
            radarr: RADARR_URL
            sonarr: SONARR_URL
            lidarr: LIDARR_URL
            prowlarr: PROWLARR_URL
            jellyseerr: JELLYSEERR_URL
    backup_locality:
      same_site_primary:
        schedule_jobs:
          - job_id: backup-home-p0-daily-media-home
            expected_host: proxmox-home
        inventory_targets:
          - target_id: home-vm-106-media-home-primary
            expected_host: nas
            expected_base_path: /volume1/backups/proxmox_backups/dump
        runtime_units:
          - unit_id: vm-106-media-home
            expected_hostname: media-home
            expected_destination_lane: nas-home-local-exception
            expected_restore_class: vm-dry-run-quarterly
            expected_inventory_targets:
              - home-vm-106-media-home-primary
      offsite_secondary:
        schedule_jobs:
          - job_id: media-config-media-home-cold-sync-daily
            expected_host: media-home
            expected_script_ref: /usr/local/bin/media-config-backup.sh
            remote_checks:
              - kind: remote_file_exists
                host: media-home
                path: /usr/local/bin/media-config-backup.sh
              - kind: remote_cron_file_line
                host: media-home
                path: /etc/cron.d/media-config-backup
                expected_regex: "^15 4 \\* \\* \\* root /usr/local/bin/media-config-backup\\.sh( .*)?$"
            trust_edges:
              - kind: ssh_batch
                from_host: media-home
                from_user: root
                to_target: pve
                to_user: root
                to_address_source: tailscale_ip
          - job_id: media-config-restore-drill-monthly
            expected_host: media-home
            expected_capability_ref: media.config.restore.drill
        inventory_targets:
          - target_id: app-media-config-media-home
            expected_host: pve
            expected_base_path: /md1400/backup-cold/apps/media-config/media-home
        runtime_units:
          - unit_id: container-fleet-media-home
            expected_hostname: media-home-config
            expected_destination_lane: r730xd-media-config-backups
            expected_restore_class: media-config-dry-run-monthly
            expected_inventory_targets:
              - app-media-config-media-home
      lifecycle_binding:
        service_id: media
        expected_background_action_ids:
          - media_config_backup_cold_sync_cron
        expected_backup_targets:
          - home-vm-106-media-home-primary
          - app-media-config-media-home
        expected_backup_runtime_units:
          - vm-106-media-home
          - container-fleet-media-home
    residual_source_policy:
      residual_hosts:
        - download-stack
      retired_hosts:
        - streaming-stack
      note: "Residual shop stacks may remain inventoried, but active public routes, monitoring, agent endpoints, secrets verify URLs, and primary backup locality must all converge on media-home."
