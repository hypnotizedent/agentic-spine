---
status: authoritative
owner: "@ronny"
last_verified: 2026-05-01
scope: platform-control-surfaces
---

version: 1
updated: "2026-05-01T13:56:20Z"

services:
  n8n:
    service_registry_id: n8n
    admin_url: "https://n8n.ronny.works"
    health_path: "/healthz"
    backend:
      ssh_target: automation-stack
      scheme: http
      port: 5678
    secrets:
      project: infrastructure
      path: /spine/services/n8n
      required_keys:
        - N8N_API_KEY
    control:
      mutation_mode: capability_only
      mutation_surface: "./bin/ops cap run n8n.workflows.<action>"
      runtime_wrapper: "$HOME/code/projects/n8n/spine-plugin-n8n/bin/n8n-workflows"

  gitea:
    service_registry_id: gitea
    admin_url: "https://git.ronny.works"
    health_path: "/api/healthz"
    authority:
      canonical_role: source_authority
      canonical_term: forge
      compatibility_terms:
        - courthouse
        - source_node
      owns:
        - repositories
        - commits
        - branches
        - tags
        - pull_request_review_state
        - release_references
      does_not_own:
        - secret_values
        - identity_authority_of_record
        - backup_authority
        - runtime_placement_authority
      canonical_remote: origin
      publication_remote: github
      publication_rule: "GitHub is publication/distribution only; Gitea origin remains source authority."
    backend:
      ssh_target: dev-tools
      scheme: http
      port: 3000
    git_transport:
      ssh_target: dev-tools
      host_alias: gitea
      ssh_user: git
      port: 2222
    secrets:
      project: infrastructure
      path: /spine/vm-infra/gitea
      required_keys:
        - GITEA_API_TOKEN
    control:
      mutation_mode: browser_only
      mutation_surface: |
        Repo content: Gitea SSH origin (per-node deploy keys).
        Pull request lifecycle and broad service settings: browser admin/UI only.
        Narrow API exceptions (governed_api_caps below) for machine deploy-key
        admission and forge agent-identity admission only — do not authorize
        any other API mutation. Authority for the narrow exceptions: this
        contract; subtraction it preserves: commit 4455c487 retired the
        gitea.pr.* lifecycle caps and pinned broad mutation to browser. The
        narrow exceptions keep machine + agent-identity admission inside
        governed code instead of trapping it behind operator-as-web-UI-bridge.
        gitea.agent_identity.ensure (PACKET-770) admits the forge_node
        Stage 2 prerequisite: a distinct Gitea user with prohibit_login=true
        whose existence breaks weak_by_access_scarcity. Token/key admission
        for that identity remain FUTURE — not in this exception's scope.
      runtime_wrapper: ""
      governed_api_caps:
        - gitea.deploy_key.ensure
        - gitea.agent_identity.ensure

  authentik:
    service_registry_id: authentik
    admin_url: "https://auth.ronny.works"
    health_path: "/if/flow/initial-setup/"
    backend:
      ssh_target: infra-core
      scheme: http
      port: 9000
    secrets:
      project: infrastructure
      path: /spine/vm-infra/caddy-auth
      required_keys:
        - AUTHENTIK_API_TOKEN
    control:
      mutation_mode: browser_only
      mutation_surface: "Use the Authentik browser admin surface."
      runtime_wrapper: ""
