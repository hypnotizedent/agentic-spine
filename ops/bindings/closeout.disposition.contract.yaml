# Closeout Disposition Contract
# Status: authoritative
# Last verified: 2026-04-12
# Scope: terminal closeout outcomes for loops and waves

version: "1.2"
updated: "2026-04-26"
owner: "@ronny"
scope: closeout-disposition

# Kernel primitive role: This contract is the canonical authority home for the
# RESULT and FAILURE primitives in the kernel coordination protocol.
# The canonical outcome vocabulary (success/failure/blocked) unifies how
# result and failure are expressed across all receipt classes.
# See docs/governance/KERNEL_PRIMITIVE_CANON.md for the full primitive matrix.

terminal_dispositions:
  allowed:
    - landed
    - deferred
    - superseded
    - abandoned

enforcement:
  require_on_loop_close: true
  require_on_wave_close: true
  fail_worktree_reconcile_when_closed_owner_missing_disposition: true
  fail_worktree_reconcile_when_closed_owner_invalid_disposition: true

messages:
  missing: "Closed work must declare disposition: landed|deferred|superseded|abandoned."
  invalid: "Disposition must be one of: landed|deferred|superseded|abandoned."

semantics:
  landed: "Changes became shared truth and runtime, control plane, bindings/projections, and residue retirement all agree. If any propagation surface is incomplete, use deferred with a note, not landed."
  deferred: "Work was intentionally parked to a future loop, wave, or backlog item."
  superseded: "This unit of work was replaced by a newer canonical path."
  abandoned: "Work was intentionally stopped and should not be resumed without a new loop or wave."

propagation_guidance:
  landed_requires:
    - "Runtime reflects the change (services, containers, hosts)"
    - "Control plane reflects the change (bindings, contracts, SSOT docs)"
    - "Projections reflect the change (docs, dashboards, gate registry)"
    - "Residue is retired (stale branches, worktrees, exports, mounts)"
  rule: "If code changed but runtime or control plane did not, the disposition is deferred, not landed."

completion_levels:
  allowed:
    - slice_complete
    - loop_complete
    - domain_complete
    - estate_complete
    - readiness_complete

  definitions:
    slice_complete:
      meaning: "One bounded execution slice landed and its claimed proof passed."
      what_it_is_not: "Does not mean the owning loop, domain, or estate is complete."
    loop_complete:
      meaning: "The owning loop's planned slices are complete and its linked drift is resolved or explicitly dispositioned."
      what_it_is_not: "Does not mean the whole domain or estate is complete."
    domain_complete:
      meaning: "All known work in one domain agrees across runtime, control plane, and projections."
      what_it_is_not: "Does not mean other domains or the estate are complete."
    estate_complete:
      meaning: "Cross-domain control plane, runtime, and projection truth are aligned for the whole estate slice being claimed."
      what_it_is_not: "Does not mean the estate is ready for the next irreversible action."
    readiness_complete:
      meaning: "A readiness claim is proven for the next irreversible step or declared steady state."
      what_it_is_not: "Does not allow a slice proof to over-claim estate readiness."

  enforcement:
    require_on_landed: true
    require_on_deferred: false
    require_on_superseded: false
    require_on_abandoned: false
    fail_closeout_when_missing: true
    message: "disposition: landed requires completion_level. Declare: slice_complete|loop_complete|domain_complete|estate_complete|readiness_complete"

plan_transition_mapping:
  landed: completed
  deferred: pending
  superseded: completed
  abandoned: blocked
  rule: "plan_transition status must reflect close disposition semantics instead of collapsing every non-landed close to blocked."

# ── Canonical Outcome Vocabulary ──────────────────────────────────────────────
# Introduced by LOOP-RECEIPT-RESULT-FAILURE-COLLAPSE-20260426.
#
# The kernel protocol names "result" and "failure" as primitives but the
# implementation encodes them as branches of different vocabularies in different
# receipt classes. This section declares one canonical outcome vocabulary and
# maps each receipt class's existing encoding to it.
#
# This is the RESULT and FAILURE collapse: these primitives are not independent
# objects — they are the outcome field of lifecycle events (receipts).

outcome_vocabulary:
  description: >
    Canonical outcome for any governed lifecycle event. Every governed receipt
    class must express its terminal state through this vocabulary, either
    directly (outcome field) or via a documented mapping from its native
    encoding.

  values:
    success:
      meaning: "Work completed and its claimed proof passed."
      result_primitive: true
      failure_primitive: false
    failure:
      meaning: "Work did not complete or its proof did not pass."
      result_primitive: false
      failure_primitive: true
    blocked:
      meaning: "Work could not proceed due to a dependency, policy, or external condition. May be retried."
      result_primitive: false
      failure_primitive: true

  class_mappings:
    capability_receipt:
      native_field: "status"
      mapping:
        done: success
        failed: failure
        blocked: blocked
      notes: "cap.sh exec.json status field is already a direct expression of outcome."

    wave_close_exec_receipt:
      native_field: "lanes[].status + disposition"
      mapping:
        "all lanes done + disposition landed": success
        "any lane failed or disposition abandoned": failure
        "disposition deferred": blocked
        "disposition superseded": success
      notes: "Wave-close outcome is derived from lane outcomes and lifecycle disposition."

    controller_prompt_exec_receipt:
      native_field: "disposition"
      mapping:
        delivered: success
        abandoned: failure
        deferred: blocked
        superseded: success
      notes: "Controller-prompt close uses delivered/abandoned/deferred/superseded vocabulary."

    loop_closeout_receipt:
      native_field: "disposition"
      mapping:
        landed: success
        abandoned: failure
        deferred: blocked
        superseded: success
      notes: "Loop closeout uses the same terminal_dispositions vocabulary."

    narrative_receipt:
      native_field: "none"
      mapping: {}
      notes: "Narrative receipts are compatibility residue. They have no governed outcome field. If they claim an outcome that disagrees with a governed receipt, the governed receipt wins."

  enforcement:
    governed_receipts_must_express_outcome: true
    narrative_receipts_excluded: true
    rule: >
      Any new governed receipt class must express outcome through this
      vocabulary. Existing classes use the class_mappings above until
      writers emit an explicit outcome field.
