per_title_catalog:
  authority: "~/code/workbench/agents/media/data/MEDIA_LIBRARY_CATALOG.yaml"
  note: "For per-title detail (genres, lifecycle state, client state, lineage), consult the workbench catalog. This contract is the topology/lifecycle layer; the catalog is the content layer."

filesystem_rules:
  - "Every path under /volume1/media-staging/ has a declared purpose"
  - "Staging dirs (downloads/*-import-*) are temporary — exist only until import is verified"
  - "No mystery folders. If a folder has no declared purpose, it is drift."
  - "Scalable: structure supports adding libraries without reorganizing"

storage_lifecycle:
  movie_promotion:
    trigger: "Operator marks as watched + archive-eligible in catalog"
    method: "rsync from NAS → md1400, verify checksum, then operator confirms deletion from NAS"
    automation: "plan_only — no automatic moves, no automatic deletes"
    archive_root: /md1400/archive/media/movies
    archive_root_status: not_yet_created
  tv_retention:
    policy: "TV stays on NAS forever. No promotion to md1400. No deletion."
  music_retention:
    policy: "Music stays on NAS forever. No promotion to md1400. No deletion."

entropy_rules:
  - severity: warn
    condition: "Import staging dirs older than 7 days"
    current: "All staging dirs dated 2026-03-23 — within threshold"
  - severity: critical
    condition: "Import staging dirs older than 30 days without documented hold"
    current: "None currently — staging is fresh"
  - severity: warn
    condition: "Library roots must have matching ARR root folder configs"
    current: "PASS — all roots confirmed matching"
  - severity: warn
    condition: "Download complete dirs should drain to library within 24h (new content)"
    current: "19G TV in complete/tv — check if these are active downloads or stale"

known_issues:
  - id: autopulse-path-double-prefix
    severity: high
    detail: |
      Autopulse path rewrites are stale. Config has:
        Sonarr: /tv → /media/tv
        Radarr: /movies → /media/movies
        Lidarr: /music → /media/music
      But ARR now sends /media/tv (broad mount), so rewrite produces /media/media/tv.
      Fix: update rewrites to identity (FROM=/media/tv TO=/media/tv) or remove them.
      Impact: Jellyfin library scans fail for all autopulse-triggered refreshes.
  - id: sonarr-queue-401-stuck
    severity: high
    detail: "401 completed downloads stuck with warnings. Needs manual queue cleanup."
  - id: lidarr-low-track-coverage
    severity: medium
    detail: "275 artists monitored but only 49 have tracks. 226 artists with zero files."
  - id: radarr-empty-library
    severity: info
    detail: "Only 1 movie in Radarr. Library not yet built on home canonical."

