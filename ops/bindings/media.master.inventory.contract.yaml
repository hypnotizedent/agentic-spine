# MEDIA MASTER INVENTORY CONTRACT
# Status: authoritative
# Owner: "@ronny"
# Scope: What media lives where, lifecycle rules, quality contracts
#
# OPERATOR DIRECTIVES:
# - HOME (Synology DS918+) IS CANONICAL for all active media
# - TV and Music ONLY live on the NAS. No shop copies.
# - Movies flow: HOME (fresh/watching) → md1400 (cold archive after watched)
# - NO FILE DELETES by terminals. Operator deletes on his word only.
# - md1400 stays open as download plane + cold archive
# - Old stuff on md1400 sits. Moving it costs more than it's worth.
#
# For per-title detail (genres, lifecycle, client state, lineage):
#   ~/code/workbench/agents/media/data/MEDIA_LIBRARY_CATALOG.yaml
# For pipeline and container details:
#   ops/bindings/media.pipeline.contract.yaml

