    trigger: "Operator marks as watched + archive-eligible in catalog"
    method: "rsync from NAS → md1400, verify checksum, then operator confirms deletion from NAS"
    automation: "plan_only — no automatic moves, no automatic deletes"
    archive_root: /md1400/archive/media/movies
    archive_root_status: not_yet_created
  tv_retention:
    policy: "TV stays on NAS forever. No promotion to md1400. No deletion."
  music_retention:
    policy: "Music stays on NAS forever. No promotion to md1400. No deletion."

