# Status: authoritative
# Last verified: 2026-03-08

version: 1
updated_at: "2026-03-08"
owner: "@ronny"

# Calendar timezone for scheduled tasks. Must be an IANA TZ (for iPhone).
timezone: "America/New_York"

# Stable anchor date for DTSTART on recurring events (keeps ICS deterministic).
dtstart_date: "2026-02-10"

# Human label for calendar clients.
calendar_name: "Spine Backups"

events:
  - id: "pve-vzdump-daily"
    summary: "Proxmox vzdump (pve) daily"
    freq: "DAILY"
    byhour: 2
    byminute: 0
    duration_minutes: 180
    description: "Canonical pve vzdump job backup-ronny-daily-2026-01-22 writes shop VM/LXC source artifacts to tank-backups before md1400 cold sync."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "backup-home-p0-daily"
    summary: "Home Assistant vzdump (Synology)"
    freq: "DAILY"
    byhour: 3
    byminute: 0
    duration_minutes: 45
    description: "Canonical home Home Assistant backup on proxmox-home to Synology-backed storage."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "backup-home-p2-weekly"
    summary: "Home Pi-hole vzdump (Synology)"
    freq: "WEEKLY"
    byday:
      - "SU"
    byhour: 4
    byminute: 0
    duration_minutes: 90
    description: "Canonical home Pi-hole backup on proxmox-home to Synology-backed storage."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "archive-smb-zfs-snapshot-daily"
    summary: "Archive-SMB ZFS snapshot"
    freq: "DAILY"
    byhour: 1
    byminute: 5
    duration_minutes: 10
    description: "Daily ZFS snapshot/manifest for md1400/ronny-projects and md1400/mint-legacy on pve."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "mail-archiver-backup"
    summary: "Mail-archiver backup + offsite verify"
    freq: "DAILY"
    byhour: 3
    byminute: 0
    duration_minutes: 240
    description: "Root cron on communications-stack runs mail-archiver-backup.sh for pg_dump, uploads archive, local last-good, and md1400 offsite verification."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "n8n-workflows-cold-sync-daily"
    summary: "n8n workflows cold sync"
    freq: "DAILY"
    byhour: 3
    byminute: 15
    duration_minutes: 15
    description: "Cold sync latest n8n workflow export to md1400."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "media-config-media-home-cold-sync-daily"
    summary: "Media-home config backup"
    freq: "DAILY"
    byhour: 4
    byminute: 15
    duration_minutes: 90
    description: "Archive combined media-home config-state to Synology first, then mirror the latest artifact to md1400. Media payload remains excluded."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "finance-stack-backup"
    summary: "Finance stack app backups"
    freq: "DAILY"
    byhour: 6
    byminute: 20
    duration_minutes: 45
    description: "Firefly, Ghostfolio, Paperless DB/export, and finance manifest land on the md1400 canonical finance plane."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "pve-vzdump-md1400-cold-sync-daily"
    summary: "pve vzdump cold sync to md1400"
    freq: "DAILY"
    byhour: 8
    byminute: 30
    duration_minutes: 180
    description: "Promote latest successful pve vzdump artifacts from tank-backups into the md1400 shop cold plane."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "backup-monitor-hourly"
    summary: "Backup monitor + alert dispatch"
    freq: "HOURLY"
    byminute: 15
    duration_minutes: 5
    description: "Run backup.monitor for freshness degradation detection and governed alert intent dispatch."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "mail-archiver-restore-drill-monthly"
    summary: "Mail-archiver restore drill"
    freq: "MONTHLY"
    bymonthday: 1
    byhour: 4
    byminute: 0
    duration_minutes: 30
    description: "Monthly dry-run restore drill for communications mail-archiver backup posture."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "media-config-restore-drill-monthly"
    summary: "Media config restore drill"
    freq: "MONTHLY"
    bymonthday: 1
    byhour: 4
    byminute: 30
    duration_minutes: 20
    description: "Dry-run restore drill for media config-state class."
    source: "ops/bindings/backup.schedule.yaml"

  - id: "infisical-restore-drill-quarterly"
    summary: "Infisical restore drill"
    freq: "MONTHLY"
    interval: 3
    bymonthday: 1
    byhour: 5
    byminute: 0
    duration_minutes: 20
    description: "Quarterly dry-run restore drill for tier1 small-state assets anchored on Infisical."
    source: "ops/bindings/backup.schedule.yaml"
