status: authoritative
owner: "@ronny"
last_verified: 2026-03-13
scope: mint-artifact-record-truth

summary: >
  Canonical governed artifact-binding layer between Mint inbox seed intake and
  canonical MinIO-backed file truth. Artifact records are the first-class shared
  answer for Morpheus, Artie, and downstream proof/production lanes.

storage:
  runtime_root: runtime/domain-state/mint
  artifacts_dir: runtime/domain-state/mint/artifacts/
  artifacts_index: runtime/domain-state/mint/artifacts-index.yaml

roles:
  allowed:
    - original
    - reference_mockup
    - proof
    - print_ready
    - production_asset
    - superseded
  placement_folders:
    original: "1. Originals"
    reference_mockup: "2. Reference Mockups"
    proof: "2. Proofs"
    print_ready: "3. Print Ready"
    production_asset: "4. Production Assets"
    superseded: "_superseded"

status_values:
  - active
  - needs_review
  - superseded

truth_flow:
  canonical_path:
    - mint.customer.seed.ensure
    - mint.artifact.record.capture
    - mint.artifact.record.snapshot
  override_path:
    - mint.artifact.record.role.set

governance_rules:
  - Morpheus must query mint.artifact.record.snapshot before relying on loose attachment interpretation when seed or job artifact truth already exists.
  - Artie handoffs should carry artifact_id plus canonical_object_key/path, not only attachment filenames.
  - Production and proof lanes may reuse canonical object refs from artifact truth and should not re-read raw email attachments when artifact records exist.

