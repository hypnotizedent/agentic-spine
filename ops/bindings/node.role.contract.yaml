    state_read: allowed
    routing_dispatch: allowed
    heartbeat_emission: allowed
    heartbeat_observation: forbidden
    external_escalation: forbidden

  verification_node:
    interactive_session_attach: forbidden
    headless_execution: forbidden
    git_mutation: forbidden
    capability_execution: forbidden
    verification_gate_evaluation: allowed
    state_mutation: forbidden
    state_read: allowed
    routing_dispatch: forbidden
    heartbeat_emission: allowed
    heartbeat_observation: forbidden
    external_escalation: forbidden

  storage_evidence_node:
    interactive_session_attach: forbidden
    headless_execution: forbidden
    git_mutation: forbidden
    capability_execution: routed_only
    capability_execution_note: |
      Post-D.3b v4 cutover, the delivered storage_evidence_node executes caps
      only when consumers route them via cap.sh's _route_to_db_authority_if_needed
      (D.3a + D.3c). This is state mutation through routed cap.sh dispatch
      against the authority's own DB and filesystem — not arbitrary operator-
      driven capability execution. Direct interactive cap execution on the
      authority host is forbidden; only inbound-routed dispatches run.
    verification_gate_evaluation: routed_only
    verification_gate_evaluation_note: |
      verify.engine.run and spine.verify route here from consumers (D-gates
      query the authority DB). Pre-cutover this would have been forbidden;
      post-cutover the routed evaluation IS the evaluation.
    state_mutation: allowed
    state_read: allowed
    routing_dispatch: receives_routed_dispatches
    routing_dispatch_note: |
      Storage_evidence_node is the routing destination for db_authority traffic.
      It does not originate routed dispatches — it terminates them.
    heartbeat_emission: allowed
    heartbeat_observation: forbidden
    external_escalation: forbidden

  forge_node:
    interactive_session_attach: forbidden
    headless_execution: routed_only
    headless_execution_note: |
      Forge runs CI jobs via gitea-actions-runner. These are headless
      executions but bounded by the runner contract — they are not
      arbitrary execution_host workloads. Direct ad-hoc headless work on
      the forge host is forbidden; only governed runner-driven jobs run.
    git_mutation: receives_governed_pushes
    git_mutation_note: |
      Forge is the canonical git authority — it RECEIVES governed pushes
      from operator_console and PR/runner pipelines. Direct git mutation
      ON the forge host (outside the receive path) is forbidden.
    capability_execution: forbidden
    verification_gate_evaluation: forbidden
    state_mutation: forbidden
    state_read: forbidden
    state_read_note: "Forge owns code, not governed runtime/evidence/mailroom state. Spine state lives on storage_evidence_node."
    routing_dispatch: forbidden
    heartbeat_emission: allowed
    heartbeat_observation: forbidden
    external_escalation: forbidden

  watcher_node:
    interactive_session_attach: forbidden
    headless_execution: forbidden
    git_mutation: forbidden
    capability_execution: forbidden
    verification_gate_evaluation: forbidden
    state_mutation: forbidden
    state_read: allowed
    routing_dispatch: forbidden
    heartbeat_emission: forbidden
    heartbeat_observation: allowed
    external_escalation: allowed

authority_exceptions:
  # Scoped exception: execution_host external_escalation for operator-critical-interrupt
  # Loop: LOOP-SPINE-OPERATOR-INTERRUPT-AUTHORITY-RECONCILE-20260413
  # V1 contract: LOOP-SPINE-AUTONOMOUS-OPERATOR-COMMS-V1-CONTRACT-20260413
  #
  # Base authority: execution_host.external_escalation = forbidden
  # This exception does NOT change the base authority matrix.
  # It grants a narrow, traceable override for a single actuator subclass.
  execution_host_operator_critical_interrupt:
    status: retired
    retired_at: "2026-04-14"
    base_field: external_escalation
    base_value: forbidden
    exception_value: allowed
    scope: operator-critical-interrupt-only
    actuator_subclass: governed-operator-interrupt
    trigger_threshold: incident
    allowed_domain_ids:
      - infra-core-stack
      - mcp-runtime-anti-drift
    sunset_condition: "Expires when watcher_node is realized and external_escalation is transferred to watcher_node runtime."
    retirement_note: |
      RETIRED 2026-04-14. Sunset condition satisfied.
      watcher_node realized on proxmox-home on 2026-04-14, then transferred to
      pve-r620 on 2026-04-29 with full observation fidelity:
      - Interrupt origin transfer proved (system-dispatch, 4/4 channels, 0 errors)
      - infra.core.slo.status hardened: canonical identity resolution via ssh-resolve.sh,
        topology-aware transport (Tailscale), evidence validity labeling (cross_site_valid)
      - R620 proof: systemd service exit=0, heartbeat healthy, dispatch_errors=0
      - Watcher v1 bar: HTTP/service observation is sufficient for independent failure
        detection and operator-critical interrupt. SSH predictive observation is optional
        hardening, not a v1 requirement.
      execution_host no longer holds external_escalation authority.
      watcher_node holds it natively via base role authority.
    retirement_proof:
      probe_fidelity_lane: "WATCHER V1 PROBE FIDELITY HARDENING — closed 2026-04-14"
      cross_site_evidence: "alerting-probe-cycle from pve-r620: service exit=0, heartbeat healthy, dispatch_errors=0"
