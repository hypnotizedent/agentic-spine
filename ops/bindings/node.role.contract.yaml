authority_exceptions:
  # Scoped exception: execution_host external_escalation for operator-critical-interrupt
  # Loop: LOOP-SPINE-OPERATOR-INTERRUPT-AUTHORITY-RECONCILE-20260413
  # V1 contract: LOOP-SPINE-AUTONOMOUS-OPERATOR-COMMS-V1-CONTRACT-20260413
  #
  # Base authority: execution_host.external_escalation = forbidden
  # This exception does NOT change the base authority matrix.
  # It grants a narrow, traceable override for a single actuator subclass.
  execution_host_operator_critical_interrupt:
    status: retired
    retired_at: "2026-04-14"
    base_field: external_escalation
    base_value: forbidden
    exception_value: allowed
    scope: operator-critical-interrupt-only
    actuator_subclass: governed-operator-interrupt
    trigger_threshold: incident
    allowed_domain_ids:
      - infra-core-stack
      - mcp-runtime-anti-drift
    sunset_condition: "Expires when watcher_node is realized and external_escalation is transferred to watcher_node runtime."
    retirement_note: |
      RETIRED 2026-04-14. Sunset condition satisfied.
      watcher_node realized on proxmox-home with full observation fidelity:
      - Interrupt origin transfer proved (system-dispatch, 4/4 channels, 0 errors)
      - infra.core.slo.status hardened: canonical identity resolution via ssh-resolve.sh,
        topology-aware transport (Tailscale), evidence validity labeling (cross_site_valid)
      - Cross-site proof from proxmox-home: 5/5 required OK, 1/1 optional OK
      - Watcher v1 bar: HTTP/service observation is sufficient for independent failure
        detection and operator-critical interrupt. SSH predictive observation is optional
        hardening, not a v1 requirement.
      execution_host no longer holds external_escalation authority.
      watcher_node holds it natively via base role authority.
    retirement_proof:
      probe_fidelity_lane: "WATCHER V1 PROBE FIDELITY HARDENING — closed 2026-04-14"
      cross_site_evidence: "infra.core.slo.status from proxmox-home: OK, transport_path=tailscale, evidence_validity=cross_site_valid"
      operator_decision: "HTTP-only observation sufficient for watcher v1. SSH predictive is optional hardening, parked."
    rejection_log:
      option_a_move_to_watcher: "SELECTED. Watcher v1 complete. Exception retired."
      option_c_split_detection_escalation: "No longer needed — watcher_node holds full authority."

authority_constraints:
  execution_host:
    git_mutation: "Only under governed-main-override and existing git guardrails."
  verification_node:
    verification_gate_evaluation: "Verification authority only; no execution or git mutation."
  storage_evidence_node:
    state_mutation: "Canonical owner of governed runtime, evidence, and mailroom state."
  watcher_node:
    state_read: "Limited to heartbeat and liveness observation surfaces."
    heartbeat_observation: "Observation-only; watcher does not itself emit governed heartbeats."

state_access_model:
