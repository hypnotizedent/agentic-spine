        recovery_drill_proof:
          source: ops/bindings/disaster.drill.execution_pickup.contract.yaml
          requirement: "Fresh recovery drill receipt covers storage_evidence_node failure modes: dataset unavailable, read failure visibly fails (not silently partial), snapshot recovery proven, no fallback to operator-workstation state."
          proof_ref: "$SPINE_STATE/domain-state/storage-evidence-node/pve-recovery-drill-proof-20260502.yaml"
      candidate_gaps: {}
      proofs_present:
        pve:
          - dataset_substrate_proof
          - canonical_root_export_proof
          - authority_transfer_proof
          - recovery_drill_proof
    physical_separation_posture:
      operator_console: preferred
      execution_host: preferred
      translator_node: permitted_no_preference
      verification_node: preferred
      watcher_node: required

