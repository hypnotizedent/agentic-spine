        authority_transfer_proof:
          source: ops/bindings/root.authority.contract.yaml
          requirement: "root.authority.contract.yaml declares the storage_evidence_node-backed roots as primary canonical. Darwin/operator-workstation paths demoted to install-target/client-fallback only, never canonical write target. Existing state migrated once with the transfer recorded as evidence on the new root."
