# Node Role Contract
# Governs the physical-node / machine-role taxonomy, authority, state access,
# failure expectations, replacement posture, and external observation model.
# Device-agnostic only. No deployment or machine assignment is activated here.
#
# Vocabulary note (2026-04-16):
# The translator doctrine (TRANSLATOR_AUTHORITY_DOCTRINE_V1.md) describes a
# 7-node model. This binding defines 6 types. The difference is control_node:
#   - The doctrine names control_node as a future decomposition of the broker,
#     routing, loop-state, and attestation-authority functions.
#   - Today those functions are carried by operator_console as the admitting
#     client surface (the only surface with interactive_session_attach +
#     git_mutation + routing_dispatch).
#   - control_node is not in this binding because it has never been promoted
#     past taxonomy. No workload, no candidate host, no runtime materialization.
#   - When control_node is promoted, it will appear here with its own authority
#     row and separation posture. Until then, operator_console carries the load.
#   - This does NOT mean the operator workstation is the unattended substrate.
#     Autonomous execution belongs to execution_host; operator_console is the
#     client surface that admits and observes work.
# See also: NODE_PROMOTION_LADDER.md (L1 MVP kit = these 6 types).

runtime_substrate_boundary:
  status: vocabulary_only
  purpose: >
    Names the runtime substrate boundary so placement and admission readbacks do
    not infer node roles from observed Docker, VM, LXC, or host process facts.
    This is not a new authority surface and does not add a placement classifier.
  terms:
    hypervisor_host: "Bare-metal virtualization/control host. Not a generic Docker or compose host."
    guest_runtime: "VM, LXC, or appliance OS where declared workloads, systemd units, or compose stacks run."
    container_runtime: "Docker/container process layer inside a declared guest runtime."
    host_runtime: "Host OS runtime for the node role assigned to that host."
  constraints:
    - discovery_can_inform_evidence_not_placement_or_role_authority
    - host_runtime_is_not_guest_runtime
    - hypervisor_host_is_not_generic_docker_host
    - container_presence_does_not_assign_node_role
  canonical_readbacks:
    node_admission: node.admission.status
    site_presence: site.presence.status
    custody: payload.custody.status
    backup: backup.estate.readback.status

node_types:
  operator_console:
    description: "Interactive admitting client for governed operator sessions, manual override, and direct control-plane git/capability work. It is not the unattended execution substrate."
    multiple_instances_allowed: true
    colocation_allowed: true
    promotion_standard:
      current_delivered_host: macbook-2016-pro
      statement: >
        operator_console is the active admitting client for governed terminal
        sessions. macbook-2016-pro carries this role today via
        root.authority.contract.yaml's Darwin install-default paths.
        multiple_instances_allowed: true means additional operator_console
        surfaces may be admitted; current_delivered_host names today's
        primary surface without forbidding others. operator_console does not
        require a multi-proof receipt ladder like storage_evidence_node or
        forge_node — the proof is bound terminal identity admitted via
        ops terminal launch, governed by role.runtime.control.contract.yaml.
      proofs_present:
        macbook-2016-pro:
          - terminal_launch_admission_proof
    physical_separation_posture:
      execution_host: preferred
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: required

  execution_host:
    description: "Always-on autonomous execution substrate for launchd scheduling, workers, control cycles, and headless capabilities. It carries unattended runtime so operator_console does not."
    multiple_instances_allowed: false
    colocation_allowed: true
    repo_posture: deploy_target_only
    repo_posture_note: "Code reaches execution_host only via governed promotion (reviewed commit, explicit push). The repo clone is a deploy target, not a working checkout. Ad hoc edits, worktrees, and repo-local runtime state are prohibited."
    realized_by:
      - contract: ops/bindings/mailroom.task.worker.contract.yaml
        surface: execution.pickup.status
        boundary: "Worker claim/heartbeat/result/receipt proves execution custody only; node role assignment remains here."
    promotion_standard:
      current_delivered_host: ai-consolidation
      statement: >
        Active runtime labels are observation. A host is delivered as
        execution_host only when runtime placement, path resolution, and recovery
        drill proof are all present.
      required_proofs:
        runtime_placement_proof:
          source: ops/bindings/launchd.scheduler.registry.yaml
          requirement: "At least one active execution_host runtime label points at the host with runtime_transfer_proof."
        path_resolution_proof:
          source:
            - ops/bindings/runtime.bootstrap.contract.yaml
            - ops/bindings/launchd.scheduler.registry.yaml
            - /etc/spine/execution-host.env
          requirement: "Linux execution_host resolves runtime roots from /etc/spine/execution-host.env before darwin/operator-console defaults."
          proof_ref: "CAP-20260501-225322__loops.status__Rgdz3738015 proved plain remote bin/ops cap run on ai-consolidation using /home/ubuntu/code paths."
        recovery_drill_proof:
          source: ops/bindings/disaster.drill.execution_pickup.contract.yaml
          requirement: "Fresh recovery_drill receipt for the host with all execution pickup fixtures passing."
          proof_ref: "$SPINE_STATE/domain-state/recovery-drills/execution-pickup/latest.yaml"
      candidate_gaps:
        ai-consolidation: []
        pve-r620:
          - runtime_placement_proof
          - path_resolution_proof
          - recovery_drill_proof
          - role_boundary_conflict_currently_watcher_node
      deferred_candidates:
        pve:
          deferred_until: "storage_evidence_node delivered on pve and a separate execution_host promotion is initiated"
          reason: >
            pve is the active candidate for storage_evidence_node. Storage and
            execution are different jobs; bundling them on the same host
            without independent proof would conflate roles. execution_host
            candidacy on pve is deferred until storage_evidence_node delivery
            is complete and a separate explicit promotion sequence runs.
          drift_subtractions:
            - "pve-730xd as candidate identity (not canonical; pve is the canonical machine ID per ssh.targets, hardware.inventory, fleet.admission, node.admission.status)"
    physical_separation_posture:
      operator_console: preferred
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: required

  translator_node:
    description: "Membrane compatibility node role for ingestion, classification, normalization, and routing only."
    multiple_instances_allowed: true
    colocation_allowed: true
    physical_separation_posture:
      operator_console: permitted_no_preference
      execution_host: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: permitted_no_preference
      watcher_node: permitted_no_preference

  verification_node:
    description: "Read-heavy verification and attestation surface for verify runs and gate evaluation."
    multiple_instances_allowed: true
    colocation_allowed: true
    physical_separation_posture:
      operator_console: permitted_no_preference
      execution_host: permitted_no_preference
      translator_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: permitted_no_preference

  storage_evidence_node:
    description: "Canonical durable owner of governed runtime state, evidence trail, receipts archive, and domain state."
    multiple_instances_allowed: false
    colocation_allowed: true
    realized_by:
      - contract: ops/bindings/root.authority.contract.yaml
        surface: "spine canonical roots (state, evidence, mailroom, receipt archive)"
        boundary: "Storage owns durable state, evidence, and archive substrate; node admission and role assignment remain in node.role.contract. Storage writers are not authority for placement, role promotion, or domain truth."
    promotion_standard:
      current_delivered_host: pve
      statement: >
        Active workload intent is observation. A host is delivered as
        storage_evidence_node only when dataset substrate, canonical-root
        export, authority transfer, and recovery drill proofs are all present.
      required_proofs:
        dataset_substrate_proof:
          source:
            - ops/bindings/hardware.inventory.yaml
            - host-side ZFS readback
          requirement: "Durable ZFS dataset (or equivalent) exists on the candidate host with capacity-visible, snapshottable, ONLINE status. Spine subdataset hierarchy materialized under one namespace covering runtime, evidence, mailroom, receipts, and archive."
          proof_ref: "$SPINE_STATE/domain-state/storage-evidence-node/pve-dataset-substrate-proof-20260502.yaml"
        canonical_root_export_proof:
          source:
            - ops/bindings/root.authority.contract.yaml
            - mount/export configuration on consuming nodes
          requirement: "Every node that consumes spine state (operator_console, execution_host, watcher_node, verification_node) reaches the canonical roots through one stable mount/path shape, not divergent operator-workstation defaults."
          proof_ref: "$SPINE_STATE/domain-state/storage-evidence-node/pve-canonical-root-export-proof-20260502.yaml"
        authority_transfer_proof:
          source: ops/bindings/root.authority.contract.yaml
          requirement: "root.authority.contract.yaml declares the storage_evidence_node-backed roots as primary canonical. Darwin/operator-workstation paths demoted to install-target/client-fallback only, never canonical write target. Existing state migrated once with the transfer recorded as evidence on the new root."
          proof_ref: "$SPINE_STATE/domain-state/storage-evidence-node/pve-authority-transfer-proof-20260502.yaml"
        recovery_drill_proof:
          source: ops/bindings/disaster.drill.execution_pickup.contract.yaml
          requirement: "Fresh recovery drill receipt covers storage_evidence_node failure modes: dataset unavailable, read failure visibly fails (not silently partial), snapshot recovery proven, no fallback to operator-workstation state."
          proof_ref: "$SPINE_STATE/domain-state/storage-evidence-node/pve-recovery-drill-proof-20260502.yaml"
      candidate_gaps: {}
      proofs_present:
        pve:
          - dataset_substrate_proof
          - canonical_root_export_proof
          - authority_transfer_proof
          - recovery_drill_proof
    physical_separation_posture:
      operator_console: preferred
      execution_host: preferred
      translator_node: permitted_no_preference
      verification_node: preferred
      watcher_node: required

  forge_node:
    description: "Source-of-code-truth and CI execution surface. Owns origin/main of governed repos (agentic-spine, workbench, projects), runner-driven CI execution, and the boundary that bounds AI-agent writes to repo state. Code arriving here is the canonical reviewable record consumed by execution_host and verification_node."
    multiple_instances_allowed: false
    colocation_allowed: true
    realized_by:
      - contract: ops/bindings/ssh.targets.yaml
        surface: dev-tools
        boundary: "Active runtime body lives in the dev-tools VM (Gitea + PostgreSQL + Gitea Actions runner). SSH/host evidence is access-path only; node role assignment remains here."
    promotion_standard:
      current_runtime_body:
        ssh_targets_id: dev-tools
        host_descriptor: "Dev tools VM 206 (Gitea + PostgreSQL + Gitea Actions runner)"
        services:
          - gitea
          - gitea-postgresql
          - gitea-actions-runner
        addresses:
          lan: "192.168.1.206"
          tailscale: "100.90.167.39"
      delivered: false
      not_delivered_reason: >
        Runtime body exists on dev-tools and currently serves origin/main, but
        the proof ladder is not materialized. Operator approved nameplate-only
        declaration on 2026-05-02 (PACKET-588 Phase 4). No runtime mutation, no
        Forgejo switch, no runner changes, no DNS/secrets, no branch-protection
        changes, no new VM, no watcher movement.
      header_truth_note: >
        delivered:false is the Phase 4 nameplate invariant enforced by D447;
        it must remain false until a separate explicit delivery sequence
        runs. Substrate truth (5/5 proofs landed via PACKET-588 Phase 5/6 +
        PACKET-602 + PACKET-604 + PACKET-605 + PACKET-608) is canonically
        declared in proofs_present.dev-tools below. node.admission.status
        must honor delivered:false and report the runtime body as candidacy /
        contracted_not_delivered until Stage 2 enforcement lands; Stage 1
        substrate proof coverage is not role delivery.
      statement: >
        Active runtime presence on dev-tools is observation. The host is
        delivered as forge_node only when forge status, backup/restore,
        agent boundary, runner cache boundary, and branch-protection readback
        proofs are all present.
      required_proofs:
        forge_status_proof:
          source:
            - ops/plugins/infra/host/bin/forge-status
            - ops/bindings/ssh.targets.yaml
          requirement: "Read-only readback proves origin/main HEAD is reachable, runner state is observable, and repo ACL surface (orgs/teams/branches/protection rules) is enumerable. Surfaces drift between declared state and observed state. NO mutation."
          proof_ref: "$SPINE_STATE/domain-state/forge-node/forge-status-proof-latest.yaml"
        backup_restore_proof:
          source:
            - ops/plugins/infra/host/bin/forge-backup-restore-status
            - ops/bindings/vm.lifecycle.yaml
            - ops/bindings/shop.storage.map.yaml
          requirement: |
            Two-stage proof. Stage 1 (read-only evidence + restore path shape):
            backup posture is enumerable from contracts (declared lane + base_path),
            observed artifacts at the declared path are listed with timestamps so
            drift between declared and observed is honestly visible, and the
            restore path shape (qmrestore command template) is documented without
            execution. Stage 2 (mutating restore drill, FUTURE): a known commit +
            Gitea config + runner registration are reconstituted from the off-host
            backup to a parallel VMID. Restore validated by readback (HEAD matches,
            runner registers, ACL re-applies), not just file copy. Stage 1 is the
            current proof_ref artifact. Stage 2 advances when at least one fresh
            backup artifact exists and a parallel VMID is allocated for drill.
          proof_ref: "$SPINE_STATE/domain-state/forge-node/backup-restore-proof-latest.yaml"
          staged_delivery:
            stage_1_evidence: present_when_proof_ref_artifact_exists
            stage_2_drill: delivered
            stage_2_drill_proof_ref: "$SPINE_STATE/domain-state/forge-node/restore-drill-receipt-latest.yaml"
            stage_2_drill_packet: PACKET-608-FORGE-NODE-STAGE-2-2-RESTORE-DRILL-PARALLEL-VMID
            stage_2_drill_scope_note: >
              Stage 2.2 (restore drill to parallel VMID 996, qmrestore + qm config + qm destroy
              with production VM 206 untouched) delivered 2026-05-03 per operator approval.
              Drill proves restore mechanism survives a round trip; does NOT validate filesystem
              content or service revival (those are deferred to deeper future drills — see
              deferred_validations block in the drill receipt).
        agent_boundary_proof:
          source:
            - ops/plugins/infra/host/bin/forge-agent-boundary-status
            - ops/bindings/node.role.contract.yaml
          requirement: |
            Two-stage proof. Stage 1 (read-only enumeration + classification):
            recent commits on origin/main are inspected and classified by
            author email (operator/agent/unknown), the auth surface is
            enumerated (SSH keys, deploy keys, API tokens with scope, OAuth
            apps, webhooks — names + metadata only, never values or
            fingerprints), branch-protection state is cross-referenced from
            branch_protection_readback_proof, and the boundary is classified
            (structurally_enforced / partially_enforced / not_enforced) with
            named enforcement gaps. Stage 2 (mutating enforcement, FUTURE):
            AI agents writing to forge are bounded by mailroom/runner
            contract — no direct push to origin/main outside governed
            pipeline; PR/branch shape enforced via required_approvals +
            status_checks + signed_commits; agent-distinct identities
            allocated as deploy keys or scope-narrowed tokens; receipt
            class shows agent-origin commits arrived through governed
            lane only. Stage 1 is the current proof_ref artifact. Stage 2
            advances when structural enforcement on main + agent-identity
            separation are landed.
          proof_ref: "$SPINE_STATE/domain-state/forge-node/agent-boundary-proof-latest.yaml"
          staged_delivery:
            stage_1_enumeration: present_when_proof_ref_artifact_exists
            stage_2_enforcement: future
            stage_2_blocked_until: structural_enforcement_landed_with_agent_identity_separation
        runner_cache_boundary_proof:
          source:
            - ops/plugins/infra/host/bin/forge-runner-cache-boundary-status
            - ops/bindings/node.role.contract.yaml
          requirement: |
            Two-stage proof. Stage 1 (read-only enumeration + cache-scope
            classification): runner registration metadata enumerated with
            scope (per_repo / per_owner_global / instance_global) — token_hash
            and token_salt EXPLICITLY excluded; runner data dir stat-only
            because /data/.runner contains a registration token; cache
            directory layout enumerated (file/dir names + sizes only — no
            content reads) for /root/.cache/act and /root/.cache/actcache;
            volume mounts inspected (docker.sock visibility is load-bearing);
            action_run history counted. Cache scope classified as
            isolated_per_job / shared_per_runner / unbounded with named gaps.
            Stage 2 (mutating clean-room job demonstration, FUTURE): two
            synthetic jobs are spawned and proven to leak no artifact between
            them; runner caches and ephemeral runner state are demonstrated
            to NOT cross job/branch/repo boundaries. Stage 1 is the current
            proof_ref artifact. Stage 2 advances when clean-room
            demonstration produces a passing receipt.
          proof_ref: "$SPINE_STATE/domain-state/forge-node/runner-cache-boundary-proof-latest.yaml"
          staged_delivery:
            stage_1_enumeration: present_when_proof_ref_artifact_exists
            stage_2_clean_room_demo: future
            stage_2_blocked_until: clean_room_job_demonstration_runs_two_synthetic_jobs_with_no_observed_leak
        branch_protection_readback_proof:
          source:
            - ops/plugins/infra/host/bin/forge-branch-protection-status
            - ops/bindings/node.role.contract.yaml
          requirement: "Branch protection rules on origin/main are readable through governed cap and match a declared baseline (required reviews, force-push prohibition, status-check requirement). NO mutation to existing rules in this proof — read-only verification only."
          proof_ref: "$SPINE_STATE/domain-state/forge-node/branch-protection-readback-proof-latest.yaml"
      proofs_present:
        dev-tools:
          - forge_status_proof
          - branch_protection_readback_proof
          - backup_restore_proof
          - agent_boundary_proof
          - runner_cache_boundary_proof
      candidate_gaps:
        dev-tools: []
    physical_separation_posture:
      operator_console: permitted_no_preference
      execution_host: preferred
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: required

  watcher_node:
    description: "External liveness observer for heartbeats and escalation; it must outlive any single watched node failure."
    multiple_instances_allowed: true
    colocation_allowed: true
    physical_separation_posture:
      operator_console: required
      execution_host: required
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: required

