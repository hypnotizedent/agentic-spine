      option_c_split_detection_escalation: "No longer needed — watcher_node holds full authority."

  # Scoped exception: execution_host interactive_session_attach for emergency governance
  # T2: Minimum Survivable Control Plane — emergency session entry
  # Design ref: STATE-REACHABILITY-FROM-AI-CONSOLIDATION-DESIGN-20260416.md
  # Parent design: MINIMUM-SURVIVABLE-CONTROL-PLANE-DESIGN-20260416.md
  # Operator decision: 2026-04-16 (narrow approval for emergency session exception)
  #
  # Base authority: execution_host.interactive_session_attach = forbidden
  # This exception does NOT change the base authority matrix.
  # It grants a narrow, traceable override for emergency operator sessions
  # when the primary operator_console is unavailable.
  execution_host_emergency_session_attach:
    status: active
    activated_at: "2026-04-16"
    base_field: interactive_session_attach
    base_value: forbidden
    exception_value: allowed
    scope: emergency-operator-console-unavailable
    trigger_condition: "Primary operator_console is unreachable or unavailable"
    constraint: "Read-only governance inspection and bounded session work only. This is NOT a daily-driver session surface."
    depends_on: "T1 state sync must be active (execution-host pull from MBP via systemd timer)"
    sunset_condition: "Expires when a permanent secondary operator_console is designated or state authority migrates off MBP (T5)."

authority_constraints:
  execution_host:
    git_mutation: "Only under governed-main-override and existing git guardrails."
  verification_node:
    verification_gate_evaluation: "Verification authority only; no execution or git mutation."
  storage_evidence_node:
    state_mutation: "Canonical owner of governed runtime, evidence, and mailroom state."
  watcher_node:
    state_read: "Limited to heartbeat and liveness observation surfaces."
    heartbeat_observation: "Observation-only; watcher does not itself emit governed heartbeats."

state_access_model:
  operator_console:
    state_access: "full read-write"
    evidence_access: "full read-write"
    mailroom_access: "full read-write"
    path_authority_relationship: "Reads and mutates governed repo/runtime/evidence paths under root.authority.contract.yaml during operator-directed work."

  execution_host:
    state_access: "full read-write"
    evidence_access: "full read-write"
    mailroom_access: "full read-write"
    path_authority_relationship: "Executes against canonical runtime, evidence, and mailroom roots; physical authority complements launchd.runtime.contract.yaml and mailroom.runtime.contract.yaml."

  translator_node:
    state_access: "read-only"
    evidence_access: "none"
    mailroom_access: "read-only"
    path_authority_relationship: "May resolve canonical roots for classification and queue visibility only. No state or evidence mutation."

  verification_node:
    state_access: "read-only"
    evidence_access: "read-write verify-only"
    mailroom_access: "none"
    path_authority_relationship: "May read canonical state and write verify reports or attestations only."

  storage_evidence_node:
    state_access: "full read-write"
    evidence_access: "full read-write"
    mailroom_access: "full read-write"
    path_authority_relationship: "Canonical owner for governed runtime, evidence, and mailroom paths."

  forge_node:
    state_access: "none"
    evidence_access: "none"
    mailroom_access: "none"
    path_authority_relationship: "Forge owns code (origin/main of governed repos), not governed runtime/evidence/mailroom paths. Spine state is consumed by execution_host pulling from forge; forge does not read or write spine state directly."

  watcher_node:
    state_access: "read-only"
    evidence_access: "none"
    mailroom_access: "none"
    path_authority_relationship: "Read-only access is limited to heartbeat and liveness observation surfaces; no general state ownership."

connectivity_requirements:
  principle: "Relationships are device-agnostic L1 reachability requirements only. No hostnames, machine ids, or deployment topology are assigned here."
  links:
    - from: operator_console
      to: execution_host
      required: true
      purpose: "Session attach, manual override, and governed interactive control."
    - from: execution_host
      to: storage_evidence_node
      required: true
      purpose: "Canonical runtime, evidence, and mailroom I/O."
    - from: translator_node
      to: execution_host
      required: true
      purpose: "Route normalized requests without taking execution authority."
    - from: verification_node
      to: storage_evidence_node
      required: true
      purpose: "Read governed state and write verify reports or attestations."
    - from: watcher_node
      to: watched_nodes
      required: true
      purpose: "Observe heartbeats and liveness from watched runtime nodes."
      watched_node_types:
        - operator_console
        - execution_host
        - storage_evidence_node
    - from: watcher_node
      to: external_escalation_target
      required: true
      purpose: "Escalate when a watched node becomes unreachable."

failure_model:
  operator_console_loss:
    degraded_capabilities:
      - manual_override
      - prompt_driven_operator_work
    mitigated_capabilities:
      - interactive_session_attach: "Emergency session attach on execution_host via authority exception (T2). Degraded but available."
    hard_stop_capabilities: []
    expected_escalation_behavior: "Operator SSHs to execution_host for emergency governed session. T1 state sync provides read-only governance projection. Autonomous execution continues independently."
    replacement_possible_without_state_movement: yes
    replacement_depends_on_future_replication_work: no
    t1_state_sync: "Active. 10-minute rsync pull from execution_host to Root 1. Pre-positioned stale data survives MBP loss."

  execution_host_loss:
    degraded_capabilities:
      - scheduled_execution
      - autonomous_control_cycles
      - mailroom_worker_progress
    hard_stop_capabilities:
      - headless_execution
      - launchd_scheduling
      - autonomous_receipt_generation
    expected_escalation_behavior: "A separate watcher_node should escalate externally. State remains on storage_evidence_node when storage remains reachable."
    replacement_possible_without_state_movement: conditional_on_storage_evidence_node_remaining_reachable
    replacement_depends_on_future_replication_work: no

  combined_operator_console_and_execution_host_loss:
    degraded_capabilities:
      - interactive_session_attach
      - manual_override
      - watched_runtime_visibility_when_watcher_is_colocated
    hard_stop_capabilities:
      - headless_execution
      - scheduled_execution
      - prompt_driven_operator_work
    expected_escalation_behavior: "No governed recovery path exists today when these roles disappear together on the same machine."
    replacement_possible_without_state_movement: no
    replacement_depends_on_future_replication_work: no_current_governed_recovery_path

  storage_evidence_node_loss:
    degraded_capabilities:
      - state_read_across_other_nodes
      - evidence_access
    hard_stop_capabilities:
      - governed_state_mutation
      - verification_against_canonical_state
      - mailroom_persistence
    expected_escalation_behavior: "Execution and verification halt until canonical state and evidence become reachable again."
    replacement_possible_without_state_movement: no
    replacement_depends_on_future_replication_work: yes

  watcher_node_loss:
    degraded_capabilities:
      - external_observation
      - heartbeat_escalation
    hard_stop_capabilities: []
    expected_escalation_behavior: "Other node types continue. Replace watcher without data movement."
    replacement_possible_without_state_movement: yes
    replacement_depends_on_future_replication_work: no

  translator_node_loss:
    degraded_capabilities:
      - external_ingress_normalization
      - routed_dispatch_from_external_surfaces
    hard_stop_capabilities: []
    expected_escalation_behavior: "Operator may continue direct console use while translator service is replaced."
    replacement_possible_without_state_movement: yes
    replacement_depends_on_future_replication_work: no

replacement_takeover_policy:
  simultaneous_instance_policy:
    operator_console: multiple_simultaneous_instances_allowed
    execution_host: singleton_by_default_today
    translator_node: multiple_simultaneous_instances_allowed
    verification_node: multiple_simultaneous_instances_allowed
    storage_evidence_node: singleton_by_default_today
    watcher_node: multiple_simultaneous_instances_allowed
