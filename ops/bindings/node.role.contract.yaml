# Node Role Contract
# Governs the physical-node / machine-role taxonomy, authority, state access,
# failure expectations, replacement posture, and external observation model.
# Device-agnostic only. No deployment or machine assignment is activated here.
#
# Vocabulary note (2026-04-16):
# The translator doctrine (TRANSLATOR_AUTHORITY_DOCTRINE_V1.md) describes a
# 7-node model. This binding defines 6 types. The difference is control_node:
#   - The doctrine names control_node as a future decomposition of the broker,
#     routing, loop-state, and attestation-authority functions.
#   - Today those functions are carried by operator_console as the admitting
#     client surface (the only surface with interactive_session_attach +
#     git_mutation + routing_dispatch).
#   - control_node is not in this binding because it has never been promoted
#     past taxonomy. No workload, no candidate host, no runtime materialization.
#   - When control_node is promoted, it will appear here with its own authority
#     row and separation posture. Until then, operator_console carries the load.
#   - This does NOT mean the operator workstation is the unattended substrate.
#     Autonomous execution belongs to execution_host; operator_console is the
#     client surface that admits and observes work.
# See also: NODE_PROMOTION_LADDER.md (L1 MVP kit = these 6 types).

runtime_substrate_boundary:
  status: vocabulary_only
  purpose: >
    Names the runtime substrate boundary so placement and admission readbacks do
    not infer node roles from observed Docker, VM, LXC, or host process facts.
    This is not a new authority surface and does not add a placement classifier.
  terms:
    hypervisor_host: "Bare-metal virtualization/control host. Not a generic Docker or compose host."
    guest_runtime: "VM, LXC, or appliance OS where declared workloads, systemd units, or compose stacks run."
    container_runtime: "Docker/container process layer inside a declared guest runtime."
    host_runtime: "Host OS runtime for the node role assigned to that host."
  constraints:
    - discovery_can_inform_evidence_not_placement_or_role_authority
    - host_runtime_is_not_guest_runtime
    - hypervisor_host_is_not_generic_docker_host
    - container_presence_does_not_assign_node_role
  canonical_readbacks:
    node_admission: node.admission.status
    site_presence: site.presence.status
    custody: payload.custody.status
    backup: backup.estate.readback.status

node_types:
  operator_console:
    description: "Interactive admitting client for governed operator sessions, manual override, and direct control-plane git/capability work. It is not the unattended execution substrate."
    multiple_instances_allowed: true
    colocation_allowed: true
    promotion_standard:
      current_delivered_host: macbook-2016-pro
      statement: >
        operator_console is the active admitting client for governed terminal
        sessions. macbook-2016-pro carries this role today via
        root.authority.contract.yaml's Darwin install-default paths.
        multiple_instances_allowed: true means additional operator_console
        surfaces may be admitted; current_delivered_host names today's
        primary surface without forbidding others. operator_console does not
        require a multi-proof receipt ladder like storage_evidence_node or
        forge_node — the proof is bound terminal identity admitted via
        ops terminal launch, governed by role.runtime.control.contract.yaml.
      proofs_present:
        macbook-2016-pro:
          - terminal_launch_admission_proof
    physical_separation_posture:
      execution_host: preferred
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: required

  execution_host:
    description: "Always-on autonomous execution substrate for launchd scheduling, workers, control cycles, and headless capabilities. It carries unattended runtime so operator_console does not."
    multiple_instances_allowed: false
    colocation_allowed: true
    repo_posture: deploy_target_only
    repo_posture_note: "Code reaches execution_host only via governed promotion (reviewed commit, explicit push). The repo clone is a deploy target, not a working checkout. Ad hoc edits, worktrees, and repo-local runtime state are prohibited."
    realized_by:
      - contract: ops/bindings/mailroom.task.worker.contract.yaml
        surface: execution.pickup.status
        boundary: "Worker claim/heartbeat/result/receipt proves execution custody only; node role assignment remains here."
    promotion_standard:
      current_delivered_host: ai-consolidation
      statement: >
        Active runtime labels are observation. A host is delivered as
        execution_host only when runtime placement, path resolution, and recovery
        drill proof are all present.
      required_proofs:
        runtime_placement_proof:
          source: ops/bindings/launchd.scheduler.registry.yaml
          requirement: "At least one active execution_host runtime label points at the host with runtime_transfer_proof."
        path_resolution_proof:
          source:
            - ops/bindings/runtime.bootstrap.contract.yaml
            - ops/bindings/launchd.scheduler.registry.yaml
            - /etc/spine/execution-host.env
          requirement: "Linux execution_host resolves runtime roots from /etc/spine/execution-host.env before darwin/operator-console defaults."
          proof_ref: "CAP-20260501-225322__loops.status__Rgdz3738015 proved plain remote bin/ops cap run on ai-consolidation using /home/ubuntu/code paths."
        recovery_drill_proof:
          source: ops/bindings/disaster.drill.execution_pickup.contract.yaml
          requirement: "Fresh recovery_drill receipt for the host with all execution pickup fixtures passing."
          proof_ref: "$SPINE_STATE/domain-state/recovery-drills/execution-pickup/latest.yaml"
      candidate_gaps:
        ai-consolidation: []
        pve-r620:
          - runtime_placement_proof
          - path_resolution_proof
          - recovery_drill_proof
          - role_boundary_conflict_currently_watcher_node
      deferred_candidates:
        pve:
          deferred_until: "storage_evidence_node delivered on pve and a separate execution_host promotion is initiated"
          reason: >
            pve is the active candidate for storage_evidence_node. Storage and
            execution are different jobs; bundling them on the same host
            without independent proof would conflate roles. execution_host
            candidacy on pve is deferred until storage_evidence_node delivery
            is complete and a separate explicit promotion sequence runs.
          drift_subtractions:
            - "pve-730xd as candidate identity (not canonical; pve is the canonical machine ID per ssh.targets, hardware.inventory, fleet.admission, node.admission.status)"
    physical_separation_posture:
      operator_console: preferred
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: required

  translator_node:
    description: "Membrane compatibility node role for ingestion, classification, normalization, and routing only."
    multiple_instances_allowed: true
    colocation_allowed: true
    physical_separation_posture:
      operator_console: permitted_no_preference
      execution_host: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: permitted_no_preference
      watcher_node: permitted_no_preference

  verification_node:
    description: "Read-heavy verification and attestation surface for verify runs and gate evaluation."
