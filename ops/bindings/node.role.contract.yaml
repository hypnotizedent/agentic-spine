                      Building this requires: a bounded-scope access
                      token OR a deploy-key tied to spine-agent's user
                      record. With (c) in place, an agent PR by
                      operator's identity can be approved by
                      spine-agent (or vice versa) and
                      required_approvals=1 stops being a brick.
                With (b)+(c) landed and verified, tighten can apply
                required_approvals=1 and require_signed_commits=true
                without bricking direct-push or PR flow. Tightening
                without (b) violates "no fake signed commits without
                a real signing path"; tightening without (c) violates
                "no tightening approvals if it bricks the direct-push
                agent workflow without replacement".
              acceptance_does_not_override_substrate: |
                Acceptance closes the agent_boundary proof lane for
                Stage 2 enforcement counting purposes. It does NOT
                change live substrate. Live substrate (post-1135):
                status_check IS enforced (require spine-verify);
                required_approvals=0 and signed_commits=false remain.
                Substrate truth is preserved in the receipt
                enforcement_gaps line; the contract amendment only
                records what gaps are operator-acknowledged and
                out-of-aperture-for-now, not that the gaps have
                disappeared. Per the brief stop line "no claim of
                golden unless residuals are removed, not just renamed":
                this slice MOVES the residual (status_check landed) but
                does NOT claim golden. Two enforcement axes remain
                open + agent-auth scaffolding remains missing.
        runner_cache_boundary_proof:
          source:
            - ops/plugins/infra/host/bin/forge-runner-cache-boundary-status
            - ops/plugins/infra/host/bin/forge-runner-docker-sock-fence
            - ops/bindings/node.role.contract.yaml
          requirement: |
            Two-stage proof. Stage 1 (read-only enumeration + cache-scope
            classification): runner registration metadata enumerated with
            scope (per_repo / per_owner_global / instance_global) — token_hash
            and token_salt EXPLICITLY excluded; runner data dir stat-only
            because /data/.runner contains a registration token; cache
            directory layout enumerated (file/dir names + sizes only — no
            content reads) for /root/.cache/act and /root/.cache/actcache;
            volume mounts inspected (docker.sock visibility is load-bearing);
            docker-socket-proxy fence state probed (PACKET-1075 — proxy
            container presence + runner DOCKER_HOST env + classification of
            unfenced / api_surface_fenced / partial_or_broken / no_docker_path);
            action_run history counted. Cache scope classified as
            isolated_per_job / shared_per_runner / unbounded with named gaps;
            boundary character separately classified as structural /
            api_surface_fenced / shared_persistent.
            Stage 2 (mutating clean-room job demonstration, FUTURE): two
            synthetic jobs are spawned and proven to leak no artifact between
            them; runner caches and ephemeral runner state are demonstrated
            to NOT cross job/branch/repo boundaries. Stage 1 is the current
            proof_ref artifact. Stage 2 advances when clean-room
            demonstration produces a passing receipt.
          proof_ref: "$SPINE_STATE/domain-state/forge-node/runner-cache-boundary-proof-latest.yaml"
          staged_delivery:
            stage_1_enumeration: present_when_proof_ref_artifact_exists
            stage_2_clean_room_demo: isolated_per_job_partial_remaining_docker_sock_fence
            stage_2_clean_room_demo_proof_ref: "$SPINE_STATE/domain-state/forge-node/runner-cache-boundary-demo-latest.yaml"
            stage_2_clean_room_demo_packet: PACKET-660-FORGE-RUNNER-CACHE-STAGE-2-DEMO
            stage_2_clean_room_demo_scope_note: >
              Stage 2 phase 0 metadata-only demo (PACKET-660, 2026-05-03)
              proved boundary leaky: cache entries on /root/.cache/act and
              /root/.cache/actcache had mtimes older than the most recent
              action_run start and the cache directory was mounted into every
              runner job's filesystem, therefore any subsequent job read
              pre-existing cache state. No clean room.

              PACKET-965 (2026-05-04, commits 0bb7ca90 + e875b372 + b11c858c +
              784e3810) built and applied forge.runner.config_set: the smallest
              L2 host-orchestration cap in spine. --apply set
              CONFIG_FILE=/data/config.yaml on the gitea-runner service in
              /opt/stacks/gitea/docker-compose.yml and recreated the container;
              act_runner now runs as `act_runner daemon --config /data/
              config.yaml` and reads cache.enabled=false, so the actcache
              server no longer starts (/root/.cache/actcache directory removed)
              and the persistent layer cache /root/.cache/act was cleared by
              container recreate. forge.runner_cache_boundary.status now
              classifies isolated_per_job (structural). Gaps 2 (persistent
              /root/.cache/act) and 3 (actcache bolt.db) closed.

              PACKET-1015 (2026-05-04, commits 05e68fdc + c0d9edc2 + aec3744f)
              built and applied forge.runner.reregister: rotated the runner
              registration token via the Gitea repo-scoped admin API, removed
              /data/.runner, and restarted the gitea-runner service. Live
              registration is now id=3 dev-tools-runner scope=per_repo
              (repo_id=1 ronny/agentic-spine). Stale registrations
              (id=1 + id=2) carry Gitea action_runner.deleted timestamps and
              are filtered out of the canonical readback by aec3744f
              (`WHERE deleted IS NULL`). Gap 1 (owner-global runner
              registration) closed end-to-end.

              One named residual remains and forge_node delivered:false stays
              while it is unaddressed: gap 4 (docker.sock mount fence — the
              gitea-runner container has /var/run/docker.sock bind-mounted
              into the runner image, so a malicious or buggy CI job can talk
              directly to the host Docker daemon and read/write any
              container, mount any host path, and inspect or kill sibling
              services on dev-tools VM 206).

              PACKET-1075 (2026-05-04) built forge.runner.docker_sock_fence
              as the smallest governed mutation path: a tecnativa/docker-
              socket-proxy:0.3.0 sidecar with a source-traced Docker API
              allowlist (gitea/act@v0.261.7 pkg/container/* call-site
              enumeration; act_runner v0.2.13 envcheck/daemon/runner.go).
              REQUIRED endpoints exposed: PING VERSION INFO CONTAINERS
              IMAGES NETWORKS VOLUMES EXEC POST ALLOW_START. DENIED:
              AUTH COMMIT CONFIGS DISTRIBUTION EVENTS NODES PLUGINS SECRETS
              SERVICES SESSION SWARM SYSTEM TASKS BUILD ALLOW_STOP
              ALLOW_RESTARTS (BUILD flippable via --enable-build for
              Dockerfile-based actions). Cap mutates only the gitea-runner
              service (drop docker.sock bind, set DOCKER_HOST, add
              depends_on) and adds the docker-socket-proxy service to
              /opt/stacks/gitea/docker-compose.yml; sibling-container
              job-spawning topology stays.

              The fence reduces API method count exposed to act_runner from
              the full Docker API to the source-evidenced act_runner-only
              subset. It is NOT a payload firewall. HostConfig escape
              remains: a malicious job can send ContainerCreate with
              Privileged: true, Binds: ['/:/host'], CapAdd, Pid: host, etc.
              and break out — proxy is per-endpoint, not per-payload.
              Sibling-container blast radius (DELETE/EXEC against any
              container by id), image-pull from any reachable registry, and
              CopyFromContainer reads of any container filesystem also
              remain by allowlist design.

              PACKET-1075 APPLIED 2026-05-04 with operator reason "PACKET-
              1075 apply: fence runner docker socket with researched
              allowlist". Substrate now reports
              cache_scope_classification = isolated_per_job
              (api_surface_fenced); docker.sock fence:
              proxy_running=True runner_DOCKER_HOST=tcp://docker-socket-
              proxy:2375 classification=api_surface_fenced. Apply ladder
              required a hardening on the cap's restart step: gitea/
              act_runner declares VOLUME /var/run/docker.sock; compose
              up -d (even with --force-recreate) silently preserved the
              previous container's docker.sock bind even after the spec
              dropped it. Only `docker rm -f gitea-runner; docker
              compose up -d` produced a clean container. The cap apply
              path now does this by default. The boundary readback was
              also tightened: pre-fix, both host-bind AND anonymous-
              volume at the same destination triggered docker_sock_
              mounted=True, which made post-fence look broken; post-fix,
              docker_sock_host_bind discriminates Type==bind+Source==/var/
              run/docker.sock vs anonymous-volume-with-coincidental-
              destination, and the latter no longer counts as host
              visibility.

              Stage 2 trajectory (apply leg COMPLETE; HostConfig
              residual ACCEPTED 2026-05-04 — see accepted_residuals
              below):
                - api_surface_fenced (current substrate post-apply):
                  stage_2_blocked_until = none (this lane resolved)
              The runner_cache_boundary lane is closed for this
              aperture: api surface is fenced via researched proxy
              allowlist; HostConfig escape is operator-accepted with
              the future-hardening path explicitly named (gVisor/
              Kata, userns-remapping, payload-inspecting proxy) and
              left as a separate L2 build slice with no live intent.

              forge_node.promotion_standard.delivered REMAINS false
              not because of this lane but because OTHER required
              Stage 2 proofs are still open (agent_boundary_proof
              Stage 2 — branch_protection_readback shows
              signed_commits=false required_approvals=0
              status_check=false; backup_restore_proof Stage 2
              restore drill is FUTURE). Closing those is a separate
              lane; honest delivered=false is maintained until they
              also resolve (delivered or accepted).
            stage_2_blocked_until: none_runner_cache_lane_resolved_other_proofs_block_overall_delivery
          accepted_residuals:
            hostconfig_escape:
              accepted: true
              accepted_at: 2026-05-04
              accepted_by: operator
              aperture: PACKET-1095 forge runner_cache_boundary
                closeout (terminal-prompt acceptance phrase)
              acceptance_phrase: |
                "Close forge as an honest accepted residual. The
                runner is repo-scoped, cache isolation is
                isolated_per_job, docker.sock is fenced at the
                API surface, leaked Gitea secrets have been
                rotated, and spine.verify is clean. The only
                remaining issue is the named HostConfig escape
                residual."
              residual_named_in: |
                $SPINE_STATE/domain-state/forge-node/runner-cache-boundary-proof-latest.yaml
                cache_scope_classification.enforcement_gaps[0]
                (HostConfig escape; sibling-container blast
                radius; image-pull from any reachable registry;
                CopyFromContainer reads of any container
                filesystem)
              future_hardening_path: |
                payload-inspecting proxy OR gVisor/Kata runtime
                isolation OR userns-remapping with no privileged
                ContainerCreate paths — architectural slices
                outside this cap's aperture; defer unless concrete
                intent emerges.
              acceptance_does_not_promote_delivered: |
                Acceptance closes the runner_cache_boundary lane
                but does NOT flip forge_node.promotion_standard
                .delivered to true on its own. Other required
                Stage 2 proofs (agent_boundary, backup_restore)
                are still open and must independently resolve
                (delivered OR accepted) before
                forge_node.delivered may flip via the governed
                contract path.
        branch_protection_readback_proof:
          source:
            - ops/plugins/infra/host/bin/forge-branch-protection-status
            - ops/bindings/node.role.contract.yaml
          requirement: "Branch protection rules on origin/main are readable through governed cap and match a declared baseline (required reviews, force-push prohibition, status-check requirement). NO mutation to existing rules in this proof — read-only verification only."
          proof_ref: "$SPINE_STATE/domain-state/forge-node/branch-protection-readback-proof-latest.yaml"
      proofs_present:
        dev-tools:
          - forge_status_proof
          - branch_protection_readback_proof
          - backup_restore_proof
          - agent_boundary_proof
          - runner_cache_boundary_proof
      candidate_gaps:
        dev-tools: []
    physical_separation_posture:
      operator_console: permitted_no_preference
      execution_host: preferred
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: preferred
      watcher_node: required

  watcher_node:
    description: "External liveness observer for heartbeats and escalation; it must outlive any single watched node failure."
    multiple_instances_allowed: true
    colocation_allowed: true
    physical_separation_posture:
      operator_console: required
      execution_host: required
      translator_node: permitted_no_preference
      verification_node: permitted_no_preference
      storage_evidence_node: required

