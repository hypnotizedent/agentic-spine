contract: MEDIA_PATH_AUTHORITY_CONTRACT_V2
version: "2.0"
status: active
created: "2026-03-03"
updated_at: "2026-03-17"
owner: "@ronny"
authority_loop: LOOP-MEDIA-RUNTIME-REPAIR-20260303

description: |
  Canonical path authority matrix for the unified home media runtime.
  Active day-to-day truth is media-home (VM 106). The old shop split media VMs
  remain rollback-only and are no longer presented as canonical runtime truth.

runtime:
  canonical_vm: media-home
  canonical_runtime_url_base: "http://10.0.0.106"
  local_state_root: "/srv/appdata/opt-appdata"
  compose_roots:
    - "/srv/appdata/compose/media-stack"

nfs_mount_topology:
  media-home:
    host_path: "/srv/media"
    nfs_source: "10.0.0.150:/volume1/media-staging"
    mode: rw
    nfs_version: "4.2"
    verified_at: "2026-03-17"
    verification_method: "ssh ubuntu@10.0.0.106 + findmnt + docker inspect + local API probes"
    description: "Canonical rw media payload mount on media-home."

downloads_complete_hygiene:
  vm: media-home
  root: /srv/media/downloads/complete
  allowed_top_level:
    - movies
    - tv
    - music
  ignored_names:
    - .DS_Store
    - "@eaDir"
  verification_status: verified
  verified_at: "2026-03-17"
  evidence: |
    2026-03-17 runtime normalization on the Synology-backed live share moved the
    remaining legacy loose roots under /downloads/complete into the governed
    class lanes. Top-level complete-download residue is now zero.

path_tuples:
  radarr:
    vm: media-home
    container: radarr
    compose_mount: "/srv/media/movies -> /movies, /srv/media -> /media, /srv/media/downloads -> /downloads"
    app_root: "/movies"
    downloader_path: []
    library_path: "/movies"
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: |
      2026-03-17 runtime API query on media-home:
      - GET /api/v3/rootfolder: [{path: "/movies", accessible: true}]
      - GET /api/v3/remotepathmapping: []
      - docker inspect confirms /srv/media/movies -> /movies and /srv/media/downloads -> /downloads
    path_parity_status: "CONSISTENT"

  sonarr:
    vm: media-home
    container: sonarr
    compose_mount: "/srv/media/tv -> /tv, /srv/media -> /media, /srv/media/downloads -> /downloads"
    app_root: "/tv"
    downloader_path: []
    library_path: "/tv"
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: |
      2026-03-17 runtime API query on media-home:
      - GET /api/v3/rootfolder: [{path: "/tv", accessible: true}]
      - GET /api/v3/remotepathmapping: []
      - docker inspect confirms /srv/media/tv -> /tv and /srv/media/downloads -> /downloads
    path_parity_status: "CONSISTENT"

  sabnzbd:
    vm: media-home
    container: sabnzbd
    compose_mount: "/srv/media/downloads -> /downloads"
    app_root: null
    downloader_path: "/downloads"
    library_path: null
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: "2026-03-17 docker inspect confirms /srv/media/downloads -> /downloads."
    path_parity_status: "CONSISTENT"

  qbittorrent:
    vm: media-home
    container: qbittorrent
    compose_mount: "/srv/media/downloads -> /downloads"
    app_root: null
    downloader_path: "/downloads"
    library_path: null
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: "2026-03-17 docker inspect confirms /srv/media/downloads -> /downloads."
    path_parity_status: "CONSISTENT"

  jellyfin:
    vm: media-home
    container: jellyfin
    compose_mount: "/srv/media -> /media (ro)"
    app_root: null
    downloader_path: null
    library_path: "/media/movies,/media/tv"
    excluded_library_paths:
      - "/media/movies-archive"
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: |
      2026-03-17 runtime verification on media-home:
      - docker inspect confirms /srv/media -> /media (ro)
      - GET /Library/VirtualFolders returns /media/movies and /media/tv only
      - /media/movies-archive is no longer part of the live library set
    path_parity_status: "CONSISTENT"

  navidrome:
    vm: media-home
    container: navidrome
    compose_mount: "/srv/media/music -> /music (ro)"
    app_root: null
    downloader_path: null
    library_path: "/music"
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: "2026-03-17 docker inspect confirms /srv/media/music -> /music."
    path_parity_status: "CONSISTENT"

  bazarr:
    vm: media-home
    container: bazarr
    compose_mount: "/srv/media -> /media (ro)"
    app_root: null
    downloader_path: null
    library_path: "/media/movies,/media/tv"
    verification_status: verified
    verified_at: "2026-03-17"
    evidence: "2026-03-17 docker inspect confirms /srv/media -> /media (ro)."
    path_parity_status: "CONSISTENT"

pending_services:
  - service: tdarr
    status: parked
    note: "Retained helper lane, not active in canonical runtime."

drift_gate: media.path.authority.verify
verification_command: "media.path.authority.verify"
verification_description: |
  Live capability that SSHes to media-home, inspects service containers, and
  compares actual mount/path tuples against this contract.

promotion_lifecycle:
  current: active_with_runtime_gate
  promotion_path:
    - from: active_with_runtime_gate
      to: enforced
      requires: "verify.pack media lane fails on any canonical home path-authority mismatch"
  blocked_by:
    - "Retained helper services are not all active or explicitly parked on media-home."

