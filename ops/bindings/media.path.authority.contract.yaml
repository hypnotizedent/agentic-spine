# Evidence: media-container-path-trace-2026-02-25.md (32 containers, 27 healthy, 5 findings)
# Runtime verification: 2026-03-04 SSH probe via Tailscale (download-stack + streaming-stack)
# 2026-03-20 alignment note: the tuples below remain valuable for residual shop
# writer/archive surfaces, but the canonical active media plane is now home
# (`media-home` VM 106 consuming Synology `/volume1/media-staging/*`).

contract: MEDIA_PATH_AUTHORITY_CONTRACT_V1
version: "1.4"
status: active
created: "2026-03-03"
updated_at: "2026-03-21"
owner: "@ronny"
authority_loop: LOOP-MEDIA-RUNTIME-REPAIR-20260303
original_skeleton_loop: LOOP-MEDIA-SHOP-HOME-MIGRATION-CONNECTOR-20260303

description: |
  Canonical path authority matrix for the media pipeline.
  Every service that touches media files must have an explicit 4-way parity
  tuple: compose_mount, app_root, downloader_path, library_path.
  Drift between any two members of a tuple is a contract violation.

  Populated from Feb 25 container path trace audit (docker inspect + write tests)
  and gap trace evidence. TBD fields resolved on 2026-03-04 via SSH runtime API
  queries to download-stack (VM 209) and streaming-stack (VM 210) over Tailscale.

current_operating_model:
  canonical_active_plane:
    host: media-home
    vm_id: 106
    library_root: "/srv/media"
    backing_store: "10.0.0.150:/volume1/media-staging"
    note: "This is the live watch/download plane. The active library path is the Synology staging tree."
  canonical_writer_plane:
    target_host: media-home
    target_vm_id: 106
    status: planned
    note: "ARR writer services (Radarr/Sonarr/Lidarr/Prowlarr) planned for media-home. Currently operational on download-stack but will migrate to media-home for home-first writer promotion."
  canonical_archive_plane:
    host: pve
    archive_root: "/md1400/archive/media*"
    note: "Archive remains shop-owned and is not the default playback surface."
  transitional_shop_residue:
    - download-stack
    - streaming-stack
  interpretation_rule: |
    Treat the shop-hosted tuples below as transitional operational truth. The canonical
    writer plane target is media-home, but services remain on download-stack until cutover.
    Do not mistake historical shop placement for the canonical target model.

# NFS mount topology (runtime verified 2026-03-04, classification updated 2026-03-21)
nfs_mount_topology:
  download-stack:
    host_path: "/mnt/media"
    nfs_source: "192.168.1.184:/media"
    mode: rw
    nfs_version: "4.2"
    verified_at: "2026-03-04"
    verification_method: "mount | grep nfs via SSH ubuntu@100.107.36.76"
    description: "NFS mount on VM 209 for ARR import/download — read-write for import operations"
    classification: "legacy_residue"
    residue_note: "Readable during migration for compatibility. NOT active truth. Canonical active plane is media-home VM 106. This mount remains until shop-to-home migration completes."
  streaming-stack:
    host_path: "/mnt/media"
    nfs_source: "192.168.1.184:/media"
    mode: ro
    nfs_version: "4.2"
    verified_at: "2026-03-04"
    verification_method: "mount | grep nfs via SSH ubuntu@100.123.207.64"
    description: "NFS mount on VM 210 for Jellyfin/Navidrome playback — read-only for streaming"
    classification: "legacy_residue"
    residue_note: "Readable during migration for compatibility. NOT active truth. Canonical active plane is media-home VM 106. This mount remains until shop-to-home migration completes."
  docker_volumes:
    download-stack:
      host_path: "/mnt/docker"
      nfs_source: "192.168.1.184:/tank/docker/download-stack"
      mode: rw
    streaming-stack:
      host_path: "/mnt/docker"
      nfs_source: "192.168.1.184:/tank/docker/streaming-stack"
      mode: rw

# Path parity tuples — each service's file access paths must be internally consistent
# Historical shop tuples verified 2026-03-04 via runtime API queries + docker inspect
# Planned home tuples documented 2026-03-21 for home-first writer promotion
path_tuples:
  radarr:
    planned_vm: media-home
    planned_status: not_yet_deployed
    planned_canonical_mount: "/srv/media -> /media"
    planned_app_root: "/media/movies"
    planned_library_path: "/media/movies"
    planned_note: "Target configuration for home-first writer promotion. Will replace transitional shop placement."
    transitional_shop_vm: download-stack
    transitional_shop_status: operational
    compose_mount: "/mnt/media/movies -> /movies, /mnt/media -> /media"
    app_root: "/movies"
    app_root_id: 1
    app_root_archive: "/media/movies-archive"
    app_root_archive_id: 2
    downloader_path:
      - host: "100.125.138.110"
        remote: "/downloads/complete/"
        local: "/downloads/complete/"
        id: 1
      - host: "100.125.138.110"
        remote: "/mnt/staging/downloads/complete/"
        local: "/downloads/complete/"
        id: 2
    library_path: "/movies"
    verification_status: verified
    verified_at: "2026-03-04"
    gap_ref: GAP-OP-1387
    evidence: |
      2026-03-04 runtime API query via SSH:
      - GET /api/v3/rootfolder: returns [{path: "/movies", accessible: true, freeSpace: 1388385927168, id: 1}, {path: "/media/movies-archive", accessible: true, id: 2}]
      - GET /api/v3/remotepathmapping: returns 2 entries for host 100.125.138.110
      - docker inspect: /mnt/media/movies -> /movies, /mnt/media -> /media, /mnt/media/downloads -> /downloads
      - FINDING: app_root IS /movies (matches compose mount). The Feb 25 hypothesis was wrong —
        there is NO mismatch. /movies IS a dedicated bind mount for /mnt/media/movies. The /media mount
        is a separate broader mount. Both paths are accessible and consistent.
      - 34 unmapped folders found in /movies root (failed/unpack artifacts + mismatched names)
    runtime_fix_required: false
    path_parity_status: "CONSISTENT — /movies bind mount maps to /mnt/media/movies on host"
    transition_note: "Operational on download-stack until home writer cutover. Planned paths reflect media-home target."

  sonarr:
