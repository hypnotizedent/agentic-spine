---
schema_version: "1.0"
status: authoritative
owner: "@human-steward"
updated_at: "2026-03-24"
scope: actor-boundary-protocol
decision_loop_id: LOOP-SPINE-PRODUCTIZATION-20260324

description: >
  Governs the Human steward -> Membrane -> Controller actor boundary pathway.
  Defines role direction, handoff message types, and routing rules that
  prevent actor confusion and doc sprawl in autonomous execution.

contract: actor.boundary
version: "1.0"

# ── Pathway Overview ────────────────────────────────────────────────
#
#  Human steward ──(directive)──▶ Membrane ──(normalized_request)──▶ Controller
#     ▲                          │                                     │
#     │                          │                                     │
#     └──(status_rendering)──────┘◀────(execution_receipt)─────────────┘
#
# ── Actor Vocabulary ─────────────────────────────────────────────────
#
# These four terms collapse the overloaded "operator" word into distinct
# concepts.  Every governed surface should use the specific term, never
# bare "operator" when the sentence is about authority or identity.
#
#   human_operator   — Compatibility machine term for the human steward in
#                      this work culture.  Provides guidance, priorities,
#                      approvals, and dispositions.  No AI session may act as
#                      or become the human_operator.
#
#   agent_actor      — Any AI session, terminal, daemon, or autonomous
#                      process acting under an explicit role (membrane,
#                      controller, worker, verifier) and custody rules.
#                      Agent actors execute; they do not originate authority.
#
#   operator_console — A node/client surface used by the human_operator
#                      for inspection, approval, and conversation.  It is
#                      a surface role, not the human.
#
#   operator_ingress — Compatibility path term for human-originated input
#                      reaching the spine.  Not an agent mailbox.  Readback
#                      labels should prefer "Human input" or "Human steward"
#                      where possible.
#
# Governing rule: text that implies an AI session can "act as operator"
# is a vocabulary bug and must be fixed.
#
# Direction rule: every conversational surface must preserve who is speaking
# to whom.  Human steward to agent, agent to human steward, agent to agent, and
# outside person to human steward are different dialogue contexts.  Do not
# collapse them into generic "operator" language.

compatibility_vocabulary:
  operator_console:
    status: compatibility_machine_id
    meaning: "Node/client surface used by the human steward to admit and observe work."
    long_term_target: "Keep only where it names the existing machine/client surface."
  operator_ingress:
    status: compatibility_machine_id
    meaning: "Human-originated input path into the membrane."
    long_term_target: "Rename only after active OI paths have a safe migration."
  human_operator:
    status: compatibility_actor_class
    meaning: "Machine-readable actor class for the human steward."
    long_term_target: "Prefer human_steward in prose; keep human_operator where schemas already depend on it."
  translator:
    status: deprecated_conceptual_term
    meaning: "Legacy name for the membrane function."
    use_instead: membrane
  translator_node:
    status: deprecated_or_compatibility_node_role
    meaning: "Legacy planned node-role name for a membrane runtime."
    current_truth: "membrane_function exists; membrane_node is valid only if a real runtime service is materialized."
    use_instead: membrane_function

deferred_vocabulary_migration:
  status: tracked_deferred
  reason: "This slice is vocabulary-only and must not rename active capability IDs, node roles, or gate IDs."
  next_targets:
    - "Migrate operator_* names that describe human/steward semantics rather than true machine compatibility IDs."
    - "Migrate translator_node to membrane_node only if a real membrane runtime is materialized."
    - "Update capability descriptions so fresh terminals learn membrane vocabulary instead of translator vocabulary."
    - "Rename D422 and related gate registry IDs only in a dedicated gate-ID migration."

human_intent_object:
  status: first_class
  object_class: human_intent
  purpose: >
    Preserve what the human steward meant before the engine renames it into
    ingress, plan, packet, loop, receipt, or parked runtime material.
  canonical_carriers:
    - "$SPINE_STATE/inputs/operator-ingress/OI-*.yaml"
    - "$SPINE_STATE/plans/PLAN-*.md"
    - "$SPINE_STATE/controller-prompts/MAILROOM-CONTROLLER-PACKET-*.md"
    - "$SPINE_STATE/orchestration/LOOP-*/scope.md"
    - "ops/bindings/operator.blueprint.admission.yaml"
  required_fields:
    - intent_id
    - object_class
    - authority
    - statement
    - source_ref
    - status
  lifecycle_statuses:
    - captured
    - classified
    - routed
    - materializing
    - proved
    - shelved
    - retired
  invariants:
    - "The object records human_operator intent; it is not executable authority by itself."
    - "A downstream loop, packet, plan, or parked artifact must preserve a source_ref back to the human_intent object or raw source."
    - "A status of shelved or deferred must carry a trigger, review condition, or explicit retirement rule."
    - "A status of proved must name at least one live surface or receipt that did not exist before materialization."
  forbidden_collapses:
    - "Treating an ingress object as the intent itself."
    - "Treating a closed analysis loop as proof that the intent was materialized."
    - "Renaming human intent into a packet or loop without preserving source_ref."

pathway:
  nodes:
    - role: operator
      actor_class: human_operator  # Human steward, never an AI session
      contract: operator.boundary.contract.yaml  # archived (pre-2026-04-01); operator boundary defined inline below
      position: origin
      description: "Human steward. Guides priority, approves/disposes work, and receives rendered status. No AI session may hold this role."

    - role: membrane
      actor_class: agent_actor
      contract: membrane.authority.contract.yaml
      position: membrane
      description: >
        Classifies, normalises, and routes. Preserves context across sessions.
        Never executes, never attests, never claims success.

    - role: controller
      actor_class: agent_actor
      contract: controller.boundary.contract.yaml
      position: execution
      description: >
        Executes governed tasks, produces receipted evidence, evaluates gates.
        Never interprets intent, never sets priority.

  edges:
    - from: operator
      to: membrane
      message_types: [directive, feedback, approval]
      format: natural_language
      protocol: synchronous_conversation
      description: >
        Human steward provides unstructured intent. Membrane must classify
        before forwarding — raw human_operator text never reaches Controller.

    - from: membrane
      to: controller
      message_types: [normalized_request, governed_task_envelope]
      format: structured_yaml
      protocol: capability_dispatch
      description: >
        Membrane emits normalized requests or full governed envelopes.
        Controller receives only structured, scoped requests.

    - from: controller
      to: membrane
      message_types: [execution_receipt, response_envelope, friction_item, gap_filing]
      format: structured_yaml
      protocol: receipt_return
      description: >
        Controller returns receipted evidence. Membrane renders
        results into human-readable form for the human steward.

    - from: membrane
      to: operator
      message_types: [status_rendering, proposal, friction_alert]
      format: human_readable
      protocol: synchronous_conversation
      description: >
        Membrane converts receipts and envelopes into plain-language
        status. Human steward never sees raw YAML or gate output.

# ── Message Type Definitions ────────────────────────────────────────
message_types:
  directive:
    direction: operator_to_membrane
    format: natural_language
    fields:
      - intent              # what the human steward wants
      - constraints         # what must not happen
      - priority            # optional urgency signal
    example: >
      "Focus on the prompt library and actor boundary contracts.
       Do not apply sanitization fixes — only produce a script."

  normalized_request:
    direction: membrane_to_controller
    format: structured_yaml
    fields:
      - request_id          # unique identifier
      - classified_intent   # spine_concern | domain_concern
      - target_capability   # resolved capability name
      - scope_authorization # files/paths in scope
      - parameters          # capability-specific args
      - loop_context        # governing loop_id, phase, constraints
      - expected_artifact   # what output type is expected
    example: |
      request_id: REQ-20260324-001
      classified_intent: spine_concern
      target_capability: prompt.library.bootstrap
      scope_authorization:
        - ops/plugins/core/session/templates/
        - $SPINE_STATE/prompts/
      loop_context:
        loop_id: LOOP-SPINE-PRODUCTIZATION-20260324
        phase: 1
      expected_artifact: receipt

  execution_receipt:
    direction: controller_to_membrane
    format: structured_yaml
    fields:
      - receipt_id          # run key
      - request_id          # echo of the request
      - status              # done | failed | blocked
      - commit_sha          # if a commit was made
      - gates_run           # gate IDs evaluated
      - gates_passed        # gate IDs that passed
      - evidence_path       # path to full evidence
    example: |
      receipt_id: CAP-20260324-195643__prompt.library.bootstrap__Rg5tx65705
      request_id: REQ-20260324-001
      status: done
      gates_run: [D124]
      gates_passed: [D124]

  status_rendering:
    direction: membrane_to_operator
    format: human_readable
    fields:
      - summary             # one-line status
      - details             # optional expanded context
      - next_action         # what the Operator should do next
    example: >
      "Prompt Library bootstrapped — 4 templates seeded to .runtime/.
       Next: review templates and confirm acceptance criteria."

# ── Anti-Patterns ───────────────────────────────────────────────────
anti_patterns:
  - id: operator_direct_to_controller
    description: >
      Human operator must not directly instruct Controller terminals. This
      bypasses classification, context preservation, and creates
      floating WIP when the membrane loses track of state.
    symptom: "Human typing cap run commands directly in a controller terminal"
    remedy: "Route through the membrane. Use ops terminal launch for governed entry."

  - id: membrane_executing
    description: >
      Membrane must not execute capabilities, commit code, or run gates.
      It may only classify, normalise, and route.
    symptom: "Membrane-role terminal running mutating capabilities"
    remedy: "Check forbidden_actions in membrane.authority.contract.yaml"

  - id: controller_interpreting_intent
    description: >
      Controller must not interpret raw human_operator intent. If a request
      is ambiguous, it must be rejected back to the membrane.
    symptom: "Controller terminal making scope/priority decisions (these belong to the human operator)"
    remedy: "Return ambiguous request to membrane for re-classification"

  - id: unreceipted_work
    description: >
      Every execution must produce a receipt. Work without receipts
      is invisible to the governance system and creates drift.
    symptom: "git log shows commits without run keys or D-trailers"
    remedy: "All execution goes through capability dispatch"

# ── Relationship to Existing Contracts ──────────────────────────────
related_contracts:
  - contract: membrane.authority.contract.yaml
    relationship: "Membrane boundary — this protocol wraps its routing rules"
  - contract: governed.task.envelope.contract.yaml
    relationship: "Envelope schema — formal container for Membrane->Controller dispatch"
  - contract: dispatch.envelope.contract.yaml
    relationship: "Node-to-node dispatch coordination (added 2026-04-05) — formalizes Controller→Execution and multi-lane dispatch"
  - contract: prompt.library.contract.yaml
    relationship: "Template governance — standardises terminal context loading"
