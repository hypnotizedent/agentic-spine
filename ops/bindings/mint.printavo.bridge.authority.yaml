# Mint Printavo Bridge Authority
# Status: authoritative
# Last verified: 2026-03-13
# Scope: printavo-bridge-state-between-fresh-slate-and-legacy-truth

version: 1
updated_at: "2026-03-13"
owner: "@ronny"
status: authoritative
scope: printavo-bridge-state-between-fresh-slate-and-legacy-truth

purpose: >
  Define the boring governed Printavo bridge between fresh-slate seed/order
  work and existing Printavo truth so operators and agents can answer whether a
  quote still needs more information or already exists in Printavo.

canonical_path:
  - fresh-slate seed and/or canonical order context exists
  - persist immutable printavo_bridge record from manual operator update or legacy-first reconcile
  - project latest bridge summary into canonical order.printavo_summary when order truth exists
  - run mint.printavo.bridge.reconcile --audit to detect missing bridge/order/payment/vendor linkage before reopening external systems
  - read via mint.printavo.bridge.snapshot
  - surface customer-lane visibility via mint.customer.record.snapshot

canonical_answers:
  immutable_bridge_record: >
    The first-class governed record is an immutable printavo_bridge record under
    runtime/domain-state/mint/printavo-bridges/. It carries the linked seed_id,
    linked order_id when present, Printavo refs, provenance, and last
    reconciliation timestamp.
  mutable_fast_read_surface: >
    Canonical order.printavo_summary is the fast mutable projection when order
    truth exists. Seed-only work reads directly from the latest printavo_bridge
    record.
  manual_operator_update_surface: >
    Ronny's manual Printavo actions are captured through
    mint.printavo.bridge.capture with explicit evidence_refs/receipts, never
    through chat memory.
  legacy_first_backfill_rule: >
    Backfill prefers legacy-hold table/export truth first. Printavo extraction
    recovery only fills missing refs when legacy truth is incomplete.
  finance_read_surface: >
    Fin reads mint.printavo.bridge.snapshot for fast governed Printavo state and
    refs.
  customer_lane_read_surface: >
    Morpheus and other customer-lane agents consume the same truth through
    mint.customer.record.snapshot.printavo_visibility.

printavo_states:
  - needs_more_info_before_printavo
  - drafted_in_printavo
  - quote_live
  - approved
  - paid
  - converted_to_work_order

required_bridge_fields:
  - printavo_bridge_id
  - seed_id
  - order_id
  - quote_id
  - customer_id
  - customer_email
  - printavo_customer_id
  - printavo_invoice_url
  - printavo_public_invoice_url
  - printavo_work_order_url
  - printavo_visual_id
  - printavo_state
  - last_reconciled_at
  - provenance
  - source_kind
  - evidence_refs
  - receipts

forbidden_shortcuts:
  - chat memory as Printavo truth
  - legacy-hold as the only operational Printavo source
  - loose notes or prompts as the canonical Printavo state
  - guessing whether a quote exists in Printavo without reading bridge truth first
