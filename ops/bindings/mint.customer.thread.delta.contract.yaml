---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mint-customer-thread-delta-capture
version: 1

surface:
  capability: mint.customer.thread.delta.capture
  operator_terminal: MINT-MORPHEUS-01
  description: Canonical low-friction capture for real Mint customer-thread deltas during business work.

storage:
  records_root: "$SPINE_STATE/mint/customer-thread-deltas/records"
  index_file: "$SPINE_STATE/mint/customer-thread-deltas/index.ndjson"
  lock_file: "$SPINE_STATE/locks/mint-customer-thread-deltas.lock"

schema:
  required_fields:
    - delta_id
    - captured_at_utc
    - captured_by
    - thread_customer_identifier
    - customer_ask_summary
    - morpheus_produced
    - ronny_actual_action
    - ronny_disliked
    - classification
    - classification_label
    - severity
    - confidence
    - next_recommended_hardening_action
  severity_scale:
    - low
    - medium
    - high
    - critical
  confidence_scale:
    - low
    - medium
    - high

classification_model:
  operator_inputs:
    - template
    - form
    - capability
  canonical_values:
    - id: template_gap
      operator_input: template
      label: template gap
    - id: form_gap
      operator_input: form
      label: form gap
    - id: capability_gap
      operator_input: capability
      label: capability gap

notes:
  - Persist each capture as an immutable record plus append a normalized NDJSON row for later prioritization/reporting.
  - Keep live operator friction low: one command, short required fields, optional evidence refs.
