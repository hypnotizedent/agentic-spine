authority:
  canonical_runtime_profile: ops/bindings/tenant.profile.yaml
  canonical_boot_surface: ops/bindings/entry.boot.surface.contract.yaml
  runtime_role_control: ops/bindings/role.runtime.control.contract.yaml
  runtime_storage_policy: ops/bindings/state.storage.policy.yaml
  portability_assumptions: docs/governance/PORTABILITY_ASSUMPTIONS.md
  path_inventory_baseline: ops/bindings/runtime.path.inventory.baseline.yaml

canonical_entrypoints:
  bootstrap:
    capability: spine.init
    command: ./bin/ops cap run spine.init
    mode: mutating
  diagnostics:
    capability: spine.doctor
    command: ./bin/ops cap run spine.doctor
    mode: read-only

path_roots:
  linux_execution_host:
    source: /etc/spine/execution-host.env
    required_when: "host_os == linux and node role is execution_host"
    precedence: before_root_authority_darwin_defaults
    must_define:
      - SPINE_REPO
      - SPINE_CODE
      - SPINE_WORKSPACE_ROOT
      - SPINE_RUNTIME_ROOT
      - SPINE_STATE
      - SPINE_EVIDENCE_ROOT
    note: >
      Linux execution hosts are portable runtime carriers. They must not inherit
      the operator-console /Users/ronnyworks defaults from root.authority.contract.yaml.
      The root authority paths remain Darwin install defaults, not Linux runtime
      truth.
  spine_root:
    source: tenant.profile.runtime.spine_root
    required: true
    must_be_absolute: true
    must_contain:
      - bin/ops
      - ops/bindings/gate.registry.yaml
      # shared_authority.db lives at $SPINE_STATE/shared_authority.db (externalized)
      # NOT in the repo root. See mailroom.runtime.contract.yaml.
  workbench_root:
    source: tenant.profile.runtime.workbench_root
    required: false
    must_be_absolute: true
  code_root:
    derived_from: dirname(spine_root)
    required: true
    expected_suffix: /code
  runtime_root:
    source: spine.boundary.baseline.runtime_root
    required: true
  home_root:
    source: "$HOME"
    required: true

bootstrap_preconditions:
  required_runtime_tools:
    - bash
    - git
    - jq
    - yq
    - python3
    - rg
  required_contracts:
    - ops/bindings/tenant.profile.yaml
    - ops/bindings/tenant.profile.schema.yaml
    - ops/bindings/entry.boot.surface.contract.yaml
    - ops/bindings/role.runtime.control.contract.yaml
    - ops/bindings/gate.registry.yaml
    - ops/bindings/state.storage.policy.yaml
  required_runtime_state:
    - $SPINE_STATE/shared_authority.db
    - $SPINE_STATE/plans/index.yaml
  block_if_missing:
    - aof_contract_ack
    - runtime_role_override_for_mutating_capabilities

# Phase D.3a: DB authority routing declaration. Routing code in
# ops/commands/cap.sh reads `enabled` first; when false, the routing path is
# inert and all caps run locally (legacy behavior). When the operator flips
# enabled to true (Phase D.3b cutover), mutating capabilities invoked from
# non-authority hosts route via SSH to the canonical authority host so writes
# happen on the canonical shared_authority.db. Read-only caps stay local.
#
# This block is the single canonical declaration of where the DB authority
# lives and how to reach it. Env vars (SPINE_DB_AUTHORITY_*) override per-call
# but the contract is the source of truth for the cutover state.
db_authority:
  enabled: true
  enabled_history:
    - state: false
      effective_at_utc: "2026-05-02T19:00:00Z"
      reason: "D.3a inert code landing — routing path implemented but disabled by contract until D.3b cutover approval"
    - state: true
      effective_at_utc: "2026-05-02T21:14:00Z"
      reason: "D.3b v3 cutover under PACKET-580 ceremony with PACKET-581 path-resolution-proof preflight (sha256 verified canonical DB at /md1400/spine/state/shared_authority.db, 529 loops, hash 05c76c7e36c94b7142ac22f2264475fd7edd8c510380b2742394403d7d511897); D.3a + D.3c routing code in place at 42a4b273; pve runtime-host substrate established (env file + /opt/agentic-spine + tooling); MacBook + ai-cons local DBs renamed to .divergent-pre-d3b-v3-20260502T211354Z.db (reversible); writers frozen pre-flip; pre-cutover ZFS snapshot md1400/spine@phase-d3b-v3-pre-cutover-20260502T211354Z plus v1+v2 originals all preserved as rollback points; routing activates on next mutating cap AND DB-backed read-only cap from any non-authority host"
  host: pve
  user: root
  host_addr_lan: 192.168.1.184
  host_addr_tailscale: 100.96.211.33
  code_path: /opt/agentic-spine
  authority_hostnames:
    - pve
    - pve.local
  per_host_ssh_key:
    ai-consolidation: /home/ubuntu/.ssh/spine_machine_ed25519
    macbook-2016-pro: ""
  routing_safety_classes:
    - mutating
    - destructive
  routing_local_safety_classes:
    - read-only
    - read-only-with-cache
  ssh_connect_timeout_seconds: 10
  fail_closed_on_unreachable: true
  no_silent_fallback_to_local_db_writes: true
  read_routing:
    db_backed_caps_must_route_when_enabled: true
    non_db_caps_stay_local: true
    consumer_db_open_must_fail_closed: true
    state_authority_field_required_for_db_caps: true
    rationale: >
      D.3a routed mutating/destructive caps. D.3b cutover discovered that
      read-only caps fell through to local DB and SQLite silently auto-created
      an empty stub, producing false read-success on consumers. D.3c routes
      DB-backed read-only caps and adds a lib-level open guard
      (db_authority_guard.py) so consumers fail closed instead of materializing
      empty stubs. A read-only lie is still a lie.

canonical_bootstrap_sequence:
  - step_id: S1
    command: ./bin/ops cap run spine.doctor -- --json
    purpose: inspect_bootstrap_preconditions_and_ack_state
  - step_id: S2
    command: ./bin/ops cap run spine.init
    purpose: materialize_bootstrap_state_and_satisfy_ack_guard
  - step_id: S3
    command: ./bin/ops terminal launch --tool claude --terminal $TERMINAL_ID
    purpose: governed_terminal_birth
    note: "Terminal launch is the canonical governed admission surface — sets identity, resolves custody, auto-attaches loops, then calls session.v3.attach internally for orientation output."
  - step_id: S4
    command: ./bin/ops cap run verify.engine.run
    purpose: foundational_engine_smoke_check
  - step_id: S5
    command: ./bin/ops cap run spine.verify
    purpose: canonical_local_spine_truth_check
  - step_id: S6
    command: ./bin/ops cap run verify.infra.run
    purpose: scoped_secondary_estate_workload_health_readback
    note: "Secondary estate/workload health readback, not foundational spine closeout truth unless a specific contract says so."

path_abstraction_policy:
  runtime_path_tokens:
    - "$SPINE_ROOT"
    - "$SPINE_CODE"
    - "$HOME/code/agentic-spine"
    - "$HOME/code/workbench"
  direct_absolute_path_exceptions:
    - ops/bindings/tenant.profile.yaml
    - ops/bindings/host.audit.allowlist.yaml
    - ops/bindings/spine.boundary.baseline.yaml
  prohibited_literals_for_new_runtime_writes:
    - /Users/ronnyworks/code/agentic-spine
    - /Users/ronnyworks/code/workbench
    - /Users/ronnyworks/code/mint-modules
  inventory_baseline_ref: ops/bindings/runtime.path.inventory.baseline.yaml

