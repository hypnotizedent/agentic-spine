status: authoritative
owner: "@ronny"
last_verified: 2026-04-05
scope: git-worktree-hygiene
version: 1
updated_at: 2026-04-05
contract: GIT_WORKTREE_HYGIENE_POLICY_V1

policy:
  dry_run_default: true
  canonical_remote: origin
  canonical_main_ref: refs/remotes/origin/main
  protected_local_branches:
    - main
  ephemeral_branch_namespace_prefixes:
    - codex/
  preserve_branch_patterns:
    - codex/preserve-*
    - codex/preserve-runtime-root-*
  prune_requirements:
    require_tip_ancestor_of_canonical_main: true
    require_zero_unique_commits: true
    require_clean_worktree: true
    require_no_nonprunable_worktree_attachment: true
  classification_labels:
    - active
    - prunable_landed
    - preserve
    - unknown
  maintenance:
    explicit_only: true
    inventory_command: git count-objects -v
    apply_command_preference:
      - git maintenance run --task=gc --task=prune
      - git gc --prune=now
  messages:
    preserve: >
      preserve-* branches are retained intentionally and are never auto-pruned
      by this command.
    unknown: >
      Unknown means the item is outside the ephemeral policy or still carries
      unique unlanded commits relative to origin/main.
    prunable: >
      prunable_landed requires boring proof: merged into origin/main, zero
      unique commits, and no active non-prunable worktree attachment.
