version: 1
status: authoritative
owner: "@ronny"
updated_at: "2026-03-17"
scope: home-media-execution-parity

purpose: >
  Execution-grade parity matrix for collapsing the current split shop media
  estate into the unified home `media-home` runtime. This is the service-by-
  service cutover reference for config paths, data paths, ports, secret
  namespace routing, health probes, and cutover order.

authority:
  parent_contracts:
    - ops/bindings/home.media.target.contract.yaml
    - ops/bindings/media.path.authority.contract.yaml
  supporting_bindings:
    - ops/bindings/media.services.yaml
    - ops/bindings/services.health.yaml
    - ops/bindings/secrets.namespace.policy.yaml
  live_compose_evidence:
    - ssh download-stack 'sed -n "1,520p" /opt/stacks/download-stack/docker-compose.yml'
    - ssh streaming-stack 'sed -n "1,320p" /opt/stacks/streaming-stack/docker-compose.yml'
  last_runtime_verification: "2026-03-17"

target_runtime:
  hostname: media-home
  vm_id: 106
  preferred_lan_ip: 10.0.0.106
  compose_root: /srv/appdata/compose/media-stack
  appdata_root: /srv/appdata
  payload_root: /srv/media
  unified_secret_namespace: /spine/vm-infra/media-stack/home

normalization_rules:
  - "All kept media app state lives on local VM storage under /srv/appdata."
  - "Downloaders and ARR-style automation normalize on /data backed by /srv/media."
  - "Playback consumers normalize on /media or /music backed by /srv/media."
  - "The split /spine/vm-infra/media-stack/download and /streaming namespaces converge to /spine/vm-infra/media-stack/home."
  - "Exactly one watchtower instance and one node-exporter instance exist on media-home."
  - "The legacy /opt/appdata local-db exception disappears on media-home because app state is already local."

cutover_waves:
  - id: W1-foundation
    order_range: "10-40"
    goal: "Bring up infra and network dependencies before application cutover."
  - id: W2-download-clients
    order_range: "50-60"
    goal: "Restore downloader availability and ingest paths."
  - id: W3-arr-core
    order_range: "65-100"
    goal: "Restore indexing and core library automation."
  - id: W4-automation-support
    order_range: "110-130"
    goal: "Restore helper automation behind the core ARR lane."
  - id: W5-playback-and-requests
    order_range: "140-170"
    goal: "Restore media consumption and request surfaces."
  - id: W6-user-experience
    order_range: "180-210"
    goal: "Restore kept user-facing adjunct services."
  - id: W7-kept-helpers
    order_range: "220-260"
    goal: "Restore explicitly kept helper and bridge services."
  - id: W8-observability-and-updates
    order_range: "270-280"
    goal: "Restore update automation after app stability is confirmed."
  - id: PARKED
    order_range: "900+"
    goal: "Do not cut over by default; keep only as rollback or explicit reactivation."

service_matrix:
  crowdsec:
    classification: must_carry
    current_vm: download-stack
    current_config_paths:
      - /mnt/docker/volumes/crowdsec/config:/etc/crowdsec
    current_data_paths:
      - /mnt/docker/volumes/crowdsec/data:/var/lib/crowdsec/data
      - /var/log:/var/log:ro
    target_config_paths:
      - /srv/appdata/crowdsec/config:/etc/crowdsec
    target_data_paths:
      - /srv/appdata/crowdsec/data:/var/lib/crowdsec/data
      - /var/log:/var/log:ro
    port_bindings: []
    current_secret_namespaces: []
    target_secret_namespace: none
    required_secret_keys: []
    health_probe:
      type: container_running
      expect: running
    cutover_wave: W1-foundation
    cutover_order: 10
    notes: "Bring up early so security telemetry exists before app cutover."

  node-exporter:
    classification: kept_helper
    current_vm: download-stack+streaming-stack
    current_config_paths: []
    current_data_paths:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    target_config_paths: []
    target_data_paths:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    port_bindings:
      - 9100->9100/tcp
    current_secret_namespaces: []
    target_secret_namespace: none
    required_secret_keys: []
    health_probe:
      type: http
      port: 9100
      path: /metrics
      expect: 200
    cutover_wave: W1-foundation
    cutover_order: 20
    notes: "Collapse download/streaming split exporters into one instance on media-home."

  gluetun:
    classification: must_carry
    current_vm: download-stack
    current_config_paths:
      - /mnt/docker/volumes/gluetun:/gluetun
    current_data_paths: []
    target_config_paths:
      - /srv/appdata/gluetun:/gluetun
    target_data_paths: []
    port_bindings:
      - 5030->5030/tcp
      - 50300->50300/tcp
    current_secret_namespaces:
