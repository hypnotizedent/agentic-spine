# Canonical backup authority inventory.
# Legacy workbench reference: ~/code/workbench/infra/data/backup_inventory.json (reference only, not canonical).
# NOTE: enabled=false by default; flip true intentionally per target.
# Classifications: critical (26h), important (48h), rebuildable (168h)
# Status: authoritative
# Last verified: 2026-03-19
# yq selectors for gate authoring:
#   .targets[]              → array of target objects (NOT map-keyed)
#   .targets[].name         → target identifier (.name NOT .id)
#   .targets[].enabled      → bool
#   .model.data_classes      → classification definitions
#   .defaults               → global defaults (timezone, ssh_timeout_sec, stale_after_hours)
version: 1
# Canonical timezone source: ops/bindings/tenant.profile.yaml (runtime.timezone)
defaults:
  timezone: "America/New_York"
  ssh_timeout_sec: 6
  stale_after_hours: 26
model:
  authority_state: authoritative
  profile_version: "systemic-v1"
  data_classes:
    small_state:
      description: "Config, lightweight databases, and critical metadata."
    large_state:
      description: "State with material size/cost where VM-level snapshots are primary."
    payload_regenerable:
      description: "Regenerable payload/cache that is excluded by default."
    tier1_critical:
      description: "Highest criticality state requiring explicit drill coverage."
  schedule_classes:
    hourly-monitor-est:
      cron: "15 * * * *"
      timezone: "America/New_York"
    daily-primary-est:
      cron: "0 1 * * *"
      timezone: "America/New_York"
      note: "Shop daily-primary cadence. Exact windows are authoritative in ops/bindings/backup.calendar.yaml."
    daily-home-primary-est:
      cron: "0 3 * * *"
      timezone: "America/New_York"
      note: "Home daily-primary cadence for proxmox-home source backups; canonical recovery remains on Synology."
    daily-config-est:
      cron: "45 3 * * *"
      timezone: "America/New_York"
      note: "Media/config cadence bucket. Exact windows live in ops/bindings/backup.calendar.yaml."
    weekly-est:
      cron: "0 4 * * 0"
      timezone: "America/New_York"
    monthly-drill-est:
      cron: "0 4 1 * *"
      timezone: "America/New_York"
    quarterly-drill-est:
      cron: "0 5 1 */3 *"
      timezone: "America/New_York"
  restore_classes:
    vm-dry-run-quarterly:
      mode: dry_run
      cadence: quarterly
    app-dry-run-monthly:
      mode: dry_run
      cadence: monthly
    media-config-dry-run-monthly:
      mode: dry_run
      cadence: monthly
    tier1-small-state-dry-run-quarterly:
      mode: dry_run
      cadence: quarterly
  destination_lanes:
    pve-vzdump-primary:
      host: pve
      base_path: /tank/backups/vzdump/dump
      max_total_gb: 4000
      max_file_count: 120
      description: "Local pve vzdump generation lane only. This is the shop generator surface, not the canonical cold recovery plane. Canonical cold copies are promoted from here into /md1400/backup-cold/vzdump/pve."
    pve-vzdump-cold-canonical:
      host: pve
      base_path: /md1400/backup-cold/vzdump/pve
      max_total_gb: 6000
      max_file_count: 200
      description: "Canonical cold recovery lane for shop VM/LXC artifacts on md1400. This is the authoritative restore surface for shop hypervisor backups."
    r730xd-finance-backups:
      host: pve
      base_path: /md1400/backup-cold/apps/finance
      max_total_gb: 5000
      max_file_count: 10000
      description: "Canonical 730XD backup plane for Finance domain (Firefly, Ghostfolio, Paperless)"
    r730xd-mint-backups:
      host: pve
      base_path: /md1400/backup-cold/apps/mint-data
      max_total_gb: 1000
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Mint data domain (Postgres)"
    r730xd-communications-backups:
      host: pve
      base_path: /md1400/backup-cold/apps/communications
      max_total_gb: 10000
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Communications domain (mail-archiver, Stalwart)"
    r730xd-infra-core-backups:
      host: pve
      base_path: /md1400/backup-cold/apps/infra-core
      max_total_gb: 500
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Infra-core domain (Infisical, Vaultwarden)"
    r730xd-dev-tools-backups:
      host: pve
      base_path: /md1400/backup-cold/apps/dev-tools
      max_total_gb: 1000
      max_file_count: 1000
      description: "Canonical 730XD backup plane for Dev-tools domain (Gitea)"
    r730xd-media-config-backups:
      host: pve
      base_path: /md1400/backup-cold/apps/media-config
      max_total_gb: 500
      max_file_count: 1000
      description: "Secondary/offsite cold copy lane for media-home combined config-state archives. Legacy split-shop VM capsules remain historical restore residue only."
    media-config-backups:
      host: nas
      base_path: /volume1/backups/apps/media-config
      exclusion_policy:
        - /srv/media
        - "*/cache"
        - "*/tmp"
      max_total_gb: 500
      max_file_count: 800
      description: "Canonical primary app/config backup plane for media-home combined config-state archives. Payload remains on Synology and is excluded from config archives."
    nas-home-local-exception:
      host: nas
      base_path: /volume1/backups/proxmox_backups/dump
      max_total_gb: 1600
      max_file_count: 400
      description: "Canonical home-local backup lane on Synology for proxmox-home artifacts (Home Assistant VM 100, media-home VM 106, and home Pi-hole LXC 105). Only /volume1/backups/proxmox_backups/dump is canonical; legacy residue was tombstoned out of the active root on 2026-03-19."
    nas-legacy-tombstones:
      host: nas
      base_path: /volume1/backups/_legacy_tombstones
      max_total_gb: 2000
      max_file_count: 20000
      description: "Explicit tombstone subtree for retired Synology backup lanes. This is not a canonical backup authority and exists only to quarantine legacy backup forests until a later delete/review wave."
    # nas-app-backups REMOVED 2026-03-08: Fully deprecated, migration complete to 730XD canonical plane.
    r730xd-archive-smb-snapshots:
      host: pve
      base_path: /md1400/backup-cold/archive-smb/snapshots
      snapshot_retention_days: 14
      description: "ZFS snapshot protection for archive-SMB datasets (ronny-projects 11.9G, mint-legacy 127G). Cron-managed daily snapshots via /etc/cron.d/archive-smb-snapshot with 14-day retention."
  backup_admission_states:
    - planned
    - production_ready
runtime_units:
  - unit_id: machine-pve
    kind: machine
    hostname: pve
    backup_profile: host-control-plane
    data_class: tier1_critical
    include_paths:
      - /etc/pve/jobs.cfg
      - /tank/backups/vzdump/dump
    exclude_paths: []
    destination_lane: pve-vzdump-primary
    schedule_class: daily-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - vm-202-primary
      - vm-203-primary
      - vm-204-infra-core-primary
      - vm-205-observability-primary
      - vm-206-dev-tools-primary
      - vm-207-ai-consolidation-primary
      - vm-209-download-stack-primary
      - vm-210-streaming-stack-primary
      - vm-211-finance-stack-primary
      - vm-212-mint-data-primary
      - vm-213-mint-apps-primary
      - vm-214-communications-stack-primary
      - vm-215-surveillance-stack-primary
      - lxc-220-archive-smb-primary
    backup_admission_state: production_ready
  - unit_id: machine-proxmox-home
    kind: machine
    hostname: proxmox-home
    backup_profile: home-hypervisor
    data_class: tier1_critical
    include_paths:
      - /etc/pve/jobs.cfg
      - /mnt/pve/synology-backups/dump
    exclude_paths: []
    destination_lane: nas-home-local-exception
    schedule_class: daily-home-primary-est
    restore_class: vm-dry-run-quarterly
    inventory_targets:
      - home-vm-100-ha-primary
      - home-lxc-105-pihole-primary
      - home-vm-106-media-home-primary
    backup_admission_state: production_ready
    description: "Home hypervisor guest backup plane. Proxmox-home generates and stages the canonical Synology-backed artifacts for VM 100, LXC 105, and VM 106."
  # machine-nas REMOVED 2026-03-08: All business backup authority migrated to 730XD canonical plane.
