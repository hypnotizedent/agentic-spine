---
schema_version: "1.0"
status: authoritative
owner: "@ronny"
updated_at: "2026-03-25"
scope: github-mirror-file-exclusions
decision_loop_id: LOOP-MIRROR-PRODUCTIZATION-20260325

description: >
  Files and directories excluded entirely from the GitHub mirror.
  These contain operational state or secrets references that cannot
  be safely transformed — they must be omitted from the public copy.

contract: github.mirror.file.exclusions
version: "1.0"

# ── Directory Exclusions ────────────────────────────────────────────
# Entire directory trees removed from the mirror.
excluded_directories:
  - path: ".claude/"
    reason: "Agent workspace with local hooks and settings"
  - path: ".gitea/"
    reason: "Gitea-specific integration (not relevant for GitHub consumers)"
  - path: "mailroom/"
    reason: "Runtime state (gitignored but belt-and-suspenders)"
  - path: ".runtime/"
    reason: "External runtime state (gitignored but belt-and-suspenders)"
  - path: ".evidence/"
    reason: "Session evidence (gitignored but belt-and-suspenders)"
  - path: "ops/plugins/core/release/templates/"
    reason: "Template sources — injected into mirror output directly"
  - path: "ops/archive/"
    reason: "Historical operational data — contains identity-heavy gap/closure records"
  - path: "ops/plugins/domains/mint/"
    reason: "Personal business domain (Mint Prints commerce)"
  - path: "ops/plugins/domains/media/"
    reason: "Personal media stack (Sonarr/Radarr/Plex)"
  - path: "ops/plugins/domains/finance/"
    reason: "Personal finance domain (Firefly/SimpleFIN)"
  - path: "ops/plugins/domains/communications/"
    reason: "Personal communications stack (Stalwart/email)"
  - path: "ops/plugins/domains/calendar/"
    reason: "Personal calendar integration"
  - path: "ops/plugins/domains/ha/"
    reason: "Personal Home Assistant integration"
  - path: "ops/plugins/domains/home/"
    reason: "Personal home infrastructure (NAS/VMs)"
  - path: "ops/plugins/domains/immich/"
    reason: "Personal photo management"
  - path: "ops/plugins/domains/inbox-shield/"
    reason: "Personal inbox filtering"
  - path: "ops/plugins/domains/maker/"
    reason: "Personal maker/3D printing tools"
  - path: "ops/plugins/domains/n8n/"
    reason: "Personal automation workflows"
  - path: "ops/plugins/domains/surveillance/"
    reason: "Personal surveillance system"
  - path: "ops/plugins/domains/taxlegal/"
    reason: "Personal tax/legal documents"
  - path: "ops/plugins/domains/vaultwarden/"
    reason: "Personal password management"
  - path: "ops/plugins/domains/bin/"
    reason: "Domain binary shared directory"

# ── File Exclusions ─────────────────────────────────────────────────
# Individual files removed from the mirror.
excluded_files:
  - path: ".mcp.json"
    reason: "MCP server config with hardcoded local paths"
  - path: ".environment.yaml"
    reason: "Local environment configuration"
  - path: ".identity.yaml"
    reason: "Node identity with tenant-specific values"
  - path: "ops/bindings/secrets.binding.yaml"
    reason: "Secret provider binding (even redacted, reveals architecture)"
  - path: "ops/bindings/secrets.inventory.yaml"
    reason: "Secret project catalog"
  - path: "ops/bindings/secrets.namespace.policy.yaml"
    reason: "Secret namespace rules"
  - path: "ops/bindings/secrets.enforcement.contract.yaml"
    reason: "Secret enforcement policy"
  - path: "ops/bindings/ssh.targets.yaml"
    reason: "SSH target inventory with host details"
  - path: "ops/bindings/cross-repo.authority.yaml"
    reason: "Internal cross-repo authority mapping"
  - path: "ops/bindings/tenant.profile.yaml"
    reason: "Active tenant profile with operator-specific config"
  - path: "ops/plugins/providers/bin/infisical-agent.sh"
    reason: "Infisical client with embedded client IDs"
  - path: "ops/bindings/github.mirror.sanitization.rules.yaml"
    reason: "Mirror meta-config — contains literal sensitive patterns"
  - path: "ops/bindings/github.mirror.file.exclusions.yaml"
    reason: "Mirror meta-config — file exclusion inventory"
  - path: "ops/plugins/core/release/bin/github-mirror-sync"
    reason: "Mirror pipeline — self-referential validation patterns"
  - path: "ops/plugins/core/release/bin/sanitization-audit"
    reason: "Sanitization audit — contains sensitive pattern definitions"
  - path: "ops/bindings/inventory.transaction.ledger.yaml"
    reason: "Historical transaction ledger"
  - path: "ops/bindings/domains/media/media.content.ledger.yaml"
    reason: "Personal media content ledger"
  - path: "ops/bindings/ha.automations.ledger.yaml"
    reason: "Personal HA automations ledger"
  - path: "ops/bindings/network.devices.ledger.yaml"
    reason: "Personal network device inventory"
  - path: "ops/bindings/friction.baseline.contract.yaml"
    reason: "Internal friction tracking baseline"

# ── Pattern Exclusions ──────────────────────────────────────────────
# Glob patterns for files excluded from the mirror.
excluded_patterns:
  - pattern: "*.pem"
    reason: "Certificate files"
  - pattern: "*.key"
    reason: "Key files"
  - pattern: "*.p12"
    reason: "Certificate bundles"
  - pattern: ".env*"
    reason: "Environment files"
  - pattern: "**/friction-queue*"
    reason: "Friction queue databases"
  - pattern: "**/ledger*.yaml"
    reason: "Historical ledger files"
  - pattern: "ops/bindings/domains/media/*.yaml"
    reason: "Personal media stack topology and configuration"
  - pattern: "ops/bindings/shop.*.yaml"
    reason: "Personal Mint Prints shop infrastructure"
  - pattern: "ops/bindings/home.*.yaml"
    reason: "Personal home infrastructure topology"
  - pattern: "ops/bindings/finance.*.yaml"
    reason: "Personal finance domain configuration"
  - pattern: "ops/bindings/calendar.*.yaml"
    reason: "Personal calendar integration configuration"
  - pattern: "ops/bindings/communications.*.yaml"
    reason: "Personal communications stack configuration"
  - pattern: "ops/bindings/backup.*.yaml"
    reason: "Personal backup topology and schedules"
  - pattern: "ops/bindings/hardware.*.yaml"
    reason: "Personal hardware inventory"
  - pattern: "ops/bindings/vm.*.yaml"
    reason: "Personal VM lifecycle and topology"
  - pattern: "ops/bindings/network.*.yaml"
    reason: "Personal network topology"
  - pattern: "ops/bindings/storage.*.yaml"
    reason: "Personal storage topology and placement"
  - pattern: "ops/bindings/service.*.yaml"
    reason: "Personal service inventory and lifecycle"
  - pattern: "ops/bindings/infra.*.yaml"
    reason: "Personal infrastructure configuration"
  - pattern: "ops/bindings/estate.*.yaml"
    reason: "Personal estate-wide topology"
  - pattern: "ops/bindings/surveillance.*.yaml"
    reason: "Personal surveillance system configuration"

# ── Replaced Files ──────────────────────────────────────────────────
# Files that are excluded but replaced with safe templates in the mirror.
replaced_with_template:
  - original: ".mcp.json"
    template: ".mcp.json.example"
    reason: "Provide example MCP config for GitHub consumers"
  - original: "fixtures/tenant.sample.yaml"
    template: "fixtures/tenant.example.yaml"
    reason: "Provide example tenant config with placeholder values"

# Template source directory: ops/plugins/core/release/templates/
