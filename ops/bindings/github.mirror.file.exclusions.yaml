---
schema_version: "1.0"
status: authoritative
owner: "@ronny"
updated_at: "2026-03-24"
scope: github-mirror-file-exclusions
decision_loop_id: LOOP-SPINE-PRODUCTIZATION-20260324

description: >
  Files and directories excluded entirely from the GitHub mirror.
  These contain operational state or secrets references that cannot
  be safely transformed — they must be omitted from the public copy.

contract: github.mirror.file.exclusions
version: "1.0"

# ── Directory Exclusions ────────────────────────────────────────────
# Entire directory trees removed from the mirror.
excluded_directories:
  - path: ".claude/"
    reason: "Agent workspace with local hooks and settings"
  - path: ".gitea/"
    reason: "Gitea-specific integration (not relevant for GitHub consumers)"
  - path: "mailroom/"
    reason: "Runtime state (gitignored but belt-and-suspenders)"
  - path: ".runtime/"
    reason: "External runtime state (gitignored but belt-and-suspenders)"
  - path: ".evidence/"
    reason: "Session evidence (gitignored but belt-and-suspenders)"
  - path: "ops/plugins/core/release/templates/"
    reason: "Template sources — injected into mirror output directly"
  - path: "ops/archive/"
    reason: "Historical operational data — contains identity-heavy gap/closure records"

# ── File Exclusions ─────────────────────────────────────────────────
# Individual files removed from the mirror.
excluded_files:
  - path: ".mcp.json"
    reason: "MCP server config with hardcoded local paths"
  - path: ".environment.yaml"
    reason: "Local environment configuration"
  - path: ".identity.yaml"
    reason: "Node identity with tenant-specific values"
  - path: "ops/bindings/secrets.binding.yaml"
    reason: "Secret provider binding (even redacted, reveals architecture)"
  - path: "ops/bindings/secrets.inventory.yaml"
    reason: "Secret project catalog"
  - path: "ops/bindings/secrets.namespace.policy.yaml"
    reason: "Secret namespace rules"
  - path: "ops/bindings/secrets.enforcement.contract.yaml"
    reason: "Secret enforcement policy"
  - path: "ops/bindings/ssh.targets.yaml"
    reason: "SSH target inventory with host details"
  - path: "ops/bindings/cross-repo.authority.yaml"
    reason: "Internal cross-repo authority mapping"
  - path: "ops/bindings/tenant.profile.yaml"
    reason: "Active tenant profile with operator-specific config"
  - path: "ops/plugins/providers/bin/infisical-agent.sh"
    reason: "Infisical client with embedded client IDs"
  - path: "ops/bindings/github.mirror.sanitization.rules.yaml"
    reason: "Mirror meta-config — contains literal sensitive patterns"
  - path: "ops/bindings/github.mirror.file.exclusions.yaml"
    reason: "Mirror meta-config — file exclusion inventory"
  - path: "ops/plugins/core/release/bin/github-mirror-sync"
    reason: "Mirror pipeline — self-referential validation patterns"
  - path: "ops/plugins/core/release/bin/sanitization-audit"
    reason: "Sanitization audit — contains sensitive pattern definitions"

# ── Pattern Exclusions ──────────────────────────────────────────────
# Glob patterns for files excluded from the mirror.
excluded_patterns:
  - pattern: "*.pem"
    reason: "Certificate files"
  - pattern: "*.key"
    reason: "Key files"
  - pattern: "*.p12"
    reason: "Certificate bundles"
  - pattern: ".env*"
    reason: "Environment files"

# ── Replaced Files ──────────────────────────────────────────────────
# Files that are excluded but replaced with safe templates in the mirror.
replaced_with_template:
  - original: ".mcp.json"
    template: ".mcp.json.example"
    reason: "Provide example MCP config for GitHub consumers"
  - original: "fixtures/tenant.sample.yaml"
    template: "fixtures/tenant.example.yaml"
    reason: "Provide example tenant config with placeholder values"

# Template source directory: ops/plugins/core/release/templates/
