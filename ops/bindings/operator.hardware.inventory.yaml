non_activation:
  statement: >
    This inventory records operator-owned hardware identity and eligibility
    classification only. It does not activate, assign, or promote any machine
    to any node role. Promotion from candidate inventory to active node
    assignment requires separate explicit Ronny approval.
  does_not_activate:
    - node role assignment
    - host activation
    - workload redistribution
    - scheduler materialization
    - runtime state movement
