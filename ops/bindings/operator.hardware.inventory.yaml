# Operator-Owned Hardware Inventory
# Canonical inventory of operator-owned Mac, Windows, and Linux machines
# that may be candidates for dedicated node roles.
#
# Scope: inventory and identity only.
# This surface does NOT assign hosts to node roles,
# activate any machine, or promote candidates to active duty.
#
# Scope-widening authority:
#   Approved 2026-04-13 under bounded operator-hardware eligibility
#   assessment. Host assignment and node activation remain separately
#   gated and require explicit Ronny approval.
#
# Related contracts:
#   - ops/bindings/node.role.contract.yaml (node taxonomy — does not activate)
#   - ops/bindings/hardware.inventory.yaml (infrastructure machines — separate scope)
#   - ops/bindings/infra.placement.policy.yaml (site topology)
#   - ops/bindings/operator.hardware.readiness.profiles.yaml (platform readiness)

subordinate_to: ops/bindings/root.authority.contract.yaml

related_contracts:
  - contract: ops/bindings/node.role.contract.yaml
    relationship: "Node taxonomy authority. This inventory does not assign node roles."
  - contract: ops/bindings/hardware.inventory.yaml
    relationship: "Peer inventory for infrastructure machines (servers, NAS). Separate scope."
  - contract: ops/bindings/operator.hardware.readiness.profiles.yaml
    relationship: "Platform-scoped readiness profiles consumed during eligibility assessment."

# Eligibility classification vocabulary (read-only, non-activating)
#
# These states classify inventory objects only.
# No state in this vocabulary activates, assigns, or promotes a machine.
eligibility_states:
  unknown:
    description: "Machine is inventoried but no eligibility assessment has been performed."
    terminal: false
  candidate:
    description: "Machine has been assessed and meets minimum identity prerequisites (Tailscale enrolled, hardware identified). Not yet evaluated against readiness profile."
    terminal: false
  conditionally_eligible:
    description: "Machine passes readiness profile prerequisites with noted conditions (e.g., battery health marginal, OS version aging). Conditions are recorded in the evidence field."
    terminal: false
  eligible:
    description: "Machine passes all readiness profile prerequisites for one or more node role candidacies without conditions."
    terminal: false
  ineligible:
    description: "Machine fails one or more hard prerequisites. Reason recorded in the evidence field."
    terminal: true

# Node role candidacy vocabulary (non-activating)
#
# A machine may be a candidate for one or more node roles.
# Candidacy does NOT equal assignment. Assignment requires separate
# explicit Ronny approval outside this surface.
# role_candidacy: [none] means no node role is selected here; it does not mean
# the device is unavailable or unready as hardware inventory.
role_candidacy_values:
  - none
  - execution_host
  - watcher_node
  - verification_node
  - translator_node

# Node promotion stage vocabulary.
#
# These values mirror docs/governance/NODE_PROMOTION_LADDER.md. They are
# role-bound proof stages for machines with a non-none role_candidacy. A
# promotion_stage does not activate a machine or assign work; it records how far
# the candidacy has been proved so consumers cannot treat declared inventory
# language as delivered node truth.
promotion_stage_values:
  - taxonomy
  - contracted
  - workload-backed
  - candidate-backed
  - bootstrap-joined
  - materialized
  - delivered

# Platform values — mac, windows, and linux are never collapsed
# linux covers operator-owned hardware reprovisioned from any
# prior OS to a Linux distribution (e.g., Ubuntu, Debian).
platform_values:
  - mac
  - windows
  - linux

