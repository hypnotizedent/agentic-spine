# Entry Surface Contract
# Status: authoritative
# Last verified: 2026-03-27
# Model: thin-stub (post H2-C)

version: 4
updated_at: "2026-03-27"
owner: "@ronny"
scope: entry-surface-integrity

# Entry stubs are thin pointers. They do not carry inline governance or startup blocks.
#
# Governance injection model:
#   Claude Code  — hook injection via .claude/hooks/session-entry-hook.sh
#   Codex        — governed attach via session-v3-attach / terminal-launch-exec
#   OpenCode     — governed attach via session-v3-attach / terminal-launch-exec
#
# Shared governance doctrine: ops/archive/pre-2026-04-01-spine/docs/governance/RONNY_SESSION_SKILL_CORE.md
# Root authority: ops/bindings/root.authority.contract.yaml

entry_model: thin-pointer
governance_carriers:
  claude_code: hook-injection
  codex: governed-attach
  opencode: governed-attach
shared_doctrine: ops/archive/pre-2026-04-01-spine/docs/governance/RONNY_SESSION_SKILL_CORE.md

surfaces:
  - id: codex
    path: AGENTS.md
    role: thin-pointer
  - id: claude_project
    path: CLAUDE.md
    role: thin-pointer
  - id: opencode
    path: ~/code/workbench/dotfiles/opencode/OPENCODE.md
    role: adapter-with-runtime-specifics
  - id: claude_skill
    path: .claude/skills/claude-ai-skill/SKILL.md
    role: adapter
    match_mode: contains
  # claude_home (~/.claude/CLAUDE.md) is a redirect shim only — governed by D46, not D124.

prohibited_in_stubs:
  - inline governance blocks
  - SPINE_STARTUP_BLOCK markers
  - duplicated startup commands
  - duplicated verify/certification commands

# Gateway-first routing policy (AOF v1.1 Move 1 cutover)
routing_policy:
  model: gateway-first
  primary_server: spine
  absorbed_servers:
    - spine-rag
  supplemental_servers:
    - finance-agent
    - mint-pricing
    - mint-suppliers
    - MCP_DOCKER
    - playwright
