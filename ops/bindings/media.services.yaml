# Media Services Binding (SSOT)
# Status: authoritative
# Owner: "@ronny"
# Last verified: 2026-03-18
# Scope: media-stack-services
#
# Consolidated service inventory for media-stack tenant.
# Derived from SERVICE_REGISTRY.yaml with media-stack specific metadata.
# Used by: media.health.check, media.service.status capabilities
#          D106-D110 drift gates

version: 1
updated_at: "2026-03-18"
owner: "@ronny"

defaults:
  health_timeout_sec: 10
  compose_command: "docker compose"

naming_aliases:
  media-stack:
    status: active
    canonical_vm: media-home
    note: "Canonical unified media runtime on media-home. Current posture is jellyfin-only recovery."
  arr-stack:
    status: parked
    canonical_vm: media-home
    note: "ARR services are canonically assigned to media-home but intentionally parked during jellyfin-only recovery."
  download-stack:
    status: rollback_only
    canonical_vm: media-home
    note: "Legacy shop write lane retained only for rollback and forensic comparison."
  streaming-stack:
    status: rollback_only
    canonical_vm: media-home
    note: "Legacy shop playback lane retained only for rollback and forensic comparison."

services:
  # ════════════════════════════════════════════════════════════════════════
  # Unified media runtime — media-home (VM 106, 10.0.0.106)
  # ════════════════════════════════════════════════════════════════════════

  # Indexing
  prowlarr:
    vm: media-home
    port: 9696
    health: /ping
    status: parked
    category: indexing
    description: "Indexer manager for *arr services"

  # Management (*arr stack)
  radarr:
    vm: media-home
    port: 7878
    health: /ping
    status: parked
    category: management
    description: "Movie management"
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  sonarr:
    vm: media-home
    port: 8989
    health: /ping
    status: parked
    category: management
    description: "TV management"
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  lidarr:
    vm: media-home
    port: 8686
    health: /ping
    status: parked
    category: management
    description: "Music management"
    dependencies: [prowlarr, sabnzbd, slskd]

  # Download clients
  sabnzbd:
    vm: media-home
    port: 8080
    health: /api?mode=version&output=json
    status: parked
    category: download
    description: "Usenet downloader"

  qbittorrent:
    vm: media-home
    port: 8081
    health: /
    status: parked
    category: download
    description: "BitTorrent client (route mode: direct; see ops/bindings/vpn.provider.yaml)"

  # Enhancement services
  bazarr-dl:
    vm: media-home
    port: 6767
    health: /ping
    status: parked
    category: enhancement
    description: "Subtitle management (download instance, currently inactive)"

  trailarr:
    vm: media-home
    port: 7667
    health: null
    health_reason: auth_gated
    status: parked
    category: enhancement
    description: "Trailer management"

  posterizarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: enhancement
    description: "Poster art management"

  unpackerr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Archive extraction for downloads"

  recyclarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "TRaSH guide sync (cron-triggered, no daemon)"

  flaresolverr:
    vm: media-home
    port: 8191
    health: /health
    status: parked
    category: utility
    description: "Cloudflare challenge solver"

  # Experimental services
  autopulse:
    vm: media-home
    port: 2875
    health: null
    health_reason: localhost_bound
    status: parked
    category: experimental
    description: "Library refresh trigger for Jellyfin on the unified media-home runtime"

  crosswatch:
    vm: media-home
    port: 8787
    health: null
    health_reason: localhost_bound
    status: parked
    category: experimental
    description: "Cross-service watch sync on the unified media-home runtime"

  decypharr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: experimental
    description: "Real-Debrid integration"

  # Swaparr instances (stalled download swappers)
  swaparr-radarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Deprecated 2026-03-01; disabled during API-key rotation stabilization"

  swaparr-sonarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Deprecated 2026-03-01; disabled during API-key rotation stabilization"

  swaparr-lidarr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Deprecated 2026-03-01; disabled during API-key rotation stabilization"

  arr-native-search:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Native ARR missing-search scheduler (movies/episodes/albums)"

  # VPN infrastructure
  gluetun:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: infrastructure
    description: "Privado VPN tunnel container for media P2P lane (authoritative policy in ops/bindings/vpn.provider.yaml)"

  # Parked services (intentionally stopped)
  tdarr:
    vm: media-home
    port: 8265
    health: /
    status: parked
    category: parked
    description: "Transcode automation (soak period)"

  slskd:
    vm: media-home
    port: 5030
    health: null
    health_reason: vpn_network_mode
    status: parked
    category: download
    description: "Soulseek client (route mode: via_tunnel -> gluetun)"
    dependencies: [gluetun]

  soularr:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Soulseek integration for Lidarr"
    dependencies: [lidarr, slskd]

  # Infrastructure
  crowdsec:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: infrastructure
    description: "Security monitoring"

  watchtower-download:
    vm: media-home
    container: watchtower
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: infrastructure
    description: "Legacy alias for the unified media-home watchtower"

  download-node-exporter:
    vm: media-home
    container: node-exporter
    port: 9100
    health: /
    status: parked
    category: infrastructure
    description: "Legacy alias for the unified media-home node-exporter"

  # ════════════════════════════════════════════════════════════════════════
  # Playback, request, and experience surfaces on media-home
  # ════════════════════════════════════════════════════════════════════════

  # Video streaming
  jellyfin:
    vm: media-home
    port: 8096
    health: /health
    status: active
    category: streaming
    description: "Video streaming server"
    critical: true

  # Music streaming
  navidrome:
    vm: media-home
    port: 4533
    health: /ping
    status: parked
    category: streaming
    description: "Music streaming server"

  # Request management
  jellyseerr:
    vm: media-home
    port: 5055
    health: /api/v1/status
    status: parked
    category: requests
    description: "Media request management"

  # Subtitles
  bazarr:
    vm: media-home
    port: 6767
    health: /ping
    status: parked
    category: enhancement
    description: "Subtitle management"

  # Dashboard
  homarr:
    vm: media-home
    port: 7575
    health: /
    status: parked
    category: dashboard
    role: operator-dashboard
    description: "Media dashboard"

  # User management
  wizarr:
    vm: media-home
    port: 5690
    health: /
    status: parked
    category: user-mgmt
    description: "Media server invitation management"

  # Music sync
  spotisub:
    vm: media-home
    port: 8766
    health: /api/v1/utils/healthcheck
    status: parked
    category: enhancement
    description: "Spotify-to-Navidrome sync"

  subgen:
    vm: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: enhancement
    description: "AI subtitle generation for Jellyfin"

  # Infrastructure
  watchtower-streaming:
    vm: media-home
    container: watchtower
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: infrastructure
    description: "Legacy alias for the unified media-home watchtower"

  streaming-node-exporter:
    vm: media-home
    container: node-exporter
    port: 9100
    health: /
    status: parked
    category: infrastructure
    description: "Legacy alias for the unified media-home node-exporter"

# Jellyfin plugins (installed on media-home VM 106)
jellyfin_plugins:
  repositories:
    - name: "IAmParadox"
      url: "https://www.iamparadox.dev/jellyfin/plugins/manifest.json"
    - name: "Auto Collections (KeksBombe)"
      url: "https://raw.githubusercontent.com/KeksBombe/jellyfin-plugin-auto-collections/refs/heads/main/manifest.json"
    - name: "LizardByte"
      url: "https://app.lizardbyte.dev/jellyfin-plugin-repo/manifest.json"
  installed:
    - name: "Home Screen Sections"
      version: "2.5.2.0"
      status: active
      purpose: "Netflix-style home screen rows"
    - name: "Collection Sections"
      version: "2.3.5.0"
      status: active
      purpose: "Collection-driven library browsing"
    - name: "Auto Collections"
      version: "0.0.4.1"
      status: active
      purpose: "Automatic genre/decade/studio collections"

# Canonical VPN routing policy (see ops/bindings/vpn.provider.yaml)
vpn_policy:
  provider_binding: ops/bindings/vpn.provider.yaml
  tunnel_service: gluetun
  services:
    slskd:
      route_mode: via_tunnel
      tunnel_service: gluetun
    qbittorrent:
      route_mode: direct
      decision_gate: QB-VPN-ROUTE-001
    sabnzbd:
      route_mode: direct

# Port collision matrix (for D106 verification)
ports:
  media-home:
    9696: prowlarr
    7878: radarr
    8989: sonarr
    8686: lidarr
    8080: sabnzbd
    8081: qbittorrent
    6767: bazarr
    7667: trailarr
    8191: flaresolverr
    8265: tdarr  # parked
    5030: slskd  # via gluetun
    50300: slskd  # P2P listen port via gluetun
    2875: autopulse
    8787: crosswatch
    8096: jellyfin
    4533: navidrome
    5055: jellyseerr
    7575: homarr
    5690: wizarr
    8766: spotisub
    9100: download-node-exporter

# HA add-on overlap audit (for D110)
ha_overlaps:
  source_vm: 100  # homeassistant
  source_host: proxmox-home
  
  overlaps:
    - ha_addon: overseerr
      shop_service: jellyseerr
      shop_vm: media-home
      shop_port: 5055
      recommendation: decommission
      reason: "jellyseerr on media-home is the canonical request manager"

    - ha_addon: lidarr
      shop_service: lidarr
      shop_vm: media-home
      shop_port: 8686
      recommendation: investigate
      reason: "may have different library config or be stale duplicate"

    - ha_addon: sonarr
      shop_service: sonarr
      shop_vm: media-home
      shop_port: 8989
      recommendation: investigate
      reason: "may have different library config or be stale duplicate"

    - ha_addon: sabnzbd
      shop_service: sabnzbd
      shop_vm: media-home
      shop_port: 8080
      recommendation: investigate
      reason: "may have different config or be stale duplicate"
