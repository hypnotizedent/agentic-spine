# Media Services Binding (SSOT)
# Status: authoritative
# Owner: "@ronny"
# Last verified: 2026-03-20
# Scope: media-stack-services
#
# Consolidated service inventory for media-stack tenant.
# Derived from SERVICE_REGISTRY.yaml with media-stack specific metadata.
# Used by: media.health.check, media.service.status capabilities
#          D106-D110 drift gates

version: 2
updated_at: "2026-03-20"
owner: "@ronny"

defaults:
  health_timeout_sec: 10
  compose_command: "docker compose"

naming_aliases:
  media-stack:
    status: deprecated
    replaced_by:
      - download-stack
      - streaming-stack
    note: "Legacy media-stack host alias retired after VM split."
  arr-stack:
    status: active
    canonical_vm: download-stack
    note: "Residual ARR services still run on download-stack until home writer cutover closes."
  media-home-stack:
    status: active
    canonical_vm: media-home
    note: "Canonical active watch plane on media-home VM 106 backed by Synology /volume1/media-staging."

operating_model:
  active_plane:
    vm: media-home
    note: "Canonical live watch/download plane."
  archive_plane:
    vm: pve
    note: "Canonical passive archive plane on md1400."
  transitional_shop_residue:
    - download-stack
    - streaming-stack

services:
  # ════════════════════════════════════════════════════════════════════════
  # VM 209 — download-stack (192.168.1.209)
  # ════════════════════════════════════════════════════════════════════════

  # Indexing
  prowlarr:
    vm: download-stack
    port: 9696
    health: /ping
    status: active
    category: indexing
    description: "Indexer manager for *arr services"

  # Management (*arr stack)
  radarr:
    vm: download-stack
    port: 7878
    health: /ping
    status: active
    category: management
    description: "Movie management"
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  sonarr:
    vm: download-stack
    port: 8989
    health: /ping
    status: active
    category: management
    description: "TV management"
    dependencies: [prowlarr, sabnzbd, qbittorrent]

  lidarr:
    vm: download-stack
    port: 8686
    health: /ping
    status: active
    category: management
    description: "Music management"
    dependencies: [prowlarr, sabnzbd, slskd]

  # Download clients
  sabnzbd:
    vm: download-stack
    port: 8080
    health: /api?mode=version&output=json
    status: active
    category: download
    description: "Usenet downloader"

  qbittorrent:
    vm: download-stack
    port: 8081
    health: /
    status: active
    category: download
    description: "BitTorrent client (route mode: direct; see ops/bindings/vpn.provider.yaml)"

  # Enhancement services
  bazarr-dl:
    vm: download-stack
    port: 6767
    health: /ping
    status: parked
    category: enhancement
    description: "Subtitle management (download instance, currently inactive)"

  trailarr:
    vm: download-stack
    port: 7667
    health: null
    health_reason: auth_gated
    status: active
    category: enhancement
    description: "Trailer management"

  posterizarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: enhancement
    description: "Poster art management"

  unpackerr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "Archive extraction for downloads"

  recyclarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "TRaSH guide sync (cron-triggered, no daemon)"

  flaresolverr:
    vm: download-stack
    port: 8191
    health: /health
    status: active
    category: utility
    description: "Cloudflare challenge solver"

  # Experimental services
  autopulse:
    vm: download-stack
    port: 2875
    health: null
    health_reason: localhost_bound
    status: active
    category: experimental
    description: "Library refresh trigger for Jellyfin (cross-VM)"

  crosswatch:
    vm: download-stack
    port: 8787
    health: null
    health_reason: localhost_bound
    status: active
    category: experimental
    description: "Cross-service watch sync"

  decypharr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: experimental
    description: "Real-Debrid integration"

  # Swaparr instances (stalled download swappers)
  swaparr-radarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Deprecated 2026-03-01; disabled during API-key rotation stabilization"

  swaparr-sonarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Deprecated 2026-03-01; disabled during API-key rotation stabilization"

  swaparr-lidarr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: utility
    description: "Deprecated 2026-03-01; disabled during API-key rotation stabilization"

  arr-native-search:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "Native ARR missing-search scheduler (movies/episodes/albums)"

  # VPN infrastructure
  gluetun:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: infrastructure
    description: "Privado VPN tunnel container for media P2P lane (authoritative policy in ops/bindings/vpn.provider.yaml)"

  # Parked services (intentionally stopped)
  tdarr:
    vm: download-stack
    port: 8265
    health: /
    status: parked
    category: parked
    description: "Transcode automation (soak period)"

  slskd:
    vm: download-stack
    port: 5030
    health: null
    health_reason: vpn_network_mode
    status: active
    category: download
    description: "Soulseek client (route mode: via_tunnel -> gluetun)"
    dependencies: [gluetun]

  soularr:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: utility
    description: "Soulseek integration for Lidarr"
    dependencies: [lidarr, slskd]

  # Infrastructure
  crowdsec:
    vm: download-stack
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: infrastructure
    description: "Security monitoring"

  watchtower-download:
    vm: download-stack
    container: watchtower
    port: null
    health: null
    health_reason: no_http_port
    status: active
    category: infrastructure
    description: "Auto-update utility"

  download-node-exporter:
    vm: download-stack
    container: node-exporter
    port: 9100
    health: /
    status: active
    category: infrastructure
    description: "Host metrics exporter for Prometheus"

  # ════════════════════════════════════════════════════════════════════════
  # Compatibility inventory key: streaming-stack
  # Active read-side surface now lives on media-home VM 106.
  # ════════════════════════════════════════════════════════════════════════

  # Video streaming
  jellyfin:
    vm: streaming-stack
    active_surface: media-home
    port: 8096
    health: /health
    status: active
    category: streaming
    description: "Canonical home video streaming server"
    critical: true

  # Music streaming
  navidrome:
    vm: streaming-stack
    active_surface: media-home
    port: 4533
    health: /ping
    status: active
    category: streaming
    description: "Canonical home music streaming server"

  # Request management
  jellyseerr:
    vm: streaming-stack
    active_surface: media-home
    port: 5055
    health: /api/v1/status
    status: active
    category: requests
    description: "Canonical home request management surface"

  # Subtitles
  bazarr:
    vm: streaming-stack
    active_surface: media-home
    port: 6767
    health: /ping
    status: parked
    category: enhancement
    description: "Subtitle management (defined on home plane, intentionally not promoted yet)"

  # Dashboard
  homarr:
    vm: streaming-stack
    active_surface: media-home
    port: 7575
    health: /
    status: active
    category: dashboard
    role: operator-dashboard
    description: "Canonical home media dashboard"

  # User management
  wizarr:
    vm: streaming-stack
    active_surface: media-home
    port: 5690
    health: /
    status: active
    category: user-mgmt
    description: "Canonical home media invitation management"

  # Music sync
  spotisub:
    vm: streaming-stack
    active_surface: media-home
    port: 8766
    health: /api/v1/utils/healthcheck
    status: parked
    category: enhancement
    description: "Spotify-to-Navidrome sync (defined on home plane, not promoted in boring soak)"

  subgen:
    vm: streaming-stack
    active_surface: media-home
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: enhancement
    description: "AI subtitle generation for Jellyfin (left off in boring baseline)"

  # Infrastructure
  watchtower-streaming:
    vm: streaming-stack
    active_surface: media-home
    container: watchtower
    port: null
    health: null
    health_reason: no_http_port
    status: parked
    category: infrastructure
    description: "Auto-update utility (disabled for boring baseline)"

  streaming-node-exporter:
    vm: streaming-stack
    active_surface: media-home
    container: node-exporter
    port: 9100
    health: /
    status: parked
    category: infrastructure
    description: "Host metrics exporter for Prometheus (not part of current boring baseline)"

# Jellyfin plugins (active home media plane; inventory key retained under streaming-stack compatibility)
jellyfin_plugins:
  repositories:
    - name: "IAmParadox"
      url: "https://www.iamparadox.dev/jellyfin/plugins/manifest.json"
    - name: "Auto Collections (KeksBombe)"
      url: "https://raw.githubusercontent.com/KeksBombe/jellyfin-plugin-auto-collections/refs/heads/main/manifest.json"
    - name: "LizardByte"
      url: "https://app.lizardbyte.dev/jellyfin-plugin-repo/manifest.json"
  installed:
    - name: "Home Screen Sections"
      version: "2.5.2.0"
      status: active
      purpose: "Netflix-style home screen rows"
    - name: "Collection Sections"
      version: "2.3.5.0"
      status: active
      purpose: "Collection-driven library browsing"
    - name: "Auto Collections"
      version: "0.0.4.1"
      status: active
      purpose: "Automatic genre/decade/studio collections"

# Canonical VPN routing policy (see ops/bindings/vpn.provider.yaml)
vpn_policy:
  provider_binding: ops/bindings/vpn.provider.yaml
  tunnel_service: gluetun
  services:
    slskd:
      route_mode: via_tunnel
      tunnel_service: gluetun
    qbittorrent:
      route_mode: direct
      decision_gate: QB-VPN-ROUTE-001
    sabnzbd:
      route_mode: direct

# Port collision matrix (for D106 verification)
ports:
  download-stack:
    9696: prowlarr
    7878: radarr
    8989: sonarr
    8686: lidarr
    8080: sabnzbd
    8081: qbittorrent
    6767: bazarr-dl
    7667: trailarr
    8191: flaresolverr
    8265: tdarr  # parked
    5030: slskd  # via gluetun
    50300: slskd  # P2P listen port via gluetun
    2875: autopulse
    8787: crosswatch
    9100: download-node-exporter

  streaming-stack:
    8096: jellyfin
    4533: navidrome
    5055: jellyseerr
    6767: bazarr
    7575: homarr
    5690: wizarr
    8766: spotisub
    9100: streaming-node-exporter

# HA add-on overlap audit (for D110)
ha_overlaps:
  source_vm: 100  # homeassistant
  source_host: proxmox-home
  
  overlaps:
    - ha_addon: overseerr
      shop_service: jellyseerr
      shop_vm: streaming-stack
      active_surface: media-home
      shop_port: 5055
      recommendation: decommission
      reason: "jellyseerr on media-home is the canonical request manager; streaming-stack key retained for compatibility"

    - ha_addon: lidarr
      shop_service: lidarr
      shop_vm: download-stack
      shop_port: 8686
      recommendation: investigate
      reason: "may have different library config or be stale duplicate"

    - ha_addon: sonarr
      shop_service: sonarr
      shop_vm: download-stack
      shop_port: 8989
      recommendation: investigate
      reason: "may have different library config or be stale duplicate"

    - ha_addon: sabnzbd
      shop_service: sabnzbd
      shop_vm: download-stack
      shop_port: 8080
      recommendation: investigate
      reason: "may have different config or be stale duplicate"
