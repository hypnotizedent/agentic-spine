---
# Cross-Repo Authority Contract
#
# Defines which repo owns which data to prevent dual-truth drift.
# Agents MUST consult this before creating or modifying infrastructure data.
#
# Status: authoritative
# Last verified: 2026-05-01
# Created by: LOOP-INFRA-SSOT-ALIGNMENT-20260208 P2

status: authoritative
version: 2
updated_at: "2026-05-01"

repo_topology_rule:
  statement: >
    Repo placement is one-way: agentic-spine is the L1 kernel/control plane,
    workbench is the L2 shared operational rail home, unstable L3 domain bodies
    live in project homes, and stable product bodies live in product homes or
    explicitly named product repos. Generated projections may cross boundaries;
    hand-maintained authority must have exactly one home.
  generated_readback: "$SPINE_STATE/domain-state/REPO_TOPOLOGY_DOMAIN_SURFACE_INVENTORY.yaml"
  hand_yaml_rule: "Hand-authored YAML is valid only when it is the actual authority contract; factual projections must be generated from a living authority."
  forbidden:
    - "Do not use workbench as a dumping ground for L3/product bodies."
    - "Do not create repo-local governance bindings outside agentic-spine."
    - "Do not treat generated projections or runtime configs as peer authority."
    - "Do not create a parallel ronny-products or ronny-projects tree as product authority."

repos:
  agentic-spine:
    path: "~/code/agentic-spine"
    repo_class: "L1_control_plane"
    role: "Governance authority — kernel protocol, canonical L1/L2 contracts, readbacks, verify, loop/packet/receipt state"
  workbench:
    path: "~/code/workbench"
    repo_class: "L2_shared_operational_rails"
    role: "Shared operational rails, reusable adapters, generators, validators, dotfiles, and runtime materializations. Not a default home for L3/product bodies."
  mint-modules:
    path: "~/code/mint-modules"
    repo_class: "product_home"
    role: "Canonical Mint product/module home — owns Mint product code, schema, API specs, Dockerfiles, runtime contracts, and product-local operational scripts. Spine keeps thin registry/readback pointers only."
  ronny-products:
    path: "~/code/ronny-products"
    repo_class: "legacy_decomposed_product_scaffold"
    role: "Historical standalone-product scaffold repo. Decomposed 2026-05-02 into ~/code/projects/<id>; no new product or project authority may be added here."

placement_classes:
  L1_control_plane:
    canonical_home: "agentic-spine"
    allowed_contents:
      - "kernel protocol and current aperture"
      - "canonical L1/L2 contracts"
      - "thin capability registry/readback pointers"
      - "verify and receipt machinery"
      - "generated repo-topology/domain-surface inventory"
    forbidden_contents:
      - "L3 product implementation bodies"
      - "domain app policy that is not an L1/L2 contract"
      - "hand-maintained factual projections"
  L2_shared_operational_rails:
    canonical_home: "workbench"
    allowed_contents:
      - "shared reusable agent rails"
      - "cross-workload adapters and generators"
      - "operator dotfiles/runtime materializations"
      - "validators and reusable tooling"
    forbidden_contents:
      - "unstable L3 project bodies without an extraction path"
      - "stable product source of truth"
      - "new governance bindings"
  L3_project_body:
    canonical_home: "~/code/projects/<project>"
    current_status: "canonical plain placement home for unstable L3/domain/project bodies, including decomposed ronny-products children"
    allowed_contents:
      - "unstable domain/project implementation bodies"
      - "project-local experiments and product candidates"
    forbidden_contents:
      - "spine governance authority"
      - "shared L2 rails"
  product_home:
    canonical_homes:
      - "mint-modules"
      - "~/code/products/<product>"
    current_status: "mint-modules owns Mint product bodies; ~/code/products/<product> is the stable product home. ronny-products is legacy/decomposed evidence, not a product home."
    allowed_contents:
      - "stable product code"
      - "product-local contracts"
      - "product-local operational scripts"
    forbidden_contents:
      - "spine kernel/governance authority"
      - "shared L2 rails unless extracted as reusable workbench tooling"

# ─────────────────────────────────────────────────────────────
# Authority Map
# ─────────────────────────────────────────────────────────────
#
# authoritative = single source of truth; all other copies mirror it
# supporting    = may exist for operational convenience but is NOT authoritative
# sync_policy   = how supporting copies stay aligned

domains:

  device_identity:
    authoritative:
      repo: agentic-spine
      files:
        - "ops/bindings/ssh.targets.yaml"
        - "ops/bindings/vm.lifecycle.yaml"
        - "ops/bindings/hardware.inventory.yaml"
      read_model: "device.identity.readmodel.generate"
      convention_doc: "docs/governance/DEVICE_IDENTITY_SSOT.md"
    supporting:
      - repo: workbench
        file: "infra/data/CONTAINER_INVENTORY.yaml"
        note: "Observed runtime state; mirrors generated spine identity readback"
    sync_policy: "workbench mirrors spine generated/binding truth; spine never reads workbench for identity"

  service_registry:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/probe.registry.yaml"
    supporting:
      - repo: workbench
        file: "infra/data/probe.registry.yaml"
        note: "Legacy snapshot from pre-spine era; kept for reference"
    sync_policy: "workbench file is stale reference; spine is truth"

  ssh_targets:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/ssh.targets.yaml"
      note: "Governance-level SSH target definitions (host, user, tags)"
    related:
      - repo: workbench
        file: "dotfiles/ssh/config.d/tailscale.conf"
        note: "Generated/runtime SSH config installed on MacBook; it materializes governed SSH target truth for operator use."
    sync_policy: "ssh.targets.yaml is access-path source evidence. device.identity.readmodel.generate materializes ssh.access.projection.yaml; tailscale.conf is runtime materialization/projection and must be regenerated or reconciled from governed access evidence; it is not peer authority."

  docker_compose_targets:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/docker.compose.targets.yaml"
    supporting:
      - repo: workbench
        file: "infra/compose/*/docker-compose.yml"
        note: "Legacy compose files from pre-migration docker-host; kept as reference"
    sync_policy: "Live compose truth is on target host (/opt/stacks/). Workbench compose is legacy reference only."

  backup_inventory:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/backup.inventory.yaml"
    supporting:
      - repo: workbench
        file: "infra/data/backup_inventory.json"
        note: "Historical snapshot (stale, non-authoritative). Generating script (backup_audit.sh) retired 2026-04-27. Preserved as legacy reference only."
    sync_policy: "Spine is the single authority for backup state model and coverage. Workbench backup-plane/ owns implementation. The supporting JSON is stale historical residue, not actively generated."

  monitoring:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/services.health.yaml"
      note: "Will become authoritative when observability VM deployed"
    supporting:
      - repo: workbench
        file: "infra/data/monitoring_inventory.json"
        note: "Health endpoints, alert rules, notification channels"
    sync_policy: "Workbench has richer detail (alert rules, dashboards). Spine has governed health checks. Both maintained; endpoints must match."

  secrets_inventory:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/secrets.inventory.yaml"
    supporting:
      - repo: workbench
        file: "infra/data/secrets_inventory.json"
        note: "Detailed project structure, rotation policy, known issues"
    sync_policy: "Spine binding is governance (project IDs, lifecycle). Workbench JSON has operational detail. Both maintained."

  repo_topology:
    authoritative:
      repo: agentic-spine
      files:
        - "AGENTS.md"
        - "NORTH_STAR.md"
        - "docs/governance/SPINE.md"
        - "ops/bindings/cross-repo.authority.yaml"
      generated_readback: "$SPINE_STATE/domain-state/REPO_TOPOLOGY_DOMAIN_SURFACE_INVENTORY.yaml"
    related:
      - repo: workbench
        file: "AGENTS.md, README.md, WORKBENCH_CONTRACT.md"
        note: "Workbench declares its L2 shared-rail charter. It does not own repo placement authority."
      - repo: mint-modules
        file: "AGENTS.md, contracts/**, scripts/ops/**"
        note: "Existing canonical Mint product home."
      - repo: ronny-products
        file: "README.md, EXECUTION_BOARD.md"
        note: "Legacy/decomposed scaffold evidence. Child bodies moved to projects/<id> on 2026-05-02."
    sync_policy: >
      Spine owns the placement rule and generated inventory. Workbench owns
      reusable L2 rails. Product repos own stable product bodies. Project roots
      may hold unstable L3 bodies but must not become governance planes.

  mint_modules:
    authoritative:
      repo: mint-modules
      file: "<module>/README.md, <module>/SPEC.md, <module>/SCHEMA.md"
      note: "Each module owns its code, API spec, schema, and Dockerfile"
    related:
      - repo: agentic-spine
        file: "ops/bindings/probe.registry.yaml"
        note: "Spine owns service bindings (host, port, health, status)"
      - repo: agentic-spine
        file: "docs/governance/STACK_REGISTRY.yaml"
        note: "Spine owns stack inventory (compose paths, deploy method)"
      - repo: agentic-spine
        file: "ops/bindings/docker.compose.targets.yaml"
        note: "Spine owns deployment target paths (SSH host + compose location)"
    sync_policy: >
      mint-modules owns module code, specs, runtime contracts, and product-local
      operational scripts. Spine owns only thin governance/readback pointers
      needed for L1/L2 status, routing, secrets, backup, and placement. When a
      Mint capability is product behavior, implement it in mint-modules and
      keep the spine capability as a thin pointer or generated registry row.
      Deployment path on docker-host (~/artwork-module/) is NOT the source path
      (~/code/mint-modules/artwork/). Both must be documented.

  ronny_products:
    authoritative:
      repo: projects
      file: "<project>/app.contract.yaml"
      note: "~/code/projects/<id> is the canonical local home for decomposed ronny-products children: health, travel, investment, cc-benefits-tracker, vouchervault, and inbox-shield."
    related:
      - repo: ronny-products
        file: "README.md, EXECUTION_BOARD.md"
        note: "Historical/decomposed scaffold evidence only; do not add new children here."
      - repo: agentic-spine
        file: "ops/bindings/ronny.products.scaffold.contract.yaml"
        note: "Compatibility evidence for the old scaffold; not live product authority."
      - repo: agentic-spine
        file: "ops/bindings/service.onboarding.contract.yaml"
        note: "Spine owns service onboarding entries"
    sync_policy: "projects/<id> owns decomposed project code and contracts. Spine owns only placement/readback pointers. When a project stabilizes, promote deliberately to products/<id> or a named product repo; do not route new work through ronny-products."

  placement_policy:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/infra.placement.policy.yaml"
    supporting: []
    sync_policy: "Spine only. No workbench equivalent."

  naming_policy:
    authoritative:
      repo: agentic-spine
      file: "ops/bindings/naming.policy.yaml"
    supporting: []
    sync_policy: "Spine only. No workbench equivalent."

# ─────────────────────────────────────────────────────────────
# Agent Rules
# ─────────────────────────────────────────────────────────────

agent_rules:
  - "Before adding or moving repo content, read repo_topology in this contract and the generated REPO_TOPOLOGY_DOMAIN_SURFACE_INVENTORY readback."
  - "When adding a new host/VM: admit it through the first-class node/admission path, then regenerate or reconcile runtime SSH projections."
  - "When migrating a service: update the single authority home first, then regenerate supporting projections."
  - "When workbench and spine disagree on L1/L2 authority: spine wins. Workbench runtime materializations do not become peer authority."
  - "Never create new governance bindings in workbench — governance lives in spine"
  - "Workbench compose files are reference/legacy — live truth is on the target host"
  - "Workbench agents folders must be classified as L2 rail, L3 project body, product/pointer, generated projection, or stale residue before new work lands there."
  - "mint-modules owns Mint product code/specs/runtime scripts; spine keeps thin L1/L2 pointers only."
  - "Deployment path (docker-host:~/artwork-module/) != source path (~/code/mint-modules/artwork/). Document both."
  - "Do not add new product or project bodies to ronny-products; it is legacy/decomposed scaffold evidence."
  - "health, travel, investment, cc-benefits-tracker, vouchervault, and inbox-shield live under ~/code/projects/<id> until deliberately promoted."
  - "Use ~/code/projects only as a plain placement home for unstable L3 project bodies; do not make it a governance plane."
  - "Use ~/code/products only as a plain placement home for stable products not already covered by mint-modules or a named product repo."
  - "Do not create standalone product code under ~/code/ronny-projects or ~/code/ronny-products; those paths are compatibility residue, not authority."
  - "Do not hand-update factual YAML projections when a generator/readback can own the materialization."
