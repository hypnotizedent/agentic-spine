status: authoritative
owner: "@ronny"
last_verified: 2026-03-13
scope: mint-quote-packet-estimate

version: "1.0"
updated_at: "2026-03-13"

surface:
  capability: mint.quote.packet.estimate
  description: >
    Governed quote-estimation layer between supplier sourcing and exact
    production pricing. Produces recommended method, bounded decoration
    assumptions, per-line estimated unit price, confidence, and whether the
    quote is safe to communicate before production-final truth exists.

defaults:
  lead_time_days: 7
  setup_mode: new_setup
  screen_print_method_variant: standard
  transfer_type: dtf
  embroidery:
    default_thread_type: standard
    default_puff_mode: flat
    chest_stitch_count: 8000
    standard_stitch_count: 12000
    default_hoop_class: flat_hoop
  size_profiles:
    left_chest_standard:
      size_tier_label: small_print
      graphic_size_inches:
        width_in: 4.0
        height_in: 4.0
    standard_front_or_back:
      size_tier_label: standard_print
      graphic_size_inches:
        width_in: 10.0
        height_in: 12.0
    sleeve_standard:
      size_tier_label: standard_print
      graphic_size_inches:
        width_in: 3.5
        height_in: 14.0

method_rules:
  screen_print_min_qty: 24
  dtg_max_qty: 24
  embroidery_markers:
    - embroidery
    - embroidered
    - stitched
    - stitch
  transfer_markers:
    - transfer
    - transfers
    - dtf
    - heat transfer
    - heat press
  dtg_markers:
    - dtg
    - photo
    - portrait
    - memorial
    - gradient
    - full color
  reorder_markers:
    - same as last time
    - same as before
    - reorder
    - use the same
    - same logo
    - same art

garment_color_rules:
  light_tokens:
    - white
    - vintage white
    - cream
    - natural
    - sand
    - khaki
    - ash
    - light gray
    - athletic heather
    - pastel mint
    - mint
    - yellow
    - pink
  dark_tokens:
    - black
    - navy
    - dark heather
    - charcoal
    - maroon
    - forest
    - royal
    - purple
    - red
    - brown

artwork_rules:
  photo_markers:
    - photo
    - portrait
    - memorial
    - realistic
    - gradient
    - full color
  complex_graphic_markers:
    - graphic
    - featuring
    - illustration
    - scene
    - multicolor
    - multi-color
  simple_logo_markers:
    - logo
    - wordmark
  named_color_tokens:
    - white
    - black
    - orange
    - yellow
    - green
    - blue
    - navy
    - teal
    - red
    - maroon
    - pink
    - purple
    - gray
    - gold
    - silver

confidence_rules:
  explicit_fact: 3
  strong_inference: 2
  policy_default: 1
  unsupported_method: -3
  missing_customer_clarification: -3
  thresholds:
    high: 8
    medium: 5

status_model:
  estimate_ready:
    quote_safe_now: true
    description: Estimate can be communicated without additional customer clarification.
  clarification_needed:
    quote_safe_now: false
    description: Core customer-facing truth is still missing before an honest estimate can be communicated.
  production_only_exactness_missing:
    quote_safe_now: true
    description: Estimate is safe to communicate, but production-final pricing inputs are still assumed rather than exact.
