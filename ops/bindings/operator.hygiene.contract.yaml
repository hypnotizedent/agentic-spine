---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-21
scope: operator-hygiene-contract

version: 1
updated_at: "2026-03-21"

paths:
  archive_root: "~/Archives/tool-history"

tool_history:
  policies:
    - id: claude.session_env.empty
      status: active
      kind: empty_dir_prune
      root: "~/.claude/session-env"
      execute_by_default: true
      description: Remove empty Claude session env directories left behind after session teardown.
    - id: claude.debug.retention
      status: active
      kind: aged_file_delete
      root: "~/.claude/debug"
      retention_days: 30
      execute_by_default: true
      description: Delete Claude debug logs older than 30 days.
    - id: claude.file_history.retention
      status: active
      kind: aged_file_delete
      root: "~/.claude/file-history"
      retention_days: 30
      execute_by_default: true
      description: Delete Claude file-history snapshots older than 30 days.
    - id: claude.telemetry.retention
      status: active
      kind: aged_file_delete
      root: "~/.claude/telemetry"
      retention_days: 30
      execute_by_default: true
      description: Delete Claude telemetry artifacts older than 30 days.
    - id: claude.transcripts.retention
      status: active
      kind: aged_file_archive_delete
      root: "~/.claude/transcripts"
      retention_days: 30
      execute_by_default: true
      archive_prefix: "claude-transcripts"
      description: Archive Claude transcripts older than 30 days before deleting live copies.
    - id: claude.projects.retention
      status: active
      kind: aged_file_report
      root: "~/.claude/projects"
      retention_days: 30
      execute_by_default: false
      description: Report stale Claude project history older than 30 days; keep report-only because this is long-tail operator memory.
    - id: codex.sessions.retention
      status: active
      kind: month_dir_archive_delete
      root: "~/.codex/sessions"
      retention_days: 30
      execute_by_default: true
      archive_prefix: "codex-sessions"
      description: Archive completed monthly Codex session history older than 30 days before deleting live copies.

dev_artifacts:
  policies:
    - id: mint-modules.dev_artifacts
      status: active
      root: "~/code/mint-modules"
      generated_dir_names:
        - dist
        - build
        - .next
        - .turbo
        - coverage
        - .pytest_cache
        - __pycache__
      generated_retention_days: 14
      execute_generated_cleanup: true
      dependency_dir_names:
        - node_modules
      dependency_manifest_names:
        - package-lock.json
      dependency_strategy: report_only
      dependency_rehydrate_command: "npm ci"
      description: Mint modules are many standalone npm packages. Auto-clean only stale untracked generated outputs; keep node_modules report-only and rehydrate with npm per module when needed.
