# MEDIA PIPELINE & CONTAINER CONTRACT
# Status: authoritative
# Owner: "@ronny"
# Scope: How media flows, all containers, all configs
#
# OPERATOR DIRECTIVES:
# - Home (media-home VM 106) is the canonical pipeline host
# - ARR stack canonical = HOME. Old shop copies sit as parked residue.
# - NO FILE DELETES by terminals
#
# For what media lives where: ops/bindings/media.master.inventory.contract.yaml
# For per-title detail: ~/code/workbench/agents/media/data/MEDIA_LIBRARY_CATALOG.yaml

contract: MEDIA_PIPELINE_V1
version: "1.1"
created: "2026-03-24"
updated_at: "2026-03-24"
owner: "@ronny"
reconciliation_trace: "LOOP-PIPELINE-CONTRACT-RECONCILIATION-20260324 — verified against live docker compose ls + docker ps"

pipeline:
  canonical_flow:
    description: "request → grab → download → extract → import → library → client → archive"
    steps:
      1_request:
        service: jellyseerr
        port: 5055
        action: "User requests content via web UI"
      2_grab:
        service: "radarr | sonarr | lidarr"
        action: "Searches indexers via Prowlarr, grabs NZB/torrent"
      3_download:
        primary:
          service: sabnzbd
          protocol: usenet
          priority: 1
          categories: [tv, movies, audio]
          staging: /media/downloads/complete/{category}
        secondary:
          service: qbittorrent
          protocol: torrent
          priority: 2
          vpn: gluetun
          categories: [sonarr, radarr]
          staging: /media/downloads/complete/{category}
          enabled_in: [sonarr, radarr]
          disabled_in: [lidarr]
      4_extract:
        service: unpackerr
        action: "Extracts archives if needed. Monitors Radarr/Sonarr/Lidarr queues."
        watch_interval: 1m
        current_queue: "Radarr: 0, Sonarr: 557, Lidarr: 24"
        queue_status: "All items actively downloading or queued — no stuck extractions"
      5_import:
        service: "radarr | sonarr | lidarr"
        action: "Renames and hardlinks from download staging to library root"
        hardlink_enabled: true
        hardlink_note: "Broad /media mount enables hardlinks across downloads and library roots (same filesystem)"
      6_notify:
        service: autopulse
        port: 2875
        action: "Receives webhook from ARR, triggers Jellyfin/Navidrome library scan"
        current_status: fixed
        fixed_at: "2026-03-24"
        fix: "Path rewrites updated to identity (FROM=/media/tv TO=/media/tv) in media-stack compose"
      7_client:
        video: {service: jellyfin, port: 8096}
        music: {service: navidrome, port: 4533}
        action: "Serves content to user"
      8_archive:
        service: "operator-initiated rsync"
        scope: "Movies only, after watched"
        flow: "home NAS → md1400"
        automation: none
        note: "Operator moves on his word only. No automatic promotion."

  home_download_flow:
    description: "ARR canonical downloads — all new content"
    host: media-home
    vm_id: 106
    usenet:
      client: sabnzbd
      priority: 1
      categories: [tv, movies, audio]
      staging_paths:
        tv: /media/downloads/complete/tv
        movies: /media/downloads/complete/movies
        audio: /media/downloads/complete/audio
    torrent:
      client: qbittorrent
      priority: 2
      vpn: gluetun
      categories: [sonarr, radarr]
      staging_paths:
        sonarr: /media/downloads/complete/sonarr
        radarr: /media/downloads/complete/radarr

  shop_download_flow:
    description: "Alternative download plane — games, promoted blurays, special keeps"
    host: pve
    target: md1400
    path: /md1400/stage
    note: "Plumbing stays open. ARR does NOT use this path for new canonical content."

# Container inventory — 19 running + 10 parked on media-home (VM 106)
# Traced: 2026-03-24T20:53Z via docker compose ls + docker ps on ubuntu@10.0.0.106
# 2 active compose projects + 1 volume-only directory
containers:
  compose_stacks:
    - path: /srv/appdata/compose/media-stack/docker-compose.yml
      project_name: media-stack
      active: true
      services: 26  # 16 running, 10 parked
      role: "Main compose project — all core services"
    - path: /srv/appdata/compose/media-playback/docker-compose.yml
      project_name: media-playback
      active: true
      services: 2  # navidrome, spotisub
      role: "Supplemental streaming services"
    - path: /srv/appdata/compose/media-write/docker-compose.yml
      project_name: null  # exists on disk but NOT an active compose project
      active: false
      role: "Volume-only directory — config.xml and .env storage. No running containers."
      note: "API key extraction paths reference this directory — paths are correct."

  active:
    # Management (*arr stack)
    radarr:
      vm: media-home
      port: 7878
      status: running
      category: management
      health: healthy
      role: "Movie management. 1 movie tracked."
      dependencies: [prowlarr, sabnzbd, qbittorrent]

    sonarr:
      vm: media-home
      port: 8989
      status: running
      category: management
      health: healthy
      role: "TV management. 130 series, 72 with files, 2686 episodes on disk. Queue 0."
      dependencies: [prowlarr, sabnzbd, qbittorrent]

    lidarr:
      vm: media-home
      port: 8686
      status: running
      category: management
      health: healthy
      role: "Music management. 390 artists (219 with tracks, 20419 track files). Tri-source: SABnzbd (usenet), slskd/soularr (Soulseek), qBittorrent (torrent)."
      dependencies: [prowlarr, sabnzbd, qbittorrent]
      remote_path_mappings:
        - {host: sabnzbd, remote: "/downloads/", local: "/media/downloads/"}
        - {host: gluetun, remote: "/downloads/", local: "/media/downloads/"}
      note: "RPMs added 2026-03-24 — were missing, causing all imports to fail"

    prowlarr:
      vm: media-home
      port: 9696
      status: running
      category: indexing
      health: healthy
      role: "Indexer manager for all *arr services"

    # Download clients
    sabnzbd:
      vm: media-home
      port: 8080
      status: running
      category: download
      health: healthy
      role: "Primary usenet downloader"
      ingest_role: primary
      protocol: usenet

    qbittorrent:
      vm: media-home
      port: 8081
      status: running
      category: download
      health: healthy
      role: "Secondary torrent downloader. VPN-tunneled via gluetun. v5.1.4."
      ingest_role: secondary
      protocol: torrent
      network_mode: "container:gluetun"
      note: "Password set permanently 2026-03-24 (was generating temp passwords from stale PBKDF2 hash after v5 upgrade)"

    # Post-download automation
    unpackerr:
      vm: media-home
      port: null
      status: running
      category: utility
      health: operational
      compose_project: null  # STANDALONE — not in any compose project
      role: "Archive extraction. Monitors Radarr/Sonarr/Lidarr queues for completed downloads."
      note: "No HTTP port. Health inferred from log output."

    autopulse:
      vm: media-home
      port: 2875
      status: running
      category: utility
      health: healthy
      role: "Library refresh trigger via webhooks to Jellyfin/Navidrome. Actively processing — last log shows files being sent to targets."
      mount: "/srv/appdata/compose/media-write/volumes/autopulse -> /data"
      path_rewrites:
        radarr: {from: /media/movies, to: /media/movies, status: identity}
        sonarr: {from: /media/tv, to: /media/tv, status: identity}
        lidarr: {from: /media/music, to: /media/music, status: identity}
      fixed_at: "2026-03-24"
      fix_note: "Rewrites updated from stale narrow-mount paths to identity after broad-mount hardlink fix"

    # Streaming
    jellyfin:
      vm: media-home
      port: 8096
      status: running
      category: streaming
      health: healthy
      role: "Canonical home video streaming. Movies + TV libraries."
      libraries:
        - {name: Movies, path: /media/movies}
        - {name: TV Shows, path: /media/tv}
      critical: true

    navidrome:
      vm: media-home
      port: 4533
      status: running
      category: streaming
      health: healthy
      compose_project: media-playback
      role: "Canonical home music streaming"
      library_path: /music

    # Request management
    jellyseerr:
      vm: media-home
      port: 5055
      status: running
      category: requests
      health: healthy
      role: "Content request management UI"

    # Dashboard & user management
    homarr:
      vm: media-home
      port: 7575
      status: running
      category: dashboard
      health: healthy
      role: "Operator dashboard"

    wizarr:
      vm: media-home
      port: 5690
      status: running
      category: user-mgmt
      health: healthy
      role: "Media invitation management"

    # Infrastructure
    gluetun:
      vm: media-home
      port: null
      status: running
      category: infrastructure
      uptime: "47 hours"
      health: healthy
      role: "Privado VPN tunnel for qBittorrent + slskd"
      exposed_ports: [5030, 6881, 8081, 50300]

    crowdsec:
      vm: media-home
      port: null
      status: running
      category: infrastructure
      uptime: "38 hours"
      role: "Security monitoring"

  parked:
    # Stopped containers on media-home — intentionally not running
    recyclarr:
      vm: media-home
      status: stopped
      category: utility
      role: "TRaSH guide quality sync. Runs periodically, exits after sync."
      note: "Exited 5 days ago — may need scheduled re-run"

    bazarr:
