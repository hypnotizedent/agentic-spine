# Path authority reference — canonical mount topology
# Full detail: ops/bindings/media.path.authority.contract.yaml
path_topology:
  nfs_backing:
    source: "10.0.0.150:/volume1/media-staging"
    target: /srv/media
    mode: rw
    verified: true
  container_broad_mount:
    host_path: /srv/media
    container_path: /media
    enables: "Hardlinks across downloads and library roots (same mount ID)"
  library_mounts:
    movies: "/srv/media/movies → /media/movies (also /movies legacy narrow mount)"
    tv: "/srv/media/tv → /media/tv (also /tv legacy narrow mount)"
    music: "/srv/media/music → /media/music (also /music Navidrome narrow mount)"
  download_staging:
    host_path: /srv/media/downloads
    container_path: /media/downloads
    note: "Same broad mount as library roots — enables hardlinks on import"

# Config governance
config:
  recyclarr:
    source: "workbench:agents/media/config/recyclarr.yml"
    sync_cap: recyclarr.sync
    status: "Container exited 5 days ago — needs periodic re-run"
  quality_profiles:
    authority: ops/bindings/media.quality.policy.yaml
  import_lists:
    authority: ops/bindings/media.import.policy.yaml
  path_authority:
    authority: ops/bindings/media.path.authority.contract.yaml
  secrets:
    store: infisical
    project: media-stack
    api_keys: "Stored in container config.xml files at /srv/appdata/compose/media-write/volumes/{service}/config/config.xml"
    env_file_secrets:
      # CORRECTED 2026-03-24: ALL API keys live in media-stack/.env, not split across stacks.
      # media-playback/.env exists but does NOT contain JELLYFIN/JELLYSEERR keys.
      media_stack:
        path: "/srv/appdata/compose/media-stack/.env"
        keys: [RADARR_API_KEY, SONARR_API_KEY, LIDARR_API_KEY, PROWLARR_API_KEY, SABNZBD_API_KEY,
               JELLYFIN_API_TOKEN, JELLYSEERR_API_KEY,
               SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, LASTFM_API_KEY, LASTFM_SECRET,
               NAVIDROME_USERNAME, NAVIDROME_PASSWORD,
               PRIVADO_VPN_USER, PRIVADO_VPN_PASS, AUTOPULSE_PASSWORD]
        note: "Canonical source for ALL media API keys — injected into both media-stack and media-playback containers"
      media_playback:
        path: "/srv/appdata/compose/media-playback/.env"
        keys: []
        note: "Exists on disk but does NOT contain API keys. All keys are in media-stack/.env."
    infisical_note: |
      Infisical holds EXTERNAL secrets (Usenet provider credentials, VPN creds,
      Spotify API keys, etc). It does NOT hold ARR API keys — those are
      app-generated and stored in config.xml on disk. Do not look in Infisical
      for Radarr/Sonarr/Lidarr/Prowlarr API keys.
  # Canonical API key resolution — SSOT for any terminal needing media service keys.
  # Capability: media.api.resolve (ops/plugins/domains/media/bin/media-api-resolve)
  # Added 2026-03-24 by LOOP-INFISICAL-AUTH-CONFIG-PATH-AUDIT-20260324
  api_key_resolution:
    canonical_method: "config.xml extraction via SSH (ARR apps) or .env lookup (Jellyfin/Jellyseerr)"
    canonical_capability: "media.api.resolve"
    ssh_target: media-home
    note: |
      API keys for ARR apps are generated by the apps themselves and stored in
      their config.xml files. The canonical extraction pattern is:
        ssh ubuntu@<media-home> "sudo sed -n 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p' <config_xml_path>"
      All keys are also duplicated in /srv/appdata/compose/media-stack/.env for compose injection.
      Use media.api.resolve capability instead of manual extraction.
    config_xml_paths:
      radarr:   "/srv/appdata/compose/media-write/volumes/radarr/config/config.xml"
      sonarr:   "/srv/appdata/compose/media-write/volumes/sonarr/config/config.xml"
      lidarr:   "/srv/appdata/compose/media-write/volumes/lidarr/config/config.xml"
      prowlarr: "/srv/appdata/compose/media-write/volumes/prowlarr/config/config.xml"
    ini_paths:
      sabnzbd:  "/srv/appdata/compose/media-write/volumes/sabnzbd/config/sabnzbd.ini"
    env_keys:
      jellyfin:   "JELLYFIN_API_TOKEN in /srv/appdata/compose/media-stack/.env"
      jellyseerr: "JELLYSEERR_API_KEY in /srv/appdata/compose/media-stack/.env"
  backup:
    cap: media.backup.create
    scope: "All active container configs under /srv/appdata/compose/"
    retention: 7d

