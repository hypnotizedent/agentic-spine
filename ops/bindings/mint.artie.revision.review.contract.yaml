---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-13
scope: mint-artie-revision-review
version: 1

surface:
  capability: mint.artie.revision.review
  artie_terminal: MINT-ARTIE-01
  morpheus_terminal: MINT-MORPHEUS-01
  description: Review a revised proof/revision file against the requested change set, persist canonical review truth, and create the next Sheik handoff when the revision fails.

storage:
  reviews_records_root: "$SPINE_STATE/mint/artie-revision-reviews/records"
  reviews_index_file: "$SPINE_STATE/mint/artie-revision-reviews/index.ndjson"
  reviews_lock_file: "$SPINE_STATE/locks/mint-artie-revision-reviews.lock"
  sheik_records_root: "$SPINE_STATE/mint/sheik-revision-handoffs/records"
  sheik_index_file: "$SPINE_STATE/mint/sheik-revision-handoffs/index.ndjson"
  sheik_lock_file: "$SPINE_STATE/locks/mint-sheik-revision-handoffs.lock"
  evidence_root: "$SPINE_STATE/mint/artie-revision-reviews/evidence"

workflow:
  place_capability: mint.artwork.place
  artwork_preflight_capability: mint.artwork.preflight
  artwork_preflight_command: ops/plugins/domains/mint/bin/artwork-preflight
  default_vendor_identity: Sheik
  morpheus_boundary:
    owner_of_visual_truth: Artie
    owner_of_customer_coordination: Morpheus
  required_review_fields:
    - review_id
    - review_outcome
    - file_reviewed
    - artwork_preflight
    - requested_change_set
    - exact_miss
    - next_revision_instruction
    - canonical_file_refs
    - morpheus_reply_guidance

notes:
  - Morpheus should not decide proof correctness from raw visual files once Artie review truth exists.
  - When the review outcome is fail, create one governed Sheik-facing revision handoff with the exact miss and next instruction.
  - When the review outcome is pass, mark the file proof-ready for downstream mockup/proof preparation instead of asking the operator what to do next.
