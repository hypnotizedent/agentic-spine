targets:
  docker-host:
    ssh_target: docker-host
    connect_timeout_sec: 5
    enabled: false
    description: Tombstoned VM 200. Historical compose roots retained only for isolated
      restore/extraction work; there is no active docker-host runtime, deploy path,
      or recovery-startup target.
    stacks:
    - name: mint-os
      path: /home/docker-host/stacks/mint-os
    - name: mint-modules-prod
      path: /home/docker-host/mint-modules-prod
      legacy_only: true
      authoritative_runtime: false
  automation-stack:
    ssh_target: automation-stack
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: automation
      path: /home/automation/stacks/automation
    - name: mcpjungle
      path: /home/automation/stacks/mcpjungle
  infra-core:
    ssh_target: infra-core
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: cloudflared
      path: /opt/stacks/cloudflared
    - name: pihole
      path: /opt/stacks/pihole
    - name: secrets
      path: /opt/stacks/secrets
    - name: vaultwarden
      path: /opt/stacks/vaultwarden
    - name: caddy-auth
      path: /opt/stacks/caddy-auth
  observability:
    ssh_target: observability
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: prometheus
      path: /opt/stacks/prometheus
    - name: grafana
      path: /opt/stacks/grafana
    - name: loki
      path: /opt/stacks/loki
    - name: uptime-kuma
      path: /opt/stacks/uptime-kuma
    - name: node-exporter
      path: /opt/stacks/node-exporter
    - name: dashy
      path: /opt/stacks/dashy
  dev-tools:
    ssh_target: dev-tools
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: gitea
      path: /opt/stacks/gitea
  immich:
    ssh_target: immich
    connect_timeout_sec: 5
    enabled: true
    description: 'Immich photo management VM 203 (user=ronny). 4 containers: server,
      ML, postgres, redis.'
    stacks:
    - name: immich
      path: ~/immich
  ai-consolidation:
    ssh_target: ai-consolidation
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: ai-consolidation
      path: /opt/stacks/ai-consolidation
  download-stack:
    ssh_target: download-stack
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: download-stack
      path: /opt/stacks/download-stack
  streaming-stack:
    ssh_target: streaming-stack
    connect_timeout_sec: 5
    enabled: true
    stacks:
    - name: streaming-stack
      path: /opt/stacks/streaming-stack
  finance-stack:
    ssh_target: finance-stack
    connect_timeout_sec: 5
    enabled: true
    description: "Finance stack VM 211 (Firefly III, Ghostfolio, Paperless-ngx, VoucherVault).\
      \ Mail-archiver is migration_source \u2014 canonical runtime now on communications-stack\
      \ VM 214."
    stacks:
    - name: finance
      path: /opt/stacks/finance
    - name: vouchervault
      path: /opt/stacks/vouchervault
  mint-data:
    ssh_target: mint-data
    connect_timeout_sec: 5
    enabled: true
    description: Mint data plane VM 212 (fresh-slate). PostgreSQL 16 + MinIO + Redis.
    stacks:
    - name: mint-data
      path: /opt/stacks/mint-data
  mint-apps:
    ssh_target: mint-apps
    connect_timeout_sec: 5
    enabled: true
    description: 'Mint app plane VM 213 (fresh-slate). Service stacks: files-api,
      quote-page, order-intake, finance-adapter, pricing, suppliers, shipping, payment.'
    stacks:
    - name: mint-apps
      path: /opt/stacks/mint-apps
    - name: payment
      path: /opt/stacks/mint-apps/payment
    - name: pricing
      path: /opt/stacks/mint-apps/pricing
    - name: suppliers
      path: /opt/stacks/mint-apps/suppliers
    - name: shipping
      path: /opt/stacks/mint-apps/shipping
  communications-stack:
    ssh_target: communications-stack
    connect_timeout_sec: 5
    enabled: true
    description: Communications stack VM 214 (Stalwart self-hosted mail + mail-archiver).
      Canonical mail-archiver runtime (LOOP-MAIL-ARCHIVER-COMMS-MIGRATION-20260225).
    stacks:
    - name: communications-stack
      path: /opt/stacks/communications-stack
    - name: mail-archiver
      path: /opt/stacks/communications-stack
  surveillance-stack:
    ssh_target: surveillance-stack
    connect_timeout_sec: 5
    enabled: true
    description: Surveillance stack VM 215 (Frigate + bundled go2rtc). Current live
      compose authority is /home/ubuntu/surveillance; migration back to /opt/stacks/surveillance
      remains follow-up work.
    stacks:
    - name: surveillance
      path: /home/ubuntu/surveillance
  vaultwarden-home:
    ssh_target: infra-core
    connect_timeout_sec: 10
    enabled: false
    description: DECOMMISSIONED. Vaultwarden (home VM 102). Superseded by infra-core.
      ssh_target normalized to existing canonical target for lifecycle parity.
    stacks:
    - name: vaultwarden
      path: /home/ron/vaultwarden
