      meaning: "The governing authority surface — loops, attestation, execution dispatch, gate evaluation."
      status: canonical
      note: "Real. Carried by operator_console today, may migrate to control_node later."
    storage_plane:
      meaning: "Concrete logical storage layer across physical boundaries."
      status: canonical
      canonical_home: "ops/bindings/storage.scaffold.authority.yaml"
      note: "Real. Examples: backup_primary, archive_cold, intake_stage, personal_live, tombstone_retained."
    truth_plane:
      meaning: "One of four non-isomorphic truth surfaces — governance, inventory, verify, execution-evidence."
      status: named_gap
      note: "Named in SPINE_TRANSLATION_GAP_FORENSIC_TRACE. Four planes lack shared vocabulary."
    evidence_plane:
      meaning: "Hypothetical cross-object evidence system."
      status: deferred
