# ═══════════════════════════════════════════════════════════════════════════
# 9. PARKED
# ═══════════════════════════════════════════════════════════════════════════

parked:
  disease: >
    "parked" meant 7 different things across 7 surfaces: scheduler state,
    inbox item state, completion-state classification, git branch namespace,
    git stash prefix, runtime artifact lifecycle, and handoff lane state.
    Only one class (runtime artifact) has governed lifecycle fields.
    The rest are informal pauses with no trigger, review, or expiry.
  canonical_term: parked
  canonical_prose_term: parked
  canonical_authority: "parked.list capability + parked item lifecycle model"
  parked_classes:
    scheduler_parked:
      meaning: "Workload disabled in launchd.scheduler.registry.yaml."
      surface: "launchd.scheduler.registry.yaml state: parked"
      governance: minimal
    inbox_parked:
      meaning: "Intake envelope deferred in mailroom inbox."
      surface: "mailroom/inbox/ joined-state inbox_lanes.parked"
      governance: minimal
    completion_state_parked:
      meaning: "Work item classified as paused by completion.state.reconcile."
      surface: "completion_state_reconciler.py output"
      governance: minimal
    git_branch_parked:
      meaning: "Code snapshot in parked/* branch namespace."
      surface: "git branches matching parked/*"
      governance: naming_convention_only
    git_stash_parked:
      meaning: "Dirty-state snapshot with PARKED: prefix."
      surface: "git stash messages"
      governance: naming_convention_only
    runtime_artifact_parked:
      meaning: "Research or planning deferred with explicit triggers, review, retirement."
      surface: "domain-state artifacts with parked_lifecycle block"
      governance: governed
      note: "Only class enumerated by parked.list capability."
    handoff_lane_parked:
      meaning: "Handoff in parked_lane state."
      surface: "handoff.config.yaml parked_lane"
      governance: minimal
  lifecycle_model:
    applies_to: runtime_artifact_parked
    required_fields:
      - item_id
      - parked_at
      - reason
      - trigger_or_review_condition
      - expiry_or_retirement_rule
    statuses:
      - "parked — active pause"
      - "reactivated — trigger fired, work resumed"
      - "retired — explicitly closed without reactivation"
      - "expired — expiry reached without reactivation"
  deprecated_terms:
    - "bare parked without lifecycle fields for runtime artifacts"
  compatibility_terms:
    - "parked in AGENTS.md aperture text"
    - "parked.list capability"
  current_usages:
    capability_descriptions:
      note: "parked.list exists as a capability. No collision."
    bindings:
      - "launchd.scheduler.registry.yaml — state: parked on 3+ workloads"
      - "handoff.config.yaml — parked_lane state"
      - "parked item model — 7-field, proved by Packet 31"
    governance_docs:
      - "AGENTS.md — mentions parked material"
      - "docs/governance/SESSION_PROTOCOL.md — defines 6 parked classes"
  allowed_uses:
    - "parked as governed lifecycle state with required fields"
    - "parked.list capability"
    - "parked in AGENTS.md aperture rules"
    - "state: parked in scheduler registry"
    - "parked/* git branch namespace"
  forbidden_uses:
    - "parked without trigger/review/expiry for runtime artifacts — soft graveyard"
    - "parked as synonym for deferred or shelved — those are human_intent_object statuses"
    - "new parked items without the 7-field model"
  migration_priority: P3
  next_migration:
    target: none_immediate
    note: >
      Parked lifecycle model exists but only governs 1 of 7 classes.
      The remaining 6 classes are real but scattered with inconsistent
      governance. This is an enforcement gap, not a vocabulary gap.
      A parked.lifecycle.contract.yaml could unify all 7 classes but
      is not urgent — the word means the same thing across classes.

