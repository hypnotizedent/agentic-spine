# 4. REVIEW
# ═══════════════════════════════════════════════════════════════════════════

review:
  disease: >
    "review" meant bundle review, code review, evidence review, and media
    quarantine review. The word appeared without distinguishing which review
    system was meant.
  canonical_terms:
    bundle_review:
      meaning: "Governed intake review of human steward bundles via bundle.review capability."
      canonical_home: "bundle.review capability"
      status: first_class
    evidence_review:
      meaning: "Structured review metadata from bundle.review with source_files, actor_source, claim_summary."
      canonical_home: "evidence review bundle readback — cockpit Evidence Reviews section"
      status: first_class
      note: "Evidence plane itself is deferred — see evidence entry."
    code_review:
      meaning: "External process. Not a spine concept."
      status: not_spine_vocabulary
    media_quarantine_review:
      meaning: "L3 domain capability for media quarantine inspection."
      canonical_home: "media.quarantine.review capability"
      status: l3_domain
  deprecated_terms: []
  compatibility_terms: []
  current_usages:
    capability_descriptions:
      count: 3
      examples:
        - "bundle.review — Non-authoritative review engine"
        - "media.quarantine.review — Read-only review of the media quarantine tier"
        - "intake.scaffold — optional review task enqueue"
    bindings:
      - "evidence review bundle readback — cockpit surface"
  allowed_uses:
    - "bundle.review as capability name"
    - "media.quarantine.review as L3 capability name"
    - "review in intake.scaffold context — refers to bundle.review"
    - "evidence review bundle — structured metadata from bundle.review"
  forbidden_uses:
    - "review implying an evidence plane that does not exist yet"
    - "review as a standalone governance concept without qualifying which review"
    - "new review capabilities without declaring which review class they serve"
  migration_priority: P3
  next_migration:
    target: none_immediate
    note: >
      The bundle.review / evidence review bundle / media.quarantine.review
      split is already clear in capability names. No active collision.

