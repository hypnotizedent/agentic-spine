evidence:
  disease: >
    "evidence" appeared as the deferred evidence plane, evidence review
    bundles, and general proof artifacts. The word implied a system that
    was never built.
  canonical_terms:
    evidence_as_proof:
      meaning: "Receipts, gate results, commit SHAs, and governed artifacts that prove work happened."
      status: canonical_usage
      note: "This is the real meaning — governed proof artifacts."
    evidence_review_bundle:
      meaning: "Structured metadata from bundle.review."
      canonical_home: "bundle.review capability output"
      status: first_class
    evidence_plane:
      meaning: "A hypothetical cross-object evidence system."
      status: deferred
      trigger_rule: >
        Do not build until existing lifecycle/authority/readback surfaces
        can no longer answer evidence questions. Five triggers defined in
        project_evidence-plane-trigger-rule-20260427.md.
  deprecated_terms:
    - "evidence plane as if it exists today"
  compatibility_terms:
    - "storage_evidence_node — node type in node.role.contract.yaml, means durable state owner"
    - "evidence_path — field in execution_receipt message type"
    - "ops/plugins/core/evidence/ — plugin directory housing bundle.review"
  current_usages:
    capability_descriptions:
      count: 4
      examples:
        - "bundle.review — Emits governed review artifact under evidence root"
        - "controller_prompt.amend — evidence refs are supplied"
        - "host.operator-hardware.readiness — evidence collection"
        - "wave.execute.collect — Collect governed wave evidence"
    bindings:
      - "ops/bindings/node.role.contract.yaml — storage_evidence_node"
      - "ops/bindings/actor.boundary.contract.yaml — evidence_path in execution_receipt"
    path_names:
      - "ops/plugins/core/evidence/ — bundle.review lives here"
      - "$SPINE_STATE/evidence/ — runtime evidence root"
  allowed_uses:
    - "evidence meaning governed proof artifacts like receipts, gate results, SHAs"
    - "storage_evidence_node as node type"
    - "evidence_path as receipt field"
    - "evidence root as runtime path"
    - "evidence review bundle as bundle.review output"
  forbidden_uses:
    - "evidence plane in new contracts or descriptions — it does not exist"
    - "new capabilities that assume cross-object evidence queries exist"
    - "evidence as a synonym for state or data"
  migration_priority: P3
  next_migration:
    target: none_immediate
    note: >
      Current usages are legitimate. The risk is future agents inferring
      an evidence plane from the word. The trigger rule in memory guards
      against premature construction.

