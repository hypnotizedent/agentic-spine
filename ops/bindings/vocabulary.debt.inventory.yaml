# ═══════════════════════════════════════════════════════════════════════════
# 11. NODE
# ═══════════════════════════════════════════════════════════════════════════

node:
  disease: >
    "node" meant physical machine, node type/role, translator_node, watcher_node,
    and graph/topology node. The word carried machine identity and role
    semantics simultaneously.
  canonical_terms:
    physical_node:
      meaning: "A physical or virtual machine in the estate."
      canonical_home: "ops/bindings/operator.hardware.inventory.yaml"
      status: canonical
    node_type:
      meaning: "A role classification for physical nodes — 6 types in node.role.contract.yaml."
      canonical_home: "ops/bindings/node.role.contract.yaml"
      status: canonical
      types:
        - operator_console
        - execution_host
        - "translator_node — compatibility, see translator entry"
        - verification_node
        - storage_evidence_node
        - watcher_node
    doctrine_node:
      meaning: "A node in the 7-node translator doctrine model."
      canonical_home: "docs/governance/TRANSLATOR_AUTHORITY_DOCTRINE_V1.md"
      status: historical_reference
      note: "The doctrine uses node for its analytical model. Not machine identity."
  deprecated_terms:
    - "translator_node as active concept — compatibility only until membrane runtime exists"
    - "control_node — taxonomy only, never promoted, never materialized"
  compatibility_terms:
    - "translator_node in node.role.contract.yaml"
    - "watcher_node — realized, not deprecated"
    - "storage_evidence_node — canonical"
  current_usages:
    capability_descriptions:
      note: "node.recovery.status uses node correctly for physical node recovery. No ambiguity."
    bindings:
      - "ops/bindings/node.role.contract.yaml — 6 node types"
      - "ops/bindings/operator.hardware.inventory.yaml — physical nodes"
    governance_docs:
      - "docs/governance/TRANSLATOR_AUTHORITY_DOCTRINE_V1.md — 7-node model"
      - "docs/governance/NODE_PROMOTION_LADDER.md"
  allowed_uses:
    - "physical node — machine identity from inventory"
    - "node type — role classification from node.role.contract.yaml"
    - "watcher_node, execution_host, etc. as canonical type names"
    - "node in doctrine model context — historical reference"
  forbidden_uses:
    - "translator_node in new contracts — use membrane vocabulary"
    - "control_node as if it exists — it is taxonomy only"
    - "node carrying role semantics outside node.role.contract.yaml"
    - "bare node when the sentence means machine — use host or machine"
  migration_priority: P2
  next_migration:
    target: "node.role.contract.yaml vocabulary alignment"
    action: >
      translator_node description says Translator membrane — this is the
      vocabulary collision. The type name stays for compatibility but the
      description should lead with membrane not translator membrane.
    follow_on:
      - "Ensure fresh terminal context loading teaches membrane vocabulary for translator_node"

# ═══════════════════════════════════════════════════════════════════════════
# 12. COURTHOUSE
# ═══════════════════════════════════════════════════════════════════════════

courthouse:
  disease: >
    "courthouse" entered through human intent as a useful metaphor for the
    source authority surface, but it could be misread as a new subsystem, a
    node role, or a peer to Gitea/GitHub. Left loose, agents may create
    courthouse-specific readbacks instead of using the existing forge, project
    governance, platform control surface, and publication contracts.
  canonical_term: forge
  canonical_prose_term: forge
  compatibility_terms:
    - "courthouse — human-intent metaphor only"
    - "source_node — taxonomy/candidate vocabulary only"
  canonical_authority:
    - "ops/bindings/platform.control.surfaces.yaml — Gitea runtime/source authority surface"
    - "docs/core/PROJECT_GOVERNANCE_CONTRACT.md — repo remote authority policy"
    - "NORTH_STAR.md — distribution authority"
  collapsed_into:
    forge:
      meaning: "The source authority role: repos, commits, branches, tags, reviews, releases, and source-history accountability."
      status: canonical
    gitea:
      meaning: "The current runtime implementation of the forge."
      status: canonical_runtime_surface
    origin:
      meaning: "The canonical Git remote backed by Gitea."
      status: canonical_remote
    github:
      meaning: "Publication/distribution mirror only. Not authority for work, issues, pull requests, or runtime state."
      status: publication_only
    safe:
      meaning: "Secrets authority for secret values and token values. Forge may carry references, never values."
      canonical_home: "ops/bindings/secrets.namespace.policy.yaml"
      status: sibling_l2_authority
  deprecated_terms:
    - "courthouse as a new subsystem"
    - "courthouse as a runtime name"
    - "courthouse as a node role without promotion through node.role.contract.yaml"
    - "github as courthouse peer authority"
  current_usages:
    operator_ingress:
      - "$SPINE_STATE/inputs/operator-ingress/OI-20260430-041709-b611.yaml"
      - "$SPINE_STATE/inputs/operator-ingress/OI-20260430-043811-8f6e.yaml"
    state_specs:
      - "$SPINE_STATE/domain-state/spine/FORGE-COURTHOUSE-NODE-SPEC-20260430.md"
      - "$SPINE_STATE/domain-state/spine/L2-COURTHOUSE-SAFE-SPEC-20260430.md"
    repo_authority:
      - "README.md — explains metaphor to clone users"
      - "NORTH_STAR.md — maps courthouse to forge/Gitea/origin"
      - "docs/core/PROJECT_GOVERNANCE_CONTRACT.md — makes project remote policy unambiguous"
      - "ops/bindings/platform.control.surfaces.yaml — machine-readable source_authority role on gitea"
  allowed_uses:
    - "explaining human-origin metaphor in prose"
    - "historical state specs that preserve the original wording"
    - "compatibility vocabulary mapped immediately to forge/Gitea/origin"
  forbidden_uses:
    - "new capability IDs or gates named courthouse when forge/Gitea/source authority already fits"
    - "new courthouse folder, plane, node, or readback without explicit human-steward promotion"
    - "treating GitHub as a source authority peer"
    - "storing secret values in repos because the courthouse mentions tokens"
  migration_priority: P1
  next_migration:
    target: "fresh agent teaching surfaces and control-surface readback"
    action: >
      Teach courthouse as compatibility vocabulary only. Operational work must
      bind to forge/Gitea/origin for source truth, GitHub for publication, and
      Infisical/secrets for secret values.
    blast_radius: "prose/readback metadata only — no runtime, remote, token, branch, DNS, SSO, or node-role mutation"

