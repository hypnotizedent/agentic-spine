purpose: >
  Single visible map of semantic debt across the spine. Makes every vocabulary
  fix obvious by declaring canonical terms, deprecated terms, compatibility
  terms, where they still appear, and migration priority. This is a subtraction
  map, not a doctrine shelf.

# ─── HOW TO READ THIS INVENTORY ────────────────────────────────────────────
#
# Each entry declares:
#   canonical_term     — the preferred term in fresh prose and new surfaces
#   deprecated_terms   — terms that should not appear in new work
#   compatibility_terms — terms that may remain where schemas depend on them
#   current_usages     — where the term currently appears
#   allowed_uses       — where deprecated/compat terms may remain
#   forbidden_uses     — where deprecated terms must not appear
#   migration_priority — P1 > P2 > P3
#   next_migration     — the concrete next subtraction target
#
# Migration rule: capability descriptions first (fresh terminals read them),
# then contracts/docs, then IDs/paths (highest blast radius, last).

# ═══════════════════════════════════════════════════════════════════════════
# 1. OPERATOR
# ═══════════════════════════════════════════════════════════════════════════

operator:
  disease: >
    "operator" meant human, client surface, storage surface, ingress path,
    hardware class, and sometimes agent role. The word carried six meanings
    and fresh terminals could not distinguish authority from surface.
  canonical_term: human_steward
  canonical_prose_term: human steward
  canonical_authority: ops/bindings/actor.boundary.contract.yaml
  collapsed_into:
    human_steward:
      meaning: "The human steward. The person with authority. No AI session may hold this role."
      machine_id: human_operator
      prose_preference: human_steward
      status: canonical
    operator_console:
      meaning: "Node/client surface used by the human steward to admit and observe work."
      status: compatibility_machine_id
      long_term: "Keep only where it names the existing machine/client surface."
    operator_ingress:
      meaning: "Human-originated input path into the membrane."
      status: compatibility_machine_id
      long_term: "Rename only after active OI paths have a safe migration."
    agent_actor:
      meaning: "Any AI session under explicit role and custody rules."
      status: canonical
  deprecated_terms:
    - "bare operator when meaning human authority or identity"
    - "operator as agent role name"
  compatibility_terms:
    - "human_operator — schema field in actor.boundary.contract.yaml"
    - "operator_console — node type in node.role.contract.yaml"
    - "operator_ingress — capability prefix and OI file paths"
    - "operator.* capability names — 41 capabilities use operator prefix"
    - "operator.blueprint.admission.yaml"
    - "operator.hardware.inventory.yaml"
  current_usages:
    capability_descriptions:
      count: 1
      examples:
        - "provision.inventory.reconcile — operator.hardware.inventory.yaml compatibility filename"
      note: "Bare operator prose was removed from capability descriptions. Remaining description use names a compatibility filename."
    bindings:
      - "ops/bindings/actor.boundary.contract.yaml — canonical vocabulary home"
      - "ops/bindings/node.role.contract.yaml — operator_console node type"
      - "ops/bindings/operator.hardware.bootstrap.handoff.contract.yaml"
      - "ops/bindings/operator.hardware.bootstrap.usb.medium.contract.yaml"
      - "ops/bindings/operator.hygiene.contract.yaml"
      - "ops/bindings/operator.storage.surface.contract.yaml"
    governance_docs:
      - "AGENTS.md — uses human steward, correct"
      - "docs/governance/SESSION_PROTOCOL.md"
      - "docs/governance/TRANSLATOR_AUTHORITY_DOCTRINE_V1.md"
    path_names:
      - "ops/plugins/core/surface/ — operator cockpit and mobile"
      - "$SPINE_STATE/inputs/operator-ingress/"
  allowed_uses:
    - "human_operator as schema field where contracts already depend on it"
    - "operator_console as node type name in node.role.contract.yaml"
    - "operator_ingress as capability prefix until OI path migration"
    - "operator.* capability names — rename is P3, not next"
    - "operator in compound terms that name a surface like cockpit or hardware"
  forbidden_uses:
    - "bare operator in fresh capability descriptions when meaning human authority"
    - "operator implying an AI session can act as or become the operator"
    - "new contracts using operator without qualifying which collapsed term is meant"
  migration_priority: P2
  next_migration:
    target: contract_and_readback_prose
    action: >
      Replace remaining non-compatibility operator prose in contracts, docs,
      and readback text with human steward, operator_console, or operator_ingress
      as appropriate. No ID/path rename.
    prerequisites: capability_descriptions_complete
    blast_radius: "prose/readback strings only — no schema, no path, no ID change"

