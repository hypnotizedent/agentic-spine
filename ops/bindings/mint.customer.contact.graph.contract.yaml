status: authoritative
owner: "@ronny"
last_verified: 2026-03-13
scope: mint-customer-contact-graph

version: "1.0"
updated_at: "2026-03-13"
capability: mint.customer.contact.graph.set

storage:
  records_root: "$SPINE_STATE/mint/customer-contact-graph/records"
  index_file: "$SPINE_STATE/mint/customer-contact-graph/index.ndjson"
  lock_file: "$SPINE_STATE/mint/customer-contact-graph/.index.lock"
  matching_priority:
    - contact_email_exact
    - thread_participant_email_exact
    - company_domain_exact
    - company_exact

account_fields:
  - company_name
  - company_aliases
  - domains
  - operator_note

contact_fields:
  identity_fields:
    - legal_name
    - preferred_name
    - greeting_name
    - display_name
    - aliases
    - emails
  relationship_fields:
    - roles
    - relationship_status
    - confidence
    - operator_note

allowed_roles:
  - owner
  - approver
  - buyer
  - marketing
  - ops
  - billing

allowed_relationship_status:
  - active
  - historical
  - inactive

greeting_selection:
  direct_sender_roles:
    - buyer
    - marketing
    - owner
    - approver
  joint_ack_roles:
    - approver
    - owner
  cc_only_roles:
    - billing
  approval_markers:
    - final approval
    - approval
    - approved
    - approve
    - waiting on approval
    - need approval

nickname_integration:
  identity_contract: ops/bindings/mint.customer.identity.contract.yaml
  customer_facing_priority:
    - greeting_name
    - preferred_name
    - display_name_if_not_legal_name
  nickname_guessing_allowed: false

editing_rule:
  latest_matching_record_wins: true
  superseded_records_retained: true
