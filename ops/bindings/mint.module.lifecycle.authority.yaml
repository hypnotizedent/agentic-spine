discovery:
  mint_modules_repo: /Users/ronnyworks/code/mint-modules
  codebase_directory_structure: >
    Each module has its own directory with src/, docs/, docker-compose.yml,
    and module.contract.yaml. Code presence indicates future intent, not runtime state.

  runtime_deployment_surface: >
    Production deployment uses per-module docker-compose.yml files on VM 213.
    Only runtime_active modules are deployed. See mint.deploy.status capability.

agent_guidance:
  read_capability: mint.module.status.show
  lifecycle_query: >
    Use mint.module.lifecycle.authority.yaml to understand module classification.
    Do NOT assume code presence = runtime presence.

  when_to_use_projection_build: >
    Only for governed refresh of projection surfaces. Day-to-day reads should use
    mint.module.status.show which consumes the projection without triggering rebuild.

  runtime_vs_horizon: >
    runtime_active modules are in production and can be probed/tested.
    future_horizon modules exist in code but are not deployed.
    blocked_on_order_truth modules need order system contracts first. Read
    ops/bindings/mint.order.truth.authority.yaml before designing those modules.

contracts:
  authority_file: ops/bindings/mint.module.lifecycle.authority.yaml
  projection_consumer: ops/bindings/mint.module.status.projected.yaml
  vm_lifecycle_binding: ops/bindings/vm.lifecycle.yaml
  module_status_authority: ops/bindings/mint.module.status.authority.contract.yaml
  order_truth_authority: ops/bindings/mint.order.truth.authority.yaml
