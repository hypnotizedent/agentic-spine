# Mint Module Lifecycle Authority
# Status: authoritative
# Last verified: 2026-03-09
# Scope: mint-module-lifecycle-classification
#
# Purpose: Single source of truth for Mint module lifecycle state so agents
#          can distinguish runtime modules from future/blocked/deferred modules.
#          Code presence does NOT imply runtime presence.
#
# Rule: Every Mint module must have exactly one lifecycle state.
# Rule: Runtime projection surfaces only include runtime_active modules.
# Rule: Future/horizon modules remain discoverable but outside live deploy/proof.

version: 1
updated_at: "2026-03-09"
owner: "@ronny"
status: authoritative
scope: mint-module-lifecycle-classification

taxonomy:
  runtime_active:
    description: >
      Currently deployed and running on production app plane (VM 213).
      Included in runtime projection, health probes, and proof checks.
    inclusion_policy:
      runtime_projection: true
      health_probes: true
      proof_checks: true
      vm_lifecycle_services: true

  future_horizon:
    description: >
      Planned architecture with code present but not yet deployed.
      Not blocked on external dependencies; deployment is a timing decision.
    inclusion_policy:
      runtime_projection: false
      health_probes: false
      proof_checks: false
      vm_lifecycle_services: false

  blocked_on_order_truth:
    description: >
      High-value module blocked on order system canonical truth.
      Cannot deploy until order state/lifecycle contracts exist.
    inclusion_policy:
      runtime_projection: false
      health_probes: false
      proof_checks: false
      vm_lifecycle_services: false

  contract_only:
    description: >
      Shared library, package, or utility code. Not a deployable service.
      No runtime presence expected.
    inclusion_policy:
      runtime_projection: false
      health_probes: false
      proof_checks: false
      vm_lifecycle_services: false

  deferred:
    description: >
      Capability covered by other systems or not currently prioritized.
      Code may exist but deployment is not planned near-term.
    inclusion_policy:
      runtime_projection: false
      health_probes: false
      proof_checks: false
      vm_lifecycle_services: false

