  cold_shop.media_library:
    role: cold_retention_truth
    canonical_path: /md1400/archive/media-library
    entry_count: null
    default_action: protect

decision_defaults:
  downloads.incomplete: finish_then_import_or_purge
  downloads.complete.movies: delete_by_default_unless_explicit_keeper
  downloads.complete.tv: import_only_for_explicit_keep_allowlist_else_delete
  downloads.complete.music: delete_by_default_unless_explicit_artist_or_album_keep
