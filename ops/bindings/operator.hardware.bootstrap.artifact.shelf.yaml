status: authoritative
owner: "@ronny"
scope: operator-hardware-bootstrap-artifact-shelf
version: 1
updated_at: "2026-04-25"
last_verified: "2026-04-25"

# Operator Hardware Bootstrap Artifact Shelf
#
# Canonical artifact custody surface for Stage 0 operator-hardware bootstrap
# assets. This shelf stores bootstrap artifacts; it does not control first-touch
# boot on target devices.
#
# Scope:
# - Linux ISO/library references
# - rendered bootstrap kit manifests
# - rendered autoinstall payloads
# - checksum/provenance metadata
# - claim examples/templates and receipts
#
# This surface does NOT:
# - wipe or reimage any device
# - assign any role or host
#
# Note: remote boot control (virtual media + one-time boot) is now a
# separate governed rail: baremetal.idrac.first-touch. This shelf provides
# artifact custody; first-touch consumes artifacts from the shelf path.

subordinate_to: ops/bindings/root.authority.contract.yaml

related_contracts:
  - contract: ops/bindings/shop.storage.map.yaml
    relationship: "Canonical md1400 live-share/archive authority."
  - contract: ops/bindings/infra.storage.placement.policy.yaml
    relationship: "Declares archive-smb as the file-plane serving md1400 datasets."
  - contract: ops/bindings/ssh.targets.yaml
    relationship: "Canonical remote write path for pve custody host."
  - contract: ops/bindings/operator.hardware.bootstrap.handoff.contract.yaml
    relationship: "Stage 0 -> Stage 1 handoff object contract."

artifact_shelf:
  custody_host_ref: pve
  serving_host_ref: pve
  storage_plane_ref: pve-md1400
  canonical_root: /md1400/installer-images
  canonical_transport: nfs_from_pve_lan_to_bmc
  iso_library_ref: /md1400/installer-images
  served_surface_note: >
    Installer ISOs and images live on the durable md1400 ZFS dataset
    (/md1400/installer-images, dataset md1400/installer-images). One canonical
    home; no per-target subdirs. baremetal-idrac-first-touch sets up NFS exports
    on demand from the canonical path; pve-local /var/lib/vz/template/iso/ is
    Proxmox appliance default and is not authoritative for spine-governed
    bootstrap media. The dead /var/lib/vz/template/iso/r620 NFS export to
    idrac-r620 was retired 2026-05-02 along with its backing file (r620 was
    delivered months ago; the export was vestigial).
    archive-smb Samba export retired 2026-04-14 (no live consumers).

generated_runtime_staging:
  root: $SPINE_STATE/domain-state/generated/operator_hardware/bootstrap
  purpose: "Local/generated staging before publish to canonical shelf."

expected_layout:
  iso_library: iso/
  kits: kits/<device_id>/
  autoinstall: autoinstall/<device_id>/
  claims: claims/<device_id>/
  receipts: receipts/<device_id>/
  manifests: manifests/<device_id>/

required_metadata:
  - device_id
  - target_platform
  - bootstrap_method
  - target_distro
  - target_distro_version
  - provenance
  - rendered_at
  - checksum_sha256
  - shelf_publish_mode

truth_boundary:
  artifact_store_responsibilities:
    - retain canonical bootstrap artifacts
    - retain provenance and checksums
    - expose a stable shelf path for retrieval
  first_touch_boot_responsibilities:
    - baremetal.idrac.first-touch rail consumes ISOs from shelf and controls boot-prep
    - operator local-hands for non-iDRAC targets or when remote path is unavailable
  not_implied:
    - remote wipe
    - remote USB insertion
    - automatic machine boot (first-touch sets one-time boot, does not auto-cycle)
