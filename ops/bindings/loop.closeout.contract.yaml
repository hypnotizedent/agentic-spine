status: authoritative
version: "1.1"
updated: "2026-03-02"
owner: "@ronny"
scope: loop-closeout-finalization

validation:
  require_acceptance_pass: true
  run_key_regex: "^(CAP-[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+|S[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+)$"
  min_required_run_keys: 1

fix_to_lock:
  p0_p1_severities:
    - critical
    - high
  require_regression_lock_id: true
  require_evidence: true

protected_lanes:
  loops:
    - LOOP-MAIL-ARCHIVER-MICROSOFT-DEEP-IMPORT-20260226
  loop_prefixes:
    - LOOP-MD1400-
  gaps:
    - GAP-OP-973

propagation:
  require_for_landed: true
  surfaces:
    - "runtime: services/containers/hosts reflect the change"
    - "control_plane: bindings, contracts, SSOT docs updated"
    - "projections: docs, dashboards, gate registry current"
    - "residue: stale branches, worktrees, exports, mounts dispositioned"
  rule: "disposition: landed requires all propagation surfaces to agree. If any surface is incomplete, use deferred with a propagation_gap note."

closeout_receipts:
  # Canonical evidence root resolves per host via runtime-paths.sh:
  # pve canonical -> /md1400/spine/evidence/loop-closeouts; consumer hosts
  # project to ~/code/.evidence/spine/loop-closeouts. The literal Darwin path
  # was hardcoded historically and produced cross-host evidence split-brain.
  directory: $SPINE_LOOP_CLOSEOUTS_ROOT
  require_single_receipt_per_loop: true
