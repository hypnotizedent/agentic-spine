- vmid: 200
  hostname: docker-host
  tombstone_class: cold_restore_capsule
  hot_runtime_disk: vm-200-disk-0
  hot_runtime_disk_ref: local-lvm:vm-200-disk-0
  hot_runtime_disk_gb: 300
  hot_runtime_disposition: remove_from_hot_storage
  cold_restore_target: vm-200-docker-host-primary
  cold_restore_host: pve
  cold_restore_base_path: /md1400/backup-cold/vzdump/pve
  cold_restore_glob: vzdump-qemu-200-*.vma.zst
  cold_restore_enabled: false
  review_by: '2026-09-06'
  restore_name_prefix: vm200-restore-
  restore_requires_isolation: true
  restore_reuse_legacy_identity: false
  required_closeout_proof:
  - cold capsule exists on md1400
  - PVE config captured
  - artifact size or checksum recorded
  description: TOMBSTONED 2026-03-06 after Mint data/control-plane retirement. Do
    not retain as a powered-off runtime guest on pve; remove the live 300G VM disk
    from hot storage and keep exactly one cold restore capsule on md1400. Historically
    hosted mint-os, artwork-module, quote-page, minio, files-api, mint-os-postgres,
    and mint-os-redis on pre-spine Linux Mint. If recovery is needed, restore only
    into an isolated temporary sandbox identity with no legacy DNS/routes.
current_risks:
- risk_id: storage-automation-stack
  severity: medium
  runtime: automation-stack
  source: ops/bindings/infra.storage.placement.policy.yaml
  detail: Boot disk is ZFS-backed zvol (not local-lvm). Docker volumes still on boot
    filesystem. Consider data disk for n8n/postgres.
- risk_id: storage-infra-core
  severity: accepted-risk
  runtime: infra-core
  source: ops/bindings/infra.storage.placement.policy.yaml
  detail: 22% boot usage (11GB/48GB). Volumes only 250MB. Data on boot but lightweight
    (Infisical/Authentik/VW/PiHole). Log rotation added. Re-evaluate if usage exceeds
    60%.
- risk_id: storage-observability
  severity: accepted-risk
  runtime: observability
  source: ops/bindings/infra.storage.placement.policy.yaml
  detail: 20% boot usage (9.4GB/48GB). Volumes 1GB. Loki/Prometheus data small at
    current retention. Log rotation added. Re-evaluate if usage exceeds 60%.
- risk_id: storage-dev-tools
  severity: accepted-risk
  runtime: dev-tools
  source: ops/bindings/infra.storage.placement.policy.yaml
  detail: 14% boot usage (6.3GB/48GB). Volumes 183MB. Gitea repos + PostgreSQL small
    at current scale. Log rotation added. Re-evaluate if usage exceeds 60%.
