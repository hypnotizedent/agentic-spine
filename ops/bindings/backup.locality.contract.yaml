# Backup Locality Contract — Site-aware backup topology semantics
# Status: authoritative
# authority_state: authoritative
# authority_concern: topology_closure_surfaces
# Last verified: 2026-03-21
#
# Purpose: Prevents "backup is green but restore would fail because the
# data is on the wrong side of a WAN link." Every backup target gets an
# explicit locality class relative to its source, so relocation closure
# can verify that backup locality remains valid after a service moves.
#
# Authority chain:
#   backup.inventory.yaml   → backup targets, schedules, freshness
#   topology.sites.yaml     → site definitions
#   vm.lifecycle.yaml        → VM→site mapping
#   This file               → locality classification per target

version: 1
updated_at: "2026-03-21"
owner: "@ronny"
status: authoritative

# ═══════════════════════════════════════════════════════════════
# Locality Classes
# ═══════════════════════════════════════════════════════════════

locality_classes:
  local_hot:
    description: "Generator surface on the source hypervisor or same-host local storage"
    restore_speed: minutes
    survives_site_loss: false
    example: "/tank/backups/vzdump/dump on pve for shop VMs"

  same_site_cold:
    description: "Canonical durable backup on separate storage at the same site (md1400, Synology, NAS)"
    restore_speed: minutes_to_hours
    survives_site_loss: false
    example: "/volume1/backups/proxmox_backups/dump for home VMs or /md1400/backup-cold/vzdump/pve for shop VMs"

  offsite_warm:
    description: "Backup replicated to another site via Tailscale/network"
    restore_speed: hours
    survives_site_loss: true
    example: "Shop md1400 mirror of home media config-state archives"

  offsite_cold:
    description: "Cold archive at a remote site, not immediately restorable"
    restore_speed: hours_to_days
    survives_site_loss: true
    example: "Legacy Synology dump for decommissioned home VMs"

  archive_only:
    description: "Retained for compliance/forensic, not intended for restore"
    restore_speed: days
    survives_site_loss: true
    example: "VM 200 tombstone capsule on md1400"

# ═══════════════════════════════════════════════════════════════
# Backup Target Locality Assignments
# ═══════════════════════════════════════════════════════════════
