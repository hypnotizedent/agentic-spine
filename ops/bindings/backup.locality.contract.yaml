# ═══════════════════════════════════════════════════════════════
# Locality Invariants
# ═══════════════════════════════════════════════════════════════

invariants:
  - id: "Every active VM has at least one restoreable backup"
    check: "All active VMs in vm.lifecycle.yaml have a target_locality with locality != archive_only"

  - id: "Cross-site services have offsite backup coverage"
    check: "Services with cross-site dependency_edges should have at least one offsite_warm or offsite_cold locality"

  - id: "Relocation updates locality"
    check: "When a service moves cross-site, backup.locality must be reclassified"

  - id: "Tombstoned VMs use archive_only"
    check: "Decommissioned VMs with tombstone should have locality: archive_only"

# ═══════════════════════════════════════════════════════════════
# Restore Matrix
# ═══════════════════════════════════════════════════════════════
#
# For each locality class, what's the expected restore path?

restore_matrix:
  local_hot:
    restore_tool: qmrestore
    restore_source: "Generator surface on same hypervisor or source host"
    rto_target: "< 30 minutes"
    drill_cadence: quarterly
    drill_authority: ops/bindings/backup.schedule.yaml

  same_site_cold:
    restore_tool: qmrestore
    restore_source: "Same-site durable backup plane (Synology/NAS/md1400)"
    rto_target: "< 2 hours"
    drill_cadence: quarterly
    drill_authority: ops/bindings/backup.schedule.yaml

  offsite_warm:
    restore_tool: qmrestore
    restore_source: "Remote-site mirrored backup plane via Tailscale/network"
    rto_target: "< 4 hours"
    drill_cadence: quarterly
    drill_authority: ops/bindings/backup.schedule.yaml

  offsite_cold:
    restore_tool: manual
    restore_source: "Remote cold archive"
    rto_target: "< 24 hours"
    drill_cadence: annual
    drill_authority: null

  archive_only:
    restore_tool: qmrestore
    restore_source: "Cold capsule with isolation flag"
    rto_target: "best-effort"
    drill_cadence: none
    drill_authority: null
    note: "Restore only into isolated sandbox identity"
