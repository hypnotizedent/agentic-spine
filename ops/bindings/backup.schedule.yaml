# Status: authoritative
# Last verified: 2026-03-18

version: 1
updated_at: "2026-03-18"
owner: "@ronny"
scope: backup-schedule-v1
timezone: "America/New_York"

jobs:
  - id: pve-vzdump-daily
    enabled: true
    kind: vm-vzdump
    stack: backup
    host: pve
    schedule_cron: "0 2 * * *"
    schedule_class: daily-primary-est
    inventory_targets:
      - vm-202-primary
      - vm-203-primary
      - vm-204-infra-core-primary
      - vm-205-observability-primary
      - vm-206-dev-tools-primary
      - vm-207-ai-consolidation-primary
      - vm-209-download-stack-primary
      - vm-210-streaming-stack-primary
      - vm-211-finance-stack-primary
      - vm-212-mint-data-primary
      - vm-213-mint-apps-primary
      - vm-214-communications-stack-primary
      - vm-215-surveillance-stack-primary
      - lxc-220-archive-smb-primary
    retention: keep-last=2
    evidence_ref: /etc/pve/jobs.cfg
    note: "Canonical pve vzdump job backup-ronny-daily-2026-01-22. Docker-host VM 200 is excluded from active md1400 cold-sync governance."

  - id: backup-home-p0-daily
    enabled: true
    kind: vm-vzdump
    stack: home
    host: proxmox-home
    schedule_cron: "0 3 * * *"
    schedule_class: daily-home-primary-est
    inventory_target: home-vm-100-ha-primary
    vm_lifecycle_backup_target: home-vm-100-ha-primary
    retention: keep-last=3
    evidence_ref: /etc/pve/jobs.cfg
    note: "Canonical home vzdump job on proxmox-home. Logical row for VM 100 (homeassistant); underlying Proxmox job currently covers vmid 100,106."

  - id: backup-home-p0-daily-media-home
    enabled: true
    kind: vm-vzdump
    stack: home
    host: proxmox-home
    schedule_cron: "0 3 * * *"
    schedule_class: daily-home-primary-est
    inventory_target: home-vm-106-media-home-primary
    vm_lifecycle_backup_target: home-vm-106-media-home-primary
    retention: keep-last=3
    evidence_ref: /etc/pve/jobs.cfg
    note: "Logical media-home coverage row for proxmox-home job backup-home-p0-daily. Read-safe jobs.cfg showed vmid 100,106 under the same Proxmox job."

  - id: backup-home-p2-weekly
    enabled: true
    kind: vm-vzdump
    stack: home
    host: proxmox-home
    schedule_cron: "0 4 * * 0"
    schedule_class: weekly-est
    inventory_target: home-lxc-105-pihole-primary
    vm_lifecycle_backup_target: home-lxc-105-pihole-primary
    retention: keep-last=2
    evidence_ref: /etc/pve/jobs.cfg
    note: "Canonical home Pi-hole vzdump job to Synology-backed storage."

  - id: mint-postgres-pgdump-daily
    enabled: true
    kind: pg-dump
    stack: mint-data
    host: mint-data
    schedule_cron: "30 2 * * *"
    schedule_class: daily-primary-est
    container: mint-modules-postgres
    database: mint_modules
    output_dir: /mnt/backups/mint-postgres
    script_ref: /usr/local/bin/mint-postgres-backup.sh
    retention_days: 14
    inventory_targets:
      - app-mint-postgres
      - app-mint-postgres-manifest
    note: "Executed by /etc/cron.d/mint-data-backups as root. Canonical runtime replaced the legacy ubuntu user crontab because the backup stages under /mnt/backups and logs to /var/log."

  - id: mail-archiver-db-pgdump-daily
    enabled: true
    kind: pg-dump
    stack: communications-stack
    host: communications-stack
    schedule_cron: "0 3 * * *"
    schedule_class: daily-primary-est
    container: mail-archiver-db
    database: MailArchiver
    output_dir: /srv/mail-archiver/backups
    file_pattern: mail-archiver-db-<YYYYMMDDTHHMMSSZ>.sql.gz
    retention_days: 7
    note: "Executed by /etc/cron.d/communications-backups calling /usr/local/bin/mail-archiver-backup.sh as root (single script handles pg_dump + uploads + offsite verification)."

  - id: mail-archiver-uploads-snapshot-daily
    enabled: true
    kind: filesystem-tar
    stack: communications-stack
    host: communications-stack
    schedule_cron: "0 3 * * *"
    schedule_class: daily-primary-est
    source_dir: /srv/mail-archiver/uploads
    output_dir: /srv/mail-archiver/backups
    file_pattern: mail-archiver-uploads-<YYYYMMDDTHHMMSSZ>.tar.gz
    retention_days: 7
    note: "Executed by the same /etc/cron.d/communications-backups root job via /usr/local/bin/mail-archiver-backup.sh."

  - id: mail-archiver-restore-drill-monthly
    enabled: true
    kind: restore-drill
    stack: communications-stack
    host: communications-stack
    schedule_cron: "0 4 1 * *"
    schedule_class: monthly-drill-est
    capability_ref: communications.mailarchiver.restore.drill
    procedure_ref: ops/bindings/mail.archiver.backup.contract.yaml
    dry_run: false
    receipt_glob: mailroom/outbox/reports/restore-drills/communications-mailarchiver-restore-drill-*.yaml
    note: "Hybrid monthly drill on communications-stack: scratch schema/control-table restore + uploads extraction + ArchivedEmails artifact-count proof. PASS receipt is required for communications restore-green."

  - id: archive-smb-zfs-snapshot-daily
    enabled: true
    kind: zfs-snapshot
    stack: backup
    host: pve
    schedule_cron: "5 1 * * *"
    schedule_class: daily-primary-est
    script_ref: /usr/local/bin/archive-smb-snapshot
    retention_days: 14
    note: "Cron-managed on pve via /etc/cron.d/archive-smb-snapshot; protects md1400/ronny-projects and md1400/mint-legacy."

  - id: n8n-workflows-cold-sync-daily
    enabled: true
    kind: filesystem-tar
    stack: automation-stack
    host: automation-stack
    schedule_cron: "15 3 * * *"
    schedule_class: daily-config-est
    script_ref: /usr/local/bin/n8n-workflows-backup.sh
    retention_days: 14
    inventory_targets:
      - app-n8n-workflows
    note: "Runs after the local n8n snapshot export and syncs the latest workflow archive to md1400."

  - id: media-config-media-home-cold-sync-daily
    enabled: true
    kind: filesystem-tar
    stack: media-home
    host: media-home
    schedule_cron: "15 4 * * *"
    schedule_class: daily-config-est
    script_ref: /usr/local/bin/media-config-backup.sh
    retention_days: 14
    inventory_targets:
      - app-media-config-media-home
    note: "Root-owned host job on media-home. Canonical runtime is /etc/cron.d/media-config-backup calling /usr/local/bin/media-config-backup.sh to archive combined media-home config-state to Synology first, then mirror the latest artifact to md1400 as the secondary cold copy."

  - id: pve-vzdump-md1400-cold-sync-daily
    enabled: true
    kind: artifact-sync
    stack: backup
    host: pve
    schedule_cron: "30 8 * * *"
    schedule_class: daily-primary-est
    script_ref: /usr/local/bin/vzdump-md1400-cold-sync.sh
    retention_days: 2
    note: "Promotes latest successful pve vzdump artifacts from tank-backups into the md1400 canonical cold plane. Runtime should execute at low IO priority (ionice/nice)."

  - id: backup-monitor-hourly
    enabled: true
    kind: health-monitor
    stack: backup
    host: spine-control
    schedule_cron: "15 * * * *"
    schedule_class: hourly-monitor-est
    capability_ref: backup.monitor
    alert_on_degraded: true

  - id: media-config-restore-drill-monthly
    enabled: true
    kind: restore-drill
    stack: media-home
    host: media-home
    schedule_cron: "30 4 1 * *"
    schedule_class: monthly-drill-est
    capability_ref: media.config.restore.drill
    dry_run: false
    receipt_glob: mailroom/outbox/reports/restore-drills/media-config-restore-drill-*.yaml
    note: "Monthly drill covering media-home writer-plane (radarr) and playback-plane (jellyfin) config backups. PASS receipt required for media restore-green. Source archives are Synology-primary with md1400 secondary cold copy."

  - id: infisical-restore-drill-quarterly
    enabled: true
    kind: restore-drill
    stack: infra-core
    host: infra-core
    schedule_cron: "0 5 1 */3 *"
    schedule_class: quarterly-drill-est
    capability_ref: infra.infisical.restore.drill
    procedure_ref: ops/bindings/infisical.backup.contract.yaml
    dry_run: false
    receipt_glob: mailroom/outbox/reports/restore-drills/infra-infisical-restore-drill-*.yaml
    restore_class: tier1-small-state-governed-quarterly
    note: "Quarterly governed drill restores scratch database from cold storage and validates table/project/folder counts against canonical baseline."

  - id: home-restore-drill-quarterly
    enabled: true
    kind: restore-drill
    stack: home
    host: proxmox-home
    schedule_cron: "30 5 1 */3 *"
    schedule_class: quarterly-drill-est
    capability_ref: backup.home.restore.drill
    procedure_ref: ops/plugins/infra/backup/bin/backup-home-restore-drill
    dry_run: false
    receipt_glob: mailroom/outbox/reports/restore-drills/backup-home-restore-drill-*.yaml
    note: "Quarterly drill on proxmox-home: scratch restore of Pi-hole LXC 105 from Synology. PASS receipt required for home backup restore-green."

  - id: backup-shopvm-restore-drill-monthly
    enabled: true
    kind: restore-drill
    stack: backup
    host: pve
    schedule_cron: "0 5 2 * *"
    schedule_class: monthly-drill-est
    capability_ref: backup.shopvm.restore.drill
    procedure_ref: ops/plugins/infra/backup/bin/backup-shopvm-restore-drill
    dry_run: false
    receipt_glob: mailroom/outbox/reports/restore-drills/backup-shopvm-restore-drill-*.yaml
    note: "Monthly governed scratch restore drill for shop VM backups. Restores observability VM 205 from md1400 cold plane to scratch VMID 9205, verifies config materialization, and produces PASS/FAIL receipt."

references:
  contracts:
    - ops/bindings/backup.inventory.yaml
    - ops/bindings/vm.lifecycle.yaml
    - ops/bindings/mail.archiver.backup.contract.yaml
  closes_gaps:
    - GAP-OP-924
