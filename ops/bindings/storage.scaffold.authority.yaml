operator_blueprint_drains:
  - drain_id: OBD-STORAGE-SHARED-STORAGE-20260428
    source_ref: /Users/ronnyworks/Desktop/Archive/Shared storage.md
    applied_to:
      - ontology.classes.autonomous_local
      - surfaces.synology918:/volume1/backups/devices
    summary: Shared storage is not the default for autonomous nodes; local storage plus declared backup/recovery proof remains the boring default until cross-node state continuity is intentionally chosen.
    decision_boundary:
      local_storage_default_when:
        - node owns its workload and local state
        - node can be wiped, rebuilt, enrolled, and converged
        - data recovery is handled by declared backup/recovery subjects
      shared_storage_required_when:
        - workload must fail over elsewhere with the same live data
        - multiple nodes must read/write the same dataset
        - hypervisor live migration or clustered failover is an explicit requirement
    anti_drift:
      - Multiple autonomous nodes do not imply Ceph or shared block storage.
      - Backup/recovery strategy is the first-class storage answer for rebuildable systems.
      - Runtime device names and current child paths belong in evidence/readback, not this authority.
