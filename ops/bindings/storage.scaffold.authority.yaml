    blockers: ownership_and_restore_value_not_yet_reconciled
    source_refs:
      - docs/governance/SYNOLOGY_918_STORAGE_MANIFEST_V1.md
  - device: synology918
    path: /volume1/homelab/template
    scaffold_class: review_pending
    authority_state: stale_durable_weight
    retention_state: review_required
    canonicality: unknown
    detail: Old template lane with latest observed touch 2025-02-16T22:49:40Z and no 2026 writes observed.
    blockers: ownership_and_restore_value_not_yet_reconciled
    source_refs:
      - docs/governance/SYNOLOGY_918_STORAGE_MANIFEST_V1.md
