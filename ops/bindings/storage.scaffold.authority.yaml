    authority_state: mixed_old_weight
    retention_state: review_required
    canonicality: unknown
    detail: Homelab remains retained but unclassified. This wave did not touch the photo-cleanup subtree.
    blockers: photo_cleanup_subtree_explicitly_out_of_scope
    source_refs:
      - docs/governance/SYNOLOGY_918_STORAGE_MANIFEST_V1.md
  - device: synology918
    path: /volume1/homelab/images
    scaffold_class: review_pending
    authority_state: stale_durable_weight
    retention_state: review_required
    canonicality: unknown
