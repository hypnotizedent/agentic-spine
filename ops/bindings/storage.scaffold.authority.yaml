  description: Shared semantic scaffold for boring storage projection across shop and home planes.
  classes:
    - scaffold_class: backup_primary
      meaning: Canonical primary backup or restore authority for an active plane.
    - scaffold_class: backup_secondary
      meaning: Declared secondary or offsite backup copy; not the primary authority.
    - scaffold_class: archive_cold
      meaning: Canonical cold archive plane for retained payload.
    - scaffold_class: intake_stage
      meaning: Controlled staging or reconciliation lane with drain/expiry expectations.
    - scaffold_class: review_hold
      meaning: Explicit hold or review lane retained on purpose.
    - scaffold_class: tombstone_retained
      meaning: Retired non-canonical residue retained for review, extraction, or evidence.
    - scaffold_class: personal_live
      meaning: Active home-personal payload surface that remains canonical.
    - scaffold_class: review_pending
      meaning: Durable surface intentionally retained but not yet fully classified for cleanup or canon.
    - scaffold_class: defect_cruft
      meaning: Generated clutter or placeholder residue with no canonical authority claim.
    - scaffold_class: drained_retired
      meaning: Previously used root that is now intentionally drained and no longer canonical.
    - scaffold_class: autonomous_local
      meaning: Local node storage for autonomous/rebuildable nodes; not shared storage and not a cross-node continuity promise.
