version: 1
status: authoritative
owner: "@ronny"
updated_at: "2026-03-12"
scope: shop-media-pressure

purpose: >
  Live-backed authority for shop warm-lane pressure on the media pool.
  Records client-visible /media payload truth, local mount overlay drift,
  reclaim candidates, and blocked holds so scorecards do not confuse the
  host-local ZFS mount view with the runtime-visible NFS export.

evidence:
  docs:
    - ops/bindings/media.path.authority.contract.yaml
    - ops/bindings/backup.inventory.yaml
    - docs/reference/audits/MD1400_CAPACITY_NORMALIZATION_EXECUTION_20260227.md
  live_reads:
    - host: pve
      observed_at_utc: "2026-03-12T05:08:17Z"
      proof:
        - "zpool list -Hp -o name,size,alloc,free,capacity media md1400"
        - "zfs list -o name,used,refer,mountpoint media media/movies media/music media/tv md1400/media-cold md1400/media-cold/movies-archive"
        - "zfs list -t snapshot -o name,used,creation -s used -r media"
        - "zfs get -H -o property,value used,referenced,clones media@forensic-20260226-2325"
        - "exportfs -v | grep -A2 '^/media '"
        - "find /media/backups -maxdepth 1 -type f -name 'media-stack-2026-*.tar.gz' | wc -l"
        - "du -sx --block-size=1 /media/backups"
        - "find /md1400/media-cold/legacy-media-stack-backups -maxdepth 1 -type f -name 'media-stack-2026-*.tar.gz' | wc -l"
        - "du -sx --block-size=1 /md1400/media-cold/legacy-media-stack-backups"
    - host: streaming-stack
      observed_at_utc: "2026-03-12T05:08:17Z"
      proof:
        - "mount | grep '/mnt/media '"
        - "du -xhd1 /mnt/media | sort -h"
        - "du -sx --block-size=1 /mnt/media/backups /mnt/media/downloads /mnt/media/movies /mnt/media/movies-archive /mnt/media/music /mnt/media/tv | sort -nr"

