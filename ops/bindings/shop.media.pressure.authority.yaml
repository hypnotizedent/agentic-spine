reclaim_lanes:
  - lane_id: media-stack-legacy-backups-drain
    surface_class: compatibility-hold
    reclaim_class: archive
    status: done
    source_path: /media/backups
    source_glob: media-stack-2026-*.tar.gz
    source_remaining_count: 0
    source_remaining_bytes: 0
    source_remaining_display: "0"
    destination_path: /md1400/archive/media-holds/legacy-media-stack-backups
    destination_present_count: 25
    destination_present_bytes: 182284270592
    destination_present_display: "169.8G"
    rationale: >
      Canonical media config backups already live under /md1400/backup-cold/apps/media-config.
      These warm-lane tarballs are legacy archive residue and now live on md1400, not on media.
  - lane_id: media-forensic-snapshot-hold
    surface_class: archive
    reclaim_class: archive
    status: done
    snapshot: media@forensic-20260226-2325
    used_bytes: 0
    used_display: "0"
    referenced_display: "0"
    rationale: >
      The retained forensic snapshot from the copy-first utilization upgrade was destroyed on 2026-03-17
      after the duplicate-download hold and legacy media-stack archive residue were captured on md1400.
  - lane_id: media-downloads-duplicate-drain
    surface_class: archive
    reclaim_class: archive
    status: done
    source_path: /mnt/media/downloads
    moved_exact_duplicate_count: 52
    removed_empty_top_level_dirs: 406
    destination_path: /md1400/archive/media-holds/downloads-cleanup-20260317/exact-duplicates
    destination_present_bytes: 163228102656
    destination_present_display: "152G"
    rationale: >
      Exact-name duplicate download directories and empty top-level residue were removed from the live
      downloads lane during the 2026-03-17 cleanup wave. Non-empty duplicates were parked under md1400
      as a reviewable archive hold instead of being silently deleted.
  - lane_id: media-downloads-reclaim
    surface_class: runtime
    reclaim_class: regenerable
    status: candidate
    path: /mnt/media/downloads
    used_bytes: 2471411541504
    used_display: "2.2T"
    rationale: >
      Downloads remain the largest regenerable consumer on the warm lane. The storage-side duplicate drain
      and snapshot deletion freed meaningful runway, but the remaining backlog still needs tool-aware cleanup
      because download-stack automation continues to report zero-free-space imports.

summary:
  canonical_payload_bytes: 17466866683392
  canonical_payload_display: "15.9TiB"
  regenerable_runtime_bytes: 2471411541504
