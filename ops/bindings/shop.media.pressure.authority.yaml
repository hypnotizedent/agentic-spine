version: 1
status: authoritative
owner: "@ronny"
updated_at: "2026-03-17"
scope: shop-media-pressure

purpose: >
  Live-backed authority for shop warm-lane pressure on the media pool.
  Records client-visible /media payload truth, local mount overlay drift,
  reclaim candidates, and blocked holds so scorecards do not confuse the
  host-local ZFS mount view with the runtime-visible NFS export.

evidence:
  docs:
    - ops/bindings/media.path.authority.contract.yaml
    - ops/bindings/backup.inventory.yaml
    - docs/reference/audits/MD1400_CAPACITY_NORMALIZATION_EXECUTION_20260227.md
  live_reads:
    - host: pve
      observed_at_utc: "2026-03-17T07:01:08Z"
      proof:
        - "zpool list -Hp -o name,size,alloc,free,capacity media md1400"
        - "zfs list -o name,used,refer,mountpoint media media/movies media/music media/tv md1400/archive/media-holds"
        - "zfs list -t snapshot -o name,used,creation -s used -r media"
        - "exportfs -v | grep -A2 '^/media '"
        - "stat -c '%u %g %a %n' /media/movies-archive"
        - "pvesm status"
        - "find /media -mindepth 1 -maxdepth 1 -printf '%y %f\\n' | sort"
        - "du -sx --block-size=1 /media/downloads /media/movies-archive | sort -nr"
        - "du -sx --block-size=1 /md1400/archive/media-holds/downloads-cleanup-20260317/exact-duplicates /md1400/archive/media-holds/legacy-media-stack-backups | sort -nr"
    - host: download-stack
      observed_at_utc: "2026-03-17T07:03:52Z"
      proof:
        - "mount | grep '/mnt/media '"
        - "df -h /mnt/media /mnt/media/downloads /mnt/media/movies /mnt/media/tv /mnt/media/music"
        - "du -sx --block-size=1 /mnt/media/downloads /mnt/media/movies /mnt/media/movies-archive /mnt/media/music /mnt/media/tv | sort -nr"

