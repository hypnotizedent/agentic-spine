nfs_export_truth:
  export_host: pve
  export_path: /media
  status: deprecated
  note: >
    These NFS exports are legacy shop infrastructure. The canonical active media
    runtime is HOME (Synology /volume1/media-staging via media-home VM 106).
    download-stack and streaming-stack are parked residue, not active consumers.
  consumers:
    - host: download-stack
      mount_path: /mnt/media
      mode: rw
      status: parked
    - host: streaming-stack
      mount_path: /mnt/media
      mode: ro
      status: parked
  local_view_drift:
    status: accepted
    summary: >
      The client-visible /media export accounts for payload residue on the deprecated
      shop pool. Host-local paths /media/movies, /media/tv, and /media/music are empty
      child datasets, and /media/movies-archive is masked by md1400/media-cold/movies-archive.
      NFS consumers still observe parent payload at those paths, so host-local du/zfs
      output alone is not storage truth. This is evacuation accounting, not active media truth.
    affected_paths:
      - /media/movies
      - /media/tv
      - /media/music
      - /media/movies-archive

