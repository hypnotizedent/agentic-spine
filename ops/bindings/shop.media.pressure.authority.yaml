version: 1
status: authoritative
owner: "@ronny"
updated_at: "2026-03-21"
scope: shop-media-pressure

purpose: >
  Live-backed authority for shop warm-lane pressure on the media pool.
  Records client-visible /media payload truth, local mount overlay drift,
  reclaim candidates, and blocked holds so scorecards do not confuse the
  host-local ZFS mount view with the runtime-visible NFS export.

evidence:
  docs:
    - ops/bindings/media.path.authority.contract.yaml
    - ops/bindings/backup.inventory.yaml
    - docs/reference/audits/MD1400_CAPACITY_NORMALIZATION_EXECUTION_20260227.md
  live_reads:
    - host: pve
      observed_at_utc: "2026-03-21T05:25:47Z"
      proof:
        - "zpool list -Hp -o name,size,alloc,free,capacity media"
        - "date -u"
    - host: download-stack
      observed_at_utc: "2026-03-21T05:25:47Z"
      proof:
        - "mount | grep '/mnt/media '"
        - "du -sb /mnt/media/movies /mnt/media/tv /mnt/media/music /mnt/media/movies-archive /mnt/media/downloads /mnt/media/backups | sort -rn"
        - "du -sh /mnt/media"

pool_state:
  observed_at_utc: "2026-03-21T05:25:47Z"
  media:
    total_bytes: 32006096289792
    used_bytes: 27598970830848
    free_bytes: 4407125458944
    usage_pct: 86
    total_display: "29.1T"
    used_display: "25.1T"
    free_display: "4.1T"
  md1400:
