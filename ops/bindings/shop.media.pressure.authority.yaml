nfs_export_truth:
  export_host: pve
  export_path: /media
  consumers:
    - host: download-stack
      mount_path: /mnt/media
      mode: rw
    - host: streaming-stack
      mount_path: /mnt/media
      mode: ro
  local_view_drift:
    status: accepted
    summary: >
      The client-visible /media export is authoritative for payload accounting.
      The host-local paths /media/movies, /media/tv, and /media/music are empty
      child datasets, while /media/movies-archive is now a plain media-lane
      directory again. NFS consumers still observe live parent payload at those
      paths, so host-local du/zfs output alone is not storage truth.
    affected_paths:
      - /media/movies
      - /media/tv
      - /media/music

