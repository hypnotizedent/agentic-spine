# Mint Quote Packet Authority
# Status: authoritative
# Last verified: 2026-03-09
# Scope: mint-quote-packet-work-object

version: 1
updated_at: "2026-03-10"
owner: "@ronny"
status: authoritative
scope: mint-quote-packet-work-object

purpose: >
  Define the canonical quote_packet work object so agents can own the
  Quote-to-Pay lane end-to-end. A quote_packet is NOT the canonical quote
  entity (see mint.order.truth.authority.yaml); it is the operational work
  unit that agents use to prepare, price, render, and send a quote.

  This authority defines the first real Mint agent business loop: intake →
  prepare (REAL customer resolution + service checks) → render (quote draft)
  → BLOCKED at payment until the governed promotion/payment bridge is
  implemented.

  IMPLEMENTATION STATUS (2026-03-09):
    - Customer resolution: REAL (mint-modules customers service)
    - Stock check: readiness detection REAL; execution blocked until suppliers bulk stock endpoint exists
    - Pricing: REAL when normalized inputs + PRICING_API_KEY exist; otherwise blocked honestly
    - Quote draft: stub (inline summary, Printavo integration pending)
    - Payment link: BLOCKED pending quote_packet promotion to canonical order/revision/quote
    - Receipt tracking: REAL (appends SPINE_CAP_RUN_KEY receipts)
    - Packet index: REAL (runtime/domain-state/mint/quote-packets-index.yaml)

non_goals:
  - replacing the canonical quote entity defined in order truth authority
  - replacing order lifecycle or order_revision immutability rules
  - replacing intake seed evidence or artwork job evidence
  - implementing full order system or production scheduling
  - solving digital-proofs or full customer portal

contracts:
  order_truth_authority: ops/bindings/mint.order.truth.authority.yaml
  line_item_normalization: ops/bindings/mint.quote.line_item.normalization.contract.yaml
  payment_bridge_authority: ops/bindings/mint.quote.payment_bridge.authority.yaml
  module_lifecycle_authority: ops/bindings/mint.module.lifecycle.authority.yaml
  module_status_authority: ops/bindings/mint.module.status.authority.contract.yaml
  mint_domain_doc: docs/governance/domains/mint.md

relationship_to_order_truth:
  quote_packet_vs_quote: >
    A quote_packet is an agent-owned work object that may eventually produce
    a canonical quote entity. The packet contains all the evidence, gaps,
    and draft artifacts needed to prepare a quote. Once sent, the packet
    references a canonical quote_id from the order truth model.
  quote_packet_vs_order: >
    A quote_packet may reference intake seed evidence and may trigger order
    creation, but it is not itself an order. Order creation remains a
    separate governed promotion boundary.
  immutability: >
    quote_packets are mutable work objects. They capture snapshots and
    receipts from immutable sources (pricing_snapshot, supplier stock, intake
    evidence) but the packet itself is the operational state that agents
    update as work progresses.

quote_packet_schema:
  required_fields:
    quote_packet_id:
      type: uuid
      description: Unique identifier for this quote_packet work object
    state:
      type: enum
      allowed_values:
        - drafting
        - needs_input
        - ready_for_review
        - approved_to_send
        - sent
        - paid
        - closed
      description: Current lifecycle state of the packet
    customer_ref:
      type: object
      description: Customer identity (provisional or resolved)
      required_subfields:
        - identity_state (provisional|resolved)
        - customer_query or customer_id
    source_refs:
      type: array
      description: References to intake seed evidence, inbound artifacts, or reused historical evidence
      elements:
        - seed_id (optional)
        - intake_channel (web|email|phone|manual)
        - source_timestamp
        - ref_type (optional: seed|quote_form|email|attachment|pdf|product_link|historical_quote|historical_invoice|operator_note)
        - source_locator (optional: path, URL, message-id, or external identifier)
        - summary (optional: one-line statement of what this evidence contributes)
        - artifact_state (optional: received|derived|missing|failed|low_quality)
    line_items:
      type: array
      description: >
        Normalized line items for this quote. Canonical field names and
        completeness classes are defined by the line_item_normalization
        contract.
      elements:
        - line_item_id (uuid)
        - description (optional)
        - product_type
        - quantity (required by stock_lookup_ready and beyond)
        - size_breakdown (optional)
        - decoration_method (optional)
        - placement (optional)
        - operator_notes (optional)
    created_at:
      type: timestamp
      description: When this packet was created
    updated_at:
      type: timestamp
      description: Last update timestamp
    created_by:
      type: string
      description: Agent or operator who created this packet

  optional_fields:
    artwork_bindings:
      type: array
      description: References to artwork seed/asset evidence
      elements:
        - line_item_id
        - seed_refs (array of seed_id)
        - asset_refs (array of MinIO/file paths)
        - artwork_job_refs (array of artwork_job_id)
        - binding_state (unmapped|mapped|approved)
    inventory_snapshot:
      type: object
      description: Supplier stock check results
      structure:
        - snapshot_timestamp
        - supplier_results (array)
        - stock_available (boolean per line item)
        - stock_warnings (array)
        - supplier_receipt_refs (array)
    pricing_snapshot:
      type: object
      description: Pricing calculation results
      structure:
        - snapshot_timestamp
        - pricing_snapshot_id (uuid, from pricing module)
        - line_item_prices (array)
        - decoration_prices (array)
        - calculated_totals (object: subtotal, tax, shipping, total)
        - pricing_receipt_refs (array)
        - confidence_level (high|medium|low)
    open_gaps:
      type: array
      description: Explicit gaps and warnings affecting packet readiness
      elements:
        - gap_id (sequential per packet)
        - gap_type (customer_unresolved|product_unresolved|quantity_unresolved|decoration_unresolved|artwork_missing|artwork_inadequate|supplier_unresolved|shipping_ambiguity|pricing_policy_review|stock_unavailable|clarification_required|proof_routing_blocked|other)
        - description
        - severity (blocking|warning)
        - discovered_at (timestamp)
        - resolution_path (suggested action)
    confidence:
      type: object
      description: Overall confidence metrics
      structure:
        - overall (high|medium|low)
        - artwork_confidence (high|medium|low|none)
        - pricing_confidence (high|medium|low|none)
        - stock_confidence (high|medium|low|none)
        - customer_confidence (high|medium|low|none)
    quote_draft_ref:
      type: object
      description: Reference to rendered quote draft
      structure:
        - draft_type (printavo|pdf|inline)
        - draft_id (optional, external system ID)
        - draft_payload (optional, inline draft content)
        - draft_url (optional)
        - generated_at (timestamp)
    payment_ref:
      type: object
      description: Reference to payment link/checkout
      structure:
        - payment_provider (stripe|other)
        - payment_link_id (optional)
        - payment_link_url (optional)
        - payment_amount (decimal)
        - payment_currency (USD)
        - generated_at (timestamp)
    customer_message_draft:
      type: string
      description: Draft customer-facing clarification or quote-send message
    operator_notes:
      type: string
      description: >
        Internal normalization notes for cross-line decisions, historical-price
        context, white-label rerouting rationale, VIP shorthand interpretation,
        and other governed context that does not belong in customer-facing copy
    quote_id:
      type: uuid
      description: Canonical quote_id once quote is sent (references order truth quote entity)
    order_id:
      type: uuid
      description: Canonical order_id if order promotion has occurred
    order_revision_id:
      type: uuid
      description: Canonical order_revision_id if order promotion has occurred
    sent_at:
      type: timestamp
      description: When the quote was sent to customer
    paid_at:
      type: timestamp
      description: When payment was received
    closed_at:
      type: timestamp
      description: When the packet was closed
    closed_reason:
      type: string
      description: Why the packet was closed (sent_and_paid|cancelled|superseded)
    receipts:
      type: array
      description: Spine capability receipt references
      elements:
        - receipt_path
        - capability_name
        - run_key
        - executed_at

lifecycle_model:
  states:
    drafting:
      description: Initial state, agent is assembling normalized inputs
      allowed_transitions:
        - needs_input
        - ready_for_review
        - closed
      entry_conditions:
        - quote_packet_id assigned
        - customer_ref initialized
        - line_items initialized (may be empty)
      exit_conditions:
        - sufficient normalized input to proceed to needs_input or ready_for_review
    needs_input:
      description: Blocked on missing information (artwork, stock, customer resolution, pricing)
      allowed_transitions:
        - drafting
        - ready_for_review
        - closed
      entry_conditions:
        - at least one blocking gap in open_gaps
      exit_conditions:
        - all blocking gaps resolved or packet abandoned
    ready_for_review:
      description: All inputs resolved, awaiting operator approval to send
      allowed_transitions:
        - needs_input
        - approved_to_send
        - closed
      entry_conditions:
        - no blocking gaps
        - customer_ref.identity_state = resolved
        - pricing_snapshot exists
        - quote_draft_ref exists
        - customer_message_draft exists
        - payment bridge may still be pending; promotion/payment link generation is downstream of approval
      exit_conditions:
        - operator approval or rejection
    approved_to_send:
      description: Operator approved, ready for promotion + payment/send orchestration
      allowed_transitions:
        - sent
        - needs_input
        - closed
      entry_conditions:
        - explicit operator approval
      exit_conditions:
        - send action executed or approval revoked
    sent:
      description: Quote sent to customer, awaiting payment
      allowed_transitions:
        - paid
        - closed
      entry_conditions:
        - send action completed
        - sent_at timestamp recorded
        - quote_id assigned (canonical quote entity created)
      exit_conditions:
        - payment received or quote expired/cancelled
    paid:
      description: Customer paid, quote business loop complete
      allowed_transitions:
        - closed
      entry_conditions:
        - payment received via payment module
        - paid_at timestamp recorded
      exit_conditions:
        - operator closes packet or auto-close after handoff
    closed:
      description: Terminal state, packet archived
      allowed_transitions: []
      entry_conditions:
        - explicit operator close action OR
        - auto-close after paid + order handoff OR
        - cancellation/supersession
      exit_conditions:
        - none, terminal state

  state_progression_rules:
    normal_path:
      - drafting → needs_input → drafting → ready_for_review → approved_to_send → sent → paid → closed
    skip_needs_input:
      - drafting → ready_for_review (if all inputs present immediately)
    abort_path:
      - drafting → closed
      - needs_input → closed
      - ready_for_review → closed
    revision_path:
      - ready_for_review → needs_input (if operator requests changes)
      - approved_to_send → needs_input (if pre-send validation fails)

operational_rules:
  quote_packet_creation:
    triggers:
      - manual operator command (mint.quote.packet.normalize)
      - manual operator command (mint.quote.prepare)
      - agent orchestration request
    required_inputs:
      - customer_ref (provisional or resolved)
      - at least one creation_minimum line_item when product_type is known, OR a blocking product_unresolved gap when product family is still unclear
    forbidden_shortcuts:
      - creating quote_packet from seed alone without normalization
      - creating quote_packet without customer_ref
  quote_packet_promotion_to_ready:
    required:
      - customer_ref.identity_state = resolved
      - all line_items have stock checked
      - pricing_snapshot exists with confidence >= medium
      - no blocking gaps in open_gaps
      - artwork_bindings exist or explicitly noted as not-required
  quote_send_approval:
    required:
      - explicit operator approval action
      - state = ready_for_review
      - quote_draft_ref exists
      - customer_message_draft exists
    forbidden:
      - automated send without approval
      - send with blocking gaps present
  packet_closure:
    auto_close_conditions:
      - state = paid AND order handoff complete
      - state = sent AND quote expired/superseded
    manual_close_allowed:
      - any state (operator discretion)

morpheus_intake_normalization:
  purpose: >
    Define the smallest governed Morpheus output that converts messy inbound
    customer evidence into resumable quote_packet truth without inventing new
    order, quote, proof, customer, or line-item models.
  minimal_output_shape:
    required_packet_fields:
      - state
      - customer_ref
      - source_refs
      - line_items
      - open_gaps
      - confidence
    optional_enrichment_fields:
      - artwork_bindings
      - inventory_snapshot
      - pricing_snapshot
      - quote_draft_ref
      - customer_message_draft
      - operator_notes
    creation_rules:
      - line_items may begin at creation_minimum when only product family is known; quantity and decoration_method may remain unresolved until later completeness classes
      - if product family itself is unresolved, line_items may remain empty only when open_gaps contains a blocking product_unresolved gap
      - every inference must be traceable to source_refs and preserved in operator_notes or line_items.operator_notes
      - when written clarification is required, customer_message_draft must contain the next outbound clarification draft instead of leaving the packet dependent on prose notes
  safe_to_continue_missing_information:
    severity: warning
    rules:
      - relationship pricing or courtesy adjustment is not yet confirmed, but base pricing inputs are otherwise complete
      - shipping is not yet final, but totals are explicitly marked shipping_pending or excluded from current customer-facing totals
      - a white-label link is detected, but product family is clear enough to continue supplier identification
      - proof routing has not been executed yet, but pricing work is still incomplete
  blocks_quote_readiness:
    severity: blocking
    rules:
      - customer identity is unresolved or ambiguous
      - product family, blank selection, or supplier source remains too ambiguous to support stock or blank-cost truth
      - quantity is missing or contradictory for any price-bearing line item
      - decoration method is unresolved and materially affects pricing or feasibility
      - artwork is missing, failed, or low quality when proofing, sizing, or method validation depends on it
      - a historical-price match, courtesy discount, or absorbed-cost promise requires operator approval before totals are truthful
      - clarification_required remains open
  historical_evidence_reuse_rule: >
    Morpheus may reuse historical quote or invoice evidence only when source_refs
    show the same customer and materially similar request. Historical evidence
    may downgrade confidence, but it may never justify silent defaulting from
    industry norms alone.
  no_freeform_capture_rule: >
    The normalized quote_packet is the resumable truth. Do not rely on ad hoc
    planning notes for active quote preparation once facts, gaps, and decisions
    can be stored in quote_packet fields.

messy_input_patterns:
  incomplete_product_descriptions:
    field_mapping:
      - customer_ref: preserve current provisional or resolved identity; do not infer relationship tier from tone alone
      - source_refs: capture the raw wording, linked PDFs/links, and any supplier candidate discovered during normalization
      - line_items: normalize product_type plus description; leave style, supplier, and SKU fields blank until resolved
      - artwork_bindings: leave empty unless artwork arrived with the request
      - inventory_snapshot: leave absent until supplier/source is known
      - pricing_snapshot: leave absent until the line item reaches pricing_ready
      - open_gaps: emit product_unresolved when blank or style choice materially affects pricing or stock
      - confidence: downgrade overall, pricing, and stock confidence to low or medium
      - quote_draft_ref: leave absent
      - customer_message_draft: draft product clarification when product family or blank choice is still ambiguous
    default_rule: block ready_for_review; continue drafting only when product_type is clear enough to normalize honestly
  vague_quantities:
    field_mapping:
      - customer_ref: unchanged from current evidence
      - source_refs: preserve the original vague quantity wording or contradictory revisions
      - line_items: create creation_minimum candidates without quantity only when product family is known
      - artwork_bindings: unchanged unless artwork references quantity-specific placements
      - inventory_snapshot: leave absent because quantity-dependent stock checks are not truthful yet
      - pricing_snapshot: leave absent because quantity drives pricing tiers
      - open_gaps: emit quantity_unresolved as blocking until exact price-bearing quantities are known
      - confidence: set pricing_confidence and stock_confidence to none or low
      - quote_draft_ref: leave absent
      - customer_message_draft: ask for exact quantities or latest authoritative counts
    default_rule: continue packet creation, but block pricing and ready_for_review
  unstated_decoration_methods:
    field_mapping:
      - customer_ref: unchanged
      - source_refs: capture the exact request text and any artwork or historical evidence that suggests a method
      - line_items: preserve product_type and quantity; leave decoration_method blank unless current or historical evidence is explicit
      - artwork_bindings: preserve any supplied artwork without claiming proof readiness
      - inventory_snapshot: may proceed only if product/source is otherwise clear
      - pricing_snapshot: leave absent until decoration_method, print_locations, and color_count are truthful
      - open_gaps: emit decoration_unresolved when method choice changes cost, feasibility, or proof requirements
      - confidence: pricing_confidence low or none
      - quote_draft_ref: leave absent
      - customer_message_draft: ask for method confirmation when the method cannot be grounded in current or historical evidence
    default_rule: never assume a method from product category alone; block pricing when method materially changes totals
  artwork_missing_failed_or_low_quality:
    field_mapping:
      - customer_ref: unchanged
      - source_refs: record failed uploads, missing attachments, screenshots, or low-quality files with artifact_state
      - line_items: keep normalized product intent separate from artwork adequacy
      - artwork_bindings: store received seed_refs and asset_refs when present; leave unmapped if files are missing or unusable
      - inventory_snapshot: may proceed only if artwork is not needed for stock truth
      - pricing_snapshot: proceed only when artwork does not determine size tier or method feasibility; otherwise leave blocked
      - open_gaps: emit artwork_missing or artwork_inadequate with severity based on whether proofing or pricing depends on the asset
      - confidence: artwork_confidence none, low, or medium based on asset quality
      - quote_draft_ref: leave absent when proof is required and artwork is not adequate
      - customer_message_draft: request upload, vector replacement, or higher-quality art when needed
    default_rule: route to clarification before Artie when artwork is missing, failed, or not proof-adequate
  white_label_product_links:
    field_mapping:
      - customer_ref: unchanged
      - source_refs: retain the original product link and mark it as product_link evidence
      - line_items: normalize product_type and description from the link, then record any upstream supplier candidate in operator_notes
      - artwork_bindings: unchanged
      - inventory_snapshot: leave absent until a canonical supplier/source is selected
      - pricing_snapshot: leave absent or provisional until blank source is grounded in a real supplier path
      - open_gaps: emit supplier_unresolved as warning or blocking depending on whether the upstream product match is known
      - confidence: stock_confidence and pricing_confidence reduced until canonical sourcing is chosen
      - quote_draft_ref: leave absent unless sourcing is settled
      - customer_message_draft: use only if written sourcing clarification is needed; do not force white-label jargon into customer copy
    default_rule: continue normalization, but do not treat the reseller link as canonical supplier truth
  relationship_pricing_or_courtesy_adjustments:
    field_mapping:
      - customer_ref: preserve identity state and relationship evidence only through source_refs or operator_notes
      - source_refs: attach historical quotes, invoices, or explicit operator notes that justify courtesy pricing
      - line_items: keep commercial facts separate from discretionary discount logic
      - artwork_bindings: unchanged
      - inventory_snapshot: unchanged
      - pricing_snapshot: store base pricing once inputs are complete, then record discount/absorption rationale in notes or pricing receipts
      - open_gaps: emit pricing_policy_review when a historical-price match or courtesy adjustment requires operator sign-off
      - confidence: pricing_confidence medium at best until the discretionary step is confirmed
      - quote_draft_ref: leave absent until the final commercial posture is truthful
      - customer_message_draft: draft a careful follow-up only when the customer explicitly asked for historical or special pricing confirmation
    default_rule: continue base pricing when possible, but block ready_for_review if discretionary pricing is still unresolved
  shipping_ambiguity:
    field_mapping:
      - customer_ref: unchanged
      - source_refs: retain supplier shipping notes, customer ship-on-account requests, and any historical shipping evidence
      - line_items: unchanged unless ship method affects SKU/source choice
      - artwork_bindings: unchanged
      - inventory_snapshot: may stay provisional if supplier choice drives freight truth
      - pricing_snapshot: either omit shipping from totals with explicit note or block final totals when shipping is required for truth
      - open_gaps: emit shipping_ambiguity as warning for provisional estimates or blocking when final totals depend on freight truth
      - confidence: pricing_confidence reduced until shipping posture is explicit
      - quote_draft_ref: leave absent if the final quote total is still ambiguous
      - customer_message_draft: ask for ship method, ship-on-account preference, or in-hands constraints when needed
    default_rule: safe to continue for estimates; block ready_for_review when final customer-facing totals depend on unresolved shipping
  vip_shorthand_or_minimal_detail_customers:
    field_mapping:
      - customer_ref: resolve the known customer if possible, but preserve broker or intermediary context in operator_notes
      - source_refs: retain the short inbound message plus any historical quote or invoice evidence used to translate intent
      - line_items: create only the product candidates supported by current or historical evidence; do not expand vague requests into speculative multi-line quotes
      - artwork_bindings: unchanged until files exist
      - inventory_snapshot: leave absent until product, quantity, and source are honest
      - pricing_snapshot: leave absent until quantity and method are grounded
      - open_gaps: emit the specific missing facts (quantity_unresolved, decoration_unresolved, product_unresolved) rather than a generic VIP gap
      - confidence: overall confidence is low until shorthand is translated into concrete commercial facts
      - quote_draft_ref: leave absent unless enough truth exists to draft a governed estimate
      - customer_message_draft: draft short, targeted clarification that matches the customer's communication style
    default_rule: VIP status changes how concise the clarification can be, not whether canonical fields may be skipped

confidence_scoring_rules:
  customer_confidence:
    high: resolved customer_id with matching current channel/contact evidence
    medium: provisional customer uniquely identifiable from current evidence
    low: multiple plausible matches or broker relationship unresolved
    none: no trustworthy customer match
  artwork_confidence:
    high: mapped vector or proof-adequate asset tied to the intended line item
    medium: usable mockup or raster evidence adequate for proof discussion but not final production
    low: screenshots, partial files, or low-resolution assets
    none: no artwork evidence or failed upload only
  stock_confidence:
    high: supplier_code and supplier_sku resolved with fresh inventory_snapshot
    medium: blank candidate resolved but live stock not yet confirmed
    low: source inferred from description or white-label link only
    none: no trustworthy supplier/source candidate
  pricing_confidence:
    high: every price-bearing line item is pricing_ready and discretionary pricing policy is settled
    medium: pricing inputs complete, but shipping or relationship pricing still carries warning-level caveats
    low: pricing depends on documented assumptions or unresolved sourcing
    none: pricing is blocked
  overall_rule: >
    overall confidence is low whenever any blocking gap remains. overall may
    reach medium when only warning gaps remain. overall is high only when
    customer, pricing, and required product truth are all grounded enough for
    ready_for_review.

clarification_rules:
  written_clarification_required_when:
    - current evidence contains contradictory quantities, product groupings, or revisions
    - product or decoration choices cannot be grounded in current or historical evidence
    - artwork is missing, failed, or inadequate and proof or pricing depends on it
    - customer explicitly asks for same-as-last-time pricing and the historical match is not provable from source_refs
    - shipping or timeline commitments depend on customer decisions not yet stated in writing
  clarification_not_required_when:
    - historical evidence in source_refs proves the same customer is reordering materially identical specs
    - missing information affects only warning-level context and is clearly surfaced in operator_notes or customer_message_draft
    - the next safe step is internal enrichment only (for example, supplier comparison after product family is already clear)

artie_routing_rules:
  route_to_artie_when:
    - a proof or mockup is required by workflow, operator direction, or customer expectation
    - artwork_confidence is at least medium
    - target line items have normalized product_type plus enough blank/color context to generate a truthful proof
    - no blocking product_unresolved, artwork_inadequate, or clarification_required gap remains for the proofed line items
  do_not_route_to_artie_when:
    - artwork is missing, failed, or low quality
    - product family, blank selection, color, decoration method, or placement is still too ambiguous for truthful proof work
    - the requested product is outside Artie's current proofable template or mockup coverage
    - the packet still needs written clarification before proof work would be valid
  routing_note: >
    Route to Artie only after Morpheus has normalized the line-item and artwork
    evidence. Artie is for proof/mockup execution, not for resolving missing
    customer facts.

pricing_progression_rules:
  pricing_allowed_when:
    - each price-bearing line item has product_type, quantity, decoration_method, and the pricing-ready facts required by the line_item_normalization contract
    - blank cost is grounded in a canonical supplier path or trustworthy historical evidence recorded in source_refs
    - shipping posture is either priced or honestly excluded from the current total
    - discretionary relationship pricing has been resolved or explicitly deferred out of the current total
  pricing_blocked_when:
    - quantity is missing or contradictory
    - product, supplier, or blank selection is not grounded enough to choose blanks_cost_cents truthfully
    - decoration_method, print_locations, or color_count is missing
    - artwork adequacy materially affects size tier, proof feasibility, or method validation
    - customer-requested historical-price matching or courtesy pricing still requires operator decision
  blocked_state: needs_input

ready_for_review_rules:
  packet_may_be_ready_for_review_when:
    - customer_ref.identity_state = resolved
    - every customer-facing line item is at least pricing_ready and commercially stable
    - pricing_snapshot exists with confidence >= medium
    - no blocking open_gaps remain
    - quote_draft_ref exists
    - customer_message_draft exists
    - proof requirement is satisfied, explicitly waived, or truthfully marked not required
  packet_must_not_be_ready_for_review_when:
    - any blocking clarification gap remains
    - pricing depends on unresolved shipping or discretionary pricing policy
    - proof work is still required but not routed or completed
    - artwork or line-item ambiguity would make the customer-facing draft misleading

normalization_examples:
  kennedy_presidential_bully_kennel:
    evidence_date: "2026-03-06"
    normalized_outcome:
      state: needs_input
      customer_ref:
        identity_state: provisional
        customer_query: "Steven Kennedy / Kennedy presidential bully kennel / stevenk485@gmail.com"
      line_item_completeness:
        - t_shirts: creation_minimum with quantity 20 and notes for left-chest + full-back screen print request
      open_gaps:
        - artwork_inadequate (blocking): quote-form upload failed; no usable asset refs
        - supplier_unresolved (blocking): shirt style/blank source not specified
        - clarification_required (warning): email mentions hoodies and track suits, but only shirts are concretely scoped
      confidence:
        overall: low
        artwork_confidence: none
        pricing_confidence: none
        stock_confidence: none
        customer_confidence: medium
      readiness: not_ready_for_review
      artie_route: do_not_route
  lisa_peirce_events:
    evidence_date: "2026-03-09"
    normalized_outcome:
      state: needs_input
      customer_ref:
        identity_state: resolved
        customer_id: "resolved_customer_required_by_prepare_surface"
      line_item_completeness:
        - latest revision quantities can normalize multiple apparel/headwear line items at creation_minimum from the March 9 revision
        - mockup-derived shirt, hat, hoodie, pant, zip, and bag candidates can carry source-backed descriptions and size breakdowns, but several remain below pricing_ready
        - dance floor designs and PJs remain blocked because the design grouping and PJ style are not yet truthful
      open_gaps:
        - clarification_required (blocking): dance floor design grouping unresolved across revisions
        - product_unresolved (blocking): PJs style number missing
        - decoration_unresolved (blocking): several lines still lack fully grounded print locations/color counts despite strong mockup evidence
      confidence:
        overall: low
        artwork_confidence: medium
        pricing_confidence: low
        stock_confidence: low
        customer_confidence: high
      readiness: not_ready_for_review
      artie_route: partial_only_after_clarification
  moe_humble_religion:
    evidence_date: "2026-03-09"
    normalized_outcome:
      state: needs_input
      customer_ref:
        identity_state: resolved
        customer_id: "resolved_vip_customer_required_by_prepare_surface"
      line_item_completeness:
        - ribbed_tank_candidate: creation_minimum using translated product_type plus operator_notes for LA Apparel 21X408GD research
      open_gaps:
        - quantity_unresolved (blocking): no quantity provided
        - shipping_ambiguity (blocking): LA Apparel freight posture materially affects truthful totals
        - pricing_policy_review (warning): VIP/broker context may affect how research is preserved or honored
      confidence:
        overall: low
        artwork_confidence: none
        pricing_confidence: none
        stock_confidence: low
        customer_confidence: high
      readiness: not_ready_for_review
      artie_route: do_not_route

storage_contract:
  canonical_location:
    path: runtime/domain-state/mint/quote-packets/
    format: yaml
    naming: quote_packet_<quote_packet_id>.yaml
  projection_surface:
    path: runtime/domain-state/mint/quote-packets-index.yaml
    format: yaml
    description: Queryable index of all quote_packets by state
  receipt_storage:
    path: receipts/mint/quote-packets/<quote_packet_id>/
    format: capability receipts as per Spine contract

capability_surface:
  prepare:
    name: mint.quote.packet.normalize
    description: Normalize messy inbound evidence into a persisted governed quote_packet (mint.quote.prepare remains a compatibility alias)
    implementation_status: REAL (customer resolution via mint-modules, service-aware stock/pricing)
    inputs:
      - customer_query (required)
      - source_refs (optional)
      - line_items (optional, may be derived from source_refs)
    outputs:
      - quote_packet_id
      - state (drafting|needs_input based on real gap analysis)
      - open_gaps (real customer resolution outcomes: resolved|ambiguous|new|unresolved)
      - confidence (based on real resolution state)
      - receipts (SPINE_CAP_RUN_KEY appended)
    safety: mutating
    blockers:
      - stock check: requires canonical supplier product identifiers (brand/style/sku) in line_items
      - pricing: requires complete job estimate inputs (decoration_method, placement, colors) in line_items
  show:
    name: mint.quote.packet.show
    description: Read a quote_packet by ID for resumability (mint.quote.show remains a compatibility alias)
    implementation_status: REAL
    inputs:
      - quote_packet_id (required)
    outputs:
      - full quote_packet structure
    safety: read-only
  render:
    name: mint.quote.render
    description: Generate customer-facing artifacts (quote draft, customer message)
    implementation_status: PARTIAL (quote draft stub, payment blocked pending promotion/payment bridge implementation)
    inputs:
      - quote_packet_id (required)
    outputs:
      - quote_draft_ref (stub: inline summary, Printavo pending)
      - payment_ref (BLOCKED: requires canonical order_id from promotion)
      - customer_message_draft (includes blocker note)
      - updated state (needs_input if payment blocked, NOT ready_for_review)
      - receipts (SPINE_CAP_RUN_KEY appended)
    safety: mutating
    blockers:
      - payment link generation BLOCKED until quote_packet promotion to canonical order/revision/quote is implemented
      - promotion path defined in mint.quote.payment_bridge.authority.yaml but not yet implemented
      - quote draft is inline stub, not Printavo integration
  promote:
    name: mint.quote.promote
    description: Promote quote_packet to canonical order/revision/quote entities (design-only)
    implementation_status: DESIGN_ONLY (not yet implemented)
    authority_ref: ops/bindings/mint.quote.payment_bridge.authority.yaml
    inputs:
      - quote_packet_id (required)
      - operator_approval (required, explicit)
    outputs:
      - order_id (canonical, created or linked)
      - order_revision_id (canonical, first revision)
      - quote_id (canonical, quote entity)
      - pricing_snapshot_id (attached or created)
      - quote_packet updated with canonical references
    safety: mutating
    approval_requirement: manual
    blockers:
      - order entity creation not yet implemented
      - order revision creation not yet implemented
      - quote entity creation not yet implemented
      - requires cross-module orchestration
  generate_payment_link:
    name: mint.quote.generate_payment_link
    description: Generate Stripe checkout URL for a promoted quote (design-only)
    implementation_status: DESIGN_ONLY (not yet implemented)
    authority_ref: ops/bindings/mint.quote.payment_bridge.authority.yaml
    inputs:
      - quote_id (required, canonical quote entity)
    outputs:
      - payment_link_url (Stripe checkout URL)
      - checkout_session_id (Stripe session ID)
      - quote_packet updated with payment_ref
    safety: mutating
    approval_requirement: auto (if quote already approved)
    blockers:
      - requires mint.quote.promote to be implemented first
  send:
    name: mint.quote.send
    description: Send quote to customer (approval-gated)
    implementation_status: BLOCKED (promotion + payment link prerequisites not met)
    authority_ref: ops/bindings/mint.quote.payment_bridge.authority.yaml
    inputs:
      - quote_packet_id (required)
      - operator_approval (required, explicit)
    outputs:
      - quote_id (canonical quote entity)
      - sent_at timestamp
      - updated state (sent)
    safety: mutating
    approval_requirement: manual
    blockers:
      - cannot send quote without payment link
      - payment link blocked on mint.quote.promote and mint.quote.generate_payment_link implementation

agent_guidance:
  default_read_path: ops/bindings/mint.quote.packet.authority.yaml
  work_object_vs_entity: >
    quote_packet is a work object, not a canonical entity. It lives in
    runtime/domain-state/, not in authoritative bindings. It captures
    operational state for agent resumability, not immutable business truth.
  resumability: >
    Agents must be able to resume work on a quote_packet by reading
    mint.quote.show without opening markdown notes or session recaps.
  gap_discipline: >
    When blocked inputs are discovered, record them explicitly in open_gaps
    with gap_type, severity, and resolution_path. Do not write prose capture
    docs; update the packet state.
  receipt_discipline: >
    All capability executions that modify a quote_packet must append receipt
    references to the receipts array. Do not create parallel documentation.
