status: authoritative
owner: "@ronny"
last_verified: "2026-05-05"
scope: friction-baseline-contract
version: "1.0"
updated_at: "2026-05-05"

artifact:
  path: "$SPINE_STATE/friction-baseline.yaml"
  checksum_algorithm: "sha256"
  checksum_field: "checksum_sha256"

required_fields:
  - version
  - contract_id
  - generated_at_utc
  - timezone_human
  - loop_id
  - commands
  - baseline_failing_gate_ids
  - checksum_sha256

required_commands:
  - "./bin/ops cap run verify.engine.run"
  - "./bin/ops cap run spine.verify"
  - "./bin/ops cap run verify.infra.run"

path_resolution:
  rule: >
    artifact.path is a logical state path. Capture and verify must expand
    $SPINE_STATE or ${SPINE_STATE} to the host's resolved state root before
    applying repo-relative fallback. Literal repo directories named
    "$SPINE_STATE" are residue and are not valid baseline artifacts.
  canonical_authority: "storage_evidence_node_state_root"
  routed_readback_capability: friction.baseline.verify
  routed_readback_annotation: "state_authority: shared_authority_db"
  annotation_reason: >
    cap.sh currently routes read-only state-authority caps with the
    shared_authority_db annotation. The baseline artifact itself remains YAML
    under $SPINE_STATE/friction-baseline.yaml; the annotation is used so the
    readback executes on pve and cannot bless a consumer-local projection.

command_semantics:
  rule: >
    Required commands must be registered, current capability commands. Capture
    must fail closed if any command exits nonzero, and verify must reject any
    artifact command row whose status is not a successful terminal status.
  retired_commands:
    - "./bin/ops cap run verify.pack.run loop_gap"
    - "./bin/ops cap run verify.route.recommend"

timezone_human_default: "America/New_York"
