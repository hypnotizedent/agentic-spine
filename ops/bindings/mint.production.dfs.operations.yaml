# DFS Operations Knowledge — Barudan Design File Server
# Status: authoritative
# Last verified: 2026-03-25
# Scope: mint-production-dfs-operations

version: 1
updated_at: "2026-03-25"
owner: "@ronny"
status: authoritative
scope: mint-production-dfs-operations

purpose: >
  Operational knowledge for the Barudan Design File Server (DFS) running
  on the shop DFS laptop. This binding teaches agents how to deliver
  design files to the Barudan embroidery machine via the governed pipeline.

architecture:
  description: >
    DFS is a proprietary Windows application that serves embroidery design files
    to Barudan machines over TCP port 8000. The Barudan initiates the connection
    outbound to the DFS server. Designs are placed in the DR_DL folder and the
    operator selects them on the machine's control panel.
  connection_direction: "barudan → dfs-laptop (outbound from machine)"
  protocol: "Proprietary TCP on port 8000 (not HTTP, not FTP, not SMB)"
  software: "DesignFileServer(F).exe v1.76.00"
  license: "Recovery"
  supported_formats: [".dst", ".u00", ".u01"]

hosts:
  dfs_laptop:
    ssh_target: dfs-laptop
    ip: 192.168.1.137
    user: marll
    os: windows-11-home
    hostname: LAPTOP-U2IR8BMI
    site: shop
    connection_type: wifi
    wifi_adapter: "Qualcomm Atheros QCA61x4A"
    wifi_mac: "74:4c:a1:d6:08:ad"
    dfs_root: "C:\\Design File Server"
    design_folder: "C:\\Design File Server\\DR_DL"
    storage_folder: "C:\\Design File Server\\Storage"
    config_file: "C:\\Design File Server\\DesignFileServer(F).ini"
    comm_config: "C:\\Design File Server\\DC_COM.dat"
    system_report: "C:\\Design File Server\\Info\\LEM_System.txt"
    config_tool: "C:\\Design File Server\\LEMServer_Config(F).exe"
    port: 8000
    reliability_warning: >
      Laptop is on WiFi, not wired Ethernet. WiFi drops observed during
      2026-03-25 session — laptop went from fully reachable to ARP INCOMPLETE
      within 45 minutes. No DHCP reservation; IP could change on lease renewal.
  barudan:
    ip: 192.168.1.230
    mac: "00:0c:11:80:38:a6"
    model: "BEKY-S1506CII"
    serial: "3130544J20"
    expected_server_ip: 192.168.1.137
    expected_server_port: 8000
    network_status: "UNREACHABLE as of 2026-03-25 — ARP INCOMPLETE from PVE and DFS laptop"
    blocker: "GAP-OP-1675 — Cat 8 cable / switch chain incompatibility"

delivery_pipeline:
  description: >
    The governed delivery pipeline moves design files from MinIO (mint-data)
    through PVE to the DFS laptop's DR_DL folder. DFS then serves them to
    the Barudan on demand.
  verified_segments:
    ssh_chain: "macbook → PVE (Tailscale) → DFS laptop — VERIFIED 2026-03-25"
    file_write: "echo redirect to DR_DL via SSH — VERIFIED 2026-03-25"
    file_read: "type from DR_DL via SSH — VERIFIED 2026-03-25"
    scp_to_dfs: "NOT YET VERIFIED — laptop went down before SCP test"
    minio_to_pve: "NOT YET VERIFIED — blocked by laptop downtime"
    dfs_to_barudan: "NOT YET VERIFIED — Barudan L2 unreachable"
  steps:
    - name: "export"
      description: "Design file exported from MinIO on mint-data"
      source: "ubuntu@192.168.1.212 (mint-data MinIO)"
      capability: "mint.production.package.export"
    - name: "transfer_to_pve"
      description: "SCP from mint-data to PVE staging"
      command: 'ssh root@100.96.211.33 "scp ubuntu@192.168.1.212:/path/to/design.dst /tmp/"'
      proxy: "root@100.96.211.33 (pve via Tailscale)"
    - name: "deliver_to_dfs"
      description: "SCP from PVE to DFS laptop DR_DL folder"
      command: "ssh root@100.96.211.33 \"scp /tmp/design.dst marll@192.168.1.137:'C:\\\\Design File Server\\\\DR_DL\\\\'\""
      proxy: "root@100.96.211.33 (pve)"
    - name: "operator_select"
      description: "Operator selects design on Barudan control panel via INPUT button"
      manual: true
    - name: "verify"
      description: "Confirm file exists in DR_DL via SSH"
      command: 'ssh root@100.96.211.33 "ssh marll@192.168.1.137 ''dir \"C:\\Design File Server\\DR_DL\\design.dst\"''"'

  one_liner_delivery: >
    ssh root@100.96.211.33 "scp ubuntu@192.168.1.212:/path/design.dst /tmp/ &&
    scp /tmp/design.dst marll@192.168.1.137:'C:\\Design File Server\\DR_DL\\'"

  one_liner_verify: >
    ssh root@100.96.211.33 "ssh marll@192.168.1.137 'dir \"C:\\Design File Server\\DR_DL\"'"

  one_liner_cleanup: >
    ssh root@100.96.211.33 "ssh marll@192.168.1.137 'del \"C:\\Design File Server\\DR_DL\\design.dst\"'"

dfs_application_state:
  observed_at: "2026-03-25"
  process: "DesignFileServer(F).exe — NOT VERIFIED (laptop went down before tasklist check)"
  machine_registration: "NONE — DC_COM.dat has 3 empty/disabled comm slots"
  mishin_connect_log: "empty (---)"
  server_config:
    server_name: ""
    sntp: disabled
    smtp: disabled
    ftp: disabled
    db_port: 5432
    db_ip: ""
    status_interval: 0.5
    web: disabled
  action_required: >
    Operator must register Barudan in DFS via LEMServer_Config(F).exe with
    IP 192.168.1.230 and port 8000. Blocked until Barudan is network-reachable
    (GAP-OP-1675).

operational_notes:
  - "DFS must be running on the laptop (DesignFileServer(F).exe) for the Barudan to pull designs"
  - "The Barudan connects TO the DFS server, not vice versa"
  - "If the Barudan can't see designs: check DFS is running, check Server IP on machine matches .137"
  - "DFS only serves one machine via LAN at a time"
  - "DR_DL is the download/delivery folder, Storage is for archived designs"
  - "Supported formats: .U00/.U01 (Barudan native), .DST (Tajima, widely compatible)"
  - "The DFS laptop is on WiFi — if WiFi drops, DFS becomes unreachable"
  - "PVE is the SSH proxy for all shop LAN access (root@100.96.211.33 via Tailscale)"
  - "INI ADRIVE setting: *.U?? — DFS filters for Barudan-native formats on removable media"

troubleshooting:
  barudan_cant_see_designs:
    - "Check DFS is running: tasklist | findstr /i \"Design File\""
    - "Check port 8000 listening: netstat -an | findstr 8000"
    - "Check Barudan Server IP setting is 192.168.1.137"
    - "Check Barudan Server Port setting is 8000"
    - "Check both devices on same subnet: ping from laptop to .230"
    - "Restart DFS application"
  file_delivery_fails:
    - "Check SSH to DFS laptop: ssh marll@192.168.1.137 'echo ok'"
    - "Check DR_DL folder writable: echo test > DR_DL\\test.txt"
    - "Check disk space: ~356GB free as of 2026-03-25"
  laptop_unreachable:
    - "Laptop may be asleep — physically wake it"
    - "WiFi may have dropped — check Shop WiFi SSID connection on laptop"
    - "DHCP lease may have expired — check UDR6 client list"
    - "No DHCP reservation exists (GAP-OP-1677) — IP could have changed"

contracts:
  delivery_authority: ops/bindings/mint.production.machine.delivery.authority.yaml
  export_authority: ops/bindings/mint.production.package.export.authority.yaml
  device_registry: ops/bindings/shop.device.registry.yaml
  ssh_targets: ops/bindings/ssh.targets.yaml

open_gaps:
  - "GAP-OP-1675: Barudan L2 unreachable (critical, blocker)"
  - "GAP-OP-1676: Device registry says is_wired but laptop is WiFi (high)"
  - "GAP-OP-1677: No DHCP reservation for DFS laptop (high)"
  - "GAP-OP-1678: No Barudan registered in DFS application (high)"
  - "GAP-OP-1679: mint.production.machine.deliver capability missing (medium)"
  - "GAP-OP-1680: mint.production.machine.delivery.verify capability missing (medium)"
