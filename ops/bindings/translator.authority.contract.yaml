---
status: authoritative
owner: "@ronny"
scope: translator-authority-boundary
version: 2
updated: "2026-03-29"

doctrine_source: docs/governance/TRANSLATOR_AUTHORITY_DOCTRINE_V1.md
doctrine_section: "Translator Boundary Rules"
deprecation_ref: DEP-V3-003

description: >
  Machine-evaluable boundary for the translator role.
  The translator is the membrane, not the judge.
  It may interpret intent, but it must never become the spine seal of success.

canonical_authority:
  status: repo_translator_stack_is_single_authority
  authority_surfaces:
    - ops/bindings/translator.authority.contract.yaml
    - ops/bindings/translator.workload.contract.yaml
    - docs/governance/TRANSLATOR_AUTHORITY_DOCTRINE_V1.md
    - ops/bindings/communication.protocol.contract.yaml
    - ops/bindings/prompt.registry.yaml
    - ops/bindings/prompt.library.contract.yaml
    - ops/plugins/core/session/templates/
  adapter_policy:
    rule: thin_adapter_only
    allowed_responsibilities:
      - tool_specific_bootstrap_mechanics
      - tool_native_ux_guidance
      - bounded_prompt_formatting
      - status_rendering_conventions
      - environment_connection_details
    forbidden_responsibilities:
      - parallel_translator_authority_definition
      - parallel_routing_taxonomy
      - duplicated_boundary_rules
      - duplicated_forbidden_action_rules
      - runtime_authority_claims
  workload_contract:
    file: ops/bindings/translator.workload.contract.yaml
    relationship: "Machine-readable W1/W2/W3 workload truth only. Does not widen translator authority or imply runtime delivery."

allowed_actions:
  - id: input_ingestion
    description: "Receive messy human or chat input."
  - id: classification
    description: "Classify input using the canonical concern classes and signal routing surfaces."
  - id: normalization
    description: "Normalize input into structured spine requests."
  - id: routing
    description: "Route normalized requests to the correct execution surface."
  - id: status_translation
    description: "Render attested outputs back to the user in human-readable form."
  - id: session_continuity
    description: "Maintain light session state for multi-turn interpretation."
  - id: chat_native_ingress
    description: "Optional chat-native interface layers (e.g. OpenClaw)."

forbidden_actions:
  - id: repo_mutation
    description: "No git add, commit, push, or file writes to governed repos."
    enforcement: "role.runtime.control.contract.yaml read_only_roles + D422 gate"
  - id: execution_authority
    description: "No capability execution, loop advancement, or lane dispatch."
    enforcement: "role.runtime.control.contract.yaml read_only_roles + D422 gate"
  - id: verification_authority
    description: "No gate evaluation, verify runs, or attestation issuance."
    enforcement: "role.runtime.control.contract.yaml read_only_roles + D422 gate"
  - id: git_authority
    description: "No branch creation, merge, rebase, or tag operations."
    enforcement: "role.runtime.control.contract.yaml read_only_roles + D422 gate"
  - id: success_claims
    description: "No final verdicts, loop closures, or completion attestation."
    enforcement: "role.runtime.control.contract.yaml read_only_roles + D422 gate"

concern_boundary:
  owns:
    - input_interpretation
    - intent_classification
    - request_normalization
    - output_rendering
    - routing_decision
  delegates_to:
    control_plane:
      - loop_state
      - attestation
      - execution_dispatch
      - gate_evaluation
    domain_agents:
      - service_operations
      - infrastructure_changes
      - domain_data_mutations
    governance:
      - contract_enforcement
      - schema_validation
      - convergence_verification

routing_contract:
  description: >
    The translator decides where to send work based on input signal classification.
    Spine concerns route to the control plane. Domain concerns route to domain agents.
  decision_method: signal_classification
  supplemental_classification: four_class_concern_vocabulary
  fallback: control_plane
  note: >
    The four-class concern vocabulary supplements the signal-based routing
    table below. It does not replace the existing signal classification
    substrate and does not itself imply runtime routing implementation.

routing_class_vocabulary:
  role: supplemental_classification_layer
  relationship_to_signal_table: supplement_not_replacement
  classes:
    - id: platform_architecture_or_governance
      primary_target: control_plane
      description: "Identity, workflow, runtime, doctrine, bindings, gates, and control-plane behavior."
    - id: platform_workload
      primary_target: control_plane
      description: "Platform-owned workload families routed through the spine runtime."
    - id: domain_workload
      primary_target: domain_agent
      description: "Domain-specific runtimes such as media, Home Assistant, finance, mint, and communications."
    - id: external_membrane_or_operator_rail
      primary_target: control_plane
      execution_posture: read_or_draft_only_until_governed_adapter_exists
      description: "External or operator-rail surfaces that are not governed writers yet."

routing_decision_table:
  spine_concern_signals:
    - signal: gate_failure
      target: control_plane
      action: "Route to verify subsystem for gate re-evaluation."
    - signal: projection_drift
      target: control_plane
      action: "Route to projection rebuild capability."
    - signal: schema_violation
      target: control_plane
      action: "Route to schema audit capability."
    - signal: lifecycle_transition
      target: control_plane
      action: "Route to loop/gap lifecycle management."
    - signal: self_governance
      target: control_plane
      action: "Route to governance audit or friction queue."

  domain_concern_signals:
    - signal: customer_request
      target: domain_agent
      routing_key: "agent-route domain classification"
      action: "Route to matched domain agent via agent-route."
    - signal: service_operation
      target: domain_agent
      routing_key: "workflow-route vocabulary match"
      action: "Route to matched workflow via workflow-route."
    - signal: infrastructure_change
      target: domain_agent
      routing_key: "infra domain"
      action: "Route to infrastructure agent for execution."
    - signal: domain_specific_data
      target: domain_agent
      routing_key: "agent-route domain classification"
      action: "Route to owning domain agent for data mutation."

isolation_guards:
  - location: ops/bindings/role.runtime.control.contract.yaml
    check: "read_only_roles includes translator-mapped roles; mutating_roles excludes them"
  - location: ops/deprecations.yaml
    check: "DEP-V3-003 blocks translator authority collapse"
  - location: ops/bindings/authority.concerns.yaml
    check: "translator_authority_surfaces concern family registered"
