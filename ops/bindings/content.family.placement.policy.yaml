# Content Family Placement And Lifecycle Policy
# Non-secret. Spine-native.
# Status: authoritative
# authority_state: authoritative
# Scope: content-family-placement
#
# This binding makes content families and planes the canonical placement truth.
# VM names and residual service stacks must not silently become product meaning.

version: 1
status: authoritative
authority_state: authoritative
updated: "2026-03-22"
owner: "@ronny"
scope: content-family-placement

policy:
  canonical_rule: content_families_define_plane_truth
  decommission_rule: may_not_retire_required_storage_or_service_planes_while_any_family_lists_them_as_required
  residual_rule: residual_service_planes_must_not_be_treated_as_canonical_family_authority
  planned_rule: planned_families_must_not_backdoor_existing_residual_vms_into_future_authority

storage_planes:
  home.media.movies.active:
    site: home
    status: active
    plane_class: active_hot
    canonical_refs:
      - synology918:/volume1/media-staging/movies
      - media-home:/srv/media/movies
    source_authorities:
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - ops/bindings/media.path.authority.contract.yaml
    description: Canonical hot/current movie plane on home.
  home.media.tv.active:
    site: home
    status: active
    plane_class: active_hot
    canonical_refs:
      - synology918:/volume1/media-staging/tv
      - media-home:/srv/media/tv
    source_authorities:
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - ops/bindings/media.path.authority.contract.yaml
    description: Canonical hot/current TV plane on home.
  home.media.music.active:
    site: home
    status: active
    plane_class: active_hot
    canonical_refs:
      - synology918:/volume1/media-staging/music
      - media-home:/srv/media/music
    source_authorities:
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - ops/bindings/media.path.authority.contract.yaml
    description: Canonical hot/current music plane on home.
  home.media.stage:
    site: home
    status: active
    plane_class: intake_stage
    canonical_refs:
      - synology918:/volume1/media-staging/downloads
      - media-home:/srv/media/downloads
    source_authorities:
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - ops/bindings/service.data.lifecycle.registry.yaml
    description: New arrivals land here before canonical placement.
  home.media.review:
    site: home
    status: active
    plane_class: review_hold
    canonical_refs:
      - synology918:/volume1/media-holds
    source_authorities:
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - ops/bindings/storage.scaffold.authority.yaml
    description: Explicit hold/review lane, not the main library.
  shop.media.movies.archive:
    site: shop
    status: active
    plane_class: cold_archive
    canonical_refs:
      - pve:/md1400/archive/media/movies
    source_authorities:
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
    description: Canonical cold archive destination for watched/aged movies.
  shop.media.tv.archive:
    site: shop
    status: active
    plane_class: cold_archive
    canonical_refs:
      - pve:/md1400/archive/media/tv
    source_authorities:
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
    description: Canonical cold archive destination for selective TV archive.
  shop.media.music.archive:
    site: shop
    status: active
    plane_class: cold_archive
    canonical_refs:
      - pve:/md1400/archive/media/music
    source_authorities:
      - docs/governance/MEDIA_STORAGE_LIFECYCLE.md
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
    description: Canonical cold archive destination for selective music archive.
  home.media.config_backup.primary:
    site: home
    status: active
    plane_class: backup_primary
    canonical_refs:
      - nas:/volume1/backups/apps/media-config
    source_authorities:
      - ops/bindings/backup.inventory.yaml
    description: Primary config-state backup lane for the media-home family service plane.
  shop.media.config_backup.secondary:
    site: shop
    status: active
    plane_class: backup_secondary
    canonical_refs:
      - pve:/md1400/backup-cold/apps/media-config
    source_authorities:
      - ops/bindings/backup.inventory.yaml
    description: Secondary/offsite cold copy for media-home config-state backups.
  shop.media.residual.compatibility:
    site: shop
    status: residual
    plane_class: residual_compatibility
    canonical_refs:
      - pve:/media
      - download-stack:/mnt/media
      - streaming-stack:/mnt/media
    source_authorities:
      - docs/governance/MEDIA_STORAGE_CONTRACT.md
      - ops/bindings/shop.storage.map.yaml
      - ops/bindings/vm.lifecycle.yaml
    description: Residual compatibility plane only. Never the canonical family authority.
  shop.photos.active:
    site: shop
    status: active
    plane_class: active_library
    canonical_refs:
      - immich:/mnt/pve-immich-upload
      - immich:/tank/immich/db
      - pve:/tank/immich/uploads-vm203
    source_authorities:
      - ops/bindings/service.data.lifecycle.registry.yaml
      - ops/bindings/shop.storage.map.yaml
      - ops/bindings/vm.lifecycle.yaml
    description: Canonical active photo-management plane on shop.
  home.photos.archive:
    site: home
    status: active
    plane_class: personal_archive
    canonical_refs:
      - nas:/volume1/photo-keepers
    source_authorities:
      - ops/bindings/home.storage.map.yaml
    description: Canonical keeper/archive surface for home personal photos.
  shop.photos.backup.primary:
    site: shop
    status: active
    plane_class: backup_primary
    canonical_refs:
      - pve:/md1400/backup-cold/vzdump/pve
    source_authorities:
      - ops/bindings/backup.inventory.yaml
    description: VM-level primary backup lane covering Immich runtime/state via vm-203-primary.
  photos.legacy.residue:
    site: mixed
    status: residual
    plane_class: residue_review
    canonical_refs:
      - pve:/tank/immich/photos
      - nas:/volume1/im2ch
    source_authorities:
      - ops/bindings/service.data.lifecycle.registry.yaml
      - ops/bindings/home.storage.map.yaml
    description: Legacy photo residue pending verify-then-tombstone. Not canonical intake or active placement.
  shop.games.active:
    site: shop
    status: planned
    plane_class: active_library
    canonical_refs: []
    source_authorities: []
    description: Planned shop-primary active plane for games. No runtime root assigned yet.
  shop.games.stage:
    site: shop
    status: planned
    plane_class: intake_stage
    canonical_refs: []
    source_authorities: []
    description: Planned operator/game intake stage. No runtime root assigned yet.
  shop.games.review:
    site: shop
    status: planned
    plane_class: review_hold
    canonical_refs: []
    source_authorities: []
    description: Planned review/staging hold for games. No runtime root assigned yet.
  shop.games.archive:
    site: shop
    status: planned
    plane_class: cold_archive
    canonical_refs: []
    source_authorities: []
    description: Planned cold/archive plane for games. No runtime root assigned yet.
  shop.games.backup.primary:
    site: shop
    status: planned
    plane_class: backup_primary
    canonical_refs: []
    source_authorities: []
    description: Planned primary backup lane for future games family runtime/state.
  shop.games.backup.secondary:
    site: shop
    status: planned
    plane_class: backup_secondary
    canonical_refs: []
    source_authorities: []
    description: Planned secondary backup lane for future games family runtime/state.

service_planes:
  media-home:
    site: home
    status: active
    plane_class: active_workflow
    vm_ref: media-home
    source_authorities:
      - ops/bindings/vm.lifecycle.yaml
      - docs/governance/SERVICE_REGISTRY.yaml
    description: Canonical active media workflow and watch plane.
  download-stack:
    site: shop
    status: residual
    plane_class: residual_writer_fallback
    vm_ref: download-stack
    source_authorities:
      - ops/bindings/vm.lifecycle.yaml
      - docs/governance/SERVICE_REGISTRY.yaml
    description: Residual shop downloads/import compatibility. Not canonical family authority.
  streaming-stack:
    site: shop
    status: residual
    plane_class: residual_playback_fallback
    vm_ref: streaming-stack
    source_authorities:
      - ops/bindings/vm.lifecycle.yaml
      - docs/governance/SERVICE_REGISTRY.yaml
    description: Residual shop playback compatibility. Not canonical family authority.
  immich:
    site: shop
    status: active
    plane_class: active_photo_management
    vm_ref: immich
    source_authorities:
      - ops/bindings/vm.lifecycle.yaml
      - docs/governance/SERVICE_REGISTRY.yaml
    description: Canonical active photo-management service plane on shop.
  games-stack:
    site: shop
    status: planned
    plane_class: planned_family_service
    vm_ref: null
    source_authorities: []
    description: Planned games service plane placeholder. Explicitly not satisfied by download-stack or streaming-stack.

families:
  photos:
    family_id: photos
    active_plane:
      plane_id: shop.photos.active
      posture: canonical_active
    archive_plane:
      plane_id: home.photos.archive
      posture: keeper_archive
    intake_stage:
      plane_id: shop.photos.active
      posture: direct_import
    review_hold:
      plane_id: photos.legacy.residue
      posture: verify_then_tombstone
    rehydration_target:
      plane_id: shop.photos.active
      posture: in_place_active
    backup_primary:
      plane_id: shop.photos.backup.primary
      posture: vm_primary
    backup_secondary:
      plane_id: null
      posture: undeclared
      note: No distinct secondary photo backup lane is declared in current canon.
    retention_policy: keep_shop_active_library_plus_home_keeper_archive
    lifecycle_policy: import_curate_keepers_archive_without_separate_cold_rehydrate_loop
    service_authority:
      primary_service_planes:
        - immich
      residual_compatibility_planes: []
      planned_service_planes: []
    decommission_dependencies:
      required_storage_planes:
        - shop.photos.active
        - home.photos.archive
        - shop.photos.backup.primary
      optional_storage_planes:
        - photos.legacy.residue
      required_service_planes:
        - immich
      optional_service_planes: []
      planned_service_planes: []
      prohibited_future_placeholders:
        - download-stack
        - streaming-stack
    description: Photos are shop-primary for active management but still retain an explicit home keeper/archive plane.
  media.movies:
    family_id: media.movies
    active_plane:
      plane_id: home.media.movies.active
      posture: canonical_active
    archive_plane:
      plane_id: shop.media.movies.archive
      posture: watched_aged_archive
    intake_stage:
      plane_id: home.media.stage
      posture: bounded_stage
    review_hold:
      plane_id: home.media.review
      posture: operator_review
    rehydration_target:
      plane_id: home.media.movies.active
      posture: return_to_hot_home
    backup_primary:
      plane_id: home.media.config_backup.primary
      posture: service_config_primary
    backup_secondary:
      plane_id: shop.media.config_backup.secondary
      posture: service_config_secondary
    retention_policy: watch_hot_then_archive_after_age_and_no_active_reference
    lifecycle_policy: request_ingest_import_watch_archive_rehydrate_tombstone
    service_authority:
      primary_service_planes:
        - media-home
      residual_compatibility_planes:
        - download-stack
        - streaming-stack
      planned_service_planes: []
    decommission_dependencies:
      required_storage_planes:
        - home.media.movies.active
        - home.media.stage
        - home.media.review
        - shop.media.movies.archive
        - home.media.config_backup.primary
        - shop.media.config_backup.secondary
      optional_storage_planes:
        - shop.media.residual.compatibility
      required_service_planes:
        - media-home
      optional_service_planes:
        - download-stack
        - streaming-stack
      planned_service_planes: []
      prohibited_future_placeholders: []
    description: Movies are home-hot, shop-cold. Residual shop media VMs do not define the family.
  media.tv:
    family_id: media.tv
    active_plane:
      plane_id: home.media.tv.active
      posture: canonical_active
    archive_plane:
      plane_id: shop.media.tv.archive
      posture: selective_pressure_archive
    intake_stage:
      plane_id: home.media.stage
      posture: bounded_stage
    review_hold:
      plane_id: home.media.review
      posture: operator_review
    rehydration_target:
      plane_id: home.media.tv.active
      posture: return_to_hot_home
    backup_primary:
      plane_id: home.media.config_backup.primary
      posture: service_config_primary
    backup_secondary:
      plane_id: shop.media.config_backup.secondary
      posture: service_config_secondary
    retention_policy: stay_hot_on_home_unless_pressure_or_operator_archive_requires_cold
    lifecycle_policy: request_ingest_import_watch_resident_archive_by_exception_rehydrate_to_home
    service_authority:
      primary_service_planes:
        - media-home
      residual_compatibility_planes:
        - download-stack
        - streaming-stack
      planned_service_planes: []
    decommission_dependencies:
      required_storage_planes:
        - home.media.tv.active
        - home.media.stage
        - home.media.review
        - home.media.config_backup.primary
        - shop.media.config_backup.secondary
      optional_storage_planes:
        - shop.media.tv.archive
        - shop.media.residual.compatibility
      required_service_planes:
        - media-home
      optional_service_planes:
        - download-stack
        - streaming-stack
      planned_service_planes: []
      prohibited_future_placeholders: []
    description: TV remains home-hot by default. Cold archive exists but is selective, not the default lifecycle.
  media.music:
    family_id: media.music
    active_plane:
      plane_id: home.media.music.active
      posture: canonical_active
    archive_plane:
      plane_id: shop.media.music.archive
      posture: selective_pressure_archive
    intake_stage:
      plane_id: home.media.stage
      posture: bounded_stage
    review_hold:
      plane_id: home.media.review
      posture: operator_review
    rehydration_target:
      plane_id: home.media.music.active
      posture: return_to_hot_home
    backup_primary:
      plane_id: home.media.config_backup.primary
      posture: service_config_primary
    backup_secondary:
      plane_id: shop.media.config_backup.secondary
      posture: service_config_secondary
    retention_policy: stay_hot_on_home_unless_pressure_or_operator_archive_requires_cold
    lifecycle_policy: request_ingest_import_listen_resident_archive_by_exception_rehydrate_to_home
    service_authority:
      primary_service_planes:
        - media-home
      residual_compatibility_planes:
        - download-stack
        - streaming-stack
      planned_service_planes: []
    decommission_dependencies:
      required_storage_planes:
        - home.media.music.active
        - home.media.stage
        - home.media.review
        - home.media.config_backup.primary
        - shop.media.config_backup.secondary
      optional_storage_planes:
        - shop.media.music.archive
        - shop.media.residual.compatibility
      required_service_planes:
        - media-home
      optional_service_planes:
        - download-stack
        - streaming-stack
      planned_service_planes: []
      prohibited_future_placeholders: []
    description: Music remains home-hot by default. No claim is made that a full cold-archive loop is already routine.
  games:
    family_id: games
    active_plane:
      plane_id: shop.games.active
      posture: planned_shop_primary
    archive_plane:
      plane_id: shop.games.archive
      posture: planned_shop_archive
    intake_stage:
      plane_id: shop.games.stage
      posture: planned_intake
    review_hold:
      plane_id: shop.games.review
      posture: planned_review
    rehydration_target:
      plane_id: shop.games.active
      posture: planned_return_to_shop_primary
    backup_primary:
      plane_id: shop.games.backup.primary
      posture: planned_primary
    backup_secondary:
      plane_id: shop.games.backup.secondary
      posture: planned_secondary
    retention_policy: planned_shop_primary_family_with_optional_home_cache_by_exception
    lifecycle_policy: planned_intake_install_play_archive_restore_retire
    service_authority:
      primary_service_planes: []
      residual_compatibility_planes: []
      planned_service_planes:
        - games-stack
    decommission_dependencies:
      required_storage_planes: []
      optional_storage_planes: []
      required_service_planes: []
      optional_service_planes: []
      planned_service_planes:
        - games-stack
      prohibited_future_placeholders:
        - download-stack
        - streaming-stack
    description: Games is explicitly declared now so future shop compute/storage becomes intentional instead of accidental reuse of residual media VMs.
