# Worktree Lifecycle Contract
# Status: authoritative
# Last verified: 2026-02-27
# Scope: D48 lifecycle-aware worktree hygiene for multi-terminal wave/loop runtime

version: "1.4"
updated: "2026-03-20"
owner: "@ronny"
scope: worktree-lifecycle

policy:
  main_branch: "main"
  canonical_worktree_root: "/Users/ronnyworks/code/.runtime/spine/tmp/worktrees"
  canonical_temp_clone_root: "/Users/ronnyworks/code/.runtime/spine/tmp/clones"
  managed_worktree_paths:
    - "/Users/ronnyworks/.wt/agentic-spine/runtime-scheduler"
  canonical_worktree_layout: "<root>/agentic-spine/<wave>"
  lease_filename: ".spine-lane-lease.yaml"
  lease_ttl_hours_default: 24
  local_branch_prefixes_allow_no_remote:
    - "codex/"
    - "orchestration/"
  merged_branch_grace_hours: 24
  closed_owner_grace_hours: 6
  unowned_local_branch_grace_hours: 168
  temp_clone_grace_hours: 24
  main_stash_warn_hours: 24
  main_stash_fail_hours: 72
  fail_on_detached_head: true
  fail_on_dirty_when_owner_closed: true
  warn_on_dirty_when_owner_active: true
  fail_on_dirty_temp_clone: true
  fail_on_missing_temp_clone_origin: true
  fail_on_root_non_main: true
  fail_on_root_dirty: true

cleanup:
  phases:
    - report-only
    - archive-only
    - delete
  delete_token_env_var: "OPS_WORKTREE_DELETE_TOKEN"
  delete_token_value: "RELEASE_MAIN_CLEANUP_WINDOW"
  require_archive_before_delete: true
  require_branch_merged_or_explicit_token: true
  block_if_active_lease: true
  normalize_root_when_head_matches_main: true
  require_clean_temp_clone_for_delete: true
  root_normalization_contracts:
    - "ops/bindings/snapshot.surface.contract.yaml"
    - "ops/bindings/terminal.worker.projection.contract.yaml"
  root_normalization_drop_cleanup_candidate_stashes: true
  root_normalization_require_ff_only_main_update: true

runtime:
  archive_root: "~/.local/state/agentic-spine/worktree-lifecycle-archive"
  waves_state_dir: "/Users/ronnyworks/code/.runtime/spine/state/waves"
  loops_scope_dir: "/Users/ronnyworks/code/.runtime/spine/state/loop-scopes"

messages:
  remediation: "Use `./bin/ops wave start <WAVE_ID> --objective \"...\" --repo /Users/ronnyworks/code/agentic-spine` to provision `/Users/ronnyworks/code/.runtime/spine/tmp/worktrees/agentic-spine/<WAVE_ID>`, or `./bin/ops cap run worktree.lifecycle.rehydrate -- --branch codex/<WAVE_ID> --lane <WAVE_ID> --repo /Users/ronnyworks/code/agentic-spine`."
  gate_summary: "D48 enforces lifecycle violations across governed worktrees, repo-scoped temp clones, boring-root normalization, managed infrastructure worktrees, and retained stashes (closed-owner zombies, detached heads, stale temp clones, non-main root checkouts, managed worktree drift, aged main stashes, and auto-healable generated root drift)."
