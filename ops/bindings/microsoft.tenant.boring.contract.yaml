# Status: authoritative
# Last verified: 2026-03-17

version: 1
updated_at: "2026-03-17"
owner: "@ronny"
scope: microsoft-tenant-boringness

purpose: |
  Define the smallest safe boring-state for the Mint Microsoft tenant: only the
  active humans stay live, customer mail stays on the canonical shared lane, and
  former-employee history is preserved in mail-archiver instead of being kept
  alive through lingering Microsoft identities.

authority:
  active_human_users:
    - ronny@mintprints.com
    - mike@mintprints.com
    - eva@mintprints.com
  shared_customer_mailboxes:
    - team@mintprints.com
  parked_legacy_mailboxes:
    - info-legacy@mintprints.onmicrosoft.com
  transactional_system_mailboxes:
    - no-reply@mintprints.com
  alias_only_ingress:
    - info@mintprints.com

operating_model:
  tenant_shape:
    rule: "Microsoft stays small: one owner mailbox, one canonical customer shared mailbox, only current employees licensed for real work."
    active_employee_assertion: "Mike@mintprints.com and Eva@mintprints.com are the only current employees besides Ronny."
    verified_at: "2026-03-17"
  mailbox_history:
    source_of_truth: mail-archiver-vm214
    rule: "Former employee mail needed for Morpheus, Artie, Fin, or customer-history lookup must live in mail-archiver, not in a live everyday Microsoft identity."
  identity_rules:
    allowed_enabled_humans:
      - ronny@mintprints.com
      - mike@mintprints.com
      - eva@mintprints.com
    expected_disabled_nonhuman_signin:
      - team@mintprints.com
      - info-legacy@mintprints.onmicrosoft.com
      - no-reply@mintprints.com
    rule: "Any enabled Mint member identity outside the allowed human set is drift until explicitly justified."
  license_principles:
    - "Keep exactly the licenses needed for the real job being done."
    - "Do not keep a user enabled just because free viral add-ons are attached."
    - "Keep Teams-capable licensing only for active staff who actually use Teams or clock-in workflows."
    - "Former employee retention belongs in mail-archiver, not in paid mailbox sprawl."

former_employee_retention_policy:
  intent: "Preserve client history while shrinking tenant noise and cost."
  offboarding_preconditions:
    - "Mailbox is still readable in Microsoft or a final export artifact exists."
    - "Mail-archiver has explicit coverage for that mailbox via live-sync linkage, import-only account entry, or governed import evidence."
    - "A governed receipt proves the archive import or linkage state."
  post_archive_actions:
    - "Disable sign-in."
    - "Remove paid licenses not required for a short retention/export window."
    - "Revoke sessions."
    - "Remove delegate, SendAs, and FullAccess rights."
    - "Hide or park the mailbox if it must remain for retention only."
  forbidden_shortcuts:
    - "Do not keep former employee identities enabled just for historical lookup."
    - "Do not delete mailbox history before archive proof exists."

role_model:
  owner:
    mailbox: ronny@mintprints.com
    note: "Owner/admin mailbox. Keep exactly one primary owner mailbox surface."
  active_staff:
    - mailbox: mike@mintprints.com
      note: "Active employee; Teams/clocking support may justify current licensing."
    - mailbox: eva@mintprints.com
      note: "Active employee; Teams/clocking support may justify current licensing."
  shared_operations:
    - mailbox: team@mintprints.com
      note: "Canonical customer shared mailbox."
    - mailbox: no-reply@mintprints.com
      note: "Hidden transactional-only sender."

verification:
  live_audit_script: ops/plugins/providers/microsoft/bin/microsoft-tenant-boring-audit
  supporting_contracts:
    - ops/bindings/mint.customer.mailbox.standard.contract.yaml
    - ops/bindings/mail.archiver.account.linkage.contract.yaml
    - ops/bindings/mail.archiver.alias.boundary.contract.yaml
    - ops/bindings/microsoft.entra.admin.app.contract.yaml
  commands:
    - ./ops/plugins/providers/microsoft/bin/microsoft-tenant-boring-audit
    - ./ops/plugins/providers/microsoft/bin/microsoft-tenant-boring-deprecate --contract-check
    - ./bin/ops cap run verify.run -- domain microsoft

deprecation_program:
  automation_app_contract: ops/bindings/microsoft.entra.admin.app.contract.yaml
  governed_command: ops/plugins/providers/microsoft/bin/microsoft-tenant-boring-deprecate
  approved_targets:
    - identity: info-legacy@mintprints.onmicrosoft.com
      category: parked_legacy_mailbox
      archive_requirement: none
      rationale: "Legacy ingress mailbox parked after info@ alias cutover."
    - identity: aly@mintprints.com
      category: former_employee
      archive_requirement: required
      rationale: "Historical mailbox retained in mail-archiver."
    - identity: areaf@mintprints.onmicrosoft.com
      category: test_project
      archive_requirement: waived
      rationale: "User-approved test mailbox with no business value."
    - identity: brandingconsultation@mintprints.com
      category: test_project
      archive_requirement: waived
      rationale: "User-approved test mailbox with no business value."
