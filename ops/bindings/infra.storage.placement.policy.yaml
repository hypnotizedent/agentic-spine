# Infrastructure Storage Placement Policy (SSOT)
# Non-secret. Spine-native.
# Status: authoritative
# Last verified: 2026-02-26
# Created: LOOP-STORAGE-BOOT-DRIVE-AUDIT-20260226
#
# Authority: This binding declares what storage tier each VM's persistent
# data should use. The VM creation contract references this binding in
# the PROVISION phase to determine data disk requirements.
#
# Storage tiers:
#   boot-only      — No separate data disk needed (stateless or ephemeral workloads)
#   tank-docker    — ZFS dataset on pve:tank/docker (NFS export or zvol)
#   tank-vms       — ZFS zvol on pve:tank/vms (passed through as virtio disk)
#   nfs-media      — NFS mount from pve media pool (read-only or read-write)
#   local-ext4     — /opt/appdata on boot disk for SQLite (NFS-incompatible; intentional)
#   md1400         — md1400-backed live-share/archive datasets served directly
#
# Boot drive threshold: 80% usage triggers alert. >90% is critical.

version: 1
updated: "2026-03-12"
owner: "@ronny"

# What MUST be on boot drives (acceptable):
boot_drive_acceptable:
  - os_kernel_bootloader
  - docker_engine_binary
  - docker_image_layers        # read-mostly, cached
  - compose_files_and_env      # small config files
  - opt_appdata_sqlite          # NFS-incompatible, intentional
  - ephemeral_temp_data

# What MUST NOT be on boot drives (violations):
boot_drive_violations:
  - postgresql_data_directories
  - redis_persistence_files
  - document_storage            # paperless media/consume/export
  - vector_databases            # qdrant
  - git_repositories            # gitea
  - object_storage              # minio
  - timeseries_databases        # prometheus tsdb
  - log_ingestion_data          # loki
  - mail_server_data            # stalwart, mail-archiver
  - unbounded_growth_paths      # anything that grows without limit

# Boot drive usage thresholds
thresholds:
  boot_usage_warn_pct: 80
  boot_usage_critical_pct: 90

# Per-VM storage placement declarations
# placement_status: current = what IS happening, target = what SHOULD happen
vm_storage:
  docker-host:
    vm_id: 200
    boot_disk_gb: 300
    current_storage_tier: tank-docker
    target_storage_tier: tank-docker
    data_mount: /mnt/docker
    data_source: "pve:tank/docker (NFS)"
    placement_status: compliant
    description: "Legacy VM. Data on NFS /mnt/docker/mint-os-data/. Legacy docker volumes for migrated services."

  automation-stack:
    vm_id: 202
    boot_disk_gb: 100
    current_storage_tier: tank-vms
    target_storage_tier: tank-vms
    data_mount: null
    data_source: "pve:tank/vms/vm-202-disk-0 (ZFS zvol)"
    placement_status: partial
    description: "Boot disk is ZFS-backed zvol (not local-lvm). Docker volumes still on boot filesystem. Consider data disk for n8n/postgres."
    gap: GAP-OP-952

  immich:
    vm_id: 203
    boot_disk_gb: 100
    current_storage_tier: tank-docker
    target_storage_tier: tank-docker
    data_mount: null
    data_source: "pve:tank/immich (ZFS, 2.6TB)"
    placement_status: compliant
    description: "Photo library on tank/immich ZFS dataset. Boot disk on local-lvm but data is properly separated."

  infra-core:
    vm_id: 204
    boot_disk_gb: 50
    current_storage_tier: boot-only
    target_storage_tier: boot-only
    data_mount: null
    data_source: "Docker volumes on boot (250MB total)"
    placement_status: accepted-risk
    description: "22% boot usage (11GB/48GB). Volumes only 250MB. Data on boot but lightweight (Infisical/Authentik/VW/PiHole). Log rotation added. Re-evaluate if usage exceeds 60%."
    gap: GAP-OP-952

  observability:
    vm_id: 205
    boot_disk_gb: 50
    current_storage_tier: boot-only
    target_storage_tier: boot-only
    data_mount: null
    data_source: "Docker volumes on boot (1GB total)"
    placement_status: accepted-risk
    description: "20% boot usage (9.4GB/48GB). Volumes 1GB. Loki/Prometheus data small at current retention. Log rotation added. Re-evaluate if usage exceeds 60%."
    gap: GAP-OP-953

  dev-tools:
    vm_id: 206
    boot_disk_gb: 50
    current_storage_tier: boot-only
    target_storage_tier: boot-only
    data_mount: null
    data_source: "Docker volumes on boot (183MB total)"
    placement_status: accepted-risk
    description: "14% boot usage (6.3GB/48GB). Volumes 183MB. Gitea repos + PostgreSQL small at current scale. Log rotation added. Re-evaluate if usage exceeds 60%."
    gap: GAP-OP-954

  ai-consolidation:
    vm_id: 207
    boot_disk_gb: 200
    current_storage_tier: boot-only
    target_storage_tier: boot-only
    data_mount: null
    data_source: "Docker on boot (3.5GB total, 0 volumes)"
    placement_status: accepted-risk
    description: "5% boot usage (8.1GB/193GB). 200GB boot has massive headroom. Qdrant vectors + AnythingLLM small. Log rotation added. Re-evaluate if usage exceeds 40%."
    gap: GAP-OP-955

  download-stack:
    vm_id: 209
    boot_disk_gb: 50
    current_storage_tier: tank-docker
    target_storage_tier: tank-docker
    data_mount: /mnt/docker
    data_source: "pve:tank/docker/download-stack (NFS)"
    nfs_mounts:
      - path: /mnt/docker
        source: "192.168.1.184:/tank/docker/download-stack"
        mode: rw
      - path: /mnt/media
        source: "192.168.1.184:/media"
        mode: rw
    placement_status: compliant
    description: "Configs on NFS. /opt/appdata for SQLite (intentional). Media on NFS."

  streaming-stack:
    vm_id: 210
    boot_disk_gb: 50
    current_storage_tier: tank-docker
    target_storage_tier: tank-docker
    data_mount: /mnt/docker
    data_source: "pve:tank/docker/streaming-stack (NFS)"
    nfs_mounts:
      - path: /mnt/docker
        source: "192.168.1.184:/tank/docker/streaming-stack"
        mode: rw
      - path: /mnt/media
        source: "192.168.1.184:/media"
        mode: ro
    placement_status: compliant
    description: "Configs on NFS (RW), media on NFS (RO). Pruned images + truncated 2.9GB log, 54%→44%. Log rotation added."
    gap: GAP-OP-957

  finance-stack:
    vm_id: 211
    boot_disk_gb: 96
    current_storage_tier: boot-only
    target_storage_tier: boot-only
    data_mount: null
    data_source: "/opt/stacks/finance/data/ on boot (531MB)"
    placement_status: accepted-risk
    description: "12% boot usage (11GB/92GB) after truncating 59GB firefly-cron crash log. Actual data only 531MB. Fixed cron binary (crond→cron). Log rotation added. Re-evaluate if usage exceeds 60%."
    gap: GAP-OP-941

  mint-data:
    vm_id: 212
    boot_disk_gb: 50
    current_storage_tier: tank-vms
    target_storage_tier: tank-vms
    data_mount: /mnt/data
    data_source: "/dev/vda ext4 secondary disk mounted at /mnt/data; DockerRootDir=/mnt/data/docker"
    placement_status: compliant
    description: "Rebased to non-boot persistence: postgres/minio/redis bind mounts under /mnt/data/mint-data/* with Redis appendonly=yes. Root usage now 8% (48G boot), data disk 61% (118G)."
    gap: GAP-OP-956

  mint-apps:
    vm_id: 213
    boot_disk_gb: 50
    current_storage_tier: boot-only
    target_storage_tier: boot-only
    data_mount: null
    data_source: "none (stateless containers)"
    placement_status: compliant
    description: "Stateless containers. W8D hygiene applied: quote-page upload path bind-mounted to /opt/stacks/mint-apps/runtime/quote-page-uploads, build cache/image prune performed, weekly root-cron prune schedule installed."
    gap: GAP-OP-958

  communications-stack:
    vm_id: 214
    boot_disk_gb: 50
    current_storage_tier: tank-vms
    target_storage_tier: tank-vms
    data_mount: null
    data_source: "pve:tank/vms/vm-214-disk-0 (ZFS zvol, 1.06TB)"
    placement_status: partial
    description: "Boot is ZFS zvol (not local-lvm). Stalwart on named volume. Mail-archiver needs /srv/mail-archiver non-boot path."
    gap: GAP-OP-940

  surveillance-stack:
    vm_id: 215
    boot_disk_gb: 50
    current_storage_tier: tank-vms
    target_storage_tier: tank-vms
    data_mount: /srv/data/surveillance
    data_source: "/dev/vda ext4 secondary disk mounted at /mnt/data and surfaced via /srv/data/surveillance/{appstate,recordings,clips,snapshots} bind mounts."
    placement_status: compliant
    description: "Compose authority now lives at /srv/config/surveillance, durable appstate + media payload are surfaced at /srv/data/surveillance from the 100G secondary tank-vms disk, and cache is tmpfs-backed at /srv/runtime/surveillance/cache. No active surveillance runtime remains under /home."

  archive-smb:
    vm_id: 220
    boot_disk_gb: 8
    current_storage_tier: md1400
    target_storage_tier: md1400
    data_mount: /md1400
    data_source: "Authoritative md1400 live-share datasets /md1400/ronny-projects and /md1400/mint-legacy; rootfs protection via lxc vzdump."
    placement_status: compliant
    description: "LXC 220 serves md1400-backed archive/live-share data over Samba. Dataset contents restore from md1400 snapshot manifests; runtime rootfs restores from lxc vzdump."

# Remediation priority (by VM, ordered by urgency):
# VMs 204/205/206/207/210/211 resolved 2026-02-26: log rotation added, actual data small, accepted-risk.
remediation_priority:
  - vm_id: 212
    hostname: mint-data
    urgency: critical
    action: "Attach ZFS zvol, move PostgreSQL + MinIO + Redis to data disk (81% boot, 9.5G free)"
    owner: mint-terminal
