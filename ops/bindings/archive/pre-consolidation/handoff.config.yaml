# Session Handoff Contract
# Status: authoritative
# Last verified: 2026-02-18
# Scope: cross-session handoff lifecycle

version: "1.2"
updated_at: "2026-03-23"
owner: "@ronny"
scope: session-handoff

storage:
  directory: $SPINE_STATE/handoffs
  file_pattern: HO-YYYYMMDD-HHMMSS.yaml

defaults:
  ttl_hours: 72
  max_active: 20
  owner_fallback_env: USER

state_model:
  states: [active, parked, closed, expired]
  transition:
    active: [parked, closed, expired]
    parked: [closed, expired]

kinds:
  allowed: [session, parked_lane]
  default: session
  parked_lane:
    initial_state: parked
    required_fields:
      - review_date
    require_loops: true
    require_any_ref: true
    reference_fields:
      - branch_refs
      - tracking_refs
      - worktree_paths
      - preserved_commits
      - file_refs
      - plan_refs

required_fields:
  - id
  - state
  - owner
  - created_at_utc
  - expires_at_utc
  - summary
  - loops
  - actions

role_io:
  enabled: true
  policy_contract: ops/bindings/role.runtime.control.contract.yaml
  required_fields:
    - from_role
    - to_role
    - transition_gate
    - input_refs
    - output_refs
