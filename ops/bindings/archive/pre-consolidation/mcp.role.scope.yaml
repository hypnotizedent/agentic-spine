---
status: authoritative
owner: "@ronny"
updated_at: "2026-03-25"
scope: mcp-role-scope
description: >
  Maps MCP runtime roles to the capability domain prefixes
  they can see and execute. An agent connecting with a role
  only sees capabilities matching its allowed prefixes.
  The "operator" role sees everything (no filter).

roles:
  operator:
    description: "Full access — no filtering"
    prefixes: ["*"]

  infra:
    description: "Infrastructure, networking, platform ops"
    prefixes:
      - spine
      - infra
      - network
      - host
      - platform
      - cloudflare
      - secrets
      - session
      - verify
      - orchestration

  mint:
    description: "Mint Prints business operations"
    prefixes:
      - mint
      - communications
      - microsoft
      - secrets.bundle

  media:
    description: "Media stack operations"
    prefixes:
      - media
      - network.nfs

  ha:
    description: "Home Assistant operations"
    prefixes:
      - ha
      - network.lan.device

  finance:
    description: "Finance and budget tracking"
    prefixes:
      - finance
      - secrets.bundle

  researcher:
    description: "Default role — read-only spine + RAG"
    prefixes:
      - spine
      - rag
      - session
      - verify
      - gaps
      - docs
