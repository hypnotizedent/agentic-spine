schema_version: "1.0"
status: authoritative
owner: "@ronny"
updated_at: "2026-03-23T00:00:00Z"
description: >
  Mutation ceremony contract for shared_authority.db.
  All write operations on the gaps and loops SQLite authority must pass through
  governed execution (cap run) or provide an explicit override with reason.
  This governs capability-mediated mutation. Raw file writes to externalized
  shared-authority state remain a separate direct-edit seam handled by
  D75/surface-readonly checks, not by this bridge.

authority_surface: shared_authority.db

bridges:
  gaps:
    binary: ops/plugins/core/lifecycle/bin/gaps-authority-bridge
    library: ops/plugins/core/lifecycle/lib/gaps_sql_authority.py
    tables: [gaps, gap_events, friction, friction_events]
    projection: ops/bindings/operational.gaps.yaml
  loops:
    binary: ops/plugins/core/lifecycle/bin/loops-authority-bridge
    library: ops/plugins/core/lifecycle/lib/loops_sql_authority.py
    tables: [loops, loop_events]
    projection: $SPINE_STATE/loop-scopes/*.scope.md

# Legacy aliases (kept for backward compatibility until all callers migrate)
bridge_binary: ops/plugins/core/lifecycle/bin/gaps-authority-bridge
library: ops/plugins/core/lifecycle/lib/gaps_sql_authority.py

mutation_ceremony:
  env_var: SPINE_CAP_RUN_KEY
  set_by: ops/commands/cap.sh
  description: >
    cap.sh generates a unique run key (CAP-<timestamp>__<cap_name>__R<rand>)
    and exports it as SPINE_CAP_RUN_KEY for the duration of governed execution.
  terminal_role_env:
    precedence:
      - OPS_TERMINAL_ROLE
      - SPINE_TERMINAL_ROLE
    required_for_mutation: true
    allowed_values:
      - SPINE-CONTROL-01
    description: >
      Shared-authority gap mutations are controller-only. The bridge must
      resolve the mutating terminal to SPINE-CONTROL-01 before accepting
      upsert, close, or reparent operations.

  mutating_commands:
    - upsert
    - close
    - reparent

  read_commands:
    - query
    - bootstrap
    - project
    - next-id
    - parity

  enforcement:
    - check: SPINE_CAP_RUN_KEY env var must be non-empty
    - on_missing: exit 1 with MUTATION BLOCKED message to stderr
    - override_flag: --ungoverned-override
    - override_requires: --reason (non-empty string)
    - override_behavior: loud warning to stderr, mutation proceeds

  audit_fields:
    table: gap_events
    columns:
      run_key:
        type: TEXT
        nullable: true
        description: >
          The SPINE_CAP_RUN_KEY value from governed execution.
          NULL for override or legacy (pre-ceremony) mutations.
      mutation_source:
        type: TEXT
        not_null: true
        default: legacy
        allowed_values:
          - governed   # SPINE_CAP_RUN_KEY was present
          - override   # --ungoverned-override with --reason
          - legacy     # pre-ceremony records or bootstrap imports

governed_callers:
  - capability: gaps.file
    script: ops/plugins/core/loops/bin/gaps-file
    bridge: gaps-authority-bridge
  - capability: gaps.close
    script: ops/plugins/core/loops/bin/gaps-close
    bridge: gaps-authority-bridge
  - capability: loops.create
    script: ops/plugins/core/lifecycle/bin/loops-create
    bridge: loops-authority-bridge
  - capability: loop.closeout.finalize
    script: ops/plugins/core/loops/bin/loop-closeout-finalize
    bridge: loops-authority-bridge

override_protocol:
  usage: >
    For emergency or bootstrap use only. The override creates a loud
    warning on stderr and records mutation_source=override in the
    gap_events audit trail.
  example: >
    gaps-authority-bridge upsert --json '...' --ungoverned-override --reason "emergency bootstrap"
  policy: >
    Overrides should be rare. Any override without a substantive reason
    is a governance violation. Automated reconciliation processes that
    need ungoverned access should be migrated to cap-run wrappers.

# ── File Classifications ──────────────────────────────────────────
# Formal authority-state declarations for files governed by this contract.
# Each entry declares whether a file is source-of-truth or a projection,
# and what mutation ceremony applies.
file_classifications:
  - file: ops/bindings/operational.gaps.yaml
    authority_state: projection
    source_authority: shared_authority.db
    source_table: gaps
    mutation_ceremony: controller-only via gaps-authority-bridge
    projection_command: gaps-authority-bridge project
    enforcement_gate: D75
    historical_audit:
      total_commits: 2551
      pre_enforcement_commits: 2550
      post_enforcement_commits: 1
      enforcement_boundary_sha: "1a4b6f313438201ba9ecefd424ca7699c9109519"
      enforcement_boundary_date: "2026-03-23"
      audit_date: "2026-03-23"
      note: >
        2550 commits predate SQLite authority migration. All amnestied via
        enforcement_after_sha in d75-gap-mutation-policy.yaml. Post-enforcement
        commits must carry Gap-Mutation/Gap-Capability/Gap-Run-Key trailers.

  - file: $SPINE_STATE/loop-scopes/*.scope.md
    authority_state: projection
    source_authority: shared_authority.db
    source_table: loops
    mutation_ceremony: controller-only via loops-authority-bridge
    projection_command: loops-authority-bridge project
    note: >
      Loop scope files are projections of the loops table in shared_authority.db.
      Direct file edits are supported during the transition period but should
      converge to bridge-mediated mutations.
