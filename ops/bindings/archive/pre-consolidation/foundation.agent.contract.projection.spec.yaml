# Status: authoritative
# Last verified: 2026-03-19
# Scope: foundation-agent-contract-projection-spec

version: 1
updated_at: "2026-03-19"
owner: "@ronny"
status: authoritative
scope: foundation-agent-contract-projection-spec

authority:
  source_registry: ops/bindings/agents.registry.yaml
  consumer_repo: agentic-foundation
  consumer_root_env: SPINE_FOUNDATION_ROOT
  consumer_root_default: ../agentic-foundation
  projection_root: docs/agents
  contract_path_policy: "agents.registry.yaml agents[].contract remains the canonical inventory for compatibility stub paths."

policy:
  compatibility_paths_are_projections: true
  require_projection_frontmatter: true
  required_frontmatter:
    - key: status
      value: projection
    - key: authority_state
      value: projection
    - key: projection_of
      value: ops/bindings/agents.registry.yaml
  normalized_intro_status: projection compatibility stub
  planned_generator_capability: foundation.agent.contracts.build
  normalization_capability: foundation.agent.contracts.normalize
  manual_body_supplements_allowed_temporarily: true

blockers:
  full_generation_safe_now: false
  reason: "Contract bodies are still multi-authority for some agents, so agents.registry.yaml alone is not yet enough to generate every compatibility stub safely."
  examples:
    - agent: home-assistant-agent
      required_refs:
        - ops/bindings/ha.identity.mutation.contract.yaml
      why: "Home Assistant compatibility status checks still require the mutation contract reference in the foundation stub."
    - agent: mint-agent
      required_refs:
        - ops/bindings/mint.quote.packet.authority.yaml
        - ops/bindings/mint.quote.line_item.normalization.contract.yaml
        - ops/bindings/mint.quote.payment_bridge.authority.yaml
      why: "D395 still enforces quote-to-pay compatibility references in the mint stub body."

next_generator_contract:
  requirements:
    - derive stub inventory from agents.registry.yaml
    - fail on any contract-body dependency not modeled in this spec or in agents.registry.yaml
    - preserve required supplemental authority references for the blocked agents
    - emit deterministic projection markers and a generated-only intro block
    - keep compatibility paths stable under agentic-foundation/docs/agents/
