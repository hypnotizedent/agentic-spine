host:
  vm_id: "200"
  hostname: docker-host
  role: legacy-production
  policy_mode: docs-first
  objective: >
    Keep docker-host as an explicit tombstone with one cold restore capsule,
    keep the live runtime footprint out of hot storage, and prevent production
    identity resurrection.

tombstone_record:
  state: tombstone
  runtime_plane_status: dead_not_authoritative
  live_runtime_footprint:
    proxmox_host: pve
    storage_tier: tank-docker
    artifact: none
    artifact_ref: none
    size_gb: 0
    disposition: removed_from_hot_storage
    removed_artifact: vm-200-disk-0
    removed_artifact_ref: local-lvm:vm-200-disk-0
    removed_size_gb: 300
    removed_at_utc: "2026-03-12T04:30:02Z"
  cold_restore_capsule:
    retained_artifact: vm-200-docker-host-primary
    retained_count: 1
    location: pve:/md1400/backup-cold/vzdump/pve
    artifact_path: /md1400/backup-cold/vzdump/pve/vzdump-qemu-200-2026_03_07-02_00_03.vma.zst
    artifact_size_bytes: 196820427012
    artifact_mtime_utc: "2026-03-07T08:24:01Z"
    artifact_sha256: ee8b3844cb58fc7c7cb72433f95fc12df4957171afdfba6d01427551eb1182d4
    verified_at_utc: "2026-03-12T04:30:02Z"
    qemu_config_path: /etc/pve/qemu-server/200.conf
    qemu_config_sha256_before_delete: 3fcc25b6b697139205de70a4f5d93c613f0d2a6ba2d49912c0d0fa703738f095
    qemu_config_sha256_after_delete: 2329aa1b90c440783bac6484a75ab5f83c73d4d3399c58a27b89c2cf84b007d5
    review_by: "2026-09-06"
    expiry_action: delete_if_unneeded_after_review
  historical_duties:
    - Mint monolith runtime host
    - artwork-module / quote-page / files-api legacy compose host
    - mint-os postgres / redis / minio legacy state host
  replaced_by:
    - mint-apps (VM 213) for Mint application runtime
    - mint-data (VM 212) for Mint state services
    - finance-stack (VM 211) for finance workloads that used to share the host
    - observability (VM 205) for Dashy/observability duties
    - communications-stack (VM 214) for mail-archiver runtime authority
  extract_once_assets:
    - compose files
    - environment templates
    - config directories
    - service inventory notes
  restore_guardrails:
    - restore only into isolated temporary sandbox identity such as vm200-restore-2026-06
    - never restore into production hostname docker-host
    - never republish legacy DNS, Tailscale, or Cloudflare routes on restore
    - use restore for investigation/extraction only, not runtime reinstatement
  restore_commands:
    - qmrestore /md1400/backup-cold/vzdump/pve/vzdump-qemu-200-2026_03_07-02_00_03.vma.zst 9200 --storage local-lvm --unique 1
    - qm set 9200 --name vm200-restore-2026-03-12

authorities:
  vm_lifecycle: ops/bindings/vm.lifecycle.yaml
  stack_targets: ops/bindings/docker.compose.targets.yaml
  service_registry: docs/governance/SERVICE_REGISTRY.yaml
  legacy_policy: docs/governance/LEGACY_DEPRECATION.md
  sequence_contract: ops/bindings/spine.governance.sequence.contract.yaml
  closeout_receipt: docs/reference/audits/VM200_PHYSICAL_CLOSEOUT_20260312.md

action_classes:
  safe_cleanup_now:
    description: "No active runtime dependency expected; remove after standard receipt capture."
    items:
      - id: orphaned-volumes-pihole-secrets
        scope:
          - pihole_pihole_config
          - pihole_pihole_dnsmasq
          - secrets_pg_data
          - secrets_redis_data
      - id: zombie-stack-dirs-migrated
        scope:
          - stacks/finance/
          - stacks/mail-archiver/
          - stacks/pihole/
          - stacks/cloudflared/
          - stacks/secrets/
      - id: stale-cron-entries
        scope:
          - backup-finance.sh
          - backup-infrastructure.sh
          - backup-media-configs.sh
          - check-secret-expiry.sh
      - id: deprecated-script
        scope:
          - ~/simplefin-daily-sync.sh

  verify_first:
    description: "Requires explicit dependency check and verification receipt before cleanup."
    items:
      - id: sync-to-synology-cron
        required_receipt: "dependency_proven_unused"
      - id: mcpjungle-stack-dir
        required_receipt: "runtime_not_authoritative"
        status_note: "Manual delete occurred pre-governance receipt chain; evidence backfilled in LOOP-DOCKER-HOST-SAFE-DEPRECATION-BATCH-20260226-20260226 (2026-02-26) with before/after runtime proofs."
      - id: mint-os-data-stack-dir
        required_receipt: "runtime_not_authoritative"
      - id: infrastructure-stack-dir
        required_receipt: "runtime_not_authoritative"
      - id: github-actions-runner-legacy-repo
        required_receipt: "repo_runtime_retired_or_repointed"

  defer_mint_lane:
    description: "Do not mutate in this contract; owned by Mint loops/agents."
    items:
      - id: mint-os-frontends-and-api
        scope:
          - mint-os-admin
          - mint-os-customer
          - mint-os-production
          - mint-os-kanban
          - mint-os-dashboard-api
          - mint-os-postgres
          - mint-os-redis
      - id: mint-modules-duplicates
        scope:
          - order-intake
          - quote-page
          - files-api
      - id: minio-and-mint-db-backup-jobs
        scope:
          - minio
          - backup-mint-minio.sh
          - backup-mint-postgres.sh
          - supplier-sync
          - mint-os-watchdog

agent_guardrails:
  - "No runtime stop/remove actions under defer_mint_lane in this loop."
  - "Every cleanup action needs before/after status receipt."
  - "Run scoped verify after each cleanup batch."
  - "If authority is ambiguous, classify as verify_first and do not delete."

canonical_commands:
  status_commands:
    - ./bin/ops cap run infra.docker_host.status
    - ./bin/ops cap run services.health.run
    - ./bin/ops cap run communications.alerts.queue.status
  verify_commands:
    - ./bin/ops cap run verify.route.recommend
    - ./bin/ops cap run verify.pack.run infra
  break_glass_commands:
    - echo "yes" | ./bin/ops cap run communications.alerts.flush --limit 10

evidence_requirements:
  must_include:
    - capability_run_key
    - receipt_path
    - before_after_snapshot
    - linked_gap_id
