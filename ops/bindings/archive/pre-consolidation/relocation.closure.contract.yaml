    description: "Media stack split: VM 201 → VM 209 (download) + VM 210 (streaming)"
    type: vm_split
    when: "2026-02-08"
    source_vm: media-stack
    target_vms: [download-stack, streaming-stack]
    status: done
    note: "Source VM 201 destroyed 2026-02-12. All closure steps verified retroactively."

  - id: RELOC-002
    description: "Vaultwarden: home VM 102 → shop infra-core VM 204"
    type: cross_site
    when: "2026-02-16"
    source_vm: vaultwarden
    target_vms: [infra-core]
    status: done
    note: "Source VM 102 decommissioned. Final backup retained."

  - id: RELOC-003
    description: "Mail-archiver: finance-stack VM 211 → communications-stack VM 214"
    type: intra_site
    when: "2026-02-25"
    source_vm: finance-stack
    target_vms: [communications-stack]
    status: done
    note: "Source instance on VM 211 marked migration_source. LOOP-MAIL-ARCHIVER-COMMS-MIGRATION-20260225."

  - id: RELOC-004
    description: "Media writer-plane: shop (download/streaming) → home (media-home VM 106)"
    type: cross_site
    when: "2026-03-17"
    source_vm: download-stack
    target_vms: [media-home]
    status: active
    note: "Writer-plane promoted to media-home. download-stack/streaming-stack remain as transitional_shop_residue."
    open_closure_gaps:
      - "agent endpoint URLs still reference shop Tailscale IPs"
      - "secrets.bundle.contract.yaml verify URLs still point to shop"
      - "domain.routing target_hints contain hardcoded 100.113.72.41"

# ═══════════════════════════════════════════════════════════════
# Closure Compiler Interface
# ═══════════════════════════════════════════════════════════════

closure_compiler:
  capability: closure.compiler.status
  description: |
    Future capability that audits whether all closure steps are satisfied
    for active or recent relocations. Reports:
    - steps_satisfied / steps_total
    - blocking_gaps (steps that are blocking and unsatisfied)
    - advisory_gaps (steps that are advisory and unsatisfied)
  gate: null  # to be assigned when capability is implemented
