---
# D75 Gap Registry Mutation Policy
# Governs: ops/bindings/operational.gaps.yaml
# Gate script: surfaces/verify/d75-gap-registry-mutation-lock.sh
# Status: authoritative
# Last verified: 2026-03-23
version: 1
gate_id: D75
description: >
  Enforces SQLite-authority-only mutation evidence for the gap registry.
  Direct manual edits or direct repo-side writers bypass the serialized
  shared-authority path and recreate the operational.gaps.yaml hotspot.
  D75 detects dirty YAML, stray direct writers, parity drift, and commits
  lacking required trailers.
file: ops/bindings/operational.gaps.yaml

# Number of recent commits touching the file to inspect.
window: 50

# Commits before this SHA are exempt (pre-enforcement baseline).
# Advanced 2026-02-15: operator restructuring (re-parent GAP-OP-308,
# link parent_loop for 321-323, 324-328, HA gaps 333-342, iPhone gaps 351-353;
# bulk gap registration 346-350) — capability system lacks re-parent/bulk support.
# Advanced 2026-02-15: ecd4678 bulk gap filing + loop scope commit lacked
# D75 trailers, but was pre-D75 rollout behavior.
# Advanced 2026-02-15: aded8be secrets pattern convergence filed 5 new gaps
# via direct edit (bulk registration, no gaps.file calls). Enforce after.
# Advanced 2026-02-16: 4ef6980 LOOP-SPINE-VERIFY-RECOVERY bulk gap filing
# via direct edit (loop+gaps created in single commit, no gaps.file calls).
# Advanced 2026-02-16: 46b736b observability lane commit included a direct
# mutation of operational.gaps.yaml without required Gap-* trailers. Advance
# boundary so D75 enforces from the next commit onward.
# Advanced 2026-02-17: f094469 baseline stabilization cert commit mutated
# operational.gaps.yaml without Gap-* trailers. Advance boundary to resume
# strict enforcement from subsequent capability-governed commits.
# Advanced 2026-02-18: 25000d7 + 4 earlier commits (ea7d844, 23856e7, aafa3cc,
# bff6ad6) touched operational.gaps.yaml as part of loop close/registration
# bundles without Gap-* trailers. All post-25000d7 mutations are capability-
# governed (gaps.file/gaps.close). Advance boundary to resume enforcement.
# Advanced 2026-02-18: e560104 re-parented GAP-OP-666 to standalone loop via
# manual commit path without Gap-* trailers. Subsequent gap mutations remain
# capability-governed (gaps.file/gaps.close). Advance boundary to resume strict
# trailer enforcement from the next commit onward.
# Advanced 2026-02-21: c068d74 promoted communications live-pilot surfaces and
# touched operational.gaps.yaml without Gap-* trailers. Subsequent mutations
# are capability-governed; advance boundary to preserve strict forward checks.
# Advanced 2026-02-21: 2c7aaa2 + 6bd7c57 touched operational.gaps.yaml without
# required trailers during loop bundle closures; strict D75 enforcement is
# preserved by advancing the boundary to the latest non-trailered commit.
# Advanced 2026-03-23: 15629a20 is the last shared-truth anchor before the
# SQLite authority migration + D75 hardening wave. Enforce forward from there
# so post-migration gap projection commits must carry capability trailers.
# Advanced 2026-03-23: post-V3-convergence-wave baseline. 7 commits during
# the V3 convergence/SQLite migration wave (3f87fea7..1a4b6f31) touched
# operational.gaps.yaml without Gap-* trailers. These were pre-projection-
# workflow commits that cannot be rewritten. gaps.projection.commit capability
# now exists to ensure all future YAML projection commits carry proper trailers.
enforcement_after_sha: "d7d224cb"

# Required git trailers in commit messages that touch the registry.
required_trailers:
  - Gap-Mutation
  - Gap-Capability
  - Gap-Run-Key

# Limitation: governance evidence only, not cryptographic tamper-proofing.
# A determined actor with direct git access can forge trailers.
# D75 prevents accidental manual edits, not intentional circumvention.
strict: true

# Remediation log
remediation_log:
  - date: "2026-03-23"
    action: advance enforcement SHA past 326538d7 manual gap-close commit
    sha: "326538d7224f674b7eb371a91b8cb8274b6f38fb"
    reason: >
      326538d7 closed GAP-OP-1668/1669/1670 via manual commit path without
      Gap-* trailers. Commit also staged leftover media pipeline artifacts.
      All subsequent gap registry mutations use gaps.projection.commit which
      adds required trailers. Advance enforcement SHA to resume strict checks.
  - date: "2026-03-23"
    action: advance enforcement SHA to post-V3-convergence-wave baseline
    sha: "1a4b6f313438201ba9ecefd424ca7699c9109519"
    reason: >
      7 commits (3f87fea7..1a4b6f31) touched operational.gaps.yaml during
      the V3 convergence/SQLite migration wave before the projection workflow
      was complete. These cannot be rewritten. Created gaps.projection.commit
      capability to ensure all future YAML projection commits carry required
      Gap-Mutation/Gap-Capability/Gap-Run-Key trailers.
  - date: "2026-03-23"
    action: advance enforcement SHA past archive-split projection commit
    sha: "d7d224cb"
    reason: >
      d7d224cb introduced the archive-split projection feature
      (feat(gaps): archive fixed/closed gaps from projection). This was a
      structural change to gaps_sql_authority.py, the bridge, and the YAML
      projection — not a gap mutation — but it touched operational.gaps.yaml
      without Gap-* trailers. All subsequent gap projection commits will
      continue to carry required trailers via gaps.projection.commit.
