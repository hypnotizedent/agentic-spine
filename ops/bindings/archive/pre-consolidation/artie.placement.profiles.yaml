---
# Artie Placement Profile Registry
# Canonical authority for style/view-specific placement geometry
# Authority: agentic-spine
# Owner: @ronny
# Last verified: 2026-03-10

version: 1
description: |
  Registry of placement profiles for Artie proof generation.
  Each profile defines exact bounding box geometry for placements on a specific style/view.

  Coordinates are in percentage of mockup dimensions (0.0 to 1.0).
  Origin (0,0) is top-left corner.

schema:
  required_fields:
    - placement_profile_id
    - supplier
    - style_code
    - product_family
    - view
    - placements

  placement_fields:
    - name             # Placement name (left_chest, center_chest, full_front, full_back)
    - x                # X coordinate as percentage (0.0 to 1.0)
    - y                # Y coordinate as percentage (0.0 to 1.0)
    - width            # Width as percentage (0.0 to 1.0)
    - height           # Height as percentage (0.0 to 1.0)

profiles:
  # CC1717 - Comfort Colors Sweatshirt Front
  - placement_profile_id: cc1717.front.v1
    supplier: sanmar
    style_code: CC1717
    product_family: sweatshirt
    view: front
    approved_at: "2026-03-10"
    placements:
      - name: left_chest
        x: 0.18
        y: 0.22
