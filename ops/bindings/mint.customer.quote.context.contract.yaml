status: authoritative
owner: "@ronny"
last_verified: 2026-03-12
scope: mint-customer-quote-context

version: "1.0"
updated_at: "2026-03-12"
capability: mint.customer.quote.context.set

storage:
  records_root: "$SPINE_STATE/mint/customer-quote-context/records"
  index_file: "$SPINE_STATE/mint/customer-quote-context/index.ndjson"
  lock_file: "$SPINE_STATE/mint/customer-quote-context/.index.lock"
  matching_priority:
    - email_exact
    - name_company_exact
    - name_exact
    - company_exact

selector_fields:
  - email
  - customer_name
  - company

quote_context_fields:
  segments:
    type: list
    description: Operator-confirmed customer segment/type labels.
  relationship:
    fields:
      - volume_expectation
      - operator_note
  exception_rule:
    optional: true
    fields:
      - job_type
      - default_posture
      - goodwill_exception_allowed
      - pricing_override
      - operator_note
  provenance:
    required: true
    fields:
      - source
      - set_by
      - confidence
      - updated_at_utc

editing_rule:
  latest_matching_record_wins: true
  superseded_records_retained: true
