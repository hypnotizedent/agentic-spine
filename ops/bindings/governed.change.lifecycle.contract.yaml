---
status: authoritative
owner: "@ronny"
last_verified: 2026-04-04
scope: governed-change-lifecycle
version: 3
updated_at: 2026-04-04

contract: GOVERNED_CHANGE_LIFECYCLE_CONTRACT_V1

authority_chain:
  root_authority: ops/bindings/root.authority.contract.yaml
  loop_scopes: /Users/ronnyworks/code/.runtime/spine/state/loop-scopes/
  parent_packets: /Users/ronnyworks/code/.runtime/spine/state/domain-state/spine/execution-packets-20260326/
  route_selector:
    contract: ops/bindings/governed.change.lifecycle.contract.yaml
    field: change_class

problem_statement: |
  Spine change-process governance is already real in campaign practice, but it
  was not yet codified as a separate L1 authority. This contract governs how
  meaning-bearing and implementation changes move from concern identification
  through closure without depending on a separate self-governance companion
  surface.

state_boundary:
  change_process_state: >
    Governs the lifecycle of a change: concern framing, discovery, decision,
    election, implementation, verification, and closure.
  surface_maturity_state: >
    Surface maturity remains an operator judgment captured in the affected
    authority surface when needed. This contract does not require a separate
    companion maturity registry.
  route_selector: >
    change_class is declared here and selects which change-process route applies.

change_classification:
  field: change_class
  allowed_values:
    new_truth:
      description: Creates, modifies, or retires governed meaning.
    ordinary_fix:
      description: Repairs implementation truth without changing governed meaning.
    emergency_repair:
      description: Restores broken runtime behavior under time pressure.

stage_model:
  stage_order:
    - gap_identified
    - discovery
    - decision
    - election
    - implementation_authorized
    - implementation_active
    - implementation_landed
    - verification
    - closed
  stages:
    gap_identified:
      description: A governed concern or defect is explicitly named and loop-anchored.
      entry_evidence:
        - Parent loop or equivalent governed concern anchor exists.
        - The target surface or concern family is explicitly identified.
      exit_evidence:
        - The selected route is explicit or derivable from change_class.
        - Scope and non-goals are bounded enough to begin discovery or implementation.
    discovery:
      description: Evidence is collected to determine the truthful problem shape and scope.
      entry_evidence:
        - gap_identified receipts are present.
        - Evidence collection boundary and authority surfaces are named.
      exit_evidence:
        - Discovery artifact or equivalent evidence summary exists at a durable, version-controlled path.
        - The truthful seam, out-of-scope boundary, and open questions are explicit.
    decision:
      description: The intended model, seam, or contract boundary is synthesized.
      entry_evidence:
        - Discovery evidence exists or the route provides an authorized fast-path skip.
      exit_evidence:
        - Decision packet or equivalent synthesis exists at a durable, version-controlled path.
        - Proposed model, authority boundaries, and next action are explicit.
    election:
      description: Operator ratifies the meaning, scope, and next action.
      entry_evidence:
        - Decision content is explicit.
        - Election question and proposed next action are explicit.
      exit_evidence:
        - Election packet/status records one exact result at a durable, version-controlled path.
        - Implementation is either authorized, deferred, or rejected with explicit next action.
    implementation_authorized:
      description: Implementation is allowed by election result but is not yet active.
      entry_evidence:
        - Election result authorizes implementation.
        - Repo-owned mutation has not yet started for this concern.
      exit_evidence:
        - An implementation pass is registered or activation is explicitly deferred.
    implementation_active:
      description: Repo or governed-state mutation work is actively in progress.
      entry_evidence:
        - Implementation is authorized, or the emergency route permits immediate action.
        - The bounded mutation surface is explicit.
      exit_evidence:
        - Mutated surfaces and receipts are captured.
        - The pass is ready to land or explicitly blocked with truthful residue.
    implementation_landed:
      description: The bounded implementation has landed and its receipts are recorded.
      entry_evidence:
        - Implementation-active receipts exist.
        - Changed surfaces are finalized in repo or governed runtime state.
      exit_evidence:
        - Commit SHA exists for repo-owned mutation when applicable.
        - Landed files and scope guards are recorded in a status artifact.
    verification:
      description: Targeted proof confirms the landed result and its boundaries.
      entry_evidence:
        - Implementation_landed receipts exist, or the route is read-only and produces direct proof.
      exit_evidence:
        - Targeted verification proves the elected boundary.
        - Unchanged unrelated residue, if any, is explicitly classified.
    closed:
      description: Parent artifacts agree on the landed truth and next action or terminal disposition.
      entry_evidence:
        - Verification results are recorded.
        - Parent roadmap/index/loop artifacts are ready for synchronized update.
      exit_evidence:
        - Parent roadmap, campaign index, and loop scope agree on the same next action or terminal disposition.
        - No contradictory active child pass remains for the same concern.
  stage_evidence_durability:
    description: >-
      Stage evidence for pre-implementation stages must be durably persisted.
      Durable means version-controlled and SHA-addressable.
    durable_locations:
      - committed file in the git working tree
      - repo-backed pointer to governed content
    non_durable_locations:
      - chat transcript (ephemeral, compacts, session-bound)
      - terminal scrollback (ephemeral)
      - untracked local file (lost on cleanup)
      - .runtime-only state (not version-controlled, local-only)
    runtime_note: >-
      .runtime status artifacts remain valid for operational tracking but do
      not alone satisfy stage evidence durability for new_truth concerns.

route_rules:
  route_selector:
    contract: ops/bindings/governed.change.lifecycle.contract.yaml
    field: change_class
  classes:
    new_truth:
      description: Creates, modifies, or retires governed meaning.
      default_path:
        - gap_identified
        - discovery
        - decision
        - election
        - implementation_authorized
        - implementation_active
        - implementation_landed
        - verification
        - closed
      required_pre_implementation_stages:
        - discovery
        - decision
        - election
        - implementation_authorized
      requirements:
        - No repo-owned mutation before implementation_authorized.
        - Decision and election must explicitly ratify the meaning change.
      stage_evidence_note: >-
        Stage evidence artifacts (discovery, decision, election documents) are not
        implementation mutations. Implementation mutations are the changes the
        concern proposes to governed surfaces. Creating stage evidence in the repo
        tree is required by durability rules and does not violate the
        no-mutation-before-authorization constraint.
    ordinary_fix:
      description: Repairs implementation truth without changing governed meaning.
      collapsed_path:
        - gap_identified
        - implementation_active
        - implementation_landed
        - verification
        - closed
      may_skip_stages:
        - discovery
        - decision
        - election
        - implementation_authorized
      requirements:
        - Existing governed meaning must already be settled.
        - Loop anchorage, receipts, targeted verification, and parent continuity updates remain required.
      mechanical_change_exemption: >-
        Already-elected mechanical changes follow this collapsed path and do not
        require discovery, decision, election, or implementation_authorized
        artifacts when all are true: no new live surface is introduced; no
        authority, routing, or policy meaning changes; the work is limited to
        archive under an already-elected archive boundary, reference rewire to
        an already-elected surviving authority, projection normalization, or
        residue prune of already-terminal artifacts; and the target boundary or
        surviving authority is already elected. The standard exec receipt plus
        targeted verification is sufficient durable evidence for that path.
    emergency_repair:
      description: Restores broken runtime behavior under time pressure.
      emergency_path:
        - gap_identified
        - implementation_active
        - implementation_landed
        - verification
        - closed
      allowed_early_entry: implementation_active
      requirements:
        - Emergency rationale must be recorded when pre-implementation stages are bypassed.
        - Mandatory post-hoc reconciliation must complete before closed.
      post_hoc_reconciliation:
        required_checks:
          - Confirm whether the repair stayed within existing governed meaning.
          - Confirm whether a follow-on new_truth cycle is required.
          - Record any deferred cleanup as a separate concern rather than hiding it.

compatibility_rules:
  legacy_gap_loop_landing_closeout:
    status: allowed_operational_substrate
    rules:
      - Legacy gap/loop/landing/closeout practice remains valid when it preserves governed meaning.
      - Historical passes do not become invalid retroactively if they fit the truthful route after classification.
      - Child status and parent roadmap/index/loop artifacts must agree on the same next action before closure is truthful.
  implementation_state_boundary:
    rules:
      - implementation_authorized and implementation_active remain distinct states.
      - Implementation landing does not automatically change a surface's maturity state.

allowed_execution_forms:
  discovery:
    controller_terminal_only: allowed
    controller_owned_parallel_scouting: allowed
    wave_backed_parallel_scouting: allowed
  decision:
    controller_terminal_only: allowed
    controller_owned_parallel_synthesis: allowed
    wave_backed_parallel_synthesis: allowed
  constraints:
    - Wave-backed execution is an allowed execution form, not a lifecycle stage.
    - Controller-owned synthesis, bounded scope, and governed receipts remain required.

metabolism_route_semantics:
  purpose: >
    Governs the change-process requirements for retirement-oriented maturity
    transitions without redefining the maturity states themselves.
  retirement_oriented_maturity_transitions:
    - active_to_transitional
    - transitional_to_superseded
    - superseded_to_tombstoned
    - tombstoned_to_purge_eligible
  required_change_process_evidence:
    - Discovery must inventory current consumers, successor intent, compatibility window, and rollback value.
    - Decision must name the intended retirement-oriented maturity transition and rationale.
    - Election must ratify the retirement/deprecation route before implementation_authorized.
    - Implementation may update maturity metadata, routing, and residue classification only after authorization.
    - Verification must confirm successor readiness, consumer migration status or intentional exceptions, and parent continuity updates.
  explicit_non_goal:
    - This contract does not execute the metabolism audit itself.
    - This contract does not redefine or duplicate surface maturity states.

out_of_scope:
  - Surface maturity state definitions themselves
  - The first actual surface metabolism audit
  - Capability reconciliation
  - Scheduler cleanup
  - Domain extraction
