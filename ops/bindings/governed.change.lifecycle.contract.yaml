# Status: authoritative
# Scope: governed-change-lifecycle-stage-evidence
# Gate: D425

version: 1
updated_at: "2026-04-21"
owner: "@ronny"
status: authoritative
scope: governed-change-lifecycle-stage-evidence

stage_model:
  stage_evidence_durability:
    durable_locations:
      - ops/bindings/
      - docs/governance/
      - evidence/sessions/
    non_durable_locations:
      - .runtime/spine/state/
      - .runtime/spine/waves/

  stages:
    discovery:
      description: Initial research and gap identification
      exit_evidence:
        - durable receipt or artifact reference in evidence/sessions/
    decision:
      description: Operator decision on disposition
      exit_evidence:
        - durable decision record in ops/bindings/ or docs/governance/
    election:
      description: Commitment to specific implementation path
      exit_evidence:
        - durable packet or contract artifact in ops/bindings/

route_rules:
  classes:
    new_truth:
      description: New authority surface or governance artifact
      stage_evidence_note: >-
        Stage evidence captures discovery and decision artifacts,
        not implementation mutations. Implementation is a separate
        post-election phase.
    correction:
      description: Fix to existing authority surface
      stage_evidence_note: >-
        Corrections follow the same stage evidence requirements
        but may compress discovery and decision into a single step
        when the defect is unambiguous.
