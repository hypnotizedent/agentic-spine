    trigger:
      gate_ids: [D23]
      failure_class: deterministic
    recovery:
      type: docker_compose_restart
      target: finance-stack
      stack: finance
      services: []
    safety:
      max_attempts: 2
      cooldown_seconds: 1800
      escalate_after_failures: 2

