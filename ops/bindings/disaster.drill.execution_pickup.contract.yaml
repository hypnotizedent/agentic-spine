---
status: authoritative
owner: "@human-steward"
scope: execution-pickup-recovery-drill
version: 1
updated_at: "2026-05-02"

capability: disaster.drill.execution_pickup
public_readback: ops status
receipt_class: recovery_drill
receipt_root: "$SPINE_STATE/domain-state/recovery-drills/execution-pickup"
freshness_window_hours: 168

authority_boundary:
  owns:
    - execution_pickup_worker_restart_proof
    - queued_task_survives_worker_restart_proof
    - bounded_agent_failure_receipt_proof
    - bounded_agent_timeout_receipt_proof
    - stale_heartbeat_readback_proof
    - v2_1_readonly_repo_denied_path_proof
    - v2_2_readonly_capability_denied_unallowlisted_proof
    - v2_3_fenced_artifact_denied_outside_fence_proof
    - v2_4_patch_artifact_no_worktree_mutation_proof
  does_not_decide:
    - node_admission
    - runtime_placement
    - backup_authority
    - watcher_authority
    - domain_truth
    - tool_using_agent_bridge_delivery

target:
  host_ref: ai-consolidation
  service_unit: spine-mailroom-task-worker.service
  worker_contract: ops/bindings/mailroom.task.worker.contract.yaml
  status_surface: execution.pickup.status

fixtures:
  - id: idle_restart
    proof: stop and start the standing worker while the queue is idle; worker status returns fresh.
  - id: queued_restart
    proof: queue a no-op capability task while the worker is stopped; start service; task reaches terminal state with receipt.
  - id: provider_failure
    proof: enqueue a bounded agent_tool task with an impossible provider; task fails with bridge_proof receipt.
  - id: timeout
    proof: enqueue a bounded agent_tool task with timeout_seconds=1; task fails through timeout or provider failure receipt.
  - id: stale_heartbeat
    proof: create claimed running custody with an old heartbeat; execution.pickup.status exposes stale, then cleanup fails the fixture task.
  - id: v2_1_readonly_repo_denied_path
    proof: enqueue a V2.1 read_only_repo task for an excluded .git path; task fails with V2.1 bridge_proof and no mutation access before provider execution.
  - id: v2_2_readonly_capability_denied_unallowlisted
    proof: enqueue a V2.2 read_only_capability_calls task that requests an unallowlisted capability; task fails with V2.2 bridge_proof, denied capability evidence, and mutation_access none before provider execution.
  - id: v2_3_fenced_artifact_denied_outside_fence
    proof: enqueue a V2.3 fenced_artifact_write task that requests an outside-fence artifact path; worker writes only under the governed artifact fence and terminal proof shows the sanitized fenced path.
  - id: v2_4_patch_artifact_no_worktree_mutation
    proof: enqueue a V2.4 patch_artifact task; worker writes a patch artifact under the governed patch artifact fence and proves worktree_mutation false.

closure_rule:
  - "The receipt must contain all nine fixture ids."
  - "The service must be active at the end of the drill."
  - "execution.pickup.status must be readable at the end of the drill."
  - "A failed fixture means the drill failed; it does not silently degrade to status-only."
