  discovered_at: '2026-03-23'
  type: agent-behavior
  classification: agent-behavior
  doc: docs/governance/SPINE.md
  description: 'System lacks mechanical coordination layer for shared authority surfaces.


    Current state (2026-04-03):

    - 4 active loops (down from 13 on 2026-03-23)

    - 12 open gaps (down from 70)

    - 0 friction queue entries (friction.reconcile operational, queue drained)

    - 1 blocked worktree (down from 25+ dirty files)

    - 7 active waves


    Core architectural concern remains:

    Operator still acts as implicit join table between runtime state, control plane
    coordination, loop lifecycle, gap registry, worktree management, and closeout
    finalization. While V3 finalization reduced volume dramatically, mechanical reconciliation
    primitives for coordinating these surfaces without operator memory are still missing.


    Examples of manual coordination still required:

    - Wave-to-loop ownership mapping

    - Worktree lease coordination with active loop state

    - Gap-to-loop reparenting when loops close

    - Handoff expiration reconciliation with loop/wave state

    '
  severity: high
  status: open
  notes: 'NARROWED 2026-04-03: Updated numbers to reflect post-V3 reality. Volume
    reduced dramatically (4 loops, 12 gaps, 0 friction queue) but architectural concern
    about mechanical coordination layer remains valid.'
