    discovered_at: '2026-03-23'
    type: missing-entry
    classification: missing-entry
    doc: ops/capabilities.yaml
    description: 'Forge lifecycle is not canonical in Spine V3.


      Shared truth exposes repo and broker state, but there is still no governed forge lifecycle surface for pull request visibility and disposition. Agents can query git remotes and local branches, yet cannot ask the system for the live PR list, PR status, or close/supersede a Gitea PR through a broker-visible capability path.


