- id: GAP-OP-1586
  title: Forge lifecycle is not canonical in Spine V3.
  discovered_by: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  discovered_at: '2026-03-23'
  type: missing-entry
  classification: missing-entry
  doc: ops/capabilities.yaml
  description: 'Forge lifecycle is not canonical in Spine V3.


    Shared truth exposes repo and broker state, but there is still no governed forge lifecycle surface for pull request visibility
    and disposition. Agents can query git remotes and local branches, yet cannot ask the system for the live PR list, PR status,
    or close/supersede a Gitea PR through a broker-visible capability path.


    This leaves PR objects outside the V3 control plane and forces terminals back to manual forge/UI/API handling. The missing
    canonical surfaces are the Gitea broker/read and lifecycle capabilities needed to query and disposition PR state as system
    truth.

    '
  severity: high
  status: open
  notes: Filed via gaps.file at 2026-03-23T03:18:19Z
  parent_loop: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
- id: GAP-OP-1590
  title: Thin-client parity is incomplete across remote chat surfaces.
  discovered_by: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  discovered_at: '2026-03-23'
  type: missing-entry
  classification: missing-entry
  doc: ops/plugins/infra/mcp-gateway/bin/spine-mcp-serve
  description: 'Thin-client parity is incomplete across remote chat surfaces.


    Broker read endpoints and attestation now exist, but not every remote surface consumes them through one canonical thin-client
    bridge. Some sessions still depend on remembered context, old launcher state, or repointing/restart steps rather than
    a single boring broker-backed truth path.


    The MCP or bridge runtime needs to be fully aligned so new remote chats resolve loop state, progress, and attestation
    from the same broker truth as desktop.

    '
  severity: medium
  status: open
  notes: Filed via gaps.file at 2026-03-23T03:18:19Z
  parent_loop: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
- id: GAP-OP-1591
  title: Translator authority is documented but not enforced as a governed control-plane contract.
  discovered_by: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
  discovered_at: '2026-03-23'
  type: missing-entry
  classification: missing-entry
  doc: docs/governance/SPINE_V3_BOOTSTRAP.md
  description: 'Translator authority is documented but not enforced as a governed control-plane contract.


    The bootstrap now says the translator should own interpretation but never final truth, execution, verification, or git
    authority. That role boundary is conceptually clear, yet there is not a first-class contract or gate that enforces translator
    isolation the way closeout and wave paths now enforce their rules.


    V3 still needs a concrete translator authority contract and runtime enforcement point so membrane behavior cannot silently
    reacquire downstream powers.

    '
  severity: medium
  status: open
  notes: Filed via gaps.file at 2026-03-23T03:18:19Z
  parent_loop: LOOP-SPINE-V3-SUBSTRATE-CONTROL-PLANE-CANONICALIZATION-20260323
