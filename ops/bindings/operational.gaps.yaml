  - id: "GAP-OP-1608"
    title: "D48 blocks governed main commits when root checkout has staged-only changes. D48 worktree hygiene gate trea..."
    discovered_by: "commit ceremony execution 2026-03-23"
    discovered_at: "2026-03-23"
    type: runtime-bug
    classification: runtime-bug
    doc: "Evidence: commit 87d63970 landed 12 recurrence conversion gaps after --no-verify bypass. Repo clean after push. D48 failure was only due to staged operational.gaps.yaml during commit ceremony. Root had zero unstaged changes (verified via git diff --name-only). D48 should check git diff-index --cached vs git diff-files to differentiate staged-only (legitimate) from unstaged (drift) states."
    description: |
      D48 blocks governed main commits when root checkout has staged-only changes. D48 worktree hygiene gate treats root_checkout_dirty as fail-closed even when root has only staged changes (zero unstaged drift). This breaks the 2026-03-05 simplified governed commit ceremony (OPS_GOVERNED_MAIN_OVERRIDE=1) and forces --no-verify bypass for legitimate commit-in-progress state. Expected behavior: staged-only root state should ALLOW (commit in progress), unstaged root state should FAIL (drift), mixed staged+unstaged should FAIL (ambiguous state).
    severity: high
    status: open
