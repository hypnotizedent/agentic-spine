contract: MEDIA_AVAILABILITY_PROGRESSION_CONTRACT_V2
version: "2.0"
status: active
created: "2026-03-03"
updated_at: "2026-03-17"
owner: "@ronny"
authority_loop: LOOP-MEDIA-STACK-DISCONNECT-CANONICAL-TRACE-20260303

description: |
  Canonical availability progression model for the unified home media runtime.
  Home is the live request/download/import/playback truth. Shop is cold
  retention and rollback, not a competing runtime authority.

runtime_validation:
  date: "2026-03-17"
  method: "SSH/on-VM execution on media-home (VM 106)"
  runtime:
    vm: media-home
    lan_ip: "10.0.0.106"
    tailscale_ip: "100.113.72.41"
    playback_mount: "/srv/media"
    state_root: "/srv/appdata/opt-appdata"
  observed_facts:
    - "Radarr rootfolder is /movies and remote path mappings are empty."
    - "Sonarr rootfolder is /tv and remote path mappings are empty."
    - "Jellyfin live libraries are /media/movies and /media/tv; /media/movies-archive is excluded."
    - "media.e2e.verify now executes through SSH/on-VM instead of depending on direct macOS transport."

progression_stages:
  - stage: requested
    order: 1
    authority: jellyseerr
    description: "A user request exists in Jellyseerr."

  - stage: searching
    order: 2
    authority: radarr_or_sonarr
    description: "ARR has accepted the item and is searching."

  - stage: downloading
    order: 3
    authority: sabnzbd_or_qbittorrent
    description: "A download client is actively transferring the payload."

  - stage: import_complete
    order: 4
    authority: radarr_or_sonarr
    description: "The item has been imported into the canonical home library path."

  - stage: library_visible
    order: 5
    authority: jellyfin
    description: "The imported item is searchable and playable from Jellyfin."

  - stage: request_fulfilled
    order: 6
    authority: jellyseerr
    description: "Jellyseerr reflects downstream availability for the request."

sync_handshakes:
  arr_to_jellyfin:
    trigger: "ARR import completes on media-home"
    mechanism: "Jellyfin scan on media-home against /srv/media"
    expected_action: "Jellyfin indexes the imported payload from the canonical home path"
    max_expected_delay_minutes: 15
    max_acceptable_delay_minutes: 30
    failure_mode: "File exists on disk but is missing from Jellyfin"

  arr_to_jellyseerr:
    trigger: "ARR import completes on media-home"
    mechanism: "Jellyseerr sync against the home ARR/Jellyfin surfaces"
    expected_action: "Jellyseerr request status advances to available"
    max_expected_delay_minutes: 10
    max_acceptable_delay_minutes: 60
    failure_mode: "Request remains processing after import is visible in Jellyfin"

verification:
  e2e_check_chain:
    description: |
      End-to-end availability must verify the full chain for a sampled or
      targeted title from ARR through Jellyfin and Jellyseerr.
    legs:
      - leg: 1
        check: "ARR hasFile=true"
        authority: radarr
      - leg: 2
        check: "Filesystem path exists on media-home and size > 0"
        authority: media-home filesystem
      - leg: 3
        check: "Jellyfin library contains the item"
        authority: jellyfin
      - leg: 4
        check: "Jellyseerr request is fulfilled or explicitly absent"
        authority: jellyseerr
    verdict: "PASS only when all applicable legs pass; explicit no-request cases are SKIP, not FAIL."
    spec_ref: "ops/bindings/media.e2e.verification.spec.yaml"

  drift_gate: media.e2e.verify
  verification_command: "media.e2e.verify"
  verification_command_status: "Active on 2026-03-17 via SSH/on-VM execution against media-home."

failure_taxonomy:
  - id: AVAIL-HOME-F1
    symptom: "ARR hasFile=true but filesystem path is missing"
    root_cause_class: storage_drift
    operator_action: "Verify /srv/media mount and import destination on media-home."
  - id: AVAIL-HOME-F2
    symptom: "Filesystem path exists but Jellyfin has no entry"
    root_cause_class: scan_propagation
    operator_action: "Trigger Jellyfin scan and verify live library roots."
  - id: AVAIL-HOME-F3
    symptom: "Jellyfin has entry but Jellyseerr request is still stale"
    root_cause_class: status_propagation
    operator_action: "Trigger Jellyseerr sync and verify tmdb parity."

promotion_lifecycle:
  current: active
  promotion_path:
    - from: active
      to: enforced
      requires: "7-day sampled soak on media-home with no canonical E2E regressions"
  blocked_by:
    - "Retained helper services are not all active or explicitly parked on media-home."

cross_references:
  path_authority: "ops/bindings/media.path.authority.contract.yaml"
  home_target_contract: "ops/bindings/home.media.target.contract.yaml"
  lifecycle_contract: "ops/bindings/media.lifecycle.contract.yaml"
