# Operator Hardware Bootstrap USB / SSD Medium Contract
#
# This contract defines the reusable first-touch delivery medium for Stage 0
# bootstrap on old MacBooks and salvage laptops.
#
# Scope:
# - reusable installer medium plan
# - local medium write path
# - handoff from Stage 0 bootstrap artifacts to bootable delivery media
#
# This surface does NOT:
# - imply remote boot control
# - imply PXE/OOB availability
# - assign host or node roles
# - claim fully unattended boot on old MacBooks

subordinate_to: ops/bindings/root.authority.contract.yaml

related_contracts:
  - contract: ops/bindings/operator.hardware.readiness.profiles.yaml
    relationship: "Stage 0 readiness gate model that must be satisfied before the medium becomes the first-touch rail."
  - contract: ops/bindings/operator.hardware.bootstrap.handoff.contract.yaml
    relationship: "Stage 0 first-touch handoff object emitted after the local manual boot sequence yields a claimable Linux host."
  - contract: ops/bindings/operator.hardware.bootstrap.artifact.shelf.yaml
    relationship: "Canonical artifact custody for ISO/library and generated assets."

medium_contract:
  reusable_medium_types:
    - usb
    - external_ssd

  supported_write_strategies:
    - stock_iso_raw_write
    - iso_plus_cidata_partition

  write_strategy_details:
    stock_iso_raw_write:
      description: "Raw dd of installer ISO to medium. No payload embedding."
      mechanism: "dd if=<iso> of=<raw_disk>"
      payload_embedded: false
    iso_plus_cidata_partition:
      description: >
        Three-step write to produce a turn-key autoinstall USB on Ubuntu
        Server 22.04+: (1) raw dd of installer ISO to medium (creates ISO9660 +
        ESP partitions on a hybrid ISO), (2) format the third partition slot
        the hybrid ISO leaves at the end of the disk as vfat labeled CIDATA
        and populate it with rendered autoinstall user-data and meta-data,
        (3) modify /boot/grub/grub.cfg inside the ISO9660 partition in place
        to add the kernel command line `autoinstall ds=nocloud\;s=/cidata/`
        to every linux entry. All three are load-bearing: subiquity treats
        CIDATA as defaults-to-confirm (interactive installer with values
        pre-filled) unless the kernel command line carries the autoinstall
        flag. The in-place GRUB modification is what makes the USB unattended.
      mechanism: |
        Linux (canonical execution surface, e.g. on pve):
          1. `wipefs -a /dev/<usb>` (clears any prior partition signatures)
          2. `dd if=<iso> of=/dev/<usb> bs=4M conv=fsync` then `sync`
          3. `blockdev --rereadpt /dev/<usb>` (no `partprobe` needed)
          4. `mkfs.vfat -n CIDATA /dev/<usb>3` (the 300K hybrid-ISO slot)
          5. mount `/dev/<usb>3`, copy rendered `user-data` and `meta-data`
             from the autoinstall payload directory, sync, unmount.
          6. Find iso9660 LBA of `/boot/grub/grub.cfg` via
             `xorriso -indev "stdio:/dev/<usb>1" -find /boot/grub/grub.cfg
             -exec report_lba` (returns startlba and filesize).
          7. Author a replacement grub.cfg that adds
             `autoinstall ds=nocloud\;s=/cidata/` between each
             `/casper/vmlinuz` (and `/casper/hwe-vmlinuz`) and the trailing
             `---`. Drop cosmetic lines (loadfont, menu_color_*) to keep the
             replacement byte length <= original. Pad with trailing whitespace
             to exactly the original byte length.
          8. `dd if=<replacement> of=/dev/<usb>1 bs=1 seek=<lba*2048>
             count=<original-length> conv=notrunc` then `sync`.
        macOS write path: same conceptual sequence using `diskutil` and `dd`.
      payload_embedded: true
      embedding_standard: "cloud-init NoCloud datasource (labeled CIDATA volume) plus kernel-command-line autoinstall trigger"
      autoinstall_trigger_required: true
      kernel_cmdline_addition: "autoinstall ds=nocloud\\;s=/cidata/"
      verification:
        - "lsblk <usb-device> shows exactly 3 partitions: ISO9660, ESP (5M vfat), CIDATA (300K vfat). Any 4th `writable`/ext4 persistence partition is non-canonical tooling residue (Startup Disk Creator, mkusb) and must be subtracted before use."
        - "mount /dev/<usb>1 RO; grep `autoinstall ds=nocloud` in /boot/grub/grub.cfg; must match on both `/casper/vmlinuz` and `/casper/hwe-vmlinuz` linux lines."
        - "mount /dev/<usb>3 RO; confirm `user-data` username and hostname match the rendered autoinstall payload; confirm `meta-data` instance-id present."

  preferred_strategy_by_class:
    old_macbook: usb
    salvage_laptop: usb

  required_plan_fields:
    - device_id
    - medium_type
    - write_strategy
    - iso_source
    - kit_manifest_path
    - autoinstall_payload_path
    - local_operator_steps
    - claim_handoff_ref

  truth_boundary:
    medium_owns:
      - carry a repeatable installer image
      - carry or reference the rendered Stage 0 payload set
      - make the local operator ritual boring and repeatable
      - represent the local write-and-carry position inside the Stage 0 chain
    medium_does_not_own:
      - satisfy readiness gates by itself
      - select the firmware boot path
      - perform the local manual boot step
      - emit the bootstrap handoff object; after first reachable boot this is
        done by `host.operator-hardware.post-boot.normalize`, which emits the
        firstboot claim handoff
      - firmware boot picker automation
      - remote BIOS control
      - forced machine boot
      - zero_touch_on_old_macbooks

  current_limitations:
    - "Local medium preparation is only the Stage 0 write-and-carry step; the operator still must pass the readiness gates, select the firmware boot path, and reach first boot before `host.operator-hardware.post-boot.normalize` can emit the handoff claim."
    - "Old MacBooks still require local boot selection via Apple boot picker."
    - "CIDATA partition creation requires free space beyond the ISO on the medium."
    - "Autoinstall via CIDATA is Ubuntu-specific (NoCloud datasource)."
