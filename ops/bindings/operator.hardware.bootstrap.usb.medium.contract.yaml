# Operator Hardware Bootstrap USB / SSD Medium Contract
#
# This contract defines the reusable first-touch delivery medium for Stage 0
# bootstrap on old MacBooks and salvage laptops.
#
# Scope:
# - reusable installer medium plan
# - local medium write path
# - handoff from Stage 0 bootstrap artifacts to bootable delivery media
#
# This surface does NOT:
# - imply remote boot control
# - imply PXE/OOB availability
# - assign host or node roles
# - claim fully unattended boot on old MacBooks

subordinate_to: ops/bindings/root.authority.contract.yaml

related_contracts:
  - contract: ops/bindings/operator.hardware.readiness.profiles.yaml
    relationship: "Stage 0 readiness gate model that must be satisfied before the medium becomes the first-touch rail."
  - contract: ops/bindings/operator.hardware.bootstrap.handoff.contract.yaml
    relationship: "Stage 0 first-touch handoff object emitted after the local manual boot sequence yields a claimable Linux host."
  - contract: ops/bindings/operator.hardware.bootstrap.artifact.shelf.yaml
    relationship: "Canonical artifact custody for ISO/library and generated assets."

medium_contract:
  reusable_medium_types:
    - usb
    - external_ssd

  supported_write_strategies:
    - stock_iso_raw_write
    - iso_plus_cidata_partition

  write_strategy_details:
    stock_iso_raw_write:
      description: "Raw dd of installer ISO to medium. No payload embedding."
      mechanism: "dd if=<iso> of=<raw_disk>"
      payload_embedded: false
    iso_plus_cidata_partition:
      description: >
        Raw dd of installer ISO followed by creation of a small FAT partition
        labeled CIDATA containing rendered autoinstall user-data and meta-data.
        Ubuntu installer detects the CIDATA volume via the NoCloud datasource
        and applies autoinstall automatically on first boot.
      mechanism: "dd ISO then diskutil/mkfs.fat CIDATA partition"
      payload_embedded: true
      embedding_standard: "cloud-init NoCloud datasource (labeled CIDATA volume)"
      platform_note: "macOS write path uses diskutil for partition management."

  preferred_strategy_by_class:
    old_macbook: usb
    salvage_laptop: usb

  required_plan_fields:
    - device_id
    - medium_type
    - write_strategy
    - iso_source
    - kit_manifest_path
    - autoinstall_payload_path
    - local_operator_steps
    - claim_handoff_ref

  truth_boundary:
    medium_owns:
      - carry a repeatable installer image
      - carry or reference the rendered Stage 0 payload set
      - make the local operator ritual boring and repeatable
      - represent the local write-and-carry position inside the Stage 0 chain
    medium_does_not_own:
      - satisfy readiness gates by itself
      - select the firmware boot path
      - perform the local manual boot step
      - emit the bootstrap handoff object; after first reachable boot this is
        done by `host.operator-hardware.post-boot.normalize`, which emits the
        firstboot claim handoff
      - firmware boot picker automation
      - remote BIOS control
      - forced machine boot
      - zero_touch_on_old_macbooks

  current_limitations:
    - "Local medium preparation is only the Stage 0 write-and-carry step; the operator still must pass the readiness gates, select the firmware boot path, and reach first boot before `host.operator-hardware.post-boot.normalize` can emit the handoff claim."
    - "Old MacBooks still require local boot selection via Apple boot picker."
    - "CIDATA partition creation requires free space beyond the ISO on the medium."
    - "Autoinstall via CIDATA is Ubuntu-specific (NoCloud datasource)."
