status: authoritative
owner: "@ronny"
last_verified: 2026-04-16
scope: governed-snapshot-surface-contract
version: 3
policy:
  runtime_root: runtime/domain-state/snapshots
  description_prefix: "Read-only by default:"
  promotion_suffix: "tracked promotion requires --apply."
data_heartbeat:
  status: authoritative
  primitive_ref: kernel.HEARTBEAT
  realization: data_surface
  status_capability: data.heartbeat.status
  operator_rule: "Status surfaces that display registered data as current truth must show the heartbeat caption."
  model:
    invariant_fields:
      - liveness_timestamp
      - proof_channel
      - staleness_threshold
    domain_specific_fields:
      - surface_id
      - surface_kind
      - truth_owner
      - surface_path
      - refresh_binding
      - consumer_policy
      - subtraction_disposition
  states:
    fresh: "Structured proof is present and within threshold."
    stale: "Structured proof is present but older than threshold."
    missing: "Registered surface path is absent."
    unknown: "Surface exists, but no structured proof can be read."
    retired: "Surface is intentionally not current truth."
  surfaces:
    - surface_id: nas.storage_manifest
      surface_kind: manifest
      truth_owner: appliance.storage
      appliance_id: nas
      surface_path: ops/bindings/synology918.storage.manifest.yaml
      authority_layer: appliance_projection
      refresh_binding: appliance.health.status
      refresh_mode: external_appliance_readback
      consumer_policy: current_truth_only_when_fresh_else_stale_caption
      subtraction_disposition: keep_as_specimen_then_project_from_appliance_data_surface
      heartbeat:
        liveness_timestamp: manifest_metadata.last_verified_at_utc
        proof_channel:
          type: embedded_timestamp
          ref: manifest_metadata.last_verified_at_utc
        staleness_threshold: 24h
        severity_when_stale: fail
        caption: "NAS storage manifest last_verified_at_utc field."
    - surface_id: backup.estate.readback
      surface_kind: estate_readback
      truth_owner: backup
      surface_path: ""
      authority_layer: L2_readmodel
      refresh_binding: backup.estate.readback.status
      refresh_mode: readback_capability
      consumer_policy: current_truth_from_first_class_estate_readback
      subtraction_disposition: replaces_backup_posture_snapshot_as_current_truth
      heartbeat:
        liveness_timestamp: null
        proof_channel:
          type: cap_receipt
          ref: backup.estate.readback.status
        staleness_threshold: 30m
        severity_when_stale: warn
        caption: "Backup estate readback uses the latest successful governed capability receipt."
    - surface_id: home.hardware.inventory
      surface_kind: inventory
      truth_owner: infra.home
      surface_path: ops/bindings/home.hardware.inventory.yaml
      authority_layer: compatibility_evidence
      refresh_binding: home.hardware.inventory.reconcile
      refresh_mode: retired_as_node_admission_authority
      consumer_policy: evidence_only; current node admission truth comes from node.admission.status
      subtraction_disposition: demoted_by_node_admission_readback
      heartbeat:
        liveness_timestamp: updated
        proof_channel:
          type: embedded_timestamp
          ref: updated
        staleness_threshold: 168h
        severity_when_stale: warn
        caption: "Home hardware inventory is compatibility evidence only; node admission truth comes from node.admission.status."
    - surface_id: node.admission.readback
      surface_kind: estate_readback
      truth_owner: node_admission
      surface_path: ""
      authority_layer: L2_readmodel
      refresh_binding: node.admission.status
      refresh_mode: readback_capability
      consumer_policy: current_node_admission_truth_from_first_class_readback
      subtraction_disposition: replaces_home_hardware_inventory_and_internet_asset_registry_as_node_authority
      heartbeat:
        liveness_timestamp: null
        proof_channel:
          type: cap_receipt
          ref: node.admission.status
        staleness_threshold: 30m
        severity_when_stale: warn
        caption: "Node admission readback uses the latest successful governed capability receipt."
    - surface_id: hardware.inventory
      surface_kind: inventory
      truth_owner: infra.hardware
      surface_path: ops/bindings/hardware.inventory.yaml
      authority_layer: L2_authority
      refresh_binding: hardware.inventory.audit
      refresh_mode: manual_until_refresh_owner_exists
      consumer_policy: current_truth_only_when_fresh_else_historical_caption
      subtraction_disposition: register_then_assign_refresh_owner
      heartbeat:
        liveness_timestamp: updated_at
        proof_channel:
          type: embedded_timestamp
          ref: updated_at
        staleness_threshold: 720h
        severity_when_stale: warn
        caption: "Hardware inventory updated_at field."
    - surface_id: services.health
      surface_kind: probe_projection
      truth_owner: L1_probe_registry
      surface_path: ops/bindings/services.health.yaml
      authority_layer: L1_projection
      refresh_binding: services.health.status
      refresh_mode: probe_readback
      consumer_policy: current_health_truth_from_probe_results_not_file_age
      subtraction_disposition: project_from_probe_registry_only
      heartbeat:
        liveness_timestamp: null
        proof_channel:
          type: cap_receipt
          ref: services.health.status
        staleness_threshold: 15m
        severity_when_stale: warn
        caption: "Probe freshness must come from services.health.status receipts."
    - surface_id: home.device.registry
      surface_kind: registry
      truth_owner: network.home
      surface_path: ops/bindings/home.device.registry.yaml
      authority_layer: compatibility_evidence
      refresh_binding: network.home.device.registry.reconcile
      refresh_mode: retired_as_site_presence_authority
      consumer_policy: evidence_only; current site presence truth comes from site.presence.status
      subtraction_disposition: demoted_by_site_presence_readback
      heartbeat:
        liveness_timestamp: updated_at
        proof_channel:
          type: embedded_timestamp
          ref: updated_at
        staleness_threshold: 168h
        severity_when_stale: warn
        caption: "Home device registry is compatibility evidence only; site presence truth comes from site.presence.status."
    - surface_id: site.presence.readback
      surface_kind: estate_readback
      truth_owner: site_presence
      surface_path: ""
      authority_layer: L2_readmodel
      refresh_binding: site.presence.status
      refresh_mode: readback_capability
      consumer_policy: current_site_presence_truth_from_first_class_readback
      subtraction_disposition: replaces_unifi_observed_snapshots_and_home_device_registry_as_presence_authority
      heartbeat:
        liveness_timestamp: null
        proof_channel:
          type: cap_receipt
          ref: site.presence.status
        staleness_threshold: 30m
        severity_when_stale: warn
        caption: "Site presence readback uses the latest successful governed capability receipt."
    - surface_id: network.unifi.home.clients.observed
      surface_kind: observed_snapshot
      truth_owner: network.home
      surface_path: ops/bindings/network.unifi.home.clients.observed.yaml
      authority_layer: compatibility_projection
      refresh_binding: network.home.unifi.clients.snapshot
      refresh_mode: evidence_projection_only
      consumer_policy: evidence_only; current site presence truth comes from site.presence.status
      subtraction_disposition: demoted_by_site_presence_readback
      heartbeat:
        liveness_timestamp: generated_at
        proof_channel:
          type: embedded_timestamp
          ref: generated_at
        staleness_threshold: 24h
        severity_when_stale: fail
        caption: "Home UniFi observed clients are compatibility evidence only; site presence truth comes from site.presence.status."
    - surface_id: network.unifi.shop.clients.observed
      surface_kind: observed_snapshot
      truth_owner: network.shop
      surface_path: ops/bindings/network.unifi.shop.clients.observed.yaml
      authority_layer: compatibility_projection
      refresh_binding: network.unifi.clients.snapshot
      refresh_mode: evidence_projection_only
      consumer_policy: evidence_only; current site presence truth comes from site.presence.status
      subtraction_disposition: demoted_by_site_presence_readback
      heartbeat:
        liveness_timestamp: generated_at
        proof_channel:
          type: embedded_timestamp
          ref: generated_at
        staleness_threshold: 24h
        severity_when_stale: fail
        caption: "Shop UniFi observed clients are compatibility evidence only; site presence truth comes from site.presence.status."
    - surface_id: media.capacity.snapshot
      surface_kind: capacity_snapshot
      truth_owner: media
      surface_path: /Users/ronnyworks/code/projects/media/bindings/media.capacity.snapshot.yaml
      authority_layer: compatibility_projection
      refresh_binding: media.capacity.snapshot.build
      refresh_mode: advisory_evidence_only
      consumer_policy: evidence_only; capacity may inform payload.custody.status but cannot decide custody, placement, recovery, or deletion
      subtraction_disposition: demoted_by_payload.custody.status
      heartbeat:
        liveness_timestamp: generated_at_utc
        proof_channel:
          type: embedded_timestamp
          ref: generated_at_utc
        staleness_threshold: 24h
        severity_when_stale: warn
        caption: "Media capacity snapshot is advisory evidence only; payload/storage custody truth comes from payload.custody.status."
    - surface_id: media.content.snapshot
      surface_kind: content_snapshot
      truth_owner: media
      surface_path: /Users/ronnyworks/code/projects/media/bindings/media.content.snapshot.yaml
      authority_layer: compatibility_projection
      refresh_binding: media.content.snapshot.refresh
      refresh_mode: advisory_evidence_only
      consumer_policy: evidence_only; content may inform payload.custody.status but cannot decide custody, placement, recovery, or deletion
      subtraction_disposition: demoted_by_payload.custody.status
      heartbeat:
        liveness_timestamp: generated_at
        proof_channel:
          type: embedded_timestamp
          ref: generated_at
        staleness_threshold: 24h
        severity_when_stale: warn
        caption: "Media content snapshot is advisory evidence only; payload/storage custody truth comes from payload.custody.status."
    - surface_id: internet.asset.registry
      surface_kind: registry
      truth_owner: infra.assets
      surface_path: ops/bindings/internet.asset.registry.yaml
      authority_layer: compatibility_evidence
      refresh_binding: internet.asset.registry.build
      refresh_mode: projection_or_procurement_evidence_only
      consumer_policy: evidence_only; current node admission truth comes from node.admission.status
      subtraction_disposition: demoted_by_node_admission_readback
      heartbeat:
        liveness_timestamp: updated_at
        proof_channel:
          type: embedded_timestamp
          ref: updated_at
        staleness_threshold: 168h
        severity_when_stale: warn
        caption: "Internet asset registry is compatibility/procurement evidence only; node admission truth comes from node.admission.status."
    - surface_id: shop.storage.map
      surface_kind: storage_projection
      truth_owner: infra.storage
      surface_path: ops/bindings/shop.storage.map.yaml
      authority_layer: compatibility_projection
      refresh_binding: infra.shop.storage.authority.build
      refresh_mode: generated_compatibility_projection
      consumer_policy: evidence_only; current payload/storage custody truth comes from payload.custody.status
      subtraction_disposition: demoted_by_payload.custody.status
      heartbeat:
        liveness_timestamp: generated_at_utc
        proof_channel:
          type: embedded_timestamp
          ref: generated_at_utc
        staleness_threshold: 24h
        severity_when_stale: warn
        caption: "Shop storage map is compatibility evidence only; payload/storage custody truth comes from payload.custody.status."
    - surface_id: home.storage.map
      surface_kind: storage_projection
      truth_owner: infra.storage
      surface_path: ops/bindings/home.storage.map.yaml
      authority_layer: compatibility_projection
      refresh_binding: infra.estate.boringness.build
      refresh_mode: generated_compatibility_projection
      consumer_policy: evidence_only; current payload/storage custody truth comes from payload.custody.status
      subtraction_disposition: demoted_by_payload.custody.status
      heartbeat:
        liveness_timestamp: generated_at_utc
        proof_channel:
          type: embedded_timestamp
          ref: generated_at_utc
        staleness_threshold: 24h
        severity_when_stale: warn
        caption: "Home storage map is compatibility evidence only; payload/storage custody truth comes from payload.custody.status."
    - surface_id: payload.custody.readback
      surface_kind: estate_readback
      truth_owner: payload_custody
      surface_path: ""
      authority_layer: L2_readmodel
      refresh_binding: payload.custody.status
      refresh_mode: readback_capability
      consumer_policy: current_payload_storage_custody_truth_from_first_class_readback
      subtraction_disposition: replaces_storage_maps_and_media_snapshots_as_custody_authority
      heartbeat:
        liveness_timestamp: null
        proof_channel:
          type: cap_receipt
          ref: payload.custody.status
        staleness_threshold: 30m
        severity_when_stale: warn
        caption: "Payload custody readback uses the latest successful governed capability receipt."
governed_surfaces:
  - capability: backup.posture.snapshot.build
    tracked_binding: ops/bindings/domains/backup/backup.posture.snapshot.yaml
  - capability: network.home.dhcp.audit
    tracked_binding: ops/bindings/home.dhcp.audit.yaml
  - capability: network.shop.dhcp.audit
    tracked_binding: ops/bindings/shop.dhcp.audit.yaml
automation_surfaces:
  - path: ops/plugins/core/bin/domain-inventory-refresh-daily.sh
  - path: ops/plugins/core/bin/operator-hygiene-daily.sh
