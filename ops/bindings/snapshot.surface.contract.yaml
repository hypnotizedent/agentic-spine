status: authoritative
owner: "@ronny"
last_verified: 2026-03-21
scope: governed-snapshot-surface-contract
version: 1
policy:
  runtime_root: runtime/domain-state/snapshots
  description_prefix: "Read-only by default:"
  promotion_suffix: "tracked promotion requires --apply."
governed_surfaces:
  - capability: network.home.dhcp.audit
    tracked_binding: ops/bindings/home.dhcp.audit.yaml
  - capability: media.content.snapshot.refresh
    tracked_binding: ops/bindings/domains/media/media.content.snapshot.yaml
  - capability: media.capacity.snapshot.build
    tracked_binding: ops/bindings/domains/media/media.capacity.snapshot.yaml
  - capability: network-inventory-snapshot-build
    tracked_binding: ops/bindings/network.inventory.snapshot.yaml
  - capability: backup.posture.snapshot.build
    tracked_binding: ops/bindings/backup.posture.snapshot.yaml
automation_surfaces:
  - path: ops/plugins/core/authority/bin/domain-inventory-refresh
  - path: ops/plugins/core/bin/media-capacity-snapshot-daily.sh
  - path: ops/plugins/core/bin/backup-monitor-hourly.sh
