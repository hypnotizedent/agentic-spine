# Shop Device Registry (SSOT)
# Canonical source for all devices on the shop network (192.168.1.0/24).
# Status: authoritative
# Last verified: 2026-03-25
# Source: UniFi UDR6 client snapshot + manual discovery
#
# Categories:
#   infrastructure — VMs, hypervisors, storage, network gear
#   production     — production equipment (embroidery, CNC, etc)
#   surveillance   — cameras, NVR
#   iot            — smart devices, sensors
#   personal       — phones, laptops, workstations (DHCP)
#   unknown        — visible on network, identity not yet confirmed
#
# IP policy: DHCP reservations on UDR6 for VMs and infrastructure.
#            Production machines use static IPs in management range.
#            Personal devices use DHCP pool (192.168.1.100-229).
#
# Static IP ranges:
#   192.168.1.1-10       gateway + core network infrastructure
#   192.168.1.100-229    VMs, workstations, general DHCP
#   192.168.1.230-254    management range (iDRAC, switches, production machines)
#
# UDR reservation/DNS mutations are governed via network.shop.* capabilities.
# This file tracks intended state; UDR6 is the runtime authority for DHCP leases.

network:
  subnet: "192.168.1.0/24"
  gateway: "192.168.1.1"
  dhcp_range: "192.168.1.6-254"
  dhcp_dns: "192.168.1.204"
  management_range: "192.168.1.230-254"
  wifi_ssid: "Shop WiFi"

devices:

