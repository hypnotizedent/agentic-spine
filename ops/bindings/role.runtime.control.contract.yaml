---
status: authoritative
owner: "@ronny"
last_verified: 2026-03-28
scope: role-runtime-control-plane

version: "1.2"
updated_at: "2026-03-28"

runtime_roles:
  canonical: [researcher, worker, qc, close, librarian]
  default_role: researcher
  close_role_aliases: [close, librarian]
  read_only_roles: [researcher, qc, close, librarian]
  mutating_roles: [worker]
  mutating_capability_allowlist_by_role:
    researcher:
      # Session bootstrap — session.v3.attach is the public entry gate for every
      # governed session. session.start remains allowlisted only as the internal
      # bootstrap/diagnostic subroutine behind attach and recovery paths.
      - session.start
      - session.v3.attach
      # Friction ingestion — core researcher function
      - friction.ingest
      - friction.reconcile
      - friction.baseline.capture
      # Close mutators — contract-justified per GAP-OP-1262 (0b43337):
      # researchers must finalize loop/gap lifecycle after friction reconciliation
      # without requiring full worker promotion for administrative close operations.
      - loops.auto.close
      - gaps.auto.close
      # Gap/loop lifecycle governance — researchers file findings, claim work,
      # and create loops as part of normal research flow. These are administrative
      # governance operations, not domain mutations. Justified by GAP-OP-1329.
      - gaps.file
      - gaps.claim
      - loops.create
      - loops.continuity.update
      # Session override — allows researcher to set session-scoped role override
      # without needing env vars on the first call (bootstrap problem).
      - session.role.override
      # Interactive secret setter — inherently manual-gated (read -s prompt).
      # Researchers need to provision secrets during discovery without full worker
      # promotion. The interactive nature provides equivalent approval gating.
      # Justified by GAP-OP-1281.
      - secrets.set.interactive
      # Execution lane control-plane — bootstrap/closeout/scan are governance
      # primitives for lane lifecycle. They don't mutate repo content (only create
      # worktrees and write external state). Researchers need these to create
      # clean execution lanes for routine work without override ceremony.
      # Justified by Phase 2.2 (agent-execution-lane-phase2-2 wave).
      - session.execution.lane.bootstrap
      - session.execution.lane.closeout
      - session.execution.lane.scan
      # Managed infrastructure worktree sync — governed control-plane mutation
      # for runtime scheduler parity. It only fast-forwards contract-managed
      # worktrees and fails closed on dirty/non-FF state.
      - worktree.lifecycle.managed.sync
      # Authority/projection refresh — capability projection rebuild is a
      # self-heal control-plane step needed to keep cap discovery aligned with
      # shared truth during governance repairs.
      - capability.map.projection.build
      # Mint voice ingress — the governed bridge executes these mutators as the
      # canonical Twilio -> Vapi -> n8n intake lane. They mutate externalized
      # runtime state and mailbox projections, not repo content, and must be
      # runnable without worker promotion for unattended inbound customer intake.
      - mint.customer.voice.intake.capture
      - mint.customer.voice.callback.enqueue
  execution_policy:
    enforce_read_only_mutation_block: true
    override_env: SPINE_ROLE_POLICY_OVERRIDE_REF
    override_reason_env: SPINE_ROLE_POLICY_OVERRIDE_REASON
  session_role_override_cache:
    cache_filename: role-override.env
    ttl_seconds: 14400
    session_env_var: SPINE_SESSION_ID
    terminal_role_env_var: OPS_TERMINAL_ROLE
    require_session_binding: true
    require_terminal_role_binding: true

attach_admission:
  enforce_top_level: true
  required_safety: [read-only, mutating, destructive]
  autonomous_scheduler_contract: ops/bindings/launchd.runtime.contract.yaml
  entry_gate_bypass_binding: ops/bindings/entry.gate.bypass.yaml
  required_env:
    - SPINE_ENTRY_PACKET_PATH
    - SPINE_ENTRY_PACKET_HASH
  exempt_capabilities:
    - session.start
    - session.v3.attach
    - session.role.override
    - aof.contract.acknowledge
    - friction.ingest
    - friction.reconcile
    - friction.baseline.capture
    - worktree.lifecycle.rehydrate
    - worktree.lifecycle.managed.sync
    - session.execution.lane.bootstrap
    - session.execution.lane.closeout
    - session.execution.lane.scan
    - loops.continuity.update
    - mailroom.task.claim
    - mailroom.task.complete
    - mailroom.task.fail
    - mailroom.task.heartbeat
    - orchestration.wave.collect
    # Autonomous control cycle — execution terminal runs headless from
    # canonical root main, so no interactive attach packet is available.
    - spine.control.cycle
    # Launchd-scheduled caps — no interactive attach session available.
    # These run unattended via macOS LaunchAgents on a fixed cadence.
    - operator.storage.surface.sync
    - mailroom.task.worker.start
    - mailroom.task.worker.stop
    # Recovery restart is invoked by launchd-health-check without an interactive attach.
    - recovery.launchd.restart
    # Nightly/session closeout — must run headless for state hygiene.
    - nightly.closeout
    - agent.session.closeout
    # Media queue reconciliation — scheduled headless to prevent cyclical queue buildup.
    - media.queue.reconcile
    - media.queue.reconcile.sonarr
    - media.queue.reconcile.lidarr

lane_role_compatibility:
  lane_source_contract: ops/bindings/terminal.launcher.view.yaml
  allowed_runtime_roles_by_lane:
    control: [worker]
    execution: [worker]
    audit: [researcher, qc]
    watcher: [researcher]

launch_role_aliases:
  canonical_modes:
    solo:
      launcher_role: solo
      description: "No loop attach; local terminal launch mode."
    control:
      launcher_role: orchestrator
      description: "Loop-attached control launch mode."
    lane-worker:
      launcher_role: worker
      description: "Loop-attached lane worker launch mode."
  compatibility_aliases:
    orchestrator:
      canonical_mode: control
      launcher_role: orchestrator
      warning: "legacy launch alias; prefer --role control"
    worker:
      canonical_mode: lane-worker
      launcher_role: worker
      warning: "legacy launch alias; prefer --role lane-worker"
  required_warning_on_alias_use: [orchestrator, worker]

handoff_boundaries:
  researcher_to_worker:
    from_role: researcher
    to_role: worker
    required_input_refs:
      - research_brief_ref
      - scope_ref
    required_output_refs:
      - execution_plan_ref
      - acceptance_criteria_ref
  researcher_to_qc:
    from_role: researcher
    to_role: qc
    required_input_refs:
      - research_brief_ref
      - scope_ref
    required_output_refs: []
  worker_to_qc:
    from_role: worker
    to_role: qc
    required_input_refs:
      - execution_plan_ref
      - acceptance_criteria_ref
    required_output_refs:
      - implementation_ref
      - verify_ref
      - cleanup_ref
  qc_to_close:
    from_role: qc
    to_role: close
    required_input_refs:
      - implementation_ref
      - verify_ref
      - cleanup_ref
    required_output_refs:
      - closeout_ref
      - linkage_ref

handoff_ref_semantics:
  default_kind: file_ref
  kinds:
    file_ref:
      regex: "^(/|\\./|\\.\\./)?[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*(#[A-Za-z0-9._:-]+|:[0-9]+(:[0-9]+)?)?$"
      description: "Repo/absolute file reference with optional #anchor or :line[:col]."
    run_key_ref:
      regex: "^(CAP-[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+|S[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+)$"
      description: "Governed run key namespace (capability or session inline/fixture)."
    commit_ref:
      regex: "^[0-9a-f]{7,40}$"
      description: "Git commit SHA reference."
  by_ref_key:
    research_brief_ref: file_ref
    scope_ref: file_ref
    execution_plan_ref: file_ref
    acceptance_criteria_ref: file_ref
    implementation_ref: file_ref
    verify_ref: run_key_ref
    cleanup_ref: file_ref
    closeout_ref: file_ref
    linkage_ref: file_ref

promotion_gates:
  enforce: true
  transitions:
    - from: researcher
      to: worker
      gate: researcher_to_worker
    - from: researcher
      to: qc
      gate: researcher_to_qc
    - from: worker
      to: qc
      gate: worker_to_qc
    - from: qc
      to: close
      gate: qc_to_close
    - from: qc
      to: librarian
      gate: qc_to_close

wave_packet:
  enforce_at_start: true
  enforce_at_dispatch: true
  required_fields:
    - wave_id
    - loop_id
    - owner_terminal
    - current_role
    - next_role
    - deadline_utc
    - horizon
    - execution_readiness
    - claimed_paths
  allowed_horizon: [now, later, future]
  allowed_readiness: [runnable, blocked]
  default_deadline_hours: 24

dod_guard:
  enforce_on_close: true
  required_blocks:
    - verify_results
    - blocker_classification
    - cleanup_proof
    - linkage

horizon_auto_claim:
  enforce_now_runnable_only: true
  allowed_horizon: [now]
  allowed_readiness: [runnable]
  override_ref_field: horizon_override_ref
  override_reason_field: horizon_override_reason

path_claims:
  state_file: $SPINE_STATE/path.claims.yaml
  default_ttl_minutes: 180
  require_non_overlapping_active_claims: true

traffic_index:
  state_file: $SPINE_STATE/traffic.index.yaml
  required_fields:
    - wave_id
    - owner_terminal
    - current_role
    - next_role
    - deadline
    - status
    - claimed_paths
    - blockers

evidence:
  run_key_regexes:
    - "CAP-[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+"
    - "S[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+"
  run_key_regex: "^(CAP-[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+|S[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+)$"
  run_key_namespaces:
    capability:
      regex: "CAP-[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+"
      sources: [capability, wave_receipt, watcher_check, evidence_refs]
    session_inline:
      regex: "S[0-9]{8}-[0-9]{6}__[A-Za-z0-9._-]+__R[A-Za-z0-9]+"
      sources: [ops_run_inline, fixture, session_receipt, evidence_refs]
  commit_ref_regex: "^[0-9a-f]{7,40}$"
  blocker_classes: [none, deterministic, freshness, dependency, cleanup, policy, external]
  required_ref_fields:
    - run_key_refs
    - file_refs
    - commit_refs
    - blocker_class

closeout_state_machine:
  state_field: lifecycle_state
  states:
    active:
      transitions: [implemented]
    implemented:
      transitions: [validated]
    validated:
      transitions: [closed]
    closed:
      transitions: []
