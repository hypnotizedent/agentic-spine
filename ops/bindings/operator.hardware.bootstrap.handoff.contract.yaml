# Operator Hardware Bootstrap Handoff Contract
#
# This contract defines the Stage 0 -> Stage 1 handoff object for
# operator-owned hardware reprovisioned to Linux.
#
# Stage 0 chain, in order:
# - operator.hardware.inventory.yaml establishes the device record
# - operator.hardware.readiness.profiles.yaml defines the readiness gate model
# - runtime.bootstrap.contract.yaml establishes the governed bootstrap entrypath
# - operator.hardware.bootstrap.usb.medium.contract.yaml defines the reusable
#   first-touch delivery medium and local write path
# - this contract emits the first-touch handoff object after trustworthy SSH proof
# - Stage 1 welcome/readiness surfaces consume the handoff after first boot
#
# Scope:
# - Stage 0 first-touch bootstrap outputs only
# - consumed by Stage 1 welcome/readiness planning
#
# This surface does NOT:
# - assign node roles
# - assign host roles
# - declare eligibility outcomes
# - activate any machine
#
# Related contracts:
# - ops/bindings/operator.hardware.inventory.yaml
# - ops/bindings/operator.hardware.readiness.profiles.yaml
# - ops/bindings/operator.hardware.bootstrap.usb.medium.contract.yaml
# - ops/bindings/runtime.bootstrap.contract.yaml

subordinate_to: ops/bindings/root.authority.contract.yaml

handoff_contract:
  description: >
    Minimum machine-readable object emitted at the end of the Stage 0 chain,
    after first-touch bootstrap establishes a claimable Linux host with
    trustworthy SSH proof.

  required_fields:
    - device_id
    - source_platform
    - target_platform_truth
    - hostname
    - operator_user
    - ssh_public_key_ref
    - ssh_proof_status
    - ssh_proof_endpoint
    - package_baseline_status
    - key_seeding_status
    - bootstrap_method
    - installer_provenance
    - target_distro
    - target_distro_version
    - disk_partition_shape
    - machine_facts
    - bootstrap_completed_at

  optional_fields:
    - tailscale_identity
    - tailscale_ip
    - tailscale_status
    - enrollment_policy
    - enrollment_policy_lineage
    - entropy_markers
    - local_hands_required
    - local_hands_steps
    - package_baseline
    - bootstrap_notes
    - render_time_snapshot
    - realized_operator_user

  field_notes:
    source_platform: "Original platform from operator hardware inventory, such as mac or windows."
    device_id: "Device identity originates in the operator.hardware.inventory.yaml record, not in this handoff."
    target_platform_truth: "Target platform after reprovision. Current Stage 0 kernel expects linux."
    ssh_proof_status: "Must be trustworthy. If proof is absent, handoff is not valid."
    ssh_public_key_ref: "Selected through the readiness gate model and threaded through bootstrap rendering before handoff emission."
    installer_provenance: "Method and artifact lineage used to bootstrap the machine."
    enrollment_policy: "First-boot enrollment policy from operator.hardware.readiness.profiles.yaml enrollment_policies."
    enrollment_policy_lineage: "Records whether trust-sensitive material was used and what enrollment stance was active."
    entropy_markers: "Observed quirks or caveats from bootstrap time. Inform later readiness work; do not imply eligibility."
    render_time_snapshot: "Captures inventory platform, device class, and timestamp at render time for later forensic comparison."
    realized_operator_user: "Actual operator user observed on the remote host during firstboot claim, separate from the operator-supplied SSH username."
    machine_facts: "Read-only host facts captured through the same trustworthy SSH proof path: CPU, memory, storage, NIC, firmware, OS, and kernel. These facts support admission/readiness only; they do not assign placement or activate roles."

  field_grammar:
    description: >
      Vocabulary constraints on otherwise-free-string fields. Tightens the
      handoff so admission readback cannot be poisoned by ad-hoc values that
      drift away from the canonical bootstrap path. Validation is enforced at
      handoff emission by host.operator-hardware.firstboot.claim.
    device_id:
      pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
      notes: >
        DNS-label-shaped identifier that doubles as canonical hostname after
        post-boot normalize. Lowercase alphanumeric and hyphen, 2-63 chars,
        must start with alphanumeric. Existing admitted shapes
        (optiplex-9020-001, shuttle-xpc-xc60j-001, macbook-2016-pro) fit.
        Sequence-only shapes (e.g. shuttle1) are not legal: they cannot
        identify the device class without out-of-band context.
    operator_user:
      canonical_default: ubuntu
      notes: >
        Default operator user for target Linux hosts. Matches the fleet baseline
        for all admitted operator-owned hardware. Bootstrap renderer scripts
        default to this value; overrides require explicit --operator-user flag.
    installer_provenance:
      pattern: "^[a-z0-9][a-z0-9._+-]*:[a-z0-9_]+:[a-z0-9._-]+$"
      source_prefixes:
        - operator-declared
        - usb-autoinstall-render
        - post-boot-normalize
        - pve-lan-postboot-normalize
      notes: >
        Three-segment lineage string: <source>:<bootstrap-method>:<distro-version>.
        Source prefix must come from the enumerated set above and identifies
        which Stage 0 path produced the bootstrap. The middle segment is the
        bootstrap_method value. The third segment is <distro>-<version> matching
        target_distro and target_distro_version. Adapter modifiers may be
        joined to the source prefix with '+' (e.g. pve-lan-postboot-normalize+tailscale-enrolled).

  stage_boundary:
    produces: "Stage 0 first-touch bootstrap handoff object"
    produced_by:
      - host.operator-hardware.post-boot.normalize
      - host.operator-hardware.firstboot.claim
    consumed_by:
      - host.operator-hardware.welcome-plan
      - host.operator-hardware.readiness
    does_not_imply:
      - host assignment
      - node assignment
      - eligibility classification
      - activation
