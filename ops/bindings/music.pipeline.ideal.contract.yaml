# Music Pipeline Ideal State Contract
# Status: authoritative
# Owner: "@ronny"
# Scope: Target architecture for the complete music pipeline
# Operator intent: "I want more music and good Arabic music"
# Generated: 2026-03-24

contract: MUSIC_PIPELINE_IDEAL_V1
version: "1.0"
created: "2026-03-24"
owner: "@ronny"

operator_intent: |
  "I want more music and it's really been taking me a while to get good Arabic music."
  The pipeline must maximize discovery, support niche/Arabic content, and create
  a feedback loop: listen → scrobble → discover → grab → listen more.

pipeline_flow: "DISCOVER → WANTED → GRAB → DOWNLOAD → IMPORT → INDEX → STREAM → SCROBBLE → DISCOVER MORE"

discovery_sources:
  manual:
    method: "Operator adds artists/albums directly in Lidarr"
    status: active
    priority: 1
  spotisub:
    method: "Spotify playlists/likes → Navidrome library"
    status: parked
    target: active
    gap: "spotisub container parked — needs promotion"
    arabic_value: "Spotify Arabic playlists and algorithmic discovery feed into library"
  lastfm:
    method: "Scrobbling → similar artists → recommendations"
    status: missing
    target: configured
    gap: "Last.fm integration removed during migration — was in legacy Navidrome config"
    arabic_value: "Last.fm Arabic artist similar/related feeds discovery"
  import_lists:
    method: "Lidarr import lists from external sources"
    status: missing
    target: configured
    gap: "No import lists configured in Lidarr — zero automated discovery"
  music_assistant:
    method: "HA addon multi-provider discovery"
    status: running
    target: integrated
    gap: "Music Assistant running on HA but Navidrome provider not verified"

grab_chain:
  usenet:
    client: sabnzbd
    indexers: [NinjaCentral, NZBFinder, NZBgeek, Usenet-Crawler]
    protocol: usenet
    status: active
    arabic_effectiveness: low
    note: "Arabic music poorly represented on Usenet. Good for mainstream Western."
  soulseek:
    client: slskd
    bridge: soularr
    protocol: p2p
    vpn: gluetun
    status: active
    arabic_effectiveness: high
    note: "Richest source for Arabic and niche music. MUST stay running."
  torrent:
    client: qbittorrent
    indexers: "NONE for music — gap"
    protocol: torrent
    vpn: gluetun
    status: disabled_in_lidarr
    target: re-enabled
    arabic_effectiveness: medium
    gap: "qBit disabled in Lidarr. No torrent indexers for music in Prowlarr."

import_chain:
  flow: "download complete → Lidarr import scan → MusicBrainz match → /media/music"
  lidarr_root: /media/music
  matching_threshold: "80% (causing 24 stuck items — may need relaxation for Arabic)"
  hardlinks: true
  staging_paths:
    sabnzbd: /media/downloads/complete/audio
    slskd: /media/downloads/slskd
    qbittorrent: /media/downloads/complete/lidarr

index_chain:
  navidrome:
    library_path: /music
    host_path: /srv/media/music
    scan_schedule: 1h
    target_scan_schedule: 15m
    gap: "Scan schedule degraded from legacy 15m to current 1h"

stream_chain:
  navidrome:
    port: 4533
    status: active
    clients: [feishin]
    transcoding: "Unknown — legacy was Opus 192kbps"
    integrations_target:
      spotify: {env: [ND_SPOTIFY_ID, ND_SPOTIFY_SECRET], purpose: "artist metadata/images"}
      lastfm: {env: [ND_LASTFM_APIKEY, ND_LASTFM_SECRET], purpose: "scrobbling + recommendations"}
      lrclib: {env: [ND_LRCLIB_URL], value: "https://lrclib.net", purpose: "lyrics display"}
    integrations_current: none
    gap: "All three integrations were in legacy config, lost during migration"
  music_assistant:
    platform: ha_addon
    version: 2.7.11
    status: started
    target: "Navidrome provider configured"

scrobble_chain:
  lastfm:
    status: missing
    target: active
    gap: "Not configured in Navidrome or any client"
    feedback_loop: "scrobbles → similar artists → discovery → Lidarr adds"

playback_clients:
  feishin:
    type: client_app
    server: navidrome
    protocol: subsonic
    platforms: [desktop, mobile]
    status: active_undocumented
    gap: "Not in any spine binding"

# Ideal state service map — all on media-home (VM 106)
ideal_services:
  lidarr:
    status: active
    target_changes:
      - "Add import lists for automated discovery"
      - "Re-enable qBittorrent as download client for music"
      - "Consider relaxing MusicBrainz match threshold for Arabic content"
  slskd:
    status: active
    note: "CRITICAL for Arabic music. Must stay running and VPN-tunneled."
  soularr:
    status: active
    note: "5-min cycle searching Lidarr wanted list via slskd."
  sabnzbd:
    status: active
    note: "Usenet music category. Good for mainstream."
  qbittorrent:
    status: active
    target: re-enabled_in_lidarr
    note: "Need torrent indexers for music in Prowlarr too."
  navidrome:
    status: active
    target_changes:
      - "Restore ND_SPOTIFY_ID + ND_SPOTIFY_SECRET"
      - "Restore ND_LASTFM_APIKEY + ND_LASTFM_SECRET"
      - "Add ND_LRCLIB_URL=https://lrclib.net"
      - "Change ND_SCANSCHEDULE from 1h to 15m"
  spotisub:
    status: parked
    target: active
    note: "Has Spotify OAuth + Last.fm keys. Just needs to be started."
  feishin:
    type: client_app
    target: documented_in_binding
  music_assistant:
    platform: ha_addon
    target: navidrome_provider_configured

# Arabic music strategy
arabic_strategy:
  primary_source: soulseek
  note: |
    Arabic music is poorly represented on Usenet indexers and mainstream torrent trackers.
    Soulseek (slskd) is the richest P2P source for Arabic music — must always be running.
    Spotify discovery via spotisub can surface Arabic playlists and recommendations.
    MusicBrainz has limited Arabic metadata — may need relaxed matching thresholds.
  actions:
    - "Keep slskd + soularr always running (CRITICAL)"
    - "Promote spotisub — subscribe to Arabic music playlists on Spotify"
    - "Enable Last.fm — Arabic artist recommendations via similar artists"
    - "Add Arabic-focused import lists to Lidarr if available"
    - "Consider relaxing Lidarr match threshold from 80% to 60% for problematic imports"

# Gaps to close (ordered by priority)
gaps:
  - id: navidrome-integrations-lost
    priority: high
    description: "Restore Spotify, Last.fm, LRClib integrations in Navidrome compose"
    action: "Add env vars to media-playback compose, recreate container"
  - id: spotisub-parked
    priority: high
    description: "Promote spotisub from parked to active"
    action: "Start container from media-stack compose"
  - id: no-import-lists
    priority: medium
    description: "No automated discovery in Lidarr"
    action: "Add MusicBrainz popular lists, genre lists, Spotify import list"
  - id: no-torrent-music-indexers
    priority: medium
    description: "No torrent indexers for music in Prowlarr"
    action: "Add music-capable torrent indexers via Prowlarr"
  - id: qbit-disabled-in-lidarr
    priority: medium
    description: "qBittorrent disabled in Lidarr for music"
    action: "Re-enable qBit as secondary download client in Lidarr"
  - id: navidrome-scan-degraded
    priority: low
    description: "Scan schedule 1h vs legacy 15m"
    action: "Change ND_SCANSCHEDULE to 15m in compose"
  - id: lidarr-queue-stuck
    priority: low
    description: "24 items stuck on MusicBrainz matching"
    action: "Clear unresolvable items, force-import where possible"
  - id: feishin-undocumented
    priority: low
    description: "Feishin client not in spine bindings"
    action: "Add client binding entry"
  - id: music-assistant-integration
    priority: low
    description: "Music Assistant HA addon integration undocumented"
    action: "Verify Navidrome provider, document in binding"
