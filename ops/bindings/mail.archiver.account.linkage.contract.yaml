  service_id: mail-archiver-vm214
  base_url: "http://100.115.16.37:5100/"
  parent_loop: LOOP-MAIL-ARCHIVER-EWS-CANONICAL-CLOSURE-20260301-20260301

linkage_policy:
  ingestion_mode: read-only
  allow_sendback: false
  require_explicit_enable: true
  default_state: active
  boundary_rules:
    - "Only accounts listed in this contract are allowed as mail-archiver sources."
    - "Connectors are ingest-only (IMAP/OAuth read) and cannot send email."
    - "New sources require explicit contract update plus governed evidence."

freshness_semantics:
  live-sync:
    indicator: sync_job_completion_plus_archive_activity
    source: "communications.mailarchiver.sync.status read-model (recent_jobs + per-account latest_archived_received_at/latest_archived_row_id)"
    stale_after_hours: 1
    note: "MailAccounts.LastSync is advisory only. Some providers can ingest successfully while LastSync is stale or epoch-like, so operator truth must come from the governed sync-status read-model."
  import-only:
    indicator: latest_import_artifact_timestamp
    source: "runtime/domain-state/communications/mail-archiver-import-completion-*.yaml"
    stale_after_days: 90

