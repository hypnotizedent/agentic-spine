# Spine Self-Governance Lifecycle Contract
#
# Purpose:
# Govern the Spine's own evolution. The system already governs infrastructure
# objects well, but its own bindings, capabilities, gates, workflow vocabulary,
# memory surfaces, and session-entry patterns still evolve organically.
#
# This contract defines the lifecycle states and closure requirements for those
# self-governance surfaces so they can be born, promoted, superseded, and
# retired deliberately instead of fading through prompt drift.

contract: SPINE_SELF_GOVERNANCE_LIFECYCLE_CONTRACT_V1

authority_chain:
  dream_board: docs/governance/DREAM_SYSTEM_EXECUTION_BOARD.yaml
  loop_scopes: /Users/ronnyworks/code/.runtime/spine/state/loop-scopes/
  gap_registry: ops/bindings/operational.gaps.yaml
  runtime_paths: ops/bindings/mailroom.runtime.contract.yaml
  session_entry: docs/governance/SESSION_PROTOCOL.md

problem_statement: |
  The Spine governs infrastructure lifecycle, but not its own vocabulary,
  bindings, capabilities, gates, projections, memory layer, or session-entry
  rituals. That allows system evolution to depend on operator memory, ambient
  prompt context, and partial rediscovery instead of canonical closure.

surface_classes:
  - id: workflow_pattern
    description: Canonical work units and operating concepts such as loop, gap, plan, proposal, friction, packet, wave, and handoff.
    example_surfaces:
      - docs/governance/SESSION_PROTOCOL.md
      - docs/governance/DREAM_SYSTEM.md
      - ops/bindings/deprecated.terms.yaml
  - id: vocabulary_term
    description: User-facing or agent-facing terms that must be promoted, deprecated, aliased, or retired intentionally.
    example_surfaces:
      - ops/bindings/deprecated.terms.yaml
      - docs/governance/SESSION_PROTOCOL.md
  - id: binding_surface
    description: Canonical YAML/JSON authorities that express truth for one concern family.
    example_surfaces:
      - ops/bindings/*.yaml
      - ops/bindings/*.json
  - id: capability_surface
    description: Executable governed entrypoints and their registration/projection surfaces.
    example_surfaces:
      - ops/capabilities.yaml
      - ops/bindings/capability_map.yaml
  - id: gate_surface
    description: Verify and admission rules that enforce canonical truth and quality.
    example_surfaces:
      - ops/bindings/gate.registry.yaml
      - surfaces/verify/
  - id: projection_surface
    description: Generated or derived views that must stay in parity with their authorities.
    example_surfaces:
      - ops/bindings/service.endpoint.catalog.yaml
      - ops/bindings/terminal.worker.catalog.yaml
  - id: stateful_surface
    description: Logical state surfaces whose physical runtime materialization may live outside the repo and must remain explicit to agents.
    example_surfaces:
      - ops/bindings/mailroom.runtime.contract.yaml
      - /Users/ronnyworks/code/.runtime/spine/state/
      - mailroom/state/
  - id: memory_surface
    description: Recall, retrieval, and durable reasoning surfaces used across sessions.
    example_surfaces:
      - ops/bindings/rag.workspace.contract.yaml
      - /Users/ronnyworks/code/.runtime/spine/state/
      - /Users/ronnyworks/code/.evidence/spine/
  - id: session_entry_surface
    description: Startup and degraded-mode entry rituals that determine whether agents inherit canonical context.
    example_surfaces:
      - docs/governance/SESSION_PROTOCOL.md
      - ops/plugins/core/session/bin/session-start
      - AGENTS.md
      - CLAUDE.md

required_metadata:
  all_surfaces:
    - owner
    - lifecycle_state
    - source_of_truth
    - introduced_by
    - review_cadence_days
    - consumers
  promotable_surfaces:
    - promotion_evidence
    - success_metric
  supersedable_surfaces:
    - supersedes
    - superseded_by
    - migration_path
    - retirement_reason
  stateful_surfaces:
    - logical_path
    - physical_runtime_path
    - runtime_materialization_policy
    - degraded_mode

lifecycle_states:
  proposed:
    description: Surface or pattern is named, but not yet relied upon.
  incubating:
    description: Surface exists experimentally with bounded proving use and explicit owner.
  governed:
    description: Surface has an authority file or contract, but consumer coverage is still partial.
  active:
    description: Surface is canonical, consumed intentionally, and verified by at least one closure/gate path.
  transitional:
    description: Surface is being replaced or narrowed, but active consumers still exist.
  superseded:
    description: A successor surface/pattern is canonical; this one remains only for controlled migration or explanation.
  tombstoned:
    description: Surface is retired, documented, and retained only as historical/forensic residue.
  purge_eligible:
    description: Surface has no active consumers, review window has passed, and deletion or archival is allowed.

transition_requirements:
  - from: proposed
    to: incubating
    closure_requirements:
      - "Owning loop and objective exist"
      - "Problem statement and success metric are explicit"
      - "At least one intended consumer is named"
  - from: incubating
    to: governed
    closure_requirements:
      - "Authority surface exists"
      - "Lifecycle owner and review cadence are declared"
      - "No competing unnamed parallel canon remains unexplained"
  - from: governed
    to: active
    closure_requirements:
      - "At least one real consumer uses the surface"
      - "At least one gate, audit, or verify path checks it"
      - "Degraded mode or fallback is documented for stateful/session-critical surfaces"
  - from: active
    to: transitional
    closure_requirements:
      - "Successor surface or successor pattern is named"
      - "Consumer migration path is explicit"
      - "Compatibility window or residual classification is documented"
  - from: transitional
    to: superseded
    closure_requirements:
      - "Successor is active"
      - "Active consumers are migrated or intentionally exempted"
      - "Old surface is no longer first-class in entry or routing paths"
  - from: superseded
    to: tombstoned
    closure_requirements:
      - "No active consumers remain"
      - "Historical explanation is preserved"
      - "Retirement evidence or replacement intent is recorded"
  - from: tombstoned
    to: purge_eligible
    closure_requirements:
      - "Review date has passed"
      - "No restore/rollback value remains"
      - "Operator deletion/archive approval exists"

closure_dimensions:
  - id: vocabulary_and_routing
    description: Workflow concepts must resolve intentionally in docs, route surfaces, and agent behavior instead of by prompt luck.
  - id: session_entry_and_degraded_bootstrap
    description: Entry surfaces must have fallback behavior when session.start or dependencies fail.
  - id: memory_and_recall_continuity
    description: RAG, receipts, and runtime state must preserve recall even when one memory surface is unhealthy.
  - id: usage_and_dormancy
    description: Bindings, capabilities, gates, and patterns need usage telemetry so dead weight can be retired deliberately.
  - id: supersession_and_tombstoning
    description: Old surfaces must record what replaced them, why, and when they can be removed.
  - id: logical_vs_physical_runtime_paths
    description: Stateful logical paths such as mailroom/state must explicitly map to their physical runtime roots.

current_estate_findings:
  - id: session_entry_single_path
    class: session_entry_surface
    lifecycle_state: governed
    note: "session.start is canonical, but degraded startup remains too dependent on one successful bootstrap path."
  - id: rag_memory_surface
    class: memory_surface
    lifecycle_state: governed
    note: "RAG authority exists, but runtime health is not strong enough to guarantee recall continuity."
  - id: deprecated_terms_registry
    class: vocabulary_term
    lifecycle_state: active
    note: "Catches codebase term drift, but not broader workflow-pattern drift across prompts and session behavior."
  - id: worktree_and_plan_lifecycles
    class: binding_surface
    lifecycle_state: active
    note: "Worktree lifecycle and plans lifecycle exist as exemplars of self-governance, but there is no umbrella lifecycle for all Spine surfaces."
  - id: gate_registry_retirement
    class: gate_surface
    lifecycle_state: governed
    note: "Gate retirement metadata exists, but there is no usage-driven closure loop for active-vs-dormant gate strategy."
  - id: runtime_path_externalization
    class: stateful_surface
    lifecycle_state: governed
    note: "Logical mailroom/state paths are externalized to .runtime/spine/state, but that mapping is not universally obvious to consumers."

initial_success_criteria:
  - "The Spine has one explicit lifecycle authority for its own surfaces, not only for infrastructure objects."
  - "Old workflow/compiler umbrella work can be reparented under a clearer self-governance owner loop."
  - "New self-governance gaps exist for vocabulary routing, session resilience, memory continuity, and usage-driven retirement."
