scope: mint-customer-inbox-disposition
version: "1.0"
updated_at: "2026-03-17"
capability: mint.customer.inbox.disposition

surface:
  description: Canonical Mint inbox disposition machine for customer-lane safety, queue visibility, and truth-creation gating.
  default_mailbox: team@mintprints.com

dispositions:
  customer_actionable:
    description: Real in-scope customer work that can create or mutate governed customer truth.
  waiting_on_customer:
    description: Real customer thread, but no new governed customer-truth mutation should happen until the customer provides the missing business detail.
  unsupported_scope:
    description: Real customer thread asking for work outside Mint's supported apparel lane.
  vendor_revision:
    description: Forwarded or direct vendor/internal revision traffic that belongs outside the customer-first lane.
  supplier_marketing:
    description: Recoverable supplier or promotional outreach that should leave the primary queue.
  risky_junk:
    description: Suspicious, risky, or junk mail that should be hidden recoverably from the primary queue.

routing:
  customer_truth_dispositions:
    - customer_actionable
  primary_queue_visible_dispositions:
    - customer_actionable
    - waiting_on_customer
    - unsupported_scope
  hidden_from_primary_queue_dispositions:
    - supplier_marketing
    - risky_junk
  reply_allowed_dispositions:
    - customer_actionable
    - waiting_on_customer
    - unsupported_scope
  recoverable_folder_by_disposition:
    supplier_marketing: Supplier Marketing
    risky_junk: Junk Email

