# Mint Quote Payment Bridge Authority
# Status: authoritative
# Last verified: 2026-03-09
# Scope: quote-to-payment-boundary

version: 1
updated_at: "2026-03-09"
owner: "@ronny"
status: authoritative
scope: quote-to-payment-boundary

purpose: >
  Define the canonical promotion boundary from quote_packet (work object) to
  payment-ready quote entity so Quote-to-Pay can generate real payment links
  without inventing fake order_ids or violating order truth immutability rules.

canonical_answers:
  can_quote_packet_generate_payment_link: >
    No. A quote_packet is a mutable work object. Payment links must be bound to
    immutable canonical quote entities as defined in order truth authority.

  what_entity_owns_payment_link: >
    The canonical quote entity (quote_id) as defined in
    mint.order.truth.authority.yaml. A quote references exactly one
    order_revision_id and one pricing_snapshot_id. Payment is bound to the
    quote, not the packet.

  when_does_quote_packet_promote_to_quote: >
    When all of these conditions are met:
    - quote_packet.state = approved_to_send
    - All line items are quote_ready (completeness class)
    - pricing_snapshot exists
    - customer_ref.identity_state = resolved
    - quote_draft_ref exists
    - No blocking gaps in open_gaps
    
    Promotion creates a canonical order (if not exists), order_revision, and
    quote entity. The quote entity receives the quote_id.

  does_payment_require_full_order: >
    Yes, indirectly. Payment requires a canonical quote_id. A quote requires an
    order_revision_id. An order_revision requires an order_id. Therefore,
    payment promotion triggers the full order truth chain:
    quote_packet → order → order_revision → quote → payment.

promotion_boundary:
  quote_packet_to_order:
    trigger_conditions:
      - quote_packet.state = approved_to_send
      - All line items meet quote_ready completeness class
      - customer_ref.identity_state = resolved

    promotion_steps:
      step_1_order_creation: Create canonical order entity if not exists
      step_2_order_revision_creation: Create first order_revision with normalized line items
      step_3_pricing_snapshot_attachment: Attach or create pricing_snapshot
      step_4_quote_creation: Create canonical quote entity
      step_5_quote_packet_update: Update quote_packet with canonical references

  quote_to_payment:
    trigger_conditions:
      - quote_id exists (canonical quote entity)
      - quote.quote_state = draft
      - order_id exists

    payment_link_generation:
      endpoint: POST /api/v1/payments/checkout-session
      required_inputs:
        - order_id (canonical, from promotion)
        - amount_cents (from pricing_snapshot)
        - currency (default "usd")
        - customer_email (from resolved customer_ref)

forbidden_shortcuts:
  no_fake_order_id:
    description: Never generate payment link with invented order_id
    enforcement: Payment module validation requires order_id exists in database
    rejected_alternative: >
      Payment module's POST /v2/checkout generates timestamp-based order_id on the
      fly. This is rejected for Quote-to-Pay because it violates order truth
      authority (canonical order_id must come from order entity creation, not
      payment timestamps).

  no_payment_before_promotion:
    description: Never generate payment link before quote entity exists
    enforcement: quote_packet.state cannot reach ready_for_send without quote_id

  no_parallel_payment_models:
    description: Never create payment records outside payment module
    enforcement: Payment module is sole authority for PaymentRecord creation

payment_endpoint_options:
  option_a_rejected:
    endpoint: POST /v2/checkout
    model: Generate timestamp-based order_id within payment module
    option_status: rejected
    rejection_reason: >
      This endpoint (lines 355-438 in payments-v2.ts) generates order_id from
      Date.now() and visual_id from the timestamp. While functional for web form
      intake, this violates the order truth authority which requires order_id to
      come from canonical order entity creation. Quote-to-Pay must respect the
      governed order creation boundary, not invent identifiers in the payment layer.

  option_b_chosen:
    endpoint: POST /api/v1/payments/checkout-session
    model: Require pre-existing canonical order_id
    option_status: chosen
    rationale: >
      This endpoint (lines 36-68 in checkout.ts) requires order_id as input and
      validates it exists. This aligns with order truth authority and enables the
      governed promotion path: quote_packet → order → order_revision → quote →
      payment. The payment module becomes a consumer of order truth, not a
      generator of it.

  option_c_considered:
    model: Payment against quote_id without order_id
    option_status: considered_but_not_pursued
    analysis: >
      Theoretically, payment could be bound to quote_id directly if the payment
      module were extended to support it. However, the current payment module
      schema (PaymentRecord.order_id) is order-centric, and the checkout session
      metadata uses order_id for reconciliation. Extending to quote_id would
      require payment schema changes and webhook reconciliation updates. Since
      quote requires order_revision which requires order anyway, pursuing
      order-first alignment is simpler and preserves the existing payment contract.

capability_roadmap:
  mint.quote.promote:
    capability_state: runtime_active_in_spine
    purpose: Promote quote_packet to canonical order/revision/quote entities
    implementation_status: implemented_in_spine_runtime
    design_complete: true
    inputs:
      - quote_packet_id (required)
      - operator_approval (required, explicit)
    outputs:
      - order_id (canonical, newly created or linked)
      - order_revision_id (canonical, first revision)
      - quote_id (canonical, quote entity)
      - pricing_snapshot_id (attached or created)
      - quote_packet updated with canonical references
    safety: mutating
    approval_requirement: manual
    blockers:
      - Packet must already be in approved_to_send with no blocking gaps
      - Packet must carry at least one intake seed reference
      - First promotion only; later order_revision supersession is still not implemented
    runtime_surface:
      storage_root: /Users/ronnyworks/code/.data/mint
      orders_dir: /Users/ronnyworks/code/.data/mint/orders/
      order_revisions_dir: /Users/ronnyworks/code/.data/mint/order-revisions/
      quotes_dir: /Users/ronnyworks/code/.data/mint/quotes/
      pricing_snapshots_dir: /Users/ronnyworks/code/.data/mint/pricing-snapshots/
      artwork_bindings_dir: /Users/ronnyworks/code/.data/mint/artwork-bindings/
    canonical_mapping_rules:
      - On first promotion, quote_packet.line_items[].line_item_id is reused as order_revision.line_items[].order_line_id so the system does not invent a second line identity
      - quote_packet.pricing_snapshot.pricing_snapshot_id becomes the canonical pricing_snapshot_id referenced by the promoted quote
      - quote_packet remains mutable; order, order_revision, quote, pricing_snapshot, and artwork_binding records are immutable promotion outputs

  mint.quote.generate_payment_link:
    capability_state: runtime_active_in_spine
    purpose: Generate Stripe checkout URL for a promoted quote
    implementation_status: implemented_in_spine_runtime
    design_complete: true
    inputs:
      - quote_id (required, canonical quote entity)
    outputs:
      - payment_ref (Stripe checkout session, checkout URL, payment type, canonical quote/order linkage)
      - quote updated with payment_ref
      - quote_packet updated with payment_ref
    safety: mutating
    approval_requirement: auto (if quote already approved_to_send)
    blockers:
      - Requires mint.quote.promote to have already persisted canonical order/revision/quote refs
      - Requires quote entity to expose order_id and amount_cents
      - Requires resolved customer email and unpaid order state
    dependencies:
      - quote entity must exist with quote.order_id populated
      - pricing_snapshot must exist with calculated_totals
      - customer_ref must have resolved email
    runtime_surface:
      storage_root: /Users/ronnyworks/code/.data/mint
      quotes_dir: /Users/ronnyworks/code/.data/mint/quotes/
      quote_packets_dir: /Users/ronnyworks/code/.data/mint/quote-packets/
      quotes_index: /Users/ronnyworks/code/.data/mint/quotes-index.yaml
    implementation_path: >
      Read the canonical quote entity by quote_id, follow source_quote_packet_id
      back to the mutable quote_packet, then call payment module
      POST /api/v1/payments/checkout-session with order_id from quote.order_id,
      amount_cents from quote.amount_cents, customer_email from resolved
      customer_ref, and optional reconciled line_items from the promoted packet.
      Store checkout_url and checkout_session_id in both quote.payment_ref and
      quote_packet.payment_ref.
    canonical_mapping_rules:
      - Payment links are always keyed by canonical quote_id and order_id from promotion output; no timestamp-based order ids are allowed
      - Reruns are idempotent: if quote.payment_ref or quote_packet.payment_ref already carries a generated checkout_session_id, reuse it instead of creating a second session
      - Packet state remains approved_to_send (or sent on later reruns); payment-link generation does not promote, send, or mark the order paid

  mint.quote.send:
    capability_state: runtime_active_in_spine
    purpose: Send quote to customer via email with payment link
    implementation_status: implemented_in_spine_runtime
    blockers:
      - Packet must already be approved_to_send (or already sent for idempotent reruns)
      - Generated payment_ref, canonical quote/order refs, resolved customer email, and consent-compatible communications preview are required
      - Mint customer email must route through resend; Microsoft remains manual-only and SMS remains deferred
    current_capability_entry: >
      mint.quote.send now bridges promoted quote_packet truth into
      communications.send.preview -> communications.send.execute, reuses the
      persisted payment_ref, writes communications receipts back to the packet,
      and marks packet/quote sent only after execute returns a real sent status.

  mint.quote.reconcile_payment:
    capability_state: runtime_active_in_spine
    purpose: Reconcile payment module truth back into canonical order/quote/packet state
    implementation_status: implemented_in_spine_runtime
    blockers:
      - Quote must already be sent (or accepted on idempotent reruns) with canonical quote/order refs and generated payment_ref
      - Payment module checkout-session truth and order payment history must both be readable for the canonical order_id
      - Provider-paid status alone is not enough; canonical paid state waits for payment record status=succeeded
    current_capability_entry: >
      mint.quote.reconcile_payment reads GET /api/v1/payments/checkout-session/:sessionId
      plus GET /api/orders/:orderId/payments, mirrors reconciliation fields into
      quote.payment_ref and quote_packet.payment_ref, advances order.lifecycle
      from quoted -> approved on successful customer payment, marks
      quote.quote_state accepted, and only marks quote_packet paid when the
      resulting order payment_state is fully paid. When payment_record_status='refunded',
      projects order.payment_state='refunded' WITHOUT mutating order.lifecycle_state,
      quote.quote_state, or quote_packet.state; adds operator_review_required flag
      when refund is detected on production/fulfilled orders.

honest_implementation_status:
  current_reality:
    - quote_packet work object: IMPLEMENTED (prepare, show, source, price, render)
    - customer resolution: IMPLEMENTED (via mint-modules customers)
    - pricing integration: IMPLEMENTED (via mint-modules pricing)
    - quote draft generation: IMPLEMENTED (inline draft runtime)
    - canonical order entity creation: IMPLEMENTED in Spine runtime storage
    - canonical order revision creation: IMPLEMENTED in Spine runtime storage
    - canonical quote entity creation: IMPLEMENTED in Spine runtime storage
    - canonical pricing_snapshot persistence: IMPLEMENTED in Spine runtime storage
    - payment link generation: IMPLEMENTED (canonical quote/order truth now bridges into the Stripe checkout-session endpoint)
    - quote send: IMPLEMENTED (governed communications preview/execute through Resend email)
    - payment reconciliation: IMPLEMENTED (payment module truth now projects canonical paid/partial-paid state back into order/quote/packet)
    - promotion boundary: IMPLEMENTED for first promotion in Spine runtime

  what_is_unblocked_in_design:
    - Agents now have a governed promotion capability that persists canonical order/revision/quote refs
    - Agents know payment requires order_id from canonical order entity
    - Agents know not to invent order_id in payment layer
    - Agents know quote_packet is a work object, not the quote entity
    - Agents know the endpoint (POST /api/v1/payments/checkout-session)
    - Agents know the capability names (mint.quote.promote, mint.quote.generate_payment_link, mint.quote.send, mint.quote.reconcile_payment)

  what_remains_blocked_in_implementation:
    - Refund/reversal projection back into canonical order/quote/packet state is not implemented yet
    - Later revision promotion (new order_revision / quote supersession) is not implemented yet
    - Order/quote schema deployment in mint-modules database remains future handoff work

agent_guidance:
  default_read_path: ops/bindings/mint.quote.payment_bridge.authority.yaml
  quote_packet_vs_quote_distinction: >
    quote_packet is a mutable work object agents use to prepare quotes.
    quote entity is the immutable canonical truth created by promotion.
    Payment links must bind to quote entities, not quote_packets.
  when_to_stop: >
    If an agent is asked to generate a payment link for a quote_packet, stop and
    explain that promotion to canonical quote entity is required first unless
    mint.quote.promote has already populated order_id/order_revision_id/quote_id.
    If those refs are missing, run promotion before touching Stripe.
  no_fake_order_id_ever: >
    Never generate payment links with invented order_id values. Never use
    timestamp-based order_id generation. Never bypass the promotion boundary.
    If order_id is missing, the quote_packet has not been promoted and payment
    link generation must wait.
  resumability: >
    Agents preparing quotes can resume work by reading mint.quote.show. If
    quote_packet.state shows approved_to_send but quote_id is missing, the next
    step is promotion. If quote_id exists but payment_ref is missing, the next
    step is payment-link generation, not a second promotion. If payment_ref is
    generated and quote_packet.state is still approved_to_send, the next step is
    mint.quote.send. If quote has been sent and payment truth needs projection
    back into canonical state, the next step is mint.quote.reconcile_payment.

conclusion: >
  Quote-to-Pay now has a governed runtime promotion boundary:
  quote_packet → mint.quote.promote → order/revision/quote entities →
  mint.quote.generate_payment_link → POST /api/v1/payments/checkout-session →
  mint.quote.send → governed communications.send.preview/execute → Resend
  customer email → mint.quote.reconcile_payment → canonical
  order.payment_state/quote.quote_state/quote_packet.state projection. The
  payment module endpoint now consumes canonical order_id from promoted quote
  truth. No fake order_id shortcuts are permitted.
