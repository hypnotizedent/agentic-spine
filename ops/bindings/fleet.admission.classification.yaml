# Fleet Admission Classification (Runtime)
#
# Maps current fleet members to their first-touch state as defined in
# fleet.admission.contract.yaml. Records exceptions for hardware that
# predates the contract.
#
# This is a runtime artifact — it changes as fleet state changes.
# The contract (policy) is stable; this surface is not.
# It is admission-state evidence for node.admission.status, not a standalone
# physical-machine identity, role, placement, or recovery authority.
#
# Related:
#   - ops/bindings/fleet.admission.contract.yaml (policy authority)
#   - ops/bindings/hardware.inventory.yaml (infrastructure machines)
#   - ops/bindings/operator.hardware.inventory.yaml (operator-owned machines)
#   - ops/bindings/node.role.contract.yaml (post-admission node roles)

subordinate_to: ops/bindings/fleet.admission.contract.yaml

