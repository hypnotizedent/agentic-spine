exceptions:

  r620_unknown_bmc:
    machine_id: r620
    exception_date: "2026-04-15"
    contract_ref: ops/bindings/fleet.admission.contract.yaml
    violation: >
      R620 arrived with unknown iDRAC credentials. Does not meet FT-BMC
      required proof (bmc_credentials_known).
    classification: non_compliant_intake
    treatment: one_time_manual_recovery
    rationale: >
      Hardware predates the fleet admission contract. One-time manual
      recovery is permitted under the contract exception policy.
      After recovery, the machine must be brought into FT-BMC compliance
      (known BMC credentials, proved first-boot claim) before formal
      admission.
    standing: false
    post_recovery_target_state: FT-BMC
    provenance: >
      Exception recorded 2026-04-15 as part of fleet admission contract
      establishment. This is not a standing exception — it expires after
      the one-time recovery is complete and the machine reaches compliance.
