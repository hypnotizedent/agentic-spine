# RAG Plugin Capability Registry
# Supplementary capability declarations for the rag plugin.
# Primary registration: ops/plugins/MANIFEST.yaml (rag entry)

capabilities:
  - name: rag.capacity.status
    description: "Read-only contention status for shared Ollama embedding/inference"
    script: bin/rag-capacity-status
    binding: ops/bindings/domains/rag/rag.embedding.capacity.yaml
    output_format: key_value_lines
    side_effects: none
    added: "2026-04-25"
