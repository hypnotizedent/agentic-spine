# RAG Plugin Capability Registry
# Supplementary capability declarations for the rag plugin.
# Primary registration: ops/plugins/MANIFEST.yaml (rag entry)

capabilities:
  - name: rag.capacity.status
    description: "Read-only contention status for shared Ollama embedding/inference"
    script: bin/rag-capacity-status
    binding: ops/bindings/domains/rag/rag.embedding.capacity.yaml
    output_format: key_value_lines
    side_effects: none
    added: "2026-04-25"

  - name: rag.budget.status
    description: "Read-only probe checking AnythingLLM + Qdrant resource posture against workload budget contract"
    script: bin/rag-budget-status
    binding: ops/bindings/domains/rag/rag.workload.budget.yaml
    output_format: key_value_lines
    side_effects: none
    added: "2026-04-25"

  - name: rag.reindex.metrics.export
    description: "Prometheus text exposition exporter for RAG reindex observability metrics"
    script: bin/rag-reindex-metrics-export
    binding: ops/bindings/domains/rag/rag.observability.contract.yaml
    output_format: prometheus_text_exposition
    side_effects: none
    added: "2026-04-25"

  - name: rag.observability.activate
    description: "Install/check textfile collector cron for RAG reindex metrics on ai-consolidation"
    script: bin/rag-observability-activate
    binding: ops/bindings/domains/rag/rag.observability.contract.yaml
    output_format: key_value_lines
    side_effects: "mutation only with --install flag"
    added: "2026-04-25"
