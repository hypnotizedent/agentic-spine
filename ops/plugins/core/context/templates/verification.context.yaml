template_id: verification.context
version: "1.0"
type: verification
description: >
  Structured verification template for gate execution, evidence collection,
  and attestation. Ensures terminals run the right gates, capture proper
  evidence, and produce machine-verifiable results.

role_affinity: [controller]

authority_refs:
  - docs/governance/SPINE.md
  - ops/bindings/gate.registry.yaml

# ── Context Dimensions ──────────────────────────────────────────────
context_dimensions:
  - id: gate_selection
    required: true
    prompt: >
      Which gates apply to the current scope? Use the gate registry to
      identify active gates in the relevant domain/category. Distinguish
      between blocking gates and report-only gates.
    evidence_required: true
    evidence_type: gate_id_list

  - id: execution_pack
    required: true
    prompt: >
      Which verify pack to run? Options: fast (core gates), domain
      (domain-specific), release (full certification). Select based on
      the scope and severity of the change being verified.
    evidence_required: true
    evidence_type: verify_command

  - id: evidence_collection
    required: true
    prompt: >
      What evidence must be captured? At minimum: run key, gate pass/fail
      counts, any failing gate IDs with diagnostic output. For release
      verification, capture full gate trace.
    evidence_required: true
    evidence_type: evidence_manifest

  - id: regression_check
    required: true
    prompt: >
      Does this verification touch any surface with prior gaps? Check
      operational.gaps.yaml for open gaps in the affected domain. Confirm
      the verification does not mask an existing known issue.
    evidence_required: false
    evidence_type: gap_cross_reference

  - id: attestation_level
    required: true
    prompt: >
      What confidence level is required? A (fully autonomous), B (high
      confidence, minor gaps), C (moderate, needs review), D (low, advisory
      only), E (failed). The governing loop or envelope specifies the
      minimum acceptable level.
    evidence_required: true
    evidence_type: confidence_declaration

# ── Output Contract ─────────────────────────────────────────────────
output_contract:
  format: structured_yaml
  required_sections:
    - verify_run_key        # the CAP-* run key from the verify execution
    - gate_summary          # total/passed/failed/skipped counts
    - failing_gates         # list of gate IDs that failed, with diagnostics
    - attestation           # confidence level + justification
  optional_sections:
    - regression_notes      # cross-reference with known gaps
    - remediation_plan      # for failing gates: what needs to happen
