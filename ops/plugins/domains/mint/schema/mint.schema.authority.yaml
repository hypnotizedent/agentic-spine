---
status: authoritative
owner: "@ronny"
scope: mint-schema-governance
created: "2026-03-25"
loop_id: LOOP-MINT-OS-FOUNDATION-20260325
---

contract_id: MINT_SCHEMA_AUTHORITY_V1

purpose: >
  Govern the Mint OS data model. This contract declares the canonical DDL as the
  single source of truth for all Mint database schema and prohibits ad-hoc table
  creation by any agent, module, or script.

canonical_ddl:
  path: ops/plugins/domains/mint/schema/mint.core.schema.sql
  dialect: SQLite-compatible reference DDL
  runtime_target: PostgreSQL (mint-modules-postgres)
  entities:
    - customer: business counterparty (provisional → resolved)
    - garment: blank product catalog (style/brand/color)
    - order: governed business work item (lifecycle + payment state machines)
    - artwork: versioned design file/asset (storage tier tracked)
    - line_item: garment + quantity within an order revision
    - decoration: print/embroidery applied to a line item (multi-relational)
    - mockup: visual proof of artwork on garment (approval-gated)

entity_relationships:
  customer:
    has_many: [order, artwork]
  order:
    belongs_to: customer
    has_many: [line_item]
    has_one: [current_revision, active_quote]
  line_item:
    belongs_to: [order, garment]
    has_many: [decoration, mockup]
    stable_across: order revisions (line_item_id persists)
  decoration:
    belongs_to: [line_item, artwork]
    note: multi-relational — one line_item has many decorations (placements)
  artwork:
    belongs_to: customer
    has_many: [decoration, mockup]
    self_referential: parent_artwork_id (version chain)
  garment:
    has_many: [line_item, mockup]
  mockup:
    belongs_to: [line_item, artwork, garment]
    self_referential: parent_mockup_id (version chain)

alignment:
  order_truth_authority: ops/bindings/mint.order.truth.authority.yaml
  quote_packet_authority: ops/bindings/mint.quote.packet.authority.yaml
  note: >
    The canonical DDL implements the identity model and entity model defined in
    the order truth authority. Fields map directly: order_id, customer_id,
    order_revision_id, order_line_id (= line_item_id), artwork_binding
    (= decoration). State machines (lifecycle_state, payment_state, quote_state,
    artwork_binding_state) are enforced via CHECK constraints.

schema_governance:
  create_table_policy:
    rule: FORBIDDEN outside governed migrations
    enforcement: >
      No agent, module, capability, or ad-hoc script may execute CREATE TABLE,
      ALTER TABLE, or DROP TABLE against any Mint database without referencing
      a formal schema migration that traces to this authority file.
    violation_response: >
      If an agent needs a new table or column, it MUST: (1) file a gap against
      this authority, (2) get operator approval, (3) update mint.core.schema.sql,
      (4) execute the migration through the governed path. Ad-hoc CREATE TABLE
      is a governance violation that will be caught and reverted.

  migration_path:
    - propose: file gap or loop with schema change rationale
    - approve: operator review of DDL diff
    - update: modify mint.core.schema.sql (canonical DDL)
    - migrate: execute ALTER/CREATE via governed migration script
    - verify: confirm schema matches canonical DDL

  immutability_rules:
    immutable_after_creation:
      - table names
      - primary key column names
      - foreign key relationships
      - CHECK constraint values (state machines)
    mutable_with_migration:
      - new columns (additive only, with defaults)
      - new indexes
      - new CHECK constraint values (state machine extensions)
    forbidden:
      - column renames on established tables
      - dropping columns with production data
      - removing CHECK constraint values (state machine regression)

runtime_implementation:
  primary: PostgreSQL (mint-modules-postgres container)
  reference: SQLite (for local development, testing, embedded tools)
  translation_rules: >
    PostgreSQL runtime may use native UUID, JSONB, and TIMESTAMPTZ types.
    The SQLite reference DDL uses TEXT for these. Shape, constraints, and
    foreign key relationships must remain identical across dialects.

agent_guidance:
  rule: >
    Before any Mint schema operation, read this authority and the canonical DDL.
    If the table you need does not exist in mint.core.schema.sql, you may NOT
    create it. File a schema gap and wait for governed migration.
  read_order:
    - ops/plugins/domains/mint/schema/mint.schema.authority.yaml
    - ops/plugins/domains/mint/schema/mint.core.schema.sql
    - ops/bindings/mint.order.truth.authority.yaml
