status: authoritative
owner: "@ronny"
scope: mint-storage-lifecycle
created: "2026-03-25"
loop_id: LOOP-MINT-OS-FOUNDATION-20260325
---

contract_id: MINT_STORAGE_LIFECYCLE_V1

purpose: >
  Codify the deterministic Hot/Warm/Cold storage hierarchy for all Mint OS
  assets. Every file generated by a Mint workflow lands in a predictable path
  based on its tier, entity type, and order context. No loose files.

references:
  runtime_boundary: ops/plugins/domains/mint/contracts/mint.runtime.boundary.yaml
  operator_storage: ops/bindings/mint.operator.storage.contract.yaml
  storage_guard: ops/bindings/mint.storage.guard.policy.yaml
  schema: ops/plugins/domains/mint/schema/mint.core.schema.sql

# =============================================================================
# TIER DEFINITIONS
# =============================================================================
tiers:
  hot:
    purpose: Active WIP — jobs in production, open quotes, pending mockups
    storage: local filesystem (rapid IO, no network dependency)
    root: $MINT_RUNTIME_ROOT/hot
    retention: until order reaches fulfilled or cancelled state
    access_pattern: read/write by active capabilities, sub-second latency
    backup: none (reconstructible from warm/cold + database)

  warm:
    purpose: Recent completed — shipped orders, accepted quotes, approved artwork
    storage: MinIO object storage (rclone mintfiles:)
    root: mintfiles:mint-archive
    retention: 12 months from order fulfillment
    access_pattern: read-mostly, seconds latency acceptable
    backup: nightly snapshot to md1400

  cold:
    purpose: Deep archive — historical orders, retired artwork, tax/legal retention
    storage: MD1400 NAS (SMB/rsync)
    root: /mnt/md1400/mint/archive
    retention: 7 years (tax/legal compliance)
    access_pattern: read-only, minutes latency acceptable
    backup: md1400 is the backup destination (no further tier)
    note: "md1400 is confirmed archive target. NEVER purge — only copy."

# =============================================================================
# DETERMINISTIC PATH PATTERNS
# =============================================================================
# Every asset resolves to exactly one path based on tier + entity + context.
# Path variables: {order_id}, {customer_id}, {artwork_id}, {mockup_id},
#                 {year}, {month}, {date}
# =============================================================================
path_patterns:
  hot:
    order_workspace:
      pattern: $MINT_RUNTIME_ROOT/hot/orders/{order_id}/
      contains: active line item data, in-progress production files
    artwork_wip:
      pattern: $MINT_RUNTIME_ROOT/hot/artwork/{order_id}/{artwork_id}/
      contains: working design files, in-progress edits
    mockup_drafts:
      pattern: $MINT_RUNTIME_ROOT/hot/mockups/{order_id}/{line_item_id}/
      contains: draft and pending-approval mockup images
    production_package:
      pattern: $MINT_RUNTIME_ROOT/hot/production/{order_id}/
      contains: print-ready files, separated colors, production notes

  warm:
    completed_order:
      pattern: mintfiles:mint-archive/{year}/{order_id}/
      contains: final production package, approved mockups, invoices
    artwork_approved:
      pattern: mintfiles:artwork-registry/{customer_id}/{artwork_id}/
      contains: approved/final artwork files (reusable across orders)
    mockup_approved:
      pattern: mintfiles:artwork-output/{order_id}/{mockup_id}/
      contains: customer-approved mockup images

  cold:
    archived_order:
      pattern: /mnt/md1400/mint/archive/{year}/{order_id}/
      contains: complete order snapshot (artwork, mockups, production, invoices)
    archived_artwork:
      pattern: /mnt/md1400/mint/archive/artwork/{customer_id}/{artwork_id}/
      contains: historical artwork versions
    archived_customer:
      pattern: /mnt/md1400/mint/archive/customers/{customer_id}/
      contains: full customer file history

# =============================================================================
# LIFECYCLE TRANSITIONS
# =============================================================================
# Assets move between tiers based on order lifecycle state transitions.
# Transitions are one-directional: hot → warm → cold. Never backwards.
# =============================================================================
transitions:
  hot_to_warm:
    trigger: order.lifecycle_state transitions to 'fulfilled' or 'cancelled'
    actions:
      - sync order workspace to mintfiles:mint-archive/{year}/{order_id}/
      - sync approved artwork to mintfiles:artwork-registry/{customer_id}/
      - sync approved mockups to mintfiles:artwork-output/{order_id}/
      - verify arrival (rclone check --size-only)
      - remove hot workspace after verified sync
    grace_period: 7 days after fulfillment (allows corrections)

  warm_to_cold:
    trigger: order fulfillment date > 12 months ago
    actions:
      - rsync from MinIO to /mnt/md1400/mint/archive/{year}/{order_id}/
      - verify md1400 arrival (checksum comparison)
      - retain MinIO copy for 30 days after cold sync (safety buffer)
      - remove MinIO copy after buffer period
    batch_schedule: monthly (first Sunday)

  intake_routing:
    trigger: new asset arrives via operator-drop or web intake
    actions:
      - resolve customer_id and order_id from intake metadata
      - place in hot tier at deterministic path
      - register in artwork table with storage_tier = 'hot'
      - log intake event to $MINT_RUNTIME_ROOT/evidence/intake/
    source_paths:
      - mintfiles:artwork-intake/operator-drop (governed operator upload)
      - web intake API (order-intake service)

# =============================================================================
# ROUTING RULES
# =============================================================================
routing:
  artwork_files:
    on_intake: hot → $MINT_RUNTIME_ROOT/hot/artwork/{order_id}/{artwork_id}/
    on_approve: update artwork.storage_tier, copy to warm registry
    on_archive: copy to cold, update artwork.storage_tier

  mockup_files:
    on_generate: hot → $MINT_RUNTIME_ROOT/hot/mockups/{order_id}/{line_item_id}/
    on_approve: update mockup.storage_tier, copy to warm output
    on_archive: copy to cold, update mockup.storage_tier

  production_files:
    on_handoff: hot → $MINT_RUNTIME_ROOT/hot/production/{order_id}/
    on_fulfill: sync to warm archive
    on_archive: copy to cold archive

  loose_file_policy:
    rule: FORBIDDEN
    enforcement: >
      Any Mint asset that does not resolve to a deterministic path pattern
      defined above is a governance violation. Capabilities must resolve
      the target path BEFORE writing. Files discovered outside governed
      paths must be quarantined to $MINT_RUNTIME_ROOT/quarantine/ and
      flagged via friction.ingest.

# =============================================================================
# MINIO BUCKET MAPPING (existing infrastructure)
# =============================================================================
minio_buckets:
  artwork-intake:
    purpose: inbound artwork from operator or web intake
    lifecycle: transient (processed into hot, then cleared)
    rclone_remote: "mintfiles:artwork-intake"
  artwork-registry:
    purpose: approved artwork library (warm tier)
    lifecycle: warm (12 months, then cold)
    rclone_remote: "mintfiles:artwork-registry"
  artwork-output:
    purpose: approved mockups and production output (warm tier)
    lifecycle: warm (12 months, then cold)
    rclone_remote: "mintfiles:artwork-output"
  client-assets:
    purpose: customer-facing deliverables (proofs, invoices)
    lifecycle: warm (12 months, then cold)
    rclone_remote: "mintfiles:client-assets"

agent_guidance:
  rule: >
    Before writing ANY file for a Mint workflow, resolve the deterministic path
    from this lifecycle contract. Check the order's lifecycle_state to determine
    the correct tier. Never write to an unresolved or ad-hoc path.
  read_first: ops/plugins/domains/mint/storage/mint.storage.lifecycle.yaml
